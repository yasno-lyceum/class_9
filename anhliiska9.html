<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English · Grade 9</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "en9", "name": "English · Grade 9", "short": "English 9", "themes": [{"name": "Unit 1. Perfect for the job (Ідеально для роботи)", "lessons": [{"n": "1", "t": "Unit Opener: jobs and personality", "g": "You will talk about yourself and different jobs and learn key words to describe jobs and personality.", "k": "Unit 1 · Perfect for the job · Unit Opener + Vocabulary for Reading · SB pp.5-6", "terms": [["occupation", "професія, рід занять"], ["personality", "особистість, характер"], ["character trait", "риса характеру"], ["career", "кар'єра"], ["skill", "навичка, уміння"], ["body language", "мова тіла"]], "th": [{"h": "Welcome to Unit 1: Perfect for the job", "p": ["In this unit we talk about work, jobs and the kind of person you are. Every job needs special skills, but it also needs the right personality. A nurse must be caring, a pilot must be calm, and a designer must be creative.", "Think about yourself: what are you good at, and what kind of work could make you happy in the future?"], "ul": ["What job would you like to do in ten years? Why?", "Which is more important for you: a high salary or interesting work?", "Would you prefer to work indoors or outdoors, alone or in a team?", "Which jobs need a lot of patience?", "Is it a good idea to do the same job as your parents?"]}, {"h": "Key vocabulary: jobs", "p": ["Here are some useful job words. Try to say one sentence about each job: what does this person do every day?"], "ul": ["vet — ветеринар (A vet looks after sick animals.)", "firefighter — пожежник", "lawyer — юрист, адвокат", "engineer — інженер", "journalist — журналіст", "pharmacist — фармацевт", "wildlife ranger — охоронець дикої природи (A ranger protects animals in a national park.)", "volunteer — волонтер"]}, {"h": "Key vocabulary: personality adjectives", "p": ["We use these adjectives to describe people. Many of them have opposites with un-, im- or dis-: patient → impatient, reliable → unreliable, honest → dishonest."], "ul": ["reliable — надійний (You can always count on her.)", "patient — терплячий", "confident — впевнений у собі", "hard-working — працьовитий", "sociable — товариський", "creative — творчий", "ambitious — амбітний, честолюбний", "sensible — розсудливий"]}, {"h": "Different cultures, different rules", "p": ["Good behaviour at work is not the same in every country. In some cultures people shake hands firmly and look you in the eye; in others a small bow or less eye contact is more polite. Knowing these differences helps you work with people from all over the world."], "ul": ["Handshake, bow or nod — how do people greet each other in Ukraine?", "Is it polite to call your boss by their first name?", "How close do people stand when they talk?", "Is it OK to be five minutes late for a meeting?"]}], "f": "In Japan, people often greet each other with a bow, and the deeper the bow, the more respect it shows.", "pr": ["Study the Student Resources Unit 1 Wordlist on your own: copy 10 new words with translations into your vocabulary notebook.", "Write 5–6 sentences about yourself: your personality, your skills and a job that you think is perfect for you."], "q": ["Can you name eight jobs in English?", "Which adjectives describe you best? Give an example for each.", "What is the opposite of ‘patient’ and ‘reliable’?", "What is one difference in greetings between two cultures?"], "qz": [{"q": "A person who looks after sick animals is a…", "o": ["pharmacist", "vet", "lawyer", "ranger"], "a": 1, "why": "A vet is an animal doctor."}, {"q": "Someone who always does what they promise is…", "o": ["reliable", "ambitious", "sociable", "creative"], "a": 0, "why": "Reliable means you can trust and depend on this person."}, {"q": "What is the opposite of ‘patient’?", "o": ["unpatient", "dispatient", "nonpatient", "impatient"], "a": 3, "why": "We add the prefix im- to patient: impatient."}, {"q": "Which word means ‘a person who likes meeting and talking to people’?", "o": ["shy", "sensible", "sociable", "confident"], "a": 2, "why": "Sociable people enjoy being with others."}, {"q": "Choose the correct translation of ‘skill’.", "o": ["навичка", "зарплата", "професія", "робоче місце"], "a": 0, "why": "A skill is an ability you learn, навичка."}, {"q": "A person who wants to be very successful and get a top job is…", "o": ["lazy", "ambitious", "patient", "honest"], "a": 1, "why": "Ambitious people have big goals for their career."}, {"q": "Which of these is NOT a personality adjective?", "o": ["creative", "hard-working", "engineer", "confident"], "a": 2, "why": "Engineer is a job, not a quality of character."}]}, {"n": "2", "t": "Reading: The zebras of La Paz (gapped text)", "g": "You will read a text about an unusual job, practise a gapped-text task and discuss jobs that help the community.", "k": "Unit 1 · Perfect for the job · Reading · SB pp.6-7", "terms": [["pedestrian", "пішохід"], ["traffic", "дорожній рух"], ["costume", "костюм"], ["volunteer", "волонтер"], ["community", "громада"], ["gapped text", "текст із пропусками"]], "th": [{"h": "Before you read", "p": ["The text in your book is about young people in La Paz, the main city of Bolivia, who wear zebra costumes and help people cross busy streets. Before you read, look at the title and pictures and guess what the text is about.", "Think: why do people wear costumes in their jobs? Who needs help to cross the road?"], "ul": ["Look at the title, photos and the first line of each paragraph.", "Underline key words you already know.", "Guess the main idea before reading in detail.", "Do not stop at every new word — read for the general meaning first."]}, {"h": "Practice text: A job with stripes", "p": ["Imagine a busy street with hundreds of cars, buses and taxis. Drivers are in a hurry and nobody stops for people on foot. Suddenly a big black-and-white zebra jumps onto the crossing, waves at the cars and smiles. The traffic stops, and an old man crosses the road safely.", "This is not a dream. In La Paz, groups of young people put on zebra costumes and teach drivers and pedestrians to respect road rules. Many of them come from poor families, and the job gives them a small income and a lot of confidence. They need to be patient, brave and friendly, because not every driver is happy to see them. Today the zebras also visit schools and teach children about road safety. For many young people it is the first job they are really proud of."], "ul": ["Main idea: an unusual job that makes the streets safer and helps young people.", "Key personality words: patient, brave, friendly, confident.", "Find in the text: who the zebras help and what they teach."]}, {"h": "Exam tip: gapped text", "p": ["In a gapped-text task, sentences are removed from a text and you must put them back. The missing sentence must fit both the sentence before and the sentence after the gap."], "ul": ["Read the whole text first to understand the main idea.", "Look at words before and after each gap.", "Check pronouns (he, they, this, it) — what do they refer to?", "Look for linking words: but, however, also, because, so.", "Watch for time and number links (first, then, later).", "There is usually one extra sentence you do not need.", "When you finish, read the whole text again to check it makes sense."]}], "f": "The zebra programme in La Paz started in 2001 and became a symbol of the city.", "pr": ["Workbook p. 4: do the reading task and read the Exam Reminder.", "Write 5–6 sentences: Would you like to be a ‘zebra’ in your city? Why or why not? What personality do you need for this job?"], "q": ["What do the zebras of La Paz do?", "Why is this job good for young people?", "What should you check before and after a gap in a gapped-text task?", "Which personality qualities does this job need?"], "qz": [{"q": "What is a pedestrian?", "o": ["a driver of a bus", "a person walking in the street", "a traffic police officer", "a passenger in a taxi"], "a": 1, "why": "A pedestrian is a person on foot."}, {"q": "In the practice text, what is the main aim of the zebras?", "o": ["to sell tickets", "to entertain tourists only", "to make streets safer", "to drive taxis"], "a": 2, "why": "They help people cross and teach road rules."}, {"q": "In a gapped-text task, what should you do first?", "o": ["read the whole text", "fill gap 1 at once", "read only the options", "translate every word"], "a": 0, "why": "Understanding the whole text helps you place the sentences."}, {"q": "A pronoun like ‘they’ after a gap helps you because…", "o": ["it is always wrong", "it shows the end of the text", "it is a new paragraph", "it refers to something in the missing sentence"], "a": 3, "why": "Pronouns connect ideas between sentences."}, {"q": "Which quality is the most important for a ‘zebra’ when angry drivers do not stop?", "o": ["lazy", "patient", "bossy", "rude"], "a": 1, "why": "Patience helps you stay calm in difficult situations."}, {"q": "In a gapped-text task there is usually…", "o": ["one extra sentence", "no options", "a list of words", "only one gap"], "a": 0, "why": "One sentence does not fit any gap."}, {"q": "‘The job gives them a small income.’ Income means…", "o": ["дохід", "витрати", "відпустка", "посада"], "a": 0, "why": "Income is money you receive, дохід."}]}, {"n": "3", "t": "Vocabulary: jobs and personality adjectives", "g": "You will use words for jobs and personality, form opposite adjectives and talk about the right person for a job.", "k": "Unit 1 · Perfect for the job · Vocabulary · SB p.8", "terms": [["prefix", "префікс"], ["suffix", "суфікс"], ["opposite", "протилежність"], ["qualification", "кваліфікація"], ["workplace", "робоче місце"]], "th": [{"h": "Jobs and what people do", "p": ["When we describe a job, we say where people work, what they do and what skills they need. Use the present simple for routines: A chef prepares food in a restaurant."], "ul": ["surgeon — хірург (performs operations)", "architect — архітектор (designs buildings)", "accountant — бухгалтер (works with money and numbers)", "receptionist — адміністратор (answers the phone, meets visitors)", "plumber — сантехнік (repairs pipes)", "electrician — електрик", "mechanic — механік", "paramedic — фельдшер швидкої допомоги"]}, {"h": "Personality: positive and negative", "p": ["Many adjectives form opposites with prefixes. There is no strict rule, so learn them together.", "Some adjectives have a different word as an opposite: generous ↔ mean, hard-working ↔ lazy, confident ↔ shy."], "ul": ["un-: unfriendly, unreliable, unkind, unambitious", "im-: impatient, impolite", "dis-: dishonest, disorganised", "in-: insensitive", "generous — щедрий ↔ mean — скупий", "outgoing — відкритий, товариський ↔ shy — сором'язливий", "bossy — владний, який любить командувати", "stubborn — упертий"]}, {"h": "Word formation and collocations", "p": ["We often make job nouns from verbs with the suffixes -er, -or, -ist and -ian. We also use fixed phrases with ‘job’ and ‘work’."], "ul": ["teach → teacher, act → actor, science → scientist, music → musician", "do a job, have a part-time job, look for a job", "work long hours, work in a team, work from home", "be good at + noun/-ing: She is good at solving problems.", "be interested in: I'm interested in medicine.", "Example: A paramedic needs to be calm and quick-thinking."]}], "f": "", "pr": ["Workbook p. 5, Vocabulary 1.", "Choose three jobs and write two sentences for each: what the person does and what personality they need."], "q": ["What suffixes can we use to make job nouns?", "What is the opposite of ‘honest’, ‘organised’ and ‘generous’?", "What does a plumber do?", "What phrase do we use after ‘good’ to talk about abilities?"], "qz": [{"q": "A person who designs buildings is an…", "o": ["accountant", "electrician", "architect", "receptionist"], "a": 2, "why": "Architects design buildings."}, {"q": "The opposite of ‘organised’ is…", "o": ["unorganised", "disorganised", "imorganised", "inorganised"], "a": 1, "why": "We say disorganised."}, {"q": "Choose the correct job noun from ‘science’.", "o": ["scientist", "sciencer", "sciencian", "sciencor"], "a": 0, "why": "The suffix -ist makes scientist."}, {"q": "Tom never shares anything. He is…", "o": ["generous", "outgoing", "patient", "mean"], "a": 3, "why": "Mean is the opposite of generous."}, {"q": "She is good ___ solving problems.", "o": ["in", "on", "at", "for"], "a": 2, "why": "We say good at + -ing."}, {"q": "Who repairs pipes in your house?", "o": ["a plumber", "a surgeon", "a mechanic", "a lawyer"], "a": 0, "why": "A plumber works with water pipes."}, {"q": "A person who always wants to give orders to others is…", "o": ["shy", "bossy", "sensible", "reliable"], "a": 1, "why": "Bossy people like telling others what to do."}]}, {"n": "4", "t": "Grammar: present simple and present continuous; stative verbs", "g": "You will know when to use the present simple and the present continuous and which verbs are not usually used in continuous forms.", "k": "Unit 1 · Perfect for the job · Grammar · SB p.9", "terms": [["present simple", "теперішній простий час"], ["present continuous", "теперішній тривалий час"], ["stative verbs", "дієслова стану"], ["routine", "розпорядок, звичка"], ["time expression", "обставина часу"], ["temporary", "тимчасовий"]], "th": [{"h": "Present simple", "p": ["Form: I/you/we/they work; he/she/it works. Negative: don't/doesn't + verb. Question: Do/Does + subject + verb?", "Use it for facts, routines, habits, timetables and permanent situations."], "ul": ["My mum works in a hospital. (permanent)", "Vets look after animals. (fact)", "I don't start school at 9 — I start at 8.30.", "Does your brother have a part-time job?", "The bus leaves at 7.15. (timetable)", "Time expressions: always, usually, often, sometimes, never, every day, on Mondays"]}, {"h": "Present continuous", "p": ["Form: am/is/are + verb-ing. Negative: am not / isn't / aren't + -ing. Question: Am/Is/Are + subject + -ing?", "Use it for actions happening now, temporary situations, changing situations and fixed future plans."], "ul": ["I'm doing my homework right now.", "She's working in a café this summer. (temporary)", "More teenagers are learning to code. (change)", "We're meeting the career adviser on Friday. (plan)", "Is he studying for his exam at the moment?", "Time expressions: now, right now, at the moment, today, this week, these days"]}, {"h": "Stative verbs", "p": ["Stative verbs describe states, feelings, thoughts and possession, not actions. We usually do not use them in continuous forms.", "Some verbs can be both: I think it's a good job (opinion) / I'm thinking about my future (action of thinking). I have a dog (possession) / I'm having lunch (action)."], "ul": ["Feelings: like, love, hate, want, prefer, need", "Thinking: know, understand, believe, remember, mean, think (= opinion)", "Senses: see, hear, smell, taste, seem", "Possession: have (= own), belong, own", "Wrong: I'm knowing the answer. Right: I know the answer.", "Wrong: She is wanting a new job. Right: She wants a new job."]}, {"h": "Common mistakes", "p": ["Remember -s in the third person and do not forget the verb ‘be’ in the present continuous."], "ul": ["Wrong: He work in a bank. → He works in a bank.", "Wrong: I working now. → I'm working now.", "Wrong: Do she like her job? → Does she like her job?", "Wrong: I am understanding. → I understand."]}], "f": "", "pr": ["Workbook p. 6, Grammar 1.", "Write 8 sentences about your family: 4 about their usual routines (present simple) and 4 about what they are doing this week (present continuous)."], "q": ["When do we use the present continuous for the future?", "Name five stative verbs.", "What is the difference between ‘I think’ and ‘I'm thinking’?", "Which time expressions go with the present simple?"], "qz": [{"q": "My father ___ in a factory. It's his job.", "o": ["is working", "work", "works", "working"], "a": 2, "why": "A permanent situation, third person: works."}, {"q": "Be quiet! The baby ___.", "o": ["sleeps", "is sleeping", "sleep", "does sleep"], "a": 1, "why": "The action is happening now."}, {"q": "I ___ what you mean.", "o": ["understand", "am understanding", "understanding", "am understand"], "a": 0, "why": "Understand is a stative verb."}, {"q": "This summer Olena ___ at a summer camp.", "o": ["works", "work", "does work", "is working"], "a": 3, "why": "A temporary situation uses the present continuous."}, {"q": "Which sentence is correct?", "o": ["This bag is belonging to me.", "This bag belongs to me.", "This bag belong to me.", "This bag is belong to me."], "a": 1, "why": "Belong is stative and needs -s with ‘this bag’."}, {"q": "___ your sister like her new job?", "o": ["Does", "Is", "Do", "Are"], "a": 0, "why": "Present simple question with he/she uses does."}, {"q": "Which sentence uses ‘have’ as an action?", "o": ["I have two brothers.", "She has a car.", "We're having dinner now.", "They have a big house."], "a": 2, "why": "Having dinner is an action, so the continuous is possible."}, {"q": "Which time expression usually goes with the present continuous?", "o": ["every day", "usually", "on Sundays", "at the moment"], "a": 3, "why": "At the moment shows an action happening now."}]}, {"n": "5", "t": "Listening and Speaking: talking about work and yourself", "g": "You will practise exam listening strategies and answer questions about yourself and your plans with reasons.", "k": "Unit 1 · Perfect for the job · Listening + Speaking · SB pp.10-11", "terms": [["multiple choice", "вибір із кількох варіантів"], ["distractor", "хибний варіант-пастка"], ["to give reasons", "наводити аргументи"], ["interview", "співбесіда, інтерв'ю"], ["work experience", "досвід роботи"]], "th": [{"h": "Listening strategies", "p": ["In multiple-choice listening tasks you hear short recordings and choose the best answer. Speakers often mention all the options, but only one is the correct answer. These wrong options are called distractors."], "ul": ["Read the questions and options before you listen.", "Underline key words in each question.", "Think of synonyms: ‘a job’ may be ‘work’ or ‘a position’.", "Listen for words like but, actually, in the end — the answer often comes after them.", "Choose an answer the first time, check it the second time.", "Never leave an answer empty — guess if you are not sure."]}, {"h": "Useful phrases: talking about yourself", "p": ["In the speaking exam the examiner asks you personal questions. Give full answers with a reason or an example — not just ‘yes’ or ‘no’."], "ul": ["I'm the kind of person who… / I'd describe myself as…", "I'm really into… / I'm quite good at…", "In my free time I usually…", "At the moment I'm learning…", "In the future I'd like to… because…", "For example… / That's why…", "I'm not sure, but I think…"]}, {"h": "Model dialogue", "p": ["Examiner: Tell me about yourself. What do you enjoy doing? Student: Well, I'm quite a creative person, so I love drawing and designing things on my computer. At the moment I'm learning to use a new design app.", "Examiner: What job would you like to do in the future? Student: I'd like to be an architect, because I'm interested in buildings and I'm good at maths. However, I know it takes many years of study, so I'm working hard at school."], "ul": ["Notice the present simple for likes and habits: I love drawing.", "Notice the present continuous for now: I'm learning…", "Linking words: so, because, however.", "Each answer has 2–3 sentences."]}], "f": "", "pr": ["Workbook p. 6, Listening.", "Record yourself (1 minute) answering: Tell me about yourself. What job would you like to do and why? Listen and check your grammar."], "q": ["What is a distractor in a listening task?", "What should you do before the recording starts?", "How can you make your speaking answers longer?", "Which phrases can you use to describe your personality?"], "qz": [{"q": "What should you do BEFORE you listen?", "o": ["close your eyes", "read the questions and options", "write a summary", "answer all questions at random"], "a": 1, "why": "Reading first helps you know what to listen for."}, {"q": "A distractor is…", "o": ["a wrong option that sounds possible", "the correct answer", "a type of speaker", "the title of the task"], "a": 0, "why": "Distractors are mentioned to trick you."}, {"q": "Which answer is best in a speaking exam? Q: Do you like working in a team?", "o": ["Yes.", "No, I don't.", "Team.", "Yes, I do, because I enjoy sharing ideas with others."], "a": 3, "why": "A full answer with a reason shows your English."}, {"q": "The correct answer often comes after the word…", "o": ["hello", "actually", "and", "the"], "a": 1, "why": "‘Actually’ often signals a change or the real information."}, {"q": "Choose the correct sentence.", "o": ["At the moment I learn Spanish.", "I'm loving drawing every day.", "I'm really into photography.", "I am preferring outdoor jobs."], "a": 2, "why": "‘Be into’ means like; the others have tense mistakes."}, {"q": "Which phrase helps you give an example?", "o": ["For example", "In the end", "Goodbye", "By the way"], "a": 0, "why": "For example introduces an example."}, {"q": "If you are not sure of a listening answer, you should…", "o": ["leave it empty", "write two answers", "stop the test", "make a guess"], "a": 3, "why": "An empty answer gets no points; a guess may be right."}]}, {"n": "6", "t": "Vocabulary: employment and life events", "g": "You will use words and phrases about getting a job, working life and important life events.", "k": "Unit 1 · Perfect for the job · Vocabulary · SB p.12", "terms": [["employment", "працевлаштування, зайнятість"], ["employer", "роботодавець"], ["employee", "працівник"], ["salary", "зарплата (місячна/річна)"], ["life event", "життєва подія"], ["to retire", "виходити на пенсію"]], "th": [{"h": "Getting and doing a job", "p": ["Here are common phrases about work. Many of them are collocations — words that usually go together. Learn them as one unit."], "ul": ["apply for a job — подавати заяву на роботу", "fill in an application form — заповнювати анкету", "have an interview — проходити співбесіду", "get / be offered a job — отримати пропозицію роботи", "be employed / unemployed — бути працевлаштованим / безробітним", "earn money — заробляти гроші", "get a promotion — отримати підвищення", "resign / quit — звільнитися за власним бажанням"]}, {"h": "Money and conditions", "p": ["Salary is money paid every month or year; wages are usually paid every week or for each hour. A full-time job is about 40 hours a week; a part-time job is fewer hours."], "ul": ["salary — оклад, зарплата", "wages — заробітна плата (погодинна, тижнева)", "full-time / part-time — повна / неповна зайнятість", "overtime — понаднормова робота", "be fired / sacked — бути звільненим (через провину)", "be made redundant — бути скороченим", "Example: She works part-time and earns a small wage."]}, {"h": "Life events", "p": ["We also talk about important moments in a person's life. Put these events in a typical order and talk about your family: When did your grandparents get married? When did your parents start work?"], "ul": ["be born — народитися", "start school — піти до школи", "graduate from university — закінчити університет", "leave home — покинути батьківський дім", "get married — одружитися", "have children — мати дітей", "retire — вийти на пенсію", "Note: employer (the boss / company) vs employee (the worker); -er = the one who gives, -ee = the one who receives."]}], "f": "", "pr": ["Workbook p. 7, Vocabulary 2.", "Interview an adult in your family about their working life (first job, interview, promotion) and write 6 sentences using new phrases."], "q": ["What is the difference between ‘salary’ and ‘wages’?", "Who is the employer and who is the employee?", "What is the difference between ‘resign’ and ‘be fired’?", "Name five life events in English."], "qz": [{"q": "You want a job. First you ___ for it.", "o": ["apply", "retire", "earn", "promote"], "a": 0, "why": "We apply for a job."}, {"q": "A person who works for a company is an…", "o": ["employer", "employee", "employment", "unemployed"], "a": 1, "why": "The suffix -ee shows the person who is employed."}, {"q": "My grandad is 65 and he doesn't work any more. He has…", "o": ["resigned", "graduated", "retired", "applied"], "a": 2, "why": "Retire means stop working because of age."}, {"q": "She worked hard and got a ___. Now she is the manager.", "o": ["wage", "overtime", "interview", "promotion"], "a": 3, "why": "A promotion is a move to a higher position."}, {"q": "A job of about 20 hours a week is…", "o": ["part-time", "full-time", "overtime", "unemployed"], "a": 0, "why": "Part-time means fewer hours than full-time."}, {"q": "He was always late, so his boss ___ him.", "o": ["retired", "fired", "graduated", "applied"], "a": 1, "why": "Fire means to make someone leave their job because of a problem."}, {"q": "‘Graduate from university’ means…", "o": ["вступити до університету", "викладати в університеті", "закінчити університет", "покинути роботу"], "a": 2, "why": "Graduate means finish your studies successfully."}]}, {"n": "7", "t": "Grammar: countable and uncountable nouns; quantifiers", "g": "You will recognise countable and uncountable nouns and use quantifiers like some, any, much, many, a lot of, few and little correctly.", "k": "Unit 1 · Perfect for the job · Grammar · SB p.13", "terms": [["countable noun", "злічуваний іменник"], ["uncountable noun", "незлічуваний іменник"], ["quantifier", "кількісний займенник, квантифікатор"], ["plural", "множина"], ["singular", "однина"]], "th": [{"h": "Countable and uncountable nouns", "p": ["Countable nouns have singular and plural forms: a job – two jobs. Uncountable nouns have no plural and no a/an: information, advice, money.", "Some nouns are uncountable in English but countable in Ukrainian, so be careful!"], "ul": ["Countable: job, colleague, office, interview, skill", "Uncountable: work, advice, information, money, news, homework, equipment, experience (= досвід)", "Wrong: an advice / advices → Right: some advice / a piece of advice", "News is singular: The news is good.", "work (uncountable) vs a job (countable): I'm looking for work / a job.", "experience: I have some experience (досвід) / I had an amazing experience (враження, подія)"]}, {"h": "Quantifiers", "p": ["Quantifiers show how much or how many. Some go only with countable nouns, some only with uncountable nouns, and some with both."], "ul": ["many / a few / few + countable: many jobs, a few colleagues", "much / a little / little + uncountable: much money, a little advice", "a lot of / lots of / some / any / no + both", "some — in positive sentences and offers: Would you like some help?", "any — in questions and negatives: Have you got any experience?", "How many skills…? / How much time…?", "much is used mainly in questions and negatives; in positive sentences use a lot of."]}, {"h": "Few or a few? Little or a little?", "p": ["With ‘a’, the meaning is positive (some, enough). Without ‘a’, the meaning is negative (not enough, almost none)."], "ul": ["I have a few friends at work. (some — good!)", "Few people applied for the job. (almost nobody — bad)", "She has a little free time today. (some)", "There's little hope of getting the job. (almost none)", "Common mistake: I have many homework. → I have a lot of homework.", "Common mistake: How much people work here? → How many people…?"]}], "f": "", "pr": ["Workbook p. 8, Grammar 2.", "Write a short description (6–8 sentences) of your school or a workplace using at least six different quantifiers."], "q": ["Why can't we say ‘an advice’?", "Which quantifiers go only with countable nouns?", "What is the difference between ‘few’ and ‘a few’?", "When do we use ‘some’ in questions?"], "qz": [{"q": "Can you give me ___ advice?", "o": ["an", "some", "many", "a few"], "a": 1, "why": "Advice is uncountable, so we use some."}, {"q": "How ___ people work in your office?", "o": ["many", "much", "little", "any"], "a": 0, "why": "People is countable plural."}, {"q": "Which noun is uncountable?", "o": ["job", "colleague", "information", "skill"], "a": 2, "why": "Information has no plural in English."}, {"q": "I'm sad because I have ___ friends here — almost none.", "o": ["a few", "a lot of", "many", "few"], "a": 3, "why": "Few without ‘a’ has a negative meaning."}, {"q": "The news ___ very exciting today.", "o": ["are", "were", "is", "be"], "a": 2, "why": "News is uncountable and takes a singular verb."}, {"q": "We haven't got ___ milk left.", "o": ["any", "many", "a few", "some"], "a": 0, "why": "Any is used in negative sentences."}, {"q": "Which sentence is correct?", "o": ["I have many homework.", "I have a lot of homework.", "I have a homework.", "I have homeworks."], "a": 1, "why": "Homework is uncountable; a lot of works with it."}, {"q": "Don't worry, there's ___ time left. We can finish.", "o": ["few", "many", "a little", "a few"], "a": 2, "why": "Time is uncountable; ‘a little’ means some, enough."}]}, {"n": "8", "t": "Writing: an informal email", "g": "You will plan and write an informal email using the right structure and friendly fixed expressions.", "k": "Unit 1 · Perfect for the job · Writing · SB pp.14-15", "terms": [["informal email", "неофіційний електронний лист"], ["greeting", "привітання"], ["closing phrase", "завершальна фраза"], ["fixed expression", "стала фраза, вислів"], ["paragraph", "абзац"]], "th": [{"h": "Structure of an informal email", "p": ["An informal email is written to a friend or family member. It is friendly, but it must still be organised in paragraphs and answer every question or point in the task.", "In the exam, read the task carefully and underline all the points you must include — usually three or four."], "ul": ["Greeting: Hi Max, / Dear Anna,", "Paragraph 1: thank your friend / say why you are writing", "Paragraph 2–3: answer the questions, give news, plans, details", "Final paragraph: ask a question or suggest something", "Closing: Write soon! / See you soon! / Take care,", "Your name", "Length: usually 100–120 words for B1 exams"]}, {"h": "Useful language", "p": ["Informal emails use contractions (I'm, don't), phrasal verbs and friendly fixed expressions."], "ul": ["Thanks for your email. It was great to hear from you!", "Sorry I haven't written for ages.", "Guess what? / You won't believe it, but…", "Anyway, … / By the way, …", "Why don't we…? / How about…?", "I can't wait to see you!", "Give my love to your family.", "Let me know what you think."]}, {"h": "Model email (original)", "p": ["Hi Sam, Thanks for your email — it was great to hear about your new part-time job! You asked about my summer plans. Guess what? I'm going to a volunteer camp in the Carpathians in July. We're helping to clean the forest paths and look after a small nature park. By the way, they need more volunteers. Why don't you come too? It'll be fun, and you'll get some real work experience. Let me know what you think. Write soon! Oleh"], "ul": ["Friendly greeting and thanks", "Answers the friend's question", "Gives news and details (present continuous for plans)", "Makes a suggestion", "Friendly ending and name"]}, {"h": "Checklist", "p": ["Before you finish, check your email with this list."], "ul": ["Did I answer all the points in the task?", "Did I use paragraphs?", "Is the style friendly and informal?", "Did I check tenses, spelling and punctuation?", "Is the length right?"]}], "f": "", "pr": ["Workbook p. 9, Writing, and read the Writing Reference for informal emails.", "Write an email (100–120 words) to a friend: tell them about a summer job or trip you are planning and invite them to join you."], "q": ["How many parts does an informal email have?", "Name three fixed expressions to begin an email.", "How can you end an informal email?", "Why is it important to underline the points in the task?"], "qz": [{"q": "Which is a good opening line for an informal email?", "o": ["Dear Sir or Madam,", "Thanks for your email!", "I am writing to complain.", "Yours faithfully,"], "a": 1, "why": "It is friendly and informal."}, {"q": "Which closing is informal?", "o": ["Yours sincerely,", "Best regards from the company,", "Take care,", "Yours faithfully,"], "a": 2, "why": "Take care is a friendly ending."}, {"q": "In informal emails we often use…", "o": ["contractions like I'm, don't", "only long formal words", "no paragraphs", "passive voice in every sentence"], "a": 0, "why": "Contractions make the style friendly."}, {"q": "‘By the way’ is used to…", "o": ["finish the email", "greet a friend", "say sorry", "add a new topic"], "a": 3, "why": "It introduces something new in a conversation."}, {"q": "Which phrase makes a suggestion?", "o": ["Why don't we meet on Saturday?", "Sorry I haven't written.", "Guess what?", "Give my love to your mum."], "a": 0, "why": "Why don't we… is a suggestion."}, {"q": "What should you do first in the exam writing task?", "o": ["start writing at once", "count the words", "underline the points you must include", "write the ending"], "a": 2, "why": "Then you will not forget any point."}, {"q": "‘Sorry I haven't written for ages’ means…", "o": ["I write every day.", "I haven't written for a long time.", "I'm very old.", "I'm writing a long email."], "a": 1, "why": "For ages means for a very long time."}]}, {"n": "9", "t": "Live well, study well: teamwork and self-belief", "g": "You will talk about working in a team, believing in yourself and understand an infographic on this topic.", "k": "Unit 1 · Perfect for the job · Live well, study well · SB p.16", "terms": [["teamwork", "командна робота"], ["self-belief", "віра в себе"], ["to cooperate", "співпрацювати"], ["strength", "сильна сторона"], ["weakness", "слабка сторона"], ["infographic", "інфографіка"]], "th": [{"h": "Why teamwork matters", "p": ["Almost every job today needs teamwork. Doctors, engineers and game designers all work with other people. A good team member listens, shares ideas, does their part and helps others.", "At school, group projects teach the same skills: planning together, sharing tasks and solving problems."], "ul": ["listen to others and respect different opinions", "share tasks fairly", "keep your promises and meet deadlines", "give helpful feedback, not criticism", "ask for help when you need it", "celebrate success together"]}, {"h": "Believe in yourself", "p": ["Self-belief means trusting that you can learn and improve. People with self-belief are not afraid of mistakes — they see mistakes as a way to learn. You can build confidence step by step."], "ul": ["Know your strengths and write them down.", "Set small, realistic goals.", "Say ‘I can't do it yet’ instead of ‘I can't do it’.", "Learn from mistakes; don't give up.", "Compare yourself with yourself last month, not with others.", "Useful language: I'm good at… / I need to work on… / We could… / Let's divide the tasks."]}, {"h": "Understanding an infographic", "p": ["An infographic shows information with pictures, numbers and short texts. Read the title first, then look at the biggest numbers and images. Ask yourself: what is the main message?"], "ul": ["Read the title and headings.", "Look at numbers, percentages and charts.", "Find the main message in one sentence.", "Discuss: Which tip is the most useful for you?", "Project idea: make a poster ‘How to be a great team member’.", "Project idea: create an infographic about your class's strengths."]}], "f": "", "pr": ["Project of your choice: make a poster or an infographic ‘Teamwork tips’ or ‘How to believe in yourself’ (in English, 6–8 tips).", "Write 5 sentences about your strengths and one thing you need to work on."], "q": ["What makes a good team member?", "What does ‘self-belief’ mean?", "How can you read an infographic quickly?", "What can you say instead of ‘I can't do it’?"], "qz": [{"q": "‘Self-belief’ means…", "o": ["trust in your own abilities", "fear of mistakes", "working alone", "being bossy"], "a": 0, "why": "Self-belief is confidence in yourself."}, {"q": "A good team member…", "o": ["does everything alone", "listens to others", "never shares ideas", "ignores deadlines"], "a": 1, "why": "Listening is a key teamwork skill."}, {"q": "What should you read first in an infographic?", "o": ["the smallest text", "the last number", "the title", "nothing — just look at colours"], "a": 2, "why": "The title tells you the topic."}, {"q": "Which phrase helps to share work in a team?", "o": ["Go away.", "I don't care.", "It's not my problem.", "Let's divide the tasks."], "a": 3, "why": "It suggests sharing the work."}, {"q": "‘Cooperate’ means…", "o": ["compete", "work together", "argue", "give up"], "a": 1, "why": "Cooperate = work together with others."}, {"q": "Which is a helpful way to think about mistakes?", "o": ["Mistakes help me learn.", "Mistakes mean I'm stupid.", "I must never try again.", "Only others make mistakes."], "a": 0, "why": "A positive mindset sees mistakes as learning."}]}, {"n": "10", "t": "End-of-Unit 1 Revision", "g": "You will review the vocabulary and grammar of Unit 1 and check what you know.", "k": "Unit 1 · Perfect for the job · End-of-Unit Revision", "terms": [["revision", "повторення"], ["stative verbs", "дієслова стану"], ["quantifier", "квантифікатор"], ["apply for", "подавати заяву на"], ["reliable", "надійний"]], "th": [{"h": "Vocabulary review", "p": ["Unit 1 was about jobs, personality and working life. Check that you can use these words in your own sentences."], "ul": ["Jobs: vet, architect, surgeon, plumber, paramedic, journalist", "Personality: reliable, patient, ambitious, sociable, bossy, stubborn", "Opposites: impatient, dishonest, disorganised, unreliable", "Job nouns: teacher, actor, scientist, musician", "Employment: apply for a job, have an interview, get a promotion, retire, resign", "salary vs wages; employer vs employee; full-time vs part-time"]}, {"h": "Grammar review", "p": ["Present simple for facts and routines, present continuous for now and temporary situations. Stative verbs are usually not in the continuous. Countable and uncountable nouns go with different quantifiers."], "ul": ["She works in a hospital, but this week she's working from home.", "I know the answer. (not: I'm knowing)", "I think it's a great job. / I'm thinking about my career.", "How many jobs? / How much money?", "a few colleagues / a little advice", "Have you got any experience? — Yes, I've got some."]}, {"h": "Writing and skills review", "p": ["You also practised a gapped-text reading task, multiple-choice listening, talking about yourself and writing an informal email."], "ul": ["Gapped text: check words before and after each gap.", "Listening: read questions first, watch for distractors.", "Speaking: give answers with reasons and examples.", "Email: greeting, paragraphs, all points answered, friendly ending."]}], "f": "", "pr": ["Workbook p. 76, Review Unit 1.", "Make a mind map of Unit 1 vocabulary (jobs, personality, employment, life events) with at least 30 words."], "q": ["When do we use the present continuous with ‘think’?", "Which quantifiers go with uncountable nouns?", "What is the difference between an employer and an employee?", "What are the parts of an informal email?"], "qz": [{"q": "Mia ___ a new language this year.", "o": ["learns", "is learning", "learn", "does learn"], "a": 1, "why": "A temporary situation: present continuous."}, {"q": "This phone ___ to my brother.", "o": ["is belonging", "belong", "belongs", "belonging"], "a": 2, "why": "Belong is stative."}, {"q": "There isn't ___ information about the job.", "o": ["much", "many", "a few", "few"], "a": 0, "why": "Information is uncountable; use much in negatives."}, {"q": "The opposite of ‘honest’ is…", "o": ["unhonest", "imhonest", "inhonest", "dishonest"], "a": 3, "why": "We say dishonest."}, {"q": "She worked for 40 years and then ___.", "o": ["applied", "graduated", "retired", "hired"], "a": 2, "why": "Retire = stop working at the end of a career."}, {"q": "Which person is the most likely to need to be calm in emergencies?", "o": ["a paramedic", "an accountant", "a receptionist", "a musician"], "a": 0, "why": "Paramedics help people in emergencies."}, {"q": "Which is correct?", "o": ["Can you give me an advice?", "Can you give me a piece of advice?", "Can you give me advices?", "Can you give me many advice?"], "a": 1, "why": "Advice is uncountable; ‘a piece of advice’ is correct."}, {"q": "Which ending suits an informal email?", "o": ["Yours faithfully,", "Respectfully,", "Dear Sir,", "See you soon!"], "a": 3, "why": "It is friendly and informal."}]}]}, {"name": "Unit 2. Delicious! (Смачно!)", "lessons": [{"n": "11", "t": "Unit Opener: tastes and cooking", "g": "You will talk about food you like, describe tastes and learn key words about cooking.", "k": "Unit 2 · Delicious! · Unit Opener + Vocabulary for Reading · SB pp.17-18", "terms": [["taste", "смак; куштувати"], ["flavour", "смак, аромат"], ["dish", "страва"], ["recipe", "рецепт"], ["ingredient", "інгредієнт"], ["healthy", "здоровий, корисний"]], "th": [{"h": "Welcome to Unit 2: Delicious!", "p": ["This unit is all about food: what we eat, how we cook it and why food is an important part of every culture. Food can be healthy or unhealthy, simple or special, and the way we cook it changes its taste and its value for our body."], "ul": ["What is your favourite dish? Who cooks it?", "Do you like trying new food?", "What did you have for breakfast this morning?", "Which traditional Ukrainian dish would you recommend to a foreign friend?", "Is fast food always unhealthy?"]}, {"h": "Describing taste", "p": ["We use these adjectives to describe how food tastes. You can make them stronger with ‘very’, ‘really’ or ‘a bit’: This soup is a bit salty."], "ul": ["sweet — солодкий (honey, cake)", "salty — солоний (crisps)", "sour — кислий (lemon)", "bitter — гіркий (dark chocolate, coffee)", "spicy / hot — гострий (chilli)", "bland — прісний, без смаку", "delicious / tasty — смачний", "disgusting — огидний"]}, {"h": "Cooking methods and safety", "p": ["Different ways of cooking change food. Steaming and boiling usually keep food healthier than frying in a lot of oil. Remember kitchen safety: wash your hands, use separate boards for raw meat and vegetables, and be careful with hot oil and sharp knives."], "ul": ["boil — варити (у воді)", "fry — смажити", "bake — пекти (хліб, пироги)", "roast — запікати (м'ясо, овочі)", "grill — готувати на грилі", "steam — готувати на пару", "Example: I usually steam vegetables because it keeps the vitamins."]}], "f": "Scientists traditionally list five basic tastes: sweet, salty, sour, bitter and umami — a savoury taste found in foods like mushrooms and cheese.", "pr": ["Study the Student Resources Unit 2 Wordlist on your own: copy 10 new words with translations.", "Describe your favourite dish in 5–6 sentences: its ingredients, its taste and how it is cooked."], "q": ["Name six adjectives to describe taste.", "What is the difference between ‘bake’ and ‘fry’?", "Which cooking methods are the healthiest? Why?", "What are two rules of kitchen safety?"], "qz": [{"q": "A lemon tastes…", "o": ["sweet", "sour", "salty", "bland"], "a": 1, "why": "Lemons are sour."}, {"q": "We ___ bread and cakes in an oven.", "o": ["bake", "boil", "steam", "fry"], "a": 0, "why": "Bread and cakes are baked."}, {"q": "Food with no strong taste is…", "o": ["spicy", "bitter", "bland", "tasty"], "a": 2, "why": "Bland means without much flavour."}, {"q": "Which cooking method uses hot water vapour?", "o": ["grilling", "frying", "roasting", "steaming"], "a": 3, "why": "Steaming cooks food over boiling water."}, {"q": "‘Ingredient’ means…", "o": ["страва", "рецепт", "інгредієнт, складник", "посуд"], "a": 2, "why": "An ingredient is one part of a recipe."}, {"q": "Chilli peppers are…", "o": ["sour", "spicy", "sweet", "bland"], "a": 1, "why": "Chilli is hot and spicy."}, {"q": "Which is a good kitchen safety rule?", "o": ["Use one board for raw meat and salad.", "Leave hot oil alone on the cooker.", "Wash your hands before cooking.", "Cut food towards your fingers."], "a": 2, "why": "Clean hands stop germs."}]}, {"n": "12", "t": "Reading: favourite food and eating habits (reading for detail)", "g": "You will read short texts about food, find specific details and discuss how habits affect health.", "k": "Unit 2 · Delicious! · Reading · SB pp.18-19", "terms": [["eating habits", "харчові звички"], ["detail", "деталь"], ["to scan", "переглядати текст для пошуку інформації"], ["paraphrase", "перефразування"], ["balanced diet", "збалансоване харчування"]], "th": [{"h": "Before you read", "p": ["In this lesson you read texts in which people talk about food. In the exam you often have to find specific details: who says what, who does something, or which text mentions something. You do not need to understand every word."], "ul": ["Read the questions first and underline key words.", "Scan the texts for names, numbers and key ideas.", "Remember: the text usually uses different words (paraphrase).", "Read the part with the answer carefully.", "Check that the whole question matches, not only one word."]}, {"h": "Practice texts: What's on your plate?", "p": ["Ira, 15: I used to eat crisps every day, but last year our school started a cooking club. Now I make my own snacks — usually fruit with yoghurt or homemade granola. I feel more energetic in the afternoon.", "Daniel, 14: My family loves trying food from other countries. On Fridays we choose a country and cook one dish from it together. Last week we were making Japanese rice balls, and the kitchen was a total mess! Marko, 15: I'm a football player, so I need a lot of energy. My coach told me to drink more water and eat more vegetables. I still love pizza, but I eat it only at weekends."], "ul": ["Who cooks with his family? (Daniel)", "Who changed a habit because of school? (Ira)", "Who got advice from an adult? (Marko)", "Who mentions feeling better? (Ira — ‘more energetic’ = feels better)", "Notice the paraphrase: ‘eats it only at weekends’ = ‘doesn't eat it every day’."]}, {"h": "Exam tip and discussion", "p": ["In multiple-matching tasks, questions and texts rarely use the same words. Look for the same meaning. Be careful: a text may mention the same topic but say something different."], "ul": ["Look for synonyms: snack = small meal; energetic = full of energy.", "Do not choose a text just because it has the same word.", "If two texts seem possible, read both parts again.", "Discuss: How do your eating habits affect your energy and mood?", "Discuss: Should schools teach cooking?", "Useful language: In my opinion… / I think it's important to… / I agree that…"]}], "f": "", "pr": ["Workbook p. 10, reading task, and read the Exam Reminder.", "Write a short paragraph (60–80 words) like the practice texts about your own eating habits."], "q": ["What does ‘scan’ a text mean?", "Why do exam texts use paraphrases?", "Which of the three teenagers is most similar to you?", "What is one healthy habit you would like to start?"], "qz": [{"q": "In the practice texts, who cooks food from other countries?", "o": ["Ira", "Marko", "Daniel", "Nobody"], "a": 2, "why": "Daniel's family chooses a country every Friday."}, {"q": "Who got advice from a coach?", "o": ["Marko", "Daniel", "Ira", "All of them"], "a": 0, "why": "Marko's coach told him to drink more water."}, {"q": "‘Scan the text’ means…", "o": ["read every word slowly", "translate the text", "look quickly for specific information", "write a summary"], "a": 2, "why": "Scanning is searching quickly for details."}, {"q": "‘I feel more energetic’ is a paraphrase of…", "o": ["I feel tired.", "I have more energy.", "I'm hungry.", "I eat more."], "a": 1, "why": "Energetic means full of energy."}, {"q": "Why should you not choose an answer only because it has the same word as the question?", "o": ["Because the words are always wrong.", "Because texts never repeat words.", "Because it takes too long.", "Because the meaning may be different."], "a": 3, "why": "The same word can be a trap."}, {"q": "A balanced diet includes…", "o": ["only meat", "different kinds of food in the right amounts", "only sweets at weekends", "no water"], "a": 1, "why": "Balanced means a healthy mix."}, {"q": "Ira's habit changed because…", "o": ["her school started a cooking club", "her coach told her", "her parents cook every day", "she moved to Japan"], "a": 0, "why": "The cooking club helped her make her own snacks."}]}, {"n": "13", "t": "Vocabulary: food, tastes and cooking", "g": "You will describe food with precise adjectives, use cooking verbs and collocations, and talk about healthy habits.", "k": "Unit 2 · Delicious! · Vocabulary · SB p.20", "terms": [["texture", "текстура"], ["raw", "сирий"], ["ripe", "стиглий"], ["fresh", "свіжий"], ["stale", "черствий"], ["to chop", "нарізати"]], "th": [{"h": "Adjectives for food", "p": ["Besides taste, we can describe texture, freshness and how food is cooked. Use the right adjective with the right food: stale bread, ripe fruit, raw fish, sour milk."], "ul": ["crispy / crunchy — хрусткий (crisps, apples)", "juicy — соковитий (orange, steak)", "creamy — кремовий, ніжний", "tender — м'який, ніжний (meat)", "raw — сирий, не приготований", "ripe — стиглий", "fresh — свіжий ↔ stale — черствий (bread)", "rotten — гнилий"]}, {"h": "Preparing food", "p": ["These verbs describe what we do with food before or during cooking. They are useful when you explain a recipe. Use the imperative: Chop the onion. Add some salt."], "ul": ["chop — дрібно нарізати", "slice — нарізати скибочками", "peel — чистити від шкірки", "grate — терти на тертці", "mix / stir — змішувати / помішувати", "add — додавати", "heat — нагрівати", "serve — подавати на стіл"]}, {"h": "Collocations and phrases", "p": ["Learn food words in phrases. They make your speaking and writing more natural."], "ul": ["have a snack / a meal / a balanced diet", "go on a diet / be on a diet", "a sweet tooth — любов до солодкого (I've got a sweet tooth.)", "home-made food vs ready meals", "skip breakfast — пропускати сніданок", "eat out — їсти поза домом", "takeaway — їжа на виніс", "Example: Peel and grate two carrots, then mix them with yoghurt."]}], "f": "", "pr": ["Workbook p. 11, Vocabulary 1.", "Write a simple recipe for your favourite salad or snack (6–8 steps) using at least six cooking verbs."], "q": ["What is the difference between ‘chop’ and ‘slice’?", "Which adjective describes old, dry bread?", "What does ‘I have a sweet tooth’ mean?", "Name three adjectives to describe texture."], "qz": [{"q": "This bread is three days old. It's…", "o": ["juicy", "ripe", "stale", "tender"], "a": 2, "why": "Old dry bread is stale."}, {"q": "Sushi often contains ___ fish.", "o": ["raw", "stale", "rotten", "crunchy"], "a": 0, "why": "Raw means not cooked."}, {"q": "You ___ cheese with a grater.", "o": ["peel", "grate", "stir", "boil"], "a": 1, "why": "Grate means rub on a grater."}, {"q": "This banana is yellow and soft — it's…", "o": ["raw", "stale", "bitter", "ripe"], "a": 3, "why": "Ripe fruit is ready to eat."}, {"q": "‘I skip breakfast’ means…", "o": ["I eat a big breakfast.", "I don't eat breakfast.", "I cook breakfast.", "I eat breakfast quickly."], "a": 1, "why": "Skip = miss, not do."}, {"q": "An apple that makes a noise when you bite it is…", "o": ["creamy", "tender", "crunchy", "juicy only"], "a": 2, "why": "Crunchy food makes a sound when you bite it."}, {"q": "Which sentence is correct?", "o": ["I have a sweet tooth.", "I have a sweet teeth.", "I am sweet tooth.", "I have sweet tooths."], "a": 0, "why": "‘Have a sweet tooth’ is a fixed phrase."}, {"q": "‘Peel’ means…", "o": ["нарізати", "чистити від шкірки", "змішувати", "нагрівати"], "a": 1, "why": "You peel potatoes or oranges."}]}, {"n": "14", "t": "Grammar: past simple and past continuous", "g": "You will form and use the past simple and the past continuous to tell stories about the past.", "k": "Unit 2 · Delicious! · Grammar · SB p.21", "terms": [["past simple", "минулий простий час"], ["past continuous", "минулий тривалий час"], ["regular verb", "правильне дієслово"], ["irregular verb", "неправильне дієслово"], ["interrupted action", "перервана дія"], ["background", "тло, фон"]], "th": [{"h": "Past simple", "p": ["Form: regular verbs + -ed (cook → cooked); irregular verbs have special forms (eat → ate, make → made). Negative: didn't + verb. Question: Did + subject + verb?", "Use it for finished actions at a specific time in the past and for a sequence of actions."], "ul": ["We cooked pancakes yesterday.", "I ate sushi for the first time last year.", "She didn't like the soup.", "Did you go to the café on Saturday?", "He opened the fridge, took out the milk and made a milkshake. (sequence)", "Time expressions: yesterday, last week, two days ago, in 2020, when I was ten"]}, {"h": "Past continuous", "p": ["Form: was/were + verb-ing. Negative: wasn't/weren't + -ing. Question: Was/Were + subject + -ing?", "Use it for an action in progress at a specific moment in the past, for background description in stories, and for two long actions at the same time."], "ul": ["At 7 pm I was making dinner.", "The sun was shining and people were eating outside. (background)", "While Mum was cooking, Dad was setting the table. (two actions)", "Were you watching the cooking show last night?", "They weren't listening to the chef.", "Stative verbs are not used here either: I knew (not: I was knowing) the recipe."]}, {"h": "Past simple + past continuous together", "p": ["A long action (past continuous) is often interrupted by a short action (past simple). Use ‘when’ before the short action and ‘while’ before the long action."], "ul": ["I was cutting the onions when I cut my finger.", "While we were having lunch, the lights went out.", "When the guests arrived, we were still cooking.", "Compare: When he came, I made tea. (first he came, then I made tea) / When he came, I was making tea. (I started before he came)", "Common mistake: While I cooked, the phone was ringing. → While I was cooking, the phone rang."]}], "f": "", "pr": ["Workbook p. 12, Grammar 1.", "Write a short story (80–100 words) about a kitchen disaster, real or imagined, using both the past simple and the past continuous."], "q": ["How do we form the past continuous?", "What is the difference between ‘when’ and ‘while’?", "Give the past forms of eat, make, buy and drink.", "When do we use the past continuous in stories?"], "qz": [{"q": "I ___ a cake when the phone rang.", "o": ["baked", "was baking", "bake", "were baking"], "a": 1, "why": "A long action interrupted by a short one."}, {"q": "We ___ pizza last Friday.", "o": ["ate", "were eating", "eat", "eaten"], "a": 0, "why": "A finished action at a specific time: past simple."}, {"q": "While they ___ dinner, it started to rain.", "o": ["had", "have", "was having", "were having"], "a": 3, "why": "While + past continuous; ‘they’ takes were."}, {"q": "___ you like the restaurant yesterday?", "o": ["Were", "Did", "Was", "Do"], "a": 1, "why": "Past simple question with Did."}, {"q": "Which sentence is correct?", "o": ["I was knowing the recipe.", "I knowed the recipe.", "I knew the recipe.", "I was know the recipe."], "a": 2, "why": "Know is stative and irregular: knew."}, {"q": "At 8 o'clock last night, my sister ___ a cooking show.", "o": ["watched", "is watching", "watches", "was watching"], "a": 3, "why": "An action in progress at a specific past moment."}, {"q": "The past simple of ‘buy’ is…", "o": ["bought", "buyed", "brought", "buys"], "a": 0, "why": "Buy is irregular: bought."}, {"q": "When the guests arrived, we ___ the table. (We started before they came.)", "o": ["set", "were setting", "sets", "are setting"], "a": 1, "why": "The action was already in progress."}]}, {"n": "15", "t": "Listening and Speaking: food habits and opinions", "g": "You will practise listening for specific information and discuss food habits, giving and supporting your opinions.", "k": "Unit 2 · Delicious! · Listening + Speaking · SB pp.22-23", "terms": [["opinion", "думка"], ["to agree", "погоджуватися"], ["to disagree", "не погоджуватися"], ["specific information", "конкретна інформація"], ["habit", "звичка"]], "th": [{"h": "Listening for specific information", "p": ["In many exam tasks you must complete notes or choose answers about specific information: numbers, days, names, foods, places. Predict what kind of word you need before you listen."], "ul": ["Read the notes and decide: is the missing word a number, a name, a noun?", "Listen for key words and their synonyms.", "Be careful with numbers: fifteen / fifty, 13 / 30.", "Speakers may correct themselves: ‘on Monday — no, sorry, on Tuesday’.", "Check spelling of words you write.", "Use the second listening to check."]}, {"h": "Useful phrases for discussion", "p": ["In speaking tasks you often discuss a question with a partner. Give your opinion, explain it, and react to what your partner says."], "ul": ["Giving opinions: I think… / In my opinion… / Personally, I believe…", "Agreeing: I agree with you. / That's a good point. / Exactly!", "Disagreeing politely: I'm not sure about that. / I see what you mean, but…", "Asking your partner: What do you think? / Do you agree?", "Giving reasons: because… / The main reason is…", "Talking about the past: When I was younger, I ate… / Last week I tried…"]}, {"h": "Model dialogue", "p": ["A: Do you think teenagers eat too much fast food? B: Personally, I think some do, because it's cheap and quick. Last week I had burgers twice! What do you think? A: I see what you mean, but many of my friends are trying to eat more healthily. For example, my best friend started cooking at home. B: That's a good point. Maybe schools should teach students how to make quick, healthy meals. A: Exactly! I agree with you."], "ul": ["Both speakers give opinions and reasons.", "They use examples from their own life (past simple).", "They ask each other questions.", "They agree and disagree politely."]}], "f": "", "pr": ["Workbook p. 12, Listening.", "Record a 1-minute answer to the question: How have your eating habits changed since you were a child? Use at least three opinion phrases."], "q": ["What should you predict before listening to complete notes?", "How can you disagree politely?", "Why are numbers difficult in listening?", "Which phrases can you use to ask for your partner's opinion?"], "qz": [{"q": "Which phrase is polite disagreement?", "o": ["You're wrong.", "I see what you mean, but…", "That's stupid.", "No way, never."], "a": 1, "why": "It shows respect before disagreeing."}, {"q": "Before listening, it's useful to…", "o": ["predict the type of missing word", "write random answers", "close the book", "translate the instructions"], "a": 0, "why": "Predicting helps you listen for the right information."}, {"q": "Which pair of numbers is often confused?", "o": ["one and seven", "two and nine", "fifteen and fifty", "four and eight"], "a": 2, "why": "-teen and -ty sound similar."}, {"q": "‘That's a good point’ is used to…", "o": ["disagree", "change the topic", "finish a talk", "agree"], "a": 3, "why": "It shows you agree with your partner's idea."}, {"q": "Which question invites your partner to speak?", "o": ["What do you think?", "Is it raining?", "Where's the toilet?", "How old are you?"], "a": 0, "why": "It asks for their opinion."}, {"q": "A speaker says: ‘The class is on Monday — sorry, I mean Thursday.’ The answer is…", "o": ["Monday", "Thursday", "both", "neither"], "a": 1, "why": "The speaker corrected himself."}, {"q": "Choose the correct sentence.", "o": ["When I was younger, I eat sweets every day.", "When I was younger, I was eating sweets every day yesterday.", "When I was younger, I ate a lot of sweets.", "When I was younger, I eaten sweets."], "a": 2, "why": "A past habit: past simple ‘ate’."}]}, {"n": "16", "t": "Vocabulary: containers, packaging and quantities", "g": "You will name food containers and quantities and use them with countable and uncountable nouns.", "k": "Unit 2 · Delicious! · Vocabulary · SB p.24", "terms": [["container", "ємність, тара"], ["packaging", "упаковка"], ["carton", "картонна упаковка (пакет)"], ["jar", "банка (скляна)"], ["quantity", "кількість"], ["waste", "відходи"]], "th": [{"h": "Containers and packaging", "p": ["We often use a container word + of + noun to count uncountable food: a bottle of water, a carton of milk. This is how we can say ‘one’, ‘two’ or ‘three’ of something uncountable."], "ul": ["a bottle of water / juice — пляшка", "a carton of milk / juice — пакет", "a jar of jam / honey — банка (скляна)", "a can / tin of beans — бляшанка, консервна банка", "a packet of crisps / biscuits — пачка", "a box of chocolates / cereal — коробка", "a bag of flour / sugar — пакет, мішечок", "a tub of ice cream / yoghurt — пластикова баночка"]}, {"h": "Pieces and quantities", "p": ["Some words show a part or an amount of food. They help us talk precisely in recipes and shopping lists."], "ul": ["a loaf of bread — буханка", "a slice of bread / cake / pizza — скибочка, шматочок", "a piece of cheese / cake — шматок", "a bar of chocolate — плитка", "a bunch of bananas / grapes — гроно, в'язка", "a kilo of potatoes / a litre of milk", "a pinch of salt — дрібка", "a spoonful of sugar / a cup of tea / a bowl of soup"]}, {"h": "Packaging and the environment", "p": ["A lot of food packaging is plastic, and much of it becomes waste. We can make better choices when we shop: buy loose fruit and vegetables, bring our own bags and choose glass jars that we can use again."], "ul": ["recycle — переробляти", "reuse — використовувати повторно", "reduce — зменшувати", "single-use plastic — одноразовий пластик", "loose fruit — фрукти на вагу, без упаковки", "Discuss: How much packaging does your family throw away every week?", "Example: I bought two cartons of milk and a loaf of bread."]}], "f": "", "pr": ["Workbook p. 13, Vocabulary 2.", "Write a shopping list for a family picnic with 10 items, each with a container or quantity word (e.g. a bunch of grapes)."], "q": ["How can we count uncountable nouns like milk or bread?", "What is the difference between a jar and a can?", "What do we call one piece cut from a loaf of bread?", "How can we reduce packaging waste?"], "qz": [{"q": "a ___ of jam", "o": ["loaf", "jar", "bunch", "bar"], "a": 1, "why": "Jam usually comes in a glass jar."}, {"q": "a ___ of bread", "o": ["loaf", "carton", "tub", "can"], "a": 0, "why": "A loaf is a whole bread."}, {"q": "a ___ of bananas", "o": ["slice", "packet", "bunch", "pinch"], "a": 2, "why": "Bananas grow and are sold in bunches."}, {"q": "Add a ___ of salt to the soup.", "o": ["bar", "loaf", "carton", "pinch"], "a": 3, "why": "A pinch is a very small amount."}, {"q": "a ___ of chocolate", "o": ["bar", "bunch", "jar", "loaf"], "a": 0, "why": "Chocolate comes in bars."}, {"q": "‘Reuse’ means…", "o": ["throw away", "use again", "buy more", "burn"], "a": 1, "why": "Re- + use = use again."}, {"q": "Which is correct?", "o": ["two milks", "two carton of milks", "two cartons of milk", "two carton milk"], "a": 2, "why": "Container (plural) + of + uncountable noun."}]}, {"n": "17", "t": "Grammar: used to and would; be used to and get used to", "g": "You will talk about past habits with used to and would and about things that are familiar or becoming familiar with be used to and get used to.", "k": "Unit 2 · Delicious! · Grammar · SB p.25", "terms": [["past habit", "звичка в минулому"], ["used to", "бувало, раніше (робив)"], ["would", "бувало (повторювана дія в минулому)"], ["be used to", "мати звичку, бути звиклим до"], ["get used to", "звикати до"]], "th": [{"h": "Used to + infinitive", "p": ["We use ‘used to + verb’ for past habits and past states that are not true now. Negative: didn't use to. Question: Did you use to…? (no -d after did)."], "ul": ["I used to hate vegetables, but now I love them. (past state)", "We used to eat out every Sunday. (past habit)", "She didn't use to drink coffee.", "Did you use to have school lunches?", "There used to be a bakery on our street.", "Time expressions: when I was a child, in the past, years ago"]}, {"h": "Would + infinitive", "p": ["We can also use ‘would’ for repeated actions in the past, especially in stories and memories. But we can NOT use ‘would’ for past states (be, have, like, love, know)."], "ul": ["Every summer my grandma would make cherry dumplings.", "After school we would buy ice cream at the corner shop.", "Right: I used to love chocolate. Wrong: I would love chocolate (as a past state).", "Right: We used to have a dog. Wrong: We would have a dog.", "Tip: if you can't decide, ‘used to’ is always correct for past habits and states."]}, {"h": "Be used to / get used to + noun or -ing", "p": ["‘Be used to’ means something is normal and familiar for you. ‘Get used to’ means the process of something becoming familiar. After ‘to’ we use a noun or verb-ing.", "Both can be in any tense: I'm used to…, I wasn't used to…, I'll get used to…, I'm getting used to…"], "ul": ["I'm used to getting up early. (it's normal for me)", "My cousin lives in Japan. He is used to eating with chopsticks.", "At first I wasn't used to spicy food, but I got used to it.", "You'll soon get used to the new school canteen.", "Common mistake: I am used to eat breakfast. → I am used to eating breakfast.", "Compare: I used to cook (past habit) vs I'm used to cooking (it's normal for me)."]}], "f": "", "pr": ["Workbook p. 14, Grammar 2.", "Write 6 sentences about how your life and food habits have changed: 3 with used to / would and 3 with be used to / get used to."], "q": ["How do we make questions and negatives with ‘used to’?", "Why can't we say ‘I would have a cat’ about a past state?", "What form of the verb follows ‘be used to’?", "What is the difference between ‘be used to’ and ‘get used to’?"], "
