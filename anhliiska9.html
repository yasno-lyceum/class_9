ys ___ before you run to avoid injuries.", "o": ["warm up", "give up", "cool off", "break up"], "a": 0, "why": "Warming up prepares the muscles."}, {"q": "An ‘amateur’ athlete…", "o": ["is paid a lot of money", "only watches sport", "does sport for pleasure, not money", "works as a referee"], "a": 2, "why": "Amateurs are not professionals."}, {"q": "He ran 100 m in 9.58 seconds and ___ a world record.", "o": ["made", "did", "set", "won"], "a": 2, "why": "We say ‘set’ or ‘break’ a record."}, {"q": "Which is a noun?", "o": ["strength", "strong", "strongly", "stronger"], "a": 0, "why": "‘Strength’ is the noun form of ‘strong’."}]}, {"n": "56", "t": "Grammar: zero and first conditional; unless", "g": "You will form and use zero and first conditional sentences and the word ‘unless’ correctly.", "k": "Unit 6 · Go for it! · Grammar · SB p.69", "terms": [["conditional", "умовне речення"], ["condition", "умова"], ["result", "результат, наслідок"], ["general truth", "загальна істина"], ["unless", "якщо не"]], "th": [{"h": "Zero conditional: general truths", "p": ["We use the zero conditional for things that are always true: facts, scientific laws and general habits. Both parts use the present simple. ‘If’ here means almost the same as ‘when’."], "ul": ["Form: If + present simple, present simple", "If you heat ice, it melts.", "If you don’t warm up, you get injured more easily.", "If I train in the morning, I feel great all day.", "Muscles grow stronger if you exercise regularly.", "Comma rule: use a comma when the if-clause comes first."]}, {"h": "First conditional: real future possibilities", "p": ["We use the first conditional for a possible situation in the future and its likely result. Do not use ‘will’ in the if-clause."], "ul": ["Form: If + present simple, will / won’t + base form", "If it rains tomorrow, the match will be cancelled.", "If you practise every day, you’ll get better.", "We won’t win if we don’t work as a team.", "What will you do if you lose the final?", "You can also use might / can / should or an imperative: If you feel tired, stop and rest.", "✗ If it will rain, … → ✓ If it rains, …"]}, {"h": "Unless = if … not", "p": ["‘Unless’ means ‘if not’ or ‘except if’. The verb after ‘unless’ is positive, because the negative meaning is already in the word."], "ul": ["Unless you train, you won’t improve. = If you don’t train, you won’t improve.", "I won’t go swimming unless you come with me.", "Players can’t play unless they wear shin pads.", "You get dehydrated unless you drink water during long runs.", "✗ Unless you don’t hurry, … → ✓ Unless you hurry, …", "Other time words with the same pattern: when, as soon as, before, after: I’ll call you as soon as the match ends."]}], "f": "", "pr": ["Workbook p. 36: Grammar 1.", "Write 4 zero conditional facts about sport and health and 4 first conditional sentences about your plans (use ‘unless’ in two of them)."], "q": ["What is the difference between the zero and the first conditional?", "Can we use ‘will’ after ‘if’ in the first conditional?", "Rewrite with ‘unless’: If you don’t stretch, you’ll pull a muscle."], "qz": [{"q": "If you ___ water to 100°C, it boils.", "o": ["will heat", "heating", "heated", "heat"], "a": 3, "why": "Zero conditional: present simple in both clauses."}, {"q": "If it ___ tomorrow, we’ll play indoors.", "o": ["will rain", "rains", "rained", "is going rain"], "a": 1, "why": "After ‘if’ in the first conditional we use the present simple."}, {"q": "If you train hard, you ___ the race.", "o": ["win would", "will win", "won", "would win"], "a": 1, "why": "First conditional result: will + base form."}, {"q": "You won’t get fit ___ you exercise regularly.", "o": ["if", "so", "when", "unless"], "a": 3, "why": "‘Unless’ = if not: You won’t get fit if you don’t exercise."}, {"q": "Choose the correct sentence.", "o": ["Unless you hurry, you’ll be late.", "Unless you will hurry, you’ll be late.", "Unless you don’t hurry, you’ll be late.", "Unless you hurried, you’ll be late."], "a": 0, "why": "After ‘unless’ we use a positive present simple verb."}, {"q": "Which sentence is a general truth (zero conditional)?", "o": ["If I see Tom, I’ll tell him.", "If we win, we’ll celebrate.", "If you don’t drink water, you get thirsty.", "Unless it snows, we’ll go."], "a": 2, "why": "It describes something that is always true."}, {"q": "I’ll text you as soon as I ___ home.", "o": ["got", "will get", "get", "getting"], "a": 2, "why": "After time words like ‘as soon as’ we use the present simple for the future."}]}, {"n": "57", "t": "Listening and Speaking: sport and health — giving and supporting opinions", "g": "You will practise listening for opinions and attitudes and discuss sport and health with a partner, giving reasons.", "k": "Unit 6 · Go for it! · Listening + Speaking · SB pp.70-71", "terms": [["attitude", "ставлення"], ["to support an opinion", "обґрунтувати думку"], ["benefit", "користь, перевага"], ["drawback", "недолік"], ["to interrupt", "перебивати"]], "th": [{"h": "Listening for opinions and attitudes", "p": ["Some exam questions ask how a speaker feels or what they think. The answer is often not said directly. Listen to tone of voice, adjectives and words like ‘but’ and ‘to be honest’."], "ul": ["Positive words: brilliant, worth it, I’m really into…, it paid off", "Negative words: disappointing, a waste of time, I regret…", "Uncertain: I’m not sure, maybe, it depends", "A speaker may start positive and finish negative — wait for the full answer.", "Read the options before listening and decide what feeling each describes.", "Mark ‘?’ next to doubtful answers and check them the second time."]}, {"h": "Speaking: discussing and giving reasons", "p": ["In a discussion task you talk with your partner about a question, for example: ‘Is professional sport good for young people?’ Give reasons and examples, ask your partner’s view and react to what they say."], "ul": ["I strongly believe that… because…", "For example, … / For instance, …", "One benefit is… ; a drawback is…", "On the other hand, …", "Do you agree? / How about you?", "Sorry to interrupt, but… / Can I add something?", "If young people train too much, they might get injured.", "Unless they rest properly, they won’t perform well."]}, {"h": "Model dialogue (original)", "p": ["Two students discuss whether teenagers should do competitive sport."], "ul": ["A: I strongly believe competitive sport is good for teenagers. It teaches discipline.", "B: That’s true, but if they train every day, they won’t have time for school.", "A: I see your point. On the other hand, many athletes are very organised.", "B: Maybe. My cousin plays volleyball professionally and she often has injuries.", "A: That’s a real drawback. What would you suggest?", "B: I think amateur sport is better for most of us. It’s healthy and less stressful.", "A: OK, so we agree that rest and balance are the most important things."]}], "f": "", "pr": ["Workbook p. 36: Listening.", "Record yourself (1–1.5 minutes) answering: ‘Is it better to do sport for fun or to win?’ Give two reasons and one example."], "q": ["How can you recognise a speaker’s attitude if they don’t say it directly?", "Give two phrases for adding an example.", "How can you politely join a conversation when someone is speaking?"], "qz": [{"q": "‘To be honest, the training was a waste of time.’ The speaker feels…", "o": ["disappointed", "excited", "proud", "relieved"], "a": 0, "why": "‘A waste of time’ shows a negative attitude."}, {"q": "‘All that hard work really paid off.’ means…", "o": ["it was useless", "it was boring", "it was expensive", "it brought good results"], "a": 3, "why": "‘Paid off’ means it was successful."}, {"q": "Which phrase introduces an example?", "o": ["On the other hand,", "For instance,", "In conclusion,", "Sorry to interrupt,"], "a": 1, "why": "‘For instance’ = ‘for example’."}, {"q": "Which phrase introduces a contrasting idea?", "o": ["Also,", "On the other hand,", "For example,", "Because"], "a": 1, "why": "It presents the opposite point of view."}, {"q": "A ‘drawback’ is…", "o": ["an advantage", "a type of race", "a sports injury", "a disadvantage"], "a": 3, "why": "A drawback is a negative side of something."}, {"q": "In a discussion task, it is good to…", "o": ["ask for your partner’s opinion", "speak all the time and not listen", "give one-word answers", "read prepared text aloud"], "a": 0, "why": "Interaction with your partner is part of the assessment."}]}, {"n": "58", "t": "Vocabulary: sportswear and safety clothing", "g": "You will name sports clothes and protective equipment and describe what to wear for different sports.", "k": "Unit 6 · Go for it! · Vocabulary · SB p.72", "terms": [["sportswear", "спортивний одяг"], ["tracksuit", "спортивний костюм"], ["trainers", "кросівки"], ["kneepads", "наколінники"], ["breathable", "дихаючий (про тканину)"], ["waterproof", "водонепроникний"]], "th": [{"h": "Sports clothes", "p": ["Good sportswear is comfortable, lets your body move freely and keeps you at the right temperature. Notice that many clothes words are always plural: trainers, shorts, leggings."], "ul": ["tracksuit — спортивний костюм", "trainers — кросівки; football boots — бутси", "shorts — шорти; leggings — легінси", "T-shirt / vest — футболка / майка", "swimsuit / swimming trunks — купальник / плавки", "hoodie — худі; sweatshirt — світшот", "cap — кепка; headband — пов’язка на голову; socks — шкарпетки"]}, {"h": "Protective equipment", "p": ["Protective clothes reduce the risk of injury. In many sports you can’t take part unless you wear them."], "ul": ["helmet — шолом (cycling, skating, hockey)", "kneepads / elbow pads — наколінники / налокітники", "shin pads — щитки (football)", "gloves — рукавиці (boxing gloves, goalkeeper gloves)", "mouthguard — капа", "goggles — окуляри (swimming, skiing)", "life jacket — рятувальний жилет"]}, {"h": "Describing sportswear", "p": ["Use adjectives to describe what clothes are like and why they are useful."], "ul": ["breathable — дихаючий: Breathable fabric lets sweat escape.", "waterproof — водонепроникний: a waterproof jacket for hiking", "lightweight — легкий; warm — теплий", "tight / loose — тісний, облягаючий / вільний", "comfortable — зручний; stretchy — еластичний", "If you go skiing, wear warm, waterproof clothes and goggles.", "Unless you wear shin pads, the referee won’t let you play."]}], "f": "In Britain, simple canvas sports shoes with rubber soles were traditionally called ‘plimsolls’.", "pr": ["Workbook p. 37: Vocabulary 2.", "Choose three sports and write what clothes and protective equipment you need for each, with reasons (use if / unless)."], "q": ["Name four pieces of protective equipment and the sports they are used in.", "What does ‘breathable’ mean, and why is it important?", "What do you need to wear for skiing?"], "qz": [{"q": "Footballers wear ___ to protect their legs.", "o": ["goggles", "mouthguards", "shin pads", "headbands"], "a": 2, "why": "Shin pads protect the front of the lower leg."}, {"q": "Swimmers wear ___ to protect their eyes.", "o": ["kneepads", "helmets", "goggles", "gloves"], "a": 2, "why": "Goggles keep water out of the eyes."}, {"q": "A jacket that does not let rain in is…", "o": ["waterproof", "stretchy", "breathable", "loose"], "a": 0, "why": "‘Waterproof’ means water cannot get through."}, {"q": "Which word is always plural?", "o": ["cap", "hoodie", "helmet", "trainers"], "a": 3, "why": "We say ‘a pair of trainers’, and ‘trainers’ is plural."}, {"q": "Boxers protect their teeth with a…", "o": ["headband", "mouthguard", "life jacket", "vest"], "a": 1, "why": "A mouthguard covers the teeth."}, {"q": "When you go kayaking, you must wear a ___ .", "o": ["tracksuit", "life jacket", "football boots", "cap"], "a": 1, "why": "A life jacket keeps you safe in water."}]}, {"n": "59", "t": "Grammar: second conditional", "g": "You will use the second conditional to talk about imaginary or unlikely situations and give advice.", "k": "Unit 6 · Go for it! · Grammar · SB p.73", "terms": [["second conditional", "другий тип умовних речень"], ["imaginary", "уявний"], ["unlikely", "малоймовірний"], ["hypothetical", "гіпотетичний"], ["advice", "порада"]], "th": [{"h": "Form", "p": ["The second conditional uses the past simple in the if-clause and would / wouldn’t + base form in the result clause. The past form does NOT mean past time here — it shows that the situation is unreal or unlikely."], "ul": ["If + past simple, would + base form", "If I had more free time, I would join a climbing club.", "If she trained harder, she’d win more races.", "We wouldn’t lose if we played as a team.", "Questions: What would you do if you won a gold medal?", "Short answers: Would you try skydiving? — Yes, I would. / No, I wouldn’t.", "Could / might instead of would: If I were taller, I could play basketball better."]}, {"h": "Use", "p": ["Use the second conditional for situations that are imaginary, impossible now or unlikely in the future. Compare it with the first conditional, which is for real possibilities."], "ul": ["Imaginary present: If I lived near the sea, I would surf every day. (I don’t live near the sea.)", "Unlikely future: If I met a famous footballer, I’d ask for a photo.", "First vs second: If I win tomorrow, I’ll celebrate. (possible) / If I won the Olympics, I’d cry. (unlikely)", "Advice: If I were you, I’d wear a helmet.", "With ‘were’: If he were fitter, he would run faster. (‘was’ is common in speech)"]}, {"h": "Common mistakes", "p": ["Check your sentences for these typical errors."], "ul": ["✗ If I would have money, … → ✓ If I had money, …", "✗ If I am you, I’d … → ✓ If I were you, I’d …", "✗ She would to buy … → ✓ She would buy …", "Use a comma only when the if-clause comes first.", "‘I’d’ can mean ‘I would’ or ‘I had’ — check the next verb: I’d go (would) / I’d gone (had)."]}], "f": "", "pr": ["Workbook p. 38: Grammar 2.", "Write 6 sentences: ‘If I were a professional athlete, …’ and give 2 pieces of advice to a friend starting a new sport with ‘If I were you, …’."], "q": ["Which tense is used after ‘if’ in the second conditional?", "When do we use the second conditional instead of the first?", "Correct the mistake: ‘If I would be rich, I would buy a horse.’"], "qz": [{"q": "If I ___ a lot of money, I would build a skate park.", "o": ["have", "will have", "would have", "had"], "a": 3, "why": "The if-clause uses the past simple."}, {"q": "If she lived near the mountains, she ___ every weekend.", "o": ["would ski", "will ski", "skis", "skied"], "a": 0, "why": "The result clause uses would + base form."}, {"q": "If I ___ you, I’d see a doctor about that knee.", "o": ["am", "be", "were", "will be"], "a": 2, "why": "‘If I were you’ is the fixed phrase for advice."}, {"q": "Which sentence is about an unlikely situation?", "o": ["If it rains, we’ll stay in.", "If you heat ice, it melts.", "If I won the World Cup, I’d be famous.", "Unless you hurry, you’ll miss the bus."], "a": 2, "why": "Winning the World Cup is unlikely, so the second conditional is used."}, {"q": "What ___ you do if you saw a shark?", "o": ["would", "did", "will", "do"], "a": 0, "why": "Second conditional questions use ‘would’."}, {"q": "Choose the correct sentence.", "o": ["If we would train more, we would win.", "If we trained more, we will win.", "If we train more, we would win.", "If we trained more, we would win."], "a": 3, "why": "Past simple + would is the correct second conditional pattern."}, {"q": "If I were taller, I ___ play basketball professionally.", "o": ["can", "could", "will", "am"], "a": 1, "why": "‘Could’ can replace ‘would’ to show ability in the second conditional."}]}, {"n": "60", "t": "Writing: an opinion essay with reasons and examples", "g": "You will plan and write an opinion essay about sport and health with a clear structure, reasons and examples.", "k": "Unit 6 · Go for it! · Writing · SB pp.74-75", "terms": [["essay", "есе, твір"], ["introduction", "вступ"], ["main body", "основна частина"], ["conclusion", "висновок"], ["linking words", "слова-зв’язки"], ["to state an opinion", "висловити думку"]], "th": [{"h": "Structure of an opinion essay", "p": ["An opinion essay answers a question and clearly shows what the writer thinks. Each paragraph has one main idea, supported with a reason and an example. Use a neutral, semi-formal style: no contractions and no slang."], "ul": ["Introduction: rephrase the topic and state your opinion.", "Paragraph 2: first reason + example.", "Paragraph 3: second reason + example (or the opposite view and why you disagree).", "Conclusion: sum up and repeat your opinion in different words.", "Length in exams: usually 140–190 words.", "Answer the notes in the task if there are any (e.g. health, money, your own idea)."]}, {"h": "Useful language (fixed expressions)", "p": ["Linking words make your essay logical and easy to follow."], "ul": ["Opinion: In my opinion, / I strongly believe that / It seems to me that", "Reasons: The main reason is that… / This is because…", "Adding: Firstly, / Secondly, / Moreover, / In addition,", "Examples: For example, / For instance, / such as", "Contrast: However, / On the other hand, / Although…", "Conclusion: In conclusion, / To sum up, / All things considered,"]}, {"h": "Original model outline", "p": ["Task: ‘Should every student do sport at school every day?’ Below is a short model introduction and an outline."], "ul": ["Introduction: Sport is an important part of many people’s lives. In my opinion, every student should do some physical activity at school every day.", "Para 2: health — daily exercise improves fitness and concentration; e.g. a short run before lessons helps students focus.", "Para 3: social benefits — team games teach cooperation; e.g. a school volleyball team builds friendships.", "Para 4: other view — some students dislike sport; however, schools could offer choices such as dance or yoga.", "Conclusion: To sum up, daily sport makes students healthier and happier, so schools should include it.", "Checklist: clear opinion? one idea per paragraph? reasons + examples? linking words? no contractions? word count?"]}], "f": "The word ‘essay’ comes from the French verb ‘essayer’, which means ‘to try’.", "pr": ["Workbook p. 39: Writing; read the Writing Reference for essays.", "Write an opinion essay (140–190 words): ‘Professional athletes earn too much money.’ Do you agree?"], "q": ["What should the introduction of an opinion essay include?", "Why should each paragraph have only one main idea?", "Name three linking words for adding ideas and two for contrast."], "qz": [{"q": "Where should you state your opinion first?", "o": ["Only in the conclusion", "In the introduction", "Never", "In the title only"], "a": 1, "why": "An opinion essay states the writer’s view in the introduction."}, {"q": "Which linking word shows contrast?", "o": ["Moreover", "For example", "Firstly", "However"], "a": 3, "why": "‘However’ introduces an opposite idea."}, {"q": "Which sentence suits the style of an essay?", "o": ["I strongly believe that sport is beneficial.", "Sport’s super cool, guys!", "Sport? Yeah, whatever.", "LOL, sport is fun."], "a": 0, "why": "Essays use a neutral, semi-formal style."}, {"q": "Which phrase begins a conclusion?", "o": ["Secondly,", "For instance,", "To sum up,", "Although"], "a": 2, "why": "‘To sum up’ introduces a summary."}, {"q": "A good body paragraph contains…", "o": ["many unrelated ideas", "only a question", "one main idea with a reason and an example", "only a quotation"], "a": 2, "why": "One clear idea, supported, makes the paragraph strong."}, {"q": "‘Exercise improves concentration. ___, students who run before class focus better.’", "o": ["For example", "In conclusion", "However", "Although"], "a": 0, "why": "The second sentence gives an example."}, {"q": "Which is NOT recommended in an opinion essay?", "o": ["linking words", "examples", "a clear conclusion", "contractions like ‘don’t’ and ‘it’s’"], "a": 3, "why": "Contractions are too informal for an essay."}]}, {"n": "61", "t": "Video: Mounted archery — tradition, skill and safety", "g": "You will learn about mounted archery, take notes on the main points and discuss safety in sport.", "k": "Unit 6 · Go for it! · Video · SB p.76", "terms": [["mounted archery", "стрільба з лука верхи"], ["bow and arrow", "лук і стріла"], ["target", "мішень"], ["to gallop", "мчати галопом"], ["safety rules", "правила безпеки"], ["to take notes", "робити нотатки"]], "th": [{"h": "Background: what is mounted archery?", "p": ["Mounted archery means shooting arrows with a bow while riding a horse. For centuries it was an important skill for nomadic peoples of the Eurasian steppes, including the Scythians, who lived on lands that are now part of southern Ukraine, and later the Mongols. Today it is a modern sport: riders gallop along a track and try to hit targets, and they get points for accuracy and speed.", "The sport needs excellent balance, strong core muscles and a deep trust between the rider and the horse, because the rider often lets go of the reins to shoot."], "ul": ["rider — вершник; horse — кінь; saddle — сідло", "reins — віжки, повіддя", "bow — лук; arrow — стріла; quiver — сагайдак", "target — мішень; accuracy — влучність", "track — доріжка; gallop — галоп", "tradition — традиція; heritage — спадщина"]}, {"h": "Taking notes while watching", "p": ["When you watch a video, you cannot write every word. Write key words, numbers and names, and use short forms. Afterwards, turn your notes into a short summary."], "ul": ["Before watching: write 3 questions you expect the video to answer.", "Use symbols: + (advantage), – (problem), → (leads to), = (means).", "Write nouns and verbs, skip small words: ‘rider – shoot – gallop – 3 targets’.", "Watch again to check numbers and names.", "Summary: 3–5 sentences answering Who? What? Where? Why?"]}, {"h": "Safety and discussion", "p": ["Sports with animals, weapons or speed can be dangerous, so safety rules are essential. Use conditionals to give advice."], "ul": ["Always wear a helmet when you ride.", "Never point a bow at a person, even without an arrow.", "If you are a beginner, you should learn to ride and shoot separately first.", "Unless the horse is calm and trained, the rider won’t be safe.", "Discussion: Would you like to try mounted archery? Why / why not?", "Discussion: Why is it important to keep old sports traditions alive?"]}], "f": "", "pr": ["Review the Student Resources Unit 5 and 6 Wordlists and write down 10 words you still find difficult, with example sentences.", "Write a 60–80-word summary of the video from your notes, or describe a traditional sport from Ukraine or another country."], "q": ["What skills does a mounted archer need?", "Give three tips for taking notes while watching a video.", "Name two safety rules for mounted archery."], "qz": [{"q": "Mounted archery means…", "o": ["running with a bow", "shooting arrows while riding a horse", "horse racing without a rider", "throwing spears at a target"], "a": 1, "why": "‘Mounted’ means sitting on a horse."}, {"q": "Riders hold the horse with the…", "o": ["quiver", "reins", "target", "arrow"], "a": 1, "why": "Reins are straps used to control a horse."}, {"q": "A ‘quiver’ is used to…", "o": ["sit on a horse", "feed the horse", "protect the head", "carry arrows"], "a": 3, "why": "Archers keep their arrows in a quiver."}, {"q": "When taking notes, you should…", "o": ["write key words and numbers", "write every word", "stop the video after each word", "only draw pictures"], "a": 0, "why": "Notes should be short and focus on key information."}, {"q": "‘Accuracy’ means…", "o": ["speed", "bravery", "the ability to hit exactly where you aim", "the size of the target"], "a": 2, "why": "Accuracy = precision, hitting the right point."}, {"q": "Which sentence gives safety advice correctly?", "o": ["If you would ride, wear a helmet.", "If you rode, you will wear a helmet.", "If you ride, you should wear a helmet.", "Unless you don’t ride, wear a helmet."], "a": 2, "why": "Present simple in the if-clause + should gives advice."}]}, {"n": "62", "t": "Revision: Unit 6 vocabulary and conditionals", "g": "You will review Unit 6 sports vocabulary and the zero, first and second conditionals with ‘unless’.", "k": "Unit 6 · Go for it! · End-of-Unit Revision", "terms": [["revision", "повторення"], ["zero conditional", "нульовий тип умовних речень"], ["first conditional", "перший тип умовних речень"], ["second conditional", "другий тип умовних речень"], ["protective equipment", "захисне спорядження"]], "th": [{"h": "Vocabulary summary", "p": ["Unit 6 was about sport, equipment, sportswear and health. Test yourself: cover the translations and explain each word in English."], "ul": ["play / go / do: play tennis, go swimming, do yoga", "Places: pitch, court, track, pool, rink, slope", "Equipment: racket, bat, net, helmet, goggles, skis", "People: coach, referee, umpire, opponent, spectator", "Collocations: win a medal, beat an opponent, score a goal, set / break a record", "Health: warm up, keep fit, pull a muscle, sprain an ankle", "Sportswear: tracksuit, trainers, shin pads, kneepads, mouthguard; breathable, waterproof"]}, {"h": "Grammar summary: conditionals", "p": ["Compare the three types and their meaning. Remember: no ‘will’ or ‘would’ in the if-clause."], "ul": ["Zero (always true): If you don’t drink, you get dehydrated.", "First (real future): If we win on Saturday, we’ll play in the final.", "Unless (= if not): You won’t improve unless you practise.", "Second (imaginary/unlikely): If I had a horse, I’d try mounted archery.", "Advice: If I were you, I’d warm up first.", "Time clauses: I’ll call you when the match finishes."]}, {"h": "Check your progress", "p": ["Read each statement and give yourself a score from 1 (not yet) to 3 (I can do it well)."], "ul": ["I can say which verb (play / go / do) goes with a sport.", "I can name places, equipment and clothes for different sports.", "I can use zero and first conditionals and ‘unless’.", "I can talk about imaginary situations with the second conditional.", "I can scan a text for key information.", "I can plan an opinion essay with reasons and examples."]}], "f": "", "pr": ["Workbook p. 81: Review Unit 6.", "Write 3 sentences for each conditional type (9 in total) about sport, health or your plans."], "q": ["What is the difference between ‘If it rains, we’ll stay home’ and ‘If it rained, we’d stay home’?", "Which verb goes with ‘athletics’, ‘skating’ and ‘volleyball’?", "Which Unit 6 topic do you need to practise more?"], "qz": [{"q": "If you ___ ice, it turns into water.", "o": ["heat", "will heat", "would heat", "heated"], "a": 0, "why": "Zero conditional: present simple in both parts."}, {"q": "We’ll miss the start ___ we leave now.", "o": ["if", "when", "as soon as", "unless"], "a": 3, "why": "‘Unless we leave now’ = ‘if we don’t leave now’."}, {"q": "If I ___ a famous athlete, I would help young players.", "o": ["am", "were", "will be", "be"], "a": 1, "why": "Second conditional uses the past form ‘were’."}, {"q": "They ___ volleyball on the beach every summer.", "o": ["do", "play", "go", "make"], "a": 1, "why": "We ‘play’ ball games."}, {"q": "Ice hockey is played on a…", "o": ["pitch", "slope", "court", "rink"], "a": 3, "why": "A rink is an area of ice."}, {"q": "If it ___ sunny tomorrow, we’ll go cycling.", "o": ["is", "would be", "will be", "was"], "a": 0, "why": "First conditional: present simple after ‘if’."}, {"q": "Which item protects your teeth?", "o": ["kneepad", "shin pad", "mouthguard", "headband"], "a": 2, "why": "A mouthguard covers the teeth."}]}, {"n": "63", "t": "Progress Test: Units 5 and 6", "g": "You will show what you have learned in Units 5 and 6 in vocabulary, grammar, reading, listening and writing.", "k": "Unit 6 · Go for it! · Progress Test · Units 5&6", "terms": [["progress test", "контрольна робота з поступу"], ["to check answers", "перевіряти відповіді"], ["instructions", "інструкції"], ["time management", "управління часом"], ["reflection", "рефлексія, аналіз"]], "th": [{"h": "What is tested", "p": ["The test covers the vocabulary and grammar of Units 5 and 6 and the skills you practised: reading for the main idea and key information, listening for details and attitudes, and writing an informal email or an opinion essay."], "ul": ["Vocabulary: homes, household items, chores, sport, equipment, sportswear", "Collocations: move house, make the bed, do the washing-up, beat an opponent, set a record", "Grammar: will / be going to, present continuous and present simple for the future, might", "Grammar: zero, first and second conditionals, unless, time clauses", "Reading: main idea; multiple matching", "Listening: specific information; opinions", "Writing: informal reply email or opinion essay"]}, {"h": "How to prepare and how to work during the test", "p": ["Good preparation reduces stress. During the test, read the instructions carefully and manage your time."], "ul": ["Revise the Unit 5 and 6 wordlists and your grammar notes.", "Redo the Review pages in the Workbook (pp. 80–81).", "Read every instruction twice: How many words? Which form?", "Do the easier tasks first and come back to difficult ones.", "Leave 5 minutes at the end to check spelling and verb forms.", "In writing, make a quick plan before you start."]}, {"h": "Sample tasks (original)", "p": ["Try these mini tasks to check if you are ready."], "ul": ["Choose: I can’t come on Friday — I (play / ’m playing) in a match.", "Complete: If I (have) more space, I (get) a dog.", "Rewrite with ‘unless’: If you don’t water the plants, they’ll die.", "Odd one out: racket, bat, helmet, wardrobe", "Word formation: My brother is very (compete) — he always wants to win.", "Writing: Reply to a friend’s email asking about your new hobby (100–120 words)."]}], "f": "", "pr": ["After the test, write down three topics that were easy and three that were difficult for you.", "Make 10 flashcards with words or grammar points from Units 5–6 that you want to remember better."], "q": ["Which grammar topics from Units 5 and 6 are included in the test?", "What should you do in the last five minutes of a test?", "How will you prepare for the writing part?"], "qz": [{"q": "I can’t come on Friday — I ___ in a match.", "o": ["play", "will to play", "’m playing", "played"], "a": 2, "why": "A fixed arrangement uses the present continuous."}, {"q": "If I ___ more space, I would get a dog.", "o": ["had", "have", "will have", "would have"], "a": 0, "why": "Second conditional: past simple after ‘if’."}, {"q": "Odd one out:", "o": ["racket", "bat", "helmet", "wardrobe"], "a": 3, "why": "A wardrobe is furniture; the others are sports equipment."}, {"q": "My brother is very ___ — he always wants to win.", "o": ["compete", "competitive", "competition", "competitor"], "a": 1, "why": "An adjective is needed after ‘very’."}, {"q": "The plants will die ___ you water them.", "o": ["if", "unless", "when", "because"], "a": 1, "why": "‘Unless you water them’ = ‘if you don’t water them’."}, {"q": "What is a good strategy during a test?", "o": ["Start with the most difficult task and stay on it", "Skip the instructions", "Write without a plan", "Do easier tasks first and check at the end"], "a": 3, "why": "This helps you manage time and avoid mistakes."}]}]}, {"name": "Semester 1 review and assessment", "lessons": [{"n": "64", "t": "Semester 1 review: vocabulary, grammar and skills of Units 1–6", "g": "You will review the key vocabulary, grammar and exam skills of the first semester and prepare for the semester tests.", "k": "Semester 1 assessment", "terms": [["semester test", "семестрова контрольна робота"], ["to revise", "повторювати (матеріал)"], ["tense", "час (граматичний)"], ["self-assessment", "самооцінювання"], ["weak point", "слабке місце"]], "th": [{"h": "Grammar of Semester 1", "p": ["In the first semester you studied six units. Here is a short map of the grammar with one example for each point. Check which ones you can use without mistakes."], "ul": ["Unit 1: present simple vs continuous; stative verbs — I usually walk, but today I’m taking the bus. / I know (not ‘am knowing’).", "Unit 1: countable/uncountable nouns, quantifiers — a few jobs, a little money, much advice", "Unit 2: past simple vs past continuous — I was cooking when the phone rang.", "Unit 2: used to / would; be used to / get used to — I used to hate fish. I’m used to spicy food.", "Unit 3: present perfect simple vs continuous; articles — I’ve been waiting for an hour. / the Dnipro, a river", "Unit 4: relative clauses; time clauses — The shop that sells vintage clothes… / when, before, after", "Unit 5: will / be going to; future forms — I’m meeting Ira at 6. It’s going to rain.", "Unit 6: zero, first, second conditionals, unless — If I had time, I’d learn to surf."]}, {"h": "Vocabulary topics", "p": ["Revise the wordlists of all six units. Group words by topic and test yourself with a partner or flashcards."], "ul": ["Unit 1: jobs, personality, employment and life events", "Unit 2: tastes, cooking, containers and quantities", "Unit 3: geography, climate change, protecting the environment", "Unit 4: shopping, clothes and materials", "Unit 5: homes, household items, chores", "Unit 6: sport, equipment, sportswear, health"]}, {"h": "Preparing for the semester tests", "p": ["The semester tests check four skills: reading, listening, writing and speaking. Plan your revision over several days instead of one evening."], "ul": ["Reading: practise finding the main idea and scanning for details.", "Listening: listen to short English audio every day and note key words.", "Writing: revise the structure of an informal email and an opinion essay.", "Speaking: prepare to talk about yourself, your home, food, hobbies and sport for 1–2 minutes.", "Self-check: list your three weakest points and do extra exercises on them.", "Sleep well before the test — it helps memory more than late-night studying."]}], "f": "", "pr": ["Prepare for the semester tests: revise Units 1–6 grammar using your notes and the Grammar Reference.", "Make a one-page ‘Semester 1 summary’: one example sentence for each grammar point and 5 key words for each unit."], "q": ["Which grammar topic of Semester 1 is the most difficult for you?", "Give an example of a stative verb and explain why it is not used in the continuous.", "Which four skills are checked in the semester tests?"], "qz": [{"q": "I ___ TV when the lights went out.", "o": ["was watching", "watched", "have watched", "watch"], "a": 0, "why": "Past continuous for an action in progress interrupted by a shorter past action."}, {"q": "She ___ in Rivne since 2020.", "o": ["lives", "is living", "has lived", "lived"], "a": 2, "why": "Present perfect with ‘since’ for a situation that continues to now."}, {"q": "Choose the correct sentence.", "o": ["I am knowing the answer.", "I knowing the answer.", "I know the answer.", "I am know the answer."], "a": 2, "why": "‘Know’ is a stative verb and is not used in the continuous."}, {"q": "That’s the girl ___ won the chess competition.", "o": ["who", "which", "where", "what"], "a": 0, "why": "‘Who’ is the relative pronoun for people."}, {"q": "How ___ sugar do you need for the cake?", "o": ["many", "a few", "few", "much"], "a": 3, "why": "‘Sugar’ is uncountable, so we use ‘much’."}, {"q": "When I was little, I ___ climb trees every day.", "o": ["am used to", "used to", "get used to", "use to"], "a": 1, "why": "‘Used to’ describes past habits."}, {"q": "If you ___ hard, you’ll pass the test.", "o": ["will study", "study", "studied", "would study"], "a": 1, "why": "First conditional: present simple after ‘if’."}, {"q": "I’ve got tickets. We ___ see a concert on Saturday.", "o": ["might to", "will be", "would", "are going to"], "a": 3, "why": "A plan already made uses ‘be going to’."}]}, {"n": "65", "t": "Semester test: Reading", "g": "You will show how well you understand written texts by finding main ideas, specific information and the meaning of words in context.", "k": "Semester 1 assessment", "terms": [["reading comprehension", "розуміння прочитаного"], ["skimming", "ознайомче читання"], ["scanning", "пошукове читання"], ["true / false / not given", "правда / неправда / не згадано"], ["context", "контекст"]], "th": [{"h": "What the reading test checks", "p": ["The reading test checks whether you can understand the general idea of a text, find specific details and guess unknown words from context. Typical tasks are multiple choice, matching headings or people to texts, gap fill with sentences, and true/false questions."], "ul": ["Main idea of a text or paragraph", "Specific information: names, numbers, reasons, places", "Writer’s opinion or purpose", "Meaning of words from context", "Text organisation: which sentence fits a gap", "Typical topics of Semester 1: jobs, food, nature, fashion, homes, sport"]}, {"h": "Strategies for the test", "p": ["Work step by step and do not panic if you don’t know some words. You can understand a text without knowing every word."], "ul": ["Skim the whole text first (1–2 minutes) to get the general idea.", "Read the questions and underline key words.", "Scan for the part of the text that answers each question; look for synonyms.", "For gapped sentences, check words like this, they, however before and after the gap.", "For true/false/not given, ‘not given’ means the text says nothing about it.", "Never leave an answer empty; manage your time and check at the end."]}, {"h": "Short practice task (original)", "p": ["Read: ‘Ivan started volunteering at an animal shelter last spring. At first he only cleaned cages, but now he also helps vets and walks dogs every Saturday. He says the work has made him more patient. Next year he is going to study biology.’"], "ul": ["1. Ivan has volunteered for about a year. (True / False / Not given) → True", "2. Ivan gets paid for his work. (T / F / NG) → Not given", "3. He now only cleans cages. (T / F / NG) → False", "4. Main idea: volunteering has changed Ivan and shaped his plans.", "5. Context: ‘patient’ here means calm and able to wait — терплячий."]}], "f": "", "pr": ["Read a short English article (news for teenagers or a story) and write its main idea in one sentence and three key details.", "Write down five new words from your reading and guess their meaning from context before checking a dictionary."], "q": ["What is the difference between skimming and scanning?", "What does ‘not given’ mean in a true/false/not given task?", "What can you do if you don’t know a word in the text?"], "qz": [{"q": "Skimming means reading a text quickly to…", "o": ["get the general idea", "find one number", "translate every word", "check spelling"], "a": 0, "why": "Skimming gives you the gist of the text."}, {"q": "In a T/F/NG task, if the text doesn’t mention the information, the answer is…", "o": ["True", "False", "Not given", "Both True and False"], "a": 2, "why": "‘Not given’ means the text says nothing about it."}, {"q": "In the practice text, why is Ivan more patient now?", "o": ["Because of school", "Because of his vet", "Because of volunteering", "Because of biology"], "a": 2, "why": "He says the work at the shelter has made him more patient."}, {"q": "When you look for answers in a text, you should also look for…", "o": ["synonyms of key words", "only the same words", "the longest sentence", "pictures"], "a": 0, "why": "Texts often use different words with the same meaning."}, {"q": "What should you do if you don’t know a word?", "o": ["Stop reading", "Leave all answers blank", "Skip the whole text", "Guess its meaning from context"], "a": 3, "why": "The words around it often help you understand it."}, {"q": "Words like ‘however’, ‘this’ and ‘they’ help you…", "o": ["count words", "connect a gapped sentence with the text", "find the title", "check spelling"], "a": 1, "why": "They link sentences together and show which one fits a gap."}]}, {"n": "66", "t": "Semester test: Listening", "g": "You will show how well you understand spoken English: main ideas, specific details and speakers’ opinions.", "k": "Semester 1 assessment", "terms": [["listening comprehension", "розуміння на слух"], ["recording", "аудіозапис"], ["distractor", "відволікаючий варіант"], ["to predict", "передбачати"], ["speaker", "мовець"]], "th": [{"h": "What the listening test checks", "p": ["The listening test checks if you can follow short conversations, announcements and longer talks. You usually hear each recording twice. Tasks include multiple choice, matching speakers to statements, and completing notes with a word or number."], "ul": ["Gist: the general topic or situation", "Specific information: times, prices, places, names", "Speakers’ feelings, opinions and attitudes", "Note completion with the exact word you hear", "Recognising distractors: options that are mentioned but are not correct", "Spelling of familiar words and numbers"]}, {"h": "Strategies for the test", "p": ["Use the time before each recording well. Your preparation before listening is as important as the listening itself."], "ul": ["Read the instructions and questions before the audio starts.", "Predict the type of answer: a number, a name, an adjective?", "Listen for signals: but, actually, in the end, I changed my mind.", "First listening: choose answers; second listening: check them.", "In note completion, write the exact word and check spelling.", "If you miss an answer, move on — don’t lose the next question."]}, {"h": "Short practice task (original)", "p": ["Imagine you hear: ‘The sports centre opens at seven, not six as before. Swimming lessons cost twelve euros, but students pay only eight. Please bring your own towel — we don’t rent them any more.’"], "ul": ["The centre opens at: 7 (six is a distractor)", "Students pay: 8 euros (twelve is a distractor)", "Visitors must bring: a towel", "Signal words in the text: ‘not … as before’, ‘but’, ‘any more’", "Tip: numbers like 13/30 and 15/50 sound similar — listen to the stress."]}], "f": "", "pr": ["Listen to a short English audio (a podcast or video for learners) for 10 minutes and write down 5 key facts.", "Practise numbers: ask someone to read 10 numbers, prices and times in English and write them down."], "q": ["What should you do before the recording starts?", "What is a distractor in a listening task?", "How can you tell the difference between ‘thirteen’ and ‘thirty’?"], "qz": [{"q": "In the practice task, when does the centre open?", "o": ["at six", "at seven", "at eight", "at twelve"], "a": 1, "why": "The speaker says ‘at seven, not six as before’."}, {"q": "How much do students pay for swimming lessons?", "o": ["twelve euros", "six euros", "nothing", "eight euros"], "a": 3, "why": "‘Students pay only eight’; twelve is the normal price."}, {"q": "A ‘distractor’ is…", "o": ["a wrong option that is mentioned in the recording", "the correct answer", "the title of the task", "a pause in the recording"], "a": 0, "why": "Distractors are mentioned to test if you listen carefully."}, {"q": "What should you do during the second listening?", "o": ["Stop listening", "Read a new task", "Check and correct your answers", "Change all answers"], "a": 2, "why": "The second listening is for checking."}, {"q": "Which word often signals that the speaker is correcting information?", "o": ["also", "and", "actually", "so"], "a": 2, "why": "‘Actually’ often introduces the real answer."}, {"q": "In note completion, you should…", "o": ["write the exact word and spell it correctly", "write a full sentence", "translate into Ukrainian", "draw a picture"], "a": 0, "why": "Answers need the exact word with correct spelling."}]}, {"n": "67", "t": "Semester test: Writing", "g": "You will show that you can write a clear, organised text (an email or an opinion essay) using Semester 1 language.", "k": "Semester 1 assessment", "terms": [["task achievement", "виконання завдання"], ["coherence", "зв’язність"], ["range of vocabulary", "різноманітність лексики"], ["accuracy", "точність, правильність"], ["word count", "кількість слів"]], "th": [{"h": "What the writing test checks", "p": ["The writing test usually asks for an informal email/letter or an opinion essay. Your text is assessed for four things: did you complete the task, is it well organised, do you use a good range of language, and is it accurate?"], "ul": ["Task achievement: all points answered, correct text type and length", "Organisation: paragraphs, linking words, logical order", "Vocabulary: topic words from Units 1–6, collocations, fixed phrases", "Grammar: a variety of tenses, conditionals, relative clauses", "Style: informal for emails, neutral for essays", "Spelling and punctuation"]}, {"h": "Strategies for the test", "p": ["Divide your time: about 5 minutes to plan, 25 minutes to write and 5 minutes to check."], "ul": ["Underline every point you must include in the task.", "Write a quick paragraph plan before you start.", "Start each paragraph with a clear topic sentence.", "Use at least three different linking words (however, moreover, for example).", "Show off your grammar: one conditional, one relative clause, one future form.", "Check: verb forms, plurals, articles, capital letters, word count."]}, {"h": "Short practice task (original)", "p": ["Task: Your English friend writes: ‘How was your first semester? What was your favourite subject? What are you going to do in the winter holidays?’ Write a reply (100–140 words). Here is a plan."], "ul": ["Greeting + thanks: Hi Emma, thanks for your email!", "Para 1: the semester — busy but interesting; one achievement", "Para 2: favourite subject + reason + example", "Para 3: holiday plans with ‘be going to’ / present continuous; one ‘if’ sentence", "Ending: question to your friend + Write back soon! + Best wishes, + name", "Self-check: 3 points answered? paragraphs? informal phrases? 100–140 words?"]}], "f": "", "pr": ["Write the practice email to Emma (100–140 words) and check it with the checklist.", "Rewrite one of your old essays or emails, correcting mistakes and adding two linking words and one conditional sentence."], "q": ["What four things are assessed in a writing test?", "How should you divide your time in the writing test?", "Name three grammar structures you can use to show a good range."], "qz": [{"q": "What should you do first in a writing test?", "o": ["Start writing immediately", "Write the ending", "Count words", "Underline the task points and make a plan"], "a": 3, "why": "Planning helps you answer all points in a clear order."}, {"q": "Which style is right for an email to a friend?", "o": ["very formal", "informal", "academic", "legal"], "a": 1, "why": "Emails to friends are informal."}, {"q": "A ‘topic sentence’ is…", "o": ["the last sentence of a text", "the first sentence of a paragraph that shows its main idea", "the title", "a question to the reader"], "a": 1, "why": "It introduces what the paragraph is about."}, {"q": "Which is a linking word for adding information?", "o": ["However", "Unless", "Although", "Moreover"], "a": 3, "why": "‘Moreover’ adds another point."}, {"q": "If the task says 100–140 words and you write 60, you…", "o": ["may lose marks for task achievement", "get extra marks", "have no problem", "finish faster with full marks"], "a": 0, "why": "A text that is too short does not complete the task fully."}, {"q": "Which sentence shows a good range of grammar?", "o": ["I like sport. Sport is good.", "Sport good.", "If I had more time, I would join the team that trains in the park.", "I go. I play. I win."], "a": 2, "why": "It uses a second conditional and a relative clause."}]}, {"n": "68", "t": "Semester test: Speaking", "g": "You will show that you can talk about familiar topics, give reasons and interact politely in English.", "k": "Semester 1 assessment", "terms": [["fluency", "швидкість і плавність мовлення"], ["pronunciation", "вимова"], ["interaction", "взаємодія"], ["to expand an answer", "розширювати відповідь"], ["filler", "слово-заповнювач"]], "th": [{"h": "What the speaking test checks", "p": ["In the speaking test you usually answer personal questions, speak for 1–2 minutes on a topic and discuss a question with a partner or the teacher (online). You are assessed for fluency, vocabulary, grammar, pronunciation and interaction."], "ul": ["Part 1: questions about you — family, home, school, hobbies", "Part 2: a short talk on a topic from Units 1–6 (e.g. ‘Your dream home’, ‘A sport you enjoy’)", "Part 3: a discussion — giving opinions, agreeing and disagreeing", "Fluency: speaking without long pauses", "Vocabulary and grammar: range and accuracy", "Interaction: listening, reacting and asking questions"]}, {"h": "Strategies for the test", "p": ["Short answers like ‘Yes’ or ‘I like football’ are not enough. Expand your answers with reasons, examples and details."], "ul": ["Use the ABC method: Answer + Because (reason) + Continue (example).", "Example: I live in a flat. I like it because it’s cosy, and from my balcony I can see the park.", "Use fillers instead of silence: Well, … / Let me think… / That’s an interesting question.", "If you don’t understand: Sorry, could you repeat the question, please?", "Ask your partner: What about you? / Do you agree?", "Speak clearly and look at the camera in an online test."]}, {"h": "Practice questions (original)", "p": ["Answer each question aloud for 30–60 seconds. Record yourself and listen back."], "ul": ["What job would you like to do in the future? Why?", "Describe a meal you love. How do you make it?", "What can teenagers do to protect the environment?", "Do you prefer shopping online or in shops?", "Describe your home and your favourite room.", "If you could try any sport, what would it be and why?"]}], "f": "", "pr": ["Record answers to three practice questions (1 minute each) and listen to them: note one strength and one thing to improve.", "Prepare a 2-minute talk ‘My first semester at the lyceum’ and practise it with a family member."], "q": ["What does the ABC method mean?", "What can you say if you need time to think?", "How can you ask the examiner to repeat a question politely?"], "qz": [{"q": "Which answer is the best in a speaking test? ‘Do you like sport?’", "o": ["Yes.", "Yes, I do.", "Yes, I love volleyball because it’s a team sport, and I play every Tuesday.", "Sport."], "a": 2, "why": "It answers, gives a reason and adds detail."}, {"q": "‘Fluency’ means…", "o": ["speaking smoothly without long pauses", "using difficult words", "speaking very loudly", "speaking only in short sentences"], "a": 0, "why": "Fluency is about speaking smoothly and naturally."}, {"q": "Which phrase helps you get time to think?", "o": ["Next question.", "Goodbye.", "I don’t know.", "Let me think…"], "a": 3, "why": "A filler phrase avoids long silences."}, {"q": "You didn’t understand the question. You say…", "o": ["What?", "Sorry, could you repeat the question, please?", "Repeat!", "I don’t care."], "a": 1, "why": "This is a polite request."}, {"q": "In a discussion with a partner, you should also…", "o": ["talk only about yourself", "ask for your partner’s opinion", "stay silent", "read notes aloud"], "a": 1, "why": "Interaction is part of the assessment."}, {"q": "‘If you could try any sport, what would it be?’ Which answer is grammatically correct?", "o": ["I will try surfing.", "I would to try surfing.", "I try surfing.", "I would try surfing."], "a": 3, "why": "A second conditional question is answered with ‘would + base form’."}]}, {"n": "69", "t": "Analysis of semester tests: learning from mistakes", "g": "You will analyse your semester test results, understand your typical mistakes and make a plan to improve.", "k": "Semester 1 assessment", "terms": [["mistake / error", "помилка"], ["to correct", "виправляти"], ["typical mistake", "типова помилка"], ["learning goal", "навчальна мета"], ["feedback", "зворотний зв’язок"]], "th": [{"h": "Why analyse mistakes?", "p": ["A test result is not only a mark. It shows what you already know and what you need to practise. Mistakes are a normal part of learning a language — the important thing is to understand them and not repeat them."], "ul": ["Read the teacher’s feedback carefully.", "Group your mistakes: grammar, vocabulary, spelling, task strategy.", "Find the rule for each grammar mistake in your notes or the Grammar Reference.", "Write the correct version of every wrong sentence.", "Notice patterns: Do you often forget -s in the third person? Articles?", "Celebrate what you did well too!"]}, {"h": "Typical Semester 1 mistakes and corrections", "p": ["Here are mistakes many B1 students make. Check if any of them are in your test."], "ul": ["✗ She don’t like fish. → ✓ She doesn’t like fish.", "✗ I am knowing him for years. → ✓ I have known him for years.", "✗ I have seen him yesterday. → ✓ I saw him yesterday.", "✗ If it will rain, we stay home. → ✓ If it rains, we’ll stay home.", "✗ We bought new furnitures. → ✓ We bought some new furniture.", "✗ I go to swimming. → ✓ I go swimming.", "✗ The man which lives here… → ✓ The man who lives here…", "✗ Unless you don’t study, … → ✓ Unless you study, …"]}, {"h": "My improvement plan", "p": ["Make a personal plan for the second semester. Choose specific, realistic goals."], "ul": ["My strongest skill is… / My weakest skill is…", "Goal 1 (grammar): e.g. use past simple vs present perfect correctly.", "Goal 2 (vocabulary): e.g. learn 10 new words every week with flashcards.", "Goal 3 (skill): e.g. listen to English for 10 minutes a day.", "How I will check progress: a short self-test every two weeks.", "Who can help me: teacher, classmates, family, online dictionaries."]}], "f": "", "pr": ["Work on your mistakes: write the correct version of every mistake from your semester tests and the rule that explains it.", "Write your improvement plan for Semester 2 with three specific goals."], "q": ["How can you group your mistakes?", "Which typical mistake from the list do you make most often?", "What are your three goals for the next semester?"], "qz": [{"q": "Correct the mistake: ‘He don’t play tennis.’", "o": ["He doesn’t play tennis.", "He doesn’t plays tennis.", "He not play tennis.", "He isn’t play tennis."], "a": 0, "why": "Third person singular negative: doesn’t + base form."}, {"q": "Which sentence is correct?", "o": ["I have seen her yesterday.", "I have saw her yesterday.", "I saw her yesterday.", "I seen her yesterday."], "a": 2, "why": "‘Yesterday’ is a finished time, so we use the past simple."}, {"q": "Which sentence is correct?", "o": ["If it will snow, we’ll ski.", "If it snow, we ski.", "If it snows, we’ll ski.", "If it would snow, we’ll ski."], "a": 2, "why": "First conditional: present simple after ‘if’."}, {"q": "The girl ___ sits next to me is from Lutsk.", "o": ["who", "which", "where", "whose"], "a": 0, "why": "Use ‘who’ for people."}, {"q": "What is the best way to learn from a mistake?", "o": ["Ignore it", "Copy a friend’s answer", "Only look at the mark", "Find the rule and write the correct version"], "a": 3, "why": "Understanding and correcting helps you remember."}, {"q": "Which goal is the most specific?", "o": ["Be better at English.", "Learn 10 new words every week with flashcards.", "Study more.", "Try hard."], "a": 1, "why": "A specific goal says exactly what and how often."}]}, {"n": "70", "t": "Final lesson: Semester 1 reflection and celebration", "g": "You will reflect on your progress in Semester 1, review the most useful language and set goals for Semester 2.", "k": "Semester 1 assessment", "terms": [["achievement", "досягнення"], ["to reflect", "розмірковувати, аналізувати"], ["progress", "прогрес, поступ"], ["goal", "мета, ціль"], ["to look forward to", "з нетерпінням чекати"]], "th": [{"h": "Looking back at Semester 1", "p": ["Congratulations — you have finished six units of New Close-up B1! You talked about jobs, food, nature, fashion, homes and sport, and practised many exam skills. Take a few minutes to think about what you have learned and how you learned it."], "ul": ["Which unit did you enjoy most? Why?", "What new words do you use often now?", "Which grammar topic was a challenge, and which became easy?", "What helped you learn best: videos, writing, speaking, quizzes?", "What are you proud of this semester?"]}, {"h": "Useful language for reflecting", "p": ["Use these phrases to talk or write about your learning experience."], "ul": ["I’ve learned how to… / I’ve improved my…", "At first I found… difficult, but now…", "The most useful thing for me was…", "I’m proud that I…", "Next semester I’m going to…", "If I had more time, I would practise…", "I’m looking forward to learning about…"]}, {"h": "Fun review activity and goals for Semester 2", "p": ["Play this mini game alone or with family: give yourself one point for every correct answer. Then write your goals for the next semester (Units 7–12: travel, free time, the digital world, films, education, body and mind)."], "ul": ["Name 3 jobs and 3 personality adjectives.", "Say 2 sentences about what you used to do as a child.", "Name 3 environmental problems.", "Describe your favourite outfit with 3 adjectives.", "Say what you are going to do in the holidays.", "Finish the sentence: If I could travel anywhere, I would…", "Set 3 goals for Semester 2 and write them in your notebook."]}], "f": "", "pr": ["Write a short reflection (80–100 words): ‘My Semester 1 in English’ — what you learned, what was difficult, what you are proud of.", "Make a list of 20 favourite English words from Semester 1 and use five of them in sentences about your holiday plans."], "q": ["What is your biggest achievement in English this semester?", "Which skill do you want to improve most next semester?", "Which topic of Semester 2 are you looking forward to?"], "qz": [{"q": "‘I’m looking forward to the holidays’ means…", "o": ["I don’t want the holidays.", "I’m happy and excited about the holidays coming.", "I forgot about the holidays.", "The holidays are over."], "a": 1, "why": "‘Look forward to’ means wait with pleasure."}, {"q": "I ___ a lot this semester.", "o": ["learned tomorrow", "learn", "am learning yesterday", "have learned"], "a": 3, "why": "Present perfect for experience in an unfinished time period (this semester)."}, {"q": "Next semester I ___ read more English books — I’ve decided.", "o": ["am going to", "would", "was", "have"], "a": 0, "why": "A plan already decided uses ‘be going to’."}, {"q": "If I had more time, I ___ practise speaking every day.", "o": ["will", "am", "would", "have"], "a": 2, "why": "Second conditional: would + base form."}, {"q": "At first I found grammar difficult, ___ now it is easier.", "o": ["because", "so", "but", "and so"], "a": 2, "why": "‘But’ shows contrast between then and now."}, {"q": "An ‘achievement’ is…", "o": ["something you have done successfully", "a mistake", "a test question", "a holiday"], "a": 0, "why": "An achievement is a success you worked for."}]}]}, {"name": "Unit 7. Have a great trip! (Чудової подорожі!)", "lessons": [{"n": "71", "t": "Unit Opener: travel and eco-tourism", "g": "You will talk about different ways of travelling, learn key travel vocabulary and describe kinds of eco-tourism.", "k": "Unit 7 · Have a great trip! · Unit Opener + Vocabulary for Reading · SB pp.77-78", "terms": [["eco-tourism", "екотуризм"], ["destination", "місце призначення"], ["sightseeing", "огляд визначних пам'яток"], ["local community", "місцева громада"], ["carbon footprint", "вуглецевий слід"], ["souvenir", "сувенір"]], "th": [{"h": "What is this unit about?", "p": ["Unit 7 is all about travel: holidays, transport, places to stay and the adventures (and problems) we have on a trip. We will also think about how travel affects nature and local people, and how we can be more responsible tourists.", "Eco-tourism means travelling to natural places in a way that protects the environment and helps the people who live there."], "ul": ["Nature tourism — watching wildlife, hiking in national parks", "Volunteer tourism — helping on a farm, cleaning a beach, working at an animal shelter", "Rural tourism — staying in a village and learning about local life", "Adventure tourism — kayaking, climbing, cycling tours", "Cultural tourism — visiting museums, festivals and historical places"]}, {"h": "Discuss with a partner (or answer in your notebook)", "p": ["Think about your own experience. Give reasons and examples in your answers."], "ul": ["What was the best trip you have ever been on? Why?", "Do you prefer holidays in nature or in a big city?", "What kind of eco-tourism would you like to try?", "What can tourists do to keep beaches and forests clean?", "Is it better to travel by train, by plane or by car? Why?"]}, {"h": "Key vocabulary for reading", "p": ["Learn these words before you read the text in the next lesson. Write each word with your own example sentence."], "ul": ["destination — місце призначення (Lviv is a popular destination in winter.)", "journey — подорож, поїздка (The journey by train took six hours.)", "sightseeing — огляд пам'яток (We spent the day sightseeing in Kyiv.)", "pollution — забруднення", "litter — сміття (на вулиці); смітити", "crowded — переповнений (The beach was too crowded.)", "local residents — місцеві мешканці", "off the beaten track — далеко від туристичних маршрутів"]}], "f": "The United Nations named 2017 the International Year of Sustainable Tourism for Development.", "pr": ["Study the Student Resources Unit 7 Wordlist: copy 15 new words with translations into your vocabulary notebook.", "Make a mind map called ‘Travel’ with four branches: transport, places to stay, activities, problems on a trip. Add at least 5 words to each branch."], "q": ["What is eco-tourism?", "Name three kinds of eco-tourism.", "What does ‘off the beaten track’ mean?", "How can a tourist help the local community?"], "qz": [{"q": "Eco-tourism is travel that…", "o": ["is always very cheap", "happens only by plane", "protects nature and helps local people", "is only for scientists"], "a": 2, "why": "Eco-tourism aims to protect the environment and support local communities."}, {"q": "Choose the correct word: Barcelona is a popular tourist ___.", "o": ["destination", "litter", "journey", "residents"], "a": 0, "why": "A destination is the place you travel to."}, {"q": "‘Litter’ means…", "o": ["a map", "a small hotel", "a travel ticket", "rubbish left on the ground"], "a": 3, "why": "Litter is rubbish that people drop in public places."}, {"q": "A place that is ‘off the beaten track’ is…", "o": ["very crowded", "far from popular tourist routes", "near a motorway", "closed to visitors"], "a": 1, "why": "The idiom describes quiet places that few tourists visit."}, {"q": "Which activity is volunteer tourism?", "o": ["cleaning a beach during your holiday", "shopping in a mall", "sunbathing all day", "watching TV in the hotel"], "a": 0, "why": "Volunteer tourism means doing useful work while you travel."}, {"q": "‘The museum was so ___ that we couldn't see the paintings.’", "o": ["empty", "quiet", "crowded", "local"], "a": 2, "why": "Crowded means full of people, so it was hard to see."}, {"q": "‘Carbon footprint’ is…", "o": ["a footprint on the beach", "the amount of CO2 your activities produce", "a type of shoe", "a kind of map"], "a": 1, "why": "Carbon footprint measures how much carbon dioxide we produce."}]}, {"n": "72", "t": "Reading: the hidden cost of your holiday", "g": "You will read a text about the environmental cost of tourism, understand the writer's opinion and talk about cleaning up after yourself on holiday.", "k": "Unit 7 · Have a great trip! · Reading · SB pp.78-79", "terms": [["mass tourism", "масовий туризм"], ["writer's attitude", "ставлення автора"], ["damage", "шкода; пошкоджувати"], ["waste", "відходи"], ["responsible", "відповідальний"], ["leave no trace", "не залишати слідів"]], "th": [{"h": "Before you read", "p": ["The plan's text is «The hidden cost of your holiday». Before reading, look at the title and think: what ‘cost’ can a holiday have apart from money? Predicting the content helps you understand the text faster."], "ul": ["Look at the title, pictures and first sentence of each paragraph.", "Underline words that show feelings: worried, sadly, surprisingly, I believe.", "Ask yourself: is the writer for or against something?", "Don't stop at every unknown word — guess from context."]}, {"h": "Original practice text: Too many visitors?", "p": ["Every summer, millions of tourists arrive at small seaside towns. At first, this sounds like good news: hotels, cafés and shops earn money. However, I believe we rarely think about the price that nature pays. Planes and cruise ships produce huge amounts of carbon dioxide. Beaches are covered with plastic bottles, and local water supplies are used for hotel swimming pools while residents sometimes have to save water.", "This doesn't mean we should stop travelling. Instead, we should travel more responsibly. Take a train when you can, carry a reusable bottle and always take your rubbish home. Choose small family hotels so that money stays in the local community. If every tourist made a few small changes, our favourite places would stay beautiful for the next generation."], "ul": ["Main idea: tourism brings money but also harms nature.", "The writer's attitude: worried but positive — he/she offers solutions.", "Opinion words: I believe, we should, This doesn't mean…"]}, {"h": "Exam tip: questions about the writer's opinion", "p": ["Some multiple-choice questions ask what the writer thinks or feels, not just facts. The answer is often not written directly, so you need to ‘read between the lines’."], "ul": ["Find opinion phrases: in my view, I'm afraid, it's a pity, fortunately.", "Check the tone: is the writer angry, worried, amused, hopeful?", "Read the whole paragraph, not just one sentence.", "Be careful: an option can repeat words from the text but still be wrong.", "Eliminate options that are too extreme (always, never, everybody)."]}, {"h": "Leave no trace: your holiday rules", "p": ["Talk about your own experience: have you ever seen a dirty beach or forest? What did you do?"], "ul": ["Take all your rubbish with you.", "Stay on the paths in parks and mountains.", "Don't feed wild animals.", "Use less water and electricity in hotels.", "Buy souvenirs made by local people."]}], "f": "Venice has introduced an entry fee for day visitors on busy days to reduce overcrowding.", "pr": ["Workbook pp. 40-41 (Reading) and read the Exam Reminder.", "Write 6–8 sentences: ‘How I can be a responsible tourist’. Use ‘should’ and examples from your own holidays."], "q": ["What ‘hidden costs’ can tourism have?", "Which words show the writer's opinion?", "How can you recognise the writer's attitude in a text?", "What do you personally do to keep nature clean on holiday?"], "qz": [{"q": "In the practice text, the writer's attitude to tourism is…", "o": ["completely negative", "worried but hopeful", "not interested", "very angry"], "a": 1, "why": "The writer sees problems but suggests solutions."}, {"q": "Which phrase shows an opinion?", "o": ["I believe we rarely think about it.", "Planes produce carbon dioxide.", "Hotels earn money.", "Millions of tourists arrive."], "a": 0, "why": "‘I believe’ introduces the writer's personal view."}, {"q": "According to the text, why choose small family hotels?", "o": ["They are always cheaper.", "They have bigger pools.", "Money stays in the local community.", "They are near airports."], "a": 2, "why": "The text says money then stays with local people."}, {"q": "When you answer opinion questions, you should…", "o": ["choose the option with the same words as the text", "read the whole paragraph and check the tone", "read only the first line", "guess quickly"], "a": 1, "why": "Tone and context show the opinion; copied words can be a trap."}, {"q": "‘Leave no trace’ means…", "o": ["leave a note", "never travel", "walk very fast", "don't leave anything behind in nature"], "a": 3, "why": "It means you leave the place as you found it."}, {"q": "Mass tourism means…", "o": ["travelling alone", "tourism for scientists", "very large numbers of tourists in one place", "a type of hotel"], "a": 2, "why": "Mass tourism is when huge numbers of people visit the same places."}, {"q": "Options with words like ‘always’ or ‘never’ are often…", "o": ["too extreme and wrong", "correct", "about numbers", "the first option"], "a": 0, "why": "Extreme options often don't match a balanced text."}]}, {"n": "73", "t": "Vocabulary: travel and transport", "g": "You will use words for transport, journeys and travel costs, and compare the price of travelling by different types of transport.", "k": "Unit 7 · Have a great trip! · Vocabulary · SB p.80", "terms": [["fare", "плата за проїзд"], ["round-trip ticket", "квиток туди й назад"], ["delay", "затримка"], ["luggage", "багаж"], ["budget", "бюджет"], ["commute", "щоденна поїздка (на роботу/навчання)"]], "th": [{"h": "Confusing travel words", "p": ["These words all mean ‘moving from one place to another’, but we use them differently."], "ul": ["travel (v/n) — подорожувати; подорожі загалом (I love travel.)", "trip — поїздка, коротка подорож з поверненням (a school trip)", "journey — шлях, поїздка з одного місця в інше (a long train journey)", "voyage — подорож морем (a voyage across the ocean)", "flight — переліт (Our flight was delayed.)", "tour — тур, екскурсія (a tour of the castle)"]}, {"h": "Collocations", "p": ["Learn words in groups — it makes your English more natural."], "ul": ["catch / miss a train — встигнути на потяг / запізнитися на потяг", "book a ticket — забронювати квиток", "get on / get off a bus — сісти в / вийти з автобуса", "check in / check out — зареєструватися / виписатися", "pack / unpack your luggage — пакувати / розпаковувати багаж", "set off on a journey — вирушити в дорогу", "a one-way ticket — квиток в один бік"]}, {"h": "How much does it cost? Comparing transport", "p": ["When you plan a trip, you compare price, time and comfort. For example: a train from Rivne to Lviv is usually cheaper than a taxi, but a car can be more convenient for a family with lots of luggage.", "Use comparatives: cheaper than, more comfortable than, not as fast as, the most expensive."], "ul": ["The bus fare is lower, but the journey takes longer.", "Flying is faster but it costs more and has a bigger carbon footprint.", "Travelling by train is more comfortable than travelling by bus.", "If you share a car with friends, the trip becomes cheaper.", "Always check for delays and extra charges for luggage."]}], "f": "", "pr": ["Workbook p. 41, Vocabulary 1.", "Plan an imaginary trip from Rivne to a city you like. Compare two kinds of transport (price, time, comfort) in 6 sentences."], "q": ["What is the difference between ‘trip’ and ‘journey’?", "What do you do at the airport when you ‘check in’?", "What is a fare?", "Which transport is the best for a student with a small budget? Why?"], "qz": [{"q": "We went on a school ___ to the museum and came back in the evening.", "o": ["voyage", "trip", "flight", "fare"], "a": 1, "why": "A trip is a short visit somewhere and back."}, {"q": "Hurry up or we'll ___ the train!", "o": ["lose", "fail", "pass", "miss"], "a": 3, "why": "The collocation is ‘miss a train’."}, {"q": "The money you pay for a bus or train ride is the…", "o": ["fee-ticket", "fair", "fare", "tour"], "a": 2, "why": "Fare is the price of a journey on public transport."}, {"q": "Our plane left two hours late because of a ___.", "o": ["delay", "budget", "luggage", "commute"], "a": 0, "why": "A delay is when something happens later than planned."}, {"q": "Choose the correct sentence.", "o": ["Train is more cheap than taxi.", "The train is the more cheaper.", "The train is cheapest than a taxi.", "The train is cheaper than a taxi."], "a": 3, "why": "One-syllable adjectives take -er + than."}, {"q": "When you leave a hotel, you…", "o": ["check in", "check out", "get on", "set off"], "a": 1, "why": "Check out = pay and leave a hotel."}, {"q": "A long journey across the sea by ship is a…", "o": ["voyage", "flight", "commute", "tour"], "a": 0, "why": "Voyage is a long journey by sea."}]}, {"n": "74", "t": "Grammar: question tags; subject and object questions", "g": "You will form question tags correctly and ask subject and object questions about travel.", "k": "Unit 7 · Have a great trip! · Grammar · SB p.81", "terms": [["question tag", "розділове питання (питальний «хвостик»)"], ["subject question", "питання до підмета"], ["object question", "питання до додатка"], ["auxiliary verb", "допоміжне дієслово"], ["intonation", "інтонація"]], "th": [{"h": "Question tags: form", "p": ["A question tag is a short question at the end of a sentence. We use the same auxiliary verb (or modal/be) as in the sentence. A positive sentence has a negative tag; a negative sentence has a positive tag."], "ul": ["You're from Rivne, aren't you?", "She isn't on holiday, is she?", "They live near the sea, don't they?", "He bought the tickets, didn't he?", "You haven't packed yet, have you?", "We can take the bus, can't we?", "Special: I'm late, aren't I? / Let's go, shall we? / Open the door, will you?"]}, {"h": "Question tags: use and intonation", "p": ["We use question tags to check information or to ask someone to agree. Intonation matters: if your voice goes down, you are almost sure and want agreement; if your voice goes up, it's a real question."], "ul": ["It's a beautiful day, isn't it? ↘ (I'm sure, agree with me)", "The train leaves at six, doesn't it? ↗ (I'm not sure)", "Short answers: Yes, it does. / No, it doesn't.", "Mistake: ✗ You like travelling, isn't it? → ✓ don't you?", "Mistake: ✗ Nobody called, didn't they? → ✓ did they? (nobody = negative)"]}, {"h": "Subject and object questions", "p": ["In an object question we ask about the object (who/what receives the action). We need an auxiliary verb: do/does/did. In a subject question, who or what is the subject, so we do NOT use do/does/did and the word order is like a statement."], "ul": ["Object: Who did Anna meet at the airport? — She met Tom.", "Subject: Who met Anna at the airport? — Tom met her.", "Object: What did you buy in Paris? — A guidebook.", "Subject: What happened on the trip? — The bus broke down.", "Subject: Which bus goes to the station? (✗ Which bus does go…?)", "Subject questions with who usually take a singular verb: Who wants tea?"]}, {"h": "Talk about travel costs", "p": ["Practise both structures while discussing transport prices with a friend or family member."], "ul": ["Travelling by train is cheaper, isn't it?", "Who paid for the tickets?", "What did the tickets cost?", "Which company offers the lowest fares?", "Flights aren't cheap in summer, are they?"]}], "f": "", "pr": ["Workbook p. 42, Grammar 1.", "Write 5 sentences with question tags and 3 pairs of subject/object questions about a family trip (e.g. Who booked the hotel? / What did Dad book?)."], "q": ["How do you choose the right auxiliary for a question tag?", "What is the tag for ‘I am’?", "Why don't we use ‘did’ in ‘Who called you?’", "What does falling intonation in a tag show?"], "qz": [{"q": "You've been to Italy, ___?", "o": ["haven't you", "didn't you", "don't you", "aren't you"], "a": 0, "why": "The sentence uses ‘have’, so the tag is ‘haven't you’."}, {"q": "She didn't miss the bus, ___?", "o": ["didn't she", "was she", "does she", "did she"], "a": 3, "why": "A negative sentence takes a positive tag with the same auxiliary."}, {"q": "I'm right, ___?", "o": ["amn't I", "aren't I", "am not I", "isn't I"], "a": 1, "why": "The tag for ‘I am’ is ‘aren't I’."}, {"q": "Let's go to the beach, ___?", "o": ["shall we", "will we", "don't we", "let we"], "a": 0, "why": "After ‘Let's’ we use ‘shall we’."}, {"q": "Choose "p": ["In the speaking task you discuss ideas with a partner. Give your opinion, give a reason and ask your partner's view."], "ul": ["Giving opinions: I think… / In my opinion… / To be honest…", "Giving reasons: …because… / The main reason is… / For example…", "Agreeing: I agree with you. / That's a good point. / Exactly!", "Disagreeing politely: I see your point, but… / I'm not so sure about that.", "Asking: What do you think? / Don't you agree? / You've been abroad, haven't you?", "Respecting cultures: It's interesting that… / In their culture, people usually…"]}, {"h": "Model dialogue (original)", "p": ["Olena: You visited Georgia last summer, didn't you? Maks: Yes, I did! The people were so friendly. Olena: What surprised you most? Maks: To be honest, the food. Families invite guests for long dinners. Olena: That sounds lovely. I think learning about other customs is the best part of travelling. Maks: I agree. But tourists should learn some local rules first, shouldn't they? Olena: Exactly. For example, in some countries you must cover your shoulders in churches."], "ul": ["Notice the question tags: didn't you? shouldn't they?", "Notice how they agree: I agree, Exactly.", "Notice the reasons and examples."]}], "f": "Ukraine's tradition of Kosiv painted ceramics is on UNESCO's list of Intangible Cultural Heritage in Need of Urgent Safeguarding.", "pr": ["Workbook p. 42, Listening.", "Record yourself (1–2 minutes) answering: ‘Why is it important to respect other cultures when we travel?’ Use at least three phrases from the lesson."], "q": ["Why should you read the questions before listening?", "What is a distractor in a listening task?", "Give two phrases for disagreeing politely.", "How can tourists show respect for local customs?"], "qz": [{"q": "Before you listen, you should…", "o": ["read the questions and underline key words", "close your eyes", "write the answers", "translate every word"], "a": 0, "why": "Key words help you know what to listen for."}, {"q": "In the recording you hear: ‘It didn't cost much.’ This means the trip was…", "o": ["expensive", "long", "cheap", "boring"], "a": 2, "why": "‘Didn't cost much’ is a paraphrase of ‘cheap’."}, {"q": "A polite way to disagree is…", "o": ["You're wrong.", "I see your point, but…", "That's stupid.", "No way!"], "a": 1, "why": "This phrase shows respect for the other person's idea."}, {"q": "Which phrase gives a reason?", "o": ["Hello there.", "What do you think?", "Exactly!", "The main reason is…"], "a": 3, "why": "It introduces a reason for your opinion."}, {"q": "‘Customs’ (in a culture) are…", "o": ["border control only", "shops", "traditional ways of doing things", "souvenirs"], "a": 2, "why": "Customs are traditions and usual behaviour in a culture."}, {"q": "Complete: You've tried Georgian food, ___?", "o": ["haven't you", "didn't you", "don't you", "have you"], "a": 0, "why": "Present perfect ‘have’ → tag ‘haven't you’."}, {"q": "A speaker says ‘At first I wanted the beach, but in the end we chose the mountains.’ Where did they go?", "o": ["the beach", "nowhere", "both", "the mountains"], "a": 3, "why": "The beach is a distractor; ‘in the end’ gives the final answer."}]}, {"n": "76", "t": "Vocabulary: holiday accommodation", "g": "You will name and describe different types of holiday accommodation and compare their costs.", "k": "Unit 7 · Have a great trip! · Vocabulary · SB p.84", "terms": [["accommodation", "житло, помешкання"], ["campsite", "кемпінг"], ["hostel", "хостел"], ["bed and breakfast", "міні-готель з ночівлею та сніданком"], ["facilities", "зручності, обладнання"], ["self-catering", "з самостійним харчуванням"]], "th": [{"h": "Types of accommodation", "p": ["Where you stay can change your whole holiday. Each type of accommodation has advantages and disadvantages, especially when you think about price."], "ul": ["hotel — готель (comfortable but often expensive)", "hostel — хостел (cheap, shared rooms, popular with students)", "campsite — кемпінг (slee
