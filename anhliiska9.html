me exam tasks you must understand what a speaker thinks or feels, not only what they say. The speaker may not say ‘I love it’ directly – listen to the tone of voice and words like ‘to be honest’, ‘not exactly’, ‘I wasn’t too keen on’.", "Read the options before you listen and think about synonyms: ‘disappointed’ may sound like ‘it wasn’t what I expected’."], "ul": ["Read all options and underline the key words.", "Think of synonyms and paraphrases for each option.", "Listen to the whole answer – opinions can change in the middle.", "Notice tone: is the speaker excited, bored, annoyed?", "Phrases of negative attitude: I wasn’t keen on …, It wasn’t worth it.", "Phrases of positive attitude: I was really impressed by …, It was a bargain."]}, {"h": "Speaking: comparing and choosing", "p": ["In a pair task you might choose, for example, the best present for a friend or the best way to spend a shopping budget. Discuss each option, compare them, then agree on one.", "Use these phrases to compare, ask questions and justify your choice."], "ul": ["Comparing: This one is cheaper than …, whereas … / Both options are …", "Asking: Which do you think is better? / What about this one?", "Justifying: I’d choose … because … / The main advantage is … / The problem with … is that …", "Suggesting: Shall we go for …? / What if we …?", "Reaching a decision: So, are we agreed? / Let’s choose … then.", "Money phrases: It’s good value for money. / It’s too pricey. / It’s within our budget."]}, {"h": "Model dialogue", "p": ["A: We have 1,000 hryvnias for a birthday present for Mark. Which do you think is better – a hoodie or a pair of trainers? B: Well, the hoodie is cheaper, whereas good trainers cost more than our budget. A: True. But Mark is someone who does sport every day. B: That’s a good point. What about a sports bag? It’s useful and it’s within our budget. A: I like that idea. The main advantage is that he can use it for training. B: Great, so let’s go for the bag then.", "Practise the dialogue and then change the person and the budget."], "ul": ["Find a phrase used to compare two things.", "Find a relative clause in the dialogue.", "How do A and B reach a decision?", "Which money phrase is used?"]}], "f": "", "pr": ["Workbook p. 24, Listening.", "Record a 1–2 minute talk: You have 500 hryvnias to spend on clothes. What would you buy and why? Compare at least two options."], "q": ["How can you understand a speaker’s attitude if they don’t say it directly?", "Give two phrases to compare options.", "How do you justify a choice?", "What does ‘good value for money’ mean?"], "qz": [{"q": "‘It wasn’t worth it’ shows that the speaker is …", "o": ["satisfied", "disappointed", "excited", "surprised in a good way"], "a": 1, "why": "Not worth it means the speaker didn’t like the result."}, {"q": "Which word is used to show contrast between two options?", "o": ["also", "because", "whereas", "so"], "a": 2, "why": "‘Whereas’ introduces a contrast."}, {"q": "Which phrase helps you justify a choice?", "o": ["What about this one?", "The main advantage is …", "So, are we agreed?", "Shall we …?"], "a": 1, "why": "It gives a reason for your choice."}, {"q": "‘It was a bargain’ means it was …", "o": ["bought cheaply", "broken", "old-fashioned", "very expensive"], "a": 0, "why": "A bargain is something good bought at a low price."}, {"q": "What should you do before listening?", "o": ["Close your eyes", "Translate the instructions", "Read the options and think of synonyms", "Write the answers immediately"], "a": 2, "why": "Synonyms help you recognise paraphrased answers."}, {"q": "In the model dialogue, why do A and B choose the bag?", "o": ["It is useful and within the budget", "Mark asked for it", "It is the most expensive", "It is the most fashionable"], "a": 0, "why": "B says it is useful and within the budget."}, {"q": "Which phrase helps to reach a decision?", "o": ["It’s too pricey.", "Both options are nice.", "I wasn’t keen on it.", "Let’s choose this one then."], "a": 3, "why": "It shows the final agreement."}]}, {"n": "37", "t": "Vocabulary: shopping", "g": "You will learn words and phrases about shopping, money and smart buying decisions and use them in conversations.", "k": "Unit 4 · That’s the fashion · Vocabulary · SB p.48", "terms": [["receipt", "чек"], ["refund", "повернення грошей"], ["discount", "знижка"], ["afford", "дозволити собі (фінансово)"], ["shopping list", "список покупок"], ["bargain", "вигідна покупка"]], "th": [{"h": "Places and people", "p": ["Shopping vocabulary is very practical – you use it every time you buy something, online or in a shop. Learn the words in groups.", "Notice the difference between a ‘customer’ (the person who buys) and a ‘shop assistant’ (the person who works in the shop)."], "ul": ["shopping centre / mall — торговий центр", "market — ринок", "department store — універмаг", "charity shop — благодійний магазин", "online shop — інтернет-магазин", "customer — покупець, клієнт", "shop assistant — продавець-консультант", "cashier — касир"]}, {"h": "Money and buying", "p": ["These words help you talk about prices and smart choices. Being a smart shopper means planning, comparing prices and thinking before you buy.", "Example: I can’t afford these trainers, so I’ll wait for the sale."], "ul": ["price / cost — ціна / коштувати", "on sale / in the sale — у розпродажі", "discount — знижка (a 20% discount)", "receipt — чек (Keep the receipt!)", "refund — повернення коштів (I’d like a refund, please.)", "exchange — обміняти", "afford — дозволити собі", "pay by card / pay in cash — платити карткою / готівкою"]}, {"h": "Collocations and smart shopping", "p": ["Learn these collocations as chunks. They are useful for speaking tasks about money and for writing stories.", "Before you buy, ask yourself three questions: Do I really need it? Can I afford it? Will I use it often?"], "ul": ["go shopping / do the shopping — ходити по магазинах / купувати продукти", "make a shopping list — скласти список покупок", "save up for — відкладати гроші на", "waste money on — марнувати гроші на", "be good value for money — бути вигідним за ціною", "impulse buy — спонтанна покупка", "compare prices — порівнювати ціни", "stick to a budget — дотримуватися бюджету"]}], "f": "", "pr": ["Workbook p. 25, Vocabulary 2.", "Make a shopping list for a school trip with a budget of 800 hryvnias. Write 5 sentences explaining your choices (I need …, I can’t afford …, It’s good value for money because …)."], "q": ["What is the difference between a refund and an exchange?", "Why should you keep the receipt?", "What is an impulse buy?", "How can you stick to a budget?"], "qz": [{"q": "The jacket was broken, so I asked for a …", "o": ["receipt", "refund", "discount", "customer"], "a": 1, "why": "A refund is money given back to you."}, {"q": "I can’t … a new phone – it’s too expensive.", "o": ["pay", "cost", "afford", "spend"], "a": 2, "why": "‘Afford’ means have enough money for something."}, {"q": "The paper that shows what you bought and paid is a …", "o": ["ticket", "list", "receipt", "recipe"], "a": 2, "why": "A receipt is proof of payment."}, {"q": "I’m … up for a new bike.", "o": ["saving", "wasting", "paying", "spending"], "a": 0, "why": "‘Save up for’ means keep money to buy something later."}, {"q": "Buying something you didn’t plan to buy is an …", "o": ["impulse buy", "exchange", "online shop", "discount"], "a": 0, "why": "An impulse buy is a sudden, unplanned purchase."}, {"q": "Translate ‘знижка’.", "o": ["refund", "discount", "exchange", "bargain"], "a": 1, "why": "A discount is a reduction in price."}, {"q": "A person who buys things in a shop is a …", "o": ["manager", "cashier", "shop assistant", "customer"], "a": 3, "why": "A customer buys goods or services."}, {"q": "Good shoppers try to … to their budget.", "o": ["keep on", "stay at", "hold", "stick"], "a": 3, "why": "The collocation is ‘stick to a budget’."}]}, {"n": "38", "t": "Grammar: time clauses; open cloze practice", "g": "You will use time clauses with when, as soon as, before, after, until and while correctly and practise an open cloze task.", "k": "Unit 4 · That’s the fashion · Grammar · SB p.49", "terms": [["time clause", "підрядне речення часу"], ["as soon as", "як тільки"], ["until", "до того як, поки не"], ["while", "поки, у той час як"], ["open cloze", "текст із пропусками без варіантів"]], "th": [{"h": "Time clauses: form and use", "p": ["A time clause tells us when something happens. It starts with a time conjunction: when, as soon as, before, after, until, while, once. It can come at the beginning (with a comma) or at the end of the sentence (no comma).", "Important: when we talk about the future, we use a present tense in the time clause, not ‘will’."], "ul": ["When I get my pocket money, I’ll buy a new T-shirt.", "I’ll call you as soon as I find the shop.", "Before you pay, check the price.", "We’ll wait here until the sale starts.", "After I had paid, I realised it was the wrong size.", "While I was trying on jeans, my phone rang.", "✗ When I will go shopping, I’ll buy shoes. ✓ When I go shopping, I’ll buy shoes."]}, {"h": "Present perfect in time clauses", "p": ["We can use the present perfect in a future time clause to show that the first action will be completely finished before the second one.", "Compare: When I finish my homework, I’ll go out. / When I have finished my homework, I’ll go out. (both are correct; the second stresses completion)"], "ul": ["I’ll lend you the dress after I have worn it to the party.", "Don’t leave until you have tried everything on.", "As soon as I’ve saved enough money, I’ll buy a jacket.", "Past: After she had looked in five shops, she found the perfect bag.", "Linking actions: when (at that moment), while (at the same time), until (up to that moment)"]}, {"h": "Exam tip: open cloze", "p": ["In an open cloze you fill each gap with one word, without options. The missing words are often grammar words: articles, prepositions, pronouns, auxiliary verbs, conjunctions. Read the whole text first to understand the whole meaning, then look at the words before and after each gap.", "Practice: Fill each gap with one word. – Last Saturday I went shopping (1) … my best friend. We waited (2) … the shop opened at ten. (3) … soon as we went in, I saw a jacket (4) … was perfect. (Answers: 1 with, 2 until, 3 As, 4 which/that)"], "ul": ["Read the whole text first for the general meaning.", "Decide what kind of word is missing: verb, preposition, pronoun?", "Check the tense and the subject of the sentence.", "Look for fixed phrases: as soon as, in order to, look forward to.", "Write only ONE word in each gap.", "Check spelling – a misspelt word is usually marked wrong."]}], "f": "", "pr": ["Workbook p. 26, Grammar 2; read Grammar Reference 4.2.", "Write 6 sentences about your plans for next weekend using when, as soon as, before, after, until and while (one each). Remember: no ‘will’ in the time clause."], "q": ["Which tense do we use in a future time clause?", "What is the difference between ‘while’ and ‘until’?", "When do we put a comma in a sentence with a time clause?", "What kinds of words are often missing in an open cloze?"], "qz": [{"q": "I’ll buy the shoes as soon as I … my pocket money.", "o": ["got", "am getting", "will get", "get"], "a": 3, "why": "Future time clauses use a present tense, not ‘will’."}, {"q": "Wait here … I come back.", "o": ["until", "when", "after", "while"], "a": 0, "why": "‘Until’ means up to that moment."}, {"q": "… I was paying, someone took my bag.", "o": ["As soon as", "Until", "While", "Before"], "a": 2, "why": "‘While’ shows two actions at the same time."}, {"q": "Choose the correct sentence.", "o": ["When I will see her, I’ll tell her.", "When I see her, I’ll tell her.", "When I see her, I tell her tomorrow.", "When I will see her, I tell her."], "a": 1, "why": "Present in the time clause, will in the main clause."}, {"q": "Check the size … you buy the jeans.", "o": ["since", "before", "until", "while"], "a": 1, "why": "You check first, then buy."}, {"q": "Open cloze: ‘She’s the girl … sister works in the shop.’ Which word fits?", "o": ["whose", "that", "who", "which"], "a": 0, "why": "Possession – ‘whose sister’."}, {"q": "In an open cloze you should write …", "o": ["the letter of the option", "two or three words in each gap", "only one word in each gap", "a full sentence"], "a": 2, "why": "Open cloze gaps take exactly one word."}, {"q": "I’ll lend you my jacket after I … it to the concert.", "o": ["wore", "am wearing", "will wear", "have worn"], "a": 3, "why": "Present perfect in a future time clause shows a completed action."}]}, {"n": "39", "t": "Writing: a story", "g": "You will learn how to plan and write a short story with a clear beginning, middle and end, using time linkers and fixed phrases.", "k": "Unit 4 · That’s the fashion · Writing · SB pp.50-51", "terms": [["plot", "сюжет"], ["setting", "місце й час дії"], ["main character", "головний герой"], ["linking word", "слово-зв’язка"], ["ending", "кінцівка"]], "th": [{"h": "Story structure", "p": ["A good story has a clear plan. In an exam you are often given the first sentence or the last sentence – your story must match it. Usually the story is told in the past, so you use the past simple, past continuous and past perfect.", "Plan before you write: who, where, when, what happened, how it ended."], "ul": ["Paragraph 1 – Beginning: set the scene (who, where, when). Catch the reader’s attention.", "Paragraph 2 – Middle: events in order; something unexpected happens.", "Paragraph 3 – Climax: the most exciting or important moment.", "Paragraph 4 – Ending: how the problem was solved; feelings at the end.", "Give your story an interesting title.", "Use the exact first/last sentence from the task."]}, {"h": "Useful language: linkers and fixed phrases", "p": ["Time linkers show the order of events and make your story easy to follow. Fixed phrases and adjectives make it more interesting.", "Try to use direct speech once or twice – it brings your characters to life."], "ul": ["Beginning: It all started when … / One sunny morning … / It was the day of …", "Sequence: First, … Then, … After that, … Later, … Finally, …", "Time clauses: As soon as …, While …, When …, Before …", "Surprise: Suddenly, … / All of a sudden, … / To my surprise, …", "Feelings: I couldn’t believe my eyes. / My heart was beating fast. / I was over the moon.", "Ending: In the end, … / Luckily, … / It was a day I will never forget."]}, {"h": "Model story and checklist", "p": ["The perfect jacket. It all started when I saw a jacket in a small charity shop. It was dark green, with silver buttons, and it cost only 200 hryvnias. Unfortunately, I didn’t have any money with me. As soon as I got home, I emptied my piggy bank and ran back. While I was running, I kept thinking, ‘What if someone has bought it?’ When I arrived, the shop assistant smiled. ‘I’ve been keeping it for you,’ she said. ‘You looked at it for so long!’ I was over the moon. Now it is my favourite jacket, and every time I wear it, I remember her kindness.", "Check your story with this list:"], "ul": ["Does the story match the first/last sentence in the task?", "Is there a clear beginning, middle and end?", "Did I use past tenses correctly?", "Did I use time linkers and at least one time clause?", "Are there adjectives and feelings to make it interesting?", "Is it the right length (usually 100–150 words)?"]}], "f": "", "pr": ["Workbook p. 27, Writing; study the Writing Reference for stories.", "Write a story (100–150 words) that begins: ‘I had never seen such an unusual outfit before.’ Use at least four time linkers."], "q": ["What are the four parts of a story?", "Which tenses do we usually use in a story?", "Name three linking words that show the order of events.", "Why is it important to use the exact first sentence from the task?"], "qz": [{"q": "Which tense is most common in a story?", "o": ["present simple", "past simple", "future simple", "present continuous"], "a": 1, "why": "Stories usually describe past events."}, {"q": "Which linker shows something unexpected?", "o": ["Then", "Suddenly", "Finally", "First"], "a": 1, "why": "‘Suddenly’ introduces a surprise."}, {"q": "Where do you usually describe the setting?", "o": ["Nowhere", "In the ending", "In the beginning", "In the title only"], "a": 2, "why": "The beginning tells the reader who, where and when."}, {"q": "‘I was over the moon’ means I was …", "o": ["very tired", "in space", "angry", "very happy"], "a": 3, "why": "It is an idiom meaning extremely happy."}, {"q": "If the task gives you the first sentence, you should …", "o": ["not use it", "change it a little", "use it exactly as it is", "put it at the end"], "a": 2, "why": "You must use the given sentence exactly."}, {"q": "Which phrase is good for an ending?", "o": ["In the end, …", "While I was …", "It all started when …", "One sunny morning …"], "a": 0, "why": "‘In the end’ introduces the conclusion."}, {"q": "In the model story, why did the shop assistant keep the jacket?", "o": ["The girl had looked at it for a long time", "Nobody liked it", "Her boss told her to", "It was broken"], "a": 0, "why": "She says: ‘You looked at it for so long!’"}]}, {"n": "40", "t": "Video: From fleece jackets to your food", "g": "You will understand how synthetic clothes can pollute the environment, take notes while watching and summarise what you have learnt.", "k": "Unit 4 · That’s the fashion · Video · SB p.52", "terms": [["microplastics", "мікропластик"], ["synthetic", "синтетичний"], ["fibre", "волокно"], ["food chain", "харчовий ланцюг"], ["washing machine", "пральна машина"], ["take notes", "робити нотатки"]], "th": [{"h": "Background: plastic in our clothes", "p": ["Many modern clothes, like fleece jackets, sportswear and leggings, are made from synthetic materials such as polyester and nylon. These materials are a kind of plastic. When we wash them, tiny plastic fibres break off and go down the drain with the water.", "Some of these fibres are so small that water treatment plants cannot catch them all. They end up in rivers and the sea, where small sea animals eat them. Bigger animals eat the small ones – and in the end, microplastics can reach the food on our plates. This is the connection the video title talks about: from fleece jackets to your food."], "ul": ["synthetic — синтетичний (polyester, nylon, acrylic)", "natural fibres — натуральні волокна (cotton, wool, linen)", "shed fibres — втрачати волокна", "drain — злив, каналізація", "marine animals — морські тварини", "filter — фільтр; фільтрувати"]}, {"h": "Taking notes while watching", "p": ["When you watch a video, you cannot write everything. Write only key words, numbers and names. Use abbreviations and symbols to save time.", "After watching, use your notes to write a short summary – 3–5 sentences in your own words."], "ul": ["Use symbols: → (leads to), + (and), = (means), ↑ (increase), ↓ (decrease).", "Write key words, not full sentences.", "Note numbers and examples.", "Organise notes: problem → cause → effects → solutions.", "Summary starter: The video is about … It shows that … The main problem is … We can …"]}, {"h": "Discussion and solutions", "p": ["Discuss the questions with a partner or think about them alone and write short answers. Use vocabulary from Units 3 and 4 and the present perfect: Have you ever thought about …?", "What can we do? Here are some ideas – which ones are realistic for you?"], "ul": ["Wash synthetic clothes less often and at lower temperatures.", "Fill the washing machine – fewer, fuller washes.", "Choose natural fabrics when possible.", "Buy fewer clothes and wear them longer.", "Did the video change your opinion about fast fashion? Why?", "Who should solve this problem: people, companies or governments?"]}], "f": "Fleece fabric is usually made from polyester, and much of it is produced from recycled plastic bottles.", "pr": ["Revise the Student Resources Unit 3 and Unit 4 Wordlists and write a short reflection: 5 words you know well and 5 words you still find difficult.", "Write a summary (60–80 words) of the topic ‘From fleece jackets to your food’ using your notes and the summary starters."], "q": ["What are synthetic materials made from?", "How do microfibres get from our clothes into the sea?", "How can microplastics reach our food?", "Name two things you can do to reduce the problem."], "qz": [{"q": "Fleece jackets are usually made of …", "o": ["polyester", "silk", "cotton", "wool"], "a": 0, "why": "Fleece is usually a synthetic polyester fabric."}, {"q": "Microfibres from clothes mostly enter the water when we …", "o": ["wear them", "wash them", "buy them", "iron them"], "a": 1, "why": "Tiny fibres break off during washing."}, {"q": "Which is a natural fibre?", "o": ["polyester", "acrylic", "linen", "nylon"], "a": 2, "why": "Linen comes from a plant (flax)."}, {"q": "‘Food chain’ means …", "o": ["a chain of restaurants", "the order in which animals eat other living things", "a shopping list", "a kitchen tool"], "a": 1, "why": "A food chain shows who eats whom in nature."}, {"q": "Which is the best way to take notes while watching?", "o": ["Translate everything into Ukrainian", "Write every word", "Write key words and use symbols", "Write nothing"], "a": 2, "why": "Key words and symbols save time."}, {"q": "Which action helps reduce microplastic pollution?", "o": ["Washing synthetic clothes less often", "Throwing old clothes in the river", "Washing half-empty loads often", "Buying more synthetic clothes"], "a": 0, "why": "Fewer washes mean fewer fibres released."}, {"q": "Which sentence is a good summary starter?", "o": ["Dear Sir, …", "Best wishes, …", "Once upon a time …", "The video is about …"], "a": 3, "why": "It introduces the main topic of the video."}]}, {"n": "41", "t": "End-of-Unit 4 Revision: That’s the fashion", "g": "You will revise the vocabulary and grammar of Unit 4 and identify what you need to practise before the Progress Test.", "k": "Unit 4 · That’s the fashion · End-of-Unit Revision", "terms": [["relative clause", "підрядне означальне речення"], ["time clause", "підрядне речення часу"], ["clothes", "одяг"], ["shopping", "покупки"], ["self-assessment", "самооцінювання"]], "th": [{"h": "Vocabulary summary", "p": ["Unit 4 had two vocabulary topics: clothes and fabrics, and shopping. Test yourself: look at each word and say a sentence with it.", "Pay special attention to confusing words: fit / suit / match, receipt / recipe, cost / price."], "ul": ["Clothes: hoodie, jacket, trousers, suit, trainers, scarf, belt, vyshyvanka", "Fabrics: cotton, wool, silk, leather, linen, denim", "Patterns and fit: striped, checked, spotted, plain, loose, tight, baggy", "Phrasal verbs: put on, take off, try on, dress up, grow out of", "Shopping: receipt, refund, discount, exchange, afford, bargain, customer", "Collocations: save up for, waste money on, stick to a budget, good value for money"]}, {"h": "Grammar summary", "p": ["Relative clauses: who (people), which (things), that (people/things, defining only), whose (possession), where (place), when (time). Defining – no commas; non-defining – commas, no ‘that’. Time clauses: when, as soon as, before, after, until, while – present tense for the future, no ‘will’.", "Mini-examples:"], "ul": ["The girl who sells hats is my neighbour.", "The shop where I buy fabric is in the centre.", "My jacket, which I bought online, is too big.", "That’s the designer whose show we watched.", "I’ll pay as soon as the shop assistant comes.", "Don’t buy anything until you have compared the prices."]}, {"h": "Check yourself", "p": ["Mark each statement: I can do this well / I need more practice. Plan when you will review the weak points before the Progress Test.", "Tip: revise Unit 3 too – the Progress Test covers both units."], "ul": ["I can describe clothes using patterns, fabrics and fit.", "I can talk about shopping and smart money choices.", "I can use defining and non-defining relative clauses.", "I can use time clauses about the future without ‘will’.", "I can guess new words from context.", "I can write a short story with a clear structure."]}], "f": "", "pr": ["Workbook p. 79, Review Unit 4.", "Make a one-page summary (table or mind map) of Unit 4 vocabulary and grammar and add it to your Unit 3 summary."], "q": ["Which relative pronoun do we use for possession?", "Why can’t we use ‘that’ in a non-defining clause?", "Which tense follows ‘as soon as’ when we talk about the future?", "What is the difference between ‘fit’ and ‘suit’?"], "qz": [{"q": "The shop … sells vintage clothes is closed today.", "o": ["where", "whose", "who", "that"], "a": 3, "why": "‘That’ can be used for things in a defining clause."}, {"q": "I’ll tell you as soon as I … the results.", "o": ["knew", "am knowing", "will know", "know"], "a": 3, "why": "Present simple in a future time clause."}, {"q": "Choose the correct sentence.", "o": ["My aunt, whose is a designer, lives in Lviv.", "My aunt, that is a designer, lives in Lviv.", "My aunt, who is a designer, lives in Lviv.", "My aunt who is a designer, lives in Lviv."], "a": 2, "why": "Non-defining clause about a person: commas + who."}, {"q": "These jeans are too small – they don’t … me.", "o": ["suit", "fit", "match", "go"], "a": 1, "why": "‘Fit’ is about size."}, {"q": "I was given 30% off. It was a …", "o": ["discount", "budget", "refund", "receipt"], "a": 0, "why": "A discount reduces the price."}, {"q": "A warm winter hat is often made of …", "o": ["wool", "denim", "linen", "silk"], "a": 0, "why": "Wool is a warm fabric."}, {"q": "That’s the girl … brother is a model.", "o": ["who", "whose", "which", "where"], "a": 1, "why": "‘Whose’ shows possession."}, {"q": "Can I … on this dress, please?", "o": ["dress", "put", "try", "take"], "a": 2, "why": "‘Try on’ means check if clothes fit before buying."}]}, {"n": "42", "t": "Progress Test: Units 3 and 4", "g": "You will know what the Progress Test checks, how to prepare for it and how to reflect on your skills and knowledge after it.", "k": "Unit 4 · That’s the fashion · Progress Test · Units 3&4", "terms": [["progress test", "контрольна робота за розділами"], ["task type", "тип завдання"], ["instructions", "інструкція (до завдання)"], ["reflection", "рефлексія, осмислення"], ["strengths and weaknesses", "сильні й слабкі сторони"]], "th": [{"h": "What the test checks", "p": ["The Progress Test covers everything from Units 3 and 4. It checks vocabulary, grammar and skills: reading, listening, and sometimes writing.", "Use your Unit 3 and Unit 4 summaries to revise. Focus on the points you marked ‘I need more practice’."], "ul": ["Vocabulary: geography and climate change, environmental protection, clothes and fabrics, shopping", "Grammar: present perfect simple and continuous, articles, relative clauses, time clauses", "Reading: main idea, guessing words from context", "Listening: specific information, speakers’ opinions and attitudes", "Writing: an informal email or a short story", "Use of English: multiple choice, word formation, open cloze"]}, {"h": "Test strategies", "p": ["Read the instructions for each task carefully – many mistakes happen because students don’t follow them. Manage your time: don’t spend too long on one difficult question.", "At the end, always leave a few minutes to check your answers."], "ul": ["Start with the tasks you find easiest.", "Underline key words in the instructions.", "In multiple choice, cross out options that are clearly wrong.", "In an open cloze, write only one word per gap.", "Check tense, articles and spelling.", "Never leave a gap empty – make your best guess."]}, {"h": "Sample tasks and reflection", "p": ["Try these mini-tasks. 1) Choose: I (have read / have been reading) three books this month. (have read – we say how many) 2) Complete: The woman ___ shop I like sells handmade scarves. (whose) 3) Correct the mistake: When I will get home, I’ll call you. (When I get home …) 4) Article: ___ Dnipro is the longest river in Ukraine. (The)", "After the test, reflect on your results with these questions."], "ul": ["Which task was the easiest for me? Why?", "Which task was the most difficult?", "What mistakes did I make most often (grammar, vocabulary, spelling)?", "What will I do differently next time?", "Which topic from Units 3–4 do I want to revise again?"]}], "f": "", "pr": ["Revise your Unit 3 and Unit 4 summaries and redo the exercises you found difficult in the Workbook reviews (pp. 78–79).", "After the test, write a short reflection (5–6 sentences): what went well, what was difficult and your plan for improvement."], "q": ["Which grammar points from Units 3 and 4 will be tested?", "What should you do if you don’t know an answer?", "Why is it important to read the instructions carefully?", "What will you do to improve your weak points?"], "qz": [{"q": "How long … for the test? – Since Monday.", "o": ["did you prepare", "are you preparing", "do you prepare", "have you been preparing"], "a": 3, "why": "‘How long’ + ‘since’ – present perfect continuous for an activity up to now."}, {"q": "… Black Sea is in the south of Ukraine.", "o": ["A", "The", "An", "— (no article)"], "a": 1, "why": "Names of seas take ‘the’."}, {"q": "The boy … is wearing a blue hoodie is my brother.", "o": ["which", "whose", "who", "where"], "a": 2, "why": "‘Who’ is used for people."}, {"q": "Call me when you … at the shopping centre.", "o": ["arriving", "will arrive", "arrive", "arrived"], "a": 2, "why": "Present simple in a future time clause."}, {"q": "What should you do if you don’t know an answer?", "o": ["Make your best guess", "Write two answers", "Stop the test", "Leave it empty"], "a": 0, "why": "A guess may be correct; an empty gap always gets zero."}, {"q": "We need to … carbon emissions.", "o": ["fall", "decrease down", "make little", "reduce"], "a": 3, "why": "The collocation is ‘reduce emissions’."}, {"q": "I kept the … so I could get a refund.", "o": ["recipe", "receipt", "discount", "bargain"], "a": 1, "why": "You need a receipt to return items."}, {"q": "What is the best first step in any test task?", "o": ["Read the instructions carefully", "Write quickly without reading", "Check the answers of a friend", "Start with the last task"], "a": 0, "why": "Instructions tell you exactly what to do."}]}]}, {"name": "Unit 5. Where we live (Де ми живемо)", "lessons": [{"n": "43", "t": "Unit Opener: Where we live — homes and household items", "g": "You will talk about different types of homes and learn key vocabulary for houses, rooms and household items.", "k": "Unit 5 · Where we live · Unit Opener + Vocabulary for Reading · SB pp.53-54", "terms": [["detached house", "окремий (відокремлений) будинок"], ["block of flats", "багатоквартирний будинок"], ["neighbourhood", "район, околиця"], ["household items", "побутові предмети"], ["to share", "ділити, користуватися спільно"]], "th": [{"h": "Welcome to Unit 5: Where we live", "p": ["People live in many different kinds of homes: tall blocks of flats in big cities, small cottages in villages, houseboats on rivers and even homes built into hills. Where we live depends on money, climate, family size and personal taste. In this unit you will talk about homes, household items and plans for the future."], "ul": ["Do you live in a house or a flat? What do you like about it?", "Would you prefer to live in the city centre or in the countryside? Why?", "What is the most important room in your home for you?", "Can people from different cultures live happily in the same building? What helps?", "What would your dream home look like?"]}, {"h": "Types of homes", "p": ["Learn these words with their translations. Try to say one true sentence about each type of home."], "ul": ["detached house — окремий будинок (no walls shared with neighbours)", "semi-detached house — будинок на дві родини", "terraced house — будинок у ряду, таунхаус", "flat / apartment — квартира", "cottage — невеликий сільський будиночок", "houseboat — житловий човен", "skyscraper — хмарочос", "suburbs — передмістя: We live in the suburbs, 20 minutes from the centre."]}, {"h": "Parts of a home and household items", "p": ["These words help you describe what is inside a home. Notice that many household items are compound nouns made of two words."], "ul": ["ground floor / top floor — перший / верхній поверх", "balcony — балкон; lift — ліфт; stairs — сходи", "fridge — холодильник; cooker — плита; microwave — мікрохвильовка", "washing machine — пральна машина; dishwasher — посудомийна машина", "wardrobe — шафа для одягу; chest of drawers — комод", "rug — килимок; curtains — штори; cushion — диванна подушка"]}], "f": "Before it described very tall buildings, the word ‘skyscraper’ was used for a high sail on a ship.", "pr": ["Study the Student Resources Unit 5 Wordlist on your own: copy 15 words with translations into your vocabulary notebook.", "Draw a simple plan of your home and label every room and at least 10 household items in English."], "q": ["What is the difference between a detached and a semi-detached house?", "Name five household items you can find in a kitchen.", "What type of home do you live in, and what do you like about it?"], "qz": [{"q": "A house that shares no walls with other houses is a…", "o": ["terraced house", "block of flats", "detached house", "semi-detached house"], "a": 2, "why": "‘Detached’ means separate, not joined to another building."}, {"q": "Which word means ‘передмістя’?", "o": ["suburbs", "centre", "countryside", "village"], "a": 0, "why": "Suburbs are areas on the edge of a city where people live."}, {"q": "You keep your clothes in a…", "o": ["dishwasher", "cooker", "rug", "wardrobe"], "a": 3, "why": "A wardrobe is a tall cupboard for clothes."}, {"q": "Which item is NOT usually in a kitchen?", "o": ["fridge", "chest of drawers", "cooker", "microwave"], "a": 1, "why": "A chest of drawers is usually in a bedroom."}, {"q": "A ‘houseboat’ is…", "o": ["a boat that carries houses", "a home on the water", "a shed for boats", "a garage"], "a": 1, "why": "A houseboat is a boat that people live on."}, {"q": "We live on the top floor, so we usually take the ___ .", "o": ["cushion", "balcony", "rug", "lift"], "a": 3, "why": "A lift carries people up and down in a building."}]}, {"n": "44", "t": "Reading: Living closer to the sky — high-rise homes", "g": "You will read a text about life in tall buildings, find the writer’s main idea and discuss the pros and cons of different homes.", "k": "Unit 5 · Where we live · Reading · SB pp.54-55", "terms": [["main idea", "головна думка"], ["high-rise", "багатоповерховий"], ["resident", "мешканець"], ["green space", "зелена зона"], ["to save energy", "заощаджувати енергію"], ["writer’s purpose", "мета автора"]], "th": [{"h": "Before you read: finding the main idea", "p": ["The main idea is the most important message of a text. It is not a small detail. Often the writer gives it in the first or last paragraph, and each paragraph supports it with examples."], "ul": ["Read the title and the first and last paragraphs first.", "Ask yourself: what does the writer want me to think or understand?", "Underline repeated key words — they often show the main topic.", "Do not choose an option just because it uses words from the text.", "Check that the answer is true for the WHOLE text, not one sentence."]}, {"h": "Original text: Life on the 30th floor", "p": ["Maya is fifteen and lives on the thirtieth floor of a tower in a busy city. Every morning she sees the sunrise over the roofs, and at night the city lights shine like stars. ‘It’s quiet up here, and the air feels fresher,’ she says. But high-rise life is not always easy. When the lift breaks, Maya has to climb more than five hundred steps. Her family also misses having a garden.", "Many cities are building taller homes because land is expensive and more people want to live near schools and jobs. Architects say tall buildings can save energy and space, especially if they have solar panels and roof gardens. Some new towers even have shared terraces where neighbours grow vegetables together. Living close to the sky has its problems, but for many families it is a smart way to live in a crowded world."], "ul": ["Main idea: high-rise homes have some problems, but they can be a good solution for crowded cities.", "Detail (not main idea): the lift sometimes breaks.", "Detail: Maya sees the sunrise every morning."]}, {"h": "Exam tip and discussion", "p": ["In a main-idea task, cross out options that are too narrow (only one detail), too general (about all homes in the world) or not mentioned. Then talk about your opinion using the language below."], "ul": ["I think living in a tower is… because…", "One advantage / disadvantage is that…", "In my opinion, the best type of home for a family is…", "Tall buildings help the environment because they use less land.", "Green roofs and solar panels make buildings more eco-friendly."]}], "f": "The Burj Khalifa in Dubai, about 828 metres tall, has been the world’s tallest building since 2010.", "pr": ["Workbook p. 28: do the reading task and read the Exam Reminder.", "Write 60–80 words: Would you like to live on the 30th floor? Give two reasons."], "q": ["What is a main idea, and how is it different from a detail?", "Where in a text can you often find the main idea?", "Name two advantages and two disadvantages of living in a high-rise building."], "qz": [{"q": "What is the main idea of the text about Maya?", "o": ["High-rise homes have problems but can suit crowded cities.", "Maya loves sunrises.", "Lifts often break in tall buildings.", "Gardens are better than balconies."], "a": 0, "why": "This idea covers the whole text, not just one detail."}, {"q": "Why are cities building taller homes, according to the text?", "o": ["Towers are cheaper to clean.", "People like climbing stairs.", "Land is expensive and people want to live near jobs.", "Gardens are not allowed."], "a": 2, "why": "The second paragraph gives these reasons."}, {"q": "An option that describes only one small fact is usually…", "o": ["the main idea", "too general", "too narrow", "the title"], "a": 2, "why": "A single detail is too narrow to be the main idea."}, {"q": "What problem does Maya have when the lift breaks?", "o": ["She has to climb many steps.", "She misses school.", "She loses her keys.", "She cannot see the city."], "a": 0, "why": "The text says she climbs more than five hundred steps."}, {"q": "A ‘resident’ is a person who…", "o": ["builds houses", "visits a city", "sells flats", "lives in a place"], "a": 3, "why": "Residents live in a building or area."}, {"q": "Which is the best first step for a main-idea question?", "o": ["Read every word slowly.", "Read the title and the first and last paragraphs.", "Look only at numbers.", "Choose the longest option."], "a": 1, "why": "The title and opening/closing paragraphs often show the main idea."}]}, {"n": "45", "t": "Vocabulary: homes, rooms and household items", "g": "You will use words and collocations about homes and household items to describe where you live.", "k": "Unit 5 · Where we live · Vocabulary · SB p.56", "terms": [["to move house", "переїжджати"], ["to rent", "орендувати, винаймати"], ["landlord", "власник житла, орендодавець"], ["spacious", "просторий"], ["cosy", "затишний"], ["furniture", "меблі"]], "th": [{"h": "Describing homes", "p": ["Adjectives make your descriptions more interesting. Use them before a noun or after the verb ‘be’: a cosy room / The room is cosy."], "ul": ["spacious — просторий: a spacious living room", "cramped — тісний: a cramped kitchen", "cosy — затишний: a cosy bedroom", "modern — сучасний; old-fashioned — старомодний", "bright — світлий; dark — темний", "noisy — галасливий; peaceful — спокійний"]}, {"h": "Collocations about homes", "p": ["Collocations are words that often go together. Learn them as one unit, for example ‘move house’, not ‘change house’."], "ul": ["move house — переїжджати: We moved house last summer.", "rent a flat — винаймати квартиру", "pay the rent / bills — платити оренду / рахунки", "share a room — жити в одній кімнаті з кимось", "do up a house — ремонтувати будинок", "feel at home — почуватися як удома"]}, {"h": "Household items and the word ‘furniture’", "p": ["‘Furniture’ is uncountable in English. We say ‘some furniture’ or ‘a piece of furniture’, never ‘a furniture’ or ‘furnitures’. The same is true for ‘equipment’."], "ul": ["a piece of furniture — предмет меблів", "sofa / armchair — диван / крісло", "bookshelf — книжкова полиця", "lamp — лампа; mirror — дзеркало", "kettle — чайник; toaster — тостер", "iron — праска; vacuum cleaner — пилосос", "Eco tip: switch off lamps and unplug the kettle to save electricity."]}], "f": "The English word ‘kitchen’ comes from the Latin word ‘coquina’, which is connected with cooking.", "pr": ["Workbook p. 29: Vocabulary exercises.", "Describe your room in 6–8 sentences using at least four adjectives and two collocations from this lesson."], "q": ["Why can’t we say ‘a furniture’? What do we say instead?", "What is the opposite of ‘spacious’?", "Make a sentence with ‘move house’ or ‘share a room’."], "qz": [{"q": "Our kitchen is very small and ___ ; there’s no space for a table.", "o": ["spacious", "cramped", "bright", "peaceful"], "a": 1, "why": "‘Cramped’ means too small, with not enough space."}, {"q": "Choose the correct sentence.", "o": ["We bought a new furniture.", "We bought new furnitures.", "We bought a furnitures.", "We bought some new furniture."], "a": 3, "why": "‘Furniture’ is uncountable, so we use ‘some’ with no plural."}, {"q": "My family ___ house three times when I was a child.", "o": ["moved", "changed", "made", "did"], "a": 0, "why": "The collocation is ‘move house’."}, {"q": "A ‘landlord’ is a person who…", "o": ["builds roads", "cleans flats", "owns a home and rents it to others", "sells furniture"], "a": 2, "why": "A landlord receives rent from the people who live in the home."}, {"q": "You use a ___ to make clothes smooth.", "o": ["kettle", "toaster", "iron", "mirror"], "a": 2, "why": "An iron removes creases from clothes."}, {"q": "Which word means ‘затишний’?", "o": ["cosy", "noisy", "modern", "dark"], "a": 0, "why": "Cosy describes a warm, comfortable place."}]}, {"n": "46", "t": "Grammar: will and be going to", "g": "You will understand when to use ‘will’ and when to use ‘be going to’ and use both forms correctly.", "k": "Unit 5 · Where we live · Grammar · SB p.57", "terms": [["intention", "намір"], ["prediction", "передбачення, прогноз"], ["evidence", "доказ, ознака"], ["spontaneous decision", "спонтанне рішення"], ["promise", "обіцянка"], ["offer", "пропозиція (допомоги)"]], "th": [{"h": "Form", "p": ["‘Will’ is the same for all persons and is followed by the base form of the verb. ‘Be going to’ changes the verb ‘be’: am / is / are going to + base form."], "ul": ["will: I will (I’ll) help you. / She won’t (will not) come. / Will they move?", "be going to: I’m going to paint my room.", "He isn’t going to rent that flat.", "Are you going to buy a new sofa? — Yes, I am. / No, I’m not.", "Short answers with will: Will it rain? — Yes, it will. / No, it won’t."]}, {"h": "When do we use ‘will’?", "p": ["We use ‘will’ for decisions made at the moment of speaking, for offers, promises and requests, and for predictions based on our opinion or belief."], "ul": ["Decision now: The phone is ringing. — I’ll answer it!", "Offer: That box looks heavy. I’ll carry it for you.", "Promise: I won’t forget to water the plants.", "Request: Will you close the window, please?", "Opinion prediction: I think people will live in smaller homes in 2050.", "Typical words: I think, I’m sure, probably, maybe, I hope"]}, {"h": "When do we use ‘be going to’?", "p": ["We use ‘be going to’ for plans and intentions we decided before speaking, and for predictions based on what we can see or know now (evidence)."], "ul": ["Plan: We’re going to move to a bigger flat next year.", "Intention: I’m going to tidy my room this weekend.", "Evidence: Look at those dark clouds! It’s going to rain.", "Evidence: Careful! That glass is going to fall.", "Common mistake: ✗ I will to help → ✓ I will help.", "Common mistake: ✗ She going to come → ✓ She is going to come."]}], "f": "In Old English, the ancestor of the word ‘will’ meant ‘to want’ or ‘to wish’.", "pr": ["Workbook p. 30: Grammar 1.", "Write 3 plans for next weekend with ‘be going to’ and 3 predictions about homes of the future with ‘will’."], "q": ["Which form do we use for a decision made at the moment of speaking?", "Which form do we use for a prediction based on evidence we can see?", "How do you make a negative with ‘will’?", "Correct the mistake: ‘They going to buy a house.’"], "qz": [{"q": "‘I’m thirsty.’ — ‘Wait, I ___ get you some water.’", "o": ["am going to", "am", "going to", "will"], "a": 3, "why": "This is a spontaneous decision/offer, so we use ‘will’."}, {"q": "Look at that sky! It ___ snow.", "o": ["will", "is going to", "won’t", "is going"], "a": 1, "why": "There is visible evidence, so we use ‘be going to’."}, {"q": "We’ve already decided. We ___ paint the kitchen yellow.", "o": ["will", "are going to", "would", "going"], "a": 1, "why": "A plan made before speaking uses ‘be going to’."}, {"q": "Choose the correct negative.", "o": ["I willn’t tell anyone.", "I don’t will tell anyone.", "I not will tell anyone.", "I won’t tell anyone."], "a": 3, "why": "The negative of ‘will’ is ‘won’t’ (will not)."}, {"q": "I think robots ___ do most housework in the future.", "o": ["will", "going to", "is going to", "are going"], "a": 0, "why": "A prediction based on opinion (‘I think’) usually uses ‘will’."}, {"q": "Which sentence is a promise?", "o": ["It’s going to rain.", "She’s going to study law.", "I’ll call you tonight, I promise.", "Are they going to move?"], "a": 2, "why": "Promises use ‘will’."}, {"q": "___ you going to rent the flat?", "o": ["Will", "Do", "Are", "Is"], "a": 2, "why": "Questions with ‘going to’ start with am/is/are; with ‘you’ we use ‘are’."}]}, {"n": "47", "t": "Listening and Speaking: choosing a home and smart buying", "g": "You will practise listening for specific information and learn phrases to ask questions, give reasons and make decisions together.", "k": "Unit 5 · Where we live · Listening + Speaking · SB pp.58-59", "terms": [["to afford", "дозволити собі (фінансово)"], ["bargain", "вигідна покупка"], ["value for money", "співвідношення ціни та якості"], ["to compare", "порівнювати"], ["to agree / disagree", "погоджуватися / не погоджуватися"]], "th": [{"h": "Listening strategies", "p": ["Before you listen, read the questions and options carefully. Think about what kind of information you need: a number, a place, a reason or an opinion. Remember that speakers often mention several options before they give the right one."], "ul": ["Underline key words in each question.", "Predict possible answers before you listen.", "Listen for words that change meaning: but, actually, in fact, instead.", "Do not choose an option just because you hear the same word.", "Use the second listening to check your answers.", "Never leave an answer blank — make a good guess."]}, {"h": "Useful phrases for discussing and deciding", "p": ["In a speaking task you often discuss options with a partner and agree on one. Ask your partner’s opinion, give reasons and react politely."], "ul": ["Asking: What do you think about…? / Which one would you choose?", "Giving opinion: I’d say… / In my view… / The main reason is…", "Agreeing: That’s a good point. / I totally agree.", "Disagreeing politely: I see what you mean, but… / I’m not so sure.", "Smart buying: Can we afford it? / Is it good value for money? / Do we really need it?", "Deciding: So, shall we go for…? / Let’s choose… because…"]}, {"h": "Model dialogue (original)", "p": ["Two friends are choosing one thing to buy for their new shared student flat with a small budget."], "ul": ["A: We’ve got 100 euros. What do you think we should buy first?", "B: I’d say a microwave. We’re going to cook every day.", "A: That’s a good point, but the flat already has a cooker. What about a desk?", "B: Hmm, I see what you mean. A second-hand desk is a real bargain.", "A: Exactly. It’s good value for money, and we need it for studying.", "B: OK, let’s go for the desk and buy a microwave next month."]}], "f": "", "pr": ["Workbook p. 30: Listening.", "Record a 1-minute audio: you have 200 euros for your room. What will you buy and why? Use at least three phrases from this lesson."], "q": ["What should you do before you listen to a recording?", "Give two polite ways to disagree.", "What questions can you ask yourself before you buy something?"], "qz": [{"q": "‘Can we afford it?’ means…", "o": ["Do we have enough money for it?", "Do we like it?", "Is it big enough?", "Is it new?"], "a": 0, "why": "‘Afford’ means to have enough money to pay for something."}, {"q": "Which phrase is a polite way to disagree?", "o": ["You’re wrong.", "No way!", "That’s stupid.", "I see what you mean, but…"], "a": 3, "why": "It shows respect before giving a different opinion."}, {"q": "In a listening task, speakers often…", "o": ["give only the correct answer", "mention several options before the correct one", "speak very slowly", "repeat each answer three times"], "a": 1, "why": "Distractors are common, so listen to the whole part."}, {"q": "A ‘bargain’ is…", "o": ["a broken item", "something good that you buy cheaply", "a bank", "a shop assistant"], "a": 1, "why": "A bargain costs less than its real value."}, {"q": "Which word often signals a change of mind in a recording?", "o": ["and", "also", "so", "actually"], "a": 3, "why": "‘Actually’ often introduces a correction or a different answer."}, {"q": "Which phrase helps you finish a discussion and decide?", "o": ["So, shall we go for this one?", "What do you think?", "I’m not so sure.", "In my view…"], "a": 0, "why": "‘Shall we go for…?’ suggests a final choice."}]}, {"n": "48", "t": "Vocabulary: housework and sharing responsibilities", "g": "You will learn phrases for household chores and talk about how families share responsibilities at home.", "k": "Unit 5 · Where we live · Vocabulary · SB p.60", "terms": [["household chores", "хатні справи"], ["to do the washing-up", "мити посуд"], ["to take out the rubbish", "виносити сміття"], ["to tidy up", "прибирати, наводити лад"], ["responsibility", "обов’язок, відповідальність"]], "th": [{"h": "Do or make?", "p": ["Many chores use ‘do’, but some use ‘make’. There is no perfect rule, so learn them as fixed phrases. ‘Make’ often means creating something, while ‘do’ is for activities and jobs."], "ul": ["do the housework — виконувати хатню роботу", "do the washing-up / the dishes — мити посуд", "do the laundry / the washing — прати", "do the ironing — прасувати", "do the shopping — робити покупки", "make the bed — застеляти ліжко", "make dinner / breakfast — готувати вечерю / сніданок", "make a mess — робити безлад"]}, {"h": "Phrasal verbs for chores", "p": ["Phrasal verbs are very common in everyday English. Many can be separated: tidy up your room / tidy your room up."], "ul": ["tidy up — прибирати: Please tidy up your desk.", "clear up — прибирати після чогось: Let’s clear up after the party.", "put away — прибирати на місце: Put your clothes away.", "take out (the rubbish) — виносити (сміття)", "wipe (the table) — витирати (стіл)", "hoover / vacuum (the carpet) — пилососити (килим)", "water (the plants) — поливати (рослини)", "feed (the pet) — годувати (тварину)"]}, {"h": "Sharing responsibilities in a family", "p": ["When everyone helps, a home is cleaner and family life is calmer. Talk about who does what in your family and whether it is fair."], "ul": ["In my family, my dad usually does the shopping.", "I’m responsible for taking out the rubbish.", "We take turns doing the washing-up.", "I think chores should be shared equally.", "It isn’t fair if one person does everything.", "A chore chart can help a family organise the week."]}], "f": "", "pr": ["Workbook p. 31: Vocabulary 2.", "Make a weekly chore chart for your family in English (at least 8 chores) and write who is going to do each one."], "q": ["Do we say ‘do the bed’ or ‘make the bed’?", "Name three phrasal verbs for chores.", "Which chores are you responsible for at home?"], "qz": [{"q": "Can you ___ the washing-up tonight?", "o": ["make", "take", "do", "put"], "a": 2, "why": "The fixed phrase is ‘do the washing-up’."}, {"q": "Every morning I ___ my bed.", "o": ["do", "clean", "make", "tidy"], "a": 2, "why": "We say ‘make the bed’."}, {"q": "Please ___ your toys away.", "o": ["put", "take", "clear", "do"], "a": 0, "why": "‘Put away’ means put things in their place."}, {"q": "Which phrase means ‘виносити сміття’?", "o": ["do the rubbish", "make the rubbish", "clear the rubbish", "take out the rubbish"], "a": 3, "why": "We ‘take out’ the rubbish."}, {"q": "‘We take turns doing the dishes’ means…", "o": ["one person always does them", "each person does them at different times", "we do them together at once", "nobody does them"], "a": 1, "why": "‘Take turns’ means one after another."}, {"q": "Who made this ___ in the kitchen? There’s flour everywhere!", "o": ["housework", "mess", "laundry", "ironing"], "a": 1, "why": "The collocation is ‘make a mess’."}]}, {"n": "49", "t": "Grammar: future plans, events and predictions", "g": "You will choose the right future form for arrangements, timetabled events, plans and predictions.", "k": "Unit 5 · Where we live · Grammar · SB p.61", "terms": [["arrangement", "домовленість"], ["timetable", "розклад"], ["certainty", "впевненість"], ["possibility", "можливість"], ["future continuous", "майбутній тривалий час"]], "th": [{"h": "Future plans and events", "p": ["English has several ways to talk about the future. The choice depends on how fixed or certain the event is. Use the present continuous for personal arrangements with a time and place, and the present simple for official timetables and schedules."], "ul": ["Present continuous (arrangement): I’m meeting Oleh at 5 pm on Saturday.", "Present continuous: We’re visiting my grandma this weekend.", "Present simple (timetable): The train leaves at 7.15 tomorrow.", "Present simple: School starts on 1 September.", "be going to (intention): I’m going to get up earlier from Monday.", "Time expressions: tonight, tomorrow, next week, this weekend, in two days"]}, {"h": "Future predictions", "p": ["For predictions, show how sure you are. ‘Will’ and ‘won’t’ express strong belief; ‘might’, ‘may’ and ‘could’ show that something is possible but not certain. ‘Be going to’ is for predictions with evidence."], "ul": ["Certain: I’m sure we’ll finish the project on time.", "Probable: It will probably be sunny tomorrow. (probably after will)", "Probable negative: She probably won’t come. (probably before won’t)", "Possible: I might / may / could be late.", "Not possible: I might not have time.", "Evidence: You’re going to be tired if you go to bed at 2 am!"]}, {"h": "Future continuous and planning a healthy day", "p": ["The future continuous (will be + -ing) describes an action in progress at a certain time in the future. It is useful when you plan your day."], "ul": ["At 8 am tomorrow I’ll be having breakfast.", "This time next week we’ll be skiing in the Carpathians.", "Plan: I’m doing homework from 3 to 5, then I’m going for a run.", "Plan: I’m going to switch off my phone at 10 pm.", "Common mistake: ✗ I will meet Ann tomorrow at 6, we arranged it → ✓ I’m meeting Ann tomorrow at 6.", "Common mistake: ✗ The film will start at 8 (cinema schedule) → ✓ The film starts at 8."]}], "f": "", "pr": ["Workbook p. 32: Grammar 2.", "Write your plan for a healthy tomorrow (8–10 sentences) using the present continuous, present simple (timetables), be going to and might."], "q": ["Which tense do we use for a fixed arrangement with a friend?", "Which tense do we use for a train or school timetable?", "What is the difference between ‘will’ and ‘might’ in predictions?", "Make a sentence with the future continuous."], "qz": [{"q": "I ___ my cousin at the station at six — we arranged it yesterday.", "o": ["meet", "will meet", "meeting", "am meeting"], "a": 3, "why": "A fixed personal arrangement uses the present continuous."}, {"q": "The bus ___ at 7.40 every morning, so don’t be late tomorrow.", "o": ["leaves", "is leaving", "will be leave", "is going leave"], "a": 0, "why": "Timetables use the present simple."}, {"q": "Take an umbrella. It ___ rain later — I’m not sure.", "o": ["is", "going to", "might", "does"], "a": 2, "why": "‘Might’ shows that something is possible but not certain."}, {"q": "Choose the correct word order.", "o": ["She won’t probably come.", "She won’t come probably not.", "She probably won’t come.", "Probably she not will come."], "a": 2, "why": "‘Probably’ goes before ‘won’t’."}, {"q": "This time tomorrow I ___ on the beach.", "o": ["will be lying", "will lying", "am lie", "lie"], "a": 0, "why": "The future continuous is ‘will be + -ing’."}, {"q": "Which sentence is about a timetable?", "o": ["I think it will be fun.", "I’m going to learn the guitar.", "We’re having a party.", "The concert starts at 8 pm."], "a": 3, "why": "Scheduled events use the present simple."}, {"q": "I’m sure you ___ pass the test — you studied so hard!", "o": ["might not", "will", "are passing", "are going"], "a": 1, "why": "‘I’m sure’ shows strong belief, so we use ‘will’."}]}, {"n": "50", "t": "Writing: replying to an informal email", "g": "You will learn how to plan and write a friendly reply email that answers all the points in a message.", "k": "Unit 5 · Where we live · Writing · SB pp.62-63", "terms": [["reply", "відповідь"], ["informal", "неофіційний"], ["greeting", "привітання"], ["to cover all points", "розкрити всі пункти"], ["fixed expression", "стале висловлювання"]], "th": [{"h": "Structure of a reply email", "p": ["An informal email is written to a friend or a family member. In an exam you usually read a message with notes and must answer every point. A clear structure makes your email easy to follow."], "ul": ["Greeting: Hi Sam, / Dear Lina,", "Opening: thank your friend and react to their news.", "Paragraph 1: answer the first question or point.", "Paragraph 2: answer the next point(s); give details and reasons.", "Closing paragraph: ask a question or make a suggestion.", "Sign-off: Best wishes, / Love, / See you soon, + your name"]}, {"h": "Useful language (fixed expressions)", "p": ["These fixed expressions make your writing sound natural. Use contractions (I’m, it’s, don’t) because the style is informal."], "ul": ["Thanks for your email — it was great to hear from you!", "Sorry I haven’t written for ages.", "Guess what? / You won’t believe it, but…", "By the way, … / Anyway, …", "Why don’t you come and visit us?", "I can’t wait to see you!", "Write back soon. / Let me know what you think.", "Say hi to your family for me."]}, {"h": "Original model reply", "p": ["Your friend Alex wrote: ‘I heard you’re moving! Where’s your new home? What’s your room like? When can I visit?’ Here is a short model answer (about 110 words)."], "ul": ["Hi Alex,", "Thanks for your email — it was great to hear from you! Yes, we’re moving next month to a flat near the park in the centre of town.", "My new room is going to be much bigger than my old one. It’s got a balcony, and I’m going to put a desk and some plants there.", "Why don’t you come and visit us in the summer holidays? There’s a sofa bed in the living room, so you can stay for a week.", "Let me know what you think. Write back soon!", "Best wishes, Daryna", "Checklist: all points answered? paragraphs? informal phrases? 100–140 words? spelling checked?"]}], "f": "The first network email was sent by Ray Tomlinson in 1971, and he chose the @ symbol to separate the user’s name from the computer’s name.", "pr": ["Workbook p. 33: Writing; read the Writing Reference for emails.", "Write a reply (100–140 words) to a friend who asks: ‘What’s your neighbourhood like? What do you do there at weekends? Can you recommend a place to visit?’"], "q": ["What must you do with every point in the original message?", "Give two informal ways to finish an email.", "Why do we use contractions in an informal email?"], "qz": [{"q": "Which greeting is best for an informal email to a friend?", "o": ["Dear Sir or Madam,", "Hi Marta,", "To whom it may concern,", "Respected friend,"], "a": 1, "why": "‘Hi + name’ is friendly and informal."}, {"q": "Which sentence is a good opening for a reply?", "o": ["I am writing to complain.", "Please find attached my CV.", "Yours faithfully.", "Thanks for your email — it was great to hear from you!"], "a": 3, "why": "It thanks the friend and sounds natural."}, {"q": "Which is an informal sign-off?", "o": ["Best wishes,", "Yours faithfully,", "Kind regards from the company,", "Sincerely yours, the Director"], "a": 0, "why": "‘Best wishes’ is common in friendly emails."}, {"q": "In an exam email task, you should…", "o": ["answer only the most interesting point", "write as much as possible", "answer all the points in the message", "write in a very formal style"], "a": 2, "why": "You lose marks if you miss a point."}, {"q": "‘Why don’t you come and visit us?’ is used to…", "o": ["complain", "apologise", "make a suggestion or invitation", "refuse"], "a": 2, "why": "‘Why don’t you…?’ suggests or invites."}, {"q": "Which feature is typical of informal emails?", "o": ["contractions like I’m and it’s", "very long sentences", "no paragraphs", "passive voice everywhere"], "a": 0, "why": "Contractions make the style relaxed and friendly."}]}, {"n": "51", "t": "Live well, study well: solving problems together", "g": "You will learn steps for identifying a problem, suggesting solutions and discussing them respectfully.", "k": "Unit 5 · Where we live · Live well, study well · SB p.64", "terms": [["problem-solving", "вирішення проблем"], ["solution", "рішення"], ["compromise", "компроміс"], ["respectful", "шанобливий, ввічливий"], ["hate speech", "мова ворожнечі"]], "th": [{"h": "Steps to solve a problem", "p": ["Problems happen everywhere: at home, at school and online. A clear method helps you stay calm and find a good solution instead of arguing."], "ul": ["1. Identify the problem: What exactly is wrong?", "2. Understand it: Why is it happening? Who does it affect?", "3. Brainstorm solutions: think of as many ideas as possible.", "4. Compare the ideas: pros and cons of each.", "5. Choose and act: agree on one solution and try it.", "6. Check: Did it work? If not, try another idea."]}, {"h": "Discussing problems respectfully", "p": ["When people share a home, a classroom or an online chat, they must respect each other. Criticise the idea, not the person, and never use insulting or hateful words about someone’s nationality, religion, appearance or opinions."], "ul": ["The problem is that… / What worries me is…", "How about…? / Maybe we could…", "What if we tried…?", "I understand how you feel, but…", "Can we find a compromise?", "Let’s agree to… and see if it works.", "Avoid: ‘You always…’, ‘You never…’, name-calling, insults."]}, {"h": "Practice situations and project ideas", "p": ["Read the situations and discuss them with a partner or family member using the six steps. Then choose one project."], "ul": ["Your neighbours play loud music late every night.", "Two brothers share a room but one is very untidy.", "A classmate posts unkind comments about another student online.", "Project 1: a poster ‘6 steps to solve a problem’.", "Project 2: a short video or audio role-play showing a problem and a compromise.", "Project 3: a class charter of respectful online communication."]}], "f": "", "pr": ["Project of your choice: a poster, a role-play recording or a class charter (see the project ideas).", "Write about a real problem you solved (60–80 words): what was the problem, what solutions did you consider, what did you choose?"], "q": ["What are the six steps of problem-solving?", "What is a compromise?", "Why is it important to criticise ideas, not people?"], "qz": [{"q": "What is the first step in solving a problem?", "o": ["Choose a solution", "Blame someone", "Check the result", "Identify the problem"], "a": 3, "why": "You need to know exactly what the problem is first."}, {"q": "A ‘compromise’ is…", "o": ["a strong argument", "an agreement where each side gives up something", "a punishment", "a type of insult"], "a": 1, "why": "In a compromise both sides accept part of what they wanted."}, {"q": "Which phrase is a polite suggestion?", "o": ["You never listen!", "How about taking turns?", "That’s your fault.", "Stop it now."], "a": 1, "why": "‘How about…?’ politely suggests a solution."}, {"q": "‘Brainstorm’ means…", "o": ["argue loudly", "check a result", "forget a problem", "think of many ideas quickly"], "a": 3, "why": "Brainstorming is producing many ideas."}, {"q": "Which comment follows the ‘no hate speech’ principle?", "o": ["I disagree with your idea because it costs too much.", "People from that country are stupid.", "You look ugly.", "Go away, loser."], "a": 0, "why": "It criticises an idea and gives a reason without insulting anyone."}, {"q": "After you try a solution, you should…", "o": ["never talk about it again", "start a new argument", "check if it worked", "delete the chat"], "a": 2, "why": "The last step is to check the result."}]}, {"n": "52", "t": "Revision: Unit 5 vocabulary and grammar", "g": "You will review Unit 5 vocabulary about homes and chores and the future forms, and check what you need to practise more.", "k": "Unit 5 · Where we live · End-of-Unit Revision", "terms": [["revision", "повторення"], ["future forms", "форми майбутнього часу"], ["household chores", "хатні справи"], ["collocation", "словосполучення, колокація"], ["to review", "переглядати, повторювати"]], "th": [{"h": "Vocabulary summary", "p": ["Unit 5 was about homes, household items and responsibilities at home. Check that you know these words and can use them in a sentence."], "ul": ["Homes: detached, semi-detached, terraced house, block of flats, cottage, houseboat", "Describing: spacious, cramped, cosy, bright, noisy, peaceful", "Items: wardrobe, chest of drawers, fridge, dishwasher, kettle, iron, vacuum cleaner", "Collocations: move house, rent a flat, pay the bills, feel at home", "Chores: do the washing-up, do the laundry, make the bed, take out the rubbish", "Phrasal verbs: tidy up, put away, clear up"]}, {"h": "Grammar summary: talking about the future", "p": ["Choose the form according to meaning. Read each mini-example and say why that form is used."], "ul": ["will — decision now / offer / promise: I’ll help you with that box.", "will — opinion prediction: I think homes will be smaller in the future.", "be going to — plan: We’re going to paint the hall.", "be going to — evidence: Look! The cat is going to jump.", "present continuous — arrangement: I’m seeing the dentist on Friday.", "present simple — timetable: The film starts at 7.", "might / may / could — possibility: We might move next year.", "will be + -ing — action in progress: At 9 tomorrow I’ll be sitting a test."]}, {"h": "How to revise effectively", "p": ["Revision works best when you are active: test yourself instead of only reading your notes."], "ul": ["Cover the translations and say the English words aloud.", "Write one sentence about your own life for each future form.", "Find mistakes in your old homework and correct them.", "Make flashcards for words you keep forgetting.", "Ask a family member to quiz you for 5 minutes."]}], "f": "", "pr": ["Workbook p. 80: Review Unit 5.", "Write a short paragraph (80–100 words) ‘My home in ten years’ using at least four different future forms."], "q": ["Which future form do you find most difficult? Why?", "Name five household chores with the correct verb (do / make / take out).", "What is the difference between ‘I’m meeting Ann’ and ‘I’ll meet Ann’?"], "qz": [{"q": "‘The doorbell is ringing.’ — ‘I ___ get it.’", "o": ["am going to", "am getting", "’ll", "get"], "a": 2, "why": "A decision at the moment of speaking uses ‘will’."}, {"q": "Our flight ___ at 6.30 tomorrow morning.", "o": ["leaves", "will be leave", "is leave", "leaving"], "a": 0, "why": "Timetables use the present simple."}, {"q": "Which room is ‘cramped’?", "o": ["a large hall", "a garden", "a bright kitchen", "a very small room with too many things"], "a": 3, "why": "‘Cramped’ means too small."}, {"q": "I always ___ the bed before breakfast.", "o": ["do", "make", "clean", "tidy away"], "a": 1, "why": "The phrase is ‘make the bed’."}, {"q": "We ___ move next year — we haven’t decided yet.", "o": ["are moving", "might", "will definitely", "are going"], "a": 1, "why": "‘Might’ shows something is possible, not decided."}, {"q": "Look at that boy on the wall! He ___ fall!", "o": ["might to", "will be", "falls", "is going to"], "a": 3, "why": "Visible evidence → ‘be going to’."}, {"q": "We ___ house last year, and now we live near the river.", "o": ["moved", "changed", "made", "went"], "a": 0, "why": "The collocation is ‘move house’."}]}]}, {"name": "Unit 6. Go for it! (Дій!)", "lessons": [{"n": "53", "t": "Unit Opener: Go for it! — sports and sports equipment", "g": "You will talk about your favourite sports and learn vocabulary for sports, places and equipment.", "k": "Unit 6 · Go for it! · Unit Opener + Vocabulary for Reading · SB pp.65-66", "terms": [["equipment", "спорядження, інвентар"], ["team sport", "командний вид спорту"], ["athlete", "спортсмен"], ["to compete", "змагатися"], ["to take up (a sport)", "почати займатися (спортом)"]], "th": [{"h": "Welcome to Unit 6: Go for it!", "p": ["Sport keeps us fit, helps us make friends and teaches us to win and lose. Some people love team sports, others prefer to train alone. In this unit you will talk about sports, equipment, clothes and health, and learn conditional sentences."], "ul": ["What sports do you do or watch?", "Do you prefer team sports or individual sports? Why?", "Which sport would you like to take up? What do you need to start?", "Is it better to do sport for fun or to compete?", "What makes a good athlete: talent or hard work?"]}, {"h": "Play, go or do?", "p": ["We use different verbs with different sports. This is a very common exam point."], "ul": ["play + ball and team games: play football, play tennis, play volleyball", "go + -ing activities: go swimming, go cycling, go skiing, go climbing", "do + individual activities and martial arts: do yoga, do karate, do gymnastics, do athletics", "take up a sport — почати займатися спортом", "give up a sport — кинути спорт", "work out — тренуватися (в спортзалі)"]}, {"h": "Places and equipment", "p": ["Each sport has its own place and equipment. Learn the words with translations."], "ul": ["pitch — поле (football pitch)", "court — корт, майданчик (tennis / basketball court)", "track — бігова доріжка; pool — басейн; rink — ковзанка; slope — схил", "racket — ракетка; bat — бита; net — сітка", "goal — ворота / гол; ball — м’яч", "helmet — шолом; gloves — рукавиці; goggles — окуляри для плавання", "skis — лижі; skates — ковзани; board — дошка"]}], "f": "The first modern Olympic Games took place in Athens in 1896.", "pr": ["Study the Student Resources Unit 6 Wordlist on your own: copy 15 words with translations.", "Make a mind map: 3 sports with play, 3 with go, 3 with do, and the place and equipment for each."], "q": ["Which verb do we use with ‘swimming’ and ‘skiing’?", "What is the difference between a pitch and a court?", "Which sport would you like to take up, and what equipment do you need?"], "qz": [{"q": "I ___ karate twice a week.", "o": ["play", "go", "do", "make"], "a": 2, "why": "We use ‘do’ with martial arts."}, {"q": "Let’s ___ cycling on Sunday.", "o": ["do", "play", "go", "make"], "a": 2, "why": "We use ‘go’ with -ing activities."}, {"q": "Tennis is played on a…", "o": ["court", "pitch", "pool", "slope"], "a": 0, "why": "Tennis and basketball are played on a court."}, {"q": "Which item do you need for badminton?", "o": ["skates", "goggles", "skis", "racket"], "a": 3, "why": "Badminton players hit the shuttlecock with a racket."}, {"q": "‘Take up a sport’ means…", "o": ["stop doing it", "start doing it", "watch it on TV", "win a medal"], "a": 1, "why": "‘Take up’ means begin a new hobby or activity."}, {"q": "Cyclists should always wear a ___ to protect their head.", "o": ["net", "helmet", "bat", "glove"], "a": 1, "why": "A helmet protects your head."}]}, {"n": "54", "t": "Reading: Time for something new? — scanning for key information", "g": "You will scan short texts about new sports to find key information quickly and explain your choice of sport.", "k": "Unit 6 · Go for it! · Reading · SB pp.66-67", "terms": [["to scan", "переглядати текст для пошуку інформації"], ["key information", "ключова інформація"], ["multiple matching", "множинне співставлення"], ["beginner", "початківець"], ["challenge", "виклик, складне завдання"]], "th": [{"h": "Non-linear reading: scanning", "p": ["You do not always need to read every word from start to finish. In a matching task you read the questions first, then move around the texts to find the part that answers each question. This is called non-linear reading or scanning."], "ul": ["Read all the questions first and underline key words.", "Think of synonyms: ‘cheap’ may appear as ‘doesn’t cost much’.", "Scan the texts for those ideas, not only for the same words.", "When you find a possible answer, read that part carefully.", "Some texts may answer more than one question.", "Check that the whole question matches, not only half of it."]}, {"h": "Original texts: Three new sports to try", "p": ["A) Bouldering: Climb short walls without ropes, with soft mats below. You only need special shoes, which most centres rent. It is great for problem-solving because each route is like a puzzle. B) Ultimate frisbee: Two teams pass a flying disc and score in an end zone. There is no referee — players decide on fouls themselves, so honesty is important. It is cheap: one disc is enough.", "C) Stand-up paddleboarding: Stand on a large board and move with a long paddle. It is excellent for balance and core muscles, but you need warm weather and a safe lake or sea. Beginners should always wear a life jacket and take a lesson first."], "ul": ["Which sport needs almost no money? → B (one disc is enough)", "Which sport depends on the weather? → C", "Which sport is like solving puzzles? → A", "Which sport asks players to be fair without a referee? → B", "Which sport mentions safety equipment for beginners? → C"]}, {"h": "Exam task and discussion", "p": ["After reading, explain which sport you would choose and why. Use conditional sentences and give reasons."], "ul": ["I’d choose… because it sounds…", "If I tried bouldering, I would improve my strength.", "It would suit me because I enjoy…", "The main drawback is that…", "I’m not keen on… because…"]}], "f": "Parkour, the sport of moving quickly over obstacles in a city, developed in France in the late 1980s and 1990s.", "pr": ["Workbook pp. 34–35: reading task and Exam Reminder.", "Find information about one unusual sport and write 5 questions and answers about it for a scanning quiz."], "q": ["What does ‘scanning’ mean?", "Why should you read the questions before the texts in a matching task?", "Which of the three sports would you choose and why?"], "qz": [{"q": "In a matching task, what should you do first?", "o": ["Read every text slowly", "Guess all the answers", "Translate every word", "Read the questions and underline key words"], "a": 3, "why": "Knowing the questions tells you what to look for."}, {"q": "Which sport in the texts needs almost no money?", "o": ["Ultimate frisbee", "Stand-up paddleboarding", "Bouldering", "None of them"], "a": 0, "why": "Text B says one disc is enough."}, {"q": "Why is honesty important in ultimate frisbee?", "o": ["It is played in water.", "The disc is expensive.", "There is no referee.", "Teams have one player."], "a": 2, "why": "Players decide on fouls themselves."}, {"q": "The question says ‘inexpensive’. The text may say…", "o": ["very popular", "takes a long time", "doesn’t cost much", "needs a coach"], "a": 2, "why": "Exam texts often use synonyms of the question words."}, {"q": "Which sport needs a safe lake or sea?", "o": ["Stand-up paddleboarding", "Ultimate frisbee", "Bouldering", "All of them"], "a": 0, "why": "Text C mentions warm weather and safe water."}, {"q": "A ‘beginner’ is a person who…", "o": ["sells equipment", "is a professional", "judges a game", "has just started an activity"], "a": 3, "why": "Beginners are new to an activity."}]}, {"n": "55", "t": "Vocabulary: sport, fitness and health", "g": "You will use sports collocations and word formation to talk about amateur and professional sport and its effect on health.", "k": "Unit 6 · Go for it! · Vocabulary · SB p.68", "terms": [["amateur", "аматор, любитель"], ["professional", "професійний; професіонал"], ["injury", "травма"], ["to warm up", "розминатися"], ["fitness", "фізична форма"], ["opponent", "суперник"]], "th": [{"h": "People in sport and competition words", "p": ["Many nouns for people end in -er, -or, -ist or -ant. Learn the people together with useful verbs and collocations."], "ul": ["player — гравець; coach — тренер; referee — суддя (football); umpire — суддя (tennis)", "opponent — суперник; spectator — глядач; fan — уболівальник", "competitor / contestant — учасник змагань", "win a match / a medal — виграти матч / медаль", "beat an opponent — перемогти суперника (not ‘win an opponent’)", "score a goal / points — забити гол / набрати очки", "break a record — побити рекорд; set a record — встановити рекорд"]}, {"h": "Amateur and professional sport", "p": ["Amateurs do sport for fun and health. Professionals are paid and train many hours a day. Regular exercise improves fitness, but too much training without rest can cause injuries."], "ul": ["keep fit / get fit — підтримувати / набирати форму", "warm up / cool down — розминка / заминка", "pull a muscle — потягнути м’яз; sprain an ankle — підвернути щиколотку", "train hard — наполегливо тренуватися", "build strength / stamina — розвивати силу / витривалість", "Amateur sport: more fun, less pressure, lower risk of serious injury.", "Professional sport: fame and money, but stress and long-term injuries."]}, {"h": "Word formation", "p": ["Change the form of a word to fit the sentence. This is a common exam task."], "ul": ["compete (v) → competition (n) → competitive (adj) → competitor (person)", "perform → performance; achieve → achievement", "success → successful → successfully", "injure → injury → injured", "fit → fitness; strong → strength; weak → weakness", "athlete → athletic → athletics"]}], "f": "The word ‘amateur’ comes from French and Latin words meaning ‘lover’ — an amateur does something for love, not for money.", "pr": ["Workbook p. 35: Vocabulary.", "Write 6–8 sentences comparing amateur and professional sport and their effect on health, using at least five words from this lesson."], "q": ["What is the difference between ‘win’ and ‘beat’?", "Why is warming up important?", "Give the noun and adjective forms of ‘compete’."], "qz": [{"q": "Our team ___ the champions 3–1!", "o": ["won", "beat", "scored", "gained"], "a": 1, "why": "We ‘beat’ a person or team, and ‘win’ a match or prize."}, {"q": "In tennis, the person who controls the match is the…", "o": ["referee", "umpire", "coach", "spectator"], "a": 1, "why": "Tennis uses an ‘umpire’; football uses a ‘referee’."}, {"q": "She is a very ___ player; she hates losing.", "o": ["competition", "compete", "competitor", "competitive"], "a": 3, "why": "We need an adjective before ‘player’."}, {"q": "Alwa
