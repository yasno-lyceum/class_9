ho did it)."}, {"q": "Which sentence is correct?", "o": ["Phones must be switched off.", "Phones must switched off.", "Phones must be switch off.", "Phones must to be switched off."], "a": 0, "why": "Modal + be + past participle, no «to»."}, {"q": "___ these games made in Ukraine?", "o": ["Is", "Was", "Were", "Did"], "a": 2, "why": "Plural subject in a past passive question needs were."}]}, {"n": "96", "t": "Listening + Speaking: our role in a digital world", "g": "You will practise listening for specific information and discuss technology, giving and supporting opinions.", "k": "Unit 9 · Digital world · Listening + Speaking · SB pp.106-107", "terms": [["online safety", "безпека в інтернеті"], ["to share", "ділитися, поширювати"], ["digital footprint", "цифровий слід"], ["to argue", "доводити, сперечатися"], ["to be addicted to", "бути залежним від"]], "th": [{"h": "Listening strategies", "p": ["In exam listening tasks you often choose the correct answer from options or match speakers to statements. Use the time before listening well.", "Remember that speakers often mention all the options, but only one is the real answer."], "ul": ["Read the questions and underline key words before you listen.", "Think of synonyms: «cheap» may be heard as «it didn't cost much».", "Listen for the speaker's final decision, not their first idea.", "Don't panic if you miss something – move to the next question.", "Use the second listening to check your answers."]}, {"h": "Useful phrases for discussion", "p": ["In the speaking task you discuss a question with a partner. Give your opinion, give a reason and an example, and react to your partner's ideas."], "ul": ["Giving opinions: I believe… / As far as I'm concerned… / In my view…", "Giving reasons: That's because… / The main reason is…", "Agreeing: I couldn't agree more. / That's a good point.", "Disagreeing politely: I see what you mean, but… / I'm not so sure about that.", "Asking your partner: What do you think? / Do you agree?", "Concluding: So, all in all, we think…"]}, {"h": "Model dialogue", "p": ["A: Do you think teenagers spend too much time online? B: Yes, I think so. As far as I'm concerned, some of my friends are almost addicted to their phones. A: I see what you mean, but the internet is also used for studying. My homework is posted online every day. B: That's a good point. But we should be careful about what we share. Everything leaves a digital footprint. A: I couldn't agree more. So, all in all, technology is useful if it is used responsibly."], "ul": ["Notice the opinion phrases in the dialogue.", "Notice the passive: is used, is posted.", "Practise the dialogue aloud, then change it with your own ideas."]}], "f": "The first SMS text message was sent in 1992 and said «Merry Christmas».", "pr": ["WB p. 54 – Listening.", "Record yourself (1–2 minutes) answering: «What is your role in keeping the internet a safe place?» Use at least 4 phrases from the lesson."], "q": ["What should you do before the recording starts?", "Why is it dangerous to choose an answer just because you hear the same word?", "Give two polite ways to disagree.", "What is a digital footprint?"], "qz": [{"q": "What is the best thing to do before listening?", "o": ["Close your eyes", "Read questions and underline key words", "Write answers randomly", "Translate everything"], "a": 1, "why": "Key words help you know what to listen for."}, {"q": "Which phrase is used to disagree politely?", "o": ["I couldn't agree more.", "That's rubbish.", "I see what you mean, but…", "Exactly!"], "a": 2, "why": "It acknowledges the other view before disagreeing."}, {"q": "«I couldn't agree more» means…", "o": ["I agree completely", "I disagree", "I don't know", "I can't answer"], "a": 0, "why": "It is a strong way of agreeing."}, {"q": "«Digital footprint» means…", "o": ["a shoe size app", "the information you leave online", "a type of computer", "a computer virus"], "a": 1, "why": "It is the trail of data you leave on the internet."}, {"q": "Which phrase helps you finish a discussion?", "o": ["What do you think?", "That's because…", "I'm not so sure.", "So, all in all, …"], "a": 3, "why": "All in all introduces a conclusion."}, {"q": "In a listening task the speaker says: «I thought about the train, but in the end we took the bus.» How did they travel?", "o": ["by train", "by car", "by bus", "on foot"], "a": 2, "why": "Listen for the final decision."}]}, {"n": "97", "t": "Vocabulary: technology phrasal verbs and expressions", "g": "You will understand and use common phrasal verbs and expressions connected with computers and gadgets.", "k": "Unit 9 · Digital world · Vocabulary · SB p.108", "terms": [["to set up", "налаштовувати"], ["to plug in", "підключати до мережі"], ["to scroll down", "прокручувати вниз"], ["to shut down", "вимикати (комп'ютер)"], ["to pop up", "раптово з'являтися"], ["to keep up with", "встигати за, не відставати від"]], "th": [{"h": "Phrasal verbs for technology", "p": ["Phrasal verbs are verbs + a small word (up, down, in, out, on, off). The meaning is often different from the main verb, so learn them with examples."], "ul": ["set up — налаштовувати (I set up my new phone in ten minutes.)", "plug in / unplug — підключити / відключити (Plug in the charger.)", "turn on / turn off — увімкнути / вимкнути", "scroll down / up — прокручувати вниз / вгору", "shut down — повністю вимкнути комп'ютер", "pop up — раптово з'являтися (An advert popped up on the screen.)", "log on / log off — увійти / вийти з системи", "print out — роздрукувати"]}, {"h": "Useful expressions", "p": ["These expressions are often used when people talk about the digital world and its effects on our lives."], "ul": ["keep up with technology — встигати за технологіями", "be glued to the screen — не відриватися від екрана", "go viral — швидко поширитися в мережі", "be out of date — бути застарілим", "run out of battery — розрядитися", "be online / offline — бути в мережі / поза мережею"]}, {"h": "Grammar note: separable phrasal verbs", "p": ["Some phrasal verbs can be split by the object: turn the computer off / turn off the computer. But with a pronoun (it, them) the pronoun must go in the middle."], "ul": ["✓ Turn it off. ✗ Turn off it.", "✓ Plug it in. ✗ Plug in it.", "✓ Print them out. ✗ Print out them.", "Intransitive verbs have no object: The video went viral. A message popped up."]}], "f": "Unwanted emails are called «spam» after a famous comedy sketch by the British group Monty Python.", "pr": ["WB p. 55 – Vocabulary 2.", "Write a short how-to guide (6–8 steps) for a younger student: «How to set up a new tablet», using at least 5 phrasal verbs."], "q": ["What does «set up» mean?", "Where must the pronoun go with «turn off»?", "What happens when a video «goes viral»?", "How can you say that a gadget is old and not useful any more?"], "qz": [{"q": "My phone has run out of ___.", "o": ["battery", "screen", "charger", "signal off"], "a": 0, "why": "Run out of battery is a fixed expression."}, {"q": "Choose the correct sentence.", "o": ["Turn off it, please.", "Turn it off, please.", "Turn it, off please.", "Off turn it, please."], "a": 1, "why": "Pronouns go between the verb and the particle."}, {"q": "An annoying advert suddenly ___ on my screen.", "o": ["popped down", "set up", "popped up", "plugged in"], "a": 2, "why": "Pop up = appear suddenly."}, {"q": "«Be glued to the screen» means…", "o": ["fix a broken screen", "be unable to stop looking at a screen", "clean a screen", "buy a new screen"], "a": 1, "why": "It describes watching a screen for a long time."}, {"q": "Before you leave, please ___ the computer properly.", "o": ["shut down", "scroll down", "go viral", "pop up"], "a": 0, "why": "Shut down = switch off completely."}, {"q": "My grandmother finds it hard to ___ new technology.", "o": ["log off", "print out", "plug in", "keep up with"], "a": 3, "why": "Keep up with = stay up to date."}]}, {"n": "98", "t": "Grammar: the passive in different tenses", "g": "You will form and use the passive in present continuous, present perfect, past continuous and future, including questions and negatives.", "k": "Unit 9 · Digital world · Grammar · SB p.109", "terms": [["tense", "час (граматичний)"], ["present perfect passive", "пасивний стан у Present Perfect"], ["to be released", "бути випущеним"], ["to be updated", "бути оновленим"], ["to be repaired", "бути відремонтованим"]], "th": [{"h": "The passive in all tenses", "p": ["The rule is always the same: be in the correct tense + past participle. Only the form of be changes."], "ul": ["Present simple: Apps are downloaded every day.", "Present continuous: My laptop is being repaired at the moment.", "Past simple: The message was sent yesterday.", "Past continuous: The video was being uploaded when the internet stopped.", "Present perfect: A new update has been released.", "Past perfect: The files had been deleted before I noticed.", "Future (will): The results will be published tomorrow.", "be going to: A new computer lab is going to be opened."]}, {"h": "Negatives and questions", "p": ["To make a negative, add not after the first auxiliary. To make a question, move the first auxiliary before the subject."], "ul": ["The software hasn't been updated yet.", "The website isn't being used now.", "Has your password been changed?", "Is the game being played online?", "When will the new phone be sold in shops?", "Were the photos being edited when you arrived?"]}, {"h": "Active or passive? Common mistakes", "p": ["Choose the passive when the focus is on the thing that receives the action. Do not use the passive with verbs that have no object (happen, arrive, appear)."], "ul": ["✗ The accident was happened. ✓ The accident happened.", "✗ The email has sent. ✓ The email has been sent.", "✗ The room is clean now (= process). ✓ The room is being cleaned now.", "Being = continuous; been = perfect – don't mix them up!", "Time expressions: already, yet, just, at the moment, tomorrow, next year."]}], "f": "The World Wide Web was invented by the British scientist Tim Berners-Lee in 1989.", "pr": ["WB p. 56 – Grammar 2.", "Write a short news report (6–8 sentences) about a new invention at your school using at least 4 different passive tenses."], "q": ["How do you form the present perfect passive?", "What is the difference between «being» and «been»?", "Why can't we say «The accident was happened»?", "How do you make a question in the future passive?"], "qz": [{"q": "My bike ___ at the moment, so I'm walking.", "o": ["is repaired", "is being repaired", "has repaired", "was repaired"], "a": 1, "why": "At the moment → present continuous passive."}, {"q": "A new version of the app ___ just ___.", "o": ["has / been released", "is / released", "was / releasing", "had / release"], "a": 0, "why": "Just → present perfect passive."}, {"q": "The winners ___ next Friday.", "o": ["announced", "are announcing", "will be announced", "have announced"], "a": 2, "why": "Future passive: will be + past participle."}, {"q": "Which sentence is correct?", "o": ["The problem has been solved.", "The problem has being solved.", "The problem has solved.", "The problem been solved."], "a": 0, "why": "Present perfect passive uses has been + past participle."}, {"q": "When I arrived, the computers ___.", "o": ["were installed being", "installed", "have been installed", "were being installed"], "a": 3, "why": "An action in progress in the past → past continuous passive."}, {"q": "Which verb cannot be used in the passive?", "o": ["send", "happen", "build", "invent"], "a": 1, "why": "Happen has no object, so it has no passive."}, {"q": "___ the homework been checked yet?", "o": ["Is", "Was", "Has", "Did"], "a": 2, "why": "Yet + been → present perfect passive question."}]}, {"n": "99", "t": "Writing: an opinion essay about technology", "g": "You will plan and write an opinion essay, adding your own judgements and supporting them with reasons and examples.", "k": "Unit 9 · Digital world · Writing · SB pp.110-111", "terms": [["opinion essay", "есе-думка"], ["topic sentence", "головне речення абзацу"], ["supporting point", "аргумент на підтримку"], ["counter-argument", "контраргумент"], ["conclusion", "висновок"]], "th": [{"h": "Structure of an opinion essay", "p": ["An opinion essay answers a question and clearly gives the writer's view. It uses formal or neutral language: no short forms (don't, can't), no slang.", "Plan before you write: 4–5 paragraphs, each with one main idea."], "ul": ["Paragraph 1 – Introduction: rephrase the question and state your opinion.", "Paragraph 2 – First reason with an example.", "Paragraph 3 – Second reason with an example.", "Paragraph 4 – Opposing view and why you disagree (optional).", "Paragraph 5 – Conclusion: sum up and repeat your opinion in different words.", "Start each body paragraph with a clear topic sentence."]}, {"h": "Useful language and fixed phrases", "p": ["Fixed phrases make your essay sound organised and academic. Use a variety and don't repeat the same linker."], "ul": ["Stating opinion: In my opinion, … / I strongly believe that … / It seems to me that …", "Listing: Firstly, … / Secondly, … / Furthermore, … / Finally, …", "Giving examples: For example, … / For instance, … / such as …", "Contrast: However, … / On the other hand, … / Although …", "Counter-argument: Some people argue that … . Nevertheless, …", "Concluding: To sum up, … / All things considered, … / In conclusion, …"]}, {"h": "Model introduction and conclusion", "p": ["Question: «Smartphones should be banned in schools. Do you agree?»", "Introduction: Nowadays almost every teenager owns a smartphone, and many schools are wondering whether these devices should be allowed in class. In my opinion, phones should not be banned completely, but they must be used responsibly. Conclusion: To sum up, although phones can be a distraction, they are also a useful learning tool. All things considered, clear rules are better than a total ban."], "ul": ["Exam tip: answer the exact question in the task.", "Count your words – stay within the limit.", "Checklist: clear opinion? 4–5 paragraphs? linkers? examples? formal style? spelling checked?"]}], "f": "", "pr": ["WB p. 57 – Writing (use the Writing Reference).", "Write an opinion essay (140–180 words): «Technology makes our lives easier but less healthy. Do you agree?»"], "q": ["What goes in the introduction of an opinion essay?", "Why should you avoid short forms in an essay?", "Name three linkers for adding points.", "What is a topic sentence?"], "qz": [{"q": "Which phrase is best to state your opinion in an essay?", "o": ["I strongly believe that…", "Gonna say that…", "Hey, guess what…", "LOL, I think…"], "a": 0, "why": "It is formal and clear."}, {"q": "Where do you usually repeat your opinion in different words?", "o": ["Paragraph 2", "In the title", "In the conclusion", "Nowhere"], "a": 2, "why": "The conclusion sums up and restates your view."}, {"q": "Which linker introduces a contrast?", "o": ["Furthermore", "However", "Firstly", "For instance"], "a": 1, "why": "However shows contrast."}, {"q": "Which sentence is in the right style for an essay?", "o": ["Phones are kinda bad for kids.", "Phones can't be good, can they?!", "Phones r bad.", "Smartphones may have a negative effect on sleep."], "a": 3, "why": "It is formal and has no slang or short forms."}, {"q": "«For instance» is used to…", "o": ["conclude", "give an example", "disagree", "list the first point"], "a": 1, "why": "For instance = for example."}, {"q": "How many main ideas should a body paragraph have?", "o": ["One", "Five", "None", "As many as possible"], "a": 0, "why": "Each paragraph develops one main idea."}]}, {"n": "100", "t": "Live well, study well: social media and a positive self-image", "g": "You will discuss how social media affects how we feel about ourselves and find ways to use it in a healthy way.", "k": "Unit 9 · Digital world · Live well, study well · SB p.112", "terms": [["self-esteem", "самооцінка"], ["to compare yourself", "порівнювати себе"], ["filter", "фільтр"], ["screen time", "екранний час"], ["well-being", "добробут, самопочуття"]], "th": [{"h": "Social media: the real and the perfect", "p": ["On social media people usually show the best moments of their lives: holidays, nice clothes, perfect selfies. Many photos are edited or filtered. When we compare our ordinary day with these «perfect» pictures, we can feel unhappy with ourselves.", "An infographic in the SB shows facts about teenagers and social media. When you read an infographic, look at the title, numbers, colours and icons first."], "ul": ["Do you ever feel worse after scrolling through social media? Why?", "Which apps make you feel good and which don't?", "Do you think people show their real life online?", "How much screen time is healthy for a teenager?"]}, {"h": "Tips for healthy social media use", "p": ["You don't have to give up social media. The key is to control it, not let it control you."], "ul": ["Remember that many photos are edited – real life isn't filtered.", "Unfollow accounts that make you feel bad about yourself.", "Follow accounts that teach, inspire or make you laugh.", "Turn off notifications during homework and at night.", "Check your screen time once a week.", "Spend time offline with friends, sport and hobbies.", "Be kind in comments – your words affect others."]}, {"h": "Useful language and project ideas", "p": ["Use these phrases to talk about feelings and advice. Then choose a project (this is your homework from the plan)."], "ul": ["It makes me feel… / I feel more confident when…", "It's important to… / You should try to…", "Project 1: design a poster «5 rules for a happy online life».", "Project 2: keep a screen-time diary for a week and present the results.", "Project 3: create an infographic about your class's favourite apps.", "Project 4: write a kind and positive post about a classmate or friend."]}], "f": "", "pr": ["Project of your choice (see the project ideas in the lesson).", "Write 5 sentences of advice to a younger friend about using social media in a healthy way."], "q": ["Why can social media make people feel bad about themselves?", "What should you look at first in an infographic?", "Give three tips for healthy social media use.", "What does «self-esteem» mean?"], "qz": [{"q": "«Self-esteem» is…", "o": ["a type of app", "how you feel about your own value", "your screen time", "a photo filter"], "a": 1, "why": "Self-esteem = самооцінка."}, {"q": "Which is healthy advice?", "o": ["Scroll before sleep for hours.", "Compare your life with influencers.", "Turn off notifications during homework.", "Never meet friends offline."], "a": 2, "why": "Fewer notifications help you focus."}, {"q": "Why may «perfect» photos online be misleading?", "o": ["They are often edited or filtered.", "They are always old.", "They are too small.", "They have no colour."], "a": 0, "why": "Edited photos don't show real life."}, {"q": "When reading an infographic you should first look at…", "o": ["the smallest words only", "nothing – just guess", "the last line", "the title, numbers and icons"], "a": 3, "why": "They show the main message quickly."}, {"q": "Complete: «I feel more ___ when I don't compare myself with others.»", "o": ["confidence", "confident", "confidently", "confide"], "a": 1, "why": "An adjective is needed after feel."}, {"q": "«Unfollow» means…", "o": ["stop following an account", "follow twice", "send a message", "delete your phone"], "a": 0, "why": "Un- means the opposite of follow."}]}, {"n": "101", "t": "End-of-Unit 9 Revision: digital world", "g": "You will revise the vocabulary and grammar of Unit 9 and check what you need to practise more.", "k": "Unit 9 · Digital world · End-of-Unit Revision", "terms": [["revision", "повторення"], ["passive voice", "пасивний стан"], ["phrasal verb", "фразове дієслово"], ["collocation", "словосполучення"], ["word formation", "словотвір"]], "th": [{"h": "Vocabulary summary", "p": ["Look through the words below. If you can't remember a word, find it in the Unit 9 Wordlist and write an example sentence."], "ul": ["Devices: gadget, device, laptop, drone, satellite, charger", "Collocations: charge your phone, back up files, create a password, click on a link", "Phrasal verbs: set up, plug in, scroll down, shut down, pop up, keep up with", "Expressions: go viral, be out of date, run out of battery", "Word formation: invent → invention → inventor; rely → reliable → unreliable", "Social media: self-esteem, filter, screen time, well-being"]}, {"h": "Grammar summary: the passive", "p": ["Form: be + past participle. Use it when the action is more important than the person who does it."], "ul": ["Present: Phones are made in factories. / is being made", "Past: The app was created in 2020. / was being created", "Present perfect: The file has been deleted.", "Future: The results will be announced soon.", "Modals: Phones must be switched off. / can be repaired", "by (agent) vs with (tool): painted by an artist / painted with a brush"]}, {"h": "Writing summary and self-check", "p": ["Remember the structure of the opinion essay: introduction with opinion, two or three body paragraphs, conclusion. Then mark yourself honestly: I can do it well / I need more practice."], "ul": ["I can talk about the advantages and disadvantages of inventions.", "I can use technology collocations and phrasal verbs.", "I can form the passive in different tenses and with modals.", "I can choose between by and with.", "I can write a well-organised opinion essay.", "I can talk about using social media in a healthy way."]}], "f": "", "pr": ["WB p. 84 – Review Unit 9.", "Make a mind map of Unit 9 with four branches: Devices, Collocations, Phrasal verbs, Passive. Add at least 5 items to each branch."], "q": ["How do you form the passive with a modal verb?", "Give three technology phrasal verbs and their meaning.", "What is the structure of an opinion essay?", "When do you use «with» in a passive sentence?"], "qz": [{"q": "This photo ___ by a satellite last week.", "o": ["took", "was taken", "is taking", "has took"], "a": 1, "why": "Past simple passive: was + past participle."}, {"q": "The data ___ every night.", "o": ["is backed up", "backs up", "are backing", "is back upping"], "a": 0, "why": "Present simple passive, uncountable subject."}, {"q": "Students mustn't ___ their phones during exams.", "o": ["be used", "use", "to use", "used"], "a": 1, "why": "Active voice here: students use phones; modal + base verb."}, {"q": "My essay ___ yet.", "o": ["isn't checked being", "hasn't checked", "hasn't been checked", "wasn't been checked"], "a": 2, "why": "Yet → present perfect passive negative."}, {"q": "Her funny video ___ and got a million views.", "o": ["went viral", "set up", "plugged in", "shut down"], "a": 0, "why": "Go viral = spread fast online."}, {"q": "The picture was drawn ___ a pencil.", "o": ["by", "from", "of", "with"], "a": 3, "why": "With is for the tool."}, {"q": "Which linker is best for a conclusion?", "o": ["Firstly,", "For instance,", "All things considered,", "However,"], "a": 2, "why": "It introduces a summary."}]}]}, {"name": "Unit 10. Show time! (Показ починається!)", "lessons": [{"n": "102", "t": "Unit Opener: show time! – festivals and entertainment", "g": "You will talk about festivals and entertainment you like and learn key words about festivals.", "k": "Unit 10 · Show time! · Unit Opener + Vocabulary for Reading · SB pp.113-114", "terms": [["festival", "фестиваль"], ["performance", "виступ, вистава"], ["audience", "глядачі, публіка"], ["stage", "сцена"], ["line-up", "програма виступів, склад учасників"], ["crowd", "натовп"]], "th": [{"h": "Welcome to Unit 10: Show time!", "p": ["This unit is about music, festivals, films and TV. You will read about a music school, learn film and TV vocabulary, use reported speech and write a story.", "Think about the last time you went to a concert, festival or cinema. What was it like? Who did you go with?"], "ul": ["Have you ever been to a festival? What kind?", "Would you prefer a music festival, a film festival or a food festival? Why?", "What makes a performance great?", "Is it better to watch a concert live or online?", "What festivals are held in your town or region?"]}, {"h": "Key vocabulary: festivals", "p": ["Learn these words and use them to describe an event you remember."], "ul": ["festival — фестиваль (The festival takes place every summer.)", "performer — виконавець", "audience — глядачі (The audience clapped loudly.)", "stage — сцена", "line-up — програма, склад виконавців", "headliner — головний виконавець", "ticket / sold out — квиток / розпродано", "atmosphere — атмосфера (The atmosphere was amazing!)"]}, {"h": "Describing an event", "p": ["When you describe an event, say what, where, when, who with, and how you felt. Use adjectives to make your description lively."], "ul": ["It took place in… / It was held in…", "The best part was…", "The atmosphere was electric / relaxed / friendly.", "I was impressed by…", "It was worth every penny.", "Adjectives: breathtaking, unforgettable, crowded, noisy, exciting"]}], "f": "The famous Glastonbury Festival in England was first held in 1970.", "pr": ["Study Student Resources Unit 10 Wordlist: copy 10 new words with translations and examples.", "Write 6–8 sentences about a festival or concert you went to or would like to go to."], "q": ["What is the difference between a performer and an audience?", "What does «sold out» mean?", "Which adjectives can describe an atmosphere?", "What questions help you describe an event?"], "qz": [{"q": "The people who watch a show are the…", "o": ["performers", "audience", "stage", "line-up"], "a": 1, "why": "Audience = глядачі."}, {"q": "The main star of a festival is the…", "o": ["headliner", "crowd", "ticket", "stage"], "a": 0, "why": "The headliner is the main act."}, {"q": "We couldn't buy tickets – they were ___.", "o": ["sold off", "sold in", "sold out", "sold up"], "a": 2, "why": "Sold out = no tickets left."}, {"q": "The band played on a big ___ in the park.", "o": ["audience", "atmosphere", "crowd", "stage"], "a": 3, "why": "Performers play on a stage."}, {"q": "Choose the best adjective: «It was an ___ evening – I'll never forget it.»", "o": ["unforgettable", "boring", "ordinary", "awful"], "a": 0, "why": "Unforgettable = you'll never forget it."}, {"q": "«The festival ___ in August.»", "o": ["takes part", "takes place", "takes off", "takes on"], "a": 1, "why": "Take place = happen."}]}, {"n": "103", "t": "Reading: putting students first – music and well-being", "g": "You will read about music in education, practise finding specific details and talk about how music affects our mood and health.", "k": "Unit 10 · Show time! · Reading · SB pp.114-115", "terms": [["to compose", "складати (музику)"], ["instrument", "музичний інструмент"], ["rehearsal", "репетиція"], ["to relieve stress", "знімати стрес"], ["talent", "талант"]], "th": [{"h": "Before you read", "p": ["The SB text «Putting students first» is about a place where students and their needs come first in music education. Before reading, think: what would your ideal music lesson look like?", "Read the original practice text below."], "ul": ["Do you play an instrument or sing?", "What music do you listen to when you are sad, tired or happy?", "Can music help you study?", "Read the questions before the text so you know what details to look for."]}, {"h": "Practice text: The Friday band", "p": ["At a small school in a quiet town, Friday afternoons are different. Instead of a normal lesson, every student joins the school band. Nobody has to be a talented musician – some students play the guitar or drums, others sing, and a few even compose their own songs on laptops. The music teacher, Ms Kovalenko, says the idea is simple: «Students choose the music, and I help them play it.» Rehearsals are noisy and full of laughter. Parents say their children come home in a better mood, and several students report that playing music helps them relieve stress before tests. At the end of each term, the band gives a concert for the whole town. Last year the tickets were sold out in two days, and the money was used to buy new instruments."], "ul": ["Who chooses the music? – the students", "What do some students do on laptops? – compose songs", "How does music help before tests? – it relieves stress", "What was the concert money used for? – new instruments"]}, {"h": "Exam tip: reading for specific details", "p": ["In detail questions, the answer is usually expressed with different words in the text. Find the part of the text about the question, then read it carefully.", "Watch out for distractors: words from the options may appear in the text but with a different meaning."], "ul": ["Underline key words in each question.", "Scan the text for the place where the topic is mentioned.", "Look for synonyms: «happier» in the question = «in a better mood» in the text.", "Read the sentence before and after the key words too.", "Questions usually follow the order of the text.", "Don't choose an option just because it uses the same word as the text."]}], "f": "Scientists have found that listening to music you enjoy releases dopamine, a brain chemical connected with pleasure.", "pr": ["WB p. 58 – Exam Reminder.", "Write a paragraph (80–100 words): «How does music affect my mood and health?» Give two examples from your life."], "q": ["What does it mean to «relieve stress»?", "Why is it useful to look for synonyms when reading for detail?", "What is a distractor?", "What kind of music helps you study or relax?"], "qz": [{"q": "In the practice text, who chooses the music?", "o": ["the teacher", "the parents", "the students", "the town"], "a": 2, "why": "Ms Kovalenko says students choose the music."}, {"q": "How did the band's music help some students?", "o": ["It relieved stress before tests.", "It made them famous.", "It helped them pass maths.", "It made them sleepy."], "a": 0, "why": "Students report it helps relieve stress."}, {"q": "«Rehearsal» means…", "o": ["a final concert", "a ticket", "a practice before a performance", "an instrument"], "a": 2, "why": "Rehearsal = репетиція."}, {"q": "What was the money from the concert spent on?", "o": ["a trip", "new instruments", "a party", "new laptops"], "a": 1, "why": "The text says it was used to buy new instruments."}, {"q": "The question says «happier», the text says «in a better mood». This is an example of…", "o": ["a distractor", "a mistake", "a title", "a synonym / paraphrase"], "a": 3, "why": "The same idea is expressed with different words."}, {"q": "To «compose» a song means to…", "o": ["write it", "sing it badly", "buy it", "forget it"], "a": 0, "why": "Compose = create music."}]}, {"n": "104", "t": "Vocabulary: films and television", "g": "You will use words for types of films and TV programmes and talk about cultural heritage on screen.", "k": "Unit 10 · Show time! · Vocabulary · SB p.116", "terms": [["documentary", "документальний фільм"], ["series", "серіал"], ["plot", "сюжет"], ["director", "режисер"], ["cast", "акторський склад"], ["subtitles", "субтитри"]], "th": [{"h": "Types of films and programmes", "p": ["Learn the names of genres so you can say what you like and why."], "ul": ["action film — бойовик", "comedy — комедія", "horror film — фільм жахів", "science fiction (sci-fi) — наукова фантастика", "animation / cartoon — анімація / мультфільм", "documentary — документальний фільм", "reality show — реаліті-шоу", "quiz show / talk show / the news — вікторина / ток-шоу / новини"]}, {"h": "People and parts of a film", "p": ["These words help you write or speak about a film in more detail."], "ul": ["director — режисер (The film was directed by…)", "cast — акторський склад; leading role — головна роль", "plot — сюжет; ending — кінцівка", "scene — сцена; soundtrack — саундтрек", "special effects — спецефекти", "subtitles / dubbed — субтитри / дубльований", "review — рецензія; critic — критик", "episode — серія; season — сезон"]}, {"h": "Talking about films and cultural heritage", "p": ["Films and TV help people learn about other cultures and keep their own traditions alive. Ukrainian films, for example, often show folk traditions, history and music.", "Use these phrases to give your opinion."], "ul": ["It's set in… (place/time) / It's based on a true story.", "The acting was brilliant / unconvincing.", "The plot was gripping / predictable.", "I'd recommend it to anyone who likes…", "Do you prefer watching films with subtitles or dubbed? Why?", "Which film shows Ukrainian culture best, in your opinion?"]}], "f": "The first Academy Awards ceremony in 1929 is said to have lasted only about 15 minutes.", "pr": ["WB p. 59 – Vocabulary 1.", "Write a mini-review (60–80 words) of a film or series you like: genre, setting, plot (no spoilers!), acting, recommendation."], "q": ["What is the difference between a documentary and a reality show?", "Who is the director of a film?", "What does «a gripping plot» mean?", "How can films help to protect cultural heritage?"], "qz": [{"q": "A film about real animals in the wild is a…", "o": ["comedy", "documentary", "horror film", "talk show"], "a": 1, "why": "Documentaries show real facts and events."}, {"q": "All the actors in a film are the…", "o": ["cast", "crew", "plot", "scene"], "a": 0, "why": "Cast = акторський склад."}, {"q": "The story of a film is its…", "o": ["soundtrack", "episode", "plot", "subtitle"], "a": 2, "why": "Plot = what happens in the story."}, {"q": "I watched the Japanese film with English ___.", "o": ["effects", "reviews", "seasons", "subtitles"], "a": 3, "why": "Subtitles show translated words on screen."}, {"q": "«The ending was ___ – I guessed it from the start.»", "o": ["predictable", "gripping", "surprising", "breathtaking"], "a": 0, "why": "Predictable = easy to guess."}, {"q": "The film is ___ a true story.", "o": ["set on", "based on", "made of", "directed on"], "a": 1, "why": "Based on a true story is the fixed phrase."}]}, {"n": "105", "t": "Grammar: reported speech – statements", "g": "You will report what people said, changing tenses, pronouns, possessives and time and place words correctly.", "k": "Unit 10 · Show time! · Grammar · SB p.117", "terms": [["reported speech", "непряма мова"], ["direct speech", "пряма мова"], ["to report", "передавати (чиїсь слова)"], ["backshift", "зсув часів"], ["reporting verb", "дієслово, що вводить непряму мову"]], "th": [{"h": "Tense changes (backshift)", "p": ["When we report what someone said in the past (with said or told), the verb usually moves one step back into the past.", "Use say (that) without a person, but tell + person (that): She said (that)… / She told me (that)…"], "ul": ["present simple → past simple: «I like jazz.» → He said he liked jazz.", "present continuous → past continuous: «I'm watching TV.» → She said she was watching TV.", "past simple → past perfect: «We saw the film.» → They said they had seen the film.", "present perfect → past perfect: «I've finished.» → He said he had finished.", "will → would: «I'll come.» → She said she would come.", "can → could; must → had to: «I must go.» → He said he had to go."]}, {"h": "Pronouns and possessives", "p": ["Change pronouns and possessive words so they make sense from the point of view of the person who reports."], "ul": ["«I love my guitar,» said Max. → Max said he loved his guitar.", "«We are ready,» the girls said. → The girls said they were ready.", "«You can borrow my book,» Anna told me. → Anna told me I could borrow her book.", "I → he/she; we → they; my → his/her; our → their; me → him/her"]}, {"h": "Time and place words", "p": ["Time and place often change too, because the report is made at a different time or in a different place."], "ul": ["now → then", "today → that day; tonight → that night", "yesterday → the day before / the previous day", "tomorrow → the next day / the following day", "last week → the week before; next week → the following week", "here → there; this → that; these → those", "ago → before", "Common mistake: ✗ She told that… ✓ She said that… / She told me that…"]}], "f": "", "pr": ["WB p. 60 – Grammar 1.", "Write down 5 things people said to you today (family, friends, teachers) and report them, e.g. Mum said she would cook pizza that evening."], "q": ["What happens to the present simple in reported speech?", "What is the difference between say and tell?", "How does «tomorrow» change in reported speech?", "How does «my» change when a boy speaks about himself?"], "qz": [{"q": "«I am tired,» said Olena. → Olena said she ___ tired.", "o": ["is", "was", "has been", "will be"], "a": 1, "why": "Present simple → past simple."}, {"q": "«We will win,» they said. → They said they ___ win.", "o": ["will", "would", "are", "had"], "a": 1, "why": "Will → would."}, {"q": "Choose the correct sentence.", "o": ["He told that he was busy.", "He said me he was busy.", "He told me he was busy.", "He said to that he was busy."], "a": 2, "why": "Tell needs a person: told me."}, {"q": "«I saw this film yesterday.» → She said she had seen that film ___.", "o": ["yesterday", "tomorrow", "the next day", "the day before"], "a": 3, "why": "Yesterday → the day before."}, {"q": "«I've lost my ticket,» said Ivan. → Ivan said he ___ his ticket.", "o": ["had lost", "has lost", "have lost", "was losing"], "a": 0, "why": "Present perfect → past perfect."}, {"q": "«I can play the piano,» said Dasha. → Dasha said she ___ the piano.", "o": ["can play", "could play", "could played", "plays"], "a": 1, "why": "Can → could + base verb."}, {"q": "«The concert is here,» he said. → He said the concert was ___.", "o": ["here", "now", "there", "this"], "a": 2, "why": "Here → there."}]}, {"n": "106", "t": "Listening + Speaking: films, TV and cultural diversity", "g": "You will practise listening for opinions and details and discuss films and TV programmes, asking and answering questions.", "k": "Unit 10 · Show time! · Listening + Speaking · SB pp.118-119", "terms": [["to recommend", "рекомендувати"], ["to prefer", "віддавати перевагу"], ["cultural diversity", "культурне розмаїття"], ["tradition", "традиція"], ["to suggest", "пропонувати"]], "th": [{"h": "Listening strategies: opinions and attitudes", "p": ["In some exam tasks you must decide how a speaker feels or what they think. Listen to tone of voice and to words like actually, to be honest, but.", "Speakers can change their minds, so listen to the whole answer."], "ul": ["Before listening, predict possible opinions for each question.", "Listen for opinion words: amazing, disappointing, overrated, worth seeing.", "«To be honest…» or «Actually…» often introduces the real opinion.", "«I expected… but…» – the part after but is usually the answer.", "Use the pause to read the next question."]}, {"h": "Useful phrases: asking, answering, suggesting", "p": ["In pair work you ask about preferences, give reasons and make a decision together."], "ul": ["Asking: What kind of films are you into? / Have you seen…? / What's it about?", "Answering: I'm really into… / I can't stand… / It's about…", "Giving reasons: because the special effects are… / since I love…", "Suggesting: Why don't we watch…? / How about…? / Let's…", "Responding: Sounds good! / I'd rather… / I'm not keen on…", "Deciding: OK, so we agree on…"]}, {"h": "Model dialogue", "p": ["A: What shall we watch for the class film evening? B: How about a documentary about festivals around the world? It shows lots of different traditions. A: Sounds interesting, but I'm not keen on documentaries. To be honest, I'd rather watch a comedy. B: What about a Ukrainian comedy then? It's funny and it shows our culture. A: Good idea! My cousin said it was the best film he had seen that year. B: OK, so we agree on a Ukrainian comedy!"], "ul": ["Find the suggestion phrases.", "Find an example of reported speech.", "Practise the dialogue and then change the film types."]}], "f": "Oleksandr Dovzhenko's silent film «Earth» (1930) is often included in lists of the greatest films ever made.", "pr": ["WB p. 60 – Listening.", "Record a 1-minute talk: «A film or TV programme that shows the culture of a country», saying what it is about and why you recommend it."], "q": ["Which phrases often introduce a speaker's real opinion?", "How can you make a suggestion?", "How can you politely say no to a suggestion?", "Why are films important for cultural diversity?"], "qz": [{"q": "A speaker says: «I expected it to be boring, but actually it was brilliant.» What is their opinion?", "o": ["It was boring.", "They didn't watch it.", "It was brilliant.", "They don't know."], "a": 2, "why": "The opinion after «but actually» is the real one."}, {"q": "Which phrase makes a suggestion?", "o": ["I can't stand it.", "Why don't we watch a cartoon?", "It's about a dog.", "I'm into comedies."], "a": 1, "why": "Why don't we…? is a suggestion."}, {"q": "«I'm not keen on horror films» means…", "o": ["I don't really like them.", "I love them.", "I make them.", "I have never heard of them."], "a": 0, "why": "Not keen on = don't like much."}, {"q": "Complete: «I'd ___ watch a comedy.»", "o": ["prefer", "like", "rather", "enjoy"], "a": 2, "why": "I'd rather + base verb."}, {"q": "«Cultural diversity» means…", "o": ["one culture for everyone", "many different cultures", "a film festival", "a TV show"], "a": 1, "why": "Diversity = variety."}, {"q": "What's a good way to ask about a film?", "o": ["What's it about?", "What is it costs?", "Where it is about?", "How it about?"], "a": 0, "why": "What's it about? is the correct question."}]}, {"n": "107", "t": "Vocabulary: phrasal verbs for entertainment", "g": "You will understand and use phrasal verbs connected with shows, films, music and free time.", "k": "Unit 10 · Show time! · Vocabulary · SB p.120", "terms": [["to put on (a show)", "ставити (виставу)"], ["to turn up", "з'являтися, приходити; робити гучніше"], ["to sell out", "розпродати(ся)"], ["to look forward to", "з нетерпінням чекати"], ["to take up", "почати займатися (хобі)"], ["to give up", "кидати, припиняти"]], "th": [{"h": "Phrasal verbs for shows and events", "p": ["Many phrasal verbs are used when we talk about performances, concerts and films. Learn each one with an example sentence."], "ul": ["put on a show / a play — ставити виставу (Our class is putting on a play.)", "turn up — прийти, з'явитися (Only ten people turned up.)", "sell out — розпродати (The tickets sold out in an hour.)", "call off — скасувати (The concert was called off because of rain.)", "show off — хизуватися (He always shows off on stage.)", "look forward to — з нетерпінням чекати (I'm looking forward to the festival.)", "turn up / turn down — зробити гучніше / тихіше (Turn the music down!)"]}, {"h": "Phrasal verbs for hobbies and learning", "p": ["These verbs help you talk about your interests and how they change over time."], "ul": ["take up — почати займатися (I took up the guitar last year.)", "give up — кинути (Don't give up – practice makes perfect!)", "carry on — продовжувати (Carry on singing!)", "join in — приєднатися (Everyone joined in the song.)", "pick up — швидко навчитися (She picked up the tune by ear.)", "fall for — закохатися, захопитися (I fell for jazz when I was ten.)"]}, {"h": "Grammar notes", "p": ["Look forward to is followed by a noun or -ing form, not the infinitive. Some phrasal verbs can be separated by the object; with pronouns the pronoun goes in the middle."], "ul": ["✓ I'm looking forward to seeing you. ✗ I'm looking forward to see you.", "✓ They called the match off. / They called it off.", "✓ Turn it down, please. ✗ Turn down it.", "Turn up has two meanings: arrive / make louder – check the context."]}], "f": "", "pr": ["WB p. 61 – Vocabulary 2.", "Write a short story (8–10 sentences) about a school concert that almost went wrong, using at least 6 phrasal verbs from the lesson."], "q": ["What are the two meanings of «turn up»?", "What form follows «look forward to»?", "What does «call off» mean?", "Which phrasal verb means to start a new hobby?"], "qz": [{"q": "The festival was ___ because of the storm.", "o": ["called off", "turned up", "taken up", "shown off"], "a": 0, "why": "Call off = cancel."}, {"q": "I'm looking forward to ___ the band live.", "o": ["see", "seeing", "saw", "seen"], "a": 1, "why": "Look forward to + -ing."}, {"q": "My sister ___ the violin when she was eight.", "o": ["gave up", "sold out", "took up", "called off"], "a": 2, "why": "Take up = start a hobby."}, {"q": "The music is too loud. Please turn ___.", "o": ["down it", "it up", "up it", "it down"], "a": 3, "why": "Turn down = make quieter; pronoun goes in the middle."}, {"q": "We waited for an hour, but our friend didn't ___.", "o": ["turn up", "give up", "put on", "carry on"], "a": 0, "why": "Turn up = arrive."}, {"q": "Everyone ___ when the band played the national anthem.", "o": ["called off", "joined in", "sold out", "showed off"], "a": 1, "why": "Join in = take part with others."}]}, {"n": "108", "t": "Grammar: reported speech – questions and requests", "g": "You will report questions and requests correctly, using statement word order, if/whether and ask/tell + infinitive.", "k": "Unit 10 · Show time! · Grammar · SB p.121", "terms": [["reported question", "непряме питання"], ["request", "прохання"], ["command", "наказ, команда"], ["word order", "порядок слів"], ["whether", "чи"]], "th": [{"h": "Reported wh- questions", "p": ["Use ask (or want to know / wonder) + question word + subject + verb. The word order is like a statement, there is no do/does/did and no question mark. Tenses, pronouns and time words change as in reported statements."], "ul": ["«Where do you live?» → She asked me where I lived.", "«What are you watching?» → He asked what I was watching.", "«When did the film start?» → They asked when the film had started.", "«Who is your favourite actor?» → She asked me who my favourite actor was.", "✗ He asked me where did I go. ✓ He asked me where I had gone."]}, {"h": "Reported yes/no questions", "p": ["For questions without a question word, use if or whether. Whether is a little more formal."], "ul": ["«Do you like rock music?» → He asked if I liked rock music.", "«Have you seen the new series?» → She asked whether I had seen the new series.", "«Will you come to the concert?» → They asked if I would come to the concert.", "«Can you sing?» → The teacher asked if I could sing.", "Remember: subject before verb – asked if I could, not asked if could I."]}, {"h": "Reported requests and commands", "p": ["For requests use ask + person + (not) to + infinitive. For commands and instructions use tell + person + (not) to + infinitive."], "ul": ["«Please turn off your phones.» → The usher asked us to turn off our phones.", "«Don't talk during the film.» → She told us not to talk during the film.", "«Could you help me with the tickets?» → He asked me to help him with the tickets.", "«Sit down!» → The teacher told the students to sit down.", "Negative: not + to (not to be late), never ✗ to not."]}], "f": "", "pr": ["WB p. 62 – Grammar 2.", "Imagine you interviewed a famous musician or actor. Write 4 questions you asked and report them, plus 2 requests (e.g. I asked her where she had grown up)."], "q": ["What happens to word order in reported questions?", "When do we use if or whether?", "How do you report «Don't be late!»?", "What is the difference between ask and tell in reported requests and commands?"], "qz": [{"q": "«Where is the cinema?» → She asked me where the cinema ___.", "o": ["is it", "was", "did it be", "was it"], "a": 1, "why": "Statement word order + backshift: the cinema was."}, {"q": "«Do you play the drums?» → He asked ___ I played the drums.", "o": ["that", "what", "if", "did"], "a": 2, "why": "Yes/no questions are reported with if/whether."}, {"q": "«Please close the door.» → Mum asked me ___ the door.", "o": ["close", "closing", "that I close", "to close"], "a": 3, "why": "Ask + person + to + infinitive."}, {"q": "«Don't touch the camera!» → The director told us ___ the camera.", "o": ["not to touch", "to not touch", "don't touch", "not touching"], "a": 0, "why": "Negative command: not to + infinitive."}, {"q": "Choose the correct sentence.", "o": ["She asked me what was I doing.", "She asked me what I was doing.", "She asked me what did I do?", "She asked what I am doing?"], "a": 1, "why": "Statement order, backshift, no question mark."}, {"q": "«Are you enjoying the show?» → They asked me if I ___ the show.", "o": ["am enjoying", "was enjoying", "did enjoy", "enjoying"], "a": 1, "why": "Present continuous → past continuous, with subject + verb order."}, {"q": "«Will you help me?» → She asked whether I ___ help her.", "o": ["will", "would", "am", "did"], "a": 1, "why": "Will → would."}]}, {"n": "109", "t": "Writing: a story with a given beginning", "g": "You will plan and write a story that continues a given first sentence, ordering events clearly and making the story interesting.", "k": "Unit 10 · Show time! · Writing · SB pp.122-123", "terms": [["plot", "сюжет"], ["narrative tenses", "оповідні часи"], ["climax", "кульмінація"], ["sequence of events", "послідовність подій"], ["direct speech", "пряма мова"]], "th": [{"h": "Story structure", "p": ["In an exam story you are often given the first sentence. You must continue from it, so your story must match the person (I/he/she), tense and situation in that sentence.", "Plan for two minutes: who, where, what problem, what happens, how it ends."], "ul": ["Paragraph 1 – Beginning: use the given sentence; set the scene (who, where, when).", "Paragraph 2 – Development: something happens or a problem appears.", "Paragraph 3 – Climax: the most exciting or important moment.", "Paragraph 4 – Ending: how the problem is solved and how the characters feel.", "Use a title if the task asks for one.", "Keep to the word limit."]}, {"h": "Useful language: ordering events and fixed phrases", "p": ["Sequencing words help the reader follow the story. Narrative tenses make it clear what happened first."], "ul": ["At first… / Then… / After that… / Later… / In the end…", "As soon as… / While… / Just then… / Suddenly…", "To my surprise… / Luckily… / Unfortunately…", "Past simple for main events: I opened the door.", "Past continuous for background: The band was playing loudly.", "Past perfect for earlier events: I realised I had left my ticket at home.", "Feelings: I was over the moon / scared stiff / speechless."]}, {"h": "Model story (original)", "p": ["Given beginning: «The music stopped, and everyone turned to look at me.» The music stopped, and everyone turned to look at me. I was standing on the stage of our school hall with a microphone in my hand, but I had forgotten every word of my song. My heart was beating fast. Just then, my best friend Sofia stood up in the front row and began to sing the first line. To my surprise, the whole audience joined in. In the end I sang the song with three hundred people, and it was the best concert of my life."], "ul": ["Checklist: Did I start with the given sentence?", "Is there a clear beginning, middle (climax) and end?", "Did I use sequencing words and narrative tenses?", "Did I describe feelings and use some direct speech?", "Did I check spelling, punctuation and word count?"]}], "f": "", "pr": ["WB p. 63 – Writing (use the Writing Reference).", "Write a story (140–180 words) beginning: «As soon as I heard the first song, I knew this day would be special.»"], "q": ["Why must your story match the given first sentence?", "Which tense do we use for background actions in a story?", "Name four sequencing words.", "What is the climax of a story?"], "qz": [{"q": "Which tense is best for background description? «The sun ___ and people were dancing.»", "o": ["shines", "was shining", "has shone", "will shine"], "a": 1, "why": "Past continuous describes the background."}, {"q": "«When I got to the station, the train ___.» (It left before I arrived.)", "o": ["had already left", "already leaves", "has already left", "is leaving"], "a": 0, "why": "Past perfect shows an earlier past action."}, {"q": "Which word shows something unexpected happened?", "o": ["Firstly", "Later", "Suddenly", "Finally"], "a": 2, "why": "Suddenly introduces a surprise event."}, {"q": "The given first sentence is «She opened the letter with shaking hands.» Your story should be written…", "o": ["in the first person (I)", "in the future tense", "as a formal email", "in the third person (she) and in the past"], "a": 3, "why": "Continue with the same person and tense."}, {"q": "Which phrase is the best for the ending?", "o": ["In the end,", "Just then,", "While,", "At first,"], "a": 0, "why": "In the end introduces the final result."}, {"q": "«I was over the moon» means I was…", "o": ["frightened", "very happy", "in space", "tired"], "a": 1, "why": "Over the moon = extremely happy."}]}, {"n": "110", "t": "Video: filming hummingbirds in slow motion", "g": "You will learn about slow-motion wildlife filming, take notes while watching and discuss careers in photography and film.", "k": "Unit 10 · Show time! · Video · SB p.124", "terms": [["slow motion", "уповільнена зйомка"], ["frame", "кадр"], ["wildlife photographer", "фотограф дикої природи"], ["to capture", "зафіксувати, зняти"], ["lens", "об'єктив"], ["patience", "терпіння"]], "th": [{"h": "Background: why slow motion?", "p": ["Some animals move so fast that our eyes cannot see the details. Hummingbirds are tiny birds that live in North and South America; their wings move so quickly that they look like a blur. Special cameras take hundreds or even thousands of frames per second. When the film is played at normal speed, the action looks much slower, so we can see every movement of the wings.", "Wildlife filmmakers need patience: they may wait for hours or days to capture a few seconds of perfect film."], "ul": ["frame — кадр; frames per second — кадрів за секунду", "to film / to shoot — знімати", "tripod — штатив", "close-up — великий план", "to edit — монтувати, редагувати", "footage — відзнятий матеріал"]}, {"h": "Taking notes and summarising", "p": ["While watching, don't write full sentences. Write key words, numbers and names. After watching, use your notes to write a short summary in your own words."], "ul": ["Before watching: write 3 questions you want answered.", "While watching: note who, where, what equipment, what problem, what result.", "Use symbols: → (leads to), + (and), ≠ (different from).", "After watching: write 3–4 sentences – main idea first, then details.", "Use the passive where useful: The birds were filmed with a high-speed camera."]}, {"h": "Discussion: careers in photography and film", "p": ["Think about your own interests and talents. Could a job in film, photography or media suit you?"], "ul": ["Would you like to be a wildlife filmmaker? Why / why not?", "What skills and qualities does a photographer need?", "Which jobs in the film industry do you know (director, editor, camera operator, sound engineer)?", "How can technology help scientists learn about animals?", "Is it right to disturb animals in order to film them?"]}], "f": "Some hummingbirds beat their wings more than 50 times per second, which is why slow-motion cameras are needed to see the movement clearly.", "pr": ["Study Student Resources Unit 9 & 10 Wordlists and write a short reflection: 10 words you now know well and 5 words you still need to practise.", "Write a summary (60–80 words) of the video using your notes and at least two passive sentences."], "q": ["Why do filmmakers use slow motion for hummingbirds?", "What is a frame?", "How should you take notes while watching a video?", "What qualities does a wildlife filmmaker need?"], "qz": [{"q": "Slow-motion cameras work by…", "o": ["taking very few photos", "taking many frames per second", "using no light", "recording sound only"], "a": 1, "why": "More frames per second let the film be slowed down."}, {"q": "«Footage» means…", "o": ["recorded film material", "a type of shoe", "a camera stand", "a bird's foot"], "a": 0, "why": "Footage = відзнятий матеріал."}, {"q": "A ___ keeps the camera still.", "o": ["lens", "frame", "tripod", "close-up"], "a": 2, "why": "A tripod is a three-legged stand."}, {"q": "What is the best way to take notes while watching?", "o": ["Write full sentences", "Translate everything", "Write nothing", "Write key words and numbers"], "a": 3, "why": "Short notes let you keep watching."}, {"q": "Choose the correct passive sentence.", "o": ["The birds filmed by a special camera.", "The birds were filmed with a special camera.", "The birds were film with a special camera.", "The birds was filmed with a special camera."], "a": 1, "why": "Were + past participle; with for the tool."}, {"q": "Which quality is most important for a wildlife filmmaker waiting for animals?", "o": ["patience", "speed", "loudness", "impatience"], "a": 0, "why": "They often wait for hours or days."}]}, {"n": "111", "t": "End-of-Unit 10 Revision: show time!", "g": "You will revise the vocabulary and grammar of Unit 10 and check what you need to practise more.", "k": "Unit 10 · Show time! · End-of-Unit Revision", "terms": [["revision", "повторення"], ["reported speech", "непряма мова"], ["genre", "жанр"], ["phrasal verb", "фразове дієслово"], ["narrative", "розповідь"]], "th": [{"h": "Vocabulary summary", "p": ["Look through the words and check that you can use them in a sentence. Find any you've forgotten in the Unit 10 Wordlist."], "ul": ["Festivals: audience, performer, stage, line-up, headliner, sold out, atmosphere", "Music: instrument, compose, rehearsal, relieve stress", "Films and TV: documentary, series, plot, cast, director, subtitles, episode", "Opinions: gripping, predictable, worth seeing, overrated", "Phrasal verbs: put on, turn up, sell out, call off, take up, give up, look forward to", "Video: slow motion, frame, footage, tripod, capture"]}, {"h": "Grammar summary: reported speech", "p": ["When the reporting verb is in the past, move tenses back, and change pronouns, possessives, time and place words."], "ul": ["Statement: «I'm busy today.» → She said she was busy that day.", "say vs tell: He said (that)… / He told me (that)…", "Wh- question: «Where are you going?» → He asked where I was going.", "Yes/no question: «Is it new?» → She asked if/whether it was new.", "Request: «Please wait.» → He asked me to wait.", "Command: «Don't run!» → She told us not to run."]}, {"h": "Writing summary and self-check", "p": ["A story continues a given beginning, has a clear plot with a climax and ending, and uses narrative tenses and sequencing words. Mark yourself: I can do it well / I need more practice."], "ul": ["I can describe festivals and events.", "I can talk about types of films and TV programmes.", "I can use entertainment phrasal verbs.", "I can report statements, questions and requests.", "I can write a story from a given first sentence.", "I can take notes while watching a video and summarise it."]}], "f": "", "pr": ["WB p. 85 – Review Unit 10.", "Report a short real conversation (6–8 lines) you had this week, using statements, questions and a request in reported speech."], "q": ["How do you report a yes/no question?", "What happens to «yesterday» in reported speech?", "Name three film genres and three people who work on a film.", "What should a good story include?"], "qz": [{"q": "«I'm watching a series now,» said Tom. → Tom said he ___ a series then.", "o": ["watches", "is watching", "was watching", "watched"], "a": 2, "why": "Present continuous → past continuous."}, {"q": "«Can you help me?» → She asked ___ help her.", "o": ["if I could", "could I", "if could I", "that I can"], "a": 0, "why": "If + subject + verb, with can → could."}, {"q": "«Don't be late!» → Mum told me ___ late.", "o": ["don't be", "not be", "to not being", "not to be"], "a": 3, "why": "Tell + person + not to + infinitive."}, {"q": "The concert was ___ because the singer was ill.", "o": ["called off", "turned up", "sold out", "taken up"], "a": 0, "why": "Call off = cancel."}, {"q": "A film about real events and facts is a…", "o": ["sci-fi film", "documentary", "cartoon", "horror film"], "a": 1, "why": "Documentaries are factual."}, {"q": "«What time does the show start?» → He asked what time the show ___.", "o": ["does start", "did start", "started", "starts it"], "a": 2, "why": "Statement order and backshift: started."}, {"q": "Which sentence is correct?", "o": ["She told that she liked jazz.", "She said me that she liked jazz.", "She told to me she liked jazz.", "She told me that she liked jazz."], "a": 3, "why": "Tell + person (that)."}]}, {"n": "112", "t": "Progress Test: Units 9 & 10", "g": "You will show what you have learnt in Units 9 and 10 and reflect on your progress.", "k": "Unit 10 · Show time! · Progress Test · Units 9&10", "terms": [["progress test", "тест на перевірку прогресу"], ["task type", "тип завдання"], ["to revise", "повторювати"], ["self-assessment", "самооцінювання"], ["mark", "оцінка, бал"]], "th": [{"h": "What is tested", "p": ["The Progress Test checks the vocabulary, grammar and skills from Unit 9 (Digital world) and Unit 10 (Show time!). Revise both units before you start."], "ul": ["Vocabulary: computers and technology, technology collocations and phrasal verbs; festivals, music, films and TV, entertainment phrasal verbs.", "Grammar: the passive (all tenses, with modals, by/with); reported speech (statements, questions, requests).", "Reading: gapped text and detail questions.", "Listening: specific information and speakers' opinions.", "Writing: an opinion essay or a story with a given beginning."]}, {"h": "How to prepare and test strategies", "p": ["Don't try to learn everything the night before. Revise a little each day, then do a practice task with a timer."], "ul": ["Read your notes for lessons 92–111 and the two unit wordlists.", "Redo the quizzes you found difficult.", "Read every instruction carefully – underline what you must do.", "Do the easy tasks first, then come back to difficult ones.", "In grammar tasks, check the tense and the subject.", "Leave 5 minutes at the end to check spelling and answers.", "Never leave a multiple-choice question blank."]}, {"h": "Sample tasks (original) and reflection", "p": ["Practice A – Passive: Rewrite «Someone stole my laptop yesterday.» → My laptop ___ yesterday. (was stolen) Practice B – Reported speech: «I'll call you tomorrow,» said Max. → Max said he ___ me the next day. (would call) Practice C – Vocabulary: The tickets for the concert ___ out in an hour. (sold)", "After the test, think about your results and plan what to improve."], "ul": ["Which task was the easiest for me? Why?", "Which task was the most difficult? What will I practise?", "Did I manage my time well?", "I can use the passive correctly: yes / not yet.", "I can use reported speech correctly: yes / not yet.", "My goal for the next units is…"]}], "f": "", "pr": ["Write a short reflection (5–6 sentences): what went well in the test, what was difficult and how you will improve.", "Choose the grammar point (passive or reported speech) you found harder and write 8 new example sentences with it."], "q": ["Which grammar topics are tested in Units 9 and 10?", "What should you do if a question is too difficult?", "Why is it useful to leave time at the end of a test?", "What will you practise more after the test?"], "qz": [{"q": "The new phone ___ next month.", "o": ["will release", "will be released", "is releasing", "released"], "a": 1, "why": "Future passive: will be + past participle."}, {"q": "«I've seen this film,» said Kate. → Kate said she ___ that film.", "o": ["has seen", "saw", "had seen", "sees"], "a": 2, "why": "Present perfect → past perfect."}, {"q": "Homework must ___ on time.", "o": ["be done", "do", "been done", "doing"], "a": 0, "why": "Modal + be + past participle."}, {"q": "He asked me ___ my favourite singer was.", "o": ["that", "if", "whether", "who"], "a": 3, "why": "A wh- question is reported with the question word."}, {"q": "I'm looking forward ___ the festival.", "o": ["to", "for", "at", "on"], "a": 0, "why": "Look forward to is a fixed phrase."}, {"q": "What is a good strategy if a test question is too difficult?", "o": ["Stop the test", "Move on and come back later", "Copy from a friend", "Leave the test early"], "a": 1, "why": "Don't waste time; return to it at the end."}, {"q": "Which word completes the collocation: «___ up your files»?", "o": ["back", "set", "turn", "give"], "a": 0, "why": "Back up your files = make a copy."}]}]}, {"name": "Unit 11. Life lessons (Життєві уроки)", "lessons": [{"n": "113", "t": "Unit Opener + Vocabulary for Reading: life lessons and education", "g": "You will talk about different ways of learning and learn key education words to prepare for the unit's reading text.", "k": "Unit 11 · Life lessons · Unit Opener + Vocabulary for Reading · SB pp.125-126", "terms": [["education", "освіта"], ["practical skills", "практичні навички"], ["life lesson", "життєвий урок"], ["experience", "досвід"], ["to enrol on a course", "записатися на курс"], ["qualification", "кваліфікація"]], "th": [{"h": "What is this unit about?", "p": ["Unit 11 is called «Life lessons». We learn at school, but we also learn at home, in clubs, online and from our mistakes. Some lessons come from books, and others come from real experience: cooking a meal, fixing a bike or helping a friend.", "In this unit you will read about a college that teaches practical skills, talk about school and your future, and learn a new grammar structure — the causative (have/get something done)."], "ul": ["Think: what is the most useful thing you have learned outside school?", "Do you prefer learning from books or by doing things?", "Which practical skill would you like to learn: cooking, sewing, first aid, repairing things?", "Who taught you an important life lesson?", "Should schools teach more practical skills? Why / why not?"]}, {"h": "Key vocabulary for reading", "p": ["Learn these words before you read. Say each word aloud and make your own example sentence with it."], "ul": ["course — курс (I'm doing a cooking course this summer.)", "subject — шкільний предмет (My favourite subject is biology.)", "practical — практичний (It's a very practical course — you learn by doing.)", "hands-on — практичний, «руками» (We had a hands-on lesson in the lab.)", "skill — навичка (Time management is an important skill.)", "experience — досвід (She has a lot of experience with children.)", "instructor — інструктор (The instructor showed us how to use the tools.)", "certificate — сертифікат, свідоцтво (You get a certificate at the end of the course.)"]}, {"h": "Discussion in pairs", "p": ["Work with a partner or record yourself. Answer in full sentences and give reasons. Use phrases for talking about yourself and your opinion."], "ul": ["I've always wanted to learn how to …", "In my opinion, the most useful skill is … because …", "I learned this when I was … years old.", "I think I learn best when …", "For me, school is important because …", "One thing I would change about education is …"]}], "f": "The University of Bologna in Italy, founded in 1088, is often called the oldest university in continuous operation in the Western world.", "pr": ["Study the Student Resources Unit 11 Wordlist on your own: copy 10 new words with translations into your vocabulary notebook.", "Write 5 sentences about life lessons you have learned outside school (for example, at home, in sport, while travelling)."], "q": ["What is the difference between a «subject» and a «course»?", "What does «hands-on» learning mean?", "Name three practical skills that could be taught at school.", "What is the topic of Unit 11?"], "qz": [{"q": "Which word means «a skill or knowledge you get by doing something»?", "o": ["experience", "subject", "certificate", "instructor"], "a": 0, "why": "«Experience» is knowledge or skill you get from doing or seeing things."}, {"q": "Maths, history and biology are school …", "o": ["courses", "subjects", "skills", "certificates"], "a": 1, "why": "School disciplines like maths and history are called subjects."}, {"q": "A «hands-on» lesson is a lesson where you …", "o": ["only listen to the teacher", "read a long text", "do things yourself", "write a test"], "a": 2, "why": "«Hands-on» means learning by actually doing something."}, {"q": "At the end of the first aid course, everyone got a …", "o": ["experience", "certificate", "subject", "instructor"], "a": 1, "why": "A certificate is an official document that shows you finished a course."}, {"q": "The person who teaches a practical course, like driving or swimming, is often called an …", "o": ["instructor", "author", "employer", "audience"], "a": 0, "why": "An instructor teaches a practical skill."}, {"q": "Which sentence is correct?", "o": ["I want to enrol at a course.", "I want to enrol on a course.", "I want to enrol to a course.", "I want to enrol with a course."], "a": 1, "why": "In British English we say «enrol on a course»."}, {"q": "Which question is best for a discussion about life lessons?", "o": ["What have you learned from a mistake?", "Where is the library?", "What time is it?", "What is your phone number?"], "a": 0, "why": "This question invites people to share a life lesson and their opinion."}]}, {"n": "114", "t": "Reading: a college of practical skills (eliminating wrong options)", "g": "You will read a text about a practical-skills college and practise finding the correct answer by ruling out wrong options.", "k": "Unit 11 · Life lessons · Reading · SB pp.126-127", "terms": [["to eliminate", "виключати"], ["option", "варіант відповіді"], ["distractor", "відволікаючий (хибний) варіант"], ["evidence", "доказ, підтвердження"], ["paraphrase", "перефразування"], ["workshop", "майстерня; практичне заняття"]], "th": [{"h": "Before you read", "p": ["In the textbook you will read «Beautiville College». Before reading, look at the title and pictures and predict what the text is about. Then read the questions quickly so you know what information to look for.", "Below is a short original text on a similar topic for practice."], "ul": ["Read the title and guess the topic.", "Underline key words in each question.", "Skim the text once for the general idea.", "Scan for names, numbers and key words.", "Read the important parts slowly and carefully."]}, {"h": "Practice text: Greenfield Skills Centre", "p": ["Greenfield Skills Centre is not a typical school. There are no long lectures and almost no exams. Instead, students spend most of their day in workshops, where they learn to cook, build furniture, grow vegetables and repair bicycles. Courses last from two weeks to six months, and anyone over sixteen can join. Many students come after finishing school because they want to learn something useful before going to university. Others are adults who want to change their careers. The instructors are not professional teachers but experienced chefs, carpenters and gardeners. «We learn from our mistakes here,» says Olena, 17, who is doing a baking course. «Yesterday my bread was as hard as a stone, but the instructor helped me find out why.» At the end of each course, students don't get a grade — they get a certificate and a portfolio of their work."], "ul": ["Main idea: a centre where people learn practical skills by doing.", "Who can join? — anyone over 16.", "Who teaches? — experienced professionals, not teachers.", "What do students get? — a certificate and a portfolio, not grades."]}, {"h": "Exam tip: eliminate the wrong options", "p": ["In multiple-choice tasks, three options are wrong. Often they use words from the text but say something different. Cross out options that are clearly false, then compare the ones that are left with the text.", "Example: «The instructors at Greenfield are A) qualified teachers B) experts in their field C) students D) university professors.» A, C and D are wrong, because the text says the instructors are «not professional teachers but experienced chefs, carpenters and gardeners». So B is correct."], "ul": ["An option can be wrong because it says the opposite of the text.", "An option can be wrong because the text doesn't mention it.", "An option can be wrong because it is only partly true.", "Words that appear in the text are not always in the correct answer.", "The correct answer usually paraphrases the text.", "Always find evidence in the text for your final choice."]}], "f": "The word «school» comes from the ancient Greek word «scholē», which originally meant «leisure» or free time.", "pr": ["Workbook pp. 64-65: reading task and Exam Reminder.", "Write 4 multiple-choice questions (with 4 options each) about the Greenfield Skills Centre text. Mark the correct answer and explain why the other options are wrong."], "q": ["Why should you read the questions before reading the text?", "What is a distractor in a multiple-choice task?", "Give two reasons why an option can be wrong.", "Would you like to study at a centre like Greenfield? Why?"], "qz": [{"q": "According to the practice text, who teaches at Greenfield Skills Centre?", "o": ["Professional school teachers", "University professors", "Older students", "Experienced chefs, carpenters and gardeners"], "a": 3, "why": "The text says the instructors are experienced chefs, carpenters and gardeners."}, {"q": "How long do the courses last?", "o": ["Two years", "From two weeks to six months", "Exactly one year", "One weekend"], "a": 1, "why": "The text says courses last from two weeks to six months."}, {"q": "What do students receive at the end of a course?", "o": ["A university place", "A certificate and a portfolio", "A grade and a diploma", "Money"], "a": 1, "why": "Students get a certificate and a portfolio of their work, not a grade."}, {"q": "Why was Olena's bread a problem?", "o": ["It was burnt.", "It was very hard.", "It was too sweet.", "It was too soft."], "a": 1, "why": "She says her bread was «as hard as a stone»."}, {"q": "In a multiple-choice task, what is the best first step?", "o": ["Read only the last paragraph", "Read the questions and underline key words", "Choose answer A every time", "Translate every word"], "a": 1, "why": "Knowing the questions first helps you find the right information."}, {"q": "An option uses exact words from the text. This means it …", "o": ["should be ignored", "is always correct", "may be correct or wrong — check the meaning", "is always wrong"], "a": 2, "why": "Distractors often repeat words from the text but change the meaning."}, {"q": "Which statement about Greenfield is NOT true?", "o": ["Adults can study there.", "Students take many exams.", "There are workshops.", "You can learn to repair bicycles."], "a": 1, "why": "The text says there are almost no exams."}]}, {"n": "115", "t": "Vocabulary: education and school life", "g": "You will learn and use words and collocations about education, school subjects and exams.", "k": "Unit 11 · Life lessons · Vocabulary · SB p.128", "terms": [["to attend", "відвідувати"], ["to graduate", "закінчити (навчальний заклад)"], ["term", "семестр, чверть"], ["timetable", "розклад"], ["to revise", "повторювати (до іспиту)"], ["degree", "науковий ступінь, диплом"]], "th": [{"h": "Education words", "p": ["These words are useful when you talk about your school, your studies and your future plans. Learn them in groups — it is easier to remember them this way."], "ul": ["attend school/classes — відвідувати школу/заняття", "primary school — початкова школа", "secondary school — середня школа", "term — семестр, чверть", "timetable — розклад", "graduate (from) — закінчити навчальний заклад", "degree — ступінь (бакалавра, магістра)", "tuition fees — плата за навчання"]}, {"h": "Exam and study collocations", "p": ["Some verbs go together with exam words. In Ukrainian we «складаємо» an exam, but in English the verb depends on the meaning. Be careful: «pass an exam» means you were successful, «take an exam» just means you do it."], "ul": ["take / sit an exam — складати іспит (писати)", "pass an exam — скласти іспит успішно", "fail an exam — не скласти іспит", "revise for a test — повторювати матеріал до тесту", "get a good / bad mark — отримати хорошу / погану оцінку", "make progress — робити успіхи", "do homework / a project — робити домашнє завдання / проєкт", "learn by heart — вивчити напам'ять"]}, {"h": "Use it: example sentences", "p": ["Read the sentences and notice the collocations. Then write similar sentences about yourself."], "ul": ["I'm taking my English exam on Friday, so I'm revising every evening.", "She failed the test last year, but this time she passed with a high mark.", "My brother graduated from university with a degree in engineering.", "We have six lessons a day according to our timetable.", "You make progress faster if you practise a little every day.", "Which subjects do you want to study at university?"]}], "f": "The word «graduate» comes from the Latin word «gradus», which means «step».", "pr": ["Workbook p. 65, Vocabulary 1.", "Make a mind map called «My education» with at least 15 words and collocations from this lesson, and write 5 sentences about your school life."], "q": ["What is the difference between «take an exam» and «pass an exam»?", "What does «revise» mean in British English?", "What do you call the document that shows your lessons for every day?", "Which collocation means «вивчити напам'ять»?"], "qz": [{"q": "I studied hard, so I … the exam with a high mark.", "o": ["failed", "attended", "took", "passed"], "a": 3, "why": "«Pass an exam» means you were successful."}, {"q": "Before the test, I need to … the last three units.", "o": ["attend", "graduate", "fail", "revise"], "a": 3, "why": "«Revise» means to study again before a test."}, {"q": "My sister … from university last summer.", "o": ["graduated", "made", "passed", "attended"], "a": 0, "why": "We say «graduate from university» when you finish your studies."}, {"q": "Which verb goes with «progress»?", "o": ["do", "take", "get", "make"], "a": 3, "why": "The correct collocation is «make progress»."}, {"q": "The document that shows when each lesson starts is a …", "o": ["degree", "timetable", "term", "certificate"], "a": 1, "why": "A timetable shows the times of lessons."}, {"q": "«Tuition fees» are …", "o": ["homework tasks", "exam results", "school holidays", "money you pay for your studies"], "a": 3, "why": "Tuition fees are payments for education."}, {"q": "Choose the correct sentence.", "o": ["I did my homework.", "I made an exam.", "I did a mistake in the test.", "I made my homework."], "a": 0, "why": "We say «do homework»; «make a mistake», «take an exam»."}]}, {"n": "116", "t": "Grammar: the causative (have / get something done)", "g": "You will be able to form and use the causative to talk about things other people do for you.", "k": "Unit 11 · Life lessons · Grammar · SB p.129", "terms": [["the causative", "каузатив (конструкція have/get something done)"], ["past participle", "дієприкметник минулого часу (3-я форма)"], ["service", "послуга"], ["object", "додаток (об'єкт)"], ["to repair", "ремонтувати"]], "th": [{"h": "What is the causative?", "p": ["We use the causative when we arrange for another person (often a professional) to do something for us. We don't do it ourselves. Compare: «I cut my hair» (I did it myself) and «I had my hair cut» (a hairdresser did it).", "Form: have + object + past participle. In informal English we can also use get: get + object + past participle."], "ul": ["I have my bike repaired every spring.", "She is having her photo taken right now.", "We had our flat painted last month.", "They will have the windows cleaned tomorrow.", "I got my phone screen fixed yesterday. (informal)", "Have you ever had your eyes tested?"]}, {"h": "The causative in differen
