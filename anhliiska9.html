qz": [{"q": "I ___ like fish, but now I eat it every week.", "o": ["didn't use to", "didn't used to", "wasn't used", "would not"], "a": 0, "why": "Negative: didn't use to (no -d)."}, {"q": "When I was little, my dad ___ read me a story every night.", "o": ["is used to", "would", "gets used to", "use"], "a": 1, "why": "Would is fine for repeated past actions."}, {"q": "Which sentence is WRONG?", "o": ["We used to have a garden.", "I used to play the piano.", "We would have a big garden.", "My mum would sing in the kitchen."], "a": 2, "why": "Would is not used for past states like have (possession)."}, {"q": "She lives in Mexico, so she is used to ___ spicy food.", "o": ["eat", "ate", "eaten", "eating"], "a": 3, "why": "Be used to + -ing."}, {"q": "It was hard at first, but I ___ the new timetable.", "o": ["got used to", "used to", "would", "use to"], "a": 0, "why": "Get used to describes becoming familiar."}, {"q": "___ you use to walk to school?", "o": ["Were", "Did", "Are", "Would"], "a": 1, "why": "Questions: Did + subject + use to."}, {"q": "‘I'm used to cooking’ means…", "o": ["I cooked in the past, but not now.", "I will start cooking.", "Cooking is normal for me.", "I hate cooking."], "a": 2, "why": "Be used to = something is familiar and normal."}]}, {"n": "18", "t": "Writing: an article about a restaurant visit", "g": "You will plan and write an article about a visit to a restaurant or café, organising your ideas into clear paragraphs.", "k": "Unit 2 · Delicious! · Writing · SB pp.26-27", "terms": [["article", "стаття"], ["headline / title", "заголовок"], ["reader", "читач"], ["to recommend", "рекомендувати"], ["atmosphere", "атмосфера"], ["service", "обслуговування"]], "th": [{"h": "What is an article?", "p": ["An article is written for a magazine, school newspaper or website. Its aim is to interest and entertain readers, so the style is lively and personal. A good article has an interesting title and speaks directly to the reader.", "In the exam, read the task and underline who the readers are and what questions you must answer."], "ul": ["Catchy title: ‘A Taste of Italy in Rivne’", "Paragraph 1: hook the reader — a question or a surprising fact", "Paragraph 2: describe the place — location, atmosphere, service", "Paragraph 3: describe the food — what you ate and how it tasted", "Paragraph 4: your opinion and recommendation", "Length: usually 100–150 words"]}, {"h": "Useful language", "p": ["Use descriptive adjectives, direct questions to the reader and fixed expressions to make your article interesting."], "ul": ["Have you ever wondered where to find the best pancakes in town?", "It's located in… / It's just a five-minute walk from…", "The atmosphere was relaxed / cosy / lively.", "The staff were friendly and helpful.", "I ordered… / For dessert I had…", "It was absolutely delicious / a bit too salty.", "I'd definitely recommend it to… / It's worth a visit.", "If you're looking for…, this is the place for you!"]}, {"h": "Model article (original)", "p": ["Pancake Heaven! Do you love pancakes as much as I do? Last Saturday my friends and I visited a small café called Sunny Side, and it was a real surprise. The café is in the old part of town, and the atmosphere is warm and cosy, with plants everywhere and soft music. The waiters were friendly and the service was quick. I ordered pancakes with cherries and sour cream, and they were light, sweet and absolutely delicious. My friend tried a spicy chicken wrap and loved it too. The prices are reasonable, so it's perfect for students. If you're looking for a relaxed place to meet friends, I'd definitely recommend it!"], "ul": ["Title + question to the reader", "Past simple to describe the visit", "Taste adjectives from this unit", "Clear recommendation at the end"]}, {"h": "Checklist", "p": ["Read your article again before you finish."], "ul": ["Does it have an interesting title?", "Did I talk to the reader directly?", "Is each paragraph about one idea?", "Did I use a range of adjectives?", "Did I give a recommendation?", "Did I check grammar, spelling and word count?"]}], "f": "", "pr": ["Workbook p. 15, Writing, and read the Writing Reference for articles.", "Write an article (120–150 words) for your school website about a restaurant, café or meal you enjoyed."], "q": ["How is an article different from an email?", "How can you begin an article to interest readers?", "What should the last paragraph include?", "Name five adjectives to describe a restaurant or food."], "qz": [{"q": "What is the main aim of an article?", "o": ["to complain to a company", "to interest and entertain readers", "to ask for a job", "to write to one friend"], "a": 1, "why": "Articles are for a wider audience and should be interesting."}, {"q": "Which is the best opening for an article?", "o": ["Dear Sir,", "Hi Anna!", "Have you ever tried real Georgian food?", "Yours sincerely,"], "a": 2, "why": "A question to the reader is a good hook."}, {"q": "Which phrase gives a recommendation?", "o": ["It's worth a visit.", "The café is located near the park.", "I ordered soup.", "It was raining."], "a": 0, "why": "‘It's worth a visit’ recommends the place."}, {"q": "‘Atmosphere’ in a restaurant is…", "o": ["the menu", "the prices", "the bill", "the feeling or mood of the place"], "a": 3, "why": "Atmosphere is how the place feels."}, {"q": "Which tense is best for describing your visit last weekend?", "o": ["present continuous", "past simple", "future simple", "present perfect continuous"], "a": 1, "why": "A finished past event uses the past simple."}, {"q": "An article should always have…", "o": ["a title", "an address", "a date at the top", "a signature with Yours faithfully"], "a": 0, "why": "A catchy title attracts readers."}, {"q": "‘The staff were friendly’ describes…", "o": ["the food", "the location", "the service", "the prices"], "a": 2, "why": "Staff are the people who work there."}]}, {"n": "19", "t": "Video: Food truck nation — street food and culture", "g": "You will learn about food trucks and street food as part of culture, take notes and summarise what you saw and heard.", "k": "Unit 2 · Delicious! · Video · SB p.28", "terms": [["food truck", "фудтрак, вантажівка з їжею"], ["street food", "вулична їжа"], ["cuisine", "кухня (національна)"], ["diversity", "розмаїття"], ["to take notes", "робити нотатки"], ["to summarise", "підсумовувати"]], "th": [{"h": "Background: food on wheels", "p": ["Food trucks are vans or small trucks with a kitchen inside. Cooks prepare meals and sell them through a window on the street, at festivals or near offices. In the USA they became very popular, and today many cities have hundreds of them.", "Food trucks often sell dishes from different cultures: Mexican tacos, Korean barbecue, Indian curry, Vietnamese sandwiches. For many immigrant families, a food truck is a way to start a business and share their culture with new neighbours."], "ul": ["Starting a food truck is usually cheaper than opening a restaurant.", "Owners can move to places where there are many customers.", "Many trucks use social media to tell customers where they are today.", "Street food lets people try many cuisines in one place.", "Food can bring different cultures together and help people understand each other."]}, {"h": "Note-taking while watching", "p": ["When you watch a video, you cannot write everything. Write only key words, numbers and names. Use short forms and symbols, then turn your notes into sentences after watching."], "ul": ["Write key words, not full sentences.", "Use symbols: + (and), → (leads to), = (means), ↑ (more).", "Note who speaks and what dish they make.", "After watching, write a 3–4 sentence summary.", "Summary starters: The video is about… / It shows… / The main idea is…", "Use vocabulary and grammar from Units 1 and 2 (jobs, personality, taste adjectives, past tenses)."]}, {"h": "Discussion", "p": ["Think about street food in Ukraine and in other countries you know. Discuss these questions with a partner or answer them in writing."], "ul": ["Have you ever bought food from a food truck? What did you eat?", "What personality does a food truck owner need?", "Why is street food a good way to learn about other cultures?", "What Ukrainian dish would be perfect for a food truck? Why?", "Would you like to run a food truck? What would you sell?"]}], "f": "The ‘chuck wagon’, an early American food cart used to feed cowboys on long cattle drives, is often credited to the Texas rancher Charles Goodnight in 1866.", "pr": ["Revise the Student Resources Unit 1 and Unit 2 Wordlists and write 10 words you remember best and 5 words you still need to learn.", "Plan your own food truck: its name, menu (5 dishes with descriptions) and why customers will love it (80–100 words)."], "q": ["What is a food truck?", "Why are food trucks popular with immigrant families?", "How can you take notes quickly while watching?", "How does street food connect different cultures?"], "qz": [{"q": "A food truck is…", "o": ["a lorry that delivers food to shops", "a vehicle with a kitchen that sells meals", "a big supermarket", "a farm"], "a": 1, "why": "Food trucks cook and sell food on the street."}, {"q": "‘Cuisine’ means…", "o": ["кухня (страви певної країни)", "кухар", "кухонна шафа", "кухонний ніж"], "a": 0, "why": "Cuisine is a style of cooking from a country or region."}, {"q": "When you take notes during a video, you should write…", "o": ["every word", "nothing", "key words and numbers", "only the title"], "a": 2, "why": "Key words are enough to remember the main points."}, {"q": "Which symbol could mean ‘leads to’ in notes?", "o": ["?", "=", "+", "→"], "a": 3, "why": "An arrow shows a result."}, {"q": "Which is a good start for a summary?", "o": ["Dear friend,", "The video is about…", "Once upon a time…", "Yours sincerely,"], "a": 1, "why": "It introduces the main topic."}, {"q": "Why might a food truck be easier to start than a restaurant?", "o": ["It is usually cheaper.", "It needs no food.", "It is always free.", "It has no customers."], "a": 0, "why": "A truck costs less than a restaurant building."}, {"q": "‘Diversity’ means…", "o": ["similarity", "danger", "variety of different people and things", "speed"], "a": 2, "why": "Diversity is variety and difference."}]}, {"n": "20", "t": "End-of-Unit 2 Revision", "g": "You will review the vocabulary and grammar of Unit 2 and check what you know about food and past tenses.", "k": "Unit 2 · Delicious! · End-of-Unit Revision", "terms": [["revision", "повторення"], ["past continuous", "минулий тривалий час"], ["used to", "раніше (робив)"], ["container", "ємність, тара"], ["cooking method", "спосіб приготування"]], "th": [{"h": "Vocabulary review", "p": ["Unit 2 was about food, tastes, cooking and packaging. Check that you can use these words in your own sentences."], "ul": ["Tastes: sweet, salty, sour, bitter, spicy, bland", "Texture and freshness: crunchy, juicy, creamy, raw, ripe, fresh, stale", "Cooking: boil, fry, bake, roast, grill, steam", "Preparing: chop, slice, peel, grate, stir, add", "Containers: a bottle, carton, jar, can, packet, tub", "Quantities: a loaf, a slice, a bar, a bunch, a pinch"]}, {"h": "Grammar review", "p": ["Past simple for finished actions, past continuous for actions in progress and background. Used to and would for past habits; be used to and get used to for familiar situations."], "ul": ["I was making soup when the phone rang.", "While we were eating, it started to snow.", "I used to hate broccoli. (not true now)", "My grandpa would bake bread every Sunday. (repeated action)", "I'm used to cooking for myself.", "I'm getting used to my new school."]}, {"h": "Skills review", "p": ["You practised reading for detail, listening for specific information, discussing opinions and writing an article."], "ul": ["Reading: look for paraphrases, not the same words.", "Listening: predict the type of word; be careful with numbers.", "Speaking: give opinions, agree and disagree politely.", "Article: title, hook, paragraphs, recommendation."]}], "f": "", "pr": ["Workbook p. 77, Review Unit 2.", "Make a mind map of Unit 2 vocabulary (tastes, cooking, containers) and write 5 sentences about your childhood food habits with used to or would."], "q": ["When do we use ‘while’ and when ‘when’?", "Can we use ‘would’ for past states? Why not?", "What container do we use for jam, milk and crisps?", "What are the parts of a good article?"], "qz": [{"q": "I ___ TV when my mum called me for dinner.", "o": ["watched", "was watching", "watch", "were watching"], "a": 1, "why": "A long action interrupted by a short one."}, {"q": "We ___ live in a village, but now we live in Rivne.", "o": ["used to", "are used to", "would", "get used to"], "a": 0, "why": "A past state that is not true now: used to."}, {"q": "a ___ of milk", "o": ["loaf", "bunch", "carton", "bar"], "a": 2, "why": "Milk comes in cartons."}, {"q": "Dark chocolate tastes a bit…", "o": ["salty", "sour", "bland", "bitter"], "a": 3, "why": "Dark chocolate is bitter."}, {"q": "She isn't used to ___ so early.", "o": ["getting up", "get up", "got up", "gets up"], "a": 0, "why": "Be used to + -ing."}, {"q": "We ___ potatoes in a big pot of water.", "o": ["bake", "boil", "grill", "grate"], "a": 1, "why": "Boil means cook in hot water."}, {"q": "Which sentence is correct?", "o": ["While I cooked, the phone was ringing.", "While I was cooking, the phone was ring.", "While I cooking, the phone rang.", "While I was cooking, the phone rang."], "a": 3, "why": "Long action: past continuous; short action: past simple."}, {"q": "Fruit that is ready to eat is…", "o": ["stale", "raw", "ripe", "rotten"], "a": 2, "why": "Ripe means ready to eat."}]}, {"n": "21", "t": "Progress Test: Units 1 and 2", "g": "You will know what the Units 1–2 progress test checks, how to prepare for it and how to reflect on your progress.", "k": "Unit 2 · Delicious! · Progress Test Units 1&2", "terms": [["progress test", "контрольна робота, тест на перевірку прогресу"], ["task type", "тип завдання"], ["self-assessment", "самооцінювання"], ["to revise", "повторювати"], ["strength", "сильна сторона"]], "th": [{"h": "What the test checks", "p": ["The progress test covers everything from Unit 1 (Perfect for the job) and Unit 2 (Delicious!). It usually has vocabulary, grammar, reading, listening and writing parts."], "ul": ["Vocabulary: jobs, personality adjectives, employment and life events, tastes, cooking, containers", "Grammar 1: present simple vs present continuous, stative verbs", "Grammar 2: countable/uncountable nouns and quantifiers", "Grammar 3: past simple vs past continuous", "Grammar 4: used to, would, be used to, get used to", "Reading and listening: finding details, gapped text, multiple choice", "Writing: an informal email or an article"]}, {"h": "How to prepare", "p": ["Start revising a few days before the test, not the night before. Short, regular revision sessions work better than one long one."], "ul": ["Look through both Unit Wordlists and test yourself with the translations covered.", "Write your own example sentences for each grammar point.", "Redo the Review pages in the Workbook (pp. 76–77).", "Read the useful language for emails and articles again.", "During the test: read instructions carefully and check your time.", "Leave 5 minutes at the end to check your answers."]}, {"h": "Sample task types (original)", "p": ["Here are examples of tasks similar to those in the test. Try them before the test.", "1) Choose the correct form: I (know / am knowing) the answer. 2) Complete with much or many: How ___ money do you need? 3) Complete with a container: a ___ of honey. 4) Put the verbs in the past simple or past continuous: While I (cook), I (burn) my hand. 5) Rewrite with used to: When I was little, I ate sweets every day, but I don't now."], "ul": ["Answers: 1) know 2) much 3) jar 4) was cooking, burnt/burned 5) I used to eat sweets every day.", "Matching words with definitions (e.g. reliable = you can trust them).", "Choosing the correct option in a short text.", "Reading for detail: who says what?", "Writing 100–120 words on a given topic."]}, {"h": "Self-assessment", "p": ["After the test, think about your results honestly. Being aware of your strengths and weaknesses helps you plan your learning."], "ul": ["I can describe jobs and personality.", "I can use the present simple and continuous correctly.", "I can use quantifiers with countable and uncountable nouns.", "I can tell a story in the past using two past tenses.", "I can talk about past habits with used to and would.", "I can write an informal email and an article.", "One thing I want to improve is…"]}], "f": "", "pr": ["Revise Units 1 and 2: Wordlists, Grammar Reference 1.1, 1.2, 2.1, 2.2 and the Workbook Review pages.", "After the test, write 4–5 sentences: what was easy, what was difficult and what you will do to improve."], "q": ["Which grammar topics are in Units 1 and 2?", "What types of writing did you practise?", "How will you plan your revision?", "Which topic do you feel least confident about?"], "qz": [{"q": "Choose the correct sentence.", "o": ["I am knowing the answer.", "I knows the answer.", "I know the answer.", "I knowing the answer."], "a": 2, "why": "Know is a stative verb."}, {"q": "How ___ money do you need?", "o": ["much", "many", "few", "a few"], "a": 0, "why": "Money is uncountable."}, {"q": "While I ___, I burnt my hand.", "o": ["cooked", "was cooking", "cook", "am cooking"], "a": 1, "why": "Long action in progress: past continuous."}, {"q": "a ___ of honey", "o": ["loaf", "bunch", "bar", "jar"], "a": 3, "why": "Honey usually comes in a jar."}, {"q": "When I was little, I ___ sweets every day.", "o": ["used to eat", "am used to eat", "use to eat", "was used to eat"], "a": 0, "why": "Past habit: used to + infinitive."}, {"q": "A person you can always trust is…", "o": ["bossy", "reliable", "stubborn", "impatient"], "a": 1, "why": "Reliable = you can depend on them."}, {"q": "What is the best way to prepare for a test?", "o": ["Study only the night before.", "Skip the grammar.", "Revise regularly a few days before.", "Don't read the instructions."], "a": 2, "why": "Regular short revision is most effective."}, {"q": "Which text type starts with a catchy title and a question to the reader?", "o": ["an informal email", "a shopping list", "a form", "an article"], "a": 3, "why": "Articles need a title and a hook."}]}]}, {"name": "Unit 3. It’s natural (Це природно)", "lessons": [{"n": "22", "t": "Unit Opener: It’s natural – geographical features and climate change", "g": "You will learn the key words for landscapes, natural wonders and climate change and be able to talk about nature in your country.", "k": "Unit 3 · It’s natural · Unit Opener + Vocabulary for Reading · SB pp.29-30", "terms": [["natural wonder", "диво природи"], ["landscape", "краєвид, ландшафт"], ["climate change", "зміна клімату"], ["coral reef", "кораловий риф"], ["ecosystem", "екосистема"], ["endangered", "під загрозою зникнення"]], "th": [{"h": "Welcome to Unit 3: It’s natural", "p": ["This unit is about the natural world: amazing places on our planet, the people who explore them and the ways climate change is affecting them. Nature is one big system – when one part changes, other parts change too.", "Before you start, look at the photo on SB p.29 and think about the questions below. Answer them out loud in English – it is great speaking practice even if you are alone."], "ul": ["What is the most beautiful natural place you have ever visited?", "Which natural wonders of Ukraine can you name (mountains, rivers, lakes, forests)?", "Would you like to explore the ocean, a jungle or a desert? Why?", "How has the weather in your town changed in recent years?", "What can young people do to protect nature?"]}, {"h": "Key vocabulary: places in nature", "p": ["These words help you describe landscapes. Learn them with an example – it is easier to remember words in context."], "ul": ["coast — узбережжя (We spent a week on the coast of the Black Sea.)", "valley — долина (The village lies in a green valley.)", "cliff — скеля, урвище (The cliffs were 50 metres high.)", "glacier — льодовик", "rainforest — тропічний ліс", "cave — печера", "waterfall — водоспад (Shypit is a famous waterfall in the Carpathians.)", "the ocean floor — дно океану"]}, {"h": "Key vocabulary: a changing planet", "p": ["Many texts in this unit talk about problems in nature. These words will help you understand them and give your opinion."], "ul": ["global warming — глобальне потепління", "rise (sea levels rise) — підніматися (рівень моря піднімається)", "drought — посуха", "flood — повінь", "melt — танути (Glaciers are melting fast.)", "damage — шкода; пошкоджувати", "survive — виживати", "habitat — середовище існування"]}], "f": "Ukraine has part of the Carpathian beech forests, which are on the UNESCO World Heritage List as ancient and primeval beech forests of Europe.", "pr": ["Study the Student Resources Unit 3 Wordlist: copy 15 new words into your vocabulary notebook with Ukrainian translations.", "Write 5 sentences about natural places in Ukraine using words from this lesson (e.g. There is a beautiful waterfall in …)."], "q": ["Can you name five geographical features in English?", "What is the difference between a drought and a flood?", "What does ‘habitat’ mean?", "Can you say two sentences about how climate change affects nature?"], "qz": [{"q": "A large mass of ice that moves slowly down a mountain is a …", "o": ["glacier", "cliff", "valley", "cave"], "a": 0, "why": "A glacier is a huge, slowly moving mass of ice."}, {"q": "A long period with no rain is called a …", "o": ["flood", "drought", "storm", "wave"], "a": 1, "why": "A drought is a long time without rain."}, {"q": "Choose the correct translation of ‘habitat’.", "o": ["звичка", "клімат", "середовище існування", "житло людини"], "a": 2, "why": "Habitat is the natural home of an animal or plant."}, {"q": "Sea levels are … because the ice is melting.", "o": ["falling", "drying", "rising", "freezing"], "a": 2, "why": "When ice melts, there is more water, so sea levels rise."}, {"q": "Which word describes an animal that may soon disappear?", "o": ["dangerous", "endangered", "enormous", "natural"], "a": 1, "why": "Endangered means at risk of disappearing."}, {"q": "Water falling from a high place in a river is a …", "o": ["valley", "coast", "waterfall", "reef"], "a": 2, "why": "A waterfall is where a river falls over a high edge."}, {"q": "Which word is the opposite of ‘survive’?", "o": ["live", "stay", "grow", "die"], "a": 3, "why": "To survive means to continue to live, so the opposite is to die."}]}, {"n": "23", "t": "Reading: The coral reef explorer", "g": "You will read a text about an underwater explorer, understand its main idea and practise an exam reading task.", "k": "Unit 3 · It’s natural · Reading · SB pp.30-31", "terms": [["explorer", "дослідник"], ["marine life", "морське життя"], ["dive", "пірнати"], ["bleaching", "знебарвлення (коралів)"], ["main idea", "основна думка"]], "th": [{"h": "Before you read", "p": ["The text in your book, «The coral reef explorer», is about a person who studies coral reefs. Before reading, always look at the title, photos and task. Try to guess what the text is about – this helps your brain prepare for new words.", "Read the text quickly first for the general idea. Do not stop at every unknown word. Then read again more carefully to do the task."], "ul": ["Look at the title and photos – predict the topic.", "Read the questions/task before the text.", "Skim (read fast) for the main idea of each paragraph.", "Scan (look for specific words, numbers, names) to find details.", "Guess unknown words from context."]}, {"h": "Practice text: Life under the waves", "p": ["Maya is a marine scientist. She has been diving for fifteen years, and she has explored reefs in many oceans. ‘The first time I saw a reef, I couldn’t believe the colours,’ she says. ‘It was like a city full of life.’ Coral reefs are home to thousands of kinds of fish, turtles and other sea creatures.", "But reefs are in trouble. When the ocean gets too warm, corals lose their colour and turn white. This is called bleaching. If the water stays hot for too long, the corals die. Maya has been studying one reef for five years, and she has seen big changes. ‘Some parts have recovered, which gives me hope,’ she explains. Now she teaches local children how to protect the sea: don’t touch the coral, don’t throw plastic into the water and use reef-safe sun cream."], "ul": ["What is Maya’s job?", "How long has she been diving?", "What happens to corals when the water is too hot?", "Why does Maya feel hopeful?", "What three things can people do to protect reefs?"]}, {"h": "Exam tip: understanding the main idea", "p": ["In many exam tasks you must choose the best title for a paragraph or the main idea of a text. The answer is usually the idea of the whole paragraph, not one small detail.", "Be careful: wrong options often repeat words from the text but change the meaning."], "ul": ["Read the first and last sentences of a paragraph – they often give the main idea.", "Ask yourself: what is the paragraph mostly about?", "Cross out options that are too narrow (only one detail) or too general.", "Check that your answer matches the text, not your own opinion.", "Underline key words in the question and find synonyms in the text."]}], "f": "Coral reefs cover less than one percent of the ocean floor, but scientists estimate that about a quarter of all marine species live on or near them.", "pr": ["Workbook pp. 16-17, Reading and Exam Reminder.", "Imagine you are a reef explorer. Write 6–8 sentences about your work: where you have been, what you have seen and what worries you."], "q": ["What is the difference between skimming and scanning?", "Why should you read the task before the text?", "What is coral bleaching?", "How can you find the main idea of a paragraph?"], "qz": [{"q": "In the practice text, how long has Maya been diving?", "o": ["five years", "fifteen years", "since she was a child", "for one year"], "a": 1, "why": "The text says she has been diving for fifteen years."}, {"q": "What is bleaching?", "o": ["Corals grow very fast", "Corals lose colour and turn white", "Fish leave the reef", "The water becomes cold"], "a": 1, "why": "Bleaching is when corals lose their colour because the water is too warm."}, {"q": "Which is the best title for the second paragraph of the practice text?", "o": ["Maya’s favourite fish", "How to become a diver", "Reefs in danger – and some hope", "The colours of the ocean"], "a": 2, "why": "The paragraph is about problems for reefs and some recovery."}, {"q": "Reading a text quickly to get the general idea is called …", "o": ["scanning", "skimming", "summarising", "translating"], "a": 1, "why": "Skimming means reading fast for the main idea."}, {"q": "What should you do with unknown words during the first reading?", "o": ["Look up every word", "Stop reading", "Guess from context and continue", "Skip the whole paragraph"], "a": 2, "why": "Guessing from context keeps you reading and understanding the general idea."}, {"q": "Wrong options in a main-idea task often …", "o": ["use words from the text but change the meaning", "are always the longest", "are written in a different language", "never mention the topic"], "a": 0, "why": "Distractors often repeat words from the text to trick you."}, {"q": "Which advice is NOT in the practice text?", "o": ["Don’t touch the coral", "Use reef-safe sun cream", "Don’t throw plastic into the water", "Feed the fish every day"], "a": 3, "why": "The text never mentions feeding fish."}]}, {"n": "24", "t": "Vocabulary: geographical features and climate change", "g": "You will extend your vocabulary about geography and climate, learn useful collocations and use them in sentences.", "k": "Unit 3 · It’s natural · Vocabulary · SB p.32", "terms": [["carbon emissions", "викиди вуглецю"], ["temperature", "температура"], ["extreme weather", "екстремальна погода"], ["mountain range", "гірський хребет"], ["collocation", "стале словосполучення, колокація"]], "th": [{"h": "Geographical features", "p": ["Group words by type – it is easier to remember them. Use ‘the’ with names of oceans, seas, rivers and mountain ranges: the Pacific, the Dnipro, the Alps.", "Learn the words with a typical adjective: a steep cliff, a deep valley, a sandy beach."], "ul": ["mountain range — гірський хребет (the Carpathians)", "peak — вершина", "plain — рівнина", "desert — пустеля", "island — острів", "bay — затока", "volcano — вулкан", "stream — струмок"]}, {"h": "Climate change: collocations", "p": ["Collocations are words that often go together. Native speakers say ‘heavy rain’, not ‘strong rain’. Learning collocations makes your English sound natural.", "Read the examples and notice which verb goes with which noun."], "ul": ["reduce carbon emissions — скорочувати викиди вуглецю", "temperatures rise — температури зростають", "extreme weather — екстремальна погода", "heavy rain — сильний дощ", "melting ice / melting glaciers — танення льоду / льодовиків", "fossil fuels — викопне паливо", "renewable energy — відновлювана енергія", "have an impact on — впливати на (Climate change has an impact on farming.)"]}, {"h": "Word formation and practice", "p": ["Many nouns and adjectives come from the same root. Knowing the word family helps you in gap-fill tasks.", "Try to make your own sentence with each word family below."], "ul": ["nature → natural → naturally", "climate → climatic", "pollute → pollution → polluted", "geography → geographical", "danger → dangerous → endanger → endangered", "Example: The river is polluted. Pollution kills fish.", "Example: Extreme weather is becoming more common."]}], "f": "Mount Everest, the highest mountain on Earth, is about 8,849 metres above sea level.", "pr": ["Workbook p. 17, Vocabulary 1.", "Make a mind map ‘Climate change’ with at least 12 words and collocations from this lesson, then write 4 sentences using them."], "q": ["Which adjective goes with ‘rain’ to mean a lot of rain?", "Name three geographical features that contain water.", "What is renewable energy? Give an example.", "Can you make the adjective from ‘geography’ and ‘nature’?"], "qz": [{"q": "We need to … carbon emissions to stop global warming.", "o": ["make less", "short", "fall", "reduce"], "a": 3, "why": "The correct collocation is ‘reduce emissions’."}, {"q": "There was very … rain yesterday and the streets flooded.", "o": ["hard-working", "strong", "heavy", "big"], "a": 2, "why": "We say ‘heavy rain’ in English."}, {"q": "A piece of land with water all around it is …", "o": ["an island", "a peak", "a bay", "a plain"], "a": 0, "why": "An island is surrounded by water."}, {"q": "Choose the adjective: The factory made the river very … .", "o": ["polluting", "polluted", "pollute", "pollution"], "a": 1, "why": "We need an adjective describing the river: polluted."}, {"q": "Wind and solar power are examples of …", "o": ["fossil fuels", "renewable energy", "extreme weather", "carbon emissions"], "a": 1, "why": "Wind and sun are renewable energy sources."}, {"q": "Translate ‘гірський хребет’.", "o": ["mountain stream", "mountain peak", "mountain range", "mountain valley"], "a": 2, "why": "A mountain range is a line of mountains."}, {"q": "Climate change has a big … on animals.", "o": ["impact", "effect to", "result in", "cause"], "a": 0, "why": "The collocation is ‘have an impact on’."}, {"q": "Which word belongs to the same family as ‘danger’?", "o": ["dangle", "dark", "damage", "endangered"], "a": 3, "why": "Endangered comes from the root ‘danger’."}]}, {"n": "25", "t": "Grammar: present perfect simple and present perfect continuous", "g": "You will know how to form and use the present perfect simple and continuous and choose the right tense in context.", "k": "Unit 3 · It’s natural · Grammar · SB p.33", "terms": [["present perfect simple", "теперішній доконаний час"], ["present perfect continuous", "теперішній доконано-тривалий час"], ["result", "результат"], ["duration", "тривалість"], ["past participle", "дієприкметник минулого часу (3-я форма)"]], "th": [{"h": "Form", "p": ["Present perfect simple: have/has + past participle (3rd form). Present perfect continuous: have/has + been + verb-ing.", "Remember: stative verbs (know, like, believe, own, understand) are not normally used in the continuous form."], "ul": ["+ I have visited the Carpathians. / She has been hiking all day.", "– We haven’t seen a glacier. / He hasn’t been sleeping well.", "? Have you ever been to the sea? / How long have you been waiting?", "Short answers: Yes, I have. / No, she hasn’t.", "has = he, she, it; have = I, you, we, they", "Irregular participles: see – seen, go – gone/been, take – taken, write – written"]}, {"h": "Use: simple vs continuous", "p": ["Use the present perfect simple for a finished action with a result now, for experiences (ever/never) and to say how many or how much. Use the present perfect continuous to focus on the activity and how long it has been going on, or for an activity that has a visible result now.", "Compare: I have read three books about volcanoes (how many – result). I have been reading about volcanoes all morning (how long – activity)."], "ul": ["Experience: Have you ever seen a waterfall?", "Result: The ice has melted. Now the lake is bigger.", "Quantity: Scientists have counted 200 species here.", "Duration: It has been raining for three hours.", "Visible result of activity: Your clothes are wet! – I’ve been walking in the rain.", "Unfinished situation with stative verbs: I have known Ira since 2020."]}, {"h": "Time expressions and common mistakes", "p": ["Use ‘for’ with a period of time and ‘since’ with a point in time. ‘Just’, ‘already’ and ‘yet’ are typical of the present perfect simple.", "Do not use the present perfect with finished time expressions like ‘yesterday’, ‘last year’, ‘in 2019’ – use the past simple instead."], "ul": ["for two hours / for ten years / for a long time", "since Monday / since 2015 / since I was a child", "already, just (positive), yet (negatives and questions), ever, never", "How long …? – usually present perfect continuous", "✗ I am living here since 2018. ✓ I have been living here since 2018.", "✗ I have seen him yesterday. ✓ I saw him yesterday.", "✗ I have been knowing her for years. ✓ I have known her for years."]}], "f": "", "pr": ["Workbook p. 18, Grammar 1; read Grammar Reference 3.1.", "Write 6 true sentences about yourself: 3 with the present perfect simple (experiences, results) and 3 with the present perfect continuous (How long?)."], "q": ["How do you form the present perfect continuous?", "When do we use ‘for’ and when ‘since’?", "Why can’t we say ‘I have been knowing’?", "Which tense do you use with ‘yesterday’?"], "qz": [{"q": "Scientists … this reef since 2018.", "o": ["study", "are studying", "have been studying", "studied"], "a": 2, "why": "An activity that started in the past and continues now, with ‘since’."}, {"q": "I … three documentaries about the ocean this month.", "o": ["have watched", "have been watching", "watch", "am watching"], "a": 0, "why": "We say how many – result, so present perfect simple."}, {"q": "Have you ever … a volcano?", "o": ["saw", "seeing", "see", "seen"], "a": 3, "why": "Present perfect uses the past participle: seen."}, {"q": "She has lived in Rivne … ten years.", "o": ["since", "for", "ago", "during"], "a": 1, "why": "‘For’ is used with a period of time."}, {"q": "Choose the correct sentence.", "o": ["I have known him since we were five.", "I have been knowing him since we were five.", "I know him since we were five.", "I am knowing him since we were five."], "a": 0, "why": "‘Know’ is a stative verb, so we use the present perfect simple."}, {"q": "Why are you so tired? – I … in the garden all day.", "o": ["have worked", "worked", "have been working", "work"], "a": 2, "why": "The focus is on the long activity with a visible result now."}, {"q": "We … to the Carpathians last summer.", "o": ["have gone", "went", "have been going", "have been"], "a": 1, "why": "‘Last summer’ is finished time, so we use the past simple."}, {"q": "Has the snow melted …?", "o": ["already", "yet", "since", "just"], "a": 1, "why": "‘Yet’ is used at the end of questions and negatives."}]}, {"n": "26", "t": "Listening and Speaking: nature and the environment", "g": "You will practise listening for specific information and learn phrases to ask and answer questions and give reasons in a pair discussion.", "k": "Unit 3 · It’s natural · Listening + Speaking · SB pp.34-35", "terms": [["specific information", "конкретна інформація"], ["distractor", "відволікаючий варіант"], ["in my opinion", "на мою думку"], ["I agree", "я згоден / згодна"], ["the reason is", "причина в тому, що"]], "th": [{"h": "Listening: exam strategies", "p": ["In listening tasks you often need to catch specific information: numbers, places, reasons, feelings. Before you listen, read the questions and underline key words. Think about what kind of answer you need: a number, a name, an adjective?", "Speakers often mention several options before giving the right answer. Listen to the whole part – the first word you hear is not always correct."], "ul": ["Read the task and predict possible answers.", "Underline key words and think of synonyms.", "Listen for words like ‘but’, ‘actually’, ‘in fact’ – the speaker may change the idea.", "Write short notes during the first listening.", "Check your answers during the second listening.", "Never leave an answer blank – guess if you are not sure."]}, {"h": "Speaking: asking, answering and giving reasons", "p": ["In a pair task you need to share ideas, ask your partner’s opinion and explain why you think something. Good answers are not too short – add a reason or an example.", "Use these phrases to keep the conversation going."], "ul": ["Asking: What do you think about …? / Have you ever …? / Do you agree that …?", "Giving opinion: In my opinion, … / I think … / Personally, I believe …", "Giving reasons: … because … / The main reason is that … / For example, …", "Agreeing: I agree with you. / That’s a good point. / Exactly!", "Disagreeing politely: I see what you mean, but … / I’m not sure about that.", "Gaining time: That’s an interesting question. / Let me think …"]}, {"h": "Model dialogue", "p": ["Read the dialogue out loud. Notice the present perfect tenses and the phrases from the list above.", "A: Have you ever been to a national park? B: Yes, I have. I’ve been to Synevyr twice. The lake is amazing! A: Lucky you! What do you think is the biggest problem for places like that? B: In my opinion, it’s rubbish. Tourists have been leaving plastic everywhere. A: I agree. I also think climate change is a problem, because summers have become much hotter. B: That’s a good point. Maybe schools should organise clean-up days."], "ul": ["Find two examples of the present perfect simple in the dialogue.", "Find one example of the present perfect continuous.", "Which phrase does A use to agree?", "Practise the dialogue, then change the place and the problem."]}], "f": "Lake Synevyr in the Ukrainian Carpathians is often called the ‘Sea Eye’ (Морське Око) and is one of the best-known mountain lakes in Ukraine.", "pr": ["Workbook p. 18, Listening.", "Record yourself (1–2 minutes) answering: What is the most beautiful natural place you have visited, and how can we protect it? Use at least three phrases from the lesson."], "q": ["What should you do before you listen?", "Why is the first word you hear not always the right answer?", "Give two phrases to disagree politely.", "How can you make your speaking answers longer?"], "qz": [{"q": "What should you do before listening?", "o": ["Close the book", "Read the questions and underline key words", "Write the answers randomly", "Translate every word"], "a": 1, "why": "Reading the task first helps you know what to listen for."}, {"q": "Which word often signals that the speaker is changing the idea?", "o": ["and", "also", "actually", "so"], "a": 2, "why": "‘Actually’ often introduces a correction or new information."}, {"q": "Which phrase is used to disagree politely?", "o": ["You’re wrong!", "I see what you mean, but …", "Exactly!", "That’s a good point."], "a": 1, "why": "It shows respect before giving a different opinion."}, {"q": "Which phrase helps you gain time to think?", "o": ["Let me think …", "I agree.", "For example, …", "Have you ever …?"], "a": 0, "why": "‘Let me think’ gives you a moment to prepare your answer."}, {"q": "In the model dialogue, why does B think summers are a problem?", "o": ["B doesn’t say that", "Because of rubbish", "Because summers have become hotter", "Because the lake is cold"], "a": 0, "why": "It is A, not B, who mentions hotter summers."}, {"q": "What makes a speaking answer better?", "o": ["Saying only ‘yes’ or ‘no’", "Adding a reason or an example", "Speaking in Ukrainian", "Repeating the question"], "a": 1, "why": "Reasons and examples make your answer full and convincing."}, {"q": "Choose the correct question: ‘… you ever been to Synevyr?’", "o": ["Did", "Do", "Has", "Have"], "a": 3, "why": "Present perfect questions with ‘you’ use ‘have’."}]}, {"n": "27", "t": "Vocabulary: protecting the environment", "g": "You will learn words and phrases about environmental protection and use them to talk about what people can do to help the planet.", "k": "Unit 3 · It’s natural · Vocabulary · SB p.36", "terms": [["environment", "навколишнє середовище"], ["recycle", "переробляти (відходи)"], ["waste", "відходи; марнувати"], ["conservation", "охорона, збереження"], ["single-use plastic", "одноразовий пластик"], ["volunteer", "волонтер; волонтерити"]], "th": [{"h": "Problems and solutions", "p": ["To talk about the environment you need words for problems and for solutions. Learn them in pairs – it will help you in discussions and essays.", "Read the examples and think: which of these things do you already do?"], "ul": ["pollution — забруднення → clean up — прибирати", "waste — відходи → recycle / reuse — переробляти / використовувати повторно", "deforestation — вирубка лісів → plant trees — садити дерева", "litter — сміття (на вулиці) → pick up litter — збирати сміття", "energy waste → save energy — економити енергію", "habitat loss — втрата середовища існування → protect habitats — захищати середовища існування"]}, {"h": "Useful collocations and phrasal verbs", "p": ["Many environmental phrases use phrasal verbs. They are very common in spoken English.", "Notice the prepositions – they change the meaning."], "ul": ["cut down (trees) — вирубувати", "throw away — викидати (Don’t throw away old clothes – give them to charity.)", "run out of — закінчуватися (We are running out of clean water.)", "turn off / switch off — вимикати (Switch off the lights when you leave.)", "take part in — брати участь у (I took part in a clean-up day.)", "raise awareness — підвищувати обізнаність", "reduce your carbon footprint — зменшувати свій вуглецевий слід", "go green — ставати екологічнішим"]}, {"h": "Talk about it", "p": ["Use the new words to answer these questions. Try to use the present perfect: What have you done to help the environment this year?", "Example: This year I have started taking a reusable bottle to school, and our class has planted ten trees."], "ul": ["What do you recycle at home?", "Have you ever taken part in a clean-up event?", "Which is worse: plastic pollution or air pollution? Why?", "How can your school save energy?", "What does ‘carbon footprint’ mean for you?"]}], "f": "Glass can be recycled again and again without losing its quality.", "pr": ["Workbook p. 19, Vocabulary 2.", "Write a list ‘10 things I can do to go green’ using words and phrasal verbs from this lesson."], "q": ["What is the difference between ‘reuse’ and ‘recycle’?", "What does ‘run out of’ mean?", "Name three causes of pollution.", "What have you done to help the environment recently?"], "qz": [{"q": "Please … off the lights when you leave the room.", "o": ["turn", "put", "take", "run"], "a": 0, "why": "‘Turn off’ means to stop a machine or light working."}, {"q": "If we don’t save water, we will … of it.", "o": ["run out", "throw away", "cut down", "take part"], "a": 0, "why": "‘Run out of’ means to have no more of something."}, {"q": "Cutting down large areas of forest is called …", "o": ["recycling", "deforestation", "conservation", "pollution"], "a": 1, "why": "Deforestation means destroying forests."}, {"q": "Using an old jar again to keep pencils is an example of …", "o": ["reusing", "recycling", "wasting", "polluting"], "a": 0, "why": "You use the same object again, so you reuse it."}, {"q": "Translate ‘брати участь у’.", "o": ["take place", "take part in", "take care", "take off"], "a": 1, "why": "‘Take part in’ means to participate."}, {"q": "Our campaign aims to … awareness about plastic waste.", "o": ["rise", "raise", "grow", "lift"], "a": 1, "why": "The collocation is ‘raise awareness’."}, {"q": "Which is a solution, not a problem?", "o": ["litter", "habitat loss", "planting trees", "energy waste"], "a": 2, "why": "Planting trees helps the environment."}]}, {"n": "28", "t": "Grammar: articles (a/an, the, no article)", "g": "You will understand the rules for using a/an, the and no article and use them correctly with nouns, including geographical names.", "k": "Unit 3 · It’s natural · Grammar · SB p.37", "terms": [["indefinite article", "неозначений артикль"], ["definite article", "означений артикль"], ["zero article", "нульовий артикль (відсутність артикля)"], ["countable noun", "злічуваний іменник"], ["uncountable noun", "незлічуваний іменник"]], "th": [{"h": "A / an", "p": ["Use a/an with singular countable nouns when you mention something for the first time or when it is one of many. Use ‘an’ before a vowel sound: an island, an hour (h is silent), but a university (sounds like ‘you’).", "We also use a/an with jobs and in some expressions of frequency."], "ul": ["I saw a whale yesterday. (first mention)", "She is an ecologist. (job)", "It’s a beautiful lake. (one of many)", "twice a week, 100 km an hour", "✗ It is good idea. ✓ It is a good idea.", "✗ I have a advice. ✓ I have some advice. (advice is uncountable)"]}, {"h": "The", "p": ["Use ‘the’ when the listener knows which thing we mean: it was mentioned before, there is only one, or it is clear from the situation.", "‘The’ is also used with superlatives and with some geographical names."], "ul": ["I saw a whale. The whale was huge. (second mention)", "the sun, the moon, the Earth, the environment (only one)", "the highest mountain, the most beautiful beach (superlatives)", "oceans and seas: the Atlantic, the Black Sea", "rivers: the Dnipro, the Danube", "mountain ranges and groups of islands: the Alps, the Canary Islands", "deserts: the Sahara", "countries with plural or ‘republic/kingdom/states’: the UK, the USA, the Netherlands"]}, {"h": "No article (zero article)", "p": ["Do not use an article with plural and uncountable nouns when you talk in general. Also, most names of countries, cities, single mountains and lakes have no article.", "Compare: Plastic is dangerous for sea animals. (in general) – The plastic in this bag is recyclable. (specific)"], "ul": ["Nature is important. ✗ The nature is important.", "Tigers are endangered. (all tigers in general)", "Ukraine, Rivne, Lake Svitiaz, Mount Hoverla", "go to school / go to bed / at home / by bus", "play football (sports), have breakfast (meals)", "✗ I love the animals. (general) ✓ I love animals."]}], "f": "", "pr": ["Workbook p. 20, Grammar 2; read Grammar Reference 3.2.", "Write a short paragraph (6–8 sentences) about a natural place in Ukraine. Underline every article and check the rules."], "q": ["When do we use ‘an’ instead of ‘a’?", "Why do we say ‘the Earth’ but ‘Ukraine’?", "Do we use an article when we talk about things in general?", "Which geographical names take ‘the’?"], "qz": [{"q": "… Pacific is the largest ocean on Earth.", "o": ["A", "An", "The", "— (no article)"], "a": 2, "why": "Names of oceans take ‘the’."}, {"q": "My cousin is … engineer.", "o": ["the", "— (no article)", "a", "an"], "a": 3, "why": "We use ‘an’ before a vowel sound and with jobs."}, {"q": "… pollution is a serious problem in big cities.", "o": ["An", "— (no article)", "The", "A"], "a": 1, "why": "Uncountable noun in general – no article."}, {"q": "We climbed … Mount Hoverla last summer.", "o": ["— (no article)", "the", "a", "an"], "a": 0, "why": "Names of single mountains usually have no article."}, {"q": "I found a shell on the beach. … shell was pink.", "o": ["— (no article)", "A", "The", "An"], "a": 2, "why": "Second mention – the listener knows which shell."}, {"q": "It takes about … hour to get to the lake.", "o": ["the", "— (no article)", "a", "an"], "a": 3, "why": "‘Hour’ starts with a vowel sound because h is silent."}, {"q": "Choose the correct sentence.", "o": ["Nature is beautiful.", "A nature is beautiful.", "An nature is beautiful.", "The nature is beautiful."], "a": 0, "why": "‘Nature’ in general takes no article."}, {"q": "They are travelling to … Netherlands.", "o": ["a", "the", "an", "— (no article)"], "a": 1, "why": "Plural country names take ‘the’."}]}, {"n": "29", "t": "Writing: an email about an environmental event", "g": "You will learn how to plan and write an informal email about taking part in an environmental activity, using fixed phrases.", "k": "Unit 3 · It’s natural · Writing · SB pp.38-39", "terms": [["informal email", "неформальний електронний лист"], ["greeting", "привітання"], ["paragraph", "абзац"], ["fixed phrase", "стійкий вираз"], ["sign off", "завершення листа"]], "th": [{"h": "Structure of an informal email", "p": ["An informal email is written to a friend or someone you know well. The style is friendly, you can use contractions (I’m, don’t) and phrasal verbs. However, it still needs a clear structure with paragraphs.", "In an exam task you usually reply to a friend’s email and must answer all the points in the task. Read the task carefully and tick each point when you write about it."], "ul": ["Greeting: Hi Olha, / Dear Tom,", "Paragraph 1: thank your friend / say why you are writing", "Paragraph 2: main information – the event (what, where, when)", "Paragraph 3: your experience or a suggestion / invitation", "Paragraph 4: closing sentence (Write back soon!)", "Sign off: Best wishes, / Love, / Take care, + your name"]}, {"h": "Useful language: fixed phrases", "p": ["Fixed phrases make your email sound natural. Learn them as whole chunks – do not change the words.", "Choose 2–3 phrases from each group for your own email."], "ul": ["Opening: Thanks for your email. / It was great to hear from you. / Sorry I haven’t written for ages.", "Giving news: Guess what! / You won’t believe it, but … / I’ve got some great news.", "Describing the event: It took place in … / There were about 50 volunteers. / We spent the whole day …", "Inviting: Why don’t you join us? / Would you like to come along?", "Suggesting: How about …? / You could …", "Closing: Write back soon. / Can’t wait to hear from you. / Let me know what you think."]}, {"h": "Model email and checklist", "p": ["Hi Max, Thanks for your email! I’ve got some great news. Last Saturday our school organised a clean-up day by the river. About forty students took part, and we collected twenty bags of rubbish! It was hard work, but we had a lot of fun. I’ve never felt so proud of my town. Next month we are planting trees in the park. Why don’t you join us? You could bring your sister too. Let me know what you think. Best wishes, Sofiia", "Before you finish, check your email with this list."], "ul": ["Have I answered all the points in the task?", "Did I use a greeting and a sign-off?", "Are my ideas in clear paragraphs?", "Did I use informal phrases and contractions?", "Is the word count correct (usually 100–120 words)?", "Have I checked spelling, articles and tenses?"]}], "f": "", "pr": ["Workbook p. 21, Writing; study the Writing Reference for emails.", "Write an email (100–120 words) to a friend about an environmental event you took part in or would like to organise. Invite your friend to join."], "q": ["What are the main parts of an informal email?", "Can you name three phrases to start an email?", "How can you invite a friend in an email?", "What should you check before you send your email?"], "qz": [{"q": "Which greeting is suitable for an informal email to a friend?", "o": ["Hi Olena,", "To whom it may concern,", "Dear Director,", "Dear Sir or Madam,"], "a": 0, "why": "‘Hi + name’ is friendly and informal."}, {"q": "Which phrase is the best sign-off for a friend?", "o": ["Best wishes,", "Regards from the company,", "Sincerely yours, Director", "Yours faithfully,"], "a": 0, "why": "‘Best wishes’ is friendly and common in informal emails."}, {"q": "Which sentence invites a friend?", "o": ["Sorry I haven’t written.", "Thanks for your email.", "Why don’t you join us?", "It took place in May."], "a": 2, "why": "‘Why don’t you join us?’ is an invitation."}, {"q": "In an informal email you can use …", "o": ["no paragraphs", "no greeting", "contractions like I’m and don’t", "only very formal words"], "a": 2, "why": "Contractions are typical of informal style."}, {"q": "Complete the phrase: ‘It was great to … from you.’", "o": ["listen", "hear", "know", "get"], "a": 1, "why": "The fixed phrase is ‘great to hear from you’."}, {"q": "What is the most important thing in an exam writing task?", "o": ["Using only simple sentences", "Copying the task", "Writing as much as possible", "Answering all the points in the task"], "a": 3, "why": "You lose marks if you miss any point of the task."}, {"q": "Which sentence describes an event?", "o": ["How about Sunday?", "About thirty volunteers took part.", "Love, Ira", "Write back soon!"], "a": 1, "why": "It gives information about the event."}]}, {"n": "30", "t": "Live well, study well: taking action for the environment", "g": "You will understand an infographic about the environment, discuss eco-friendly habits and plan a small environmental project.", "k": "Unit 3 · It’s natural · Live well, study well · SB p.40", "terms": [["infographic", "інфографіка"], ["eco-friendly", "екологічний, дружній до довкілля"], ["habit", "звичка"], ["campaign", "кампанія, акція"], ["make a difference", "змінити щось на краще"]], "th": [{"h": "Reading an infographic", "p": ["An infographic shows information with pictures, numbers and short texts. To understand it, first look at the title, then at the biggest numbers and pictures, then read the small details.", "Try to explain an infographic in your own words: The infographic shows that … Most people … Only a few …"], "ul": ["Read the title – what is the main topic?", "Look at the numbers: percentages, amounts, dates.", "Compare: more than, less than, twice as much.", "Find the main message – what should people do?", "Useful phrases: According to the infographic, … / It is surprising that …"]}, {"h": "Small habits, big difference", "p": ["Protecting the environment is not only for governments and big companies. Every person can make a difference with small everyday habits. When many people change their habits, the result is huge.", "Think about your own day: what do you use, what do you throw away, how do you travel?"], "ul": ["Take a reusable bottle and bag.", "Walk, cycle or use public transport.", "Turn off devices you are not using.", "Sort your rubbish for recycling.", "Buy fewer clothes and give old ones a second life.", "Have shorter showers to save water.", "Discuss: Which habit is the easiest for you? Which is the hardest?"]}, {"h": "Project ideas (choose one)", "p": ["Choose a project and present it to your class or family. You can work alone or with a friend online.", "Use the vocabulary from Unit 3 and the present perfect to describe what you have done."], "ul": ["Make a poster or infographic ‘How green is our class?’ based on a short survey.", "Keep an eco-diary for one week and write what you have changed.", "Plan a clean-up day: where, when, what you need, how to invite people.", "Make a short presentation about an endangered animal in Ukraine.", "Create a list of eco-tips for your school and share it."]}], "f": "", "pr": ["Project of your choice: prepare one of the projects from the lesson and present it (poster, presentation or eco-diary).", "Write 5 sentences about eco-friendly habits you have or want to start, with reasons."], "q": ["What should you look at first in an infographic?", "Name three eco-friendly habits.", "How can one person make a difference?", "Which phrases can you use to describe an infographic?"], "qz": [{"q": "An infographic mainly uses …", "o": ["audio recordings", "videos", "long texts only", "pictures, numbers and short texts"], "a": 3, "why": "Infographics show information visually with numbers and pictures."}, {"q": "Which phrase is good for describing an infographic?", "o": ["Dear Sir, …", "Best wishes, …", "According to the infographic, …", "Once upon a time, …"], "a": 2, "why": "‘According to the infographic’ introduces data from it."}, {"q": "Which habit is eco-friendly?", "o": ["Using a reusable bottle", "Buying new clothes every week", "Throwing batteries in the bin", "Leaving the TV on all night"], "a": 0, "why": "A reusable bottle reduces plastic waste."}, {"q": "‘Make a difference’ means …", "o": ["change something in a good way", "make a mistake", "compare two things", "make something different in colour"], "a": 0, "why": "To make a difference is to have a positive effect."}, {"q": "If 50% of students recycle, it means …", "o": ["all students recycle", "half of the students recycle", "no students recycle", "most students don’t go to school"], "a": 1, "why": "50% means half."}, {"q": "Translate ‘кампанія, акція’ in an environmental context.", "o": ["campus", "campaign", "camping", "company"], "a": 1, "why": "A campaign is a planned set of actions for a goal."}]}, {"n": "31", "t": "End-of-Unit 3 Revision: It’s natural", "g": "You will revise the vocabulary and grammar of Unit 3 and check what you can do well and what you need to practise more.", "k": "Unit 3 · It’s natural · End-of-Unit Revision", "terms": [["revision", "повторення"], ["present perfect", "теперішній доконаний час"], ["article", "артикль"], ["environmental protection", "захист довкілля"], ["climate change", "зміна клімату"]], "th": [{"h": "Vocabulary summary", "p": ["Unit 3 had two main vocabulary topics: geographical features and climate change, and environmental protection. Go through the lists and test yourself – cover the translation and try to remember it.", "If you forget a word, write it on a sticky note and put it somewhere you look every day."], "ul": ["Geography: coast, valley, cliff, glacier, cave, waterfall, island, mountain range", "Climate: global warming, drought, flood, melt, extreme weather, carbon emissions", "Environment: pollution, waste, litter, deforestation, habitat loss, conservation", "Actions: recycle, reuse, save energy, plant trees, pick up litter", "Phrasal verbs: cut down, throw away, run out of, turn off, take part in", "Collocations: heavy rain, reduce emissions, raise awareness, have an impact on"]}, {"h": "Grammar summary", "p": ["Present perfect simple: have/has + past participle – experiences, results, how many. Present perfect continuous: have/has been + -ing – how long, activity in progress. Articles: a/an (first mention, one of many, jobs), the (known, unique, superlatives, oceans, rivers), no article (general plural/uncountable, most countries, cities, single mountains).", "Mini-examples:"], "ul": ["I have visited three national parks. (how many)", "We have been walking for two hours. (how long)", "Have you ever seen a glacier? (experience)", "I saw a fox. The fox was red. (a → the)", "The Dnipro flows into the Black Sea.", "Water is precious. (general – no article)"]}, {"h": "Check yourself", "p": ["Read the statements and mark them: I can do this well / I need more practice. Go back to the lessons where you need more practice.", "Then do the Workbook review – it is the best preparation for the Progress Test after Unit 4."], "ul": ["I can describe natural places and landscapes.", "I can talk about climate change and its effects.", "I can choose between the present perfect simple and continuous.", "I can use a/an, the and no article correctly.", "I can write an informal email about an event.", "I can give my opinion and reasons in a discussion."]}], "f": "", "pr": ["Workbook p. 78, Review Unit 3.", "Make a one-page summary (mind map or table) of Unit 3 vocabulary and grammar to use when you prepare for the Progress Test."], "q": ["Which tense do you use to say how long an activity has been going on?", "Give three geographical names that take ‘the’.", "Name five words about environmental protection.", "Which part of Unit 3 do you need to practise more?"], "qz": [{"q": "I … this book for two weeks, but I haven’t finished it yet.", "o": ["have read", "have been reading", "read", "am reading"], "a": 1, "why": "An unfinished activity with duration – present perfect continuous."}, {"q": "Choose the correct sentence.", "o": ["The Lake Svitiaz is deep.", "Lake Svitiaz is deep.", "A Lake Svitiaz is deep.", "An Lake Svitiaz is deep."], "a": 1, "why": "Names of single lakes usually have no article."}, {"q": "Melting … are making sea levels rise.", "o": ["valleys", "caves", "deserts", "glaciers"], "a": 3, "why": "Glaciers are made of ice and they melt."}, {"q": "Don’t … away plastic bottles – recycle them.", "o": ["run", "cut", "turn", "throw"], "a": 3, "why": "‘Throw away’ means put in the rubbish."}, {"q": "She has … to Greece twice.", "o": ["been", "go", "went", "going"], "a": 0, "why": "For experiences we use ‘have/has been’."}, {"q": "… Amazon is the largest rainforest in the world.", "o": ["— (no article)", "A", "The", "An"], "a": 2, "why": "We use ‘the’ with this unique geographical name and superlative context."}, {"q": "Which phrase is a good way to end an informal email?", "o": ["Write back soon!", "Dear Sir,", "To whom it may concern,", "Yours faithfully,"], "a": 0, "why": "‘Write back soon!’ is friendly and informal."}, {"q": "A long period without rain is a …", "o": ["storm", "habitat", "drought", "flood"], "a": 2, "why": "Drought means no rain for a long time."}]}]}, {"name": "Unit 4. That’s the fashion (Така мода)", "lessons": [{"n": "32", "t": "Unit Opener: That’s the fashion – clothes and fabrics", "g": "You will learn basic words for clothes, fabrics and styles and be able to talk about your own style and shopping choices.", "k": "Unit 4 · That’s the fashion · Unit Opener + Vocabulary for Reading · SB pp.41-42", "terms": [["fashion", "мода"], ["outfit", "вбрання, комплект одягу"], ["fabric", "тканина"], ["traditional costume", "традиційний костюм"], ["trend", "тенденція, тренд"], ["style", "стиль"]], "th": [{"h": "Welcome to Unit 4: That’s the fashion", "p": ["This unit is about clothes, fashion and shopping. You will read about people who express themselves through clothes, learn how to describe outfits and think about smart choices when you buy things.", "Look at the photo on SB p.41 and answer the questions out loud."], "ul": ["What do you usually wear at weekends?", "Is fashion important to you? Why / why not?", "Do you follow trends or do you have your own style?", "What traditional clothes are typical for Ukraine?", "How do you decide what to buy – price, quality or brand?"]}, {"h": "Key vocabulary: clothes and accessories", "p": ["Learn the words in groups. Notice that some clothes are always plural in English: jeans, trousers, shorts, pyjamas – we say ‘a pair of jeans’."], "ul": ["hoodie — худі, кофта з капюшоном", "jacket — куртка, піджак", "trousers — штани (a pair of trousers)", "suit — костюм (діловий)", "trainers — кросівки", "scarf — шарф, хустка", "belt — ремінь, пояс", "vyshyvanka — вишиванка (embroidered shirt)"]}, {"h": "Key vocabulary: fabrics and description", "p": ["To describe clothes in English we often use this order: opinion – size – colour – material – noun. Example: a nice long blue cotton dress.", "Materials work like adjectives before a noun: a wool jumper, a silk scarf, a leather belt."], "ul": ["cotton — бавовна", "wool — вовна", "silk — шовк", "leather — шкіра", "linen — льон", "denim — джинсова тканина", "embroidered — вишитий", "smart / casual — ошатний / повсякденний"]}], "f": "The Day of the Vyshyvanka is celebrated in Ukraine every year on the third Thursday of May.", "pr": ["Study the Student Resources Unit 4 Wordlist: write 15 new words with translations in your vocabulary notebook.", "Describe your favourite outfit in 5–6 sentences, using at least three fabric words and the correct adjective order."], "q": ["Which clothes words are always plural in English?", "What is the correct order of adjectives before a noun?", "What is the difference between ‘smart’ and ‘casual’?", "Can you name five fabrics in English?"], "qz": [{"q": "Jeans are usually made of …", "o": ["silk", "denim", "leather", "wool"], "a": 1, "why": "Denim is the strong cotton fabric used for jeans."}, {"q": "Choose the correct phrase.", "o": ["a jean", "a pair of jeans", "one jean", "a jeans"], "a": 1, "why": "‘Jeans’ is plural, so we say ‘a pair of jeans’."}, {"q": "Translate ‘вишитий’.", "o": ["embroidered", "printed", "knitted", "woven"], "a": 0, "why": "Embroidered means decorated with stitches."}, {"q": "Choose the correct adjective order.", "o": ["a cotton white nice shirt", "a white nice cotton shirt", "a nice white cotton shirt", "a nice cotton white shirt"], "a": 2, "why": "Opinion – colour – material – noun."}, {"q": "Which word means ‘comfortable, everyday clothes’?", "o": ["smart", "formal", "casual", "elegant"], "a": 2, "why": "Casual clothes are for relaxing, not for special events."}, {"q": "A warm jumper is often made of …", "o": ["wool", "linen", "silk", "denim"], "a": 0, "why": "Wool keeps you warm."}, {"q": "A new popular direction in fashion is a …", "o": ["fabric", "trend", "belt", "costume"], "a": 1, "why": "A trend is what is popular at the moment."}]}, {"n": "33", "t": "Reading: The sapeurs and sapeuses of Kinshasa", "g": "You will read about people who use clothes to express themselves and practise understanding new words from context.", "k": "Unit 4 · That’s the fashion · Reading · SB pp.42-43", "terms": [["elegant", "елегантний"], ["self-expression", "самовираження"], ["context", "контекст"], ["word guessing", "здогадка про значення слова"], ["community", "спільнота"]], "th": [{"h": "Before you read", "p": ["The text in your book is about the sapeurs and sapeuses of Kinshasa, the capital of the Democratic Republic of the Congo. They are men and women who wear very elegant, colourful clothes and see style as a kind of art.", "You will read in a non-linear way: you don’t have to read every word from beginning to end. Jump to the parts you need, look at the photos and use the words around a new word to understand it."], "ul": ["Look at the photos: what do the people wear? How do they look?", "Predict: Why do you think they dress like this?", "Find the new words in the text and underline them.", "Read the sentence before and after each new word.", "Decide what type of word it is: noun, verb or adjective."]}, {"h": "Practice text: Dressed to impress", "p": ["In a small town there is a group of teenagers who call themselves ‘The Bright Club’. Every Sunday they meet in the main square, wearing outfits which they have designed themselves. Some wear jackets that are covered in colourful patches; others mix old suits from their grandparents with modern trainers.", "‘We don’t have much money,’ says Dana, who started the club. ‘But you don’t need expensive brands to look stylish. We swap clothes, repair them and add our own details.’ At first, people stared at them. Now tourists come to take photos, and the local newspaper has written about them. ‘Clothes are a way to show who you are,’ Dana explains. ‘When I wear something unique, I feel confident.’"], "ul": ["What does ‘swap’ mean? Look at the context: they don’t buy, they …", "What does ‘stared’ mean? People were surprised, so they …", "Why don’t the teenagers need much money?", "How has the reaction of people changed?", "Do you agree that clothes show who you are?"]}, {"h": "Exam tip: guessing new words", "p": ["In reading tasks you will always meet some unknown words. Don’t panic – usually you can understand the text without them, or guess their meaning.", "Use these clues to work out the meaning."], "ul": ["Word type: is it after ‘a/the’ (noun) or after ‘to’ (verb)?", "Parts of the word: un-, re-, -ful, -less (unique, repair, colourful).", "Examples and explanations in the next sentence.", "Similar words in Ukrainian or other languages (elegant – елегантний).", "Opposites in the text (‘At first … Now …’).", "Check: put your meaning in the sentence – does it make sense?"]}], "f": "The name ‘La Sape’ comes from a French phrase meaning ‘Society of Ambiance-Makers and Elegant People’.", "pr": ["Workbook p. 22, Reading and Exam Reminder.", "Choose 5 new words from the text in the Student’s Book. For each word write: your guess, the real meaning (check in a dictionary) and your own sentence."], "q": ["What does non-linear reading mean?", "Name three clues that help you guess a new word.", "Why do the sapeurs dress elegantly?", "How can clothes help people express themselves?"], "qz": [{"q": "In the practice text, ‘swap clothes’ most likely means …", "o": ["throw away clothes", "buy new clothes", "exchange clothes", "wash clothes"], "a": 2, "why": "They don’t have money, so they exchange clothes with each other."}, {"q": "‘People stared at them’ means people …", "o": ["looked at them for a long time", "laughed loudly", "took photos", "ignored them"], "a": 0, "why": "To stare is to look for a long time, often with surprise."}, {"q": "Who started The Bright Club?", "o": ["Dana", "Dana’s grandparents", "a tourist", "a journalist"], "a": 0, "why": "The text says Dana started the club."}, {"q": "A word that comes after ‘a’ or ‘the’ is usually a …", "o": ["adverb", "preposition", "verb", "noun"], "a": 3, "why": "Articles come before nouns."}, {"q": "The prefix ‘re-’ in ‘repair’ or ‘reuse’ often means …", "o": ["not", "again", "before", "too much"], "a": 1, "why": "‘Re-’ often means doing something again."}, {"q": "What is the main idea of the practice text?", "o": ["Expensive brands are the best.", "Style can be creative and does not need much money.", "Tourists like taking photos.", "Old suits are uncomfortable."], "a": 1, "why": "The teenagers show that style is about creativity, not money."}, {"q": "What should you do first when you see an unknown word?", "o": ["Ask the teacher immediately", "Stop reading", "Read the words around it", "Skip the whole text"], "a": 2, "why": "The context often explains the meaning."}]}, {"n": "34", "t": "Vocabulary: clothes, fabrics and patterns", "g": "You will extend your vocabulary to describe clothes, patterns and fit, and use phrasal verbs about clothes.", "k": "Unit 4 · That’s the fashion · Vocabulary · SB p.44", "terms": [["pattern", "візерунок"], ["fit", "пасувати за розміром"], ["suit", "личити, пасувати"], ["match", "поєднуватися (за кольором, стилем)"], ["try on", "приміряти"], ["second-hand", "вживаний, секонд-хенд"]], "th": [{"h": "Patterns and descriptions", "p": ["When you describe clothes, talk about colour, pattern, material and fit. This makes your descriptions in speaking and writing much richer.", "Example: She’s wearing a loose striped cotton shirt and tight black jeans."], "ul": ["striped — смугастий", "checked — в клітинку", "spotted / polka-dot — в горошок", "plain — однотонний", "flowery / floral — з квітковим візерунком", "loose — вільний, широкий", "tight — тісний, облягаючий", "baggy — мішкуватий, оверсайз"]}, {"h": "Fit, suit, match, go with", "p": ["These verbs are often confused. ‘Fit’ is about size. ‘Suit’ is about looking good on a person. ‘Match’ and ‘go with’ are about two things looking good together.", "Look at the examples carefully."], "ul": ["These shoes don’t fit me – they’re too small.", "Red really suits you!", "Your scarf matches your hat.", "Does this belt go with my jeans?", "✗ This dress fits you – you look beautiful. ✓ This dress suits you.", "fashionable — модний / old-fashioned — старомодний"]}, {"h": "Phrasal verbs about clothes", "p": ["Phrasal verbs are very common when we talk about clothes. Learn them with examples.", "Notice that with a pronoun the particle goes after it: try it on, not try on it."], "ul": ["put on — вдягати (Put on your coat, it’s cold.)", "take off — знімати (Take off your shoes, please.)", "try on — приміряти (Can I try on these jeans?)", "dress up — ошатно вдягатися (We dressed up for the party.)", "grow out of — вирости з (одягу)", "do up — застібати (Do up your jacket.)", "hand down — передавати (одяг молодшим)"]}], "f": "", "pr": ["Workbook p. 23, Vocabulary.", "Describe what three people in your family are wearing today (or in a photo). Use patterns, fabrics and fit words – 6–8 sentences."], "q": ["What is the difference between ‘fit’ and ‘suit’?", "Name three patterns in English.", "Where does the particle go with a pronoun: try on it or try it on?", "What does ‘grow out of’ mean?"], "qz": [{"q": "These trousers don’t … me – they are too long.", "o": ["suit", "fit", "match", "wear"], "a": 1, "why": "‘Fit’ is about the right size."}, {"q": "That colour really … you – you look great!", "o": ["fits", "suits", "matches", "goes"], "a": 1, "why": "‘Suit’ means it looks good on you."}, {"q": "A shirt with lines on it is …", "o": ["checked", "spotted", "striped", "plain"], "a": 2, "why": "Striped means with stripes (lines)."}, {"q": "Can I … these shoes on, please?", "o": ["try", "put", "take", "do"], "a": 0, "why": "‘Try on’ means put on clothes to see if they fit."}, {"q": "Choose the correct sentence.", "o": ["Take off them.", "Take them off.", "Take of them.", "Take off it."], "a": 1, "why": "With a pronoun the particle goes after it: take them off."}, {"q": "My little brother has … out of his jacket. It’s too small now.", "o": ["grown", "gone", "put", "dressed"], "a": 0, "why": "‘Grow out of’ means become too big for clothes."}, {"q": "Translate ‘однотонний’.", "o": ["plain", "plane", "flowery", "bright"], "a": 0, "why": "Plain clothes have one colour and no pattern."}, {"q": "Does this bag … with my shoes?", "o": ["fit", "suit", "go", "wear"], "a": 2, "why": "‘Go with’ means look good together."}]}, {"n": "35", "t": "Grammar: relative clauses", "g": "You will use defining and non-defining relative clauses with who, which, that, whose, where and when correctly.", "k": "Unit 4 · That’s the fashion · Grammar · SB p.45", "terms": [["relative clause", "підрядне означальне речення"], ["relative pronoun", "відносний займенник"], ["defining", "означальний (обмежувальний)"], ["non-defining", "неозначальний (описовий)"], ["comma", "кома"]], "th": [{"h": "Relative pronouns", "p": ["A relative clause gives more information about a noun. It starts with a relative pronoun or adverb.", "Choose the word according to what the noun is: a person, a thing, a place, a time or possession."], "ul": ["who — для людей: The girl who designed this dress is 15.", "which — для речей і тварин: The jacket which I bought is warm.", "that — для людей і речей (тільки в означальних): The shop that sells vintage clothes is closed.", "whose — чий: That’s the designer whose clothes are famous.", "where — де: This is the market where I buy fabric.", "when — коли: I remember the day when I got my first trainers."]}, {"h": "Defining vs non-defining clauses", "p": ["A defining relative clause gives necessary information – without it we don’t know which person or thing we mean. No commas. A non-defining relative clause gives extra information – the sentence is clear without it. Use commas, and never use ‘that’.", "Compare: The students who wear uniforms look smart. (only those students) – My sister, who loves fashion, works in a shop. (I have one sister; extra info)"], "ul": ["Defining: The boy who is wearing a red hoodie is my cousin.", "Defining: I need a bag that goes with my dress.", "Non-defining: Kyiv, which is the capital of Ukraine, hosts fashion weeks.", "Non-defining: Ms Koval, whose daughter is a model, teaches us art.", "✗ My mum, that is a tailor, made this. ✓ My mum, who is a tailor, made this.", "Non-defining clauses are more common in writing than in speaking."]}, {"h": "Leaving out the pronoun and common mistakes", "p": ["In defining clauses you can leave out who/which/that when it is the object of the clause (there is another subject after it). You cannot leave it out when it is the subject.", "Do not repeat the pronoun inside the relative clause."], "ul": ["The coat (that) I bought is too big. – ‘I’ is the subject, so ‘that’ can go.", "The girl who sits next to me loves shopping. – ‘who’ is the subject, it must stay.", "✗ The dress which I bought it is blue. ✓ The dress which I bought is blue.", "✗ The man which sells shoes … ✓ The man who sells shoes …", "✗ The shop where I bought my jeans there … ✓ The shop where I bought my jeans …"]}], "f": "", "pr": ["Workbook p. 24, Grammar 1; read Grammar Reference 4.1.", "Write 6 sentences about clothes and people you know: use who, which, that, whose, where and when (one each). Make two of them non-defining."], "q": ["Which pronoun do we use for people, things and possession?", "When do we use commas in relative clauses?", "Can we use ‘that’ in non-defining clauses?", "When can we leave out the relative pronoun?"], "qz": [{"q": "The woman … made my dress lives next door.", "o": ["which", "who", "whose", "where"], "a": 1, "why": "We use ‘who’ for people."}, {"q": "This is the shop … I bought my trainers.", "o": ["where", "when", "which", "who"], "a": 0, "why": "‘Where’ refers to a place."}, {"q": "That’s the boy … jacket was stolen.", "o": ["that", "who", "whose", "which"], "a": 2, "why": "‘Whose’ shows possession."}, {"q": "Choose the correct sentence.", "o": ["My brother, who is 20, studies design.", "My brother who is 20, studies design.", "My brother, which is 20, studies design.", "My brother, that is 20, studies design."], "a": 0, "why": "Non-defining clause: commas and ‘who’ for people, never ‘that’."}, {"q": "In which sentence can you leave out the relative pronoun?", "o": ["The girl who lives here is my friend.", "The T-shirt that I bought is too small.", "The man who sells hats is friendly.", "The shop which opened yesterday is big."], "a": 1, "why": "‘That’ is the object here (I is the subject), so it can be omitted."}, {"q": "I’ll never forget the day … I met my favourite designer.", "o": ["where", "which", "when", "who"], "a": 2, "why": "‘When’ refers to a time."}, {"q": "Find the mistake: ‘The scarf which my gran knitted it is warm.’", "o": ["warm", "which", "knitted", "it"], "a": 3, "why": "We don’t repeat the object with ‘it’ in a relative clause."}, {"q": "Ukraine, … is famous for embroidery, has many traditional costumes.", "o": ["who", "where", "that", "which"], "a": 3, "why": "Non-defining clause about a thing/country – ‘which’ with commas."}]}, {"n": "36", "t": "Listening and Speaking: shopping choices and personal style", "g": "You will practise listening for opinions and feelings and learn how to compare options, ask questions and justify your choices in a pair task.", "k": "Unit 4 · That’s the fashion · Listening + Speaking · SB pp.46-47", "terms": [["justify", "обґрунтовувати"], ["compare", "порівнювати"], ["whereas", "тоді як"], ["attitude", "ставлення"], ["budget", "бюджет"]], "th": [{"h": "Listening: opinions and attitudes", "p": ["In so
