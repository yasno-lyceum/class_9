he semester reading test checks and use strategies to answer different reading tasks accurately and on time.", "k": "Semester 2 assessment", "terms": [["skimming", "швидке читання для загального розуміння"], ["scanning", "пошукове читання"], ["true / false / not given", "правда / неправда / не згадано"], ["matching", "завдання на відповідність"], ["time management", "розподіл часу"]], "th": [{"h": "What the reading test checks", "p": ["The reading test checks how well you understand B1-level texts on the topics of semester 2: travel, free time, technology, entertainment, education and health. You may see several short texts and one longer text."], "ul": ["Understanding the main idea of a text or paragraph", "Finding specific details (names, numbers, reasons)", "Understanding the writer's opinion", "Guessing the meaning of words from context", "Possible task types: multiple choice, matching, gapped text, true/false/not given"]}, {"h": "Strategies", "p": ["Divide your time between the tasks. Don't spend too long on one difficult question — come back to it at the end."], "ul": ["Read the instructions carefully — how many answers do you need?", "Read the questions first, then skim the text.", "Scan for key words and their synonyms.", "Eliminate wrong options in multiple choice.", "In gapped texts, look for linking words and pronouns.", "«Not given» means the text doesn't say it — don't use your own knowledge.", "Transfer your answers carefully and check them at the end."]}, {"h": "Practice task", "p": ["Read the text and decide: True, False or Not Given.", "Mark joined a running club in September. At first he could only run for five minutes without stopping, but he trained three times a week. By December he ran his first 5 km race. He didn't win, but he finished faster than he had expected. Now he wants to try a 10 km race in spring."], "ul": ["1. Mark could run 5 km in September. (False)", "2. He trained three times a week. (True)", "3. He came second in the race. (Not Given — the text says he didn't win, but not his place)", "4. He was pleased with his time. (True — faster than he had expected)", "5. His friend runs with him. (Not Given)"]}, {"h": "Self-assessment", "p": ["After the test, think honestly about how it went."], "ul": ["Did I finish all the tasks on time?", "Which task type was the easiest for me?", "Which task type do I need to practise more?", "Did I check my answers at the end?"]}], "f": "", "pr": ["Read one short English article (about 200 words) on a topic you like and write 5 true/false questions about it.", "Write down two reading strategies that helped you most in the test and one you want to practise."], "q": ["What is the difference between skimming and scanning?", "What does «Not Given» mean in a reading task?", "What should you do if one question is very difficult?", "Why should you look for synonyms in the text?"], "qz": [{"q": "Skimming means reading a text …", "o": ["only the title", "quickly to get the general idea", "aloud", "very slowly, word by word"], "a": 1, "why": "Skimming is fast reading for the main idea."}, {"q": "Scanning means …", "o": ["summarising the text", "translating the text", "looking for specific information", "reading the text twice"], "a": 2, "why": "Scanning is searching for particular details like names or numbers."}, {"q": "In the practice text, why is «He came second» Not Given?", "o": ["The text says he won.", "The text says he came last.", "The text doesn't say what place he finished in.", "The text says he didn't run."], "a": 2, "why": "We only know he didn't win; his exact place isn't mentioned."}, {"q": "What should you do first?", "o": ["Read the instructions and questions", "Read only the first line", "Guess all answers", "Answer the last question"], "a": 0, "why": "Instructions and questions tell you what to look for."}, {"q": "If a question is too difficult, you should …", "o": ["stop the test", "leave the room", "move on and come back later", "spend 20 minutes on he task twice and underline what you must include.", "Decide: who is the reader? Formal or informal style?", "Write a short plan: 3–5 paragraphs with key ideas.", "Write the text using linking words.", "Use grammar from this year: the passive, the causative, comparatives, conditionals.", "Count your words roughly.", "Proofread: check verb forms, articles, spelling and punctuation."]}, {"h": "Practice task", "p": ["Task: Write an opinion essay (120–150 words): «Teenagers should learn practical skills like cooking and first aid at school.» Do you agree?", "Sample plan: Introduction — I agree; practical skills are as important as academic subjects. Paragraph 2 — first aid can save lives (example: helping someone who has fainted). Paragraph 3 — cooking helps you eat more healthily and be independent; however, the timetable is already full. Conclusion — to sum up, schools should find time, maybe one lesson a week."], "ul": ["Notice the clear opinion in the introduction.", "Each paragraph has one main idea.", "The writer mentions the opposite view (However…).", "The conclusion repeats the opinion in new words."]}, {"h": "Self-check before you hand in", "p": ["Use this list to check your work in the last five minutes."], "ul": ["All parts of the task are answered.", "Clear paragraphs with topic sentences.", "Correct greeting/ending (letter) or introduction/conclusion (essay).", "No contractions in formal writing; contractions are OK in informal letters.", "Verb tenses and articles are checked.", "The text is within the word limit."]}], "f": "", "pr": ["Write the practice essay from this lesson (120–150 words) using the plan.", "Read one of your old texts from this year, find 5 mistakes and correct them."], "q": ["What four things does the teacher check in a writing test?", "How long should you spend planning?", "What is the difference between formal and informal register?", "What should you check when you proofread?"], "qz": [{"q": "What is the first thing you should do in ul speaking phrases and practise saying them aloud until they sound natural."], "q": ["What does «fluency» mean?", "What can you say if you need time to think?", "What can you do if you forget a word?", "Why is interaction with your partner important?"], "qz": [{"q": "Which phrase helps you gain time?", "o": ["Let me think…", "Break a leg", "Yours faithfully", "Write back soon"], "a": 0, "why": "«Let me think…» gives you a moment to plan your answer."}, {"q": "You forgot the word «thermometer». What can you say?", "o": ["Next question, please.", "I don't speak English.", "It's something you use to check your temperature.", "Nothing — stay silent"], "a": 2, "why": "Paraphrasing helps when you forget a word."}, {"q": "Which is a good way to involve your partner?", "o": ["What about you?", "Whatever.", "Stop talking.", "I'm right."], "a": 0, "why": "Asking «What about you?» invites your partner to speak."}, {"q": "«Fluency» means …", "o": ["speaking very loudly", "using only long words", "speaking smoothly without many long pauses", "never making mistakes"], "a": 2, "why": "Fluency is speaking naturally and continuously."}, {"q": "How should you answer «Do you like sport?»", "o": ["Yes, I do. I play volleyball twice a week because it helps me relax.", "Sport.", "Yes.", "No."], "a": 0, "why": "A good answer is a full sentence with a reason or example."}, {"q": "Which phrase is used for comparing photos?", "o": ["Once upon a time…", "Dear Sir…", "To sum up…", "Both pictures show…"], "a": 3, "why": "«Both pictures show…» describes a similarity."}, {"q": "You didn't understand the question. What is the best thing to say?", "o": ["Next.", "What?!", "I don't care.", "Sorry, could you repeat the question, please?"], "a": 3, "why": "This is a polite way to ask for repetition."}]}, {"n": "139", "t": "Analysis of semester tests: learning from mistakes", "g": "You will analyse your semester test results, correct your mistakes and make a plan to improve your English.", "k": "Semester 2 assessment", "terms": [["analysis", "аналіз"], ["typical mistake", "типова помилка"], ["to correct", "виправляти"], ["result", "результат"], ["improvement plan", "план покращення"]], "th": [{"h": "Why analyse your tests?", "p": ["A test is not only a mark — it is information about your learning. When you understand why you made a mistake, you are less likely to make it again.", "Look at each test (reading, listening, writing, speaking) and sort your mistakes into groups."], "ul": ["Grammar mistakes: wrong tense, word order, missing articles", "Vocabulary mistakes: wrong word or collocation (do/make, say/tell)", "Spelling and punctuation mistakes", "Reading/listening mistakes: misunderstood question, fell for a distractor", "Time mistakes: didn't finish, rushed the last task", "Careless mistakes: you knew the answer but didn't check"]}, {"h": "Typical mistakes and corrections", "p": ["Here are some common mistakes at this level. Do you recognise any of them in your work?"], "ul": ["✗ I have been to London last year. → ✓ I went to London last year.", "✗ She said me that… → ✓ She told me that… / She said that…", "✗ The house was build in 1990. → ✓ The house was built in 1990.", "✗ I had cut my hair at the salon. → ✓ I had my hair cut at the salon.", "✗ It was so a good film. → ✓ It was such a good film.", "✗ He is more taller than me. → ✓ He is taller than me.", "✗ I made my homework. → ✓ I did my homework."]}, {"h": "Your improvement plan", "p": ["Write a short plan for the summer. Choose 2–3 goals and decide exactly how and when you will work on them."], "ul": ["My strongest skill is… because…", "I need to improve… because I made mistakes with…", "Goal 1: revise … (grammar point) — 15 minutes, twice a week.", "Goal 2: read/listen to … in English every week.", "Goal 3: learn 10 new words every week and test myself.", "I will check my progress on … (date)."]}], "f": "", "pr": ["Work on your mistakes: copy every mistake from your semester tests, write the correct const LINKS = [];
const COLORS = {art:"var(--s-art)", zu:"var(--s-zu)", pe:"var(--s-pe)", fk:"var(--s-pe)", tech:"var(--s-tech)"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("yasno-quiz") || "{}"); } catch(e){ return {}; } },
  set(o){ try { localStorage.setItem("yasno-quiz", JSON.stringify(o)); } catch(e){} }
};
let results = store.get();

// flatten
const LES = {};
DATA.forEach(s => { s.flat = []; s.themes.forEach((t, ti) => t.lessons.forEach((l, li) => {
  l.id = s.id + "-" + s.flat.length; l.subj = s; l.theme = t; l.ti = ti; s.flat.push(l); LES[l.id] = l; })); });

let cur = { s: DATA[0].id, id: DATA[0].flat[0].id };
if (DATA.length === 1) { document.getElementById("tabs").hidden = true;
  const bk = document.createElement("a"); bk.className = "back"; bk.href = "index.html"; bk.textContent = "← All subjects";
  document.querySelector(".top-in").appendChild(bk); }
try { const h = location.hash.slice(1); if (LES[h]) cur = { s: LES[h].subj.id, id: h }; else { const last = localStorage.getItem("yasno-last"); if (last && LES[last]) cur = { s: LES[last].subj.id, id: last }; } } catch(e){}

const tabs = document.getElementById("tabs");
DATA.forEach(s => {
  const b = document.createElement("button");
  b.className = "tab"; b.role = "tab"; b.style.setProperty("--c", COLORS[s.id] || COLORS[s.id.replace(/\d+$/, "")]);
  b.innerHTML = "<i></i>" + esc(s.short); b.dataset.s = s.id;
  b.onclick = () => { if (cur.s !== s.id) open(s.flat[0].id); };
  tabs.appendChild(b);
});
(typeof LINKS !== "undefined" ? LINKS : []).forEach(x => {
  const a = document.createElement("a");
  a.className = "tab"; a.href = x.href; a.style.setProperty("--c", x.c);
  a.innerHTML = "<i></i>" + esc(x.name) + ' <span aria-hidden="true">↗</span>';
  a.title = "Open course «" + x.name + "»";
  tabs.appendChild(a);
});

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Which word matches the translation?", sub: def, opts }
      : { q: "What does «" + term + "»?", sub: "", opts };
  });
}

function renderToc(){
  const s = DATA.find(x => x.id === cur.s);
  document.documentElement.style.setProperty("--subj", COLORS[s.id] || COLORS[s.id.replace(/\d+$/, "")]);
  [...tabs.children].forEach(b => b.setAttribute("aria-selected", b.dataset.s === s.id));
  const qv = norm(document.getElementById("search").value || "");
  const toc = document.getElementById("toc"); toc.innerHTML = "";
  let shown = 0;
  s.themes.forEach(t => {
    const ls = t.lessons.filter(l => !qv || norm(l.t).includes(qv) || l.terms.some(x => norm(x[0]).includes(qv)));
    if (!ls.length) return;
    const d = document.createElement("div"); d.className = "theme";
    d.innerHTML = "<h3>" + esc(t.name) + "</h3>";
    ls.forEach(l => {
      shown++;
      const r = results[l.id];
      const b = document.createElement("button"); b.className = "les";
      b.setAttribute("aria-current", l.id === cur.id);
      const no = s.id === "zu" ? "№ " + l.n : l.n;
      b.innerHTML = '<span class="no">' + esc(no) + '</span><span class="tt">' + esc(l.t) + '</span>' +
        (r ? '<span class="st ' + (r >= 4 ? "done" : "part") + '">' + r + "/5</span>" : "");
      b.onclick = () => open(l.id);
      d.appendChild(b);
    });
    toc.appendChild(d);
  });
  if (!shown) toc.innerHTML = '<p class="empty">Nothing found. Try another word.</p>';
  const ql = s.flat.filter(l => !l.noquiz), done = ql.filter(l => (results[l.id] || 0) >= 4).length;
  document.getElementById("progTxt").textContent = done + " / " + ql.length;
  document.getElementById("progBar").style.width = (100 * done / ql.length) + "%";
}

function renderLesson(){
  const l = LES[cur.id], s = l.subj;
  const A = document.getElementById("art");
  let h = '<div class="eyebrow">' + esc(s.name) + " · " + esc(l.theme.name) + "</div>";
  h += "<h1>" + esc(l.t) + "</h1><div class=\"meta\">";
  h += '<span class="chip">' + (s.id === "zu" ? "Session " : s.id.startsWith("pe") ? "Lesson " : s.id === "tech" ? "Topic " : "Lesson ") + esc(l.n) + "</span>";
  if (l.noquiz) h += '<span class="chip">Creative project</span>';
  if (l.book) h += '<a class="chip" href="' + esc(l.book.href) + '" target="_blank" rel="noopener">' + esc(l.book.label) + ' ↗</a>';
  if (l.k) h += '<span class="chip">' + esc(l.k) + "</span>";
  h += "</div>";
  if (l.g) h += '<div class="goal"><b>Goal.</b>' + esc(l.g) + "</div>";
  if (l.terms.length && !l.bl) { h += "<h2>Key words</h2><dl class=\"terms\">" + l.terms.map(([t, d]) => "<dt>" + esc(t) + "</dt><dd>" + esc(d) + "</dd>").join("") + "</dl>"; }
  if (l.bl) {
    h += '<div class="prose">';
    const li = ([a, b]) => "<li>" + (a ? "<b>" + esc(a) + "</b> " : "") + esc(b) + "</li>";
    l.bl.forEach(b => {
      if (b.k === "h2") h += "</div><h2>" + esc(b.v) + '</h2><div class="prose">';
      else if (b.k === "h3") h += "<h3>" + esc(b.v) + "</h3>";
      else if (b.k === "p") h += "<p>" + esc(b.v) + "</p>";
      else if (b.k === "lead") h += '<p class="lead">' + esc(b.v) + "</p>";
      else if (b.k === "call") h += '<div class="call">' + esc(b.v) + "</div>";
      else if (b.k === "fig") h += '<figure class="fig"><img src="' + b.src + '" alt="' + esc(b.alt) + '" loading="lazy"></figure>';
      else if (b.k === "ul") h += "<ul>" + b.v.map(li).join("") + "</ul>";
      else if (b.k === "ol" || b.k === "crit") h += "<ol>" + b.v.map(li).join("") + "</ol>";
      else if (b.k === "steps") h += '<ol class="steps">' + b.v.map(([a, c]) => "<li><b>" + esc(a) + "</b>" + esc(c) + "</li>").join("") + "</ol>";
      else if (b.k === "terms") h += '<ul class="tgrid">' + b.v.map(([a, c]) => "<li><b>" + esc(a) + "</b>" + esc(c) + "</li>").join("") + "</ul>";
      else if (b.k === "cards") h += '<div class="cardsx">' + b.v.map(c => '<article class="cardx"><img src="' + c.src + '" alt="' + esc(c.alt) + '" loading="lazy"><div>' + (c.h ? "<h4>" + esc(c.h) + "</h4>" : "") + c.v.map(([a, d]) => "<p>" + (a ? "<b>" + esc(a) + "</b>" : "") + esc(d) + "</p>").join("") + "</div></article>").join("") + "</div>";
    });
    h += "</div>";
  }
  if (l.th.length) {
    h += "<h2>" + (l.terms.length ? "Lesson notes" : "Summary") + '</h2><div class="prose">';
    l.th.forEach(b => {
      if (b.h) h += "<h4>" + esc(b.h) + "</h4>";
      b.p.forEach(p => h += "<p>" + esc(p) + "</p>");
      if (b.ul.length) h += "<ul>" + b.ul.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    });
    h += "</div>";
  }
  if (l.f) h += '<div class="fact"><b>Did you know?</b>' + esc(l.f) + "</div>";
  if (l.pr.length) h += '<h2>Home tasks</h2><div class="prose"><ul class="tasks">' + l.pr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  if (l.q.length) h += '<h2>Self-check questions</h2><div class="prose"><ol>' + l.q.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol></div>";
  if (!l.noquiz) h += '<section class="quiz" id="quiz"></section>';
  A.innerHTML = h;
  A.querySelectorAll(".fig img,.cardx img").forEach(im => im.onclick = () => {
    const d = document.createElement("div"); d.className = "lb"; d.innerHTML = '<img alt="">'; d.firstChild.src = im.src; d.firstChild.alt = im.alt;
    d.onclick = () => d.remove(); document.body.appendChild(d); });
  if (!l.noquiz) renderQuiz(l);
  const i = s.flat.indexOf(l), pv = s.flat[i - 1], nx = s.flat[i + 1];
  const P = document.getElementById("pager"); P.innerHTML = "";
  [[pv, "← Previous"], [nx, "Next →"]].forEach(([x, lab]) => { if (!x) return;
    const b = document.createElement("button"); b.innerHTML = esc(lab) + "<b>" + esc(x.t) + "</b>"; b.onclick = () => open(x.id); P.appendChild(b); });
}

function renderQuiz(l){
  const Q = makeQuiz(l), box = document.getElementById("quiz");
  const prev = results[l.id];
  let h = '<div class="qhead"><h2>Quiz · 5 questions</h2><p>' + (prev ? "Best score: " + prev + " of 5" : "Choose one answer in each question") + "</p></div><form id=\"qf\">";
  Q.forEach((q, i) => {
    h += '<div class="q"><div class="qt"><span>' + (i + 1) + ".</span><div>" + esc(q.q) + (q.sub ? "<br><em>" + esc(q.sub) + "</em>" : "") + '</div></div><div class="opts">';
    q.opts.forEach(([t], j) => h += '<label class="opt"><input type="radio" name="q' + i + '" id="q' + i + "o" + j + '" value="' + j + '"><span>' + esc(t) + "</span></label>");
    h += "</div></div>";
  });
  h += '<div class="qfoot"><button class="btn" type="submit" id="chk" disabled>Check</button><button class="btn ghost" type="button" id="again">Other questions</button><span class="score" id="sc" aria-live="polite"></span></div></form>';
  box.innerHTML = h;
  const f = document.getElementById("qf"), chk = document.getElementById("chk");
  f.addEventListener("change", () => { chk.disabled = Q.some((_, i) => !f["q" + i] || ![...f.querySelectorAll('[name="q' + i + '"]')].some(x => x.checked)); });
  document.getElementById("again").onclick = () => renderQuiz(l);
  f.addEventListener("submit", e => {
    e.preventDefault(); if (f.classList.contains("checked")) return;
    let ok = 0;
    Q.forEach((q, i) => {
      const inputs = [...f.querySelectorAll('[name="q' + i + '"]')];
      inputs.forEach((inp, j) => { inp.disabled = true; const lab = inp.parentElement;
        if (q.opts[j][1]) lab.classList.add("right"); else if (inp.checked) lab.classList.add("wrong"); });
      if (q.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = q.why; inputs[0].closest(".opts").after(w); }
      const sel = inputs.findIndex(x => x.checked); if (sel >= 0 && q.opts[sel][1]) ok++;
    });
    f.classList.add("checked"); chk.disabled = true;
    const sc = document.getElementById("sc");
    sc.className = "score " + (ok >= 4 ? "good" : ok >= 3 ? "mid" : "low");
    sc.textContent = "Score: " + ok + " of 5. " + (ok === 5 ? "Excellent!" : ok >= 4 ? "Well learned." : ok >= 3 ? "Review the key words." : "Read the notes again and try once more.");
    if (ok > (results[l.id] || 0)) { results[l.id] = ok; store.set(results); }
    renderToc();
  });
}

function open(id){
  cur = { s: LES[id].subj.id, id };
  try { localStorage.setItem("yasno-last", id); } catch(e){}
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  renderToc(); renderLesson();
  document.getElementById("side").classList.remove("open");
  document.getElementById("tocBtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}
document.getElementById("search").addEventListener("input", renderToc);
document.getElementById("tocBtn").onclick = e => { const sd = document.getElementById("side"); const o = sd.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
open(cur.id);
</script>
