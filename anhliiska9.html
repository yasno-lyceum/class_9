p in a tent or a caravan)", "bed and breakfast (B&B) — гостьовий будинок зі сніданком", "holiday cottage / apartment — котедж / квартира для відпочинку", "youth camp — молодіжний табір", "guesthouse — гостьовий будинок", "houseboat — житловий човен"]}, {"h": "Describing a place to stay", "p": ["Use adjectives and collocations to describe accommodation in reviews and conversations."], "ul": ["book a room — забронювати номер", "a single / double room — одномісний / двомісний номер", "full board / half board — повний пансіон / напівпансіон", "facilities: Wi-Fi, swimming pool, gym, parking — зручності", "cosy — затишний; spacious — просторий; cramped — тісний", "value for money — вигідна ціна за якість", "fully booked — немає вільних місць"]}, {"h": "Comparing costs", "p": ["Imagine a family of four going to the Carpathians for three nights. A hotel with full board is the most comfortable option, but it is also the most expensive. A self-catering cottage is cheaper because you cook your own meals. A campsite is the cheapest, but you need your own tent and good weather!"], "ul": ["The hostel is much cheaper than the hotel.", "The cottage isn't as expensive as the hotel.", "Camping is the cheapest option, isn't it?", "Self-catering helps you save money on food.", "Hidden extra costs: tourist tax, parking, breakfast, towels."]}], "f": "", "pr": ["Workbook p. 43, Vocabulary 2.", "Write a short review (60–80 words) of a place you stayed in (real or imaginary). Use at least 5 words from the lesson."], "q": ["What is the difference between a hotel and a hostel?", "What does self-catering mean?", "Which accommodation would you choose for a school trip and why?", "What does ‘value for money’ mean?"], "qz": [{"q": "A cheap place with shared rooms, popular with young travellers, is a…", "o": ["cottage", "palace", "resort hotel", "hostel"], "a": 3, "why": "Hostels are budget accommodation with shared rooms."}, {"q": "If you sleep in a tent, you stay at a…", "o": ["guesthouse", "B&B", "campsite", "houseboat"], "a": 2, "why": "A campsite is a place for tents and caravans."}, {"q": "‘Full board’ means…", "o": ["all meals are included", "the hotel is full", "no meals are included", "a big room"], "a": 0, "why": "Full board includes breakfast, lunch and dinner."}, {"q": "Sorry, we have no rooms left. We're fully ___.", "o": ["paid", "checked", "packed", "booked"], "a": 3, "why": "Fully booked = no free rooms."}, {"q": "The room was so small and ___ that we couldn't open our suitcases.", "o": ["spacious", "cramped", "cosy", "luxurious"], "a": 1, "why": "Cramped means too small and uncomfortable."}, {"q": "Choose the correct sentence.", "o": ["The cottage isn't as expensive as the hotel.", "The cottage isn't so expensive than the hotel.", "The cottage is expensiver than the hotel.", "The cottage is the most cheap."], "a": 0, "why": "We use ‘not as + adjective + as’ to compare."}, {"q": "‘Facilities’ in a hotel are…", "o": ["the guests", "the prices", "services and equipment like a pool or Wi-Fi", "the rules"], "a": 2, "why": "Facilities are things provided for guests to use."}]}, {"n": "77", "t": "Grammar: past perfect simple and past perfect continuous", "g": "You will use the past perfect simple and past perfect continuous to talk about actions before another moment in the past.", "k": "Unit 7 · Have a great trip! · Grammar · SB p.85", "terms": [["past perfect simple", "минулий доконаний час"], ["past perfect continuous", "минулий доконано-тривалий час"], ["past participle", "дієприкметник минулого часу (3-тя форма)"], ["by the time", "до того часу як"], ["already", "вже"]], "th": [{"h": "Past perfect simple: form and use", "p": ["Form: had + past participle. We use it for an action that happened before another past action or a moment in the past. It shows which action came first."], "ul": ["Positive: When we arrived, the train had left.", "Negative: I hadn't booked a room, so we slept in the car.", "Question: Had you ever flown before that trip?", "Short answers: Yes, I had. / No, I hadn't.", "Contraction: I'd / she'd = I had / she had"]}, {"h": "Past perfect continuous: form and use", "p": ["Form: had been + verb-ing. We use it for a longer action that continued up to a moment in the past. It often explains a result we could see."], "ul": ["We had been waiting for two hours when the bus finally came.", "Her eyes were red because she had been crying.", "They were tired because they had been walking all day.", "Negative: He hadn't been sleeping well before the exam.", "Question: How long had you been travelling when you got lost?", "Stative verbs (know, like, own) use past perfect simple: I had known him for years."]}, {"h": "Time expressions", "p": ["These words often go with past perfect tenses."], "ul": ["already, just, never, ever, yet", "by the time: By the time we got to the beach, it had started to rain.", "before / after: After we had checked in, we went to the beach.", "when: When I woke up, everyone had gone.", "for / since (continuous): She had been living in Rivne for ten years."]}, {"h": "Common mistakes", "p": ["Remember: we don't need past perfect if the order of actions is clear and they happen one after the other."], "ul": ["✗ I had gone to the station and I had bought a ticket. → ✓ I went to the station and bought a ticket.", "✗ When I arrived, the film started. (I saw it start) vs ✓ When I arrived, the film had started. (I missed the beginning)", "✗ We had been knowing him. → ✓ We had known him.", "Simple = completed result; continuous = duration or activity."]}], "f": "", "pr": ["Workbook p. 44, Grammar 2.", "Write 6 sentences about a holiday when something went wrong. Use the past perfect simple in three and the past perfect continuous in three (e.g. We had been driving for hours when…)."], "q": ["How do you form the past perfect continuous?", "Which action is earlier in: ‘When I arrived, they had eaten’?", "Why can't we say ‘had been knowing’?", "What does ‘by the time’ mean?"], "qz": [{"q": "When we got to the airport, our plane ___.", "o": ["already left", "was leaving already been", "has already left", "had already left"], "a": 3, "why": "Leaving happened before we got there, so we use past perfect."}, {"q": "She was exhausted because she ___ all night.", "o": ["has driven", "had been driving", "drives", "had been drove"], "a": 1, "why": "A long activity before a past moment explains the result: past perfect continuous."}, {"q": "I ___ him before the trip, so we became friends quickly.", "o": ["had known", "had been knowing", "have known", "was knowing"], "a": 0, "why": "‘Know’ is a stative verb, so we use past perfect simple."}, {"q": "___ you ever been abroad before that summer?", "o": ["Have", "Did", "Had", "Were"], "a": 2, "why": "Past perfect question: Had + subject + past participle."}, {"q": "By the time we arrived, the concert ___.", "o": ["finished", "had finished", "has finished", "had been finish"], "a": 1, "why": "The concert ended before our arrival."}, {"q": "How long ___ for the bus when it finally came?", "o": ["had you waited been", "have you waited", "did you wait been", "had you been waiting"], "a": 3, "why": "How long + duration up to a past moment → past perfect continuous."}, {"q": "Which sentence is correct?", "o": ["They hadn't book a room.", "They didn't had booked a room.", "They hadn't booked a room.", "They hadn't been book a room."], "a": 2, "why": "Negative: hadn't + past participle."}, {"q": "After we ___ our bags, we went sightseeing.", "o": ["had unpacked", "have unpacked", "unpacking", "had been unpack"], "a": 0, "why": "Unpacking came first, so past perfect simple is correct."}]}, {"n": "78", "t": "Writing: a story about a travel adventure", "g": "You will plan and write a story about an adventure on a trip, using narrative tenses, set phrases and ideas about safety.", "k": "Unit 7 · Have a great trip! · Writing · SB pp.86-87", "terms": [["narrative tenses", "оповідні часи"], ["plot", "сюжет"], ["setting", "місце й час дії"], ["climax", "кульмінація"], ["all of a sudden", "раптом"], ["in the end", "зрештою"]], "th": [{"h": "Structure of a story", "p": ["A good story has a clear beginning, middle and end. Exam tasks often give you the first or last sentence — your story must connect logically with it."], "ul": ["Paragraph 1 — Setting: who, where, when (It was a sunny morning in July…)", "Paragraph 2 — Events: what happened, step by step", "Paragraph 3 — Climax: the most exciting or dangerous moment", "Paragraph 4 — Ending: how it finished and how you felt", "Length: usually 120–180 words", "Use the given sentence exactly as it is."]}, {"h": "Useful language and set phrases", "p": ["Mix narrative tenses: past simple for main events, past continuous for background, past perfect for earlier actions. Set phrases make the story lively."], "ul": ["Background: The sun was shining and birds were singing.", "Earlier action: We had been walking for three hours when…", "Sequencing: At first… Then… After that… Finally…", "Surprise: All of a sudden… / To our surprise… / Out of nowhere…", "Feelings: I was scared stiff. / My heart was beating fast. / What a relief!", "Ending: In the end… / Luckily… / I will never forget that day.", "Adjectives: terrifying, breathtaking, exhausted, relieved"]}, {"h": "Model story (original)", "p": ["It was a cold morning in the Carpathians when Dan and I set off to climb Hoverla. We had checked the weather forecast and packed warm clothes, water and a map. For two hours the path was easy and the views were breathtaking.", "All of a sudden, thick fog covered the mountain. We couldn't see more than a few metres. My heart was beating fast, but we remembered our instructor's advice: stay on the marked path and don't panic. We followed the red and white signs slowly. In the end, the fog disappeared and we reached the top. What a relief! That day I learned that good preparation keeps you safe."], "ul": ["Notice the tenses: had checked, was beating, set off.", "Notice safety ideas: check the forecast, stay on the path, don't panic.", "Notice the ending: a lesson learned and a feeling (What a relief!)."]}, {"h": "Safety on active holidays and checklist", "p": ["Your story can show what is safe and what is dangerous. Before handing in your story, check it."], "ul": ["Safe: tell someone your route, carry water and a charged phone, follow signs.", "Dangerous: swimming alone, hiking in bad weather, leaving the path.", "Checklist: Did I use the given sentence?", "Are there 4 paragraphs?", "Did I use past simple, past continuous and past perfect?", "Did I use at least 3 set phrases and describe feelings?"]}], "f": "Hoverla is the highest mountain in Ukraine, at about 2,061 metres.", "pr": ["Workbook p. 45, Writing; read the Writing Reference for stories.", "Write a story (120–180 words) that begins: ‘We had only been on holiday for a day when everything went wrong.’"], "q": ["What are the four parts of a story?", "Which tense do we use for background description?", "Give three phrases for a surprise moment.", "Name two safety rules for hiking in the mountains."], "qz": [{"q": "Which tense describes the background of a story?", "o": ["future simple", "present simple", "past continuous", "present perfect"], "a": 2, "why": "Past continuous sets the scene: The sun was shining…"}, {"q": "Which phrase introduces a sudden event?", "o": ["In conclusion", "All of a sudden", "Firstly", "To sum up"], "a": 1, "why": "‘All of a sudden’ means suddenly."}, {"q": "If the exam gives you the first sentence, you should…", "o": ["change it a little", "put it at the end", "ignore it", "use it exactly as it is"], "a": 3, "why": "The given sentence must be used without changes."}, {"q": "The most exciting moment of a story is the…", "o": ["setting", "title", "climax", "plan"], "a": 2, "why": "The climax is the high point of the plot."}, {"q": "We were tired because we ___ for hours.", "o": ["had been walking", "walk", "have walked", "are walking"], "a": 0, "why": "Past perfect continuous explains a past result."}, {"q": "Which is a dangerous choice on an active holiday?", "o": ["checking the weather forecast", "telling someone your route", "carrying water", "leaving the marked path in fog"], "a": 3, "why": "Leaving the path in fog can make you get lost."}, {"q": "‘What a relief!’ shows that the writer feels…", "o": ["angry", "relaxed after worry", "bored", "jealous"], "a": 1, "why": "Relief is the good feeling after a worry ends."}]}, {"n": "79", "t": "Live well, study well: finding motivation", "g": "You will understand ways to stay motivated, see how habits affect your health and study, and talk about your own goals.", "k": "Unit 7 · Have a great trip! · Live well, study well · SB p.88", "terms": [["motivation", "мотивація"], ["goal", "мета"], ["habit", "звичка"], ["procrastinate", "зволікати, відкладати"], ["reward", "винагорода"], ["give up", "здаватися, кидати"]], "th": [{"h": "Why is motivation hard?", "p": ["Everyone loses motivation sometimes, especially when studying at home. A task can seem too big, boring or far away. The good news is that motivation often comes after you start, not before.", "Habits are powerful: small actions repeated every day can change your health, mood and results."], "ul": ["Intrinsic motivation — внутрішня мотивація (I study because I enjoy it.)", "Extrinsic motivation — зовнішня мотивація (I study to get a good mark.)", "procrastinate — відкладати на потім", "set a goal — поставити мету", "keep going — продовжувати", "stay focused — зосереджуватися"]}, {"h": "Tips to find motivation (understanding an infographic)", "p": ["Infographics give information in short points, numbers and pictures. Read the headings first, then the details. Here are ideas you might find on a motivation infographic."], "ul": ["Break a big task into small steps.", "Set SMART goals: specific, measurable, achievable, relevant, time-bound.", "Work for 25 minutes, then take a 5-minute break.", "Reward yourself when you finish a step.", "Sleep, move and eat well — your brain needs energy.", "Track your progress in a diary or app.", "Study with a friend and support each other."]}, {"h": "Discuss and do a project", "p": ["Talk with a partner or answer in writing. Then choose one project idea (the plan says ‘project of your choice’)."], "ul": ["What motivates you most: marks, interest, family, friends?", "Which bad habit makes you procrastinate? How can you change it?", "Project 1: make your own motivation infographic for 9th-graders.", "Project 2: try a 7-day habit challenge and keep a diary.", "Project 3: interview two people about how they stay motivated and present the results.", "Useful language: I find it helpful to… / What works for me is… / I tend to…"]}], "f": "The ‘Pomodoro Technique’ is named after a tomato-shaped kitchen timer that its inventor, Francesco Cirillo, used as a student.", "pr": ["Project of your choice: an infographic, a 7-day habit diary or a mini-survey (see the lesson).", "Write your own SMART goal for this semester and 3 small steps to reach it."], "q": ["What is the difference between intrinsic and extrinsic motivation?", "What does SMART stand for?", "Which habit helps your brain work better?", "What will you do the next time you want to procrastinate?"], "qz": [{"q": "‘Procrastinate’ means…", "o": ["work very fast", "plan carefully", "delay doing something", "win a prize"], "a": 2, "why": "To procrastinate is to put things off until later."}, {"q": "Studying because you enjoy the subject is ___ motivation.", "o": ["intrinsic", "extrinsic", "financial", "negative"], "a": 0, "why": "Intrinsic motivation comes from inside you."}, {"q": "In SMART goals, ‘T’ means…", "o": ["together", "tiny", "tired", "time-bound"], "a": 3, "why": "A goal should have a deadline."}, {"q": "Which is the best advice for a huge project?", "o": ["Do it all the night before.", "Break it into small steps.", "Wait for inspiration.", "Give up."], "a": 1, "why": "Small steps make a big task manageable."}, {"q": "Don't ___ — you're almost at the finish!", "o": ["give up", "set up", "take up", "make up"], "a": 0, "why": "Give up = stop trying."}, {"q": "When reading an infographic, you should first…", "o": ["read every small number", "count the pictures", "read the headings", "translate everything"], "a": 2, "why": "Headings show the main ideas quickly."}, {"q": "Which habit does NOT support motivation and health?", "o": ["regular sleep", "checking your phone every two minutes", "short breaks", "physical activity"], "a": 1, "why": "Constant phone checking breaks your focus."}]}, {"n": "80", "t": "Revision: Unit 7 vocabulary and grammar", "g": "You will review Unit 7 vocabulary (travel, transport, accommodation) and grammar (question tags, subject/object questions, past perfect tenses).", "k": "Unit 7 · Have a great trip! · End-of-Unit Revision", "terms": [["revision", "повторення"], ["question tag", "розділове питання"], ["past perfect", "минулий доконаний час"], ["accommodation", "житло"], ["journey", "подорож, поїздка"]], "th": [{"h": "Vocabulary summary", "p": ["Check that you can translate and use these words in a sentence."], "ul": ["Travel: destination, journey, trip, voyage, flight, sightseeing", "Transport: fare, delay, one-way / return ticket, catch / miss a train, get on / off", "Accommodation: hostel, campsite, B&B, cottage, full board, self-catering, fully booked", "Environment: eco-tourism, litter, pollution, carbon footprint, leave no trace", "Motivation: goal, habit, procrastinate, reward, give up", "Story phrases: all of a sudden, to our surprise, in the end, what a relief"]}, {"h": "Grammar summary 1: questions", "p": ["Question tags check information; subject/object questions ask about different parts of the sentence."], "ul": ["You like camping, don't you? / He can't swim, can he?", "I'm late, aren't I? / Let's go, shall we?", "Subject: Who booked the hotel? (no did)", "Object: What did Mum book? (did + infinitive)", "Nobody came, did they?"]}, {"h": "Grammar summary 2: past perfect tenses", "p": ["Past perfect simple (had + V3) = an action before another past action. Past perfect continuous (had been + V-ing) = a longer action up to a past moment."], "ul": ["When we arrived, the bus had gone.", "We had been waiting for an hour before it came.", "She was wet because she had been swimming.", "By the time I woke up, they had already left.", "Remember stative verbs: had known (✗ had been knowing)"]}], "f": "", "pr": ["Workbook p. 82, Review Unit 7.", "Make 10 flashcards with the most difficult words and structures from Unit 7 and test yourself twice this week."], "q": ["Which accommodation types do you remember? Name five.", "What is the tag for ‘She has never been to Spain’?", "What is the difference between ‘Who called you?’ and ‘Who did you call?’", "When do we use the past perfect continuous?"], "qz": [{"q": "She has never been to Spain, ___?", "o": ["hasn't she", "has she", "did she", "doesn't she"], "a": 1, "why": "‘Never’ makes the sentence negative, so the tag is positive: has she?"}, {"q": "___ the tickets? — Dad paid.", "o": ["Who paid for", "Who did pay for", "Who did paid for", "Whom paid for"], "a": 0, "why": "Subject question — no ‘did’."}, {"q": "We ___ for two hours when the rain stopped.", "o": ["hike", "have hiked", "had been hiking", "are hiking"], "a": 2, "why": "Duration before a past moment → past perfect continuous."}, {"q": "Our flight was cancelled, so we stayed in a cheap ___ near the airport.", "o": ["voyage", "hostel", "fare", "litter"], "a": 1, "why": "A hostel is cheap accommodation."}, {"q": "Don't drop ___ on the beach!", "o": ["facilities", "fare", "delay", "litter"], "a": 3, "why": "Litter is rubbish on the ground."}, {"q": "By the time we got to the cinema, the film ___.", "o": ["started", "has started", "had started", "starts"], "a": 2, "why": "The film started before we arrived."}, {"q": "We ___ the last bus and had to walk home.", "o": ["missed", "lost", "failed", "passed"], "a": 0, "why": "Collocation: miss a bus."}]}]}, {"name": "Unit 8. My own time (Мій власний час)", "lessons": [{"n": "81", "t": "Unit Opener: free-time activities", "g": "You will talk about free-time activities and hobbies, learn key vocabulary and think about which activities are safe or risky.", "k": "Unit 8 · My own time · Unit Opener + Vocabulary for Reading · SB pp.89-90", "terms": [["leisure", "дозвілля"], ["hobby", "хобі"], ["extreme sport", "екстремальний вид спорту"], ["risk", "ризик"], ["safety equipment", "засоби безпеки, спорядження"], ["thrill", "гострі відчуття"]], "th": [{"h": "What is this unit about?", "p": ["Unit 8 is about the time that belongs only to you: hobbies, sports, games and adventures. Some people relax with a book, others look for a thrill in caves, mountains or the sea.", "We will also discuss how to enjoy active free time safely."], "ul": ["Relaxing hobbies: reading, drawing, playing chess, gardening", "Creative hobbies: photography, playing an instrument, baking", "Active hobbies: cycling, rock climbing, skateboarding, swimming", "Adventure activities: caving, kayaking, diving, paragliding", "Social activities: board games, volunteering, team sports"]}, {"h": "Discuss with a partner (or answer in your notebook)", "p": ["Give reasons and examples from your own life."], "ul": ["How do you usually spend your free time?", "Which hobby would you like to try and why?", "Why do some people enjoy dangerous sports?", "What safety equipment do climbers or cyclists need?", "Is it important to have time for yourself? Why?"]}, {"h": "Key vocabulary for reading", "p": ["Learn these words before reading the next text. Make your own example for each."], "ul": ["cave — печера (The cave was dark and cold.)", "explore — досліджувати", "underground — під землею", "narrow — вузький (a narrow passage)", "torch / headlamp — ліхтарик / налобний ліхтар", "helmet — шолом", "challenge — виклик, складне завдання", "get lost — заблукати"]}], "f": "Mammoth Cave in Kentucky, USA, is the longest known cave system in the world, with more than 650 km of explored passages.", "pr": ["Study the Student Resources Unit 8 Wordlist: copy 15 new words with translations.", "Make a table with three columns — relaxing, creative, adventurous hobbies — and write 5 hobbies in each. Mark the ones you have tried."], "q": ["What is the difference between a relaxing and an adventurous hobby?", "What does ‘explore’ mean?", "Which safety equipment do you need for caving?", "Why is free time important for teenagers?"], "qz": [{"q": "‘Leisure’ means…", "o": ["hard work", "free time for relaxing", "a school subject", "a sport competition"], "a": 1, "why": "Leisure is time when you are not working or studying."}, {"q": "You wear a ___ to protect your head.", "o": ["torch", "rope", "glove", "helmet"], "a": 3, "why": "A helmet protects your head."}, {"q": "The passage was so ___ that we had to crawl.", "o": ["bright", "wide", "narrow", "noisy"], "a": 2, "why": "Narrow means not wide."}, {"q": "Which is an adventure activity?", "o": ["paragliding", "knitting", "reading", "baking"], "a": 0, "why": "Paragliding is an exciting outdoor activity with risk."}, {"q": "Without a map you can easily ___ in a big forest.", "o": ["get off", "get up", "get on", "get lost"], "a": 3, "why": "Get lost = not know where you are."}, {"q": "People who do extreme sports often enjoy the ___.", "o": ["boredom", "thrill", "silence", "homework"], "a": 1, "why": "Thrill is a strong feeling of excitement."}, {"q": "‘Underground’ means…", "o": ["below the surface of the earth", "above the clouds", "in the water", "on the roof"], "a": 0, "why": "Underground = under the ground."}]}, {"n": "82", "t": "Reading: exploring caves (multiple matching)", "g": "You will scan a text for key information, practise a multiple-matching task and discuss safe and unsafe situations in adventure hobbies.", "k": "Unit 8 · My own time · Reading · SB pp.90-91", "terms": [["scan", "швидко переглядати текст у пошуках інформації"], ["caver", "спелеолог"], ["passage", "прохід"], ["multiple matching", "завдання на множинну відповідність"], ["paraphrase", "перефразування"], ["oxygen", "кисень"]], "th": [{"h": "Non-linear reading", "p": ["The plan's text is «Deep into darkness». In a multiple-matching task you don't read from start to finish. You read the questions first and then jump around the text to find the part that matches each question. This is called non-linear reading."], "ul": ["Read the questions first and underline key words.", "Scan the text for synonyms and paraphrases of those key words.", "Read that part carefully to check the meaning.", "One section can match more than one question.", "Leave difficult questions and come back later."]}, {"h": "Original practice text: Three cavers", "p": ["A — Marta: I started caving when I was sixteen. The first time, I was terrified of the dark, but my instructor taught me to breathe slowly. Now I love the silence underground. B — Ihor: For me, caving is about science. I take photos of tiny animals that have never seen sunlight. We always go in a team of at least three, and someone outside knows exactly when we should return.", "C — Lisa: I once got stuck in a narrow passage for twenty minutes. My friends stayed calm and helped me move my arms one by one. That day taught me that panic is more dangerous than the cave itself. I never go caving without two extra torches and plenty of water."], "ul": ["Which person… was afraid at the beginning? (A)", "…explains a safety rule about the team? (B)", "…had a frightening experience in a small space? (C)", "…is interested in wildlife? (B)", "…mentions extra equipment? (C)"]}, {"h": "Safe or unsafe?", "p": ["Adventure hobbies can be great fun if you follow the rules. Discuss each situation: is it safe or dangerous? Why?"], "ul": ["Going into a cave alone without telling anyone — dangerous", "Taking a trained guide and a helmet with a headlamp — safe", "Exploring a cave after heavy rain (it may flood) — dangerous", "Carrying spare batteries and water — safe", "Ignoring signs that say ‘No entry’ — dangerous", "Useful language: It's risky to… / You must always… / You shouldn't…"]}], "f": "Some cave animals, like the olm salamander in Slovenia, live in total darkness and have no working eyes.", "pr": ["Workbook pp. 46-47 (Reading) and read the Exam Reminder.", "Write 5 safety rules for a beginner caver, climber or kayaker (choose one). Use must, mustn't, should."], "q": ["What is non-linear reading?", "Why do you read the questions first in a matching task?", "Why is it important that someone outside knows when cavers return?", "Which adventure hobby would you try, and how would you stay safe?"], "qz": [{"q": "In a multiple-matching task, you should first…", "o": ["read the questions and underline key words", "read the text slowly twice", "translate the whole text", "guess all answers"], "a": 0, "why": "Key words tell you what to look for in the text."}, {"q": "In the practice text, who was afraid at first?", "o": ["nobody", "Ihor", "Lisa", "Marta"], "a": 3, "why": "Marta says she was terrified of the dark."}, {"q": "Who is interested in the science of caves?", "o": ["Marta", "Ihor", "Lisa", "all of them"], "a": 1, "why": "Ihor photographs animals and talks about science."}, {"q": "‘Scan’ a text means…", "o": ["look quickly for specific information", "read every word carefully", "write a summary", "read aloud"], "a": 0, "why": "Scanning is fast searching for details."}, {"q": "According to Lisa, what is more dangerous than the cave?", "o": ["the cold", "animals", "panic", "water"], "a": 2, "why": "She says panic is more dangerous than the cave itself."}, {"q": "Which situation is safe?", "o": ["caving alone", "going with a trained guide and a helmet", "exploring after heavy rain", "ignoring warning signs"], "a": 1, "why": "A guide and proper equipment reduce the risk."}, {"q": "In matching tasks, one section of text…", "o": ["must be skipped", "is always used only once", "never contains the answer", "can match more than one question"], "a": 3, "why": "Usually a section can be the answer to several questions."}]}, {"n": "83", "t": "Vocabulary: free-time activities and equipment", "g": "You will use words and collocations for hobbies, sports and equipment and describe safe and dangerous activities.", "k": "Unit 8 · My own time · Vocabulary · SB p.92", "terms": [["take up", "почати займатися (хобі)"], ["equipment", "спорядження"], ["injury", "травма"], ["beginner", "початківець"], ["challenging", "складний, вимогливий"], ["rewarding", "той, що приносить задоволення"]], "th": [{"h": "Play, go or do?", "p": ["In English, different activities take different verbs. This is a common source of mistakes."], "ul": ["play + ball games and games: play football, play chess, play video games", "go + -ing activities: go swimming, go climbing, go skateboarding, go camping", "do + individual activities and martial arts: do yoga, do karate, do gymnastics, do a puzzle", "✗ do swimming → ✓ go swimming", "✗ play karate → ✓ do karate"]}, {"h": "Equipment and places", "p": ["Each activity needs its own equipment and place."], "ul": ["helmet — шолом; knee pads — наколінники", "life jacket — рятувальний жилет", "rope — мотузка; harness — страхувальна система", "racket — ракетка; net — сітка", "court — корт (tennis court); pitch — поле (football pitch)", "rink — ковзанка; track — бігова доріжка; slope — схил", "skate park — скейт-парк"]}, {"h": "Describing hobbies and risks", "p": ["Use adjectives and phrases to give your opinion about an activity."], "ul": ["relaxing — розслаблюючий; challenging — складний", "rewarding — що дає задоволення; addictive — що затягує", "take up a hobby — почати хобі; give up a hobby — кинути", "be good at / be keen on / be into — вміти / захоплюватися", "get injured — травмуватися; break a leg — зламати ногу", "It's safe as long as you wear a helmet.", "Beginners should always train with an instructor."]}], "f": "", "pr": ["Workbook p. 47, Vocabulary 1.", "Describe your favourite free-time activity in 80 words: what you do, where, what equipment you need and how you stay safe."], "q": ["Do we say ‘play yoga’ or ‘do yoga’?", "What equipment do you need for kayaking?", "What does ‘take up a hobby’ mean?", "Which hobby do you find rewarding and why?"], "qz": [{"q": "Every weekend we ___ climbing in the mountains.", "o": ["go", "do", "play", "make"], "a": 0, "why": "We use ‘go’ with -ing activities."}, {"q": "My sister ___ karate twice a week.", "o": ["plays", "goes", "does", "makes"], "a": 2, "why": "We use ‘do’ with martial arts."}, {"q": "You must wear a ___ when you go kayaking.", "o": ["racket", "life jacket", "net", "court"], "a": 1, "why": "A life jacket keeps you safe in water."}, {"q": "Tennis is played on a…", "o": ["pitch", "rink", "slope", "court"], "a": 3, "why": "Tennis court is the correct collocation."}, {"q": "I want to ___ photography this year. — I've never tried it.", "o": ["look up", "give up", "take up", "put up"], "a": 2, "why": "Take up = start a new hobby."}, {"q": "Learning the guitar is hard but very ___ — I feel proud when I play a song.", "o": ["rewarding", "boring", "dangerous", "cramped"], "a": 0, "why": "Rewarding means it gives you satisfaction."}, {"q": "He fell off his skateboard and ___ injured.", "o": ["did", "made", "went", "got"], "a": 3, "why": "The collocation is ‘get injured’."}]}, {"n": "84", "t": "Grammar: modals and semi-modals (ability, obligation, advice)", "g": "You will use modals and semi-modals to talk about ability, permission, obligation, prohibition, necessity and advice.", "k": "Unit 8 · My own time · Grammar · SB p.93", "terms": [["modal verb", "модальне дієслово"], ["semi-modal", "напівмодальне дієслово"], ["obligation", "обов'язок"], ["prohibition", "заборона"], ["permission", "дозвіл"], ["necessity", "необхідність"]], "th": [{"h": "Form", "p": ["Modal verbs (can, could, may, might, must, should, will, would) have the same form for all persons and are followed by the infinitive without ‘to’. Semi-modals (have to, need to, be able to, ought to, be allowed to) work like modals in meaning but change form: they take -s, past forms and auxiliaries."], "ul": ["✓ She can swim. ✗ She cans swim. ✗ She can to swim.", "Negative: You mustn't / shouldn't / can't go.", "Question: Can you ride a bike? / Must we wear helmets?", "Semi-modal: She has to train every day. Does she have to train?", "Past: I was able to climb the wall. / We had to wait."]}, {"h": "Ability and permission", "p": ["We use different forms for present, past and future."], "ul": ["Ability now: I can skate. / I'm able to skate.", "Past general ability: I could swim when I was five.", "Past single success: We were able to reach the top (✗ could reach).", "Future ability: I'll be able to dive next year (✗ will can).", "Permission: Can / May I use your racket? You're allowed to bring a friend.", "No permission: You can't / aren't allowed to swim here."]}, {"h": "Obligation, prohibition, necessity, advice", "p": ["Be careful: mustn't and don't have to mean very different things!"], "ul": ["must — strong obligation, often the speaker's opinion or rules: You must wear a helmet.", "have to — obligation from outside: I have to train at 7 a.m. (the coach says so).", "mustn't — prohibition (it's forbidden): You mustn't swim alone.", "don't have to / don't need to / needn't — no necessity: You don't have to bring a ball; we have one.", "should / ought to — advice: You should warm up before running.", "had better — strong advice with a warning: You'd better take a map or you'll get lost."]}, {"h": "Common mistakes", "p": ["Check your sentences for these typical errors."], "ul": ["✗ You mustn't pay; it's free. → ✓ You don't have to pay.", "✗ He must to go. → ✓ He must go.", "✗ I will can come. → ✓ I will be able to come.", "✗ Do you must…? → ✓ Must you…? / Do you have to…?", "Past of must (obligation) = had to: Yesterday I had to stay home."]}], "f": "", "pr": ["Workbook p. 48, Grammar 1.", "Write the rules of a sports club or a skate park: 8 sentences with must, have to, mustn't, don't have to, can, should, be allowed to."], "q": ["What is the difference between ‘mustn't’ and ‘don't have to’?", "What is the past form of ‘must’ (obligation)?", "Why can't we say ‘will can’?", "Which modal do we use for advice?"], "qz": [{"q": "You ___ swim here — it's dangerous and forbidden.", "o": ["don't have to", "can", "needn't", "mustn't"], "a": 3, "why": "Mustn't expresses prohibition."}, {"q": "You ___ bring a racket; we have spare ones.", "o": ["mustn't", "can't", "don't have to", "shouldn't to"], "a": 2, "why": "No necessity → don't have to."}, {"q": "After hours of climbing, we ___ reach the top.", "o": ["were able to", "could", "can", "must"], "a": 0, "why": "For one specific success in the past we use ‘was/were able to’."}, {"q": "Next year I ___ drive a car.", "o": ["will can", "could will", "can will", "will be able to"], "a": 3, "why": "The future of ‘can’ is ‘will be able to’."}, {"q": "Yesterday I ___ stay at home because of the rain.", "o": ["must", "had to", "have to", "musted"], "a": 1, "why": "The past of ‘must/have to’ is ‘had to’."}, {"q": "You look tired. You ___ go to bed earlier.", "o": ["should", "mustn't", "are able to", "don't have to"], "a": 0, "why": "Should gives advice."}, {"q": "Which sentence is correct?", "o": ["She must to train.", "She musts train.", "She has to train.", "She have to train."], "a": 2, "why": "Has to + infinitive without changes for she."}, {"q": "___ we allowed to take photos in the museum?", "o": ["Do", "Are", "Can", "Must"], "a": 1, "why": "The structure is ‘be allowed to’: Are we allowed to…?"}]}, {"n": "85", "t": "Listening and Speaking: discussing hobbies and safety", "g": "You will practise listening for gist and detail and discuss free-time activities with a partner, giving and supporting your opinions.", "k": "Unit 8 · My own time · Listening + Speaking · SB pp.94-95", "terms": [["gist", "загальний зміст"], ["specific information", "конкретна інформація"], ["suggest", "пропонувати"], ["compromise", "компроміс"], ["it's up to you", "вирішувати тобі"], ["on the other hand", "з іншого боку"]], "th": [{"h": "Listening strategies", "p": ["Some listening tasks test the gist (general idea), others test specific details like numbers, names or reasons. Know which one you need before you listen."], "ul": ["Gist: Who is speaking? Where are they? What is the main topic?", "Detail: listen for numbers, days, prices, names.", "Attitude: is the speaker excited, nervous, disappointed?", "Don't choose an answer just because you hear the same word.", "Pay attention to words like ‘but’, ‘actually’, ‘in fact’ — the answer often follows them."]}, {"h": "Useful phrases for a decision-making task", "p": ["In a paired speaking task you may need to discuss several options (for example, activities for a school club) and decide together."], "ul": ["Suggesting: Why don't we…? / How about…? / We could…", "Giving pros: The good thing about… is that… / It would be great for…", "Giving cons: On the other hand… / The problem with… is…", "Safety: Students would have to… / They'd need an instructor.", "Asking: What's your view? / Would you agree?", "Deciding: So, shall we choose…? / Let's go for… / OK, it's up to you."]}, {"h": "Model dialogue (original)", "p": ["Sofia: Our club wants a new weekend activity. How about rock climbing? Artem: It sounds exciting, but on the other hand it's quite risky. Beginners would have to train with an instructor. Sofia: That's true. What about kayaking? Artem: I like it, but everyone must be able to swim and wear a life jacket. Sofia: Hmm. Why don't we choose orienteering? It's active, cheap and safe, and we don't have to buy special equipment. Artem: Good idea! Shall we go for orienteering, then? Sofia: Yes, let's do it."], "ul": ["Notice the modals: would have to, must be able to, don't have to.", "Notice how they compare options before deciding.", "Both speakers ask and answer — take turns!"]}], "f": "", "pr": ["Workbook p. 48, Listening.", "Record a 1–2 minute monologue: ‘Choose one activity for your class trip and explain why it is the best and safest option.’"], "q": ["What is the difference between listening for gist and for detail?", "Why should you pay attention to ‘but’ and ‘actually’?", "Give three phrases for making suggestions.", "How do you reach a decision with a partner?"], "qz": [{"q": "Listening for gist means listening for…", "o": ["every word", "spelling", "only numbers", "the general idea"], "a": 3, "why": "Gist is the main or general meaning."}, {"q": "A speaker says: ‘I thought it was Monday, but actually the class is on Tuesday.’ When is the class?", "o": ["Monday", "Tuesday", "Wednesday", "every day"], "a": 1, "why": "The correct information comes after ‘actually’."}, {"q": "Which phrase makes a suggestion?", "o": ["Why don't we try climbing?", "I'm not sure.", "On the other hand…", "It was boring."], "a": 0, "why": "‘Why don't we…?’ suggests an idea."}, {"q": "Which phrase introduces a disadvantage?", "o": ["The good thing is…", "Let's go for it.", "The problem with it is…", "How about…?"], "a": 2, "why": "It points out a negative side."}, {"q": "In the model dialogue, why did they choose orienteering?", "o": ["It is dangerous.", "It is active, cheap and safe.", "It needs an instructor.", "They can swim."], "a": 1, "why": "Sofia lists these reasons."}, {"q": "Everyone ___ wear a life jacket on the river.", "o": ["needn't", "doesn't have to", "mustn't", "must"], "a": 3, "why": "A safety rule = strong obligation."}, {"q": "In a paired task you should…", "o": ["talk alone all the time", "stay silent", "take turns and ask your partner's opinion", "read a prepared text"], "a": 2, "why": "Interaction with your partner is assessed."}]}, {"n": "86", "t": "Vocabulary: phrasal verbs for free time", "g": "You will understand and use common phrasal verbs about hobbies, plans and free time.", "k": "Unit 8 · My own time · Vocabulary · SB p.96", "terms": [["phrasal verb", "фразове дієслово"], ["particle", "частка (прийменник/прислівник у фразовому дієслові)"], ["hang out", "проводити час, тусуватися"], ["take up", "почати займатися"], ["give up", "кинути, припинити"], ["look forward to", "з нетерпінням чекати"]], "th": [{"h": "What are phrasal verbs?", "p": ["A phrasal verb is a verb + a particle (up, out, on, off, down…). The meaning is often different from the meaning of the verb alone, so learn them as new words with examples."], "ul": ["give — давати; give up — кинути (I gave up football.)", "look — дивитися; look after — доглядати", "Some phrasal verbs can be separated: put on your helmet / put your helmet on / put it on (✗ put on it)", "Some cannot: look after my brother (✗ look my brother after)", "After ‘look forward to’ use -ing: I'm looking forward to seeing you."]}, {"h": "Phrasal verbs for free time", "p": ["These are useful when you talk about hobbies and plans."], "ul": ["take up — почати (хобі): I took up chess last year.", "give up — кинути: Don't give up the piano!", "hang out (with) — проводити час (з): I hang out with friends at weekends.", "join in — приєднатися: Everyone joined in the game.", "sign up (for) — записатися: She signed up for a dance class.", "work out — тренуватися: He works out at the gym.", "chill out — відпочивати, розслаблятися", "carry on — продовжувати: Carry on practising!"]}, {"h": "Phrasal verbs for plans and safety", "p": ["Use them in conversations and in your writing."], "ul": ["set off — вирушати: We set off early to avoid the heat.", "turn back — повернути назад: The weather was bad, so we turned back.", "call off — скасувати: The match was called off because of the storm.", "put off — відкласти: Don't put off your training.", "look out — обережно!: Look out! There's a car!", "warm up — розминатися: Always warm up before you run.", "fall over — впасти: He fell over and hurt his knee."]}], "f": "", "pr": ["Workbook p. 49, Vocabulary 2.", "Write a short text (70–90 words) about your weekend using at least 7 phrasal verbs from the lesson. Underline them."], "q": ["What is a phrasal verb?", "Can you say ‘put on it’? Why not?", "What form of the verb follows ‘look forward to’?", "Which phrasal verbs help you talk about safety?"], "qz": [{"q": "The football match was ___ because of the heavy rain.", "o": ["worked out", "set off", "called off", "joined in"], "a": 2, "why": "Call off = cancel."}, {"q": "I ___ the guitar when I was twelve and I still play.", "o": ["gave up", "took up", "fell over", "turned back"], "a": 1, "why": "Take up = start a new hobby."}, {"q": "Always ___ before you start running.", "o": ["put off", "hang out", "call off", "warm up"], "a": 3, "why": "Warm up = do light exercise to prepare."}, {"q": "Choose the correct sentence.", "o": ["Put on it.", "Put on.", "Put it on.", "On put it."], "a": 2, "why": "With pronouns, separable phrasal verbs need the pronoun in the middle."}, {"q": "I'm looking forward to ___ you at the camp.", "o": ["seeing", "see", "saw", "to see"], "a": 0, "why": "‘To’ here is a preposition, so it is followed by -ing."}, {"q": "On Saturdays I usually ___ with my friends in the park.", "o": ["sign off", "set off", "give up", "hang out"], "a": 3, "why": "Hang out = spend free time together."}, {"q": "The fog was very thick, so the climbers decided to ___.", "o": ["take up", "turn back", "join in", "work out"], "a": 1, "why": "Turn back = return the way you came."}]}, {"n": "87", "t": "Grammar: modals and semi-modals (deduction and past modals)", "g": "You will use modals to make deductions about the present and the past and to talk about past advice and necessity.", "k": "Unit 8 · My own time · Grammar · SB p.97", "terms": [["deduction", "припущення, висновок"], ["certainty", "впевненість"], ["possibility", "можливість"], ["perfect modal", "модальне дієслово + have + V3"], ["regret", "жаль, шкодувати"]], "th": [{"h": "Deduction about the present", "p": ["We use modals to show how sure we are about something now. Form: modal + infinitive (or + be + -ing for actions in progress)."], "ul": ["must — I'm sure it's true: She must be tired; she's been training all day.", "can't — I'm sure it's not true: That can't be Oleh; he's in Kyiv.", "might / may / could — it's possible: He might be at the skate park.", "Action in progress: They must be playing chess now.", "✗ mustn't be for deduction → ✓ can't be"]}, {"h": "Deduction about the past", "p": ["Form: modal + have + past participle."], "ul": ["must have — I'm sure it happened: The ground is wet. It must have rained.", "can't / couldn't have — I'm sure it didn't happen: He can't have climbed that wall alone; it's too high.", "might / may / could have — perhaps it happened: She might have forgotten her helmet.", "Continuous: They must have been practising for months.", "Pronunciation: must've, might've, can't've (spoken)"]}, {"h": "Past advice, criticism and necessity", "p": ["We also use perfect modals to talk about things that were (or weren't) right to do in the past."], "ul": ["should have / ought to have — it was a good idea, but you didn't do it: You should have warned us about the rocks.", "shouldn't have — it was a bad idea, but you did it: I shouldn't have gone swimming alone.", "needn't have — you did it, but it wasn't necessary: We needn't have brought food; there was a café.", "didn't need to / didn't have to — it wasn't necessary (maybe we didn't do it): We didn't have to pay, so we didn't.", "could have — a possibility that didn't happen: You could have hurt yourself!"]}, {"h": "Common mistakes", "p": ["Watch out for these errors in tests."], "ul": ["✗ He must have went. → ✓ He must have gone.", "✗ She mustn't have seen us. → ✓ She can't have seen us.", "✗ You should went earlier. → ✓ You should have gone earlier.", "✗ I should of called. → ✓ I should have called.", "Remember: have + past participle (V3), never past simple."]}], "f": "", "pr": ["Workbook p. 50, Grammar 2.", "Look at a photo of people doing a hobby (from a magazine or your family album). Write 6 deductions: 3 about the present (must / might / can't be) and 3 about the past (must / might / can't have)."], "q": ["How do you form a past deduction?", "Which modal shows you are sure something is NOT true?", "What is the difference between ‘needn't have done’ and ‘didn't need to do’?", "Correct this sentence: ‘You should went to bed earlier.’"], "qz": [{"q": "Anna has been running for two hours. She ___ be exhausted.", "o": ["mustn't", "can't", "must", "needn't"], "a": 2, "why": "We are sure, so we use ‘must’."}, {"q": "That ___ be Max's bike — his is red, and this one is blue.", "o": ["can't", "might", "must", "should"], "a": 0, "why": "We are sure it isn't true, so ‘can't’."}, {"q": "The streets are wet. It ___ in the night.", "o": ["must rain", "can't have rained", "must rained", "must have rained"], "a": 3, "why": "Past deduction: must + have + V3."}, {"q": "I'm not sure where Ira is. She ___ gone to the gym.", "o": ["must", "might have", "can't", "should"], "a": 1, "why": "Possibility in the past: might have + V3."}, {"q": "I got lost. I ___ a map with me.", "o": ["should have taken", "should take", "must have took", "needn't have taken"], "a": 0, "why": "Past advice about something you didn't do: should have + V3."}, {"q": "We ___ cooked so much food — only three people came.", "o": ["can't have", "must have", "needn't have", "might"], "a": 2, "why": "We did it, but it wasn't necessary."}, {"q": "Which sentence is correct?", "o": ["He must have went home.", "He must have gone home.", "He must had gone home.", "He must of gone home."], "a": 1, "why": "Must + have + past participle (gone)."}, {"q": "You ___ hurt yourself! Never jump from that rock again.", "o": ["must", "can't have", "needn't have", "could have"], "a": 3, "why": "‘Could have’ shows a possibility that didn't happen."}]}, {"n": "88", "t": "Writing: an article about free time", "g": "You will plan and write a magazine article about a free-time activity, using linking words, extra details and set phrases.", "k": "Unit 8 · My own time · Writing · SB pp.98-99", "terms": [["article", "стаття"], ["headline", "заголовок"], ["reader", "читач"], ["linking words", "слова-зв'язки"], ["rhetorical question", "риторичне питання"], ["engaging", "цікавий, захопливий"]], "th": [{"h": "What makes a good article?", "p": ["An article is written for a magazine, website or school newspaper. It should be interesting, informative and talk directly to the reader. The style can be neutral or semi-formal, but lively."], "ul": ["Catchy title (headline): Why Everyone Should Try Orienteering", "Opening that grabs attention: a question, a surprising fact or a short story", "Paragraph 2–3: main ideas with details and examples", "Final paragraph: your opinion or advice to the reader", "Address the reader: you, Have you ever…?", "Length in exam: about 120–180 words"]}, {"h": "Linking words and adding detail", "p": ["Linking words connect ideas; details make an article vivid. Instead of ‘Climbing is good’, write ‘Climbing makes your arms stronger and teaches you to stay calm under pressure’."], "ul": ["Adding: also, in addition, what is more, besides", "Contrast: however, although, on the other hand, but", "Reason / result: because, since, so, as a result, that's why", "Examples: for example, for instance, such as, like", "Order: first of all, then, finally", "Set phrases: Believe it or not… / The best thing about… is… / Why not give it a try?"]}, {"h": "Model article (original)", "p": ["Bored at the weekend? Try Board Games! Have you ever spent a whole Saturday staring at your phone? Believe it or not, there is a better way to have fun: board games. Board games are not just for little kids. In fact, many teenagers play strategy games such as chess or games where you build cities and trade resources.", "What is more, they are good for you. You have to think ahead, make plans and talk to people face to face. On the other hand, some games take hours, so start early! The best thing about board games is that everyone can join in. So why not invite a few friends, switch off your phones and give it a try?"], "ul": ["Notice: question in the headline and opening.", "Linking words: In fact, What is more, On the other hand, So.", "The writer speaks directly to the reader: you, why not…?"]}, {"h": "Checklist", "p": ["Read your article again before you hand it in."], "ul": ["Does it have a catchy title?", "Does the opening grab the reader's attention?", "Did I use paragraphs, each with one main idea?", "Did I use at least 5 different linking words?", "Did I add details and examples?", "Did I mention safety if the activity is risky?", "Is there a strong ending with advice or a question?"]}], "f": "", "pr": ["Workbook p. 51, Writing; read the Writing Reference for articles.", "Write an article (120–180 words) for a school magazine: ‘An activity every teenager should try’. Include a safety tip."], "q": ["How can you start an article in an interesting way?", "Name four linking words for adding and contrasting ideas.", "How is an article different from a story?", "Why do writers use rhetorical questions?"], "qz": [{"q": "Which is the best headline for a school magazine article?", "o": ["My text", "Why Skateboarding Is More Than a Hobby", "Article number 3", "I wrote about sport"], "a": 1, "why": "A good headline is catchy and shows the topic."}, {"q": "Which linking word shows contrast?", "o": ["However", "What is more", "For example", "Finally"], "a": 0, "why": "However introduces an opposite idea."}, {"q": "Have you ever tried yoga? This is an example of…", "o": ["a conclusion", "a headline", "a rhetorical question", "a quotation"], "a": 2, "why": "It's a question to involve the reader, not to get an answer."}, {"q": "Choose the sentence with the best detail.", "o": ["Swimming is good.", "Swimming strengthens your whole body and helps you relax after school.", "Swimming is nice and good.", "Swimming is a sport."], "a": 1, "why": "It gives specific reasons and details."}, {"q": "Which phrase is a good ending for an article?", "o": ["Once upon a time…", "Dear Sir or Madam,", "Yours faithfully,", "Why not give it a try?"], "a": 3, "why": "It gives the reader advice and ends with a call to action."}, {"q": "Swimming is fun. ___, it keeps you fit.", "o": ["However", "Although", "In addition", "Because"], "a": 2, "why": "‘In addition’ adds a second positive idea."}, {"q": "An article usually…", "o": ["talks directly to the reader", "starts with ‘Dear Mr Smith’", "has no paragraphs", "is written in a very formal style only"], "a": 0, "why": "Articles address the reader to keep them interested."}]}, {"n": "89", "t": "Video: The tables — habits, free time and health", "g": "You will prepare for and reflect on the video «The tables», take notes, summarise what you saw and heard, and discuss how habits affect health.", "k": "Unit 8 · My own time · Video · SB p.100", "terms": [["take notes", "робити нотатки"], ["summarise", "підсумовувати"], ["habit", "звичка"], ["screen time", "час перед екраном"], ["well-being", "благополуччя"], ["sedentary", "сидячий (спосіб життя)"]], "th": [{"h": "Before you watch", "p": ["The video for this lesson is called «The tables». Before watching, look at the title and predict: what could a video about tables have to do with free time and habits? Think of the tables in your life — the dinner table, your desk, a game table in a café.", "Predicting helps you follow the video and notice the key ideas."], "ul": ["What do you do at a table every day?", "Do you eat with your family at the table? How often?", "How many hours a day do you sit?", "What games or hobbies need a table?", "Write down 3 predictions before watching."]}, {"h": "How to take notes and summarise", "p": ["You don't need to write full sentences while watching. Write key words, numbers and names. After watching, turn your notes into a short summary of 3–5 sentences."], "ul": ["Use abbreviations: e.g., ppl (people), w/ (with), → (leads to)", "Write only key words: who, where, what, why", "Leave space and add details after watching", "Summary: start with the main idea (The video is about…)", "Then add 2–3 important details", "End with your opinion (I found it… because…)"]}, {"h": "Habits and health: discussion", "p": ["Our daily habits — how long we sit, whether we eat together, how much time we spend on screens — affect our body and mood. Use the vocabulary of Units 7 and 8 to discuss these questions with a partner or in writing."], "ul": ["Why is sharing a meal at the table important for families and friends?", "What are the risks of a sedentary lifestyle?", "How can you balance screen time and active free time?", "Which healthy habit would you like to start? You should… / I'd better…", "Useful language: I noticed that… / The main message is… / It made me think about…"]}], "f": "", "pr": ["Review the Student Resources Unit 7 and Unit 8 Wordlists and write 10 words you now use confidently and 5 you still find difficult.", "Write a summary (60–80 words) of the video «The tables» from your notes, with one sentence about your opinion."], "q": ["What should you do before watching a video?", "How do you turn notes into a summary?", "What does ‘sedentary’ mean?", "Which habit affects your well-being most?"], "qz": [{"q": "When taking notes during a video, you should write…", "o": ["every word", "only key words and numbers", "nothing", "full paragraphs"], "a": 1, "why": "Key words are fast to write and enough to remember the ideas."}, {"q": "A summary should start with…", "o": ["your name", "a small detail", "a list of words", "the main idea"], "a": 3, "why": "First state what the video is mainly about."}, {"q": "‘Sedentary’ lifestyle means…", "o": ["a very active life", "a life by the sea", "a life with a lot of sitting", "a busy social life"], "a": 2, "why": "Sedentary means involving a lot of sitting."}, {"q": "Which phrase is useful for giving your reaction to a video?", "o": ["It made me think about…", "Dear Sir,", "Once upon a time…", "Who did you call?"], "a": 0, "why": "It shows your personal response."}, {"q": "Why do we make predictions before watching?", "o": ["to finish faster", "to copy answers", "to avoid listening", "to follow the video and notice key ideas"], "a": 3, "why": "Predictions prepare your mind for the content."}, {"q": "You spend too much time on your phone. You ___ go for a walk.", "o": ["mustn't", "should", "can't have", "needn't have"], "a": 1, "why": "‘Should’ gives advice."}, {"q": "‘Well-being’ means…", "o": ["feeling healthy and happy", "being rich", "being on holiday", "a kind of table"], "a": 0, "why": "Well-being is a state of being healthy and content."}]}, {"n": "90", "t": "Revision: Unit 8 vocabulary and grammar", "g": "You will review Unit 8 vocabulary (free time, equipment, phrasal verbs) and grammar (modals and semi-modals for the present and the past).", "k": "Unit 8 · My own time · End-of-Unit Revision", "terms": [["revision", "повторення"], ["modal verb", "модальне дієслово"], ["phrasal verb", "фразове дієслово"], ["deduction", "припущення"], ["obligation", "обов'язок"]], "th": [{"h": "Vocabulary summary", "p": ["Check that you can translate and use these words in a sentence."], "ul": ["Hobbies: rock climbing, caving, kayaking, photography, board games, orienteering", "play / go / do: play chess, go climbing, do yoga", "Equipment and places: helmet, life jacket, harness, racket, court, pitch, rink, slope", "Adjectives: challenging, rewarding, relaxing, addictive, risky", "Phrasal verbs: take up, give up, hang out, sign up, call off, set off, turn back, warm up", "Health: habit, well-being, sedentary, screen time"]}, {"h": "Grammar summary 1: ability, obligation, advice", "p": ["Modals + infinitive without to; semi-modals change form."], "ul": ["Ability: can / could / be able to — We were able to finish the route.", "Obligation: must / have to — You have to wear a helmet.", "Prohibition: mustn't — You mustn't swim here.", "No necessity: don't have to / needn't — You don't have to pay.", "Advice: should / ought to / had better — You'd better warm up."]}, {"h": "Grammar summary 2: deduction and past modals", "p": ["Present: modal + infinitive. Past: modal + have + V3."], "ul": ["She must be at training. / He can't be home yet.", "They might have missed the bus.", "It can't have been easy to climb in the rain.", "You should have told me. / I shouldn't have given up.", "We needn't have taken umbrellas — it was sunny."]}], "f": "", "pr": ["Workbook p. 83, Review Unit 8.", "Write 8 sentences about your free time: 4 with present modals and 4 with past modals (must have, should have, might have, needn't have)."], "q": ["When do we use ‘go’ with sports?", "What is the difference between ‘mustn't’ and ‘don't have to’?", "How do you form a past deduction?", "Name five phrasal verbs from Unit 8 and their meanings."], "qz": [{"q": "I ___ yoga every morning.", "o": ["do", "go", "play", "make"], "a": 0, "why": "We say ‘do yoga’."}, {"q": "You ___ bring water — there's a fountain in the park.", "o": ["mustn't", "shouldn't have", "can't", "don't have to"], "a": 3, "why": "It's not necessary, so ‘don't have to’."}, {"q": "He isn't answering. He ___ his phone at home.", "o": ["must leave", "might have left", "should leave", "can leave"], "a": 1, "why": "Possible past action: might have + V3."}, {"q": "The concert was ___ because the singer was ill.", "o": ["called off", "set off", "taken up", "warmed up"], "a": 0, "why": "Call off = cancel."}, {"q": "I failed the test. I ___ more.", "o": ["should study", "must have studied", "should have studied", "needn't have studied"], "a": 2, "why": "Regret about the past: should have + V3."}, {"q": "That ___ be Ivan — he's in Lviv this week.", "o": ["must", "can't", "might", "should"], "a": 1, "why": "Certain it's not true → can't."}, {"q": "Last year I ___ ski, but now I can.", "o": ["needn't", "can't", "mustn't", "couldn't"], "a": 3, "why": "Past ability (negative) → couldn't."}]}, {"n": "91", "t": "Progress Test: Units 7 and 8", "g": "You will show what you have learned in Units 7 and 8 and reflect on your skills and knowledge.", "k": "Unit 8 · My own time · Progress Test · Units 7&8", "terms": [["progress test", "контрольна робота (перевірка прогресу)"], ["self-assessment", "самооцінювання"], ["reflect", "рефлексувати, обмірковувати"], ["strengths", "сильні сторони"], ["weaknesses", "слабкі сторони"]], "th": [{"h": "What is tested?", "p": ["The progress test covers everything from Unit 7 (Have a great trip!) and Unit 8 (My own time). Revise both units before the test."], "ul": ["Vocabulary: travel, transport, accommodation, eco-tourism; hobbies, equipment, phrasal verbs", "Grammar: question tags; subject and object questions", "Grammar: past perfect simple and continuous", "Grammar: modals and semi-modals (ability, obligation, advice, deduction, past modals)", "Reading: opinion questions, multiple matching", "Listening: gist and specific information", "Writing: a story or an article"]}, {"h": "How to prepare", "p": ["Spread your revision over several days instead of studying everything the night before."], "ul": ["Read your notes and the Unit 7 and 8 revision lessons.", "Test yourself with flashcards for vocabulary and phrasal verbs.", "Write 3 sentences for each grammar point.", "Re-read your story and article and correct mistakes.", "In the test: read instructions carefully, do easy tasks first, check your answers at the end."]}, {"h": "Sample tasks (original)", "p": ["Try these before the test. 1) Complete the tag: They haven't left yet, ___? 2) Make a subject question: Somebody called the guide. → Who ___? 3) Past perfect: When we arrived, the ferry ___ (leave). 4) Choose: You (mustn't / don't have to) pay — it's free. 5) Deduction: The window is broken. Someone ___ (must / kick) a ball."], "ul": ["Answers: 1) have they", "2) Who called the guide?", "3) had left", "4) don't have to", "5) must have kicked", "Writing practice: write a 120-word story that ends ‘…and we never went camping without a map again.’"]}, {"h": "Self-assessment: reflect on your progress", "p": ["After the test, think honestly about what went well and what you need to practise more."], "ul": ["I can talk about travel and compare transport costs.", "I can use question tags and subject/object questions.", "I can tell a story using narrative tenses.", "I can talk about hobbies and safety with modals.", "I can write an article with linking words.", "My strengths are… / I need to practise… / My plan is…"]}], "f": "", "pr": ["Revise Units 7 and 8: do the sample tasks from this lesson and check your answers.", "After the test, write a short reflection (5–6 sentences): what was easy, what was difficult and what you will do to improve."], "q": ["Which grammar points from Units 7 and 8 do you find the easiest?", "Which topic do you need to revise more?", "What strategies will you use during the test?", "How will you check your writing before handing it in?"], "qz": [{"q": "They haven't left yet, ___?", "o": ["have they", "haven't they", "did they", "do they"], "a": 0, "why": "Negative sentence → positive tag with the same auxiliary."}, {"q": "Somebody called the guide. — ___ the guide?", "o": ["Who did call", "Whom called", "Who called", "Who did called"], "a": 2, "why": "Subject question — no ‘did’."}, {"q": "When we arrived at the port, the ferry ___.", "o": ["left", "had left", "has left", "leaves"], "a": 1, "why": "It left before our arrival."}, {"q": "You ___ pay for the museum — it's free on Sundays.", "o": ["mustn't", "had better", "can't", "don't have to"], "a": 3, "why": "No necessity → don't have to."}, {"q": "The window is broken. Someone ___ a ball.", "o": ["must kick", "should kick", "must have kicked", "can't kick"], "a": 2, "why": "Past deduction: must have + V3."}, {"q": "We stayed in a cheap ___ with shared rooms.", "o": ["hostel", "harness", "fare", "court"], "a": 0, "why": "A hostel has cheap shared rooms."}, {"q": "She ___ chess last year and now she plays every day.", "o": ["gave up", "set off", "called off", "took up"], "a": 3, "why": "Take up = start a hobby."}, {"q": "Which is the best strategy during a test?", "o": ["start with the hardest task and panic", "read instructions carefully and check answers at the end", "leave all answers blank", "write only in pencil"], "a": 1, "why": "Careful reading and checking reduce mistakes."}]}]}, {"name": "Unit 9. Digital world (Цифровий світ)", "lessons": [{"n": "92", "t": "Unit Opener: digital world – computers and technology", "g": "You will talk about the good and bad sides of modern inventions and learn key words about computers and technology.", "k": "Unit 9 · Digital world · Unit Opener + Vocabulary for Reading · SB pp.101-102", "terms": [["device", "пристрій"], ["invention", "винахід"], ["screen", "екран"], ["to download", "завантажувати"], ["drone", "дрон, безпілотник"], ["advantage / disadvantage", "перевага / недолік"]], "th": [{"h": "Welcome to Unit 9: Digital world", "p": ["Technology is everywhere: in our pockets, our schools and even in the sky. In this unit you will read about drones and satellites, learn words about computers, use the passive voice and write an essay about technology.", "Start by thinking about your own day. How many devices do you use from morning to night? Which of them could you live without?"], "ul": ["How many hours a day do you spend in front of a screen?", "Which invention has changed our lives the most: the smartphone, the internet or the computer?", "What are the positive and negative effects of technology on our health?", "Could you live without the internet for a week? Why / why not?", "Is technology making people more or less sociable?"]}, {"h": "Key vocabulary: computers and technology", "p": ["Learn these words before reading. Say each word aloud and write your own example sentence for at least five of them."], "ul": ["device — пристрій (My phone is my most useful device.)", "gadget — гаджет, пристосування", "software — програмне забезпечення", "hardware — апаратне забезпечення, «залізо»", "to install — встановлювати (Install the app first.)", "to upload / to download — завантажувати на сервер / завантажувати з мережі", "satellite — супутник (The photo was taken by a satellite.)", "drone — дрон (A drone can fly over places people can't reach.)"]}, {"h": "Talking about advantages and disadvantages", "p": ["When you discuss inventions, it is useful to look at both sides. Use linking phrases to make your opinion clear and balanced."], "ul": ["One advantage of … is that …", "The main drawback is that …", "On the one hand … ; on the other hand …", "It saves time / money / energy.", "It can be harmful to our eyes / sleep / posture.", "In my opinion, the benefits outweigh the risks."]}], "f": "The first computer mouse, built by Douglas Engelbart's team in the 1960s, was made of wood.", "pr": ["Study Student Resources Unit 9 Wordlist: copy 10 new words with translations and an example for each.", "Make a two-column table «Advantages / Disadvantages» for one invention (smartphone, internet, drone) with at least 4 points in each column."], "q": ["What is the difference between software and hardware?", "Name three devices you use every day.", "How can you start a sentence about a disadvantage?", "What can a drone do that a person can't?"], "qz": [{"q": "Which word means «програмне забезпечення»?", "o": ["hardware", "software", "gadget", "device"], "a": 1, "why": "Software is the programs that run on a computer."}, {"q": "I need to ___ this app before I can use it.", "o": ["install", "invent", "switch", "charge off"], "a": 0, "why": "You install an app to put it on your device."}, {"q": "A ___ travels around the Earth and sends back photos and signals.", "o": ["drone", "keyboard", "satellite", "router"], "a": 2, "why": "Satellites orbit the Earth in space."}, {"q": "Choose the best phrase to introduce a negative point.", "o": ["One advantage is that…", "The main drawback is that…", "It saves time…", "I totally agree…"], "a": 1, "why": "A drawback is a disadvantage."}, {"q": "To put a photo from your phone onto a website is to ___ it.", "o": ["download", "delete", "print", "upload"], "a": 3, "why": "Upload means send from your device to the internet."}, {"q": "Which sentence is about a health risk of technology?", "o": ["Video calls connect families.", "Looking at screens late at night can harm your sleep.", "Online maps save time.", "Drones deliver parcels."], "a": 1, "why": "Poor sleep is a health risk."}]}, {"n": "93", "t": "Reading: eyes in the sky – drones and satellites", "g": "You will read a text about technology that watches the Earth from above and practise finding subtopics and completing gaps.", "k": "Unit 9 · Digital world · Reading · SB pp.102-103", "terms": [["surveillance", "спостереження, нагляд"], ["to monitor", "відстежувати, контролювати"], ["privacy", "приватність"], ["remote area", "віддалена місцевість"], ["to collect data", "збирати дані"]], "th": [{"h": "Before you read", "p": ["The SB text is called «Eyes in the sky». Before reading, look at the title and pictures and predict: who or what are the «eyes»? Why might people need them?", "Then read the original text below. It is on a similar topic and helps you practise."], "ul": ["Read the title and guess the topic.", "Underline words you already know about technology.", "Ask yourself: is the text going to be positive, negative or balanced?", "Read once quickly for the main idea, then again for details."]}, {"h": "Practice text: Watching from above", "p": ["Every day, thousands of cameras look down at our planet. Some are on satellites hundreds of kilometres above us; others are on small drones flying just over the treetops. Scientists use them to monitor forests, count wild animals and measure ice in the Arctic. After floods or earthquakes, rescue teams send drones to find people in remote areas where cars cannot go. Farmers can check which parts of a field need water. However, not everyone is happy. Some people worry about privacy: if a drone can see a whale from the air, it can also see into your garden. Rules have been introduced in many countries to control where drones are allowed to fly. So, are the eyes in the sky our friends or our spies? The answer probably depends on who is using them and why."], "ul": ["Main idea: cameras in the sky are useful but raise privacy questions.", "Subtopic 1: science and nature", "Subtopic 2: rescue and farming", "Subtopic 3: privacy and rules"]}, {"h": "Exam tip: gapped text and subtopics", "p": ["In a gapped-text task, sentences or paragraphs are removed and you must put them back. Look at what comes before AND after each gap.", "Words like this, they, however, also and such help you link ideas together."], "ul": ["Read the whole text first without filling anything.", "Look for pronouns (it, they, this) – what do they refer to?", "Check linking words: However shows contrast, Also adds information.", "Make sure the tense and topic match the sentences around the gap.", "One option is usually extra – do not try to use every sentence.", "Read the completed text again to check it makes sense."]}], "f": "The first artificial satellite, Sputnik 1, was launched in 1957.", "pr": ["WB p. 52 – Exam Reminder.", "Write 5–6 sentences: Would you like to have a drone? What would you use it for and what rules would you follow?"], "q": ["What are three ways drones or satellites help people?", "Why do some people worry about cameras in the sky?", "What should you look at before and after a gap?", "What does the word «However» usually show?"], "qz": [{"q": "According to the practice text, how do drones help after floods?", "o": ["They take photos for tourists.", "They find people in remote areas.", "They repair roads.", "They deliver pizza."], "a": 1, "why": "The text says rescue teams send drones to find people."}, {"q": "What is the main worry about cameras in the sky?", "o": ["They are too expensive.", "They are too slow.", "Privacy", "Noise"], "a": 2, "why": "The text mentions people's worry about privacy."}, {"q": "The word «monitor» in the text is closest to…", "o": ["destroy", "build", "sell", "watch and check"], "a": 3, "why": "To monitor means to observe something over time."}, {"q": "In a gapped-text task you should first…", "o": ["read the whole text", "fill gap 1 immediately", "translate every word", "use all the options"], "a": 0, "why": "Understanding the whole text helps you choose correctly."}, {"q": "A sentence after a gap begins with «However,». The missing sentence most likely…", "o": ["repeats the same idea", "shows an idea that contrasts with what follows", "is a question", "has no connection"], "a": 1, "why": "However introduces a contrast with the previous idea."}, {"q": "«Remote area» means…", "o": ["a busy city centre", "a place far from towns", "a shopping centre", "a school yard"], "a": 1, "why": "Remote means far away and hard to reach."}]}, {"n": "94", "t": "Vocabulary: computers and technology – collocations and word formation", "g": "You will use words and collocations about computers and technology correctly in sentences.", "k": "Unit 9 · Digital world · Vocabulary · SB p.104", "terms": [["to log in / log out", "увійти / вийти з облікового запису"], ["password", "пароль"], ["to charge", "заряджати"], ["to back up", "робити резервну копію"], ["virus", "вірус"], ["wireless", "бездротовий"]], "th": [{"h": "Verb + noun collocations", "p": ["Many technology words are used together in fixed pairs. Learn them as one chunk: not «make a password» but «create a password»."], "ul": ["create / change a password — створити / змінити пароль", "charge your phone — заряджати телефон", "back up your files — зберігати резервну копію файлів", "log in to your account — увійти в обліковий запис", "send / receive a message — надіслати / отримати повідомлення", "search the internet — шукати в інтернеті", "click on a link — натиснути на посилання", "switch on / off a device — увімкнути / вимкнути пристрій"]}, {"h": "Word formation", "p": ["You can make new words from one root. This is useful for exam tasks where you must change a word to fit a gap."], "ul": ["invent → inventor → invention → inventive", "technology → technological", "connect → connection → connected", "digit → digital", "rely → reliable → unreliable", "use → useful → useless → user"]}, {"h": "Using the words", "p": ["Read these example sentences and notice how the words work. Then make your own sentences about your devices."], "ul": ["I always back up my homework files on a memory stick.", "My laptop is not very reliable – it often freezes.", "Never click on a link from someone you don't know.", "The school has a wireless connection in every classroom.", "She is a famous inventor of medical devices."]}], "f": "The word «bug» for a computer problem became popular after Grace Hopper's team found a real moth inside the Harvard Mark II computer in 1947.", "pr": ["WB p. 53 – Vocabulary 1.", "Write 6 sentences about how you use technology, each with a different collocation from the lesson."], "q": ["Which verb goes with «password»?", "What is the adjective from «technology»?", "What does «back up your files» mean?", "Give the opposite of «reliable»."], "qz": [{"q": "Don't forget to ___ your phone before the trip.", "o": ["load", "fill", "charge", "power"], "a": 2, "why": "We say charge your phone."}, {"q": "Choose the correct collocation.", "o": ["make a password", "create a password", "do a password", "build a password"], "a": 1, "why": "Create a password is the natural collocation."}, {"q": "The person who invents something is an…", "o": ["invention", "inventive", "inventing", "inventor"], "a": 3, "why": "-or ending often shows a person."}, {"q": "My old printer is ___; it never works when I need it.", "o": ["unreliable", "reliable", "reliability", "rely"], "a": 0, "why": "Un- makes the negative adjective."}, {"q": "«To log out» means…", "o": ["to start a computer", "to leave your account", "to buy software", "to break a device"], "a": 1, "why": "Log out = finish using your account."}, {"q": "We live in a ___ age – almost everything is online.", "o": ["digit", "digitally", "digital", "digits"], "a": 2, "why": "An adjective is needed before the noun age."}]}, {"n": "95", "t": "Grammar: the passive; passive with modals; by and with", "g": "You will form and use passive sentences in present and past simple, with modal verbs, and choose between by and with.", "k": "Unit 9 · Digital world · Grammar · SB p.105", "terms": [["the passive voice", "пасивний стан"], ["active voice", "активний стан"], ["past participle", "дієприкметник минулого часу (3-тя форма)"], ["agent", "виконавець дії"], ["modal verb", "модальне дієслово"]], "th": [{"h": "Form and use of the passive", "p": ["We use the passive when the action is more important than who does it, or when we don't know who does it. Form: be (in the right tense) + past participle.", "Active: Engineers build drones. → Passive: Drones are built (by engineers)."], "ul": ["Present simple: Millions of emails are sent every second.", "Past simple: The first website was created in 1991.", "Negative: The data isn't stored on my phone. / The photos weren't deleted.", "Question: Is this app used in your school? / When was the telephone invented?", "Only the object of an active sentence can become the subject of a passive one.", "Common mistake: ✗ The phone was broke. ✓ The phone was broken."]}, {"h": "Passive with modal verbs", "p": ["After modals (can, could, must, should, may, might, will, have to) we use be + past participle. The modal itself does not change."], "ul": ["modal + be + past participle", "Phones must be switched off during the test.", "This problem can be solved in five minutes.", "Passwords should be changed regularly.", "The game will be released next month.", "Negative: Files mustn't be shared without permission.", "Question: Can this laptop be repaired?"]}, {"h": "by or with?", "p": ["Use by to say who or what does the action (the agent). Use with to talk about the tool, instrument or material used.", "Often we leave out the agent completely if it is obvious or unimportant: The bridge was built in 2010 (by builders – obvious)."], "ul": ["The photo was taken by a drone. (who/what did it)", "The photo was taken with a special camera. (tool)", "The program was written by a 15-year-old student.", "The screen was cleaned with a soft cloth.", "The cake was made with chocolate. (material)", "Don't use by people / by someone – just leave it out."]}], "f": "", "pr": ["WB p. 54 – Grammar 1.", "Write 6 passive sentences about rules in your school or home with modals (must, should, can't be…), e.g. Phones must be kept in bags."], "q": ["How do we form the passive?", "When do we leave out the agent?", "What is the form of a passive sentence with a modal?", "What is the difference between by and with?"], "qz": [{"q": "The first smartphone ___ in the 1990s.", "o": ["was invented", "invented", "is invent", "were invented"], "a": 0, "why": "Past simple passive, singular subject: was + past participle."}, {"q": "Homework ___ on the School Today platform every day.", "o": ["posts", "is posted", "are posted", "posted"], "a": 1, "why": "Present simple passive with a singular/uncountable subject."}, {"q": "Your password should ___ every few months.", "o": ["change", "be changing", "been changed", "be changed"], "a": 3, "why": "Modal + be + past participle."}, {"q": "The letter was written ___ a pencil.", "o": ["by", "from", "with", "of"], "a": 2, "why": "With is for the tool used."}, {"q": "The song was written ___ a famous Ukrainian singer.", "o": ["with", "by", "from", "at"], "a": 1, "why": "By introduces the agent (the person w
