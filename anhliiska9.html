t tenses", "p": ["Only the verb have/get changes. The object and the past participle stay the same."], "ul": ["Present simple: I have my hair cut once a month.", "Present continuous: I am having my hair cut.", "Past simple: I had my hair cut yesterday.", "Present perfect: I have just had my hair cut.", "Future (will): I will have my hair cut next week.", "be going to: I'm going to have my hair cut.", "Modal: You should have your hair cut."]}, {"h": "Negatives and questions", "p": ["Make negatives and questions with the auxiliary verb, just like with the main verb have."], "ul": ["I didn't have my car washed last week.", "She doesn't have her nails done at a salon.", "Did you have your bike repaired?", "Where do you have your hair cut?", "When are you going to have your room decorated?", "Has he had his laptop fixed yet?"]}, {"h": "Common mistakes", "p": ["Remember the word order: object first, then the past participle. And use the third form of the verb, not the infinitive."], "ul": ["✗ I had cut my hair. → ✓ I had my hair cut. (if someone else did it)", "✗ I had my car repair. → ✓ I had my car repaired.", "✗ She has done her nails. → ✓ She has had her nails done. (at a salon)", "✗ We got painted our house. → ✓ We got our house painted.", "Irregular past participles: cut — cut, take — taken, make — made, do — done."]}], "f": "", "pr": ["Workbook p. 66, Grammar 1.", "Write 6 sentences about services you or your family use (hairdresser, car repair, dentist, delivery…). Use the causative in at least three different tenses."], "q": ["What is the form of the causative?", "What is the difference between «I cleaned the windows» and «I had the windows cleaned»?", "Which verb can replace «have» in informal English?", "How do you make a question in the past simple with the causative?"], "qz": [{"q": "I don't cut my hair myself. I … at a hairdresser's.", "o": ["cut my hair", "have my hair cutting", "have my hair cut", "have cut my hair"], "a": 2, "why": "The causative is have + object + past participle."}, {"q": "We … our kitchen painted last week.", "o": ["having", "had", "has", "have"], "a": 1, "why": "«Last week» shows the past simple: had."}, {"q": "She … her photo taken at the moment.", "o": ["had", "has", "have", "is having"], "a": 3, "why": "«At the moment» needs the present continuous: is having."}, {"q": "Choose the correct question.", "o": ["Had you your bike repaired?", "Did you have your bike repaired?", "Did you had your bike repaired?", "Did you have repaired your bike?"], "a": 1, "why": "Past simple question: Did + subject + have + object + past participle."}, {"q": "I got my laptop … yesterday.", "o": ["fixing", "to fix", "fixed", "fix"], "a": 2, "why": "After get + object we use the past participle."}, {"q": "Which sentence means that someone else did the job?", "o": ["I washed my car.", "I had my car washed.", "I was washing my car.", "I have washed my car."], "a": 1, "why": "«Had my car washed» means another person washed it."}, {"q": "You look different! Have you … your hair dyed?", "o": ["has", "having", "have", "had"], "a": 3, "why": "Present perfect: have + had + object + past participle."}, {"q": "They … the windows cleaned tomorrow.", "o": ["had", "have had", "are having", "were having"], "a": 2, "why": "The present continuous is used for an arranged future action: are having."}]}, {"n": "117", "t": "Listening + Speaking: school and the future; discussing choices", "g": "You will practise listening for specific information and discuss school choices, giving reasons and asking questions.", "k": "Unit 11 · Life lessons · Listening + Speaking · SB pp.130-131", "terms": [["to justify", "обґрунтовувати"], ["to suggest", "пропонувати"], ["career", "кар'єра"], ["specific information", "конкретна інформація"], ["to make a decision", "ухвалювати рішення"]], "th": [{"h": "Listening strategies", "p": ["In exam listening tasks you often need to find specific information: names, numbers, reasons or opinions. You usually hear the recording twice. Use the first listening to get the general idea and the second one to check your answers."], "ul": ["Read the questions before you listen and underline key words.", "Predict the type of answer: a number, a place, a feeling?", "Listen for synonyms — the speaker may use different words.", "Be careful: speakers sometimes change their minds («Actually, no…»).", "Don't stop if you miss an answer — move on to the next question.", "Use the second listening to check and complete your answers."]}, {"h": "Useful phrases for discussion", "p": ["In the speaking task you discuss options with a partner and try to come to a decision. Give reasons for your ideas and ask your partner's opinion too."], "ul": ["Giving an opinion: I think… / In my view… / Personally, I believe…", "Justifying: …because… / The main reason is… / That's why…", "Asking for opinion: What do you think? / How about you? / Do you agree?", "Agreeing: That's a good point. / I couldn't agree more.", "Disagreeing politely: I see what you mean, but… / I'm not so sure.", "Suggesting: Why don't we…? / How about…? / What if…?", "Deciding: So, shall we choose…? / Let's go for…"]}, {"h": "Model dialogue", "p": ["Task: Your school wants to add one new course for 9th graders: first aid, cooking or personal finance. Discuss and decide.", "A: I think first aid is the most useful, because you can save someone's life. What do you think? B: That's a good point, but personal finance is important too. We'll all have to manage money one day. A: I see what you mean, but we can learn about money from our parents. B: Not everyone can. How about cooking? It's practical and fun. A: True, but I still think first aid is more important. B: OK, you've convinced me. Let's go for first aid."], "ul": ["Notice how the speakers give reasons.", "They ask each other questions.", "They disagree politely.", "They come to a decision at the end."]}], "f": "", "pr": ["Workbook p. 66, Listening.", "Record yourself (1–2 minutes) answering: Which new course would you add to your school and why? Use at least four phrases from the lesson."], "q": ["What should you do before the recording starts?", "Why should you listen for synonyms?", "Give two ways to disagree politely.", "How do you finish a discussion when you need to make a decision?"], "qz": [{"q": "What should you do before listening?", "o": ["Read the questions and underline key words", "Close your eyes", "Read the text aloud", "Write the answers randomly"], "a": 0, "why": "Reading the questions helps you know what to listen for."}, {"q": "Which phrase is used to justify an opinion?", "o": ["How about you?", "The main reason is…", "Let's go for…", "I'm not so sure."], "a": 1, "why": "«The main reason is…» gives a reason for your opinion."}, {"q": "Which phrase is a polite way to disagree?", "o": ["No way!", "You're wrong.", "That's stupid.", "I see what you mean, but…"], "a": 3, "why": "«I see what you mean, but…» shows respect before disagreeing."}, {"q": "Which phrase helps you make a suggestion?", "o": ["Why don't we…?", "I couldn't agree more.", "Personally, I believe…", "That's a good point."], "a": 0, "why": "«Why don't we…?» is used to suggest something."}, {"q": "A speaker says: «Let's meet at five… actually, no, six is better.» What time will they meet?", "o": ["Seven", "Five", "Half past five", "Six"], "a": 3, "why": "Speakers sometimes change their minds; the final answer is six."}, {"q": "In the model dialogue, which course did the students choose?", "o": ["First aid", "Cooking", "Music", "Personal finance"], "a": 0, "why": "They agreed: «Let's go for first aid.»"}, {"q": "Which phrase asks for your partner's opinion?", "o": ["That's why…", "What do you think?", "Let's go for…", "In my view…"], "a": 1, "why": "«What do you think?» invites your partner to speak."}]}, {"n": "118", "t": "Vocabulary: phrasal verbs and word formation for learning", "g": "You will learn phrasal verbs about studying and form new words with suffixes and prefixes.", "k": "Unit 11 · Life lessons · Vocabulary · SB p.132", "terms": [["phrasal verb", "фразове дієслово"], ["suffix", "суфікс"], ["prefix", "префікс"], ["to catch up", "наздогнати (пропущене)"], ["to drop out", "кинути (навчання)"], ["to hand in", "здати (роботу)"]], "th": [{"h": "Phrasal verbs for studying", "p": ["Phrasal verbs are very common in spoken English. Learn each one with an example, because the meaning is often different from the meaning of the main verb."], "ul": ["catch up (with) — наздогнати: I missed a week, so I need to catch up.", "hand in — здати: Please hand in your essays on Monday.", "look up — шукати (у словнику): Look up new words in a dictionary.", "go over — переглянути, повторити: Let's go over the main rules again.", "keep up (with) — встигати: It's hard to keep up with the new topics.", "drop out (of) — кинути навчання: He dropped out of college after a year.", "fall behind — відставати: If you skip lessons, you'll fall behind.", "sign up (for) — записатися: I signed up for a coding course."]}, {"h": "Word formation", "p": ["In many exam tasks you must change a word to fit a gap. Learn common suffixes for nouns, adjectives and people, and negative prefixes."], "ul": ["-tion: educate → education, qualify → qualification", "-ment: improve → improvement, achieve → achievement", "-er / -or: teach → teacher, instruct → instructor", "-ful / -less: use → useful / useless", "-al: practice → practical, education → educational", "un- / in-: successful → unsuccessful, complete → incomplete", "dis-: agree → disagree, like → dislike"]}, {"h": "Practise", "p": ["Read the sentences and say which phrasal verb or new word fits. Then write your own examples."], "ul": ["I was ill, so now I have to … with my maths. (catch up)", "Don't forget to … your project by Friday. (hand in)", "There was a big … in her English this year. (IMPROVE → improvement)", "The trip was very … — we learned a lot. (EDUCATION → educational)", "Copying from a friend is … — it doesn't help you learn. (USE → useless)"]}], "f": "The phrase «learn by heart» is linked to an old belief, held for example by Aristotle, that the heart was the centre of thinking and memory.", "pr": ["Workbook p. 67, Vocabulary 2.", "Write a short paragraph (60–80 words) about a time you fell behind or had to catch up at school. Use at least four phrasal verbs from the lesson."], "q": ["What does «drop out» mean?", "Which suffix turns «achieve» into a noun?", "What is the opposite of «successful»?", "Which phrasal verb means «to search for a word in a dictionary»?"], "qz": [{"q": "I was ill for two weeks, so I need to … with my classmates.", "o": ["look up", "catch up", "drop out", "hand in"], "a": 1, "why": "«Catch up» means to reach the same level as others."}, {"q": "Please … your homework before you leave.", "o": ["hand in", "fall behind", "keep up", "drop out"], "a": 0, "why": "«Hand in» means to give your work to the teacher."}, {"q": "If you don't study regularly, you will …", "o": ["sign up", "look up", "go over", "fall behind"], "a": 3, "why": "«Fall behind» means to make less progress than others."}, {"q": "Choose the correct noun: Her … in maths is impressive. (IMPROVE)", "o": ["improving", "improvement", "improved", "improvation"], "a": 1, "why": "The suffix -ment makes the noun «improvement»."}, {"q": "The museum visit was very … . (EDUCATION)", "o": ["educational", "educated", "educationless", "educator"], "a": 0, "why": "We need an adjective: educational."}, {"q": "The opposite of «complete» is …", "o": ["uncomplete", "discomplete", "incomplete", "nocomplete"], "a": 2, "why": "«Complete» takes the prefix in-: incomplete."}, {"q": "I've … for a photography course this summer.", "o": ["fallen behind", "handed in", "signed up", "dropped out"], "a": 2, "why": "«Sign up for» means to join or register for something."}]}, {"n": "119", "t": "Grammar: the causative — more uses (get someone to do, bad experiences)", "g": "You will use different causative structures, including have/get someone to do something and the causative for unpleasant experiences.", "k": "Unit 11 · Life lessons · Grammar · SB p.133", "terms": [["to persuade", "переконувати"], ["to arrange", "домовлятися, організовувати"], ["bare infinitive", "інфінітив без to"], ["unpleasant experience", "неприємний випадок"], ["to steal (stole, stolen)", "красти"]], "th": [{"h": "have someone do / get someone to do", "p": ["Sometimes we want to say who does the action for us. Then we use the person after have or get. Be careful: after have we use the infinitive without to, but after get we use to + infinitive.", "get someone to do often means that we persuade the person to do something."], "ul": ["have + person + infinitive: I'll have the mechanic check the brakes.", "The teacher had us rewrite the essay.", "get + person + to + infinitive: I got my brother to help me with maths.", "She finally got her dad to buy her a new phone.", "We couldn't get the printer to work. (thing + to-infinitive)", "Compare: I had my essay checked. / I had my teacher check my essay."]}, {"h": "The causative for bad experiences", "p": ["We also use have + object + past participle when something bad happens to us and somebody else did it. We didn't arrange it — it just happened."], "ul": ["He had his wallet stolen on the bus.", "She had her bag taken at the station.", "We had our car damaged in the storm.", "I had my phone broken during the football match.", "They had their flight cancelled at the last minute.", "Did you have anything stolen while you were on holiday?"]}, {"h": "Passive or causative?", "p": ["The causative is close to the passive, but it focuses on the person who receives the service or the problem. The passive focuses on the thing."], "ul": ["Passive: My bike was repaired yesterday.", "Causative: I had my bike repaired yesterday.", "Passive: Her passport was stolen.", "Causative: She had her passport stolen.", "Use «need + -ing» or «need to be done» for things that should be done: My hair needs cutting. / My hair needs to be cut."]}, {"h": "Common mistakes", "p": ["Check the verb form after the person or the object."], "ul": ["✗ I got my sister help me. → ✓ I got my sister to help me.", "✗ The coach had us to run five laps. → ✓ The coach had us run five laps.", "✗ He had stolen his wallet. → ✓ He had his wallet stolen. (someone stole it)", "✗ I had my teacher checked my work. → ✓ I had my teacher check my work."]}], "f": "", "pr": ["Workbook p. 68, Grammar 2.", "Write a short story (60–80 words) about an unlucky day. Use the causative for bad experiences at least twice and «get someone to do» once."], "q": ["What form of the verb follows «have + person»?", "What form of the verb follows «get + person»?", "What does «He had his wallet stolen» mean?", "How is the causative different from the passive?"], "qz": [{"q": "I got my friend … me with the project.", "o": ["help", "to help", "helped", "helping"], "a": 1, "why": "get + person + to-infinitive."}, {"q": "The teacher had us … the text again.", "o": ["readed", "reading", "to read", "read"], "a": 3, "why": "have + person + infinitive without to."}, {"q": "Poor Tom! He … on the train yesterday.", "o": ["stole his phone", "has his phone stealing", "had stolen his phone", "had his phone stolen"], "a": 3, "why": "have + object + past participle describes a bad experience."}, {"q": "Which sentence is correct?", "o": ["I'll have fix the plumber the tap.", "I'll have the plumber fixed the tap.", "I'll have the plumber to fix the tap.", "I'll have the plumber fix the tap."], "a": 3, "why": "have + person + bare infinitive: have the plumber fix."}, {"q": "«My room needs …» — choose the correct ending.", "o": ["to paint", "painted", "painting", "paint"], "a": 2, "why": "need + -ing has a passive meaning: needs painting."}, {"q": "We couldn't … the old computer to start.", "o": ["get", "make", "have", "let"], "a": 0, "why": "We use get + object + to-infinitive for persuading something to work."}, {"q": "Which sentence uses the causative, not the passive?", "o": ["The car was washed.", "The car is being washed.", "The car has been washed.", "I had the car washed."], "a": 3, "why": "have + object + past participle is the causative."}, {"q": "They … their flight cancelled because of the fog.", "o": ["had", "got to", "made", "did"], "a": 0, "why": "have + object + past participle for something bad that happened to them."}]}, {"n": "120", "t": "Writing: an informal letter about your school", "g": "You will write a personal letter (email) that combines facts and opinions about your school, using the right structure and useful phrases.", "k": "Unit 11 · Life lessons · Writing · SB pp.134-135", "terms": [["informal letter", "неформальний лист"], ["greeting", "привітання"], ["fact", "факт"], ["opinion", "думка"], ["fixed expression", "сталий вислів"], ["to sign off", "завершувати лист (підписуватися)"]], "th": [{"h": "Structure of an informal letter", "p": ["An informal letter or email is written to a friend or a family member. It is friendly and personal, but it still needs a clear structure. In the exam task you usually answer questions from a friend's letter — make sure you answer all of them."], "ul": ["Greeting: Hi Alex, / Dear Sam,", "Paragraph 1: thank your friend, react to their news, say why you are writing.", "Paragraph 2: answer the first question — give facts.", "Paragraph 3: answer the other questions — add your opinions and feelings.", "Final paragraph: ask a question, make a suggestion or invite your friend.", "Signing off: Best wishes, / Take care, / Write soon, + your name", "Length: usually 100–140 words."]}, {"h": "Useful language and fixed expressions", "p": ["Mix facts (what is true) with opinions (what you think). This makes your letter interesting and personal."], "ul": ["Opening: Thanks for your letter — it was great to hear from you!", "Facts: My school has about 300 students. / Lessons start at 8:30.", "Opinions: What I like most is… / To be honest, I find… a bit boring.", "Feelings: I'm really looking forward to… / I can't wait for…", "Linking: Also, … / What's more, … / However, …", "Changing topic: Anyway, … / By the way, …", "Ending: Write back soon! / Give my love to your family. / Let me know what you think."]}, {"h": "Model letter", "p": ["Hi Max, Thanks for your email! You asked me about my school, so here's some news. My lyceum is quite small — there are only about twenty students in my class, and lessons start at half past eight. This year I've got eleven subjects, but my favourite is biology because our teacher does lots of experiments with us. To be honest, I find history a bit difficult — there are so many dates to remember! What's more, we sometimes study online, which I really like because I can organise my own time. By the way, our school is having a science fair next month. I'm going to have my project printed on a big poster! What's your school like? Write back soon! Best wishes, Daryna"], "ul": ["Count the facts and the opinions in the model.", "Find a causative structure in the letter.", "Notice how each paragraph has one main idea."]}, {"h": "Checklist before you finish", "p": ["Read your letter again and tick each point."], "ul": ["Did I answer all the questions from the task?", "Did I use a friendly greeting and ending?", "Are there clear paragraphs?", "Did I mix facts and opinions?", "Did I use contractions (I'm, it's, don't)?", "Did I check spelling, punctuation and the word count?"]}], "f": "", "pr": ["Workbook p. 69, Writing; read the Writing Reference for informal letters.", "Write a letter (100–140 words) to a pen friend from another country about your school: your timetable, favourite subjects, teachers and one thing you would change."], "q": ["What do you write in the first paragraph of an informal letter?", "Give two ways to sign off an informal letter.", "Why is it good to mix facts and opinions?", "Why should you use contractions in an informal letter?"], "qz": [{"q": "Which greeting is suitable for a letter to a friend?", "o": ["Dear Sir or Madam,", "To whom it may concern,", "Hi Oksana,", "Dear Director,"], "a": 2, "why": "«Hi + name» is informal and friendly."}, {"q": "Which is an opinion, not a fact?", "o": ["Lessons start at 8:30.", "There are 25 students in my class.", "Our school has a gym.", "I think our gym is the best place in school."], "a": 3, "why": "«I think…» shows a personal opinion."}, {"q": "Which sign-off is informal?", "o": ["Yours sincerely,", "Take care,", "Yours faithfully,", "Respectfully yours,"], "a": 1, "why": "«Take care» is used with friends."}, {"q": "Which phrase is used to change the topic?", "o": ["Yours faithfully,", "In conclusion, …", "By the way, …", "Dear Sam,"], "a": 2, "why": "«By the way» introduces a new topic in informal writing."}, {"q": "What should the last paragraph usually include?", "o": ["A list of all your subjects", "The date of your birth", "A formal apology", "A question or invitation to your friend"], "a": 3, "why": "Ending with a question or invitation keeps the conversation going."}, {"q": "Which sentence is best for an informal letter?", "o": ["Please find attached my CV.", "Can't wait to hear from you!", "I am writing to complain about…", "I would be grateful if you could reply."], "a": 1, "why": "It is friendly and uses an informal style."}, {"q": "If the task asks three questions, you should …", "o": ["answer only the first one", "answer all three", "write about something else", "answer one and ask two new ones"], "a": 1, "why": "You lose marks if you don't answer all the questions."}]}, {"n": "121", "t": "Live well, study well: staying motivated to learn", "g": "You will discuss what motivates you to learn, understand an infographic about study habits and plan a small project.", "k": "Unit 11 · Life lessons · Live well, study well · SB p.136", "terms": [["motivation", "мотивація"], ["goal", "мета"], ["to procrastinate", "відкладати на потім"], ["reward", "винагорода"], ["habit", "звичка"], ["infographic", "інфографіка"]], "th": [{"h": "What keeps you motivated?", "p": ["Motivation is the reason why you want to do something. Internal motivation comes from inside: you learn because it's interesting. External motivation comes from outside: good marks, praise or a reward. Both are useful, but internal motivation usually lasts longer.", "When you study at home, motivation is extra important, because nobody stands next to you and tells you to start."], "ul": ["Set small, clear goals: «Today I'll learn 10 new words.»", "Know your «why»: How will English help you in the future?", "Break big tasks into small steps.", "Reward yourself after you finish a task.", "Track your progress in a notebook or app.", "Study with a friend and check each other.", "Don't wait for the «perfect» moment — just start for 5 minutes."]}, {"h": "Reading an infographic", "p": ["An infographic shows information with pictures, numbers and short texts. To understand it, look at the title first, then the biggest numbers and the labels. Imagine an infographic called «How students stay motivated» with these results from a class survey:"], "ul": ["45% — set goals for every week", "30% — study with friends", "15% — use rewards (a snack, a game, a walk)", "10% — no special strategy", "Questions: Which strategy is the most popular? What does the smallest number show?", "Useful language: Most students… / Almost half of… / Only a few… / The least popular…"]}, {"h": "Discuss and create", "p": ["Talk with a partner or answer the questions in writing. Then choose one project idea."], "ul": ["When do you feel most motivated to study?", "What makes you procrastinate? How can you stop it?", "Project 1: make an infographic about your class's study habits.", "Project 2: create a weekly study planner with goals and rewards.", "Project 3: record a 1-minute video with three motivation tips for younger students.", "Project 4: interview a family member about how they learned a new skill."]}], "f": "Research on the «testing effect» shows that trying to remember information, for example by quizzing yourself, helps you remember it better than simply reading it again.", "pr": ["Project of your choice: an infographic, a study planner, a video with tips or an interview (see the ideas in the lesson).", "Write your three study goals for next week and one reward for each goal."], "q": ["What is the difference between internal and external motivation?", "What should you look at first when you read an infographic?", "Name three ways to stop procrastinating.", "Which motivation tip works best for you?"], "qz": [{"q": "«Procrastinate» means …", "o": ["to study very hard", "to get a reward", "to set a goal", "to leave things until later"], "a": 3, "why": "To procrastinate is to delay doing something you should do."}, {"q": "Which is an example of internal motivation?", "o": ["Learning because a teacher shouts", "Learning only to get a good mark", "Learning to get money from parents", "Learning because you find it interesting"], "a": 3, "why": "Internal motivation comes from your own interest."}, {"q": "Which is the best goal?", "o": ["Learn 10 new words about health by Friday.", "Be better at English.", "Study a lot sometime.", "Read everything."], "a": 0, "why": "A good goal is small, clear and has a deadline."}, {"q": "In the infographic, 45% set weekly goals. Which phrase describes this best?", "o": ["Only a few students…", "Almost half of the students…", "Nobody…", "All students…"], "a": 1, "why": "45% is almost half."}, {"q": "What should you look at first in an infographic?", "o": ["The smallest text", "The colours", "The title", "The last line"], "a": 2, "why": "The title tells you what the infographic is about."}, {"q": "A «reward» is …", "o": ["a type of test", "a punishment", "a timetable", "something nice you get for doing well"], "a": 3, "why": "A reward is something pleasant you receive after an effort."}, {"q": "Which tip helps if a task feels too big?", "o": ["Wait for a better day", "Break it into small steps", "Do it all at night", "Ask someone to do it"], "a": 1, "why": "Small steps make big tasks easier to start and finish."}]}, {"n": "122", "t": "End-of-Unit 11 Revision: education, phrasal verbs and the causative", "g": "You will revise the vocabulary and grammar of Unit 11 and check what you need to practise more.", "k": "Unit 11 · Life lessons · End-of-Unit Revision", "terms": [["revision", "повторення"], ["to review", "переглядати, повторювати"], ["weak point", "слабке місце"], ["to improve", "покращувати"], ["accuracy", "точність"]], "th": [{"h": "Vocabulary summary", "p": ["Look through the words and test yourself: cover the translation and say it aloud. Mark the words you don't remember and review them again tomorrow."], "ul": ["Education: attend, term, timetable, graduate, degree, tuition fees, qualification", "Exams: take/sit, pass, fail an exam; revise for a test; get a good mark", "Study: make progress, do homework, learn by heart", "Phrasal verbs: catch up, hand in, look up, go over, keep up, drop out, fall behind, sign up", "Word formation: education → educational, improve → improvement, use → useful/useless", "Prefixes: unsuccessful, incomplete, disagree"]}, {"h": "Grammar summary: the causative", "p": ["have/get + object + past participle — someone does something for us, or something bad happens to us. have + person + infinitive / get + person + to-infinitive — we say who does the action."], "ul": ["I have my hair cut every month.", "We're having our kitchen painted this week.", "She had her bag stolen last night.", "I'll get my laptop repaired tomorrow.", "The coach had us run ten laps.", "I got my dad to drive me to school.", "My shoes need cleaning."]}, {"h": "Mini-test: correct the mistakes", "p": ["Find and correct one mistake in each sentence. Answers are in brackets."], "ul": ["I passed the exam, so I have to take it again. (failed)", "She made her homework late. (did)", "I had cut my hair yesterday. (had my hair cut)", "I got my friend help me. (to help)", "He dropped up of school. (dropped out)", "The course was very use. (useful)"]}], "f": "", "pr": ["Workbook p. 86, Review Unit 11.", "Write 8 sentences about your own life: 4 with education words or phrasal verbs and 4 with the causative."], "q": ["Name five phrasal verbs about studying.", "What are the two meanings of «have something done»?", "Which verb form follows «get someone»?", "Which words from Unit 11 are still difficult for you?"], "qz": [{"q": "I … the test, so I'm very happy!", "o": ["dropped", "failed", "passed", "took off"], "a": 2, "why": "«Pass» means you were successful."}, {"q": "We had our roof … after the storm.", "o": ["repair", "repairing", "to repair", "repaired"], "a": 3, "why": "have + object + past participle."}, {"q": "He … out of university after one year.", "o": ["handed", "caught", "fell", "dropped"], "a": 3, "why": "«Drop out» means to leave your studies before finishing."}, {"q": "I got my brother … my bike.", "o": ["fix", "fixed", "to fix", "fixing"], "a": 2, "why": "get + person + to-infinitive."}, {"q": "Choose the noun: He received a … in engineering. (QUALIFY)", "o": ["qualify", "qualified", "qualifying", "qualification"], "a": 3, "why": "The noun is formed with -ation: qualification."}, {"q": "She … her phone stolen on holiday.", "o": ["has", "had", "got to", "made"], "a": 1, "why": "have + object + past participle for a bad experience in the past."}, {"q": "I missed three lessons and now I'm trying to … .", "o": ["look up", "hand in", "sign up", "catch up"], "a": 3, "why": "«Catch up» means to reach the level of others after missing something."}]}]}, {"name": "Unit 12. Body and mind (Тіло та розум)", "lessons": [{"n": "123", "t": "Unit Opener + Vocabulary for Reading: body and mind", "g": "You will talk about how sport and habits affect your health and learn key words about the body for the unit's reading.", "k": "Unit 12 · Body and mind · Unit Opener + Vocabulary for Reading · SB pp.137-138", "terms": [["body", "тіло"], ["mind", "розум, свідомість"], ["brain", "мозок"], ["muscle", "м'яз"], ["amateur sport", "аматорський спорт"], ["professional sport", "професійний спорт"]], "th": [{"h": "What is this unit about?", "p": ["Unit 12 is called «Body and mind». Our physical health and our mental health are closely connected. When you move, sleep well and spend time outdoors, your brain works better too.", "In this unit you will read about how nature affects the brain, learn words for parts of the body, injuries and illnesses, and study adjectives, adverbs, «so» and «such»."], "ul": ["Do you do any sport? Is it for fun or for competition?", "Is professional sport always good for your health? Why / why not?", "How do you feel after a walk in the park?", "What habits help you stay healthy?", "What do you do when you feel stressed?"]}, {"h": "Key vocabulary: the body", "p": ["Learn these words before reading. Point to each part of your body and say the word aloud."], "ul": ["brain — мозок (Your brain uses a lot of energy.)", "muscle — м'яз (Exercise makes your muscles stronger.)", "heart — серце (My heart was beating fast after the race.)", "lungs — легені (Fresh air is good for your lungs.)", "bone — кістка (Milk is good for your bones.)", "skin — шкіра (Protect your skin from the sun.)", "nerves — нерви (I was so nervous — my nerves were terrible!)", "blood — кров (Exercise improves blood flow to the brain.)"]}, {"h": "Discussion: amateur or professional sport?", "p": ["Work in pairs or record yourself. Compare amateur sport (for fun and health) and professional sport (as a job). Give examples and reasons."], "ul": ["Amateur sport helps you relax and keeps you fit.", "Professional athletes train many hours a day.", "Professionals often have injuries because of hard training.", "On the one hand… On the other hand…", "I think amateur sport is healthier because…", "I'd (not) like to be a professional athlete because…"]}], "f": "An adult human body has 206 bones, but a newborn baby has around 270–300, because some bones fuse together as we grow.", "pr": ["Study the Student Resources Unit 12 Wordlist on your own: copy 10 new words with translations into your notebook.", "Draw a simple human figure and label at least 12 body parts in English."], "q": ["What is the topic of Unit 12?", "What is the difference between amateur and professional sport?", "Name four internal organs in English.", "How can physical activity help the mind?"], "qz": [{"q": "Which part of the body do we use for thinking?", "o": ["skin", "brain", "heart", "lungs"], "a": 1, "why": "The brain controls thinking and memory."}, {"q": "We breathe with our …", "o": ["bones", "nerves", "muscles", "lungs"], "a": 3, "why": "The lungs take in air."}, {"q": "Lifting weights makes your … stronger.", "o": ["brain", "skin", "blood", "muscles"], "a": 3, "why": "Exercise builds muscles."}, {"q": "An «amateur» athlete …", "o": ["always wins", "never trains", "plays for fun, not as a job", "is paid for playing"], "a": 2, "why": "Amateurs do sport as a hobby, not a profession."}, {"q": "Which phrase is used to compare two sides of a question?", "o": ["By the way…", "Write back soon…", "On the one hand… on the other hand…", "Dear Sir…"], "a": 2, "why": "This phrase shows two sides of an argument."}, {"q": "The organ that pumps blood around the body is the …", "o": ["lung", "heart", "brain", "bone"], "a": 1, "why": "The heart pumps blood."}, {"q": "Which word means «розум»?", "o": ["body", "muscle", "nerve", "mind"], "a": 3, "why": "«Mind» is the part of a person that thinks and feels."}]}, {"n": "124", "t": "Reading: how nature affects the brain (gapped text)", "g": "You will read a text about nature and the brain and practise filling gaps with missing sentences.", "k": "Unit 12 · Body and mind · Reading · SB pp.138-139", "terms": [["gapped text", "текст із пропусками"], ["reference word", "слово-посилання (займенник тощо)"], ["to reduce stress", "зменшувати стрес"], ["concentration", "зосередженість"], ["mood", "настрій"], ["to recover", "відновлюватися"]], "th": [{"h": "Before you read", "p": ["In the textbook you will read «How nature affects the brain». The task is a gapped text: some sentences are removed, and you must put them back in the right places. Before you read, think: how do you feel after spending time in a forest, a park or near water?"], "ul": ["Read the whole text first to understand the main idea.", "Read the missing sentences and underline key words.", "Look at the sentences before and after each gap.", "Check grammar and meaning together.", "Remember: there is usually one extra sentence you don't need."]}, {"h": "Practice text: Green time for a busy brain", "p": ["Many teenagers spend most of their day indoors, looking at screens. Scientists are now discovering that this can make our brains tired. [1] ___ For example, people who walked in a park for about an hour felt calmer than people who walked along a busy street. One explanation is that cities are full of things that demand our attention: traffic, noise, adverts. In nature, our attention can rest. [2] ___ This is why a short walk between homework tasks can help you concentrate better afterwards. Nature also seems to affect our mood. [3] ___ So next time you feel stressed before a test, try leaving your phone at home and going outside for twenty minutes.", "Missing sentences: A) Many people say they feel happier and less anxious after time outdoors. B) Studies show that even short visits to green places can help it recover. C) Because of this, the brain gets a chance to recharge. D) Most cities have very old buildings. (extra)"], "ul": ["Answers: 1 — B («it» = the brain), 2 — C («this» = attention can rest), 3 — A (topic: mood).", "Sentence D doesn't fit anywhere — it is the extra one.", "Tip: after you finish, read the whole text again with your answers to check that it flows logically."]}, {"h": "Exam tip: use linking clues", "p": ["Words like «it», «this», «they», «because of this», «however» and «for example» connect sentences. They are your best clues in a gapped-text task.", "When you choose a sentence, read the paragraph again with the sentence in the gap. It must sound logical."], "ul": ["Pronouns (it, they, this) refer to something earlier.", "«However» shows a contrast with the sentence before.", "«For example» comes after a general idea.", "«Because of this / As a result» shows a result.", "Check that the topic of the sentence matches the paragraph.", "Cross out sentences you have already used."]}], "f": "In Japan, «shinrin-yoku», or «forest bathing», means spending calm, mindful time among trees; the term was introduced there in the early 1980s.", "pr": ["Workbook pp. 70-71: reading task and Exam Reminder.", "Spend 20 minutes outdoors without your phone. Then write 5–6 sentences about how you felt before and after."], "q": ["What is a gapped-text task?", "Why are pronouns like «it» and «this» useful clues?", "What should you do after you put all the sentences in the gaps?", "According to the practice text, why does nature help our attention?"], "qz": [{"q": "In a gapped-text task, what should you do first?", "o": ["Read only the missing sentences", "Translate every word", "Fill gap 1 immediately", "Read the whole text for the main idea"], "a": 3, "why": "Understanding the whole text helps you place the sentences."}, {"q": "In the practice text, why is sentence D the extra sentence?", "o": ["It uses «however».", "It has a grammar mistake.", "It is too long.", "It is about old buildings, not nature and the brain."], "a": 3, "why": "Its topic doesn't match the text."}, {"q": "A missing sentence starts with «However». What does it show?", "o": ["A result", "A contrast", "A time", "An example"], "a": 1, "why": "«However» introduces a contrast."}, {"q": "In sentence B, «it» refers to …", "o": ["the phone", "the brain", "the street", "the park"], "a": 1, "why": "The sentence before talks about our brains getting tired."}, {"q": "According to the practice text, what is a good idea before a test?", "o": ["Go outside for twenty minutes", "Walk along a busy street", "Play games on your phone", "Sleep for five hours"], "a": 0, "why": "The text suggests leaving your phone and going outside."}, {"q": "«Concentration» means …", "o": ["feeling sad", "a type of exercise", "a busy city", "the ability to focus your attention"], "a": 3, "why": "Concentration is your ability to focus on one thing."}, {"q": "Which phrase introduces a result?", "o": ["For example,", "On the other hand,", "However,", "Because of this,"], "a": 3, "why": "«Because of this» shows the result of something."}]}, {"n": "125", "t": "Vocabulary: parts of the body and healthy habits", "g": "You will learn words for parts of the body and common body idioms, and use them to give advice about a healthy lifestyle.", "k": "Unit 12 · Body and mind · Vocabulary · SB p.140", "terms": [["wrist", "зап'ястя"], ["ankle", "щиколотка"], ["elbow", "лікоть"], ["forehead", "лоб"], ["shoulder", "плече"], ["idiom", "ідіома"]], "th": [{"h": "Parts of the body", "p": ["You already know basic words like head, arm and leg. At B1 level you need more exact words — for example, to describe an injury or to follow an exercise video."], "ul": ["Head: forehead — лоб, cheek — щока, chin — підборіддя, eyebrow — брова, eyelash — вія", "Arm: shoulder — плече, elbow — лікоть, wrist — зап'ястя, palm — долоня, thumb — великий палець", "Leg: hip — стегно (кульшовий суглоб), thigh — стегно, knee — коліно, ankle — щиколотка, heel — п'ятка", "Body: chest — грудна клітка, stomach — живіт, шлунок, back — спина, waist — талія", "Inside: brain, heart, lungs, liver — печінка, kidneys — нирки"]}, {"h": "Body idioms", "p": ["English has many idioms with body parts. Their meaning is not literal, so learn them as whole phrases."], "ul": ["cost an arm and a leg — коштувати дуже дорого", "break a leg! — ні пуху ні пера! (good luck before a performance)", "keep an eye on — наглядати за", "be all ears — уважно слухати", "get cold feet — злякатися в останній момент", "have a sweet tooth — бути ласуном", "by heart — напам'ять"]}, {"h": "Giving advice about a healthy lifestyle", "p": ["Use the new words to give recommendations. Remember useful structures: You should… / Try to… / It's a good idea to… / Don't forget to…"], "ul": ["Keep your back straight when you sit at your desk.", "Stretch your shoulders and neck after an hour of homework.", "Warm up your knees and ankles before running.", "Don't hold your phone too close — it's bad for your eyes and neck.", "It's a good idea to drink water to keep your skin and brain healthy.", "Try to sleep 8–10 hours — your body needs time to recover."]}], "f": "The smallest bone in the human body is the stapes (stirrup) in the middle ear; it is only about 3 millimetres long.", "pr": ["Workbook p. 71, Vocabulary 1.", "Write 6 pieces of advice for a classmate who spends too much time at the computer. Use at least 6 body words from the lesson."], "q": ["Which joint connects your hand and your arm?", "Which joint is in the middle of your leg?", "What does «cost an arm and a leg» mean?", "Give two pieces of advice about posture."], "qz": [{"q": "The joint between your foot and your leg is your …", "o": ["elbow", "wrist", "ankle", "knee"], "a": 2, "why": "The ankle connects the foot and the leg."}, {"q": "You wear a watch on your …", "o": ["wrist", "heel", "chin", "thigh"], "a": 0, "why": "A watch is worn on the wrist."}, {"q": "The part of your face above your eyebrows is your …", "o": ["forehead", "cheek", "chin", "neck"], "a": 0, "why": "The forehead is above the eyebrows."}, {"q": "These trainers cost an arm and a leg! means they are …", "o": ["cheap", "very expensive", "too small", "uncomfortable"], "a": 1, "why": "«Cost an arm and a leg» means very expensive."}, {"q": "I love cakes and chocolate — I have a sweet …", "o": ["tongue", "tooth", "mouth", "lip"], "a": 1, "why": "The idiom is «have a sweet tooth»."}, {"q": "Before a school concert, your friend says: «Break a leg!» What does it mean?", "o": ["Good luck!", "Go home!", "Be careful!", "Sit down!"], "a": 0, "why": "«Break a leg» is a way to wish someone good luck before a performance."}, {"q": "Which sentence gives advice correctly?", "o": ["You should stretched.", "You should stretching.", "You should stretch your back.", "You should to stretch."], "a": 2, "why": "After «should» we use the infinitive without to."}, {"q": "The joint in the middle of your arm is your …", "o": ["shoulder", "knee", "hip", "elbow"], "a": 3, "why": "The elbow is in the middle of the arm."}]}, {"n": "126", "t": "Grammar: adjectives and adverbs; so and such", "g": "You will use adjectives and adverbs correctly and form sentences with «so» and «such» to express strong feelings and results.", "k": "Unit 12 · Body and mind · Grammar · SB p.141", "terms": [["adjective", "прикметник"], ["adverb", "прислівник"], ["adverb of manner", "прислівник способу дії"], ["intensifier", "підсилювальне слово"], ["irregular", "неправильний"]], "th": [{"h": "Adjectives and adverbs", "p": ["Adjectives describe nouns: a careful driver, a healthy meal. They also come after verbs like be, look, feel, seem, sound, taste, smell: You look tired.", "Adverbs describe verbs (how something happens): He drives carefully. Most adverbs are formed by adding -ly to the adjective."], "ul": ["quick → quickly, careful → carefully, quiet → quietly", "easy → easily, happy → happily (y → i)", "gentle → gently, terrible → terribly (-le → -ly)", "fantastic → fantastically (-ic → -ically)", "Some -ly words are adjectives: friendly, lovely, lonely, silly. We say «in a friendly way».", "She is a good swimmer. → She swims well."]}, {"h": "Irregular adverbs", "p": ["Some adverbs have the same form as the adjective, and some change their meaning with -ly. Learn them carefully."], "ul": ["good → well: She plays tennis well.", "fast → fast: He runs fast. (not fastly)", "hard → hard: They train hard. (hardly = майже не: I hardly slept.)", "late → late: I got up late. (lately = останнім часом)", "early → early: We arrived early.", "near → near: (nearly = майже)"]}, {"h": "so and such", "p": ["We use «so» and «such» to make an adjective stronger. We often add «that» to show a result.", "so + adjective/adverb; such + (a/an) + adjective + noun."], "ul": ["The water was so cold!", "He ran so fast that nobody could catch him.", "It was such a hot day that we stayed inside.", "They are such kind people.", "It was such good advice. (uncountable — no a/an)", "so much / so many + noun: I have so much homework! There were so many people.", "✗ It was so a nice day. → ✓ It was such a nice day."]}], "f": "", "pr": ["Workbook p. 72, Grammar 1.", "Write 6 sentences about your last sports lesson or training: 3 with adverbs of manner and 3 with so / such … that."], "q": ["What is the difference between an adjective and an adverb?", "What is the adverb from «good»? From «fast»?", "What does «hardly» mean?", "When do you use «such» instead of «so»?"], "qz": [{"q": "She is a very … runner.", "o": ["quicker than", "quickly", "quickness", "quick"], "a": 3, "why": "Before a noun we use an adjective."}, {"q": "He speaks English very …", "o": ["best", "goodly", "well", "good"], "a": 2, "why": "The adverb from «good» is «well»."}, {"q": "I was so tired that I could … keep my eyes open.", "o": ["hardly", "hard", "hardy", "harder"], "a": 0, "why": "«Hardly» means «almost not»."}, {"q": "It was … a beautiful day that we went to the beach.", "o": ["so", "very", "too", "such"], "a": 3, "why": "such + a + adjective + noun."}, {"q": "The soup smells …", "o": ["deliciousness", "more deliciously", "deliciously", "delicious"], "a": 3, "why": "After «smell» (a linking verb) we use an adjective."}, {"q": "The film was … boring that I fell asleep.", "o": ["such a", "so a", "such", "so"], "a": 3, "why": "so + adjective (without a noun)."}, {"q": "Choose the correct sentence.", "o": ["He drives very fastly.", "He drives very fasts.", "He drives very faster.", "He drives very fast."], "a": 3, "why": "«Fast» is both an adjective and an adverb; «fastly» doesn't exist."}, {"q": "There were … many people at the stadium!", "o": ["such a", "such", "so", "very"], "a": 2, "why": "We say «so many» before plural nouns."}]}, {"n": "127", "t": "Listening + Speaking: healthy habits; comparing photos", "g": "You will practise listening for opinions and attitudes and compare photos about healthy and unhealthy habits.", "k": "Unit 12 · Body and mind · Listening + Speaking · SB pp.142-143", "terms": [["attitude", "ставлення"], ["to compare", "порівнювати"], ["whereas", "тоді як"], ["lifestyle", "спосіб життя"], ["to speculate", "робити припущення"]], "th": [{"h": "Listening for opinions and attitudes", "p": ["In some listening tasks you must decide how a speaker feels or what they think. People rarely say «I'm angry» directly — you need to listen to their words and their tone of voice."], "ul": ["Listen to the tone: is the voice happy, surprised, annoyed, worried?", "Notice opinion words: unfortunately, luckily, to be honest, I must admit.", "Listen to the whole answer — the opinion may come at the end.", "Watch for «but» — the important idea often comes after it.", "Don't choose an answer just because you hear a word from it.", "Use the second listening to confirm your choice."]}, {"h": "Comparing photos", "p": ["In the speaking exam you may get two photos — for example, a teenager playing football outdoors and a teenager playing video games at night. Talk about similarities, differences and what the people might feel. Speak for about one minute."], "ul": ["Both photos show… / In both pictures…", "In the first photo…, whereas in the second one…", "The main difference is that…", "The boy looks… / She seems to be… (+ adjective)", "He might be feeling… / Perhaps they are…", "I think the first lifestyle is healthier because…", "Personally, I'd prefer… because…"]}, {"h": "Model answer", "p": ["Both photos show teenagers in their free time. In the first photo, a girl is running in a park, whereas in the second one, a boy is sitting in a dark room and playing a computer game. The girl looks really energetic and happy. The boy seems so focused that he has probably forgotten about the time — he might be feeling tired. The main difference is that the girl is moving and getting fresh air, while the boy is sitting still. In my opinion, the first activity is much healthier, but I think it's OK to play games sometimes if you don't do it late at night."], "ul": ["Notice the adjectives and adverbs: energetic, really, so focused.", "Notice the speculation: probably, might be feeling.", "The speaker gives a personal opinion at the end."]}], "f": "An adult human heart beats around 100,000 times a day.", "pr": ["Workbook p. 72, Listening.", "Find two photos (in a magazine or your own) about healthy and unhealthy habits. Record yourself comparing them for 1 minute using the phrases from the lesson."], "q": ["How can you understand a speaker's attitude if they don't say it directly?", "Which word can you use to show contrast between two photos?", "Give two phrases for speculating about a photo.", "Why is the idea after «but» often important?"], "qz": [{"q": "Which word shows a contrast between two photos?", "o": ["whereas", "both", "also", "because"], "a": 0, "why": "«Whereas» compares two different things."}, {"q": "Which phrase is used to speculate?", "o": ["The main difference is…", "Both photos show…", "He is definitely…", "He might be feeling…"], "a": 3, "why": "«Might» shows you are not sure — you are guessing."}, {"q": "A speaker says: «The gym is expensive, but honestly, it's worth every penny.» How does she feel about the gym?", "o": ["Positive", "Bored", "Angry", "Negative"], "a": 0, "why": "The idea after «but» shows her real, positive opinion."}, {"q": "Which phrase describes a similarity?", "o": ["The main difference is…", "Both photos show…", "In the first photo…", "whereas…"], "a": 1, "why": "«Both photos show» talks about something they have in common."}, {"q": "«Unfortunately» shows that the speaker is …", "o": ["surprised in a good way", "pleased", "excited", "disappointed"], "a": 3, "why": "«Unfortunately» introduces bad news."}, {"q": "How long should you usually speak when comparing photos in the exam?", "o": ["As long as you want", "About ten minutes", "About one minute", "About 5 seconds"], "a": 2, "why": "A photo comparison task usually lasts about one minute."}, {"q": "Choose the correct sentence.", "o": ["She look happily.", "She looks happily.", "She looks happiness.", "She looks happy."], "a": 3, "why": "After «look» (meaning «seem») we use an adjective."}]}, {"n": "128", "t": "Vocabulary: injuries and illnesses", "g": "You will learn words and collocations for injuries and illnesses and talk about ways to prevent them.", "k": "Unit 12 · Body and mind · Vocabulary · SB p.144", "terms": [["injury", "травма"], ["illness", "хвороба"], ["to sprain", "розтягнути (зв'язку)"], ["bruise", "синець"], ["symptom", "симптом"], ["prevention", "профілактика"]], "th": [{"h": "Injuries", "p": ["Injuries happen when you hurt your body, for example in sport or in an accident. Learn the verbs together with the body parts."], "ul": ["break your arm/leg — зламати руку/ногу", "sprain your ankle/wrist — розтягнути щиколотку/зап'ястя", "twist your knee — підвернути коліно", "cut your finger — порізати палець", "burn your hand — обпекти руку", "bruise — синець; bruised — у синцях", "bleed — кровоточити; blood — кров", "swollen — набряклий: My ankle is swollen."]}, {"h": "Illnesses and symptoms", "p": ["When you are ill, you need to explain your symptoms to a doctor or a parent. Note the verbs: have / catch / get."], "ul": ["catch a cold — застудитися", "have the flu — хворіти на грип", "have a temperature / a fever — мати температуру", "have a sore throat — болить горло", "have a headache / a stomachache / toothache — болить голова / живіт / зуб", "cough — кашель; sneeze — чхати", "feel sick — нудити; feel dizzy — паморочиться в голові", "an allergy (to) — алергія (на); a rash — висип"]}, {"h": "Prevention: how to stay healthy", "p": ["Prevention means stopping something bad before it happens. Use the new words to give advice."], "ul": ["Wash your hands with soap regularly to avoid catching colds.", "Warm up before sport to prevent injuries.", "Wear a helmet when you ride a bike.", "Get enough sleep so your body can fight illness.", "Eat fruit and vegetables and drink plenty of water.", "If you feel dizzy or have a high temperature, see a doctor."]}], "f": "According to the World Health Organization, washing your hands with soap is one of the most effective ways to prevent the spread of infections.", "pr": ["Workbook p. 73, Vocabulary 2.", "Write a dialogue (8–10 lines) between a patient and a doctor. The patient describes symptoms and the doctor gives advice. Use at least 6 words from the lesson."], "q": ["What is the difference between an injury and an illness?", "Which verb goes with «a cold»?", "Name three symptoms of the flu.", "Give three tips to prevent sports injuries."], "qz": [{"q": "I fell during basketball and … my ankle.", "o": ["sneezed", "sprained", "coughed", "caught"], "a": 1, "why": "We «sprain» an ankle or a wrist."}, {"q": "I've … a cold, so I'm staying at home.", "o": ["burnt", "cut", "broken", "caught"], "a": 3, "why": "The collocation is «catch a cold»."}, {"q": "My throat hurts. I have a … throat.", "o": ["bruised", "sick", "sore", "broken"], "a": 2, "why": "We say «a sore throat»."}, {"q": "A dark mark on your skin after you hit something is a …", "o": ["bruise", "cough", "rash", "fever"], "a": 0, "why": "A bruise is a mark from a hit."}, {"q": "«Prevention» means …", "o": ["a kind of medicine", "feeling dizzy", "stopping something before it happens", "curing an illness"], "a": 2, "why": "Prevention stops problems before they start."}, {"q": "Which is a symptom, not an injury?", "o": ["a high temperature", "a sprained wrist", "a broken arm", "a cut finger"], "a": 0, "why": "A temperature is a symptom of illness; the others are injuries."}, {"q": "Which advice helps prevent head injuries when cycling?", "o": ["Drink more water", "Eat vegetables", "Sleep more", "Wear a helmet"], "a": 3, "why": "A helmet protects your head."}, {"q": "I feel … — everything is spinning around me.", "o": ["sore", "bleeding", "swollen", "dizzy"], "a": 3, "why": "«Dizzy» describes the feeling that everything is spinning."}]}, {"n": "129", "t": "Grammar: comparison of adjectives and adverbs; open cloze strategy", "g": "You will compare people, things and actions using adjectives and adverbs, and learn to think about the type of word missing in an open cloze.", "k": "Unit 12 · Body and mind · Grammar · SB p.145", "terms": [["comparative", "вищий ступінь порівняння"], ["superlative", "найвищий ступінь порівняння"], ["open cloze", "текст із пропусками без варіантів"], ["part of speech", "частина мови"], ["auxiliary verb", "допоміжне дієслово"]], "th": [{"h": "Comparing adjectives", "p": ["Comparatives compare two things; superlatives compare one thing with a whole group.", "Short adjectives take -er / -est; long adjectives take more / most."], "ul": ["fit → fitter → the fittest (double the consonant)", "healthy → healthier → the healthiest (y → i)", "dangerous → more dangerous → the most dangerous", "good → better → the best; bad → worse → the worst; far → further → the furthest", "as + adjective + as: Walking is as useful as running.", "not as … as: Chips aren't as healthy as salad.", "the + comparative, the + comparative: The more you sleep, the better you feel."]}, {"h": "Comparing adverbs", "p": ["Adverbs ending in -ly usually take more / most. Short adverbs that look like adjectives take -er / -est."], "ul": ["carefully → more carefully → the most carefully", "quietly → more quietly → the most quietly", "fast → faster → the fastest; hard → harder → the hardest", "early → earlier → the earliest", "well → better → the best; badly → worse → the worst", "He runs faster than me. / She trains harder than anyone in the team.", "Use «much», «a lot», «a bit» with comparatives: much healthier, a bit more slowly."]}, {"h": "Exam strategy: open cloze", "p": ["In an open cloze you fill each gap with one word, and there are no options. First, think about what type of word is missing. Most missing words are short grammar words.", "Example: Swimming is one of ___ best ways to stay fit. → the (article before a superlative). Exercise is better ___ medicine. → than (comparison)."], "ul": ["Read the whole text first for the general meaning.", "Look at the words before and after the gap.", "Ask: is it an article, preposition, pronoun, auxiliary verb, linker or comparison word?", "After a comparative → than; after «as + adjective» → as.", "Before a superlative → the; «one of the + superlative + plural noun».", "Check that the sentence is grammatically correct with your word.", "Never leave a gap empty — make a sensible guess."]}], "f": "", "pr": ["Workbook p. 74, Grammar 2.", "Compare three sports or three healthy habits in 6–8 sentences. Use comparatives, superlatives, «as … as» and at least two adverbs."], "q": ["How do you form the comparative of «healthy» and «dangerous»?", "What are the comparative and superlative of «well» (adverb)?", "What word usually comes after a comparative?", "What is the first thing you should think about in an open cloze?"], "qz": [{"q": "Cycling is … than driving for your health.", "o": ["the best", "better", "good", "best"], "a": 1, "why": "The comparative of «good» is «better»."}, {"q": "She is the … player in our team.", "o": ["fit", "fitter", "most fit", "fittest"], "a": 3, "why": "Superlative of a short adjective: the fittest."}, {"q": "Please speak … — the baby is sleeping.", "o": ["quieter", "the quietest", "more quietly", "more quiet"], "a": 2, "why": "An -ly adverb takes «more»: more quietly."}, {"q": "Walking is not as tiring … running.", "o": ["like", "as", "than", "that"], "a": 1, "why": "The structure is «not as … as»."}, {"q": "The more you practise, … you become.", "o": ["the best", "best", "better", "the better"], "a": 3, "why": "«The + comparative, the + comparative»."}, {"q": "Open cloze: Football is one of ___ most popular sports in the world.", "o": ["than", "the", "a", "as"], "a": 1, "why": "We use «the» before a superlative."}, {"q": "He worked … than last year and got better results.", "o": ["hardest", "harder", "hardly", "more hard"], "a": 1, "why": "«Hard» is a short adverb: harder."}, {"q": "Which word is most likely missing? «I feel much better ___ I started doing yoga.»", "o": ["since", "as", "the", "than"], "a": 0, "why": "«Since» introduces the time when something started."}]}, {"n": "130", "t": "Writing: an opinion essay about a healthy lifestyle", "g": "You will plan and write an opinion essay about healthy habits with a clear structure, linking words and fixed expressions.", "k": "Unit 12 · Body and mind · Writing · SB pp.146-147", "terms": [["essay", "есе, твір"], ["introduction", "вступ"], ["conclusion", "висновок"], ["linking words", "слова-зв'язки"], ["topic sentence", "тематичне (головне) речення абзацу"], ["formal style", "формальний стиль"]], "th": [{"h": "Structure of an opinion essay", "p": ["An opinion essay answers a question or reacts to a statement, for example: «Teenagers today don't do enough to stay healthy. Do you agree?» You give your opinion and support it with reasons and examples. The style is neutral or formal."], "ul": ["Paragraph 1 — Introduction: introduce the topic and give your opinion.", "Paragraph 2 — First reason + example.", "Paragraph 3 — Second reason + example (or the opposite view and why you disagree).", "Paragraph 4 — Conclusion: sum up and repeat your opinion in different words.", "Start each body paragraph with a topic sentence.", "Length: usually 120–180 words.", "No contractions (do not, it is), no slang."]}, {"h": "Useful language", "p": ["Learn these fixed expressions — they make your essay clear and well organised."], "ul": ["Giving opinion: In my opinion, … / I strongly believe that… / It seems to me that…", "Ordering ideas: Firstly, … / Secondly, … / Finally, …", "Adding: In addition, … / Moreover, … / What is more, …", "Contrast: However, … / On the other hand, … / Although…", "Examples: For example, … / For instance, … / such as…", "Result: As a result, … / Therefore, …", "Concluding: To sum up, … / In conclusion, … / All in all, …"]}, {"h": "Model essay", "p": ["Teenagers today don't do enough to stay healthy. Do you agree?", "Many people believe that young people are less healthy than in the past. In my opinion, this is partly true, but many teenagers are trying to change their habits. Firstly, it is true that students spend a lot of time sitting. They study online, play games and use social media, so they often move much less than their parents did. As a result, some of them have problems with their backs and eyes. On the other hand, a lot of teenagers are interested in healthy food and sport. For example, many of my friends go to the gym, cycle or follow fitness videos at home. To sum up, I believe that teenagers are not as inactive as some adults think. However, schools and families should help them find a better balance between screens and movement."], "ul": ["Find the opinion in the introduction.", "Find two linking words for contrast.", "Notice that there are no contractions.", "The conclusion repeats the opinion in different words."]}, {"h": "Checklist", "p": ["Check your essay before you hand it in."], "ul": ["Is my opinion clear in the introduction and the conclusion?", "Does each paragraph have one main idea and a topic sentence?", "Did I give reasons and examples?", "Did I use a variety of linking words?", "Is the style neutral, without contractions or slang?", "Did I check the word count, spelling and grammar?"]}], "f": "The World Health Organization recommends that children and teenagers aged 5–17 do at least 60 minutes of moderate-to-vigorous physical activity a day.", "pr": ["Workbook p. 75, Writing; read the Writing Reference for essays.", "Write an opinion essay (120–180 words): «Schools should give students more time for sport. Do you agree?»"], "q": ["How many paragraphs does a typical opinion essay have?", "What should the introduction include?", "Name three linking words for adding ideas.", "Why shouldn't you use contractions in an essay?"], "qz": [{"q": "Where do you first state your opinion in an essay?", "o": ["Only in the title", "In the introduction", "In the middle of paragraph 3", "Nowhere"], "a": 1, "why": "The introduction presents the topic and your opinion."}, {"q": "Which linking word adds an idea?", "o": ["Therefore", "However", "Moreover", "Although"], "a": 2, "why": "«Moreover» adds more information."}, {"q": "Which phrase begins a conclusion?", "o": ["To sum up,", "On the other hand,", "For instance,", "Firstly,"], "a": 0, "why": "«To sum up» introduces the final summary."}, {"q": "Which sentence suits the style of an essay?", "o": ["I strongly believe that sport is important.", "Well, dunno, maybe sport is good.", "Sport's super cool, guys!", "Sport? Yeah, it's OK."], "a": 0, "why": "An essay needs a neutral or formal style."}, {"q": "A topic sentence is …", "o": ["a sentence that gives the main idea of a paragraph", "the title", "a quotation", "the last sentence of the essay"], "a": 0, "why": "The topic sentence tells the reader what the paragraph is about."}, {"q": "Which linker shows a result?", "o": ["In addition", "As a result", "Although", "For example"], "a": 1, "why": "«As a result» shows a consequence."}, {"q": "Which is the best example to support «Teenagers move less than before»?", "o": ["My school is big.", "Teenagers like music.", "Pizza is popular.", "Many students spend six hours a day sitting at a screen."], "a": 3, "why": "This example directly supports the idea of moving less."}]}, {"n": "131", "t": "Video: learning another language", "g": "You will watch a video about learning languages, take notes, summarise the main ideas and discuss your own experience as a language learner.", "k": "Unit 12 · Body and mind · Video · SB p.148", "terms": [["bilingual", "двомовний"], ["native speaker", "носій мови"], ["fluent", "вільний (про володіння мовою)"], ["accent", "акцент"], ["to take notes", "робити нотатки"], ["multilingual", "багатомовний"]], "th": [{"h": "Background: why learn languages?", "p": ["In the textbook you will watch the video «Learning another language». Learning a language is not only about grammar and words. It also changes how you think: you learn to notice details, to be patient and to understand people from other cultures.", "Many people in Ukraine speak two or more languages, and English helps us communicate with the whole world — for studying, travelling, working and making friends online."], "ul": ["Learning a language trains your memory and attention.", "You can read books, watch films and use websites in the original.", "It gives you more choice for studying and jobs abroad.", "It helps you understand other cultures — and your own culture better.", "Making mistakes is a normal part of learning."]}, {"h": "Note-taking while watching", "p": ["Don't try to write everything. Write only key words, numbers and names. Use abbreviations and symbols, then turn your notes into a short summary of 3–4 sentences."], "ul": ["Use short forms: e.g. (for example), ppl (people), lang (language), → (leads to), + (and)", "Before watching, write 3 questions you expect the video to answer.", "While watching, write key words only.", "After watching, compare notes with a partner or check them in your memory.", "Summary starters: The video is about… / The main idea is… / It also shows that…"]}, {"h": "Discuss", "p": ["Answer the questions with a partner or record your answers. Use grammar from Units 11 and 12: the causative, adjectives and adverbs, comparatives, so / such."], "ul": ["How many languages do you speak? Which one was the hardest to learn?", "Which is more important: speaking fluently or speaking accurately?", "What is the best way to learn new words — apps, books, films or talking?", "Would you like to study abroad? Where and why?", "What does it mean to be a citizen of a multilingual world?", "Learning English is so useful that… / It's such a fun way to…"]}], "f": "More than 7,000 languages are spoken in the world today.", "pr": ["Revise the Student Resources Unit 11 and Unit 12 Wordlists and choose 10 words you want to remember; write a sentence with each.", "Write a short reflection (80–100 words): «My story as a language learner» — when you started, what helps you and what your goals are."], "q": ["What does «bilingual» mean?", "Give two tips for taking notes while watching a video.", "Why is learning a foreign language good for your brain?", "What is your main goal in learning English?"], "qz": [{"q": "A person who speaks two languages from childhood is …", "o": ["bilingual", "fluent", "native", "monolingual"], "a": 0, "why": "«Bilingual» means speaking two languages."}, {"q": "When you take notes while watching, you should …", "o": ["write in full sentences only", "write every word", "write only key words and numbers", "close your eyes"], "a": 2, "why": "Key words are enough; you can write a summary later."}, {"q": "«He speaks English fluently» means he speaks …", "o": ["slowly and with mistakes", "very quietly", "easily and naturally", "only a few words"], "a": 2, "why": "«Fluently» means easily, without stopping often."}, {"q": "Which sentence uses «such» correctly?", "o": ["It's such useful language a.", "It's so a useful language.", "English is such useful.", "It's such a useful language."], "a": 3, "why": "such + a + adjective + noun."}, {"q": "Which phrase starts a summary?", "o": ["Yours faithfully,", "The main idea is…", "Write back soon!", "Break a leg!"], "a": 1, "why": "«The main idea is…» introduces a summary."}, {"q": "A person who learned a language as a baby is a … of it.", "o": ["teacher", "learner", "native speaker", "translator"], "a": 2, "why": "A native speaker learned the language from birth."}, {"q": "Which abbreviation means «for example»?", "o": ["etc.", "i.e.", "e.g.", "p.s."], "a": 2, "why": "«e.g.» means «for example»."}]}, {"n": "132", "t": "End-of-Unit 12 Revision: body, health, adjectives and adverbs", "g": "You will revise the vocabulary and grammar of Unit 12 and check your progress.", "k": "Unit 12 · Body and mind · End-of-Unit Revision", "terms": [["revision", "повторення"], ["to check", "перевіряти"], ["mistake", "помилка"], ["to compare", "порівнювати"], ["progress", "прогрес, успіхи"]], "th": [{"h": "Vocabulary summary", "p": ["Test yourself: cover the right side and translate. Make a list of words you still find difficult."], "ul": ["Body: forehead, chin, shoulder, elbow, wrist, thumb, knee, ankle, heel, chest, brain, lungs, heart", "Idioms: cost an arm and a leg, keep an eye on, have a sweet tooth, get cold feet", "Injuries: break, sprain, twist, cut, burn; bruise, swollen", "Illnesses: catch a cold, have the flu, a sore throat, a temperature, feel dizzy, an allergy", "Health: prevention, symptom, recover, reduce stress, concentration"]}, {"h": "Grammar summary", "p": ["Adjectives describe nouns; adverbs describe verbs. so + adjective; such (a) + adjective + noun. Comparatives and superlatives for adjectives and adverbs."], "ul": ["She is a careful driver. / She drives carefully.", "He plays well. He works hard. I hardly slept.", "The test was so easy that everyone passed.", "It was such an easy test that everyone passed.", "Swimming is healthier than sitting. / This is the healthiest option.", "He runs faster than me. / She speaks more clearly than before.", "The earlier you go to bed, the better you feel."]}, {"h": "Mini-test: correct the mistakes", "p": ["Find and correct one mistake in each sentence. Answers are in brackets."], "ul": ["She sings very good. (well)", "It was so a hot day. (such a)", "He is more fit than me. (fitter)", "I have catched a cold. (caught)", "I have a soar throat. (sore)", "Running is more good for you than sitting. (better)"]}], "f": "", "pr": ["Workbook p. 87, Review Unit 12.", "Make a 10-question quiz for a classmate on Unit 12 vocabulary and grammar, with answers."], "q": ["Name five injuries in English.", "What is the difference between «so» and «such»?", "What are the comparative forms of «good» and «well»?", "Which part of Unit 12 do you need to practise more?"], "qz": [{"q": "He fell and … his wrist.", "o": ["felt", "coughed", "sprained", "caught"], "a": 2, "why": "We «sprain» a wrist or an ankle."}, {"q": "She swims very …", "o": ["good", "goodly", "well", "best"], "a": 2, "why": "The adverb from «good» is «well»."}, {"q": "It was … an interesting lesson!", "o": ["so", "too", "very", "such"], "a": 3, "why": "such + an + adjective + noun."}, {"q": "This exercise is … than the last one.", "o": ["more easy", "easier", "easyer", "easiest"], "a": 1, "why": "easy → easier (y → i)."}, {"q": "I've got a sore …, so it hurts when I swallow.", "o": ["elbow", "heel", "ankle", "throat"], "a": 3, "why": "«Sore throat» — it hurts to swallow."}, {"q": "Which idiom means «very expensive»?", "o": ["get cold feet", "keep an eye on", "cost an arm and a leg", "break a leg"], "a": 2, "why": "«Cost an arm and a leg» means very expensive."}, {"q": "He works … than his brother.", "o": ["hardly", "hardlier", "harder", "more hard"], "a": 2, "why": "«Hard» is a short adverb: harder."}]}, {"n": "133", "t": "Progress Test Units 11 & 12: how to prepare", "g": "You will know what the Units 11–12 progress test checks, how to prepare, and how to reflect on your skills afterwards.", "k": "Unit 12 · Body and mind · Progress Test · Units 11&12", "terms": [["progress test", "контрольна (тематична) робота"], ["task type", "тип завдання"], ["to reflect", "рефлексувати, обмірковувати"], ["to time yourself", "засікати час"], ["strength", "сильна сторона"]], "th": [{"h": "What is tested", "p": ["The progress test checks the language and skills of Units 11 «Life lessons» and 12 «Body and mind». Revise both units, not only the last one."], "ul": ["Vocabulary: education, exams, phrasal verbs for studying, word formation; body parts, injuries, illnesses, body idioms", "Grammar: the causative (have/get something done, have someone do, get someone to do)", "Grammar: adjectives and adverbs, so/such, comparison of adjectives and adverbs", "Reading: multiple choice, gapped text", "Listening: specific information, speakers' attitudes", "Writing: an informal letter or an opinion essay"]}, {"h": "How to prepare", "p": ["Plan your revision for three or four short sessions instead of one long one. Test yourself actively — don't just reread your notes."], "ul": ["Review the Unit 11 and 12 wordlists and your vocabulary notebook.", "Redo the Workbook Review pages (pp. 86–87).", "Write 5 sentences with the causative and 5 with so/such.", "Practise one open cloze: think about the type of word in each gap.", "Write one letter or essay plan in 10 minutes.", "Sleep well before the test — your brain needs rest!"]}, {"h": "Sample task types (practice)", "p": ["Try these short original tasks. Answers: 1 — had my hair cut; 2 — such; 3 — more carefully; 4 — handed in; 5 — the."], "ul": ["1. Rewrite: A hairdresser cut my hair yesterday. → I …", "2. It was … a long run that I needed a rest.", "3. Please drive … (careful) — the road is icy.", "4. I … my homework yesterday. (gave it to the teacher — phrasal verb)", "5. Open cloze: Sleep is one of ___ most important things for your health.", "After the test: Which tasks were easy? Which were difficult? Why?"]}], "f": "", "pr": ["Revise Units 11 and 12 using the checklist in this lesson.", "After the test, write 3 strengths and 2 things you want to improve in English."], "q": ["Which grammar topics are in Units 11 and 12?", "Why is it better to test yourself than to reread notes?", "What two types of writing could be in the test?", "How can you manage your time during a test?"], "qz": [{"q": "Which sentence uses the causative?", "o": ["I cut my hair.", "My hair is long.", "I had my hair cut.", "I was cutting my hair."], "a": 2, "why": "have + object + past participle."}, {"q": "The weather was … bad that we stayed at home.", "o": ["such a", "such", "very", "so"], "a": 3, "why": "so + adjective + that."}, {"q": "She works … than her classmates.", "o": ["more hardly", "hard", "hardest", "harder"], "a": 3, "why": "Comparative of the adverb «hard» is «harder»."}, {"q": "The best way to revise vocabulary is to …", "o": ["learn everything the night before", "read the list once", "skip difficult words", "test yourself regularly"], "a": 3, "why": "Active self-testing helps you remember better."}, {"q": "I … my ankle playing volleyball.", "o": ["attended", "caught", "failed", "sprained"], "a": 3, "why": "We sprain an ankle."}, {"q": "Choose the correct word: My essay needs … (check).", "o": ["to checking", "checking", "check", "checked"], "a": 1, "why": "need + -ing has a passive meaning."}, {"q": "What should you do if you don't know an answer in the test?", "o": ["Ask your neighbour", "Make a sensible guess and move on", "Leave it empty", "Stop the test"], "a": 1, "why": "An empty answer gets no points; a sensible guess might."}]}]}, {"name": "Semester 2 review and assessment", "lessons": [{"n": "134", "t": "Semester 2 review: key grammar and vocabulary (Units 7–12)", "g": "You will revise the main grammar, vocabulary and skills of semester 2 and prepare for the semester tests.", "k": "Semester 2 assessment", "terms": [["semester test", "семестрова контрольна робота"], ["to summarise", "підсумовувати"], ["reported speech", "непряма мова"], ["the passive", "пасивний стан"], ["modal verbs", "модальні дієслова"], ["past perfect", "минулий доконаний час"]], "th": [{"h": "Grammar of semester 2", "p": ["In semester 2 you studied Units 7–12. Go through each grammar point and write one example of your own for each."], "ul": ["Unit 7: past perfect simple / continuous; question tags; subject and object questions — She had already left. You're coming, aren't you? Who called you?", "Unit 8: modals and semi-modals — must, have to, should, can, be able to, might", "Unit 9: the passive; passive with modals; by and with — The app was created in 2020. It can be downloaded for free.", "Unit 10: reported speech — She said (that) she was tired. He asked if I was ready.", "Unit 11: the causative — I had my bike repaired.", "Unit 12: adjectives/adverbs, so/such, comparison — such a long day, more carefully"]}, {"h": "Vocabulary topics", "p": ["Review your vocabulary notebook by topic. Choose 5 words from each topic you find difficult and make sentences with them."], "ul": ["Unit 7 — travel and holidays", "Unit 8 — free time and hobbies", "Unit 9 — technology and the digital world", "Unit 10 — film, TV and entertainment", "Unit 11 — education and learning", "Unit 12 — body, health, injuries and illnesses"]}, {"h": "Practice: quick mixed task", "p": ["Complete the sentences. Answers are in brackets."], "ul": ["When we arrived, the film … already … (start). (had started)", "This bridge … in 1990. (build — passive) (was built)", "«I'm busy,» she said. → She said she … busy. (was)", "You … wear a helmet — it's the rule. (must / have to)", "I … my eyes tested last week. (had)", "It was … an exciting match! (such)"]}, {"h": "Self-assessment checklist", "p": ["Tick what you can do. Revise the points you can't tick yet."], "ul": ["I can talk about past events using the past perfect.", "I can use the passive and reported speech correctly.", "I can understand the main idea and details of a B1 text.", "I can write an informal letter and an opinion essay.", "I can compare photos and give my opinion with reasons.", "I know the key words of all six units."]}], "f": "", "pr": ["Prepare for the semester tests: revise grammar and vocabulary from Units 7–12 using this lesson's checklist.", "Write 12 sentences — two for each unit's grammar point from semester 2."], "q": ["Which grammar point from semester 2 is the most difficult for you?", "How do you change «I am tired» into reported speech?", "How do you form the passive in the past simple?", "Which writing types did you study this semester?"], "qz": [{"q": "By the time I got to the station, the train …", "o": ["was leaving", "had left", "left", "has left"], "a": 1, "why": "The past perfect shows an action before another past action."}, {"q": "This museum … in the 19th century.", "o": ["has built", "was built", "built", "is building"], "a": 1, "why": "Passive past simple: was + past participle."}, {"q": "She said, «I like pizza.» → She said that she … pizza.", "o": ["will like", "liked", "is liking", "likes"], "a": 1, "why": "In reported speech the present simple usually changes to the past simple."}, {"q": "You're from Rivne, … ?", "o": ["are you", "don't you", "isn't it", "aren't you"], "a": 3, "why": "A positive sentence with «are» takes the negative tag «aren't you»."}, {"q": "Students … use phones during the test. It's not allowed.", "o": ["don't have to", "can", "mustn't", "needn't"], "a": 2, "why": "«Mustn't» means it is forbidden."}, {"q": "I'm going to have my room … next week.", "o": ["painted", "paint", "painting", "to paint"], "a": 0, "why": "The causative needs the past participle."}, {"q": "She runs … than her brother.", "o": ["fast", "more fast", "faster", "fastest"], "a": 2, "why": "Comparative of the adverb «fast»: faster."}, {"q": "He asked me where I … .", "o": ["live", "did I live", "lived", "do live"], "a": 2, "why": "Reported questions use statement word order and backshift: where I lived."}]}, {"n": "135", "t": "Semester 2 test: Reading", "g": "You will know what t
