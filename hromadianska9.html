.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}

.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}

.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}

{info:`<h4>Різноманітність культур</h4>
<p><b>Культура</b> – це система цінностей, норм і моделей поведінки, спільних для людей, пов’язаних певним способом життя. Усі люди мають однакові базові потреби (згадайте Піраміду Маслоу), тож стикаються з однаковими проблемами; кожне суспільство робить власний відбір шляхів їх розв’язання і створює власну унікальну культуру.</p>
<h4>Вплив культурних відмінностей на взаємини</h4>
<p>Коли зустрічаються носії різних культур, спершу помітні відмінності в <b>матеріальній</b> культурі (архітектура, одяг, транспорт), згодом – у <b>нематеріальній</b> (мова, цінності, звичаї, традиції, закони).</p>
<ul><li><b>Етноцентризм</b> – тенденція оцінювати звичаї, норми і цінності інших культур з позиції сприйняття власної культури як центральної. Він має позитивну сторону («соціальний клей», що згуртовує спільноту) і негативну: з етноцентризмом – як із сіллю: без неї не можна, але й пересолювати не варто.</li>
<li><b>Ксенофобія</b> (від грец. «ксенос» – чужий і «фобос» – страх) – страх і неприйняття чужих звичаїв, інакших людей; різновиди – расизм, гомофобія тощо.</li>
<li><b>Шовінізм</b> – визнання всіх інших культур і народів нижчими, малозначущими порівняно зі своїми. Слово – від прізвища Ніколя Шовена, персонажа комедії братів Коньяр «Триколірна кокарда» (1831).</li>
<li><b>Культурний імперіалізм</b> – нав’язування однією культурою своїх цінностей іншій.</li>
<li><b>Культурний релятивізм</b> (від лат. relativus – «відносний») – переконаність у тому, що оцінка окремого елемента культури можлива тільки в рамках тієї культури, з якої він походить.</li></ul>
<p>Приклади: суперечка про традиційну їжу під час Чемпіонату світу з футболу 2002 р. (Японія і Південна Корея); повстання сипаїв в Індії (1857–1859) через зневажання культурної специфіки (змащені патрони до гвинтівок Енфілд).</p>
<h4>Релігійні та конфесійні особливості</h4>
<p>З латини <b>religio</b> означає «зв’язок» (з Богом). Чотири релігійні системи – <b>християнство, іслам, індуїзм і буддизм</b> – охоплюють понад <b>77 %</b> населення планети. <b>Конфесії</b> – напрямки в межах релігій: у християнстві – православ’я, католицизм, протестантизм; в ісламі – суннізм, шиїзм. Релігія може об’єднувати або роз’єднувати; важливо зосереджуватися на спільних рисах: прагненні миру, духовного розвитку, справедливості, любові до ближнього.</p>
<p><b>Світський світогляд</b> може бути атеїстичним (заперечує існування Бога), агностичним (існування Бога не може бути доведено або спростовано) або деїстичним (Бог існує, але не втручається в світ).</p>
<h4>Повага до звичаїв і традицій інших спільнот</h4>
<p>Традиційні суспільства ділили людей на «своїх» і «чужих». Нині повага до звичаїв інших – не просто ввічливість, а необхідність. <b>16 листопада 1995 р.</b> Генеральна конференція ЮНЕСКО затвердила <b>«Декларацію принципів толерантності»</b> (підписана в Парижі 185 державами, включаючи Україну): «Толерантність – це повага, прийняття і правильне розуміння багатого різноманіття культур нашого світу, наших форм самовираження і способів проявів людської індивідуальності». Толерантність – це гармонія в різноманітті.</p>`,

{info:`<h4>Соціальне життя — безперервний процес оновлення</h4>
<p>Спершу суспільні зміни відбувалися дуже повільно; лише від початку <b>промислової революції</b> (приблизно із середини XVIII ст.) соціальні зміни стали постійними. Американський учений <b>Елвін Тоффлер</b>: якщо 50 тисяч років історії поділити на відтинки по 60 років, отримаємо близько 800 відтинків; 650 з них минули в печерах, писемність – лише в останніх 70, друковане слово – в останніх 9, електричне освітлення – в останніх двох. Не всі суспільства постійно розвиваються – деякі переживають застій або занепад.</p>
<h4>Роль індивіда в суспільстві</h4>
<p>Головним чинником соціальних змін виступають <b>особистості</b>; діють також економічні, політичні, культурні, природні фактори. Лідери надихають людей, формують громадську думку, мобілізують маси. Приклади: Ян Гус, Тарас Шевченко, Мартін Лютер Кінг, В’ячеслав Чорновіл. Важливо, щоб особистості, які прагнуть змін, керувалися високими моральними принципами.</p>
<h4>Громадянська відповідальність</h4>
<p><b>Громадянська відповідальність</b> – свідоме ставлення особистості до своїх обов’язків перед суспільством та державою: від відносно пасивної поведінки (дотримання законів, сплата податків) до активної участі (вибори, громадські організації, волонтерство).</p>
<p>Значення: 1) забезпечує стабільність і порядок; 2) сприяє розвитку демократії; 3) допомагає вирішувати соціальні проблеми; 4) формує громадянську ідентичність.</p>
<p>Чому долучатися до громадського життя: <b>кожен голос має значення</b>; <b>зміни починаються з себе</b> (толока, звернення, петиція, власний проєкт); <b>розвиток громадянської свідомості</b> (аналіз, критичне мислення, аргументація, компроміс); <b>досвід для майбутнього</b>.</p>
<h4>Добрі практики</h4>
<p>Відповідальними громадянами не народжуються, а стають під впливом суспільства. Добрі практики: дотримання правил дорожнього руху, бережне ставлення до громадського майна, сортування сміття, економія води й електроенергії; <b>волонтерство</b> (допомога захисникам і внутрішньо переміщеним особам); шкільні екологічні гуртки, благодійні концерти, толоки; онлайн-петиції; локальні ініціативи (дитячі майданчики, освітлення); <b>контроль за діяльністю влади</b> (сесії місцевих рад, громадські слухання, моніторинг обіцянок, контроль бюджетних коштів).</p>`,
terms:[["Соціальні зміни","безперервний процес оновлення суспільного життя"],["Цінності","загальновизнані переконання щодо цілей, до яких суспільство, усі його члени повинні прагнути"],["Громадянська відповідальність","свідоме ставлення особистості до своїх обов’язків перед суспільством та державою"],["Громадянська свідомість","розвивається через участь у громадських справах; допомагає розуміти, як влаштоване суспільство і як розв’язувати його проблеми"],["Добрі практики","конкретні дії, у яких виявляється активна громадянська позиція"]],

{info:`<h4>Державний бюджет</h4>
<p><b>Державний бюджет</b> – план доходів і видатків держави на календарний рік; головний фінансовий документ країни. Його порівнюють із сімейним бюджетом, але він охоплює потреби мільйонів громадян.</p>
<ul><li><b>Доходи</b> – податки, збори, доходи від державного майна; <b>видатки</b> – освіта, охорона здоров’я, оборона, соціальний захист.</li>
<li>Бюджет затверджує <b>Верховна Рада України у формі закону</b>; контроль – Верховна Рада безпосередньо та через <b>Рахункову палату</b>.</li>
<li>Бюджет буває <b>збалансованим</b> (доходи = видатки), <b>дефіцитним</b> (видатки перевищують доходи) або <b>профіцитним</b> (доходи перевищують видатки).</li></ul>
<h4>Як держава фінансує свої програми</h4>
<p>Бюджетні кошти; позабюджетні фонди (Пенсійний фонд України); міжнародна допомога (Світовий банк, МВФ, ЄС); державно-приватне партнерство. Важлива прозорість використання коштів.</p>
<h4>Роль податків</h4>
<p><b>Податки</b> – обов’язкові платежі, які кожен громадянин і бізнес сплачують державі для спільного блага; основне джерело доходів бюджету. Регулює – <b>Податковий кодекс України</b>.</p>
<table class="tbl"><tr><th>Податок</th><th>Ставка / об’єкт</th></tr>
<tr><td>ПДФО (прямий)</td><td>18 % з доходів громадян</td></tr>
<tr><td>Військовий збір</td><td>5 % з доходів</td></tr>
<tr><td>ПДВ (непрямий)</td><td>20 % від вартості більшості товарів і послуг</td></tr>
<tr><td>Акцизний податок</td><td>тютюн, алкоголь, пальне</td></tr>
<tr><td>Мито</td><td>товари, що ввозяться з інших країн</td></tr>
<tr><td>Місцеві податки</td><td>на нерухомість, землю, транспорт, єдиний податок</td></tr></table>
<p>Ухилення від сплати податків – правопорушення (ст. 212 ККУ).</p>
<h4>Місцевий бюджет</h4>
<p><b>Місцевий бюджет</b> – фундамент фінансової самостійності громади; бюджети бувають <b>самостійні</b> і <b>дотаційні</b>. Етапи: планування → громадське обговорення → затвердження (голосують депутати місцевої ради) → виконання → звітність. Участь громадян – через <b>громадський бюджет (бюджет участі)</b>.</p>
<h4>Меценати і спонсори. Підприємництво</h4>
<ul><li><b>Меценат</b> – особа або організація, яка безкорисливо підтримує мистецтво, науку, освіту, культуру (від імені Гая Цільнія Мецената, I ст. до н. е.).</li>
<li><b>Спонсор</b> – особа або компанія, яка надає підтримку, зазвичай в обмін на рекламу або інші вигоди.</li>
<li><b>Підприємницька діяльність</b> – самостійна, ініціативна, систематична діяльність на власний ризик з метою прибутку. В Україні займатися нею можна з <b>16 років</b> (до 18 – за письмовою згодою батьків чи органу опіки).</li></ul>`,

{info:`<h4>Свобода асоціації</h4>
<p><b>Свобода асоціації</b> – право громадян на об’єднання для спільних дій і досягнення спільної мети на умовах дотримання встановлених ними правил. Закріплена у Загальній декларації прав людини 1948 р., Міжнародному пакті про громадянські і політичні права 1966 р., Конвенції про права дитини 1989 р.; в Україні – у <b>статті 36</b> Конституції. Обмеження – у <b>статті 37</b> (в інтересах національної безпеки, громадського порядку, здоров’я населення, прав інших). Закони: «Про громадські об’єднання» (2012), «Про політичні партії в Україні» (2001), «Про основні засади молодіжної політики» (2021).</p>
<ul><li><b>Громадське об’єднання</b> – добровільне об’єднання фізичних та / або юридичних осіб приватного права для здійснення та захисту прав і свобод, задоволення суспільних інтересів. За територією – міжнародні, всеукраїнські, місцеві.</li>
<li><b>Громадська організація</b> – засновники та члени лише фізичні особи; <b>громадська спілка</b> – засновники юридичні особи приватного права.</li>
<li><b>Політична партія</b> – зареєстроване добровільне об’єднання громадян – прихильників певної загальнонаціональної програми, що бере участь у виборах. В Україні – лише із всеукраїнським статусом; членами можуть бути лише громадяни України. За ідеологією: ліві, праві, центристські, націоналістичні, релігійні, екологічні; за роллю – партії влади й опозиційні.</li></ul>
<p>Ст. 37: партії не можуть мати воєнізованих формувань; заборона об’єднань – лише в судовому порядку. Ніхто не може бути примушений до вступу в об’єднання.</p>
<h4>Молодіжні та дитячі організації</h4>
<table class="tbl"><tr><th>Організація</th><th>Вік членів</th></tr>
<tr><td>Дитяча громадська організація</td><td>від 6 до 18 років (засновники – від 14 років)</td></tr>
<tr><td>Молодіжна громадська організація</td><td>від 14 до 35 років</td></tr></table>
<p>Особи старшого чи молодшого віку – не більше 20 % членів; у виборних органах старших – не більше 50 %. Вступ дітей до 14 років – за письмовою згодою батьків.</p>
<h4>Громадська участь, активізм, волонтерство</h4>
<ul><li><b>Активізм</b> – зусилля, спрямовані на просування змін з метою покращення суспільства.</li>
<li><b>Волонтерська діяльність</b> – добровільна, соціально спрямована, безкорислива, неприбуткова діяльність волонтерів (Закон «Про волонтерську діяльність», 2011). Неповнолітні – за згодою батьків і не за всіма напрямками (не в медзакладах, не ЗСУ під час воєнного стану).</li>
<li>Допомога на основі сімейних, дружніх чи сусідських відносин <b>не є волонтерством</b>. Письмовий договір обов’язковий для волонтерів 14–18 років (за бажанням), при відшкодуванні витрат та за окремими напрямками.</li></ul>`,
terms:[["Свобода асоціації","право громадян на об’єднання для спільних дій і досягнення спільної мети"],["Громадське об’єднання","добровільне об’єднання осіб для захисту прав і задоволення суспільних інтересів"],["Громадська організація","громадське об’єднання, засновниками і членами якого є лише фізичні особи"],["Громадська спілка","громадське об’єднання, засновниками якого є юридичні особи приватного права"],["Політична партія","добровільне об’єднання громадян – прихильників загальнонаціональної програми, що бере участь у виборах"],["Активізм","зусилля для просування змін з метою покращення суспільства"],["Волонтерська діяльність","добровільна, безкорислива, неприбуткова діяльність з надання волонтерської допомоги"]],

{info:`<h4>Що таке корупція?</h4>
<p><b>Корупція</b>, у найширшому розумінні, – використання людиною наданих їй владних повноважень та спеціальних можливостей на посаді для отримання особистої вигоди. Може існувати в державі, бізнесі, ЗМІ, громадських об’єднаннях.</p>
<ul><li><b>Неправомірна вигода</b> (у народі – хабар) – кошти, майно, переваги, пільги, послуги тощо, які обіцяють, пропонують, надають або одержують без законних підстав.</li>
<li>Найпоширеніша корупція – <b>хабарництво</b>; однаково суворо караються і той, хто дає, і той, хто бере.</li>
<li>Інші правопорушення: зловживання владою, зловживання впливом (посередник), незаконне збагачення, порушення вимог фінансового контролю (декларації), порушення обмежень щодо іншої оплачуваної діяльності.</li></ul>
<p>Нікколо Макіавеллі порівнював корупцію з <b>туберкульозом</b>: спочатку її важко розпізнати, але легше лікувати. <b>9 грудня</b> – Міжнародний день боротьби з корупцією (2003 р., Мексика – відкрита для підписання Конвенція ООН проти корупції). Корупція підриває довіру до держави, сповільнює економіку, посилює нерівність.</p>
<h4>Виявлення, протидія і запобігання</h4>
<p><b>Доброчесність</b> – морально-етична складова діяльності державного службовця, що базується на чесності. «Доброчесність — це чинити правильно, навіть коли на тебе ніхто не дивиться» (О. Новіков). Акти: Конвенція ООН проти корупції (2003), Закон «Про запобігання корупції» (2014), Кримінальний кодекс, КУпАП. Повідомити може будь-хто, зокрема анонімно (Єдиний портал повідомлень викривачів).</p>
<p>Відповідальність: <b>кримінальна, адміністративна, цивільно-правова, дисциплінарна</b>.</p>
<ul><li><b>Корупційний ризик</b> – імовірність вчинення корупційного правопорушення.</li>
<li><b>Конфлікт інтересів</b> – суперечність між особистими інтересами особи та її службовими повноваженнями.</li></ul>
<h4>Система антикорупційних органів</h4>
<table class="tbl"><tr><th>Орган</th><th>Функція</th></tr>
<tr><td>НАБУ</td><td>розслідує корупційні правопорушення вищих посадових осіб</td></tr>
<tr><td>САП</td><td>нагляд за розслідуванням НАБУ, державне обвинувачення</td></tr>
<tr><td>НАЗК</td><td>формує антикорупційну політику, моніторинг</td></tr>
<tr><td>Нацполіція, ДБР</td><td>розслідування корупції, зокрема на місцевому рівні</td></tr>
<tr><td>СБУ</td><td>корупційні злочини щодо державної безпеки</td></tr>
<tr><td>ВАКС</td><td>вищий спеціалізований суд, розглядає справи про корупцію</td></tr></table>
<p>Також діють <b>антикорупційні уповноважені</b> – первинна ланка антикорупційної інфраструктури.</p>`,

{info:`<h4>Поняття і види звернень громадян</h4>
<p>Право на звернення закріплене у <b>ст. 40</b> Конституції України; порядок визначає Закон <b>«Про звернення громадян» (2 жовтня 1996 р.)</b>.</p>
<p><b>Звернення громадян</b> – узагальнена назва письмових або усних пропозицій (зауважень), заяв (клопотань) і скарг.</p>
<ul><li><b>Пропозиція (зауваження)</b> – порада, рекомендація щодо діяльності органів влади, думки щодо врегулювання суспільних відносин.</li>
<li><b>Заява (клопотання)</b> – прохання про сприяння реалізації прав та інтересів або повідомлення про порушення законодавства; <b>клопотання</b> – прохання про визнання статусу, прав чи свобод.</li>
<li><b>Скарга</b> – вимога про поновлення прав і захист законних інтересів, порушених діями (бездіяльністю), рішеннями органів чи посадових осіб.</li></ul>
<p>Іноземці, які законно перебувають в Україні, мають таке саме право.</p>
<h4>Вимоги, порядок і терміни розгляду</h4>
<ul><li>Звернення – <b>усні</b> (особистий прийом, гарячі лінії) або <b>письмові</b> (пошта, особисто, електронне звернення).</li>
<li>Має містити суть питання, ПІБ, місце проживання; письмове – підпис і дату.</li>
<li>Неналежно оформлене повертають не пізніше як через <b>10 днів</b>.</li>
<li>Строк розгляду – <b>не більше одного місяця</b>; без додаткового вивчення – не пізніше <b>15 днів</b>; загалом – не більше <b>45 днів</b>.</li>
<li>Не за компетенцією – пересилають за належністю впродовж <b>5 днів</b>. Плата за розгляд не стягується.</li>
<li>Не розглядаються: анонімні; без суті питання; повторні з того самого вирішеного питання; скарги з пропущеним строком; від недієздатних осіб.</li></ul>
<h4>Електронні петиції</h4>
<p>Особлива форма колективного звернення до Президента, Верховної Ради, Кабінету Міністрів, органу місцевого самоврядування. Оприлюднюють протягом <b>2 робочих днів</b>. Петицію до Президента, ВРУ, КМУ розглядають, якщо зібрано <b>не менш як 25 000 підписів</b> протягом <b>не більше трьох місяців</b>; розгляд – не пізніше 10 робочих днів. Для місцевих петицій кількість підписів визначає статут громади.</p>
<h4>Анонімні звернення. Викривачі</h4>
<p><b>Анонімне звернення</b> – без місця проживання, без підпису, або з якого неможливо встановити авторство; зазвичай не розглядається. Виняток – повідомлення про корупцію з конкретною перевірюваною інформацією. <b>Викривач</b> – особа, яка переконана в достовірності інформації, має перевірювані факти і дізналася про них у зв’язку з трудовою, професійною, громадською, навчальною діяльністю. З <b>2023 р.</b> працює «Єдиний портал повідомлень викривачів».</p>`,

<h4>Активне і пасивне виборче право</h4>
<p><b>Вибори</b> – передбачене Конституцією та законами волевиявлення народу з метою формування органів влади шляхом голосування. <b>Представницькі органи</b> – виборні колегіальні органи (Верховна Рада, місцеві ради); Президент не є представницьким органом у класичному розумінні, бо він одноосібний.</p>

<li><b>Пасивне виборче право</b> – право бути обраним («Мене обирають»).</li></ul>
<p><b>Ценз</b> (лат. censeo – «роблю перепис») – умови, що обмежують коло осіб, які мають право брати участь у виборах. Історичні (скасовані): майновий, статевий, освітній. Нині: ценз громадянства, віковий, осілості.</p>

<p>Вільні вибори; загальність; рівне виборче право (кожен виборець має <b>лише один голос</b>); пряме виборче право; таємне голосування (закрита кабінка); вільне і рівноправне висунення кандидатів; свобода агітації; гласність і відкритість; чесність виборів.</p>
<h4>Виборчі системи</h4>

<li><b>Пропорційна</b> – мандати розподіляють між партіями відповідно до кількості отриманих голосів.</li>
<li><b>Змішана</b> – поєднує обидві.</li></ul>
<h4>Законодавство України про вибори</h4>
<p>Виборчий кодекс України (19 грудня 2019 р.). Мажоритарна система – вибори Президента, голів громад, депутатів рад у громадах до 10 000 виборців; пропорційна – вибори народних депутатів, обласних, районних рад і міських рад у громадах понад 10 000 виборців. Чергові вибори до ВРУ – остання неділя жовтня п’ятого року повноважень; Президента – остання неділя березня п’ятого року. Цікаво: вибори до Галицького сейму 1861 р.; 2019 р. – рекорд, 39 кандидатів у Президенти; «день тиші».</p>`,

{info:`<h4>Способи захисту прав</h4>
<p>«... Необхідно, щоб права людини охоронялися силою закону...» (Загальна декларація прав людини, 10 грудня 1948 р.). <b>Механізм захисту прав людини</b> – забезпечені державою можливості виконання громадянами певних дій, завдяки яким можна захистити свої права, свободи та законні інтереси.</p>
<p>В Україні захист можливий: 1) шляхом самозахисту; 2) зверненням до державних органів; 3) індивідуальними чи колективними письмовими зверненнями; 4) зборами, мітингами, походами, демонстраціями, страйками; 5) через громадські формування (адвокатура, система безоплатної правничої допомоги, правозахисні організації).</p>
<h4>Як держава забезпечує захист прав</h4>
<p><b>Зобов’язання держави в галузі прав людини</b> – комплекс заходів та обов’язків держави для забезпечення прав і свобод людини.</p>
<ul><li><b>Позитивні</b> – обов’язки застосовувати потрібні засоби для гарантування прав (санкції до порушників, юридичні правила).</li>
<li><b>Негативні</b> – утримуватися від дій, спрямованих на порушення або незаконне обмеження прав.</li></ul>
<p>Навіть в умовах воєнного або надзвичайного стану не можуть бути обмежені: право на життя, на повагу до гідності, на свободу та особисту недоторканність, право не бути підданим катуванню, право на судовий захист.</p>
<h4>Система судів та правоохоронних органів</h4>
<p><b>Суди</b> – державні органи судової гілки влади, що забезпечують справедливість при розгляді справ і спорів. Принципи: <b>територіальності, спеціалізації, інстанційності</b>. Закон «Про судоустрій і статус суддів» (2 червня 2016 р.). Система: місцеві (окружні) суди → апеляційні суди → вищі спеціалізовані суди (Вищий антикорупційний суд – з 2019 р.; Вищий суд з питань інтелектуальної власності – формується) → <b>Верховний Суд</b>. Створення надзвичайних та особливих судів не допускається.</p>
<p><b>Правоохоронні органи</b> – система державних органів для захисту прав і свобод, забезпечення законності і правопорядку: Національна поліція (координує КМУ через міністра внутрішніх справ), СБУ, Прокуратура (Офіс Генерального прокурора), ДБР (злочини високопосадовців, військові злочини), НАБУ.</p>
<p>Також: <b>Конституційний Суд України</b> і <b>Уповноважений Верховної Ради України з прав людини (омбудсмен)</b> – до нього може звернутися будь-яка особа, чиї права порушено органами влади.</p>
<h4>Роль міжнародних організацій</h4>
<p>Якщо громадянин використав усі національні засоби захисту і не домігся справедливого рішення, він може звернутися до <b>Європейського суду з прав людини</b>. А. Дробович: «держава заради людини» – це умова щастя.</p>`,
terms:[["Механізм захисту прав людини","забезпечені державою можливості дій для захисту своїх прав, свобод та законних інтересів"],["Позитивні зобов’язання держави","обов’язки застосовувати засоби для гарантування прав людини"],["Негативні зобов’язання держави","утримуватися від дій, що порушують або незаконно обмежують права"],["Суди","державні органи судової влади, що забезпечують справедливість при розгляді справ і спорів"],["Правоохоронні органи","система державних органів для захисту прав і свобод, законності і правопорядку"],["Омбудсмен","Уповноважений Верховної Ради України з прав людини"]],

{info:`<p>«Інтернет — це не просто технологія, це новий спосіб існування людства» (Тім Бернерс-Лі).</p>
<h4>Інтернет і право</h4>
<p>Інтернет не є «вільною територією» без правил: усі дії в мережі регулюються правовими нормами. Кожен має право на свободу слова, доступ до інформації та приватність; заборонено поширювати небезпечний контент, заклики до насильства чи дискримінації. <b>Анонімність в інтернеті є відносною</b>; користувачі несуть юридичну відповідальність (штрафи, кримінальна відповідальність за кіберзлочини).</p>
<h4>Кібербезпека, захист персональних даних</h4>
<ul><li><b>Кібербезпека</b> – захист цифрових систем, мереж і даних від кіберзагроз (фішинг, шкідливе ПЗ, крадіжка даних, кібербулінг).</li>
<li><b>Персональні дані</b> – будь-яка інформація, що дозволяє ідентифікувати особу (ім’я, адреса, телефон, фото, e-mail, IP-адреса) – «цифрове золото сучасності». Закон «Про захист персональних даних», європейський регламент GDPR.</li>
<li><b>Фішинг</b> – онлайн-шахрайство з метою викрадення конфіденційних даних (логіни, паролі, номери карток, CVV): фальшиві листи, SMS, фейкові сайти. За даними кіберполіції, щодня – понад 100 випадків інтернет-шахрайства.</li></ul>
<p>Правила: надійні паролі та двофакторна автентифікація (2FA); не поширювати особисту інформацію; перевіряти налаштування приватності; обережно з покликаннями й вкладеннями; оновлювати ПЗ й антивірус.</p>
<h4>Інтелектуальна власність. Авторське право</h4>
<p><b>Інтелектуальна власність</b> охоплює <b>промислову власність</b> (патенти, торговельні марки, промислові зразки, географічні зазначення – треба реєструвати) та <b>авторське право і суміжні права</b> (літературні, художні, музичні, наукові твори, фото, фільми).</p>
<p>Авторське право захищає <b>форму вираження</b>, а не ідею; діє протягом життя автора <b>+ 70 років</b>; виникає <b>автоматично</b> з моменту створення твору (реєстрація не обов’язкова, але корисна). Винятки: цитування, освітні цілі, «добропорядне використання»; ліцензії <b>Creative Commons</b>. Винагорода автору – роялті.</p>
<h4>Академічна доброчесність</h4>
<p><b>Академічна доброчесність</b> – сукупність етичних принципів та правил для учасників освітнього процесу; базується на чесності, повазі до чужої праці та відповідальності за власні результати. Порушення (списування, <b>плагіат</b>, купівля готових робіт) – незадовільна оцінка, повторне виконання, дисциплінарні стягнення.</p>`,
terms:[["Віртуальне спілкування","спілкування через соцмережі, месенджери, електронну пошту, відеодзвінки"],["Кібербезпека","захист цифрових систем, мереж і даних від кіберзагроз"],["Персональні дані","будь-яка інформація, що дозволяє ідентифікувати особу"],["Фішинг","онлайн-шахрайство з метою викрадення конфіденційних даних"],["Авторське право","право автора визначати, як використовуватиметься його твір"],["Інтелектуальна власність","права на результати розумової, творчої діяльності людини"],["Академічна доброчесність","етичні принципи та правила для учасників освітнього процесу"],["Автор","особа, яка створила твір"]],

{info:`<h4>Неформальне і формальне спілкування</h4>
<table class="tbl"><tr><th></th><th>Неформальне (міжособистісне, неофіційне)</th><th>Формальне (офіційне, рольове)</th></tr>
<tr><td>Суть</td><td>залежить від індивідуальних особливостей; кожен сприймає іншого як унікальну індивідуальність</td><td>визначається соціальними ролями (учитель – учениця, лікарка – пацієнт)</td></tr>
<tr><td>Риси</td><td>невимушеність, емоційність, приватність</td><td>дії в межах ролі, іноді приховуючи емоції</td></tr>
<tr><td>Стиль</td><td>розмовно-побутовий: усна форма, спонтанний діалог, просторіччя («крутий», «відстій»)</td><td>офіційно-діловий: ділове листування, нормативні акти, доповідь, переговори</td></tr></table>
<p>Приклади з літератури: Сергій Жадан «Гімн демократичної молоді» (неформальне), Іван Франко «Перехресні стежки» – «Дозвольте відрекомендуватися…» (формальне).</p>
<h4>Діловий етикет</h4>
<p><b>Етикет</b> – сукупність правил поведінки, що регулюють зовнішні прояви взаємин між людьми (від фр. étiquette – картки з правилами на прийомах Луї XIV). Різновиди: дипломатичний, загальногромадський, службовий, професійний, діловий.</p>
<p><b>Діловий етикет</b> – сукупність правил поведінки, які регулюють спілкування та взаємодію в діловій сфері. Принципи: повага до всіх; <b>пунктуальність</b>; чітке, грамотне мовлення без сленгу; конфіденційність ділової інформації; відповідальність за свої слова і дії.</p>
<h4>Дрескод</h4>
<p><b>Дрескод</b> (англ. dress code – «кодекс одягу») – форма одягу, якої належить дотримуватися під час відвідування певних заходів, закладів та урочистих подій. Дрескоди символізують статус, заняття (халат лікаря, однострій), віросповідання (хіджаб, тюрбан сикха), національну ідентичність (вишиванка), сімейний стан (обручка). Шкільна форма – теж дрескод; в Україні у <b>2019 р.</b> обов’язкову шкільну форму скасовано.</p>
<h4>Культурні контексти у спілкуванні</h4>
<p>Варто враховувати символи, стереотипи, упередження, національний мовленнєвий етикет, <b>невербальні коди комунікації</b>, а також відмінності за статтю, віком, професією (фаховий жаргон). В українській культурі підліток – 12–16 років; паспорт – з 14, повноліття – з 18; англ. teenager – 13–19 років; американське повноліття – 21 рік. Правила: поважайте гідність кожного; вивчайте культуру; запитуйте; визнавайте помилки; будьте відкритими і толерантними; висловлюйтеся чітко.</p>`,

{info:`<h4>Техніки розв’язання конфліктів</h4>
<p><b>Конфлікт</b> (лат. conflictus – «зіткнення», «сутичка») – зіткнення протилежних цілей, позицій і поглядів суб’єктів соціальної взаємодії.</p>
<table class="tbl"><tr><th>Техніка</th><th>Суть</th></tr>
<tr><td>Співпраця (кооперація)</td><td>пошук рішень, що максимально задовольняють обидві сторони; перетворити опонентів на партнерів; <b>найефективніша, але потребує значних зусиль</b></td></tr>
<tr><td>Уникнення</td><td>«Краще уникнути сварки, ніж її виграти»; доречне, коли привід незначний; але може накопичувати напругу</td></tr>
<tr><td>Компроміс</td><td>взаємні поступки; «золота середина», але обидві сторони часто незадоволені</td></tr>
<tr><td>Примирення і поступки</td><td>одна сторона відмовляється від вимог заради добрих взаємин</td></tr>
<tr><td>Конкуренція</td><td>може стимулювати рішення, але здатна загострити протистояння</td></tr></table>
<p><b>Етапи розв’язання конфлікту</b>: відмова від захисних механізмів → виявлення суті проблеми → відмова від установки «тільки перемога» → знаходження кількох можливих рішень → оцінка варіантів і вибір кращого.</p>
<h4>Основи переговорного процесу</h4>
<p>Принципи успішних переговорів: <b>підготовка</b>; <b>вміння слухати</b> (переговори – діалог, а не монолог); <b>пошук спільних інтересів</b>; <b>компроміс</b> («Успішні переговори – це завжди компроміс»); <b>збереження спокою</b>.</p>
<p>Підготовка: чітко сформулювати мету (кількісно вимірну), розбити її на завдання, визначити пріоритети; зібрати інформацію про співрозмовника і предмет; напрацювати стратегію (межі поступок, альтернативи) і тактику; психологічна підготовка; репетиція.</p>
<h4>Як досягти згоди</h4>
<p>Прості кроки до згоди: 1) зрозумійте, чого хочете ви і чого хочуть інші; 2) слухайте уважно; 3) шукайте спільне, а не тільки відмінне; 4) будьте готові поступитися; 5) зберігайте спокій; 6) спробуйте знайти кілька рішень.</p>`,

{info:`<p>«Майбутнє світу належить молоді...» (Джавахарлал Неру). «Найкращий спосіб передбачити майбутнє — це створити його» (Пітер Друкер).</p>
<h4>Якими ми хочемо бачити свою державу, громаду, родину?</h4>
<p><b>Молодь</b> – соціально-демографічний прошарок людей у структурі суспільства за віковим критерієм. ООН: від <b>15 до 24 років</b>; в Україні (Закон «Про основні засади молодіжної політики», 2021 р.) – громадяни віком від <b>14 до 35 років</b>.</p>
<p>Молодь – найперспективніша та найенергійніша частина суспільства: Студентська революція на граніті, Помаранчева революція, Євромайдан. Ідеальне майбутнє варто уявляти з урахуванням фундаментальних цінностей (демократія, верховенство права, права людини, гідність, свобода, відповідальність, рівність, справедливість, патріотизм), власної ідентичності, сучасних викликів і можливостей.</p>
<h4>Що ми можемо зробити для розвитку держави і суспільства?</h4>
<p>Від щоденних дій (сортувати сміття, дотримуватися правил) і місцевих ініціатив (прибирання, висаджування дерев, допомога вразливим) – до відповідального громадянства (вибори, сплата податків, громадянська позиція, громадські обговорення). Ключова навичка – робота в команді.</p>
<p><b>Молодіжна політика</b> – напрямок державної політики, спрямований на створення умов і гарантій для соціалізації та інтеграції дітей і молоді в суспільні процеси. Завдання: залучення молоді до суспільного життя і ухвалення рішень; підтримка соціально-економічного потенціалу; формування громадянської, національної та культурної ідентичності; розвиток молодіжних об’єднань і центрів; молодіжна інфраструктура; міжнародне співробітництво.</p>

  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${s.lab||"★"}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("go9_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Громадянська освіта 9`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("go9_theme",d.dataset.theme); }
const th=store.get("go9_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
