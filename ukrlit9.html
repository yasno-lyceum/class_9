<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Українська література · 9 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
.box h4{font:700 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.tbl{display:table}
@media(max-width:640px){.tbl{display:block;overflow-x:auto}}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.note{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--line,#ccc);background:rgba(127,127,127,.08);font-style:italic;font-size:14px;opacity:.9;border-radius:6px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>
</head>

{info:`<h4>Художність у мистецтві</h4>
<p>Кожний митець має свій смак, життєвий і професійний досвід, по-своєму дивиться на світ. Тут важливу роль відіграє <b>художність</b> – складне поєднання творчих і професійних якостей, що визначають кінцевий результат праці творця; їй властивий артистизм. Предметом мистецтва є людина та її дійсність; їх розкривають за допомогою художніх образів, створенню яких сприяє органічне поєднання змісту та форми.</p>
<h4>Зміст мистецького твору</h4>
<p><b>Зміст</b> – творчо відображена митцем художня дійсність (мистецтво суб’єктивне). Складники змісту:</p>
<ul><li><b>Тема</b> – події, життєві явища, зображені у творі (про що твір).</li>
<li><b>Ідея</b> – думка автора про зображене (що автор хотів сказати).</li></ul>
<p>Приклад: весна в картинах С. Боттічеллі, Дж. Арчімбольдо, С. Васильківського, К. Білокур.</p>

{info:`<h4>Художній аналіз літературного твору</h4>
<p><b>Художній аналіз</b> – детальний розгляд твору, що передбачає розчленування його на складові частини (композиція, персонажі, мова) і з’ясування взаємодії між ними для кращого розуміння та інтерпретації.</p>

<h4>Композиція</h4>

<li>У ліриці – етапи розгортання почуттів: вихідний момент, розвиток, кульмінація, резюме.</li></ul>
<h4>Конфлікт</h4>
<p><b>Конфлікт</b> – протистояння інтересів, боротьба героїв, думок, емоцій або принципів. Додає напруження, розвиває дію, розкриває характери. Буває <b>зовнішній</b> (з ворогом чи соціальною системою) і <b>внутрішній</b> (дилема героя між добром і злом, боротьба зі своїми страхами).</p>

{info:`<h4>Модернізм як стиль доби й мистецький напрям</h4>
<p>На межі ХІХ–ХХ ст. утверджується новий тип світосприйняття – <b>модернізм</b>. Людину вже не задовольняли відповіді реалізму; відкриття природничих наук спростували давні уявлення про світ. Людина хотіла бути вільною, мати право вибору, виявляти неповторність. На перший план – особистість зі складним внутрішнім світом. Модернізуються всі сфери: хмарочоси, автомобіль (1886), літак (1903), психоаналіз З. Фрейда.</p>
<h4>Ознаки модернізму</h4>
<ul><li>інтуїтивний спосіб осягнення світу разом із логічним;</li>
<li>індивідуалізм – зосередження на «Я»;</li>
<li>заперечення залежності характеру лише від зовнішніх умов;</li>
<li>символ як засіб осягнення світу;</li>
<li>потужний ліризм; глибокий естетизм (важливо, <i>як</i> сказати);</li>
<li>культ сили волі, активності; ідеологічність.</li></ul>
<h4>Течії модернізму</h4>
<table class="tbl"><tr><th>Течія</th><th>Ознаки</th><th>Представники</th></tr>
<tr><td>Символізм</td><td>знаки-символи («ранок» – молодість, «ніч» – смерть); культ екзотичних тем; витончена форма</td><td>Олександр Олесь, М. Вороний, Б. Лепкий, П. Тичина; М. Жук</td></tr>
<tr><td>Імпресіонізм</td><td>варіації настрою, миттєві враження, розмиті контури, кольорові плями</td><td>М. Коцюбинський, В. Винниченко, М. Хвильовий, Г. Косинка; О. Мурашко, С. Васильківський, А. Куїнджі, І. Труш</td></tr>
<tr><td>Неоромантизм</td><td>внутрішній світ, культ героїзму, сильна особистість, фольклор, екзотизм, контрасти</td><td>Леся Українка, О. Кобилянська, Олександр Олесь, Ю. Яновський</td></tr>

// 4 Олесь – життя, творчість
{info:`<h4>Олександр Олесь (1878–1944)</h4>
<ul><li>Справжнє прізвище – <b>Кандиба</b>. Народився <b>5 грудня 1878 р.</b> на Слобожанщині в с. Кризі (нині м. Білопілля Сумської обл.) у сім’ї службовця з чумацького роду. Батько загинув, упавши з пароплава; дід виховував в українському дусі.</li>
<li>Хліборобська школа в Дергачах; з 1903 р. – Харківський ветеринарний інститут. Визначальною стала поїздка до Полтави на відкриття пам’ятника І. Котляревському: «…творчість яких так само дорога й рідна мені, як колискова пісня матері».</li>
<li>1906 р. наречена Віра Свадковська лагідно називала його <b>Олесем</b>; 1907 р. – перша збірка «<b>З журбою радість обнялась</b>». Ім’я Олесь стало символом кохання.</li>
<li>Грав на арфі, лірі, кобзі – музикальність поезії; на його вірші писали М. Лисенко, К. Стеценко, Я. Степовий, С. Людкевич.</li>
<li>1919 р. емігрував: Відень, з 1923 р. – Прага. Цикл «Голод», драма «Земля обітована» (1935). Помер <b>22 липня 1944 р.</b> після загибелі сина Олега.</li></ul>
<h4>Поетична спадщина</h4>
<p>Збірки «З журбою радість обнялась» (1907), «Поезії» (1909), «Твори» (1910) – інтимна, пейзажна, громадянська лірика; в еміграції – «Чужиною» (1919), «Кому повім печаль мою» (1931) – ностальгія. Казки для дітей «Грицеві курчата», «Водяничок».</p>
<p>Переважно – <b>неоромантична</b> манера; у деяких творах – <b>символізм</b>. «В обіймах з радістю журба. / Одна летить, друга спиня...» Український символізм тісно переплетений із неоромантизмом.</p>
<p>Громадянська лірика: збірка «<b>Будь мечем моїм!</b>» (1909; цензура – «Поезії. Книга ІІ»); «О слово рідне! Орле скутий!..» – проблема слова, картання колонізаторів і безбатченків; «Айстри» – символ людей, що прагнуть світла й свободи, але зустрічають холодну реальність (після 1905 р.).</p>`,

{info:`<h4>«Чари ночі»</h4>
<p>Класичний зразок любовної лірики; за жанром – <b>романс</b>, став популярною народною піснею (музика В. Безкоровайного; виконували Д. Гнатюк, Н. Матвієнко).</p>
<h4>Теорія літератури. Романс</h4>
<p><b>Романс</b> – музично-поетичний твір для сольного співу з інструментальним акомпанементом; виник у середньовічній Іспанії. Ознаки: інструментальний супровід; інтимні мотиви; романтична настроєвість, напівказкові картини природи; ідеалізація дійсності; поетизація об’єкта кохання.</p>
<h4>Аналіз</h4>
<ul><li><b>Провідний мотив</b>: краса життя, краса кохання – понад усе; влити «струмінь власної душі» в «шумляче море» весни, щастя швидкоплинне.</li>
<li>Ознаки <b>неоромантизму</b>: романтична настроєвість, пейзаж (весняна ніч), активна життєва позиція: «Лови летючу мить життя!»</li>
<li>Ознаки <b>символізму</b>: символи – солов’ї (весна, кохання), іскра (душевна енергія), бенкет весни (буяння життя), Фауст (минущість); естетство.</li>
<li>Паралелізм «людина – природа»: «Сміються, плачуть солов’ї / І б’ють піснями в груди».</li>
<li>Персоніфікації: «земля тремтить в палких обіймах ночі», «бенкет весна справляє».</li>
<li><b>Антитеза</b>: «Гори! — життя єдина мить, / Для смерті ж — вічність ціла».</li>
<li>Порівняння: «Як Фауст, дні минулі...»; повтор «Цілуй, цілуй, цілуй її».</li>

{info:`<h4>«Коли б ми плакати могли…»</h4>
<p>Вірш розриває тишу байдужості: кожний рядок – «шепіт нації, яка мусить прокинутися, аби себе вберегти». Три строфи – три гіпотези «а що, якби...».</p>
<h4>Композиція – три стани ліричного героя</h4>
<ol><li><b>Плач</b> – прояв співпереживання (І строфа).</li>
<li><b>Віра</b> – духовна опора (ІІ строфа).</li>
<li><b>Гнів</b> – рушій дії (ІІІ строфа).</li></ol>
<h4>Символи</h4>
<ul><li><b>незрячі</b> – байдужість, внутрішня темрява людей;</li>
<li><b>хрести</b> – тягар народу; жертва, яку не хочуть нести;</li>
<li><b>пожежі</b> – гнів, протест, що міг би спалахнути;</li>
<li><b>кайдани</b> – неволя, насильство, внутрішній страх;</li>
<li><b>кат</b> – гнобитель, система зла.</li></ul>
<h4>Художня мова й віршова форма</h4>
<ul><li><b>Анафора</b> «Коли б ми...» ритмізує рядки й акцентує гіпотетичність; дієслова умовного способу.</li>
<li><b>Гіпербола</b> «річки із сліз» поглиблює трагічний сон, у який впала Україна.</li>
<li><b>Епітети</b> «очей незрячих», «сліз гарячих».</li>
<li>Кожна строфа завершується рефреном-повтором першого рядка.</li></ul>
<p>Мотив гніву через байдужість українців продовжує традицію Т. Шевченка («І мертвим, і живим...»).</p>
<h4>«О слово рідне! Орле скутий!..»</h4>
<p>«О слово! Будь мечем моїм! / Ні, сонцем стань!..» – меч – символ боротьби; метафоричні епітети «співочий грім», «шовковий спів степів», «левій рев» Дніпра.</p>`,

{info:`<h4>Михайло Коцюбинський (1864–1913)</h4>
<ul><li>Народився <b>17 вересня 1864 р.</b> у Вінниці. Батько – губернський секретар; мати – з аристократичних польського й молдавського родів, від неї – «тонка душевна організація», «любов і розуміння природи».</li>
<li>Народна школа в Барі, духовне училище в Шаргороді. У мареннях під час хвороби заговорив українською – загорівся цікавістю до рідного слова. Твори Т. Шевченка й Марка Вовчка вразили його.</li>
<li>Мати осліпла, 1886 р. помер батько – відповідальність за родину; 1891 р. – іспит на народного вчителя.</li>
<li>Перше оповідання «Андрій Соловійко» (1884) – провал; 1891 р. – «Харитя», «Ялинка», «П’ятизлотник», повість «На віру».</li>
<li><b>1892–1896 рр.</b> – робота в Бессарабії та <b>Криму</b> в комісії з боротьби з комахами-паразитами виноградників: «В путах шайтана», «<b>На камені</b>», «Під мінаретами» – чи не першим вийшов за межі суто української проблематики.</li>
<li>З 1898 р. – Чернігів; дружина Віра Дейша; творчі вечори для П. Тичини, В. Еллана-Блакитного. «Елегантний європеєць», «європейський українець».</li>

{info:`<h4>Герої новели</h4>

<li><b>Фатьма</b> – дівчина з далекого гірського села з «великими довгастими чорними очима, як у гірської сарни»; її купив за гроші Мемет, заплативши батькові більше за місцевих парубків.</li>

<ul><li>фіксація перших миттєвих вражень; відмова від ідеалізації;</li>

<li><b>пейзаж</b> – засіб психологічної характеристики; мінливість;</li>

// 10 Леся Українка, драматична поема
{info:`<h4>Леся Українка (1871–1913)</h4>
<ul><li>Лариса Косач народилася <b>25 лютого 1871 р.</b> в Новограді-Волинському (нині Звягель). Батько Петро Косач – правник; мати – письменниця Олена Пчілка; дядько М. Драгоманов – «учитель».</li>
<li>Колодяжне – уособлення України. Застуда на Водохреща – туберкульоз кісток: «тридцятилітня війна» з хворобою.</li>
<li>Знала багато мов; збірки «На крилах пісень» (1893), «Думи і мрії» (1899), «Відгуки» (1902).</li>
<li>1907 р. – шлюб із Климентом Квіткою; гроші на лікування віддали на експедицію для запису дум (фонограф).</li>
<li>«<b>Бояриня</b>» (1910), «Лісова пісня» (1911). Померла 19 липня 1913 р. в Сурамі; похована на Байковому цвинтарі.</li></ul>
<h4>Драматургія</h4>
<p>Основа – словесний турнір двох супротивників (з античної драми). «Одержима» (1901) – Міріям; «Вавилонський полон», «Кассандра», «Три хвилини», «Оргія». «Лісова пісня» – найвищий здобуток (анімаційний фільм «Мавка. Лісова пісня»).</p>
<h4>Теорія літератури. Драматична поема</h4>
<p><b>Драматична поема</b> – жанр, що поєднує елементи драми (конфлікт, діалог) і поеми (ліризм, роздуми). Ознаки:</p>
<ul><li>віршована форма;</li>
<li>внутрішній конфлікт (незалежність Оксани – пристосуванство Степана);</li>
<li>відмова від панорамного тла;</li>
<li>психологізм.</li></ul>
<p>Приклади: Дж. Байрон «Манфред», Г. Ібсен «Пер Гюнт»; І. Франко «Сон князя Святослава», Леся Українка «Бояриня», Л. Костенко «Сніг у Флоренції».</p>`,

{info:`<h4>Історичне тло</h4>
<p>Події відбуваються в другій половині <b>ХVІІ ст.</b> за гетьманування <b>Петра Дорошенка</b> – доба <b>Руїни</b> (від смерті Б. Хмельницького 1657 р. до гетьманства І. Мазепи 1687 р.): розпад державності, занепад, війни. Московщина порушила угоди Переяславської ради. Дія перша – на Лівобережній Україні, дії друга–п’ята – у Москві.</p>
<h4>Національна ідея</h4>
<p>Україна й Московщина – протилежні світи. Оксана звикла до пошанування жінки; у Москві дружину мають за «холопку з вотчини», мовчазний «поцелуйний обряд»; удома – «Дай боже, панночко, тобі щасливу та красну долю!». Не приймає вбрання: «Той шарахван такий бахматий... мов попівська ряса!»</p>
<p><b>Ідея</b>: українці повинні боротися за свободу та незалежність рідного краю, інакше «заржавіють», як Степан та Оксана.</p>
<h4>Ознаки неоромантизму в «Боярині»</h4>
<ul><li>увага до внутрішнього світу (Оксана – неповторна особистість, цінує незалежність, честь і гідність);</li>
<li>культ сильної, вольової особистості (Оксана входить до жіночого братства, допомагає українцям);</li>
<li>ліризм – переживання героїв «рухають» сюжет;</li>
<li>давня історія, екзотизм теми (українка-патріотка в патріархальній Московщині);</li>
<li>емоційно-інтуїтивний пошук істини.</li></ul>
<p>Неоромантизм («новоромантизм» – за Лесею Українкою) започаткувала О. Кобилянська («Людина», «Царівна»).</p>`,

{info:`<h4>Роль діалогів</h4>
<p>У «Боярині» майже немає авторських ремарок чи розлогих описів: уся дія розгортається у формі <b>віршованого діалогу</b>. Через діалоги Оксана розкриває свої переживання (зі Степаном, його матір’ю, Ганною).</p>
<h4>Дійові особи</h4>
<ul><li><b>Оксана</b> – вихована в козацькій родині з державницькими настроями; одружилася з боярином Степаном і поїхала до Москви, сподіваючись, що він дбатиме про Україну. У неволі: «Ти хіба не ходиш під ноги слатися своєму пану, мов ханові? Скрізь палі, канчуки...». Степан забороняє «озиватись» до брата Івана: «Я гину, в’яну, жити так не можу!». Дві любові – до краю й до чоловіка – поєднати неможливо. Туга спричиняє смертельну хворобу.</li>
<li><b>Степан</b> – наскрізь трагічна постать; усвідомлює своє холопське становище «боярина Стьопки»; Москва не вірить і таким прислужникам. Батько Степана – українець, що присягнув московському цареві.</li>
<li><b>Іван Перебійний</b>, брат Оксани, – представник національно свідомої старшини; засуджує Степана й батька: «лихий їх спокусив давати слово» Москві.</li>
<li>Мати Степана згинається під тягарем чужого побуту. Також Олекса Перебійний, Перебійниха, Ганна.</li></ul>
<p>Дві протилежні настанови української еліти – <b>войовничо-патріотична</b> й <b>пристосовницька</b>.</p>
<h4>Сюжетні елементи</h4>
<p>Зав’язка – згода Оксани на одруження зі Степаном; розвиток дії – життя в Москві, несприйняття ролі боярині; кульмінація – усвідомлення власної бездіяльності й докори Степанові; розв’язка – недуга й готовність прийняти смерть.</p>`,

{info:`<h4>Особливості художньої мови</h4>
<ul><li>Поему написано віршами <b>мішаних розмірів</b>; п’ять дій.</li>
<li><b>Застарілі слова</b> для колориту епохи: підкоморій, стольник, панотець, форемний, челядь.</li>
<li><b>Розмовні елементи</b>: бахматий (дуже широкий, мішкуватий), бришкати (брикатися), оклепувати (зводити наклеп), шпиг (шпигун).</li>
<li><b>Назви реалій одягу</b>: кораблик, кунтуш, намітка, фантя.</li>
<li><b>Епітети й зменшено-пестливі слова</b>: «Дай боже, панночко, тобі щасливу та красну долю!».</li>
<li><b>Порівняння та антоніми</b>: «пильнуй, щоб міг ти з ясним оком, а не тьмяним, не тремтячи, мов Каїн, Небесному Отцеві одповісти».</li>
<li><b>Риторичні фігури</b>: «Се в Києві ченці навчають отакого!», «І навіщо Степан убрався в те боярське фантя?».</li></ul>
<h4>Антей</h4>
<p>Антей – велетень, син Посейдона й Геї, непереможний, доки торкався матері-землі; Геракл підняв його над землею й переміг. Переносно – символ людини, яка бере силу від народу й рідної землі. Як і Оксана, що без рідного краю втрачає сили. Образ використано в поемі «Оргія».</p>
<p><b>Літературний паспорт</b>: жанр – драматична поема; течія – неоромантизм; тема – трагедія української жінки, яка не змогла прижитися в чужій культурі; ідея – українці повинні боротися за свободу; композиція – п’ять дій, діалоги.</p>`,

{info:`<h4>Володимир Сосюра (1898–1965)</h4>
<ul><li>Народився <b>6 січня 1898 р.</b> в Дебальцевому на Донеччині; дитинство – с. Третя Рота. За романом «Третя Рота»: мати – сербка, батько – француз (Соссюр), у документах – Сюсюра.</li>
<li>Ремісниче училище, агрономічна школа, робітфак Харківського інституту народної освіти – вивчав на лекції власну творчість.</li>
<li>Збірка «Пісні крові» (1918); поеми «Махно», «Тарас Трясило», «Мазепа». Творчість ревізувала цензура: «блакитний бій сердець» → «гарячий»; через вірш «Любіть Україну» (1944) – розгромна стаття в «Правді».</li>
<li>Понад 60 збірок і поем. Помер 8 січня 1965 р.</li></ul>
<h4>Інтимна лірика</h4>
<p>Найбільша частина спадщини. Першій дружині Вірі Берзіній – «Білі акації будуть цвісти...», «Так ніхто не кохав...». Улюблені образи – весна, ніч, зорі, солов’ї.</p>
<h4>«Так ніхто не кохав...» (1922)</h4>
<ul><li>Справжня любов народжується раз на тисячі літ; «Я для неї зірву Оріон золотий» (Оріон, укр. – Косарі).</li>
<li><b>Головна думка</b>: кохання – особливий подарунок долі, що перетворює звичайне на диво, підносить над буденністю.</li>
<li>Ознаки <b>неоромантизму</b>: екзотичний нічний пейзаж (небо, зорі, місяць), винятковість почуття.</li>
<li>Засоби: епітети («зорі ясні»), метафори («земля убирається зрання»), гіпербола («Через тисячі літ лиш приходить подібне кохання»), риторичні звертання й запитання («Гей, ви, зорі ясні!..»).</li>
<li><b>Художнє обрамлення</b>: перші й останні дві строфи повторюються. Чотиристопний анапест, перехресне римування.</li>
<li>Рядок епохи: «я — поет робітничої рані».</li></ul>
<p>«Васильки» (1939) – другій дружині Марії Даниловій; «Може, ми квітками, може, васильками / станем — я і ти».</p>`,

{info:`<h4>«Сад» (1928)</h4>
<ul><li>Патріотична (громадянська) лірика; ліричний вірш; неоромантизм; ямб.</li>
<li><b>Провідний мотив</b> – роздуми над тернистим шляхом України та її майбутнім.</li>
<li><b>Пафос</b> – від трагічного осуду («О будьте прокляті, — кому / назад повернуте обличчя!») до піднесено-оптимістичного утвердження відродження: «Його рубали, а він ріс!»; «Це ти той сад, о краю мій, / колись порубаний катами!..»</li></ul>
<h4>Алегоричні образи</h4>
<table class="tbl"><tr><th>Образ</th><th>Значення</th></tr>
<tr><td>сад</td><td>Україна, рідний край</td></tr>
<tr><td>пеньки, бур’яни</td><td>знищене, занедбане, руїна</td></tr>
<tr><td>чорний крук</td><td>горе, смерть, похоронний настрій; водночас кличе «про волі гнів»</td></tr>
<tr><td>весна</td><td>відродження</td></tr>
<tr><td>струни-жили, співці</td><td>митці, «куплені» катами: «І з нас співців собі купили, / щоб грали їм на струнах тих»</td></tr></table>
<h4>Художні засоби</h4>
<p>Алегорія («пеньки», «бур’яни»), персоніфікація («сміялись зорі», «А струни плакали...»), епітети («в саду розкішному», «кривавими стежками»), порівняння («як сон», «мов рокоти ріки»).</p>
<p>Останні рядки – образ відродженого краю: «Над золотими берегами / ти знов шумиш, такий рясний...».</p>`,

<li>1926 р. – Київський художній інститут; диплом не отримав як «політично неблагонадійний». Угруповання МАРС.</li>

<li>Відмовився від ордена за зречення: «…при виборі між орденом і смертю чи каторгою вибрав останнє».</li>

{info:`<h4>Тематика й ідея</h4>
<p>Тематика: свобода, життя і смерть, вибір людиною свого місця в історії, межі її можливостей. <b>Головна ідея</b> – трагічність буття людини в тоталітарному суспільстві та переконання, що за будь-яких обставин особистість може й повинна бути Людиною.</p>
<h4>Образи-персонажі</h4>
<ul><li><b>Григорій Многогрішний</b> – сильна, мужня особистість; не визнав себе коліщатком тоталітарної держави, не озлобився, зберіг доброту. Кредо: «<b>ліпше вмирати біжучи, ніж жити гниючи</b>». Рід – від першого каторжника Сибіру Дем’яна Многогрішного.</li>
<li><b>Родина Сірків</b> – представники козацького роду, працьовиті, сміливі, чесні; зберегли українські традиції в тайзі. Денис Сірко: «Я ще не знаю, хто ти, але моя хата — твоя хата». Сірчиха згадує вишневі сади, барвінок і чорнобривці.</li>
<li><b>Наталка</b>: «У сміливих щастя завжди є!..»; йде з Григорієм, батьки благословляють.</li>
<li><b>Майор Медвин</b> – уособлення тоталітарної системи; «новітній тигролов».</li></ul>
<h4>Символіка</h4>

<li>Продовжує традиції І. Франка: патетика, афористичність, притчевість; сонет. Прославився як <b>поет-пісняр</b>: «Лелеченьки», «Два кольори», «Впали роси на покоси», «Явір і яворина»; працював із композитором <b>О. Білашем</b>.</li></ul>

{info:`<h4>«Ти зрікся мови рідної...» (1964)</h4>
<ul><li><b>Провідний мотив</b> – гнівне засудження національного відступництва.</li>
<li>Пророцтво відступникові: «Тобі / Твоя земля родити перестане»; «Ганьба / Тебе зустріне на шляху вузькому... / Впаде на тебе, наче сніг, журба»; «Нема / Тепер у тебе роду, ні народу. / Чужинця шани ждатимеш дарма — / В твій слід він кине сміх — погорду!»</li>
<li>Громадянська лірика; пафос виправданий: без рідної мови людина втрачає духовну сутність.</li>
<li>Композиція: три чотиривірші й рядок-анафора «Ти зрікся мови рідної...», що є й художнім обрамленням. П’ятистопний ямб.</li>
<li>Народний вислів: «Хто мови своєї цурається, хай сам себе стидається».</li></ul>
<h4>«Я стужився, мила, за тобою...» (1968)</h4>
<ul><li>Фольклорна образність; інтимна лірика; провідний мотив – туга через нерозділене кохання.</li>
<li>Ліричний герой – <b>явір</b>, «палений журбою»; далі – <b>скрипка</b>: «Скрипку зроблять із його журби». Дві метаморфози утверджують віру, що з високих почуттів і страждань народжується краса мистецтва (як Мавка – верба – сопілка в «Лісовій пісні»).</li>
<li>Засоби: епітети («сніг колючий», «на веснянім сонці»), інверсія («і згорає від сльози роса»), персоніфікація («яворові сниться яворина»), порівняння («печаль, як небеса», «сніг летить колючий, ніби трина»).</li>
<li>Трина – подрібнені часточки, тирса; бескиди – урвище, гора. Для скрипки беруть явір, що росте на сонці.</li></ul>`,

{info:`<h4>Володимир Підпалий (1936–1973)</h4>
<ul><li>Народився <b>9 травня 1936 р.</b> в с. Лазірках на Полтавщині в сім’ї залізничника. Батько загинув під час форсування Дніпра: «Дитинство... вкрала війна в мого покоління».</li>
<li>Змалку захоплювався рослинним і тваринним світом: «З тварин найбільше жалію собак і волів...».</li>
<li>Тракторна бригада, флот, філологічний факультет Київського університету; редактор у видавництвах. Перша збірка «Зелена гілка» (1963). Помер 24 листопада 1973 р.</li></ul>
<h4>Теорія літератури. «Тиха лірика»</h4>
<p><b>«Тиха лірика»</b> – умовна назва ліричного струменя 60-х – початку 80-х років ХХ ст., що характеризувався увагою до проблем існування людини, ролі природи в її житті. Ознаки:</p>
<ul><li>обережне, приховане заперечення соцреалізму;</li>
<li>увага до проблем існування людини;</li>
<li>елегійність і медитативність;</li>
<li>відсутність «гучного» декларативного патріотизму;</li>
<li>домінування настанов тиші та мовчання;</li>
<li>увага до національної історії, природи, мови, фольклору.</li></ul>
<p>Тріада «природа–естетика–людина». Улюблені жанри Підпалого – <b>елегія</b> (ліричний вірш задумливого, сумного характеру) і <b>медитація</b> (роздуми над філософськими проблемами буття).</p>
<h4>«Тиха елегія» (1971)</h4>
<p>Сповідь перед Україною, гімн батьківській землі. На запитання про ріки, народ, землю, мову ліричний герой <b>мовчить</b>: «вони в мені навіки»; «на ясні зорі, тихі води / хай випадкове слово не впаде»; «моя дружина сину колискову / співає тихо... Краще не скажу...». Лише на питання про Батьківщину на чужині – <b>кричить</b>: «Кладіть отут у домовину / живим!.. Однаковісінько мені...» – алюзія на Шевченків «Заповіт» («Мені однаково…»). Мотив любові до батьківщини.</p>`,

{info:`<h4>«Бачиш: між трав зелених...» (1968)</h4>

<li>Пташата «як грудочки» в траві; «Станьмо ось тут навшпиньки / спокій їх берегти»; «стану їм старшим братом».</li>
<li>Байдужість – гріх: «Яструб-розбійник свисне раптом над беззахисними, / ляже на нашу совість за нашу байдужість гріх…».</li>
<li>«Треба в житті любити гаряче і багато: / сонце, дощі зернисті, дороги в пилу, траву!»</li></ul>
<h4>«Мамо, було, покличеш...» (1958)</h4>
<ul><li>Мати поета Ольга Степанівна померла 21 січня 1957 р., коли він служив на флоті (20 років).</li>
<li>Ліричний герой (друге «Я» поета) згадує неньку, її казки; тримає фотокартку: «Мамо, долоні милі / в праці важкій згрубіли, / зморшки чоло покрили, / коси не чорні — білі…»</li>
<li>«Чомусь ніколи тільки / сліз я твоїх не бачив…»; «очі осяють хату, / рідні, як совість, чисті…» (порівняння); «Дивиться сумно мати / з картки на сина…».</li>
<li>Тональність тиха, спокійна, ніжна – про найсвятіше. Мотив любові до матері.</li></ul>

// 29 Звук павутинки – світ природи
{info:`<h4>Віктор Близнець (1933–1981)</h4>
<ul><li>Народився 1933 р. в с. Володимирівці (нині Кіровоградщина) у багатодітній хліборобській сім’ї; точна дата невідома (документи згоріли) – записали 10 квітня.</li>
<li>Золота медаль; факультет журналістики Київського університету (1952), однокурсник В. Симоненка.</li>
<li>Перша книжка «Ойойкове гніздо» (1963); повість «<b>Звук павутинки</b>» (1970) – О. Гончар порівняв з «Маленьким принцом» А. де Сент-Екзюпері. «Земля світлячків»; переказ «Повісті минулих літ» – лебедина пісня. Помер 2 квітня 1981 р.</li>
<li>Автор: «У житті є щось надзвичайно важливе — краса, казка, совість. Оце і є суть ”Павутинки“».</li></ul>
<h4>Неповторний світ природи</h4>
<p><b>Присвята</b>: «трав’яним коникам, хрущам, тихому дощеві, замуленій річечці — найбільшим чудесам світу, які ми відкриваємо в дитинстві».</p>
<p>Хлопчик <b>Льонька</b> живе на кутку Шатрищі, де немає однолітків, але не страждає: завдяки уяві, фантазії та спостережливості знаходить друзів – срібного чоловічка, Ніну, Адама. Реальний і вигаданий світи зливаються на тлі природи. Людина – не цар, а «рівновелика часточка живої натури, Усесвіту», що відчуває й осмислює свою відповідальність.</p>
<p>«Скажи, який світ!.. Скільки кругом живого народу!» – жучки, ящірка, жабеня, оса – «наші сусіди».</p>

{info:`<h4>«Арслан-киз» («Дівчина-левиця»)</h4>
<p>Оповідання <b>історичне (історико-художнє)</b>: окрім вигаданих героїв, діють історичні персонажі, зокрема Мухаммед Якуб-бек (1820–1877) – хан Кашгарського ханства. В основі – події <b>уйгурсько-дунганського повстання 1864–1877 рр.</b> проти колоніального гніту китайської династії Цінь.</p>
<h4>Сюжет</h4>
<ul><li>26 днів місто <b>Учтурфан</b> (на теренах Кашгара) в облозі: близько 30 тис. китайських вояків і 10 тис. калмиків на чолі з <b>Чі Лінгом</b>. На 27-й день Чі Лінг надсилає листа – здатися й заплатити 10 тисяч.</li>
<li>Рада (меджліс) у шейха <b>Іззета-Ати</b>; більшість за здачу. <b>Гульджемал</b> (їй ще й 17 не було), єдина донька шейха, виходить до ради: «Я не з тих, що здаються!», харчів ще на 60–70 днів; обтинає довге волосся. Аладжа-бек: «ця левиця зможе звільнити нас від ворога!»</li>
<li>У чоловічому одязі вночі пробирається до Кашгара з листом до судді <b>Нуреддіна-ходжі</b>. Старшина <b>Таштимур-бек</b> – зрадник, бере хабарі від ворога.</li>
<li>У п’ятницю, як джигіт, заходить до жіночої <b>лазні</b>, розповідає жінкам правду, створює жіночий загін; з муру звертається до юрби: «Сьогодні немає жінок і чоловіків, є тільки бійці»; червоний прапор зі словом «Аллах».</li>
<li>Таштимура вбито, старшиною стає Сулейман-бек; 20-тисячне військо бере Нове місто; китайці підривають себе. Облогу Учтурфана знято – місто врятоване.</li></ul>
<h4>Образ Арслан-киз</h4>
<p>Ідеальна дівчина: краса, знає Коран, арабську й перську мови, вірші; рукоділля; їздить верхи, стріляє. Ім’я Гульджемал перекладають як «<b>Прекрасна квітка</b>». Своєрідна <b>Жанна д’Арк</b>: юна, у критичний час надихає народ, перевдягається в чоловічий одяг, має ораторський хист. Мудрість – нарада в жіночій лазні. В образі втілено прагнення народу до свободи й справедливості.</p>`,
terms:[["Історичне оповідання","твір, у якому поряд з вигаданими діють історичні персонажі"],["Меджліс","поважне зібрання, рада"],["Шейх","духовний наставник"],["Аксакал","старійшина"],["Газават","священна війна за іслам"]],

{info:`<h4>Ервін Умеров (1938–2007)</h4>
<ul><li>Народився в с. Яни-Сала (Кримська Автономна Республіка) в родині службовців (учителів).</li>
<li>Коли виповнилося шість років, разом із родиною, як і весь кримськотатарський народ, був депортований до Середньої Азії.</li>
<li>Літературний інститут; працював у газеті, згодом – редактором на радіо.</li>
<li>Прославився оповіданнями «Самотність», «Чорні ешелони», «Дозвіл» (1960-ті рр.) – про депортацію киримли з рідного півострова.</li></ul>
<h4>«Чорні ешелони». Сідло – символ роду й рідної землі</h4>
<ul><li><b>Джеваїре</b> – дружина <b>Екрема</b> (учителя, що пішов на війну танкістом). Від чоловіка немає звісток; свекра поховали. Вона вирушає до сестри в Сімферополь із сином, бурштиновим намистом і знаменитим <b>сідлом</b>.</li>
<li>Сідло понад сто років тому виготовив прапрадід Екрема, майстерний коваль, оздобив сріблястими лусочками. На стременах викарбувано: «<b>Від сідла до землі — один крок, та для вершника найчастіше він буває останнім</b>» і «<b>Не губи стремен, що замінили рідну землю</b>».</li>
<li>1812 р. прадід Екрема в Сімферопольському полку воював проти Наполеона: Бородинська битва, Данциг, Дрезден, Париж; повернувся 1814 р. Сідло – оберіг і дзеркало, у якому бачив обличчя рідних; сімейна реліквія.</li>
<li>Екрем виконував заповіт: «стремен не губив. І землю свою не забував» – «у кожного часу своє сідло».</li></ul>
<p>Сідло символізує пам’ять роду, зв’язок поколінь, рідну землю й гідність народу.</p>`,

{info:`<h4>Трагедія депортації через призму доль родини</h4>
<ul><li>У Сімферополі на місці будинку сестри – вирва від фугасного вибуху. Джеваїре ночує в зруйнованому саду, на базарі марно продає намисто.</li>
<li><b>Циганка</b> прихистила її: «Ходімо, сестрице». <b>Лейтенант</b>, що допоміг нести сідло, уночі попереджає: «Сьогодні вранці вас будуть виселяти… Кримських татар. І циган». Він випадково потрапив у війська НКВС, і «воювати проти цивільного населення він ще не звик».</li>
<li>Циганка розбиває люстерко – «найцінніша моя річ», біжить попередити знайомих і не повертається.</li>
<li>Рябий <b>солдат</b> приносить хліб; радить кинути сідло – Джеваїре: «Ні, я сідла не залишу». Борошно й крупи довелося залишити.</li>
<li>Пульманівські вагони для худоби, «пристосовані для людей». Хвора дитина, задуха; колеса «так-так-так».</li>
<li>Старий (70 років) відрікається від сина, що скоїв злочин проти Джеваїре: «Народу в чорні дні падлюки не треба… Ти став на один рівень із нашими катами»; син виходить із вагона – кулеметні черги.</li>
<li>Фінал: «Один із тисячі чорних ешелонів, що розтягнулись у ті весняні дні на залізницях країни».</li></ul>
<h4>Засоби психологізму</h4>
<ul><li><b>Звуконаслідування</b>: «так-так-так!» коліс – ритм безвиході.</li>
<li><b>Порівняння</b>: «наче ключ морзянки… вистукує якась залізяка об залізяку» – «SOS!».</li>
<li><b>Епітети</b>: «чорна, з величезними сухими очима молодиця».</li>
<li><b>Персоніфікація</b>: «Сідло чуло свист шабель і вибухи ядер…».</li>
<li>Діалоги, уривчасті речення, сон, розповідь від третьої особи; контраст темряви й світла.</li></ul>
<p>Назва «Чорні ешелони» – символ трагедії народу, горя й безвиході. Жанр – <b>оповідання</b>.</p>`,

{info:`<h4>Виразне читання вголос творів І. Гаспринського та Е. Умерова</h4>
<ul><li><b>«Арслан-киз»</b>: промова Гульджемал на раді («Я не з тих, що здаються!»), її звернення з муру до юрби («Гей, мусульмани!…»). Інтонація – рішуча, піднесена, ораторська.</li>
<li><b>«Чорні ешелони»</b> – читання за ролями:
<ol><li>від початку до слів «Син мовчить. Замовкає надовго батько»;</li>
<li>від «Провівши ніч у зруйнованому міському саду...» до «Заходь, люба, будь як удома...»;</li>
<li>від «У двері несміло постукали...» до «Я скоро буду! Лягай спати...»;</li>
<li>від «До будинку під’їхала машина...» до «Потяг рушив».</li></ol></li></ul>
<h4>Поради до читання</h4>
<ul><li>Передавайте настрій: тривогу, відчай, гідність, співчуття.</li>
<li>Дотримуйтеся пауз, логічних наголосів, темпу (уривчастість реплік у вагоні).</li>
<li>Звуконаслідування «так-так-так» читайте ритмічно, як стукіт коліс.</li></ul>`,

{info:`<h4>Україна у ХХІ столітті</h4>
<p>Новий етап розвитку культури пов’язаний із проголошенням незалежності України <b>1991 р.</b> Позбувшись ярма соціалістичного реалізму, митці творять на засадах свободи, без ідеологічних настанов і провінційності; розвінчують символи тоталітарної культури, їхній погляд стає іронічним і навіть скептичним. На межі ХХ–ХХІ ст. – В. Шевчук, Л. Костенко, І. Жиленко, Б. Олійник, І. Драч.</p>
<h4>Теорія літератури. Постмодернізм</h4>
<p><b>Постмодернізм</b> – мистецький напрям останньої третини ХХ ст., який стирає грані між високим мистецтвом і кітчем; переоцінює традиції авангардизму та модернізму; визнає прогрес лише у формі неспростовної ілюзії. Виник як реакція на модернізм.</p>
<p>Основні ознаки: гра зі словом і чужим текстом; змішування стилів оповіді; наскрізна іронічність («де плачуть модерністи, там сміються постмодерністи»); пародійність; закодованість тексту. Також – культ незалежної особистості, потяг до архаїки, міфу; бачення життя як театру абсурду.</p>
<p>Представники: Ю. Андрухович, О. Забужко, О. Ірванець, В. Медвідь, В. Неборак.</p>
<h4>Образотворче мистецтво</h4>
<ul><li>А. Криволап – експресивні пейзажі; «Кінь. Вечір» (2012) продано 2013 р. за 186 000 доларів – рекорд для сучасних українських художників.</li>
<li>І. Чічкан – «Психодарвінізм», образи мавп; І. Марчук – <b>пльонталізм</b> (від «плести, пльонтати»), у списку «100 геніїв сучасності»; О. Мась; скульптори О. Леонов, О. Пінчук.</li></ul>
<h4>Метамодернізм</h4>
<p>Реакція на постмодернізм; остаточно оформився у 2000-х роках. <b>Метамодернізм</b> – філософія та погляд на життя, що відповідає цифровій, постіндустріальній, глобалізованій епосі; перебуває в невизначеності між протиставленими аспектами модернізму та постмодернізму. Приклад – Ельбська філармонія (Гамбург).</p>`,

{info:`<h4>Олександр Ірванець (нар. 1961)</h4>
<ul><li>Народився <b>24 січня 1961 р.</b> у Львові; дитинство минуло в Рівному. Педагогічне училище, учителював.</li>
<li>1985 р. – семінар молодих літераторів в Ірпені (О. Забужко, Ю. Андрухович, П. Гірник). Того ж року з Ю. Андруховичем і В. Небораком заснував у Львові угруповання «<b>Бу-Ба-Бу</b>» (бурлеск–балаган–буфонада).</li>
<li>Збірки «Вогнище на дощі» (1986), «Тінь великого класика» (1991). З 1993 р. мешкає в Ірпені. Один із найкращих іронічних поетів, автор якісної політичної сатири; пише й лірику («Це вино, яке перебродило в оцет»).</li>
<li>Романи «Рівне/Ровно» (2001), «Очамимря» (2003), «Хвороба Лібенкрафта» (2010); п’єси «Брехун з Литовської площі», «Електричка на Великдень», «Прямий ефір».</li></ul>
<h4>Бу-Ба-Бу</h4>
<p>Абревіатура з перших складів слів <b>бурлеск, балаган, буфонада</b>; ідея нового стилю, що поєднує іронію, театральність і гротеск, протиставлення соцреалізму. Назва виникла випадково: Ю. Андрухович написав В. Небораку про бурлескно-балаганно-буфонадний стиль, той скоротив до Бу-Ба-Бу. Гротеск, гра слів, карнавальність, висміювання пафосу.</p>
<h4>«Любіть!..» – пародія на вірш В. Сосюри «Любіть Україну»</h4>
<table class="tbl"><tr><th>В. Сосюра</th><th>О. Ірванець</th></tr>

<p>Дослідник А. Фасоля: ідеться не про зневагу до України, а про <b>заперечення стереотипу й мовного кліше</b>, створеного на основі вірша В. Сосюри; Ірванець обігрує мовні штампи.</p>`,

{info:`<h4>Цикл «Уроки класики»</h4>
<p>Віршам циклу властива <b>поетика постмодернізму</b> з наскрізною іронічністю. У перших двох віршах закодовано вислови російських письменників, твори яких ґрунтовно вивчали покоління підрадянської України.</p>
<h4>«Урок І»</h4>
<p>«По краплі видавлювати з себе раба…» – вислів А. Чехова. Ірванець натякає, що радянська система виховувала рабську психологію, щоб люди були «маленькими гвинтиками» тоталітарної системи. Закінчення: «Починаємо видавлювати / З себе / Раба Божого / Ім’ярек…» – несподіване останнє слово.</p>
<p><b>Ім’ярек</b> – слово, яке використовують у молитвах, офіційних актах, анкетах на місці, де має бути ім’я.</p>
<h4>«Урок ІІ»</h4>
<p>«Людина родиться для щастя, / Як птах для польоту» – афоризм В. Короленка. Іронія – у низці <b>порівнянь</b>: «як індик», «як півень», «як деркач на болоті», «як страус», «як ківі», «як ему», «чи як марабу». «А може, як той, що ховає / Товсте своє тіло у скелі?» – гра з текстом М. Горького («Дурень-пінгвін…»); «Тож плазувати вони принципово не можуть» – модифікований вислів із «Пісні про сокола» («Народжений повзати — літати не зможе!»). Фінал – риторичне запитання: «А може, без порівнянь? / Може, людина просто / Родиться для щастя?»</p>
<h4>Ліричний герой</h4>
<p>Незалежна особистість, що іронізує над штампами радянської школи; культ незалежної особистості – одна з головних настанов постмодернізму. Автор якось зізнався, що він проти вивчення його творів у школі – самоіронія як ознака сильної особистості.</p>`,

{info:`<h4>Поезія з війни</h4>
<p>Література ніколи не була осторонь життя своєї країни, а надто в часи воєнного лихоліття. Поезія про російсько-українську війну сповнена різних мотивів: <b>патріотизм і жертовність; жага справедливості; лють і протест; віра в перемогу; втрата, горе й смуток; материнські сльози</b>.</p>
<p>Широковідомими стали вірші про війну А. Дністрового, О. Ірванця, К. Калитко, Г. Крук, А. Царук, Г. Бабіча, О. Хоменка, Б. Гуменюка й ін.</p>
<p><b>Борис Гуменюк</b> (нар. 1965) – один із тих поетів, які з перших днів російського нападу на Україну (2014 р.) пішли захищати рідну землю.</p>
<h4>«Стара шовковиця під Маріуполем...»</h4>
<ul><li>Столітня шовковиця «ще не бачила стількох хлопчиків»: вони обривають ягоди, вимащуються соком, «закрутили стару в танці».</li>
<li>Повтор: «РПГ кулемет автомати СВД каски бронежилети / Лежали акуратно складені в траві під деревом» – контраст дитячої безтурботності й війни.</li>
<li>Міномети «раз-два-три» «раз» – «наче юнак стукає умовним сигналом у вікно до дівчини»; «зграя чорних круків (з боку сонця — скривавлених)».</li>
<li>Хлопчаки «в одну мить» стають «суворими чоловіками» і зникають «там де до неба кричала земля».</li>
<li>Шовковиця залишилася сама: ягоди «розтікаються наче криваві сльози»; стає навшпиньки, «наче дівчина»: «Де ви хлопці?»</li></ul>
<p>Шовковиця – образ матері, рідної землі, пам’яті; персоніфікація, порівняння, повтор; вірш без розділових знаків.</p>`,

// 45 Соняхи, поезія в прозі
{info:`<h4>«Соняхи» Б. Гуменюка</h4>
<ul><li>«Минулого року на цьому полі ріс соняшник… Весною ще не було війни». «Солдати завжди додаються до війни. То вже потім війна нас мінусує».</li>
<li>Солдати ховаються поміж соняхами, маскуються ними; «у полі соняхів теж може ховатися смерть».</li>
<li>Під обстрілом «соняхи гинули, як солдати»; ті, що вціліли, «опускали голови додолу, щоб не дивитися на загиблих товаришів». «За війну соняхи навчилися повертати голови не в бік сонця… а туди, де гримить, туди, де горить».</li>
<li>Восени вони «почорніли, наче з горя, й осипалися додолу чорними слізьми»; взимку поле переорювали танки.</li>

{info:`<h4>Реальне і казкове</h4>
<p>Письменник означує твір як <b>казку</b>. <b>Реальне</b>: події початку повномасштабного вторгнення, стан мирних мешканців під час обстрілів та окупації, історії кішки, півника і шафки (автор об’єднав долі двох зруйнованих бородянських помешкань). <b>Казкове</b>: персоніфіковані образи Котика, Півника, Шафки, які співчувають своїм господарям; казковий зачин «У зеленому-зеленому селищі…».</p>
<h4>Образи-обереги родини</h4>
<ul><li><b>Шафка</b> – зібрав дідусь Петро («На віки будуємо»); зберігає сімейний крам: порцеляну, ковдри близнюків, фотоальбоми, медалі, Лізину вишиванку, краплі («так пахне горе»), запаси (сіль, сірники, борошно…). Ховає Соню в таємному сховку; б’є окупанта дверцятами. Шафка – <b>обійми</b> родини.</li>
<li><b>Півник</b> – керамічний куманець з Васильківського майолікового заводу, хоча «переконував, що… точно з Мальорки»; Петро подарував Лізі – того, кого бракувало в їхньому повоєнному дитинстві. Півник – <b>очі</b> родини; позбувається колоніального мислення.</li>
<li><b>Котик</b> – руда кішка Соні з закрученими вушками й тонким слухом. Котик – <b>вуха</b> родини.</li></ul>

{info:`<h4>Ідея збереження «родинного всесвіту»</h4>
<ul><li>Речі – не просто речі: «Це не просто шафка, Соню» (Андрій); «Це не просто речі» (Ліза). У них – спогади про три покоління родини.</li>
<li>Ліза не хоче їхати: «Куди я поїду? Тут усе моє життя… Як я залишу Петрусеву Шафку?»</li>
<li>Соня в підвалі «закопується в рештки минулого своєї родини, щоб розчистити їхнє з бабусею теперішнє і спробувати вигризти майбутнє»; починає краще розуміти бабусю.</li>
<li>«Так у світі повелося: родину ми не можемо обрати, але найрідніших людей обираємо самі».</li>
<li>Повтор рятівного «Не дивися!»: колись Петрусь затуляв Лізу, тепер Соня затуляє бабусю – зв’язок поколінь.</li>
<li>Фінал: «Ми скоро повернемося. І будемо разом. Де б тепер не був наш дім», – каже Котик. «Як закінчиться ця казка, нам не знати…»</li></ul>
<h4>Надія на перемогу</h4>
<p>«Найдовша ніч на видиху березня, коли весна йде в контратаку. Росіян женуть». Півник «намацує свій чистий голос». Подяка автора захисникам, рятувальникам, волонтерам – «за те, що поміж тривогами ми все ще можемо бачити сни. І любити».</p>
<p class="note">Усний твір-роздум: яку роль відіграє родина в умовах війни (з цитатами з казки).</p>`,

{info:`<h4>Оксана Думанська (нар. 1951)</h4>
<ul><li>Народилася <b>25 січня 1951 р.</b> в с. Локні Сумської області в учительській родині; мешкає у Львові.</li>
<li>Виховувало її шкільне подвір’я і радіопрограма «Театр перед мікрофоном»; «Буквар» опанувала самостійно; улюблений – Андерсен («Снігова королева»).</li>
<li>1973 р. закінчила філологічний факультет Київського університету. Першу книжку видала в п’ятдесят років.</li>
<li>«Графиня з Куткора», «Спосіб існування білкових тіл» (нині – «<b>Школярка з передмістя</b>»: назва асоціювалася з хімією), «Оповідки з жіночої торебки», «Хроніки пригод Гєня Муркоцького», «Дитя епохи»; серія «Казка — не казка, а батькам підказка»; «Бабусина муштра» (прототип – онучка Марійка).</li>
<li>Вважає, що літературі для дітей важливо звернутися до <b>реальності</b>; «кудись зник такий жанр, як шкільна повість».</li></ul>
<p><b>Бестселер</b> – популярна книжка, що потрапила до списку тих, які найбільше продають; термін не визначає художньої якості твору.</p>
<h4>«Школярка з передмістя. Щоденник, дописаний з уяви»</h4>
<ul><li>Жанр – <b>шкільна повість</b> у формі щоденника, поділена на частини за місяцями («Початок вересня», «Ще жовтень», «Січень–лютий», «Травень», «Насамкінець»).</li>

{info:`<h4>Родинні цінності й проблеми сучасності</h4>
<ul><li><b>Мама</b> шостий рік на заробітках у Греції: доглядає стару пані, що щоранку купається в морі; мама застудила нирки. Згодом виходить заміж за <b>данця</b> (шлюбний контракт).</li>
<li><b>Тато</b> втратив роботу, сам зібрав речі й пішов; має нову дружину й дітей, яких приводить до бабусі щонеділі.</li>
<li><b>Бабуся</b> пішла на пенсію за вислугою років, щоб доглядати онуку; уклала з нею угоду: не переступати порога школи й не зазирати в щоденник – в обмін на «стовідсоткову правдивість».</li>
<li>Мама: «Донечко, світ тепер такий, що в ньому панує розрахунок… А там — закон, право…» Героїня: «моє майбутнє обговорювалося, як купівля–продаж маминих почуттів».</li></ul>
<h4>Проблеми</h4>
<p>Заробітчанство й розпад родин; корупція і несправедливість у школі; взаємини батьків і дітей; самостійність, вибір майбутнього; зіткнення розрахунку й «сердечних порухів».</p>
<p>Бабуся: «Хто це такий мудрий сказав, що діти вічно в боргу перед своїми батьками?! Яка дурня! Мені особисто ніхто нічого не заборгував!»</p>`,

{info:`<h4>Взаємини поколінь і формування характеру дівчини</h4>
<ul><li><b>Бабуся</b> – уособлення мудрості; колишня вчителька: колись «вирівняла» оцінки талановитому хлопчикові-винахідникові. Привчала онуку до щоденника, зберігала її твори в коробках із-під чобіт.</li>
<li>Порада бабусі: «Заможність часом сприяє лінощам, тому остерігайся звикати до багатства. У житті — як на довгій ниві…»</li>
<li>Оточення героїні: подруга з «диктаторськими замашками при низькому рівні айкю», «вічна відмінниця», колишній хлопець, сусід-ветеринар (рятував їхнього пса).</li>
<li>У травні героїня оголошує однокласникам: «їду навчатися за кордон!»</li>
<li>Фінал: два роки в «своїй-чужій сім’ї» навчили стриманості; переїхала в студентське містечко – «хотіла самостійності в усьому, як вчила мене моя бабуся». На Різдво й Пасху надсилає листівки однокласникам, татові, бабусі, сусідові й навіть деріку.</li>
<li>Останні рядки: «Життя триває, бо ж воно не що інше, як спосіб існування білкових тіл…»; мама жартома: «Ось розповім про це бабусі!»</li></ul>
<p>Характер героїні: зухвала, щира, правдива, іронічна, самостійна; під впливом бабусі дорослішає.</p>

// 55 Дара Корній, сюжет, міське фентезі
{info:`<h4>Дара Корній (нар. 1970)</h4>
<ul><li>Справжні ім’я та прізвище – <b>Мирослава Замойська</b>; народилася <b>20 вересня 1970 р.</b> в с. Секунь на Волині. Українська академія друкарства.</li>
<li>Першу книжку написала «на замовлення» доньки, яка захоплювалася вампірськими сагами Стефані Маєр: авторка не могла змиритися, що підліткам подобається чужа міфологія.</li>
<li>Роман «<b>Гонихмарник</b>» – третя премія «Коронації слова» (2010), відзнака «Дебют року» сайту «Друг читача». Матеріал збирала дев’ять місяців.</li>
<li>Цикл «Зворотний бік світла», «…темряви», «…сутіні», «…світів» – праслов’янська міфологія; роман «Тому, що ти є».</li></ul>
<h4>Сюжет «Гонихмарника»</h4>
<ul><li><b>Аліна</b> – студентка Художньої академії у Львові, «чорна ворона серед білих ворон»; тато Василь – художник-монументаліст, мама Ірина.</li>
<li>У парку її рятує <b>Сашко (Кажан)</b> – майбутній скульптор, що носить чорне.</li>
<li>Історія Ірини: у поліському селі вона кохала <b>Ігоря</b>, у якому жив <b>Гонихмарник (Градобур)</b>; врятувала її бабуся Орина оберегом; Ірина повінчалася з Василем і втекла до Львова.</li>
<li>Похід у Карпати: Петро, Морва, Світлана, Сергій; Аліна бачить, як Кажан тримає на прив’язі хмари.</li>
<li>Аліна заманює Гонихмарника в пастку-картину; він переходить у тіло Марти (за її згодою). У позачассі Дід-пращур (схожий на козака Мамая) відкриває Аліні її силу. Аліна жертвує коханням, щоб повернути Сашка до життя, – він її забуває.</li>
<li>Епілог: Лондон, University of the Arts; Сашко підходить знайомитися знову.</li></ul>

["Хто автор «Любіть!..»?",["О. Ірванець","В. Сосюра","Б. Гуменюк","Д. Павличко"],0],
["Хто героїня «Бояриня»?",["Оксана","Мавка","Фатьма","Ганна"],0],
["У якому творі є сідло-реліквія?",["«Чорні ешелони»","«Арслан-киз»","«Тигролови»","«Гонихмарник»"],0],

["Який твір є тревелогом?",["«Мексиканські хроніки»","«Гонихмарник»","«Школярка з передмістя»","«Соняхи»"],0]]}

const LESSONS = META.map((m,i)=>Object.assign({}, m, L[i]||{}));

const SEC_STYLE = [
  {c:"#ef8a00", i:"📚", d:"📖✒️🖋️📜🌟"},
  {c:"#7b4fc9", i:"🌙", d:"🌙🎭🪨🌊💫"},
  {c:"#c0392b", i:"🕯️", d:"🕯️🌹🐯🌲📜"},
  {c:"#2e8b57", i:"🌿", d:"🌿🕸️🐦🎻🌻"},
  {c:"#3a6fd8", i:"🌊", d:"🕌🐎🚂🌙⭐"},
  {c:"#d4457a", i:"🌻", d:"🌻🎤🕊️🇺🇦✍️"},
  {c:"#0f8f8f", i:"🎒", d:"🐈🐓🗄️☁️🌵"}
];

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("ul9_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS[SECTIONS.length-1]; if(s&&s.name!==l.section) s=null; if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};const m=/^Тема\s*№\s*(\d+)\.\s*(.*)$/.exec(l.section); s.lab=m?m[1]:''; s.short=m?m[2]:(/^Вступ/.test(l.section)?l.section.replace(/^Вступ\.\s*/,''):l.section); SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function renderHome(){
  const total=LESSONS.length, dn=Object.keys(done).length;
  $("#app").innerHTML = `
  <div class="hero">
    <div>
      <div class="kick">Ліцей «Ясно» · 9 клас</div>
      <h1>Українська література</h1>
      <p>Уроки за календарно-тематичним плануванням: основний теоретичний матеріал з параграфа підручника, ключові поняття й тест для самоперевірки.</p>
      <div class="stats"><span><b>${SECTIONS.length}</b> тем</span><span><b>${total}</b> уроків</span><span><b>${dn}</b> пройдено</span></div>
    </div>
    <div class="hero-actions"><a class="btn" href="index.html">← Усі предмети</a>${themeBtn()}</div>
  </div>
  ${SECTIONS.map((s,si)=>`
  <section class="sec" style="--c:${s.st.c}">
    <div class="sec-h"><div class="num">${s.lab||"★"}</div><h2>${esc(s.short)}</h2></div>
    <div class="sec-body">
      <div class="cover"><div class="ci">${s.st.i}</div><div><div class="rz">${s.lab?"ТЕМА "+s.lab:"ВСТУП"}</div><div class="rn">${esc(s.short)}</div></div><div class="doodles">${[...s.st.d].join("")}</div></div>
      <div class="cards">${s.items.map(i=>{const l=LESSONS[i];return `
        <a class="tcard" href="#${i+1}">${done[i+1]?'<span class="chk">✓</span>':""}
          <div class="tn">Урок ${l.tnum}${l.diag?'<span class="badge">тренувальна</span>':""}</div>
          <div class="tt">${esc(l.title)}</div>
          <div class="tm">${meta(l)}</div>
        </a>`}).join("")}</div>
    </div>
  </section>`).join("")}`;
  document.title="Українська література · 9 клас";
}

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">${s.lab?"Тема "+s.lab:"Вступ"}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Урок ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі теми</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${s.lab||"★"}</div><div>
      <div class="tn">${esc(s.name)} · Урок ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("ul9_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Українська література 9`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("ul9_theme",d.dataset.theme); }
const th=store.get("ul9_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
