ередню ногу.", "Верхня подача: підкинь м'яч невисоко перед правим плечем, зігни руку в лікті й відведи назад, удар виконуй долонею у верхній точці.", "Типова помилка — надто високе або неточне підкидання, через яке удар виходить слабким.", "Не дивися на суперника під час удару — дивися на м'яч."]}], "f": "Перша назва волейболу була «мінтонет», а сучасну назву гра отримала від англійського volley — удар по м'ячу з льоту.", "pr": ["Намалюй у зошиті схему положення ніг і рук для нижньої прямої подачі та підпиши основні фази: стійка, замах, удар.", "Виконай удома розминку для суглобів (по 8–10 повторень обертань кистей, плечей, колін і стоп) і запиши, які вправи ти виконав."], "q": ["Хто і коли придумав волейбол?", "Чим пляжний волейбол відрізняється від класичного?", "Які правила безпеки треба виконувати на заняттях волейболом?", "Чим відрізняються нижня й верхня прямі подачі?"]}, {"n": "50", "t": "Український волейбол у світі, правила змагань; прийом м'яча знизу після подачі", "g": "Ознайомитися з основними правилами змагань з волейболу та навчитися правильної техніки прийому м'яча знизу двома руками.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Федерація волейболу України", "національна організація, що проводить змагання з волейболу в Україні та представляє країну в міжнародних федераціях."], ["Партія", "частина волейбольного матчу, яку виграє команда, що першою набрала потрібну кількість очок із перевагою щонайменше у два очки."], ["Розіграш", "відрізок гри від подачі до моменту, коли м'яч виходить з гри і одна з команд отримує очко."], ["Прийом знизу", "спосіб прийняти м'яч передпліччями зведених разом прямих рук."]], "th": [{"h": "Волейбол. Український волейбол на міжнародному рівні та правила змагань", "p": ["В Україні волейбол розвиває Федерація волейболу України. Українські чоловічі й жіночі збірні, клуби та пляжні пари беруть участь у міжнародних турнірах, зокрема в європейських змаганнях, а багато українських гравців виступають у сильних закордонних клубах.", "Щоб розуміти гру, треба знати її основні правила. Матч у класичному волейболі складається з партій, а очко команда отримує в кожному розіграші — незалежно від того, хто подавав."], "ul": ["На майданчику в кожної команди шість гравців.", "Команда має право на три дотики до м'яча, щоб перекинути його через сітку (дотик блоку не рахується).", "Один гравець не може торкатися м'яча двічі поспіль.", "Партію грають до 25 очок, вирішальну п'яту — до 15, але потрібна перевага у два очки.", "Матч триває до трьох виграних партій.", "Не можна торкатися сітки й заступати на половину суперника."]}, {"h": "Пляжний волейбол. Прийом м'яча знизу після подачі в задану зону", "p": ["Прийом знизу — найнадійніший спосіб прийняти подачу. Його мета — не просто відбити м'яч, а направити його в зручне місце для партнера, щоб він зробив передачу для атаки.", "У пляжному волейболі площа для прийому велика, а гравців лише двоє, тому важливо швидко підходити до м'яча і приймати його перед собою."], "ul": ["Стійка: ноги на ширині плечей, коліна зігнуті, вага на передній частині стоп.", "Руки прямі, кисті з'єднані одна в одну, великі пальці паралельні.", "М'яч приймай на передпліччя ближче до кистей, а не на кисті чи лікті.", "Під час прийому злегка випрямляй ноги, а не махай руками.", "Направляй м'яч у задану зону — зазвичай ближче до сітки до партнера.", "Типова помилка — розведені руки й прийом «на ходу» без зупинки."]}], "f": "У класичному волейболі на кожну партію потрібна перевага у два очки, тому партія може завершитися з рахунком 26:24, 27:25 і навіть більше.", "pr": ["Запиши в зошит 5 основних правил волейболу, які ти запам'ятав, своїми словами.", "Перед дзеркалом відпрацюй положення рук і стійку для прийому знизу (5 підходів по 10 повільних імітацій)."], "q": ["Скільки гравців грає на майданчику в класичному волейболі?", "Скільки дотиків до м'яча має команда?", "До скількох очок грають партію?", "Якими частинами рук приймають м'яч знизу?"]}, {"n": "51", "t": "Правила безпеки на волейбольному майданчику; прямий нападаючий удар з власного підкидання", "g": "Засвоїти правила безпечної поведінки на майданчику та послідовність виконання прямого нападаючого удару.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Нападаючий удар", "атакувальний удар по м'ячу однією рукою над сіткою, щоб приземлити його на половині суперника."], ["Розбіг", "кілька кроків перед стрибком, які допомагають вистрибнути вище для удару."], ["Безпечна зона", "вільний простір навколо майданчика, де не повинно бути предметів і сторонніх людей."], ["Захльостувальний рух", "швидкий рух кисті вперед-донизу в момент удару, що надає м'ячу обертання й напрямок."]], "th": [{"h": "Волейбол. Правила безпеки на ігровому майданчику", "p": ["Під час гри у волейбол часто бувають стрибки, падіння та різкі зупинки, тому майданчик має бути безпечним. Найчастіше травмуються пальці рук, гомілковостопні суглоби та коліна.", "Безпека залежить і від самого гравця: від розминки, уважності та дотримання правил."], "ul": ["Навколо майданчика не повинно бути лавок, сумок і м'ячів, що валяються.", "Сітку надійно натягують, стійки закріплюють і, за можливості, обгортають захисним матеріалом.", "Не перебігай майданчик, коли інші подають чи атакують.", "Приземляйся після стрибка на обидві ноги, на свою половину.", "Попереджай партнера голосом «моє!», щоб не зіткнутися з ним.", "Підстригай нігті й не грай у прикрасах."]}, {"h": "Пляжний волейбол. Прямий нападаючий удар з власного підкидання", "p": ["Перш ніж бити по м'ячу в стрибку, нападаючий удар вивчають з місця: гравець сам підкидає м'яч і б'є по ньому. Так легше навчитися правильної роботи руки й кисті.", "На піску стрибати важче, тому правильна техніка руки ще важливіша: вона дає силу удару навіть без високого стрибка."], "ul": ["Підкинь м'яч лівою рукою трохи вперед над правим плечем.", "Відведи праву руку зігнутою вгору-назад, лікоть вище плеча.", "Удар виконуй прямою рукою у найвищій точці, долоня накриває м'яч зверху.", "Закінчуй удар захльостом кисті донизу.", "Типові помилки: удар зігнутою рукою, м'яч позаду голови, удар пальцями замість долоні."]}], "f": "", "pr": ["Склади пам'ятку «5 правил безпеки на волейбольному майданчику» і намалюй до неї простий малюнок або схему.", "Виконай імітацію руху руки під час нападаючого удару без м'яча (3 підходи по 10 повторень кожною рукою, повільно й плавно)."], "q": ["Які травми найчастіше трапляються у волейболі?", "Навіщо гравці кричать «моє!»?", "У якій точці потрібно бити по м'ячу під час нападаючого удару?", "Які помилки бувають під час нападаючого удару?"]}, {"n": "52", "t": "Попередження травматизму у волейболі; втома й перевтома в пляжному волейболі", "g": "Навчитися запобігати травмам на заняттях та розпізнавати ознаки втоми й перевтоми.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Травматизм", "сукупність травм, що виникають під час певного виду діяльності, зокрема занять спортом."], ["Втома", "тимчасове зниження працездатності після навантаження, яке минає після відпочинку."], ["Перевтома", "стан, коли організм не встигає відновитися між навантаженнями, і втома накопичується."], ["Відновлення", "процес повернення організму до нормального стану та працездатності після навантаження."]], "th": [{"h": "Волейбол. Заходи щодо попередження травматизму", "p": ["Більшості травм можна уникнути, якщо правильно готуватися до гри. Причини травм — погана розминка, неправильна техніка, втома, несправний інвентар і порушення правил.", "Особливо вразливі пальці (під час неправильного прийому м'яча) та гомілковостоп (при приземленні на ногу іншого гравця)."], "ul": ["Розминка 10–15 хвилин з розігріванням усіх суглобів.", "Правильна техніка прийому й передачі: м'яч приймають не на кінчики пальців.", "Приземлення на зігнуті ноги, на обидві стопи.", "Поступове збільшення навантаження, без різких ривків на «холодних» м'язах.", "За потреби — наколінники та фіксуючі пов'язки."]}, {"h": "Пляжний волейбол. Втома і перевтома: ознаки, профілактика та відновлення", "p": ["Гра на піску вимагає більше сил, ніж у залі, а сонце й спека прискорюють втому. Втома — нормальна реакція організму, після відпочинку вона минає. Перевтома ж виникає, коли навантажень забагато, а відпочинку замало.", "Уважно стеж за своїм самопочуттям: це частина самоконтролю спортсмена."], "ul": ["Ознаки втоми: почервоніння обличчя, пітливість, прискорене дихання, неточні рухи.", "Ознаки перевтоми: поганий сон, дратівливість, небажання тренуватися, біль у м'язах, що не минає.", "Профілактика: режим дня, сон 8–9 годин, достатньо води, чергування навантаження й відпочинку.", "Відновлення: заминка, розтягування, прогулянки, повноцінне харчування.", "У спеку пий воду, носи головний убір і роби паузи в тіні."]}], "f": "Під час тренування в спеку людина може втрачати з потом значну кількість рідини, тому спортсмени п'ють воду невеликими ковтками ще до того, як відчують спрагу.", "pr": ["Протягом 3 днів веди щоденник самоконтролю: записуй тривалість сну, самопочуття, настрій і пульс у спокої зранку.", "Склади для себе комплекс із 5 вправ на розтягування для відновлення після навантаження й виконай його ввечері."], "q": ["Які основні причини спортивних травм?", "Чим втома відрізняється від перевтоми?", "Назви три ознаки перевтоми.", "Які засоби допомагають відновитися після навантаження?"]}, {"n": "53", "t": "Загальна та спеціальна фізична підготовка волейболіста; спеціальні бігові вправи", "g": "Зрозуміти різницю між загальною і спеціальною фізичною підготовкою та правильну техніку спеціальних бігових вправ.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Загальна фізична підготовка (ЗФП)", "всебічний розвиток фізичних якостей, що створює основу для будь-якого виду спорту."], ["Спеціальна фізична підготовка (СФП)", "розвиток саме тих якостей, які найбільше потрібні в обраному виді спорту."], ["Біг із закиданням гомілок", "бігова вправа, під час якої п'яти торкаються або майже торкаються сідниць."], ["Біг із високим підніманням стегна", "бігова вправа, під час якої стегно піднімається до горизонтального положення."]], "th": [{"h": "Волейбол. Загальна та спеціальна фізична підготовка", "p": ["Загальна фізична підготовка зміцнює весь організм: серце, м'язи, суглоби. До неї належать біг, загальнорозвивальні вправи, вправи на силу й гнучкість.", "Спеціальна підготовка волейболіста спрямована на стрибучість, швидкість реакції, спритність, силу рук і плечового поясу — те, що потрібне для подач, блоків і нападів."], "ul": ["ЗФП: кросовий біг, віджимання, присідання, вправи для преса, розтягування.", "СФП: стрибки вгору з місця й з розбігу, швидкі переміщення, ривки на короткі відрізки.", "Для пальців і кистей корисні вправи з еспандером і віджимання від стіни.", "ЗФП виконують переважно на початку сезону, СФП — постійно разом із технікою.", "Обидва види підготовки поєднуються, а не замінюють одна одну."]}, {"h": "Пляжний волейбол. Спеціальні бігові вправи", "p": ["Спеціальні бігові вправи покращують техніку бігу, координацію та силу ніг. Їх виконують у розминці на відрізках 15–20 м.", "На піску ці вправи даються важче, тому вони добре розвивають силу м'язів стопи та гомілки."], "ul": ["Закидання гомілок: тулуб прямий, коліна дивляться вниз, п'яти швидко рухаються до сідниць.", "Високе піднімання стегна: стегно до горизонталі, опора на передню частину стопи, корпус не відхиляй назад.", "Руки працюють, як під час звичайного бігу, зігнуті в ліктях.", "Темп спершу повільний, згодом швидший.", "Типова помилка — нахил тулуба вперед або назад і «важке» приземлення на всю стопу."]}], "f": "", "pr": ["Розподіли в таблиці 8 вправ на дві групи: ЗФП і СФП волейболіста (наприклад, присідання, стрибки до сітки, віджимання, ривки тощо).", "Виконай на місці (не пересуваючись) імітацію бігу з високим підніманням стегна: 3 підходи по 20 секунд з відпочинком 40 секунд."], "q": ["Що таке загальна фізична підготовка?", "Які якості розвиває спеціальна підготовка волейболіста?", "Як правильно виконувати біг із закиданням гомілок?", "Яка помилка найчастіша під час бігу з високим підніманням стегна?"]}, {"n": "54", "t": "Вплив вправ на організм; «човниковий» біг 4×9 м; діагностувальна робота ГР1", "g": "Пояснити, як різні вправи впливають на організм, правильно виконувати «човниковий» біг і підготуватися до діагностувальної роботи.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Аеробні вправи", "тривалі вправи помірної інтенсивності, під час яких м'язи отримують достатньо кисню і тренується серце."], ["Силові вправи", "вправи з подоланням опору, що зміцнюють м'язи та кістки."], ["Човниковий біг", "біг на короткому відрізку туди й назад з розворотами, що перевіряє спритність і швидкість."], ["Діагностувальна робота", "перевірка рівня знань і вмінь з теми, яка допомагає побачити свої успіхи та прогалини."]], "th": [{"h": "Волейбол. Вплив фізичних вправ на організм і попередження травматизму", "p": ["Різні вправи по-різному діють на тіло. Біг і рухливі ігри тренують серце та легені, силові вправи зміцнюють м'язи, вправи на розтягування роблять суглоби рухливішими, а стрибки зміцнюють кістки й сухожилля.", "Волейбол поєднує всі ці навантаження, тому він корисний, але вимагає обережності: стрибкове навантаження лягає на колінні та гомілковостопні суглоби."], "ul": ["Бігові вправи — витривалість і робота серця.", "Стрибки — сила ніг і стрибучість, але потребують м'якого приземлення.", "Силові вправи — міцні м'язи, що захищають суглоби від травм.", "Розтягування — гнучкість і менший ризик розтягнень.", "Чергуй навантаження і не тренуйся через біль."]}, {"h": "Пляжний волейбол. «Човниковий» біг 4×9 м і діагностувальна робота ГР1", "p": ["«Човниковий» біг 4×9 м — тест на спритність: потрібно чотири рази пробігти відрізок 9 м із розворотами. Він показує, як швидко ти змінюєш напрямок руху, що дуже важливо в обох видах волейболу.", "На цьому уроці проводиться діагностувальна робота з теми «Волейбол, пляжний волейбол» за групою результатів навчання ГР1. Повтори теорію попередніх уроків: історію, правила, безпеку, ознаки втоми."], "ul": ["Старт високий, з-за лінії, за командою.", "Перед розворотом знижуй швидкість і торкайся лінії або переставляй предмет, як вимагає умова.", "Розвертайся, присідаючи й низько опускаючи центр ваги.", "Після фінішу не зупиняйся різко — пройдися кроком.", "Порівнюй свій результат із попереднім: головне — особистий прогрес.", "Для діагностики повтори терміни й правила з уроків 49–53."]}], "f": "Здатність швидко змінювати напрямок руху називають спритністю, і її можна тренувати в будь-якому віці.", "pr": ["Склади таблицю «Вид вправ — на що впливає — приклад» щонайменше з 4 рядків.", "Повтори конспекти уроків 49–53 і усно дай відповіді на питання для самоперевірки з кожного уроку."], "q": ["Як впливають на організм бігові та силові вправи?", "Навіщо волейболісту вправи на розтягування?", "Як правильно виконувати розворот у «човниковому» бігу?", "Що перевіряє «човниковий» біг 4×9 м?"]}, {"n": "55", "t": "Взаємодія гравців передньої та задньої ліній; імітаційні вправи для швидкості й стрибучості", "g": "Зрозуміти розстановку і взаємодію гравців у волейболі та навчитися виконувати імітаційні вправи.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Передня лінія", "три гравці в зонах 2, 3 і 4 біля сітки, які атакують і ставлять блок."], ["Задня лінія", "три гравці в зонах 1, 6 і 5, що відповідають за прийом і захист."], ["Перехід", "рух гравців за годинниковою стрілкою на одну зону під час отримання права подачі."], ["Стрибучість", "здатність високо й швидко вистрибувати вгору."], ["Імітаційна вправа", "вправа, що повторює рухи технічного прийому без м'яча або в спрощених умовах."]], "th": [{"h": "Волейбол. Взаємодія гравців передньої та задньої ліній", "p": ["Майданчик кожної команди поділений на шість зон. Троє гравців передньої лінії біля сітки атакують і блокують, троє гравців задньої лінії приймають подачі та захищаються. Після переходу подачі команда робить перехід, і гравці міняються місцями.", "Задня лінія приймає м'яч і направляє його пасуючому, а передня лінія завершує атаку. Без цієї взаємодії гра не складеться."], "ul": ["Зона 1 — права задня, саме звідти подає гравець.", "Гравці задньої лінії не можуть атакувати з зони біля сітки вище її верхнього краю.", "Пасуючий зазвичай виводить м'яч гравцям передньої лінії.", "Коли передня лінія атакує, задня страхує й чекає відскоку від блоку.", "Порядок розстановки на момент подачі порушувати не можна."]}, {"h": "Пляжний волейбол. Імітаційні вправи для розвитку швидкості й стрибучості", "p": ["Імітаційні вправи дозволяють закріпити правильний рух без м'яча. Наприклад, гравець імітує розбіг, стрибок і замах для нападаючого удару або швидке переміщення до м'яча.", "На піску такі вправи одночасно розвивають силу ніг і швидкість реакції."], "ul": ["Імітація кроків розбігу та стрибка з замахом рук.", "Швидкі приставні кроки вправо-вліво за сигналом.", "Стрибки вгору з місця з махом руками.", "Імітація блоку: стрибок з руками вгору біля уявної сітки.", "Головне — правильна техніка, а не кількість повторень."]}], "f": "", "pr": ["Намалюй схему волейбольного майданчика з шістьма зонами, познач їх номерами й стрілками покажи напрям переходу.", "Виконай імітацію приставних кроків вправо-вліво біля стіни (без стрибків) — 3 підходи по 20 секунд."], "q": ["Які зони належать до передньої лінії?", "У якій зоні знаходиться подавальний?", "Як рухаються гравці під час переходу?", "Навіщо потрібні імітаційні вправи?"]}, {"n": "56", "t": "Стрибкові вправи й гнучкість у волейболі; методика освоєння техніки пляжного волейболу", "g": "Дізнатися, які стрибкові вправи та вправи на гнучкість потрібні волейболісту, і як поступово освоювати техніку пляжного волейболу.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Гнучкість", "здатність виконувати рухи з великою амплітудою."], ["Амплітуда", "розмах руху в суглобі."], ["Стрибкові вправи", "вправи з відштовхуванням і польотом, що розвивають силу ніг і стрибучість."], ["Від простого до складного", "принцип навчання, за яким спочатку вивчають прості елементи, а потім їх поєднують."]], "th": [{"h": "Волейбол. Стрибкові вправи та вправи для розвитку гнучкості", "p": ["Волейболісти багато стрибають: для нападу, блоку, подачі в стрибку. Тому вони тренують стрибкову силу й одночасно гнучкість, щоб м'язи були пружними та менше травмувалися.", "Стрибкові вправи виконують лише після розминки і з м'яким приземленням."], "ul": ["Стрибки вгору з місця з махом руками.", "Стрибки зі скакалкою на двох ногах.", "Вистрибування з напівприсіду.", "Нахили до ніг, «метелик», випади для розтягування стегон.", "Розтягування плечей і рук біля стіни.", "Розтягуйся плавно, без ривків і болю."]}, {"h": "Пляжний волейбол. Методика освоєння техніки гри", "p": ["Техніку пляжного волейболу освоюють поступово. Спочатку учні вивчають стійки й переміщення на піску, потім — прийом і передачі, далі подачі, нападаючі удари й блок, і лише після цього грають у навчальну гру.", "Кожен прийом вивчають у такій послідовності: показ і пояснення, імітація без м'яча, виконання з м'ячем на місці, у русі, в ігрових умовах."], "ul": ["Перший етап — ознайомлення з рухом.", "Другий етап — розучування частинами й цілком.", "Третій етап — закріплення в ігрових вправах.", "Помилки виправляють одразу, поки рух не закріпився неправильно.", "Регулярність тренувань важливіша за тривалість одного заняття."]}], "f": "М'язи після розминки розтягуються значно краще, ніж «холодні», тому вправи на гнучкість зручно виконувати після основної частини тренування.", "pr": ["Виконай комплекс із 5 вправ на гнучкість (нахили, «метелик», розтягування плечей тощо) по 20–30 секунд кожна.", "Опиши в зошиті етапи навчання одного технічного прийому пляжного волейболу (наприклад, прийому знизу)."], "q": ["Навіщо волейболісту розвивати гнучкість?", "Які стрибкові вправи ти знаєш?", "У якій послідовності вивчають технічні прийоми?", "Чому помилки треба виправляти одразу?"]}, {"n": "57", "t": "Способи пересування по майданчику; передачі двома руками зверху та знизу", "g": "Опанувати основні способи пересування волейболіста та техніку передач м'яча зверху й знизу.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Приставний крок", "пересування вбік, під час якого одна нога приставляється до іншої без схрещування."], ["Стійка волейболіста", "вихідне положення з зігнутими ногами й руками перед собою, готове до руху в будь-який бік."], ["Передача зверху", "передача м'яча пальцями обох рук над чолом."], ["Ковзний крок", "швидкий низький крок, яким гравець підходить до м'яча."]], "th": [{"h": "Волейбол. Способи пересування по майданчику", "p": ["Щоб встигати до м'яча, гравець постійно рухається. Пересування мають бути швидкими, короткими й низькими, а перед виконанням прийому гравець зупиняється в стійці.", "Вибір способу залежить від того, куди й на яку відстань треба переміститися."], "ul": ["Звичайний крок і біг — для великих відстаней.", "Приставні кроки вправо-вліво — для коротких зміщень.", "Схресні кроки — для швидкого переміщення вздовж сітки.", "Стрибок і випад — щоб дотягнутися до далекого м'яча.", "Пересування завершуй стійкою, лицем до м'яча."]}, {"h": "Пляжний волейбол. Передачі двома руками зверху та знизу (на місці й у русі)", "p": ["Передача зверху — найточніший спосіб направити м'яч партнеру. М'яч приймають пальцями обох рук над чолом і випрямлянням рук і ніг посилають уперед-угору. Передача знизу виконується так само, як прийом: передпліччями зведених рук.", "У пляжному волейболі правила оцінюють передачу зверху суворіше, ніж у залі, тому вона має бути чистою, без утримання м'яча."], "ul": ["Руки над чолом, пальці утворюють «ківшик», великі й вказівні пальці формують трикутник.", "Ноги злегка зігнуті, м'яч пропускаєш з силою всього тіла.", "Передачу знизу спрямовуй рухом ніг і корпусу, руки не махають.", "У русі спочатку підійди під м'яч, зупинись, потім передавай.", "Типові помилки: м'яч б'ють долонями, приймають на кінчики пальців, затримують у руках."]}], "f": "", "pr": ["Перед дзеркалом відпрацюй положення рук для передачі зверху («ківшик» над чолом) — 3 підходи по 10 імітацій.", "Опиши в зошиті різницю між приставним і схресним кроком і коли вони потрібні у грі."], "q": ["Які способи пересування використовують у волейболі?", "Чому пересування завершують стійкою?", "Як розташовані пальці під час передачі зверху?", "Які помилки бувають під час передачі зверху?"]}, {"n": "58", "t": "Передача м'яча; нижня пряма та бокова подачі з 4–6 м; другі передачі з глибини", "g": "Навчитися виконувати нижню пряму й бокову подачі на скороченій відстані та розуміти, як роблять другу передачу з глибини майданчика.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Нижня бокова подача", "подача, під час якої гравець стоїть боком до сітки, а рука рухається знизу збоку."], ["Друга передача", "другий дотик команди, яким пасуючий виводить м'яч на нападаючий удар."], ["Глибина майданчика", "частина майданчика, віддалена від сітки, біля лицьової лінії."], ["Подача у стіну", "навчальна вправа, коли гравець подає м'яч у стіну, щоб відпрацювати точність удару."]], "th": [{"h": "Волейбол. Передача м'яча, нижня пряма й бокова подачі з 4–6 м", "p": ["Подачі спочатку відпрацьовують з невеликої відстані — 4–6 м від сітки або від стіни. Так гравець може зосередитися на правильному русі руки, а не на силі удару.", "Нижня бокова подача відрізняється від прямої тим, що гравець стоїть боком до сітки й б'є по м'ячу рухом руки збоку."], "ul": ["Нижня бокова: стань лівим боком до сітки, м'яч тримай перед собою на рівні пояса.", "Замах рукою вниз-назад, удар збоку-знизу основою долоні.", "Вага тіла переноситься з правої ноги на ліву.", "Подаючи у стіну, цілься в позначене місце вище лінії сітки.", "Передачу зверху й знизу вправляй у парах, стежачи за точністю."]}, {"h": "Пляжний волейбол. Другі передачі з глибини майданчика", "p": ["У пляжному волейболі після прийому м'яч не завжди летить точно до сітки. Тоді пасуючий повинен зробити другу передачу з глибини майданчика — довгу й високу, щоб партнер встиг розбігтися.", "Така передача складніша: потрібно більше сили та точне спрямування корпусом до місця атаки."], "ul": ["Швидко вийди під м'яч і розвернися корпусом до місця атаки.", "Передача висока й з запасом від сітки, щоб нападник бачив м'яч.", "Частіше використовують передачу знизу, бо вона надійніша.", "Повідомляй партнера голосом, куди віддаєш м'яч.", "Типова помилка — передача надто близько до сітки, через що атака ускладнюється."]}], "f": "Пляжні волейболісти часто використовують приховані сигнали руками за спиною, щоб партнер знав, який удар чи блок плануються.", "pr": ["Намалюй схему: гравець приймає подачу в глибині майданчика, а другий робить другу передачу для атаки. Познач стрілками політ м'яча.", "Виконай імітацію руху руки для нижньої бокової подачі — 3 підходи по 10 повторень."], "q": ["Чим нижня бокова подача відрізняється від нижньої прямої?", "Навіщо подачі відпрацьовують з відстані 4–6 м?", "Яка роль другої передачі?", "Якою має бути друга передача з глибини майданчика?"]}, {"n": "59", "t": "Розвиток фізичних якостей волейболіста; сила ніг і стрибкова витривалість", "g": "Дізнатися, якими вправами розвивають основні фізичні якості та силу ніг для гри у волейбол.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Фізичні якості", "властивості організму, що визначають рухові можливості людини: сила, швидкість, витривалість, спритність, гнучкість."], ["Стрибкова витривалість", "здатність виконувати багато стрибків поспіль без суттєвого зниження їх висоти."], ["Квадрицепс", "чотириголовий м'яз передньої поверхні стегна, що розгинає ногу в коліні."], ["Повторний метод", "виконання вправи кілька разів з відпочинком між підходами."]], "th": [{"h": "Волейбол. Вправи для розвитку основних фізичних якостей", "p": ["Кожна фізична якість розвивається своїми вправами. Швидкість тренують короткими прискореннями, силу — вправами з опором, витривалість — тривалою роботою, спритність — зміною напрямку й координаційними завданнями, гнучкість — розтягуванням.", "Волейболісту потрібні всі якості, але особливо — швидкість реакції та стрибучість."], "ul": ["Швидкість: старти за сигналом, ривки на 5–10 м.", "Сила: віджимання, присідання, вправи для преса й спини.", "Витривалість: тривалий біг у помірному темпі, рухливі ігри.", "Спритність: «човниковий» біг, естафети з м'ячем.", "Гнучкість: нахили, махи, розтягування плечей."]}, {"h": "Пляжний волейбол. Сила м'язів ніг та стрибкова витривалість", "p": ["За одну гру пляжний волейболіст виконує безліч стрибків на нестійкому піску. Тому йому потрібні сильні м'язи стегна, гомілки й сідниць, а також здатність стрибати багато разів поспіль.", "Силу ніг розвивають присіданнями та випадами, а стрибкову витривалість — серіями стрибків з контролем техніки."], "ul": ["Присідання з прямою спиною, коліна в напрямку носків.", "Випади вперед і вбік.", "Підйоми на носки для м'язів гомілки.", "Серії стрибків на піску з м'яким приземленням.", "Між серіями — відпочинок до відновлення дихання.", "Стрибки не виконують на втомлених ногах і без розминки."]}], "f": "", "pr": ["Виконай комплекс для ніг: 3 підходи по 12 присідань, по 8 випадів на кожну ногу і 15 підйомів на носки. Запиши самопочуття після вправ.", "Склади таблицю «Фізична якість — 2 вправи для її розвитку» для п'яти якостей."], "q": ["Назви п'ять основних фізичних якостей.", "Якими вправами розвивають швидкість?", "Що таке стрибкова витривалість?", "Як правильно виконувати присідання?"]}, {"n": "60", "t": "Подачі та прийом у задану зону; безпека в пляжному волейболі", "g": "Закріпити техніку подач і прийому та засвоїти правила безпеки, характерні для гри на піску.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Задана зона", "визначена частина майданчика, куди треба направити м'яч під час виконання вправи."], ["Ейс", "подача, яку суперник не зміг прийняти, і вона одразу принесла очко."], ["Сонячний удар", "перегрівання голови під прямим сонячним промінням, що спричиняє головний біль, нудоту й слабкість."], ["Пісок для майданчика", "дрібний, м'який, очищений від каміння й сміття ґрунт, придатний для безпечної гри."]], "th": [{"h": "Волейбол. Подачі верхня й нижня; прийом знизу в задану зону", "p": ["Добра подача — це вже половина атаки. Подачу спрямовують у слабке місце суперника: між гравцями, у кути або ближче до лицьової лінії. Команда, що приймає, повинна точно направити м'яч пасуючому.", "Тому на тренуваннях подачі та прийом відпрацьовують разом: один гравець подає, інший приймає в задану зону."], "ul": ["Перед подачею визнач ціль і займи стійку.", "Стабільність подачі важливіша за силу: подача в сітку — це очко суперникові.", "Під час прийому вийди під м'яч і прийми його перед собою.", "Розворот корпусу до зони пасуючого визначає напрям прийому.", "Аналізуй, куди найчастіше летить м'яч після прийому, і виправляй помилки."]}, {"h": "Пляжний волейбол. Правила безпеки та профілактика травматизму", "p": ["Гра на відкритому піщаному майданчику має свої ризики: гарячий пісок, сонце, сторонні предмети в піску, вітер. Тому до правил безпеки в залі додаються ще кілька.", "Перед грою майданчик перевіряють на наявність скла, каміння та інших небезпечних предметів."], "ul": ["Перевір пісок на сторонні предмети перед грою.", "Користуйся сонцезахисним кремом і головним убором, май із собою воду.", "Не грай у найспекотніший час доби.", "Розминайся навіть у спеку: м'язи й суглоби однаково потребують підготовки.", "Під час падіння на пісок групуйся й не виставляй прямі руки."]}], "f": "Подачу, яку суперник не зміг прийняти, у волейболі називають «ейс».", "pr": ["Напиши пам'ятку з 5 правил безпеки для гри у пляжний волейбол влітку.", "Намалюй майданчик і познач стрілками 3 зони, куди найвигідніше спрямовувати подачу, пояснивши, чому."], "q": ["Куди вигідно спрямовувати подачу?", "Чому стабільність подачі важливіша за силу?", "Які ризики є під час гри на піску?", "Що потрібно зробити перед грою на піщаному майданчику?"]}, {"n": "61", "t": "Прямий нападаючий удар з власног
