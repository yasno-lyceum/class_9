<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фізична культура · 9 клас</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "fk9", "name": "Фізична культура · 9 клас", "short": "Фізкультура 9", "themes": [{"name": "І період. Легка атлетика, футбол", "lessons": [{"n": "1", "t": "Вступ до модулів: безпека на заняттях легкою атлетикою та основи арбітражу у футболі", "g": "Учень знатиме правила безпечної поведінки на заняттях легкою атлетикою та розумітиме, як працює суддівська бригада у футболі.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Інструктаж з безпеки життєдіяльності", "пояснення вчителем правил поведінки, що допомагають уникнути травм під час занять."], ["Сектор для метань", "огороджене місце на стадіоні, куди летить снаряд і куди заборонено заходити під час метань."], ["Головний арбітр", "суддя на полі, який керує матчем, фіксує порушення і має останнє слово в спірних моментах."], ["Асистент арбітра", "суддя на бровці з прапорцем, який допомагає фіксувати положення «поза грою» та вихід м'яча за межі поля."], ["Розминка", "комплекс вправ на початку заняття, що готує м'язи, суглоби й серце до навантаження."]], "th": [{"h": "Легка атлетика. Правила безпечної поведінки на заняттях", "p": ["Легка атлетика — «королева спорту»: біг, стрибки, метання та ходьба. Цього семестру ми поєднуємо її з футболом. Більшість травм у легкій атлетиці трапляється не через складність вправ, а через неуважність: пропущену розминку, невідповідне взуття, перетин бігової доріжки чи сектору метань у невідповідний момент.", "У 9 класі ти вже достатньо дорослий, щоб сам оцінювати ризики: перед вправою подумай, хто поруч, яке покриття під ногами і чи готове твоє тіло до навантаження."], "ul": ["Займайся лише в спортивному одязі та взутті з нековзною підошвою; зніми прикраси й годинник.", "Починай з розминки 8–10 хвилин: ходьба, легкий біг, обертання в суглобах, динамічна розтяжка.", "Не перетинай бігову доріжку, коли по ній біжать інші; на фініші не зупиняйся різко — пробіжи ще кілька метрів.", "Під час метань стій лише позаду лінії кидка, не заходь у сектор і не подавай снаряд кидком — тільки перенось.", "Повідом учителя про погане самопочуття, біль чи запаморочення одразу, а не після уроку."]}, {"h": "Футбол. Основні засади арбітражу", "p": ["Футбольний матч обслуговує суддівська бригада: головний арбітр на полі, двоє асистентів на бровках, а на офіційних матчах — ще четвертий арбітр і система відеоповторів VAR. Арбітр стежить за дотриманням правил, зупиняє гру свистком і показує картки.", "Знати основи суддівства корисно кожному гравцеві: ти краще розумієш рішення арбітра, менше сперечаєшся і граєш чесніше. На шкільних змаганнях учні часто самі виконують роль судді."], "ul": ["Свисток зупиняє гру, жест рукою показує напрямок удару чи вкидання.", "Жовта картка — попередження; дві жовті в одному матчі дорівнюють червоній — вилученню.", "Асистент піднімає прапорець, коли м'яч виходить за межі поля або гравець у положенні «поза грою».", "Правило переваги: суддя може не зупиняти гру, якщо порушення не завадило атаці команди, проти якої порушили.", "Рішення арбітра на полі остаточні — сперечання з суддею карається попередженням."]}], "f": "Сучасні правила футболу затверджує Міжнародна рада футбольних асоціацій (IFAB), і їх щороку уточнюють.", "pr": ["Склади пам'ятку «5 правил безпеки на уроці легкої атлетики» і запиши її в зошит.", "Намалюй схеми трьох жестів футбольного арбітра (наприклад, штрафний удар, перевага, кутовий) і підпиши їх."], "q": ["Чому не можна заходити в сектор для метань під час занять?", "Які функції виконує асистент арбітра?", "Що означає правило переваги у футболі?", "Які дії допомагають уникнути травм на початку заняття легкою атлетикою?"]}, {"n": "2", "t": "Перша домедична допомога в легкій атлетиці та профілактика травм у футболі", "g": "Учень знатиме, як надати першу домедичну допомогу при типових спортивних ушкодженнях і як запобігати травмам на футболі.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Перша домедична допомога", "невідкладні дії, які людина без медичної освіти виконує до прибуття медиків, щоб полегшити стан потерпілого."], ["Забій", "закрите ушкодження м'яких тканин від удару без порушення цілості шкіри."], ["Розтягнення", "ушкодження зв'язок суглоба внаслідок різкого надмірного руху."], ["Іммобілізація", "забезпечення нерухомості ушкодженої частини тіла, щоб не посилити травму."], ["Щитки", "захисні пластини, які футболісти носять під гетрами для захисту гомілки від ударів."]], "th": [{"h": "Легка атлетика. Правила надання першої домедичної допомоги", "p": ["На легкоатлетичних заняттях найчастіше трапляються садна, забої, розтягнення зв'язок гомілковостопного суглоба і м'язові судоми. Головне правило: спершу переконайся, що тобі нічого не загрожує, потім оціни стан потерпілого і поклич дорослого або виклич допомогу за номером 103 чи 112.", "Для свіжих забоїв і розтягнень корисно запам'ятати принцип: спокій, холод (через тканину, а не на голу шкіру), легке стискання пов'язкою, підняте положення кінцівки."], "ul": ["Садно: промий чистою водою, обробі антисептиком, накрий стерильною серветкою.", "Забій і розтягнення: припини навантаження, приклади холод на 10–15 хвилин, підніми кінцівку.", "Судома м'яза: обережно розтягни м'яз, помасажуй, не продовжуй біг через біль.", "Підозра на перелом: не випрямляй кінцівку, забезпеч нерухомість і чекай медиків.", "Носова кровотеча: голову трохи нахили вперед, притисни крила носа, приклади холод до перенісся."]}, {"h": "Футбол. Профілактика травматизму на уроках футболу", "p": ["Футбол — контактна гра з різкими зупинками, поворотами й боротьбою за м'яч, тому найчастіше травмуються коліна, гомілковостопні суглоби та м'язи стегна. Більшості травм можна уникнути, якщо підготувати тіло і грати за правилами.", "Чесна гра — теж профілактика: підкат ззаду, штовхання чи удар по ногах суперника небезпечні не лише для нього, а й для тебе самого."], "ul": ["Грай у взутті, що відповідає покриттю (зал, штучний газон, трава), і використовуй щитки.", "Розминайся з м'ячем: короткі прискорення, зміни напрямку, вправи на рівновагу.", "Не виконуй підкатів на твердому покритті та в залі.", "Під час боротьби за верховий м'яч стеж за руками й ліктями.", "Після гри зроби заминку і розтяжку м'язів ніг."]}], "f": "Номер 112 — єдиний номер екстреної допомоги в Україні та країнах Європейського Союзу, він працює навіть без грошей на рахунку.", "pr": ["Запиши в зошит алгоритм дій при розтягненні зв'язок гомілковостопного суглоба (4–5 кроків).", "Виконай удома вправу на рівновагу: стійка на одній нозі по 30 секунд на кожну ногу, 3 підходи (поруч має бути опора)."], "q": ["Які дії потрібно виконати при забої чи розтягненні?", "Чому холод не можна прикладати безпосередньо до шкіри?", "Які засоби захисту використовують футболісти?", "Назви три правила профілактики травм у футболі."]}, {"n": "3", "t": "Біг на короткі, середні й довгі дистанції; пересування з м'ячем у футболі", "g": "Учень розумітиме відмінності техніки й тактики бігу на різні дистанції та знатиме, як пересуватися з м'ячем у різних напрямках і з різною швидкістю.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Спринт", "біг на короткі дистанції (до 400 м) з максимальною швидкістю."], ["Стаєрський біг", "біг на довгі дистанції, де головне — витривалість і рівномірний розподіл сил."], ["Низький старт", "положення спринтера перед стартом з опорою на руки, яке дає змогу потужно відштовхнутися."], ["Фінішний ривок", "прискорення на останньому відрізку дистанції."], ["Ведення м'яча", "переміщення гравця з м'ячем, який він постійно контролює легкими поштовхами ноги."]], "th": [{"h": "Легка атлетика. Особливості бігу на короткі, середні й довгі дистанції", "p": ["Біг поділяють на короткі дистанції (спринт: 60, 100, 200, 400 м), середні (800, 1500 м) і довгі (від 3000 м і більше). На коротких дистанціях працюємо на максимум: низький старт, швидкий стартовий розгін, частий і потужний крок, активна робота рук. На середніх — важливо не витратити сили на початку, тримати темп і зберегти запас на фінішний ривок.", "На довгих дистанціях використовують високий старт, крок коротший, рухи економні, дихання ритмічне (наприклад, вдих на 2–3 кроки, видих на 2–3 кроки). Чим довша дистанція, тим більшу роль відіграє витривалість серцево-судинної системи."], "ul": ["Фази спринту: старт, стартовий розгін, біг по дистанції, фінішування.", "Типова помилка спринтера — передчасне випрямлення після старту і «закрепощені» плечі.", "На середніх дистанціях не варто вириватися вперед на першому колі, якщо не впевнений у силах.", "На довгих дистанціях ставлять ногу м'яко, з передньої частини стопи або перекатом.", "Після фінішу продовжуй ходьбу 2–3 хвилини, щоб пульс знижувався поступово."]}, {"h": "Футбол. Пересування з м'ячем у різних напрямках та з різною швидкістю", "p": ["Гравець рідко біжить із м'ячем по прямій: доводиться змінювати напрямок, пришвидшуватися й гальмувати. На високій швидкості м'яч відпускають трохи далі від себе й торкаються його рідше, а в тісноті — частіше й ближче до ноги.", "Для ведення використовують зовнішню частину підйому (на швидкості), внутрішню сторону стопи (для зміни напрямку) і підошву (для зупинки та розворотів). Важливо піднімати голову, щоб бачити поле та партнерів."], "ul": ["Тулуб злегка нахилений уперед, ноги зігнуті — так легше змінити напрямок.", "Під час зміни напрямку м'яч переводять ногою, дальньою від суперника.", "Не дивися весь час на м'яч — використовуй периферійний зір.", "Типова помилка — занадто сильний поштовх, після якого м'яч «тікає».", "Пришвидшення виконуй після відриву від суперника, а не перед ним."]}], "f": "Найдовша дистанція в програмі Олімпійських ігор у легкій атлетиці — марафон завдовжки 42 км 195 м.", "pr": ["Склади таблицю «Короткі, середні та довгі дистанції»: приклади дистанцій, вид старту, головна рухова якість.", "Виконай удома імітацію роботи рук бігуна сидячи або стоячи: 3 серії по 30 секунд, лікті зігнуті приблизно під прямим кутом."], "q": ["Чим техніка спринту відрізняється від техніки бігу на довгі дистанції?", "Чому на середніх дистанціях важливо правильно розподілити сили?", "Якими частинами стопи ведуть м'яч і в яких ситуаціях?", "Чому під час ведення м'яча потрібно піднімати голову?"]}, {"n": "4", "t": "Досягнення українських легкоатлетів; рухливі ігри та командна взаємодія у футболі", "g": "Учень знатиме про видатних українських легкоатлетів і розумітиме, як командні ігри та естафети з м'ячем розвивають взаємодію гравців.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Олімпійський чемпіон", "спортсмен, який здобув золоту медаль на Олімпійських іграх."], ["Світовий рекорд", "найкращий результат у світі в певній дисципліні, офіційно зареєстрований міжнародною федерацією."], ["Стрибок із жердиною", "легкоатлетична дисципліна, де спортсмен долає високу планку за допомогою гнучкої жердини."], ["Командна взаємодія", "узгоджені дії кількох гравців для досягнення спільної мети в грі."], ["Діагностувальна робота", "перевірка рівня знань і вмінь з теми, яка допомагає вчителеві й учневі побачити прогрес."]], "th": [{"h": "Легка атлетика. Досягнення українських легкоатлетів на міжнародній арені", "p": ["Українська легка атлетика має гучні імена. Сергій Бубка — олімпійський чемпіон 1988 року і багаторазовий чемпіон світу в стрибках із жердиною, який десятки разів встановлював світові рекорди і першим подолав висоту 6 метрів. Ярослава Магучіх — олімпійська чемпіонка Парижа-2024 у стрибках у висоту, яка того ж року встановила світовий рекорд.", "Успіхи українських спортсменів — результат багаторічних тренувань, дисципліни та підтримки тренерів. Вони показують, що наполегливість і правильна підготовка дають результат на найвищому рівні."], "ul": ["Найсильніші традиції України — у стрибках (у висоту, з жердиною), спринті та метаннях.", "Висока майстерність будується на базовій фізичній підготовці, яку закладають ще в шкільному віці.", "Спортсмени світового рівня тренуються за планом і обов'язково відновлюються.", "Дізнаючись про чемпіонів, звертай увагу не лише на медалі, а й на їхній шлях до них.", "Перевіряй факти про досягнення спортсменів в офіційних джерелах."]}, {"h": "Футбол. Рухливі ігри, естафети з м'ячем і командні вправи на взаємодію", "p": ["Рухливі ігри та естафети з м'ячем розвивають швидкість реакції, координацію і вміння діяти разом. У командних вправах важливо не лише добре виконати свою частину, а й вчасно передати м'яч, підказати партнерові й підтримати його.", "Наприкінці уроку проходить діагностувальна робота за групою результатів ГР1: вона перевіряє, як ти виконуєш рухові дії та знаєш правила безпеки. Ставлення до неї просте: покажи, що вмієш, і зрозумій, над чим працювати далі."], "ul": ["В естафеті м'яч передають лише після того, як попередній учасник пересік лінію.", "Гравці домовляються про сигнали: голосом, жестом, поглядом.", "Помилка одного — не привід для докорів; команда виграє разом.", "Командні вправи вчать займати вільну зону і відкриватися для передачі.", "Дотримуйся правил гри навіть тоді, коли суддя не бачить."]}], "f": "Сергій Бубка першим у світі подолав у стрибках із жердиною висоту 6 метрів — це сталося 1985 року.", "pr": ["Підготуй коротке повідомлення (5–7 речень) про одного українського легкоатлета: дисципліна, найважливіші досягнення, що тебе надихає в його історії.", "Придумай і запиши правила однієї естафети з м'ячем для шкільного свята (кількість учасників, завдання, правила передачі)."], "q": ["Якими досягненнями відомі Сергій Бубка та Ярослава Магучіх?", "Що спільного між шляхом чемпіона і твоїми тренуваннями?", "Як рухливі ігри з м'ячем розвивають командну взаємодію?", "Які правила потрібно дотримувати в естафеті?"]}, {"n": "5", "t": "Оздоровчий біг і його вплив на організм; фронтальна робота та колова естафета у футболі", "g": "Учень пояснить позитивний вплив оздоровчого бігу на організм і знатиме, як ефективно діяти у фронтальних та колових футбольних завданнях.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Оздоровчий біг", "повільний або помірний біг для зміцнення здоров'я, а не для спортивного результату."], ["Аеробне навантаження", "робота помірної інтенсивності, під час якої м'язи отримують достатньо кисню."], ["Частота серцевих скорочень (ЧСС)", "кількість ударів серця за хвилину, за якою оцінюють інтенсивність навантаження."], ["Колова естафета", "естафета, у якій учасники по черзі проходять коло з кількох станцій-завдань."], ["Фронтальна робота", "спосіб організації уроку, коли всі учні одночасно виконують однакове завдання."]], "th": [{"h": "Легка атлетика. Значення оздоровчого бігу", "p": ["Оздоровчий біг — доступний вид рухової активності: потрібні лише зручне взуття та бажання. Систематичні пробіжки в помірному темпі тренують серце й легені, покращують кровообіг, допомагають підтримувати нормальну масу тіла, знімають стрес і покращують сон.", "Головне правило — помірність і регулярність. Краще бігати 3 рази на тиждень по 20–30 хвилин у темпі, коли можеш говорити, ніж один раз до знемоги. Навантаження збільшують поступово."], "ul": ["Зміцнюється серцево-судинна і дихальна системи, зростає витривалість.", "Покращується настрій завдяки виробленню «гормонів радості».", "Тренуються м'язи ніг і кор, зміцнюються кістки.", "Ознака правильного темпу — можна розмовляти, не задихаючись.", "Перед пробіжкою — розминка, після — заминка й розтяжка; у спеку і на слизькій дорозі будь обережним."]}, {"h": "Футбол. Фронтальна робота, ігрові завдання, колова естафета", "p": ["На фронтальній частині уроку всі гравці одночасно виконують вправи: ведення, передачі, зупинки. Учитель бачить кожного й виправляє помилки, а учні отримують багато повторень. Ігрові завдання додають змагальності: хто швидше, хто точніше, яка пара зробить більше передач.", "Колова естафета складається зі станцій: наприклад, ведення між фішками, передача в ціль, удар по воротах. Кожен учасник проходить всі станції, а результат команди залежить від усіх."], "ul": ["Слухай сигнали вчителя й починай вправу одночасно з усіма.", "На станціях дотримуйся послідовності і не заважай іншим.", "Якість виконання важливіша за швидкість — помилка на станції може коштувати команді часу.", "Між станціями переходь швидким кроком, не підганяючи м'яч ударом.", "Після естафети обговоріть, що вдалося і що покращити."]}], "f": "Оздоровчий біг став масово популярним у світі в 1960–70-х роках, коли дослідники почали активно вивчати користь аеробних навантажень.", "pr": ["Виміряй свій пульс у спокої (за 15 секунд і помнож на 4) зранку три дні поспіль і запиши результати в таблицю.", "Склади план оздоровчої пробіжки для підлітка-початківця на тиждень: скільки разів, скільки хвилин, як оцінювати самопочуття (виконувати біг удома не потрібно)."], "q": ["Як оздоровчий біг впливає на серце, легені та настрій?", "Як визначити, що темп бігу правильний для оздоровлення?", "Що таке колова естафета і чим вона корисна?", "Чому у фронтальній роботі важливо діяти за сигналом?"]}, {"n": "6", "t": "Українська легка атлетика сьогодні; міжнародні футбольні організації", "g": "Учень матиме уявлення про сучасний стан української легкої атлетики та знатиме роль ФІФА і УЄФА в розвитку футболу.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Федерація легкої атлетики України", "всеукраїнська громадська організація, що розвиває легку атлетику в країні та формує національну збірну."], ["World Athletics", "міжнародна федерація легкої атлетики, яка затверджує правила й рекорди."], ["ФІФА", "Міжнародна федерація футболу, що керує світовим футболом і проводить чемпіонати світу."], ["УЄФА", "Союз європейських футбольних асоціацій, організатор чемпіонатів Європи та Ліги чемпіонів."], ["УАФ", "Українська асоціація футболу — головна футбольна організація в Україні."]], "th": [{"h": "Легка атлетика. Українська легка атлетика на сучасному етапі", "p": ["Сьогодні українські легкоатлети тренуються і виступають у складних умовах війни: частина спортивних баз зруйнована, багато спортсменів готуються за кордоном. Попри це, збірна України продовжує здобувати медалі на чемпіонатах Європи, світу та Олімпійських іграх, особливо в стрибках.", "Розвиток виду спорту залежить не лише від чемпіонів, а й від масовості: шкільних змагань, ДЮСШ, аматорських забігів і марафонів, у яких беруть участь тисячі людей."], "ul": ["Федерація легкої атлетики України організовує чемпіонати України та формує збірну.", "Найсильніші позиції — у стрибкових дисциплінах і окремих видах метань.", "Масові забіги та паркрани популяризують біг серед дорослих і дітей.", "Спортсмени-олімпійці стають прикладом і амбасадорами спорту для молоді.", "Шкільні змагання — перший крок для тих, хто хоче займатися легкою атлетикою серйозно."]}, {"h": "Футбол. Міжнародні футбольні організації та їх роль", "p": ["ФІФА — Міжнародна федерація футболу, заснована 1904 року в Парижі. Вона об'єднує національні асоціації всього світу і проводить чемпіонати світу. УЄФА заснована 1954 року й керує європейським футболом: проводить чемпіонати Європи, Лігу чемпіонів, Лігу Європи.", "В Україні футболом опікується Українська асоціація футболу (УАФ), що є членом ФІФА та УЄФА. Ці організації розвивають дитячий, жіночий, аматорський футбол, впроваджують програми чесної гри і боротьби з дискримінацією."], "ul": ["ФІФА — світовий рівень: чемпіонат світу, глобальні правила і стандарти.", "УЄФА — континентальний рівень: єврокубки та чемпіонат Європи.", "УАФ — національний рівень: чемпіонат і Кубок України, збірні команди.", "Правила гри для всіх затверджує IFAB, до якої входить і ФІФА.", "Міжнародні організації фінансують розвиток інфраструктури та дитячого футболу."]}], "f": "Перший чемпіонат світу з футболу відбувся 1930 року в Уругваї, і його переможцем стала збірна господарів.", "pr": ["Склади схему «Футбольні організації»: ФІФА → УЄФА → УАФ, і під кожною напиши 2 турніри або функції.", "Виконай комплекс вправ на поставу (5 вправ по 30 секунд: «кішка», планка на ліктях, «човник», стійка біля стіни, розтягування грудних м'язів)."], "q": ["Коли і де була заснована ФІФА?", "Які турніри проводить УЄФА?", "Чим займається Українська асоціація футболу?", "Що допомагає розвивати легку атлетику в Україні сьогодні?"]}, {"n": "7", "t": "Правила змагань з метань; удари ногою по м'ячу, що котиться", "g": "Учень знатиме основні правила змагань з метань і техніку удару правою та лівою ногою по м'ячу, що котиться.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Заступ", "порушення в метаннях, коли спортсмен торкається лінії або землі за нею; спроба не зараховується."], ["Спроба", "одна дозволена правилами дія спортсмена (кидок, стрибок), результат якої фіксують судді."], ["Опорна нога", "нога, що стоїть поруч із м'ячем під час удару і забезпечує рівновагу."], ["Удар підйомом", "удар верхньою частиною стопи, де шнурівка, який дає силу і дальність."], ["Удар внутрішньою стороною стопи", "удар серединою внутрішньої частини стопи, найточніший спосіб передачі."]], "th": [{"h": "Легка атлетика. Правила проведення змагань з метань", "p": ["До метань належать штовхання ядра, метання диска, списа, молота, а в школі — метання малого м'яча. Кожен учасник має кілька спроб (зазвичай 3, у фіналі найкращі отримують ще 3). Зараховують найкращий результат.", "Спроба не зараховується, якщо спортсмен заступив за лінію або обідок кола, вийшов із сектору наперед, а не ззаду, або снаряд упав за межами сектору. Дальність вимірюють від місця падіння до лінії кидка."], "ul": ["Метають лише за сигналом судді, решта учасників стоїть позаду.", "Після кидка виходять з місця метання через задню половину кола чи доріжки.", "Снаряди повертають, переносячи в руках, а не кидаючи назад.", "Судді показують білий прапорець — спроба зарахована, червоний — ні.", "При рівних результатах вирішує другий найкращий результат."]}, {"h": "Футбол. Удари правою та лівою ногою по м'ячу, що котиться", "p": ["У грі м'яч рідко стоїть на місці, тому важливо вміти бити по м'ячу, що котиться назустріч, від тебе або збоку. Головне — правильно розрахувати момент і поставити опорну ногу поруч із м'ячем, з урахуванням його руху.", "Однаково добре бити обома ногами — велика перевага: суперник не може передбачити твій удар. Тренуй «слабку» ногу частіше, ніж сильну."], "ul": ["М'яч котиться назустріч — опорну ногу став трохи ближче, ніж зазвичай.", "М'яч котиться від тебе — випереджай його й став опорну ногу попереду м'яча.", "Носок ударної ноги натягнутий і зафіксований.", "Під час удару тулуб над м'ячем — так м'яч не злетить угору.", "Типова помилка — опорна нога далеко від м'яча, через що удар слабкий і неточний."]}], "f": "У метанні молота снаряд важить для дорослих чоловіків понад 7 кілограмів, а сам «молот» — це металева куля на тросі з ручкою.", "pr": ["Намалюй схему сектору для метань і познач, де стоять метальник, судді та інші учасники.", "Виконай удома імітацію замаху ногою для удару без м'яча — по 10 разів кожною ногою, тримаючись за опору."], "q": ["У яких випадках спроба в метаннях не зараховується?", "Як вимірюють результат у метанні?", "Де ставиться опорна нога при ударі по м'ячу, що котиться від тебе?", "Чому важливо вміти бити обома ногами?"]}, {"n": "8", "t": "Рухливі ігри з бігом, стрибками й метаннями; фінти та удари на точність і дальність", "g": "Учень знатиме, як рухливі ігри розвивають рухові якості, та розумітиме техніку фінтів «відходом», «ударом», «зупинкою» і ударів на точність і дальність.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Рухлива гра", "гра з правилами, побудована на природних рухах — бігу, стрибках, киданні."], ["Фінт", "обманний рух, яким гравець вводить суперника в оману щодо своїх наступних дій."], ["Фінт «відходом»", "обманний рух тулубом убік, після якого гравець різко йде з м'ячем у протилежний бік."], ["Фінт «ударом»", "замах на удар чи передачу, який гравець не завершує, а обводить суперника."], ["Фінт «зупинкою»", "різка зупинка або імітація зупинки м'яча, після якої гравець знову пришвидшується."]], "th": [{"h": "Легка атлетика. Рухливі ігри з елементами бігу, стрибків, метань", "p": ["Рухливі ігри — найприродніший спосіб тренувати швидкість, спритність і реакцію. Ігри на зразок «Квача», «Вибивного», «Хрестиків-нуликів» з бігом, ігри з влучанням м'ячем у ціль поєднують легкоатлетичні рухи з азартом.", "Щоб гра була безпечною, правила мають бути зрозумілі всім, а ігровий майданчик — вільний від сторонніх предметів."], "ul": ["Ігри з бігом розвивають швидкість реакції та стартове прискорення.", "Ігри зі стрибками тренують силу ніг і координацію.", "Ігри з метаннями розвивають окомір і точність.", "Чесно визнавай, коли тебе «осалили» чи «вибили».", "Не штовхай інших учасників і стеж за межами майданчика."]}, {"h": "Футбол. Фінти «відходом», «ударом», «зупинкою»; удари на точність і дальність", "p": ["Фінт спрацьовує, коли рух виконано правдоподібно, а після нього — різке пришвидшення. Фінт «відходом»: гравець нахиляє тулуб і робить крок в один бік, а йде в інший. Фінт «ударом»: замах на удар, суперник кидається блокувати, а гравець перекидає м'яч убік. Фінт «зупинкою»: гравець пригальмовує, суперник теж зупиняється, і тоді — ривок.", "Удари на точність виконують переважно внутрішньою стороною стопи, на дальність — підйомом із розбігу під кутом. Для дальнього удару опорна нога трохи позаду м'яча, тулуб злегка відхилений."], "ul": ["Фінт виконують на відстані 1,5–2 м від суперника — ні ближче, ні далі.", "Без різкого прискорення після фінту він втрачає сенс.", "Удар на точність: опорна нога поруч із м'ячем, носок ударної розвернутий назовні.", "Удар на дальність: розбіг під кутом, удар підйомом у нижню частину м'яча.", "Тренуй фінти в обидва боки, щоб не бути передбачуваним."]}], "f": "Багато відомих фінтів отримали назви на честь футболістів, які зробили їх популярними.", "pr": ["Опиши письмово, як виконується один із фінтів («відходом», «ударом» або «зупинкою»), розбивши його на 3–4 фази.", "Запиши правила однієї рухливої гри з елементами бігу або метань, у яку грав у дитинстві, і поясни, які якості вона розвиває."], "q": ["Чим фінт «ударом» відрізняється від фінту «зупинкою»?", "Чому після фінту обов'язково потрібне прискорення?", "Якою частиною стопи виконують удар на точність, а якою — на дальність?", "Які рухові якості розвивають рухливі ігри з метаннями?"]}, {"n": "9", "t": "Естафети з бігом, стрибками й метаннями; жонглювання м'ячем ногою", "g": "Учень знатиме правила легкоатлетичних естафет і техніку жонглювання м'ячем ногою.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Естафета", "командне змагання, у якому учасники по черзі проходять свій етап і передають естафету наступному."], ["Етап естафети", "частина дистанції або завдання, яку виконує один учасник команди."], ["Жонглювання", "багаторазове підбивання м'яча різними частинами тіла без падіння на землю."], ["Відчуття м'яча", "вміння точно дозувати силу та напрямок дотику до м'яча."]], "th": [{"h": "Легка атлетика. Естафети з елементами бігу, стрибків, метань", "p": ["Естафета поєднує індивідуальну майстерність і командну відповідальність: кожен учасник має свій етап, а результат залежить від усіх. Шкільні естафети можуть включати біг із прискоренням, стрибки через лінії, метання м'яча в ціль, оббігання стійок.", "Найчастіше команди програють не через повільний біг, а через помилки: фальстарт, непередану естафету, пропущене завдання на етапі."], "ul": ["Наступний учасник стартує лише після торкання чи передачі естафети.", "Чекай свою чергу за стартовою лінією, не заважаючи іншим командам.", "Біжи по своїй доріжці, не перетинаючи шлях суперників.", "Метай у ціль тільки з визначеної лінії й після сигналу.", "Підтримуй товаришів — це теж частина естафети."]}, {"h": "Футбол. Жонглювання м'ячем ногою", "p": ["Жонглювання розвиває відчуття м'яча, координацію і рівновагу. Найпростіше — підбивати м'яч підйомом (верхом стопи): носок натягнутий, стопа рівна, удар легкий, м'яч піднімається на висоту приблизно коліна чи пояса.", "Починати можна з одного дотику та ловіння руками, потім — два дотики, далі — чергувати ноги, додавати стегно і голову. Головне — регулярність: кілька хвилин щодня дають помітний прогрес."], "ul": ["Стопа під м'ячем рівна, інакше м'яч летить убік.", "Опорна нога злегка зігнута, вага тіла — на передній частині стопи.", "Дивись на м'яч, руки допомагають тримати рівновагу.", "Чергуй праву й ліву ногу, щоб розвивати обидві.", "Рахуй дотики й записуй свій рекорд — це мотивує."]}], "f": "Жонглювання м'ячем — окремий вид змагань «фрістайл-футбол», де спортсмени виконують складні трюки під музику.", "pr": ["Якщо вдома є м'який м'яч і безпечне місце без меблів, потренуй жонглювання підйомом 5 хвилин (або імітацію рухів без м'яча) і запиши найкращу кількість дотиків.", "Придумай естафету з трьох етапів для 9 класу і запиши правила та вимоги безпеки до неї."], "q": ["Які помилки найчастіше призводять до поразки в естафеті?", "Яка частина стопи використовується для жонглювання?", "Як жонглювання допомагає в грі?", "Як правильно передавати естафету наступному учасникові?"]}, {"n": "10", "t": "Швидкість і витривалість у легкій атлетиці; індивідуальна, парна й групова робота у футболі", "g": "Учень пояснить, як легка атлетика розвиває швидкість і витривалість, та знатиме форми футбольної роботи в парах, групах і міні-змаганнях.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Швидкість", "здатність людини виконувати рухи за мінімальний час."], ["Витривалість", "здатність тривалий час виконувати роботу без зниження її ефективності, долаючи втому."], ["Загальна витривалість", "здатність довго виконувати роботу помірної інтенсивності, у якій бере участь більшість м'язів."], ["Рольове ігрове завдання", "вправа, де кожен гравець виконує певну роль: нападника, захисника, розігруючого."]], "th": [{"h": "Легка атлетика. Швидкість і витривалість", "p": ["Швидкість проявляється у швидкості реакції (як швидко стартуєш на сигнал), швидкості окремого руху і частоті рухів. Її розвивають короткими прискореннями 10–60 м з максимальною інтенсивністю та повним відпочинком між ними. Найкращий вік для розвитку швидкості — підлітковий, тому зараз варто приділяти їй увагу.", "Витривалість розвивають тривалим бігом у помірному темпі, чергуванням бігу та ходьби, поступовим збільшенням дистанції. Вона потрібна не лише в спорті, а й у повсякденному житті — щоб не втомлюватися від звичайних справ."], "ul": ["Швидкісні вправи виконують на початку основної частини, поки організм не втомлений.", "Між прискореннями відпочинок має бути достатнім, щоб наступне було так само швидким.", "Для витривалості важлива тривалість, а не максимальна швидкість.", "Ознака надмірного навантаження — запаморочення, біль у грудях, сильна задишка: слід зупинитися.", "Обидві якості покращуються лише за регулярних тренувань."]}, {"h": "Футбол. Індивідуальні завдання, парна та групова робота, міні-змагання", "p": ["Індивідуальні завдання допомагають відпрацювати власну техніку: ведення, удари, жонглювання. У парах тренують передачі й зупинки, а також боротьбу один проти одного. Групові вправи вчать взаємодіяти: «квадрат» 4 на 1, передачі в трійках, гра в одне-два дотики.", "Рольові ігрові завдання наближають тренування до реальної гри: кожен знає свою роль і вчиться ухвалювати рішення. Міні-змагання додають азарту і показують, як ти дієш під тиском."], "ul": ["У парній роботі допомагай партнерові: подавай м'яч точно й зручно.", "У групових вправах постійно рухайся, відкриваючись для передачі.", "У рольових завданнях змінюйте ролі, щоб зрозуміти гру з різних позицій.", "У міні-змаганнях дотримуйтеся правил і поважайте суперника.", "Після вправи обговоріть у групі, що вдалося."]}], "f": "Швидкість реакції на звуковий сигнал у тренованих спринтерів дуже висока, тому старт раніше ніж через 0,1 секунди після пострілу вважається фальстартом.", "pr": ["Склади таблицю: 3 вправи для розвитку швидкості та 3 для витривалості (з поясненням, як їх виконувати на стадіоні).", "Виконай удома тест на швидкість реакції з партнером: партнер відпускає лінійку, ти ловиш її пальцями; запиши результат 5 спроб."], "q": ["Які види швидкості ти знаєш?", "Як розвивають загальну витривалість?", "Чому важливо змінювати ролі в рольових ігрових завданнях?", "Які ознаки свідчать, що навантаження надмірне?"]}, {"n": "11", "t": "Біг і стрибки на «швидкісній драбині»; історія олімпійського руху й український футбол", "g": "Учень знатиме, як виконувати вправи на координаційній драбині, і матиме уявлення про історію олімпійського руху та участь українських футболістів в Олімпійських іграх.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Координаційна («швидкісна») драбина", "плоска драбина на підлозі для вправ на частоту кроків, координацію і швидкість стоп."], ["Частота кроків", "кількість кроків за одиницю часу."], ["Олімпійський рух", "міжнародний рух, що об'єднує людей через спорт і цінності дружби, поваги та досконалості."], ["Міжнародний олімпійський комітет (МОК)", "організація, що керує олімпійським рухом і проводить Олімпійські ігри."]], "th": [{"h": "Легка атлетика. Біг і стрибки на «швидкісній драбині»", "p": ["Координаційна драбина розвиває швидкість і точність роботи ніг. Вправи: біг з постановкою однієї чи двох ніг у кожну клітинку, бокові переступання, стрибки на двох ногах, «вхід-вихід» (ноги всередину й назовні клітинки).", "Спочатку вправу виконують повільно і правильно, а швидкість додають, коли рухи стали автоматичними. Наступати на перекладини не можна — це і помилка, і ризик підвернути ногу."], "ul": ["Працюй на передній частині стопи, коліна злегка зігнуті.", "Руки активно допомагають, як під час бігу.", "Погляд — уперед, а не під ноги (з часом).", "Між серіями відпочивай, щоб зберегти якість рухів.", "Драбина має лежати рівно на неслизькій поверхні."]}, {"h": "Футбол. Історія олімпійського руху; участь українських футболістів", "p": ["Сучасні Олімпійські ігри відродив француз П'єр де Кубертен: перші Ігри відбулися 1896 року в Афінах. Олімпійські символи — п'ять переплетених кілець і девіз «Швидше, вище, сильніше — разом». Футбол уперше з'явився на Іграх 1900 року, а офіційний олімпійський турнір проводиться з 1908 року.", "Футболісти з України виступали на Олімпійських іграх у складі збірної СРСР. Як незалежна держава Україна вперше взяла участь в олімпійському футбольному турнірі 2024 року в Парижі. Сьогодні олімпійський футбол — турнір переважно молодіжних збірних із кількома старшими гравцями."], "ul": ["П'ять кілець символізують єднання континентів.", "Олімпійська хартія закликає до чесної гри та поваги.", "Національний олімпійський комітет України представляє країну в МОК.", "Олімпійська участь — велика честь і досвід для молодих футболістів.", "Олімпійські цінності: досконалість, дружба, повага."]}], "f": "Девіз Олімпійських ігор «Швидше, вище, сильніше» у 2021 році доповнили словом «разом».", "pr": ["Намалюй на аркуші схему координаційної драбини і зобрази на ній 2 варіанти вправ (послідовність кроків стрілками).", "Виконай удома без драбини «біг на місці з частими кроками» 3 рази по 15 секунд з відпочинком 45 секунд, на килимку або в кросівках."], "q": ["Які вправи виконують на координаційній драбині?", "Чому не можна наступати на перекладини драбини?", "Хто і коли відродив сучасні Олімпійські ігри?", "Коли збірна України вперше зіграла в олімпійському футбольному турнірі?"]}, {"n": "12", "t": "Повторне пробігання відрізків і спеціальні бігові вправи; удари головою по м'ячу", "g": "Учень знатиме, як виконувати повторне пробігання відрізків і спеціальні бігові вправи, та техніку удару головою без стрибка і в стрибку.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Повторний метод", "виконання однакових відрізків з високою інтенсивністю і відпочинком, достатнім для відновлення."], ["Спеціальні бігові вправи (СБВ)", "вправи, що відпрацьовують окремі елементи бігу: біг з високим підніманням стегна, з закиданням гомілки, семенячий біг."], ["Біг з високим підніманням стегна", "вправа, де стегно піднімається до горизонталі, а постановка ноги — на передню частину стопи."], ["Удар чолом", "удар по м'ячу серединою лоба — найточніший і найбезпечніший спосіб гри головою."]], "th": [{"h": "Легка атлетика. Повторне пробігання 20–200 м і СБВ", "p": ["Повторне пробігання — тренувальний метод, коли відрізок (наприклад, 4 × 60 м чи 3 × 150 м) пробігають з високою інтенсивністю, а потім відпочивають ходьбою. Так розвивають швидкість і швидкісну витривалість. Важливо, щоб кожен відрізок був якісним, а не «через силу».", "Спеціальні бігові вправи — «азбука бігуна». Вони вчать правильно ставити стопу, активно працювати стегном і руками. Їх виконують після розминки на відрізках 15–30 м."], "ul": ["Біг з високим підніманням стегна — тулуб рівний, не відхиляйся назад.", "Біг з закиданням гомілки — п'ятки торкаються сідниць, стегна дивляться вниз.", "Семенячий біг — дрібні часті кроки з перекатом стопи.", "Стрибкоподібний біг — довгі «польотні» кроки з активним поштовхом.", "Між відрізками відпочивай ходьбою до відновлення дихання."]}, {"h": "Футбол. Удари головою по м'ячу зменшеної ваги", "p": ["Удар головою виконують серединою лоба — ця частина найміцніша й дає змогу точно спрямувати м'яч. Очі відкриті до останнього моменту, шия напружена, удар наносить рух тулуба вперед, а не лише кивок голови. У навчанні використовують м'ячі зменшеної ваги, щоб удари були безпечнішими.", "Удар без стрибка виконують з положення ноги нарізно: замах тулубом назад і різкий рух уперед. У стрибку — відштовхуються однією чи двома ногами, прогинаються в повітрі й б'ють у найвищій точці."], "ul": ["Не закривай очі — інакше не влучиш у м'яч серединою лоба.", "Рот закритий, щоб не прикусити язик.", "Удар маківкою або скронею неточний і може бути болючим.", "У стрибку стеж за руками: не відштовхуй ними суперника.", "Удари головою тренують дозовано, без великої кількості повторень."]}], "f": "Через турботу про здоров'я дітей у деяких країнах обмежили кількість ударів головою на дитячих тренуваннях.", "pr": ["Виконай удома СБВ на місці: біг з високим підніманням стегна і з закиданням гомілки — по 3 серії по 15 секунд (на килимку, без стрибків).", "Опиши письмово техніку удару головою без стрибка, розділивши її на фази: вихідне положення, замах, удар, завершення."], "q": ["Чим повторний метод відрізняється від тривалого бігу?", "Назви три спеціальні бігові вправи і їх призначення.", "Якою частиною голови правильно бити по м'ячу і чому?", "Чому в навчанні використовують м'ячі зменшеної ваги?"]}, {"n": "13", "t": "Біг на 30 м: техніка й тестування; удари головою в стрибку та правила «чесної гри»", "g": "Учень знатиме, як правильно пробігти тест на 30 м і оцінити свій результат, а також розумітиме принципи чесної гри у футболі.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Фальстарт", "початок руху раніше стартового сигналу."], ["Стартовий розгін", "відрізок після старту, на якому бігун набирає максимальну швидкість."], ["Фейр-плей", "принцип чесної гри: повага до суперника, суддів, правил і самої гри."], ["Стрибок з розбігу", "стрибок, перед яким гравець робить кілька кроків для набору швидкості і вищого вистрибування."]], "th": [{"h": "Легка атлетика. Біг на 30 м", "p": ["Біг на 30 м — тест на стартову швидкість: майже вся дистанція припадає на старт і стартовий розгін. Тому важливо швидко зреагувати на сигнал, потужно відштовхнутися і не випрямлятися занадто рано. Зазвичай використовують високий старт або старт з опорою на руку.", "Перед тестом обов'язкова розминка з кількома прискореннями. Оцінюй свій результат не лише за нормативом, а й порівнюючи з попередніми спробами — прогрес видно саме так."], "ul": ["Команди: «На старт!» — стати, «Увага!» — нахилитися й завмерти, сигнал — старт.", "Перші 5–6 кроків — короткі й потужні, тулуб нахилений уперед.", "Біжи «крізь фініш», не гальмуючи перед лінією.", "Фініш фіксується, коли тулуб перетинає фінішну лінію.", "Не порівнюй себе лише з іншими: записуй свої результати й стеж за динамікою."]}, {"h": "Футбол. Стрибки з ударами головою; правила «чесної гри»", "p": ["Щоб виграти верховий м'яч, потрібно вчасно вистрибнути: стрибок з місця — у тісноті, з розбігу — коли є простір. Відштовхування однією ногою дає більшу висоту з ходу, двома — кращу стабільність. Удар виконують у найвищій точці стрибка.", "Чесна гра — це не лише правила, а й поведінка: подати руку суперникові, вибити м'яч за межі поля, якщо хтось травмувався, визнати свою помилку, не симулювати. Фейр-плей вчить поважати інших і самого себе."], "ul": ["У стрибку не використовуй руки для штовхання суперника — це порушення.", "Приземлення — на зігнуті ноги для амортизації.", "Повертай м'яч суперникові після вимушеної зупинки гри через травму.", "Не симулюй падіння — це неспортивна поведінка, за яку показують жовту картку.", "Подякуй суперникам і суддям після гри незалежно від результату."]}], "f": "ФІФА та УЄФА мають спеціальні нагороди фейр-плей для команд і гравців, які показали зразкову спортивну поведінку.", "pr": ["Запиши алгоритм виконання тесту з бігу на 30 м (від розминки до фінішу) і 3 поради, як покращити результат.", "Наведи 3 приклади ситуацій фейр-плей у спорті (з власного досвіду або з матчів) і поясни, чому вони важливі."], "q": ["Чому біг на 30 м називають тестом на стартову швидкість?", "Які команди подаються на старті?", "Чим відрізняється стрибок з місця від стрибка з розбігу при ударі головою?", "Наведи приклади дотримання принципу фейр-плей у футболі."]}, {"n": "14", "t": "Спритність, гнучкість, швидкісно-силові якості; футбольні естафети й постава", "g": "Учень пояснить, як легка атлетика розвиває спритність, гнучкість і швидкісно-силові якості, та знатиме, як систематичні заняття запобігають порушенням постави.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Спритність", "здатність швидко освоювати нові рухи й точно змінювати їх відповідно до ситуації."], ["Гнучкість", "здатність виконувати рухи з великою амплітудою."], ["Швидкісно-силові якості", "здатність проявляти значну силу за мінімальний час, наприклад у стрибках і метаннях."], ["Постава", "звичне положення тіла людини в стані спокою і під час руху."], ["Сколіоз", "бічне викривлення хребта."]], "th": [{"h": "Легка атлетика. Спритність, гнучкість і швидкісно-силові якості", "p": ["Легка атлетика розвиває не лише швидкість і витривалість. Стрибки й метання тренують швидкісно-силові якості (вибуховість), бар'єрний біг і естафети — спритність, а розминка й розтяжка — гнучкість. Ці якості пов'язані: наприклад, хороша гнучкість стегон дає довший крок у бігу.", "Гнучкість розвивають регулярними вправами на розтягування після розминки, плавно, без ривків. Спритність — вправами з несподіваною зміною завдань. Швидкісно-силові якості — стрибками та кидками, де важлива швидкість виконання."], "ul": ["Вправи на розтягування — лише на розігріті м'язи, утримання 15–30 секунд.", "Біль під час розтяжки — сигнал зменшити амплітуду.", "Стрибкові вправи виконують на м'якому покритті, приземлення на зігнуті ноги.", "Спритність добре розвивається в іграх зі зміною напрямку.", "Різнобічна підготовка зменшує ризик травм."]}, {"h": "Футбол. Естафети та ігри з елементами футболу; профілактика порушень постави", "p": ["Естафети з веденням, передачами та ударами — веселий спосіб тренувати техніку й командну роботу. Вони також зміцнюють м'язи ніг, спини і пресу.", "Порушення постави (сутулість, сколіоз) часто пов'язані з довгим сидінням і слабкими м'язами спини. Систематичні заняття фізичними вправами формують «м'язовий корсет», який тримає хребет у правильному положенні. Футбол корисний, але асиметричне навантаження (б'єш лише однією ногою) варто врівноважувати вправами на обидві сторони."], "ul": ["Перевір поставу: стань спиною до стіни — п'ятки, сідниці, лопатки й потилиця мають торкатися її.", "Щодня виконуй вправи для м'язів спини та пресу: планка, «човник», «кішка».", "Під час навчання роби перерву кожні 30–40 хвилин.", "Рюкзак носи на двох лямках.", "Тренуй обидві ноги в футболі — це й техніка, і симетрія тіла."]}], "f": "Тривале сидіння з телефоном, нахиливши голову вперед, суттєво збільшує навантаження на шийний відділ хребта.", "pr": ["Перевір свою поставу біля стіни і запиши висновок; потім виконай комплекс із 5 вправ для постави (по 30 секунд кожна).", "Виконай вправи на гнучкість після легкої розминки: нахили вперед сидячи, «метелик», розтягування задньої поверхні стегна стоячи біля опори — по 3 підходи по 20 секунд."], "q": ["Які вправи легкої атлетики розвивають швидкісно-силові якості?", "Як правильно розвивати гнучкість?", "Що таке «м'язовий корсет» і навіщо він потрібен?", "Як перевірити свою поставу самостійно?"]}, {"n": "15", "t": "Біг на 60 м; вкидання м'яча з місця та після розбігу у футболі", "g": "Учень знатиме техніку і правила тесту з бігу на 60 м та правила й техніку вкидання м'яча у футболі.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Біг по дистанції", "частина спринту після розгону, де бігун утримує максимальну швидкість."], ["Вкидання м'яча", "спосіб введення м'яча в гру руками з-за бокової лінії."], ["Бокова лінія", "лінія, що обмежує поле з довшого боку."], ["Змагальна ситуація", "ігровий епізод, у якому гравці діють в умовах боротьби з суперником."]], "th": [{"h": "Легка атлетика. Біг на 60 м", "p": ["Біг на 60 м перевіряє не тільки стартову, а й максимальну швидкість. Складається зі старту, стартового розгону (приблизно 20–30 м), бігу по дистанції та фінішування. На дистанції важливо зберегти розслаблені плечі й обличчя, активно працювати руками і не «засідати» на ногах.", "Як підготуватися до тесту: якісна розминка, СБВ, 2–3 прискорення на 20–30 м. Після тесту оціни, на якому відрізку втрачав швидкість: на старті, в середині чи на фініші."], "ul": ["Тулуб поступово випрямляється протягом розгону.", "Руки рухаються вперед-назад, а не поперек тіла.", "Не повертай голову, щоб подивитися на суперника — це гальмує.", "Фінішуй кидком грудьми чи плечем, не стрибаючи.", "Записуй результат і порівнюй із попереднім."]}, {"h": "Футбол. Вкидання м'яча з місця і після розбігу", "p": ["Коли м'яч повністю перетинає бокову лінію, його вводять у гру вкиданням. Гравець стоїть обличчям до поля, обидві ноги на лінії або за нею й торкаються землі, м'яч кидає обома руками з-за голови. З вкидання гол забити не можна, а положення «поза грою» не фіксується.", "Вкидання з розбігу дає більшу дальність: кілька кроків, замах із прогином у спині, кидок за рахунок усього тіла. Правило те саме — в момент кидка обидві ноги торкаються землі."], "ul": ["Обидві руки, м'яч з-за голови — інакше вкидання переходить до суперника.", "Не відривай ногу від землі в момент кидка.", "Вкидай партнерові в ноги чи груди, щоб було зручно прийняти.", "Партнери рухаються, щоб відкритися для вкидання.", "Не затягуй час вкиданням — це карається попередженням."]}], "f": "Деякі футболісти вміють вкидати м'яч з розбігу так далеко, що команди використовують це як справжній кутовий удар.", "pr": ["Намалюй схему правильного і неправильного вкидання м'яча (положення ніг і рук) з підписами.", "Опиши, як ти оцінюєш свій результат у бігу на 60 м: що було добре і що потрібно покращити (якщо тест ще не виконано — склади план підготовки)."], "q": ["З яких фаз складається біг на 60 м?", "Які вимоги до положення ніг і рук під час вкидання?", "Чи можна забити гол безпосередньо з вкидання?", "Чому важливо не повертати голову під час спринту?"]}, {"n": "16", "t": "Біг з перешкодами; перша допомога при травмах і стандартні положення у футболі", "g": "Учень знатиме техніку подолання перешкод у бігу, правила першої допомоги при спортивних травмах і види стандартних положень у футболі.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Перешкода", "предмет на шляху бігуна, який потрібно перебігти, переступити чи перестрибнути."], ["Махова нога", "нога, яку першою виносять над перешкодою."], ["Стандартне положення", "відновлення гри після зупинки: кутовий, штрафний, пенальті, вкидання, удар від воріт."], ["Пенальті", "одинадцятиметровий удар, який призначають за порушення в штрафному майданчику."]], "th": [{"h": "Легка атлетика. Біг з перешкодами висотою до 40 см", "p": ["Перешкоди бувають вертикальні (низькі бар'єри, стійки) і горизонтальні (канавки, лінії, гімнастичні мати). Їх долають з опорою (наступивши) і без опори, з приземленням на одну або обидві ноги. Головне — не втрачати швидкості й ритму.", "Перед перешкодою не зупиняйся й не дріботи: розрахуй останні кроки заздалегідь. Над перешкодою махова нога йде вперед, тулуб трохи нахилений, приземлення — на передню частину стопи і продовження бігу."], "ul": ["Перешкоди мають бути стійкими, але легко перекидатися при зачепленні.", "Дистанція між перешкодами — така, щоб зберігався однаковий ритм кроків.", "Не стрибай високо — переходь перешкоду якомога нижче.", "Приземлення на обидві ноги — на зігнуті коліна.", "Виконуй вправу лише після розминки і з інтервалом між учасниками."]}, {"h": "Футбол. Перша допомога при спортивних травмах; стандартні положення", "p": ["Якщо гравець травмувався, гру зупиняють. Не можна піднімати потерпілого чи тягнути за кінцівку — спочатку з'ясуй, що болить, поклич учителя. При ударах у голову гравця обов'язково знімають з гри й спостерігають: нудота, запаморочення, сплутаність — ознаки струсу, потрібен лікар.", "Стандартні положення — кутові, штрафні, пенальті, вкидання, удари від воріт. Багато голів забивають саме після них, тому команди заздалегідь розігрують комбінації: хто подає, хто біжить на ближню і дальню штангу, хто страхує позаду."], "ul": ["При травмі голови — жодного продовження гри в цей день без огляду лікаря.", "Штрафний удар буває прямим (можна бити у ворота) і непрямим (потрібен дотик іншого гравця).", "Під час штрафного стінка суперника стоїть не ближче 9,15 м від м'яча.", "На кутовому захисники розподіляють зони і персональну опіку.", "Подачу виконують у зону, про яку команда домовилася заздалегідь."]}], "f": "Відстань 9,15 м у футболі з'явилася тому, що в правилах початково вона була вказана як 10 ярдів.", "pr": ["Запиши ознаки, за якими можна запідозрити струс мозку після удару головою, і алгоритм дій.", "Намалюй схему розіграшу кутового удару: хто подає, де стоять нападники та захисники."], "q": ["Як правильно долати горизонтальні й вертикальні перешкоди?", "Що робити, якщо гравець отримав удар у голову?", "Чим прямий штрафний удар відрізняється від непрямого?", "Чому важливо заздалегідь домовлятися про розіграш стандартних положень?"]}, {"n": "17", "t": "Гнучкість і спритність; зупинки м'яча підошвою та внутрішньою стороною стопи", "g": "Учень знатиме вправи для розвитку гнучкості й спритності та техніку зупинки м'яча підошвою і внутрішньою стороною стопи.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Амплітуда руху", "розмах руху, тобто наскільки далеко може рухатися частина тіла в суглобі."], ["Статична розтяжка", "утримання положення розтягнутого м'яза протягом кількох секунд без пружинення."], ["Динамічна розтяжка", "розтягування м'язів у русі: махи, випади, обертання."], ["Зупинка м'яча", "прийом, яким гравець гасить швидкість м'яча і бере його під контроль."]], "th": [{"h": "Легка атлетика. Вправи для гнучкості та спритності; рухливі ігри", "p": ["Перед навантаженням краще виконувати динамічну розтяжку (махи ногами, випади з поворотом), а після — статичну, утримуючи положення 20–30 секунд. Спритність тренують вправами з несподіваною зміною напряму: біг «змійкою», човниковий біг, ігри з реакцією на сигнал.", "Рухливі ігри з бігом, стрибками й метаннями поєднують усі ці якості. Коли рух стає грою, тренування проходить цікавіше, а навантаження сприймається легше."], "ul": ["Розтягуй м'язи плавно, без ривків і пружинення.", "Не затримуй дихання під час розтяжки.", "Спритність тренуй на свіжу голову — на початку основної частини.", "У рухливих іграх стеж за межами майданчика й іншими гравцями.", "Систематичність важливіша за інтенсивність: краще щодня потроху."]}, {"h": "Футбол. Зупинки м'яча підошвою та внутрішньою стороною стопи", "p": ["Зупинка підошвою — найпростіша: нога піднята над землею, носок угору, підошва «накриває» м'яч, притискаючи його. Використовують для м'ячів, що котяться назустріч. Зупинка внутрішньою стороною стопи — найпоширеніша: стопу розвертають назовні, і в момент дотику нога трохи відходить назад, «гасячи» удар.", "Головне у зупинці — «м'яка» нога: вона поступається м'ячеві, а не б'є його. Тоді м'яч залишається поряд, і можна одразу продовжити гру."], "ul": ["Виходь назустріч м'ячу, а не чекай на місці.", "Перед прийомом озирнися — знатимеш, куди повести м'яч.", "Зупинка підошвою: не наступай на м'яч усією вагою — можна впасти.", "Зупинка внутрішньою стороною: опорна нога злегка зігнута.", "Типова помилка — жорстка стопа, від якої м'яч відскакує."]}], "f": "Майстерні футболісти часто приймають м'яч уже в напрямку наступного руху, щоб одним дотиком і зупинити, і обійти суперника.", "pr": ["Виконай удома комплекс динамічної розминки (махи ногами біля опори, випади, обертання тазом) і потім статичну розтяжку — разом 10 хвилин.", "Опиши відмінності між зупинкою підошвою та внутрішньою стороною стопи (коли використовують, як виконують)."], "q": ["Коли краще виконувати динамічну, а коли статичну розтяжку?", "Які вправи розвивають спритність?", "Як виконується зупинка м'яча підошвою?", "Чому під час зупинки нога має бути «м'якою»?"]}, {"n": "18", "t": "Естафети з легкоатлетичними елементами; зупинки м'яча стегном і грудьми", "g": "Учень знатиме, як організувати безпечні естафети з бігом, стрибками й метаннями, і техніку зупинки м'яча стегном та грудьми.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Командна естафета", "змагання між командами, у якому перемагає команда, що першою правильно виконала всі етапи."], ["Амортизація", "пом'якшення удару завдяки відступальному руху частини тіла."], ["Зупинка стегном", "прийом верхового м'яча серединою передньої поверхні стегна."], ["Зупинка грудьми", "прийом високого м'яча грудьми з відхиленням тулуба для гасіння удару."]], "th": [{"h": "Легка атлетика. Естафети з елементами бігу, стрибків, метань", "p": ["Естафети на уроці можуть бути лінійними (біг до стійки й назад) чи зустрічними (команда розділена на дві половини, що стоять одна навпроти одної). До них додають стрибки через скакалку, стрибки з місця, метання м'яча в ціль.", "Найважливіше в естафеті — чіткі правила: де лінія старту, як передається естафета, що робити, якщо помилився на етапі. Порушення правил зазвичай карається штрафним часом або поверненням на етап."], "ul": ["Перед естафетою кожен має знати свій етап.", "Помилився — повернись і виконай завдання правильно.", "Зустрічна естафета: передаєш естафету, проходиш у кінець протилежної колони.", "Не бігай назустріч іншій команді по її доріжці.", "Після фінішу залишайся на місці й не заважай іншим."]}, {"h": "Футбол. Зупинки стегном та грудьми", "p": ["Зупинка стегном використовується для м'ячів, що падають зверху. Стегно піднімають назустріч м'ячу і в момент дотику опускають униз, гасячи швидкість. М'яч падає перед гравцем, і його можна одразу підхопити ногою.", "Зупинка грудьми — для високих м'ячів. Ноги зігнуті, руки розведені (але не торкаються м'яча!), груди виставлені вперед. У момент дотику тулуб трохи відхиляється назад і м'яч скочується вниз до ніг. На уроці цей прийом відпрацьовують хлопці, дівчата можуть використовувати інші способи зупинки."], "ul": ["Слідкуй за м'ячем очима до моменту дотику.", "Стегно рухається вниз саме в момент дотику, а не раніше.", "У зупинці грудьми руки не допомагають — інакше гра рукою.", "Після зупинки одразу оглянься і продовжуй атаку.", "Починай з легких подач руками партнера."]}], "f": "Зупинку грудьми інколи виконують із невеликим поворотом тулуба, щоб одразу спрямувати м'яч у потрібний бік.", "pr": ["Придумай зустрічну естафету з двома видами завдань (біг і метання в ціль) і запиши її правила та вимоги безпеки.", "Виконай удома вправу для м'язів стегна: підйоми стегна стоячи біля опори по 12 разів кожною ногою, 3 підходи."], "q": ["Чим лінійна естафета відрізняється від зустрічної?", "Як виконується зупинка м'яча стегном?", "Чому під час зупинки грудьми не можна допомагати руками?", "Що таке амортизація і навіщо вона потрібна?"]}, {"n": "19", "t": "Біг з перешкодами: закріплення; індивідуальні дії в нападі — маневрування й вибір позиції", "g": "Учень удосконалить уявлення про техніку бігу з перешкодами та знатиме, як нападник маневрує і вибирає позицію.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Ритм бігу", "чергування кроків однакової довжини й тривалості між перешкодами."], ["Атакувальний крок", "останній крок перед перешкодою, з якого починається її подолання."], ["Маневрування", "пересування гравця без м'яча з метою звільнитися від опіки й отримати передачу."], ["Вибір позиції", "розміщення гравця в місці, звідки йому зручно отримати м'яч чи завершити атаку."]], "th": [{"h": "Легка атлетика. Біг з перешкодами: закріплення техніки", "p": ["На повторному уроці з бігу з перешкодами головне завдання — ритм. Якщо відстань між перешкодами однакова, бігун має робити між ними однакову кількість кроків. Це дає змогу не гальмувати й не «підлаштовуватися» в останній момент.", "Перешкоди долають різними способами: з опорою (наступаючи на неї), переступанням, стрибком з приземленням на одну або обидві ноги. Вибирати спосіб треба за висотою перешкоди та швидкістю бігу."], "ul": ["Атакувальний крок — активний, тулуб нахиляється вперед.", "Махова нога піднімається зігнутою, потім випрямляється над перешкодою.", "Поштовхова нога швидко переноситься через перешкоду збоку.", "Приземлення на передню частину стопи, одразу перехід у біг.", "Якщо збився з ритму — не стрибай «з місця», краще оббіжи перешкоду на тренуванні."]}, {"h": "Футбол. Індивідуальні дії в нападі: маневрування, вибір позиції", "p": ["Більшу частину гри футболіст рухається без м'яча. Щоб отримати передачу, нападник має звільнитися від захисника: різко змінити напрям, зробити ривок у вільну зону, «відкритися» на сусідньому фланзі. Ці дії називають маневруванням.", "Вибір позиції — це вміння бути в правильному місці: не стояти за спиною захисника, бачити і м'яч, і ворота, не потрапити в положення «поза грою». У парній роботі та міні-іграх це вміння тренують найкраще."], "ul": ["Відкривайся в зону, куди партнер може передати м'яч.", "Ривок роби, коли партнер готовий передати, а не раніше.", "Змінюй темп: повільний рух — і різке прискорення.", "Стеж за лінією останнього захисника, щоб не опинитися в офсайді.", "Підказуй партнерові голосом або жестом."]}], "f": "Сучасні футболісти за матч пробігають багато кілометрів, і переважну частину цієї відстані — без м'яча.", "pr": ["Намалюй схему: нападник «відкривається» від захисника для отримання передачі (стрілками покажи рух гравця і м'яча).", "Виконай удома вправу на рівновагу «ластівка» біля опори — по 20 секунд на кожну ногу, 3 підходи."], "q": ["Чому важливо зберігати ритм кроків між перешкодами?", "Що таке атакувальний крок?", "Як нападник може звільнитися від опіки захисника?", "Як не потрапити в положення «поза грою» під час вибору позиції?"]}, {"n": "20", "t": "Швидкість і спритність, біг по віражу; вольові якості й індивідуальні дії в захисті", "g": "Учень знатиме техніку бігу по віражу та розумітиме, як футбол формує вольові якості і як діє захисник у відборі м'яча.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Віраж", "заокруглена частина бігової доріжки стадіону."], ["Відцентрова сила", "сила, яка «виносить» бігуна назовні під час бігу по колу."], ["Вольові якості", "риси характеру, що допомагають долати труднощі: наполегливість, рішучість, витримка, самовладання."], ["Закривання", "дії захисника, що не дають нападникові отримати м'яч або пройти до воріт."], ["Перехоплення", "заволодіння м'ячем під час передачі суперника."]], "th": [{"h": "Легка атлетика. Вправи для швидкості та спритності; біг по віражу", "p": ["На віражі бігуна «виносить» назовні. Щоб утримати швидкість, тулуб нахиляють усередину повороту, ліва рука працює ближче до тулуба, права — ширше й активніше, стопи ставлять з невеликим розворотом уліво. Біжать ближче до лівого краю своєї доріжки, не наступаючи на лінію.", "Швидкість і спритність тренують прискореннями з різних вихідних положень, бігом зі зміною напряму, естафетами. Біг по віражу поєднує обидві якості: швидкість і контроль тіла."], "ul": ["Нахил тіла всередину пропорційний швидкості: швидше — більший нахил.", "Не наступай на лінію доріжки — це порушення на змаганнях.", "На виході з віражу поступово випрямляй тулуб.", "Права рука рухається трохи всередину, ліва — більше вздовж тулуба.", "Починай з невеликої швидкості, поступово збільшуючи."]}, {"h": "Футбол. Вольові якості; індивідуальні дії в захисті", "p": ["Футбол формує характер: ти вчишся не здаватися після пропущеного гола, грати до кінця, тримати себе в руках після несправедливого рішення, відповідати за свою позицію. Вольові якості розвиваються тоді, коли ти долаєш себе: втому, страх, лінощі.", "У захисті гравець закриває суперника (тримається між ним і воротами), перехоплює передачі (читає гру й вибігає на м'яч) і відбирає м'яч (атакує в момент, коли суперник втратив контроль). Відбір має бути чесним — грати в м'яч, а не в ноги."], "ul": ["Стійка захисника: ноги зігнуті, одна попереду, вага на передній частині стоп.", "Не кидайся в ноги одразу — змушуй суперника помилитися.", "Перехоплення: дивись на м'яч і суперника одночасно.", "Відбирай м'яч, коли він відскочив від ноги суперника.", "Після відбору — швидка передача партнерові."]}], "f": "У бігу на 200 м і 400 м старт ступінчастий: бігуни на зовнішніх доріжках стартують попереду, щоб усі пробігли однакову відстань.", "pr": ["Запиши 4 вольові якості, які розвиває футбол, і для кожної наведи приклад ігрової ситуації.", "Намалюй схему бігової доріжки стадіону, позначивши віражі й прямі, та підпиши 3 правила техніки бігу по віражу."], "q": ["Чому під час бігу по віражу тулуб нахиляють усередину?", "Які вольові якості допомагають у футболі?", "Чим перехоплення відрізняється від відбору м'яча?", "Як має стояти захисник проти нападника з м'ячем?"]}, {"n": "21", "t": "Стрибок у довжину з місця; способи ведення м'яча та елементи гри воротаря", "g": "Учень знатиме техніку стрибка в довжину з місця, різні способи ведення м'яча і базові дії воротаря.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Стрибок у довжину з місця", "стрибок поштовхом двох ніг уперед із вихідного положення без розбігу."], ["Мах руками", "швидкий рух рук уперед-угору, який збільшує силу поштовху."], ["Воротар", "гравець, який захищає ворота і має право грати руками у своєму штрафному майданчику."], ["Відбивання м'яча", "дія воротаря, коли він не ловить, а відбиває м'яч кулаком чи долонею."]], "th": [{"h": "Легка атлетика. Стрибок у довжину з місця", "p": ["Вихідне положення: ноги на ширині стоп, носки біля лінії. Підготовка: руки відводять назад, ноги згинають, тулуб нахиляють. Поштовх: одночасний вибуховий рух ногами і мах руками вперед-угору. Політ: ноги підтягують до грудей. Приземлення: на обидві ноги, коліна згинаються, руки виносять уперед, щоб не впасти назад.", "Результат вимірюють від лінії відштовхування до найближчого сліду від тіла — тому падіння назад на руки «з'їдає» сантиметри."], "ul": ["Не заступай за лінію ногами перед стрибком.", "Відштовхуйся одночасно двома ногами.", "Мах руками дуже важливий — без нього результат нижчий.", "Приземляйся на зігнуті ноги, переносячи вагу вперед.", "Стрибай лише на неслизькому покритті або в яму з піском."]}, {"h": "Футбол. Ведення м'яча різними способами; елементи гри воротаря", "p": ["Ведення внутрішньою стороною стопи дає хороший контроль, зовнішньою частиною підйому — швидкість, серединою підйому — пряме ведення на високій швидкості, підошвою — розвороти. Добрий гравець поєднує всі способи залежно від ситуації.", "Воротар ловить м'яч «долонями-кошиком» з розставленими пальцями; низькі м'ячі — з опусканням на коліно або нахилом, щоб тіло було другою перешкодою. Відбивають м'яч, коли спіймати складно. Вибивають — ногою з рук або з землі, щоб почати атаку."], "ul": ["Ведення: м'яч не далі одного кроку, коли поруч суперник.", "Воротар: великі пальці утворюють «вікно» за м'ячем.", "Ловіння знизу: пальці донизу, м'яч притискається до грудей.", "Відбивання — подалі від воріт і в бік, а не в центр.", "Воротар руками грає лише в межах свого штрафного майданчика."]}], "f": "Воротар не може брати в руки м'яч, який партнер навмисно віддав йому ногою, — це правило з'явилося, щоб гра не затягувалася.", "pr": ["Виконай удома імітацію стрибка без стрибка: «відведення рук — присід — мах угору з підйомом на носки» 10 разів, контролюючи погодження рук і ніг.", "Опиши письмово 4 способи ведення м'яча і ситуації, у яких кожен із них найкращий."], "q": ["З яких фаз складається стрибок у довжину з місця?", "Від якого місця вимірюють результат стрибка?", "Як воротар правильно ловить м'яч, що летить на рівні грудей?", "Коли воротарю краще відбити м'яч, ніж ловити?"]}, {"n": "22", "t": "Метання малого м'яча в ціль; обведення, вибір позиції на стандартах і командний напад", "g": "Учень знатиме техніку метання малого м'яча в ціль, обведення перешкод і принципи командних тактичних дій у нападі.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Метання в ціль", "кидок снаряда з метою влучити в задану мішень."], ["Вертикальна ціль", "мішень, розташована на стіні чи щиті."], ["Обведення", "проходження з м'ячем повз суперника чи перешкоду без втрати м'яча."], ["Командні тактичні дії в нападі", "узгоджені дії кількох гравців для створення гольової ситуації."], ["Фланг", "бічна частина поля."]], "th": [{"h": "Легка атлетика. Метання малого м'яча в ціль", "p": ["Для метання в ціль важливіші точність і стабільність, ніж сила. Вихідне положення — лівим боком до цілі (для правші), рука з м'ячем відведена назад. Кидок — рух «з-за голови» з випрямленням руки в напрямку цілі. У вертикальну ціль (на стіні) м'яч летить майже прямо, у горизонтальну (на землі) — дугою.", "Окомір розвивається з повтореннями: після кожного кидка аналізуй, куди влетів м'яч, і коригуй силу та кут."], "ul": ["Метай лише за командою і лише в бік, де немає людей.", "Погляд — на ціль до самого кидка.", "Не кидай «від плеча» без замаху — рука травмується.", "Збирати м'ячі йди всі разом, після команди вчителя.", "Діагностуваль
