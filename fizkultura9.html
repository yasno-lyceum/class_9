нападаючий удар?", "Чим верхня бокова подача відрізняється від верхньої прямої?", "Як вітер впливає на подачу?", "Куди найвигідніше подавати в пляжному волейболі?"]}, {"n": "62", "t": "Нападаючий удар гравців задньої лінії; прямий нападаючий удар із різних зон біля сітки", "g": "Дізнатися правила атаки з задньої лінії та особливості нападаючого удару з різних зон біля сітки.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Лінія атаки", "лінія на відстані 3 м від сітки, що відділяє передню зону від задньої."], ["Атака з задньої лінії", "нападаючий удар гравця задньої лінії зі стрибком позаду лінії атаки."], ["Діагональний удар", "нападаючий удар, спрямований навскіс через майданчик."], ["Удар по лінії", "нападаючий удар вздовж бокової лінії майданчика."]], "th": [{"h": "Волейбол. Нападаючий удар гравцями задньої лінії", "p": ["За правилами гравець задньої лінії може атакувати м'яч вище верхнього краю сітки, лише якщо відштовхнувся позаду лінії атаки. Після удару він може приземлитися в передній зоні.", "Атака з задньої лінії дає команді додатковий варіант нападу, коли гравців передньої лінії блокують."], "ul": ["Відштовхування — позаду лінії атаки (3 м).", "Передача для такої атаки висока й трохи далі від сітки.", "Удар виконують з сильним замахом і спрямовують у глибину.", "Заступ на лінію атаки під час відштовхування — порушення.", "Ця атака вимагає доброї стрибучості й точного розбігу."]}, {"h": "Пляжний волейбол. Прямий нападаючий удар із різних зон біля сітки", "p": ["У пляжному волейболі немає лінії атаки, а майданчик менший, тому гравець може атакувати з будь-якої точки біля сітки. Від того, з якого місця він б'є, залежить напрям удару.", "Нападник повинен бачити суперників і вибирати, куди бити: по діагоналі чи по лінії."], "ul": ["Атака з краю — частіше по діагоналі.", "Атака з середини — можна бити в обидва боки.", "Перед стрибком подивися, де стоїть захисник.", "Розбіг на піску коротший, ніж у залі.", "Приземлення — на свою половину, без дотику до сітки."]}], "f": "У пляжному волейболі на майданчику немає лінії атаки, яка є у класичному волейболі.", "pr": ["Намалюй майданчик для класичного волейболу, познач лінію атаки й покажи стрілкою, звідки гравець задньої лінії може виконувати атаку.", "Опиши в зошиті різницю між ударом по лінії та діагональним ударом, наведи ситуацію для кожного."], "q": ["Звідки має відштовхуватися гравець задньої лінії для атаки?", "На якій відстані від сітки проходить лінія атаки?", "Чи є лінія атаки в пляжному волейболі?", "Що таке удар по діагоналі?"]}, {"n": "63", "t": "Вправи на розтягування у волейболі; стрибкові вправи для вдосконалення нападу", "g": "Навчитися безпечно виконувати вправи на розтягування та розуміти, які стрибкові вправи вдосконалюють нападаючі дії.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Статичне розтягування", "утримання м'яза в розтягнутому положенні 15–30 секунд."], ["Динамічне розтягування", "плавні махи й рухи з поступовим збільшенням амплітуди."], ["Вистрибування", "стрибок угору з напівприсіду з повним випрямленням тіла."], ["Відштовхування", "поштовх ногами від опори, що створює стрибок."]], "th": [{"h": "Волейбол. Вправи на розтягування", "p": ["Розтягування робить м'язи еластичними та зменшує ризик травм. Динамічне розтягування виконують у розминці, статичне — у заключній частині заняття.", "Волейболісту особливо важливо розтягувати плечі, спину, стегна та гомілки."], "ul": ["Махи руками й ногами — у розминці.", "Нахил до прямих ніг, сидячи, — задня поверхня стегна.", "Випад уперед — передня поверхня стегна і таз.", "Розтягування плечей, притискаючи руку до грудей іншою рукою.", "Не пружинь і не терпи гострий біль."]}, {"h": "Пляжний волейбол. Стрибкові вправи для вдосконалення нападаючих дій", "p": ["Висота стрибка впливає на силу й точність нападаючого удару. Тренування стрибків поєднують з імітацією удару, щоб рух руки збігався з найвищою точкою стрибка.", "На піску стрибки м'якші для суглобів, але вимагають більшої сили."], "ul": ["Вистрибування з напівприсіду з махом рук.", "Стрибки з двох кроків розбігу з імітацією удару.", "Серія стрибків біля сітки з торканням верхнього краю (за наявності).", "Між серіями — повний відпочинок.", "Відштовхування — двома ногами, мах руками допомагає злетіти вище."]}], "f": "", "pr": ["Виконай комплекс статичного розтягування з 5 вправ (кожну по 20–30 секунд) і запиши, які м'язи він охоплює.", "Опиши у 4–5 реченнях, як правильно поєднати стрибок і замах для нападаючого удару."], "q": ["Чим статичне розтягування відрізняється від динамічного?", "Коли краще виконувати статичне розтягування?", "Навіщо нападнику мах руками під час стрибка?", "Які м'язи волейболісту особливо важливо розтягувати?"]}, {"n": "64", "t": "Нижня пряма та бокова подачі з 4–6 м; основні поняття тактики пляжного волейболу", "g": "Закріпити техніку нижніх подач і дізнатися основи тактики пляжного волейболу.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Тактика", "план дій гравця чи команди, спрямований на перемогу з урахуванням сил суперника."], ["Тактичний план", "заздалегідь обраний спосіб гри проти конкретного суперника."], ["Слабка ланка", "гравець або зона, де суперник частіше помиляється."], ["Стабільність подачі", "здатність подавати без помилок багато разів поспіль."]], "th": [{"h": "Волейбол. Нижня пряма та бокова подачі з 4–6 м від сітки та від стіни", "p": ["Повторюємо нижні подачі, щоб довести їх до стабільності. Подача у стіну дає змогу виконати багато повторень за короткий час, а подача через сітку — перевірити точність.", "Метою вправи є щонайменше 8 вдалих подач з 10."], "ul": ["Перевір стійку: ноги на ширині плечей, вага на задній нозі.", "М'яч не підкидай високо — достатньо невеликого підйому з долоні.", "Удар — основою долоні або кулаком, рука майже пряма.", "Після удару рука продовжує рух у напрямку польоту м'яча.", "Рахуй вдалі спроби, щоб бачити прогрес."]}, {"h": "Пляжний волейбол. Основні поняття тактики гри", "p": ["Тактика — це розумна гра: як розподілити сили, куди подавати, як розташуватися в захисті й атаці. У пляжному волейболі лише двоє гравців, тому вони мають чітко домовлятися.", "Пара заздалегідь обирає, хто блокує біля сітки, а хто захищається в глибині, і як вони реагуватимуть на різні удари суперника."], "ul": ["Подавай на гравця, який гірше приймає.", "Атакуй у вільні зони, а не в захисника.", "Розподіліть обов'язки: блокуючий і захисник.", "Використовуйте сигнали руками за спиною.", "Слідкуйте за вітром і сонцем, коли змінюєте сторони."]}], "f": "", "pr": ["Опиши тактичний план пари в пляжному волейболі: кого подавати, куди атакувати, хто блокує, хто захищає.", "Придумай 3 сигнали руками для партнера (наприклад, «блок по лінії», «блок по діагоналі») і намалюй їх."], "q": ["Що таке тактика у спорті?", "Куди вигідно спрямовувати подачу в пляжному волейболі?", "Як пара розподіляє обов'язки в захисті?", "Як вітер впливає на тактичні рішення?"]}, {"n": "65", "t": "Блокування й страхування у волейболі; кистьові та обманні удари «накат» і «кобра»", "g": "Зрозуміти техніку блокування й страхування та призначення обманних ударів у пляжному волейболі.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Блок", "захисна дія гравців передньої лінії, які стрибком ставлять руки над сіткою на шляху удару суперника."], ["Страхування", "розташування гравців позаду партнера, що атакує чи блокує, щоб підібрати відскочений м'яч."], ["Обманний удар", "несильний удар, що спрямовує м'яч у вільну зону замість очікуваного сильного удару."], ["«Накат»", "м'який обманний удар, після якого м'яч по дузі перелітає блок і падає в глибину або в незахищену зону."], ["«Кобра»", "обманний удар у пляжному волейболі кінчиками зімкнутих напружених пальців."]], "th": [{"h": "Волейбол. Блокування удару та страхування гравців", "p": ["Блок — перша лінія захисту. Гравці передньої лінії стрибають біля сітки й ставлять руки на шляху м'яча. Блок може бути одиночним, подвійним або потрійним.", "Страхування потрібне завжди: якщо м'яч відскочив від блоку, його підбирають партнери, що стоять позаду."], "ul": ["Стань біля сітки, руки на рівні плечей.", "Стрибай трохи пізніше за нападника.", "Руки винеси над сіткою вперед, пальці розставлені й напружені.", "Не торкайся сітки руками.", "Партнери страхують позаду блокуючих і нападника."]}, {"h": "Пляжний волейбол. Кистьові й обманні удари: «накат», «кобра»", "p": ["У пляжному волейболі лише один захисник, тому замість сильного удару часто вигідно м'яко скинути м'яч у вільну зону. Такі удари називають обманними.", "За правилами пляжного волейболу не можна скидати м'яч відкритою долонею, тому використовують спеціальні способи — «накат» і «кобру»."], "ul": ["«Накат» — м'яч обертається й по дузі перелітає руки блокуючого.", "«Кобра» — удар кінчиками зімкнутих пальців, як «дзьобом».", "Замах має бути як для сильного удару, щоб обдурити суперника.", "Цілься в незахищену зону: за блок або в кут.", "Обманні удари ефективні, лише якщо їх чергувати з сильними."]}], "f": "У пляжному волейболі дотик блоку зараховується як один із трьох дотиків команди, на відміну від класичного волейболу.", "pr": ["Намалюй схему: пара в пляжному волейболі — блокуючий біля сітки і захисник у глибині — і покажи, куди вигідно направити «накат».", "Перед дзеркалом виконай імітацію положення рук для блоку (без стрибків) — 3 підходи по 10 повторень."], "q": ["Що таке блок і яким він буває?", "Навіщо потрібне страхування?", "Чим «накат» відрізняється від «кобри»?", "Чому обманні удари треба чергувати з сильними?"]}, {"n": "66", "t": "Навчальна гра у волейбол за спрощеними правилами; взаємодія нападника з пасуючим", "g": "Навчитися грати за спрощеними правилами та розуміти взаємодію нападника з пасуючим.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Навчальна гра", "гра за спрощеними правилами, у якій закріплюють вивчені прийоми."], ["Спрощені правила", "змінені умови гри (наприклад, з ловінням м'яча чи нижча сітка), що полегшують навчання."], ["Пасуючий", "гравець, який робить другу передачу для нападаючого удару."], ["Комбінація", "домовлена послідовність дій кількох гравців, що завершується атакою."]], "th": [{"h": "Волейбол. Навчальна гра зі спрощеними правилами", "p": ["Навчальна гра допомагає застосувати вивчені прийоми в реальних умовах. Правила спрощують, щоб гра не переривалася через помилки й усі могли брати участь.", "Спрощення обирає вчитель залежно від рівня групи."], "ul": ["Подача з ближчої відстані.", "Дозвіл ловити м'яч після першого дотику.", "Обов'язкові три дотики на стороні команди.", "Зниження висоти сітки.", "Перехід усіх гравців після кожного очка, щоб усі грали в різних зонах."]}, {"h": "Пляжний волейбол. Взаємодія нападника з пасуючим гравцем", "p": ["У парі гравець, який не приймав подачу, зазвичай стає пасуючим. Він виходить під м'яч і робить передачу партнеру для атаки.", "Добра взаємодія залежить від спілкування: нападник голосом показує, куди і як він хоче атакувати, а пасуючий підлаштовує передачу."], "ul": ["Пасуючий виходить до сітки, щойно бачить, що приймає партнер.", "Передача — висока, на 1–2 м від сітки.", "Нападник починає розбіг, коли м'яч летить до пасуючого.", "Пасуючий голосом підказує, де блок суперника.", "Після передачі пасуючий страхує нападника."]}], "f": "", "pr": ["Запропонуй 3 власні спрощення правил волейболу для учнів, які тільки почали грати, і поясни, навіщо кожне.", "Опиши послідовність дій пари в пляжному волейболі від прийому подачі до атаки (4–6 кроків)."], "q": ["Навіщо потрібні спрощені правила?", "Хто в пляжному волейболі стає пасуючим?", "Коли нападник починає розбіг?", "Які підказки пасуючий дає нападнику?"]}, {"n": "67", "t": "Взаємодія гравців задньої лінії під час прийому; рухливі ігри з елементами волейболу", "g": "Зрозуміти, як гравці задньої лінії розподіляють зони прийому, і дізнатися рухливі ігри з елементами волейболу.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Зона відповідальності", "частина майданчика, за прийом м'яча в якій відповідає конкретний гравець."], ["Прийом подачі", "перший дотик команди після подачі суперника."], ["Рухлива гра", "гра з простими правилами, що розвиває фізичні якості й уміння."], ["«Піонербол»", "рухлива гра через сітку, у якій м'яч ловлять і кидають."]], "th": [{"h": "Волейбол. Взаємодії гравців задньої лінії під час прийому м'яча", "p": ["Прийом подачі — спільна справа задньої лінії. Кожен гравець відповідає за свою зону, а м'ячі між гравцями бере той, хто стоїть зручніше або голосом заявив «моє!».", "Гравець, що не приймає, відкривається й допомагає партнеру, а не стоїть на місці."], "ul": ["Перед подачею кожен знає свою зону відповідальності.", "М'яч між двома гравцями бере той, хто ближче до центру або має кращу позицію.", "Голосом сповіщай: «моє!» або «твій!».", "Невдало прийнятий м'яч підбирає найближчий гравець.", "Після прийому всі готові до продовження розіграшу."]}, {"h": "Пляжний волейбол. Рухливі ігри з елементами волейболу", "p": ["Рухливі ігри допомагають закріпити передачі, прийоми та переміщення у веселій формі. Вони підходять для розминки й навчання новачків.", "У таких іграх важливі чесність, дотримання правил і повага до інших."], "ul": ["«Піонербол» — ловля й кидок м'яча через сітку.", "«Не дай м'ячу впасти» — команда робить якомога більше передач поспіль.", "Передачі в колі з вибуванням за помилку.", "Естафети з переміщеннями й передачею м'яча.", "Перед грою домовтеся про межі майданчика й правила."]}], "f": "", "pr": ["Придумай власну рухливу гру з елементами волейболу, яку можна провести на майданчику: опиши правила, кількість гравців і мету.", "Намалюй задню лінію з трьома гравцями й позначи їхні зони відповідальності під час прийому подачі."], "q": ["Що таке зона відповідальності?", "Хто бере м'яч, який летить між двома гравцями?", "Які рухливі ігри з елементами волейболу ти знаєш?", "Навіщо гравцям голосом повідомляти про прийом?"]}, {"n": "68", "t": "Вибір місця для другої передачі; «чесна гра» та спортивний етикет у пляжному волейболі", "g": "Навчитися вибирати місце для другої передачі та дотримуватися правил «чесної гри».", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Чесна гра (фейр-плей)", "дотримання правил і повага до суперників, суддів і партнерів у спорті."], ["Спортивний етикет", "традиційні правила поведінки спортсменів до, під час і після гри."], ["Зона пасуючого", "місце біля сітки між зонами 2 і 3, звідки найзручніше робити другу передачу."], ["Самосуддя", "визнання гравцями власних порушень без підказки судді."]], "th": [{"h": "Волейбол. Вибір місця для виконання другої передачі", "p": ["Пасуючий має виходити туди, звідки найзручніше передати м'яч нападникам. Зазвичай це місце біля сітки праворуч від центру — між зонами 2 і 3.", "Пасуючий виходить під м'яч, розвертається корпусом у бік атаки й лише тоді передає."], "ul": ["Виходь до сітки одразу після подачі суперника.", "Стань так, щоб бачити нападників.", "Під час передачі будь лицем до місця атаки.", "Якщо прийом неточний — швидко йди під м'яч, навіть у глибину.", "Передача має бути зручною для нападника за висотою й відстанню."]}, {"h": "Пляжний волейбол. Правила «чесної гри» та спортивний етикет", "p": ["Пляжний волейбол відомий доброзичливою атмосферою. Гравці вітаються й прощаються з суперниками, визнають власні дотики до сітки чи м'яча і поважають рішення суддів.", "У шкільних іграх без судді чесна гра — головний закон."], "ul": ["Перед і після гри — привітання й рукостискання з суперниками.", "Визнавай свої порушення: дотик до сітки, аут.", "Не сперечайся із суддею, а питай спокійно через капітана.", "Підтримуй партнера, навіть коли він помиляється.", "Не принижуй суперника, радій перемозі без зверхності."]}], "f": "Поняття «фейр-плей» походить від англійського fair play — «чесна гра».", "pr": ["Склади кодекс «чесної гри» для свого класу з 6 правил.", "Намалюй схему майданчика й позначи місце, де пасуючий виконує другу передачу, та стрілками — передачі нападникам у зони 4 і 2."], "q": ["Звідки зручніше виконувати другу передачу?", "Як повинен бути розвернутий пасуючий під час передачі?", "Що означає «чесна гра»?", "Наведи приклади спортивного етикету в пляжному волейболі."]}, {"n": "69", "t": "Нижня пряма й бокова подачі з 6–8 м; прийом обманних ударів і м'яча від сітки", "g": "Навчитися подавати з більшої відстані та приймати обманні удари й м'яч, що відскочив від сітки.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Лицьова лінія", "лінія, що обмежує майданчик ззаду, за якою виконують подачу."], ["Відскок від сітки", "зміна напрямку польоту м'яча після удару в сітку."], ["Готовність до прийому", "низька стійка з увагою на м'яч і нападника суперника."], ["Збільшення відстані", "поступове віддалення гравця від сітки під час навчання подачі."]], "th": [{"h": "Волейбол. Нижня пряма та бокова подачі з відстані 6–8 м", "p": ["Коли подача з 4–6 м стала стабільною, відстань поступово збільшують до 6–8 м, а потім — до лицьової лінії. Чим більша відстань, тим сильніший потрібен удар, але техніка не повинна змінюватися.", "Силу удару дає не лише рука, а й перенесення ваги тіла з задньої ноги на передню."], "ul": ["Стійка й підкидання — такі ж, як на ближчій відстані.", "Замах трохи більший, удар — енергійний.", "М'яч має пролетіти над сіткою з запасом.", "Якщо м'яч не долітає — додай роботу ніг, а не лише руки.", "Повертайся на коротшу відстань, якщо техніка «розсипається»."]}, {"h": "Пляжний волейбол. Прийом обманних ударів і м'яча, що відскочив від сітки", "p": ["Захисник у пляжному волейболі повинен бути готовим до сильного удару і до м'якого обманного. Для цього він стежить за рукою нападника та швидко реагує.", "М'яч, що потрапив у сітку, відскакує вниз і ближче до сітки, тому гравець стає трохи збоку й приймає його низько знизу."], "ul": ["Стійка низька, вага на передній частині стоп.", "Слідкуй за плечем і кистю нападника — вони підкажуть напрям.", "На обманний удар реагуй ривком уперед.", "М'яч від сітки приймай знизу, ставши до неї боком.", "Після прийому відразу готуйся до наступної дії."]}], "f": "", "pr": ["Опиши, як змінюється техніка подачі при збільшенні відстані від сітки, і назви 3 типові помилки.", "Виконай вправу на реакцію: партнер (або член сім'ї) показує рукою напрямок, а ти робиш приставний крок у цей бік — 3 підходи по 30 секунд."], "q": ["Чому відстань подачі збільшують поступово?", "Що дає силу подачі, крім руки?", "За чим стежить захисник, щоб угадати обманний удар?", "Як приймати м'яч, що відскочив від сітки?"]}, {"n": "70", "t": "Командна взаємодія для спільних цілей; прийом знизу двома руками й «томагавк»", "g": "Зрозуміти значення командної взаємодії та різні способи прийому подач і нападаючих ударів.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Командна мета", "результат, якого гравці прагнуть досягти разом."], ["Взаємодія", "узгоджені дії кількох гравців для виконання одного завдання."], ["«Томагавк»", "прийом м'яча над головою зчепленими руками, коли м'яч летить високо й швидко."], ["Комунікація в грі", "обмін сигналами, словами й жестами між гравцями."]], "th": [{"h": "Волейбол. Взаємодія з гравцями команди для досягнення спільних цілей", "p": ["Волейбол — гра, де без партнерів не обійтися: один приймає, другий пасує, третій атакує. Перемогу здобуває команда, а не один гравець.", "Спільна мета об'єднує команду, а повага й підтримка допомагають грати впевненіше."], "ul": ["Ставте спільну мету на гру або вправу.", "Розподіліть ролі та виконуйте свою.", "Підбадьорюйте одне одного після помилок.", "Спілкуйтеся: «моє!», «тримаю!», «кидай!».", "Аналізуйте гру разом після завершення."]}, {"h": "Пляжний волейбол. Прийом знизу двома руками і «томагавк»", "p": ["Більшість подач і сильних ударів приймають знизу двома руками. Але іноді м'яч летить на рівні голови, і на прийом знизу немає часу. Тоді пляжні волейболісти використовують «томагавк» — прийом над головою зчепленими долонями.", "«Томагавк» допустимий у пляжному волейболі для прийому сильного удару, бо м'яч не затримується в руках."], "ul": ["Прийом знизу: руки прямі, кисті разом, приймання передпліччями.", "«Томагавк»: долоні зчеплені, руки над головою або біля неї.", "М'яч відбивається від основи долонь, а не пальців.", "Направляй м'яч угору, щоб партнер встиг під нього вийти.", "Не намагайся «томагавком» приймати м'яч, що летить нижче плечей."]}], "f": "Прийом «томагавк» отримав назву через рух, схожий на удар сокирою.", "pr": ["Напиши есе на 6–8 речень: «Чому у волейболі неможлива перемога без команди?»", "Перед дзеркалом відпрацюй положення рук для прийому знизу і для «томагавка» — по 2 підходи по 10 повторень."], "q": ["Чому волейбол вважають командною грою?", "Які слова-сигнали використовують гравці?", "Коли використовують «томагавк»?", "Якою частиною рук приймають м'яч «томагавком»?"]}, {"n": "71", "t": "Сила рук, ніг і преса волейболіста; вправи для розвитку швидкості реакції", "g": "Дізнатися вправи для зміцнення м'язів рук, ніг і преса та способи розвитку швидкості реакції.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Швидкість реакції", "час від появи сигналу до початку відповідного руху."], ["М'язи черевного преса", "м'язи передньої та бічної стінки живота, що стабілізують тулуб."], ["Планка", "статична вправа з утриманням тіла в упорі на передпліччях або руках."], ["Сигнал-подразник", "звук, жест чи рух, на який гравець має відреагувати."]], "th": [{"h": "Волейбол. Вправи для сили верхніх і нижніх кінцівок та черевного преса", "p": ["Сильні руки потрібні для подачі й нападаючого удару, сильні ноги — для стрибків, а міцний прес і спина — для стабільності тіла в польоті й під час приземлення.", "Силові вправи з власною вагою можна виконувати без обладнання."], "ul": ["Віджимання від підлоги або від лави.", "Присідання і випади.", "Планка на передпліччях 20–40 секунд.", "Скручування для преса з зігнутими ногами.", "«Човник» на спині — підйом рук і ніг для м'язів спини.", "Дихай рівно, не затримуй дихання."]}, {"h": "Пляжний волейбол. Вправи для розвитку швидкості реакції", "p": ["У волейболі м'яч летить дуже швидко, тому гравець має миттєво реагувати. Швидкість реакції тренується вправами, де потрібно рухатися за несподіваним сигналом.", "Особливо корисні вправи з м'ячем, коли напрям його польоту заздалегідь невідомий."], "ul": ["Старти з різних положень за сигналом.", "Ловіння м'яча, що відскочив від стіни.", "Реакція на кольорові картки або жест партнера.", "Ловіння падаючої палиці чи лінійки.", "Вправи виконуй свіжим, на початку основної частини."]}], "f": "", "pr": ["Виконай комплекс: 3×10 віджимань (можна від лави чи з колін), 3×15 скручувань, 3×30 секунд планки. Запиши результати.", "Тест на реакцію: попроси когось відпустити лінійку між твоїми пальцями й зловити її. Зроби 5 спроб і запиши, на якій позначці ти її ловиш."], "q": ["Навіщо волейболісту сильні м'язи преса?", "Які вправи розвивають силу рук без обладнання?", "Що таке швидкість реакції?", "Які вправи розвивають швидкість реакції?"]}, {"n": "72", "t": "Основні помилки в переміщеннях, прийомі та передачі; помилки в техніці пляжного волейболу", "g": "Навчитися розпізнавати типові технічні помилки та знати способи їх виправлення.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Технічна помилка", "неправильне виконання руху, що знижує його ефективність або веде до порушення правил."], ["Затримка м'яча", "порушення, коли м'яч утримується в руках, а не відбивається."], ["Подвійний дотик", "порушення, коли гравець двічі поспіль торкається м'яча або м'яч торкається різних частин тіла по черзі."], ["Підвідна вправа", "спрощена вправа, яка готує до правильного виконання складнішого руху."]], "th": [{"h": "Волейбол. Основні помилки при переміщеннях, прийомі та передачі м'яча", "p": ["Більшість втрачених очок — наслідок помилок у техніці, а не сильних дій суперника. Знаючи типові помилки, можна швидко їх помітити й виправити.", "Найкращий спосіб — повернутися до підвідних вправ і повільного виконання."], "ul": ["Пересування: високо випрямлене тіло — роби кроки в напівприсіді.", "Прийом знизу: розведені руки — з'єднуй кисті й випрямляй лікті.", "Прийом «на ходу» — встигни зупинитися перед прийомом.", "Передача зверху: м'яч на долонях — приймай на пальці.", "Затримка й подвійний дотик — працюй над чистим відбиванням."]}, {"h": "Пляжний волейбол. Помилки у техніці гри та способи їх усунення", "p": ["На піску помилки помітніші: важко переміщуватися, стрибати, а вітер змінює траєкторію м'яча. Новачки часто запізнюються до м'яча й б'ють з незручного положення.", "Помилки виправляють через пояснення, показ, відео чи спостереження партнера, повтор правильного руху."], "ul": ["Запізнення — починай рух раніше, слідкуй за нападником.", "Передача пальцями з обертанням м'яча — суддя може зарахувати помилку.", "Нападаючий удар без стрибка — працюй над розбігом.", "Невраховування вітру — коригуй силу й напрям подачі.", "Помилки в спілкуванні — домовляйся з партнером голосом."]}], "f": "", "pr": ["Склади таблицю «Помилка — причина — як виправити» щонайменше з 5 рядків для прийомів волейболу.", "Попроси когось удома зняти тебе на телефон під час імітації прийому знизу, переглянь і запиши свої помилки."], "q": ["Яка помилка найчастіша під час прийому знизу?", "Що таке подвійний дотик?", "Як впливає вітер на гру в пляжний волейбол?", "Які способи допомагають виправити помилки?"]}, {"n": "73", "t": "Фізична підготовка волейболіста; блок у пляжному волейболі та дії в захисті", "g": "Узагальнити знання про фізичну підготовку волейболіста та навчитися виконувати індивідуальний і парний блок.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Тренувальне заняття", "організоване заняття з підготовчою, основною й заключною частинами."], ["Індивідуальний блок", "блок, який ставить один гравець."], ["Парний блок", "блок, який одночасно ставлять двоє гравців поруч."], ["Захисна система", "домовлений порядок розташування гравців для захисту від атаки суперника."]], "th": [{"h": "Волейбол. Загальна та спеціальна фізична підготовка", "p": ["Повторимо: загальна підготовка створює фундамент — здоров'я, витривалість, силу, а спеціальна розвиває саме волейбольні якості. Добре тренування поєднує обидві.", "Тренувальне заняття складається з підготовчої частини (розминка), основної (техніка, тактика, фізичні якості) і заключної (заминка, розтягування)."], "ul": ["Підготовча частина: біг, ЗРВ, спеціальні бігові вправи.", "Основна частина: техніка з м'ячем, спеціальні вправи, гра.", "Заключна частина: повільна ходьба, розтягування, дихальні вправи.", "Сила й стрибучість — 2–3 рази на тиждень, з днями відпочинку.", "Контролюй самопочуття і пульс."]}, {"h": "Пляжний волейбол. Блокування індивідуальне й у парі; командні ігри на узгодження дій у захисті", "p": ["У пляжному волейболі зазвичай блокує один гравець, а другий захищається позаду. Блокуючий закриває один напрям удару, а захисник — інший. Тому вони мають заздалегідь домовитися.", "У класичному волейболі можливий парний блок, коли двоє гравців стрибають разом і закривають більшу частину сітки."], "ul": ["Блокуючий показує сигналом, який напрям закриватиме.", "Захисник стає туди, куди блок не закриває.", "Під час парного блоку гравці стрибають одночасно, руки поруч без проміжку.", "Не торкайся сітки під час блоку.", "Ігрові вправи «блок — захист» тренують узгодженість дій."]}], "f": "", "pr": ["Склади план власного тренувального заняття на 30 хвилин удома (лише безпечні вправи) з трьома частинами.", "Намалюй схему: блокуючий закриває удар по лінії — де має стояти захисник? Підпиши пояснення."], "q": ["З яких частин складається тренувальне заняття?", "Чим індивідуальний блок відрізняється від парного?", "Як розподіляються обов'язки блокуючого й захисника?", "Чому важливо домовлятися перед розіграшем?"]}, {"n": "74", "t": "Вплив вправ на організм і попередження травм; атака гравцями задньої лінії в пляжному волейболі", "g": "Поглибити знання про вплив навантажень на організм і розібратися з атакою з глибини майданчика.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Частота серцевих скорочень (ЧСС)", "кількість ударів серця за хвилину, за якою оцінюють навантаження."], ["Пульс", "поштовхи стінок артерій, які відчуваються на зап'ясті чи шиї й відповідають роботі серця."], ["Перенапруження", "стан, коли навантаження перевищує можливості організму."], ["Атака з глибини", "нападаючий удар, виконаний далеко від сітки."]], "th": [{"h": "Волейбол. Вплив фізичних вправ на організм і попередження травматизму", "p": ["Під час вправ серце б'ється частіше, дихання прискорюється, м'язи працюють активніше. Регулярні заняття роблять серце сильнішим, а м'язи — витривалішими.", "Щоб навантаження було корисним, а не шкідливим, його контролюють за пульсом і самопочуттям."], "ul": ["Пульс міряй на зап'ясті або шиї 15 секунд і помнож на 4.", "Порівнюй пульс у спокої, після вправ і після відпочинку.", "Швидке відновлення пульсу — ознака доброї тренованості.", "Біль, запаморочення, нудота — сигнал припинити вправу.", "Збільшуй навантаження поступово."]}, {"h": "Пляжний волейбол. Виконання нападаючого удару гравцями задньої лінії", "p": ["Хоча в пляжному волейболі немає лінії атаки, іноді атакувати доводиться з глибини майданчика — після неточного прийому чи передачі.", "Такий удар виконують сильніше вгору-вперед, щоб м'яч перелетів сітку й потрапив у глибину майданчика суперника."], "ul": ["Удар виконується з повного замаху.", "М'яч бий трохи нижче центру, щоб він летів по дузі.", "Цілься в зону, де немає захисника.", "Якщо атакувати незручно — краще безпечно перекинути м'яч.", "Після удару повертайся на свою позицію."]}], "f": "Пульс зручно рахувати 15 секунд і множити на 4 — так отримаємо кількість ударів за хвилину.", "pr": ["Виміряй пульс у спокої, одразу після 20 присідань і через 2 хвилини відпочинку. Запиши результати в таблицю й зроби висновок.", "Опиши у 3–4 реченнях, коли в пляжному волейболі доводиться атакувати з глибини і як це робити."], "q": ["Як виміряти пульс?", "Про що свідчить швидке відновлення пульсу?", "Які ознаки вимагають припинити вправу?", "Чим відрізняється атака з глибини від атаки біля сітки?"]}, {"n": "75", "t": "Відпрацювання подач; взаємодія пасуючого з нападником у дограванні; діагностувальна робота ГР2", "g": "Закріпити подачі, навчитися дограванню м'яча та підготуватися до діагностувальної роботи ГР2.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Догравання", "продовження розіграшу після захисту, коли команда організовує атаку з незручної ситуації."], ["Серія подач", "кілька подач поспіль для перевірки стабільності."], ["Відсоток влучності", "частка вдалих спроб від загальної кількості."], ["Самоаналіз", "оцінювання власних дій для покращення результатів."]], "th": [{"h": "Волейбол. Відпрацювання подач", "p": ["Подача — єдиний прийом, який гравець виконує сам, без впливу суперника. Тому її можна довести до високої стабільності регулярними повтореннями.", "Корисно рахувати відсоток вдалих подач: наприклад, 7 вдалих із 10 — це 70%."], "ul": ["Виконуй серії по 10 подач і рахуй вдалі.", "Спершу точність, потім сила.", "Вибирай спосіб подачі, який виходить найстабільніше.", "Цілься в конкретні зони.", "Аналізуй невдалі подачі: сітка, аут, слабкий удар."]}, {"h": "Пляжний волейбол. Взаємодія пасуючого з нападником у дограванні; діагностувальна робота ГР2", "p": ["Після успішного захисту м'яч часто летить неточно. Пасуючий має встигнути під нього й зробити зручну передачу, а нападник — підлаштувати розбіг. Це називають дограванням.", "На уроці проводиться діагностувальна робота з теми «Волейбол, пляжний волейбол» за групою результатів навчання ГР2. Повтори техніку подач, прийому, передач, нападаючого удару, блоку та основи тактики."], "ul": ["Пасуючий кричить «є!» або «моя!», коли бере м'яч.", "Передача висока, щоб нападник встиг розбігтися.", "Нападник відходить від сітки для розбігу.", "Якщо атакувати незручно — перекинути м'яч у вільну зону.", "Для підготовки повтори уроки 55–74."]}], "f": "", "pr": ["Повтори конспекти уроків 55–74 і склади список з 10 технічних прийомів волейболу з коротким описом кожного.", "Опиши послідовність дій пари в дограванні після захисту (4–5 кроків)."], "q": ["Як порахувати відсоток вдалих подач?", "Що таке догравання?", "Що робить нападник, коли м'яч у пасуючого?", "Що краще зробити, якщо атакувати незручно?"]}, {"n": "76", "t": "Рухливі ігри й естафети для волейболу, навчальна гра; організація захисту в пляжному волейболі", "g": "Закріпити навички в іграх і естафетах та дізнатися, як організувати захист у пляжному волейболі.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Естафета", "командне змагання, у якому учасники по черзі виконують завдання й передають естафету наступному."], ["Позиційний захист", "розташування гравців у заздалегідь визначених місцях залежно від дій суперника."], ["Захист біля сітки", "дії гравця біля сітки для блокування або підбирання м'яча."], ["Ігрова ситуація", "конкретний момент гри, що вимагає прийняття рішення."]], "th": [{"h": "Волейбол. Рухливі ігри та естафети, навчальна гра за правилами", "p": ["Рухливі ігри й естафети з м'ячем допомагають удосконалити прийоми в умовах швидкості та змагання. Навчальна гра за правилами показує, наскільки добре засвоєно техніку й тактику.", "У грі за правилами важливо дотримуватися розстановки, переходів і кількості дотиків."], "ul": ["Естафети з передачами в парах на швидкість.", "Ігри на кількість передач без падіння м'яча.", "Гра «три дотики обов'язкові».", "Навчальна гра з суддівством самими учнями.", "Після гри — коротке обговорення."]}, {"h": "Пляжний волейбол. Організація захисту при прийомі подач та у грі біля сітки", "p": ["Під час прийому подачі пара ділить майданчик навпіл — кожен відповідає за свою половину. У захисті від атаки один гравець стає на блок, а інший — у глибину, у зону, яку блок не закриває.", "Захищаючись біля сітки, гравець стрибає на блок або відходить назад, якщо атака слабка."], "ul": ["Прийом подачі: поділ майданчика на ліву й праву половини.", "Захист від атаки: блок + захисник.", "Проти слабкої атаки блокуючий відходить від сітки й захищається.", "Захисник стежить за плечем нападника.", "Обидва повідомляють про свої дії голосом або сигналом."]}], "f": "", "pr": ["Придумай естафету з елементами волейболу для 2 команд і опиши її правила.", "Намалюй схеми розташування пари в пляжному волейболі: під час прийому подачі та під час захисту від атаки."], "q": ["Навіщо потрібні рухливі ігри та естафети на уроці волейболу?", "Як пара ділить майданчик під час прийому подачі?", "Коли блокуючий відходить від сітки?", "Де стоїть захисник під час атаки суперника?"]}, {"n": "77", "t": "Підсумок модулів волейбол і пляжний волейбол; діагностувальна робота ГР3", "g": "Узагальнити знання з волейболу й пляжного волейболу та підготуватися до підсумкової діагностувальної роботи ГР3.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Командні тактичні дії", "узгоджені дії кількох гравців у нападі або захисті."], ["Підсумкове оцінювання", "перевірка знань і вмінь наприкінці вивчення теми."], ["Перехід від захисту до нападу", "момент гри, коли команда після прийому одразу організовує атаку."], ["Група результатів навчання", "набір знань і вмінь, які перевіряють під час діагностувальної роботи."]], "th": [{"h": "Волейбол. Підсумок: взаємодія з командою для досягнення спільних цілей", "p": ["За чверть ми вивчили історію волейболу й правила гри, правила безпеки й профілактику травм, подачі (нижні й верхні), прийом знизу, передачі зверху, нападаючий удар, блок, страхування, розстановку і взаємодію ліній.", "Головний висновок: у волейболі перемагає команда, яка діє злагоджено, спілкується й підтримує одне одного."], "ul": ["Правила: 6 гравців, 3 дотики, партія до 25 очок.", "Подачі: нижня пряма, нижня бокова, верхня пряма й бокова.", "Прийом знизу та передача зверху.", "Нападаючий удар і блок.", "Взаємодія передньої й задньої ліній, страхування.", "Фізична підготовка та самоконтроль."]}, {"h": "Пляжний волейбол. Командні тактичні дії в нападі та захисті; діагностувальна робота ГР3", "p": ["У пляжному волейболі двоє гравців відповідають за весь майданчик. Ми вивчили прийом подачі, другі передачі з глибини, атаку, обманні удари «накат» і «кобру», «томагавк», блок і систему захисту, правила безпеки на піску та «чесну гру».", "На уроці проводиться діагностувальна робота за групою результатів навчання ГР3. Повтори основні терміни й тактику, а також будь готовий показати техніку прийомів."], "ul": ["Напад: прийом — передача — атака.", "Захист: блок + захисник у глибині.", "Обманні удари чергуй із сильними.", "Сигнали руками за спиною для партнера.", "Безпека на сонці й піску.", "«Чесна гра» й повага до суперника."]}], "f": "", "pr": ["Склади ментальну карту (схему) «Волейбол і пляжний волейбол»: правила, техніка, тактика, безпека, фізична підготовка.", "Склади 6 власних питань з теми для повторення й дай на них відповіді."], "q": ["Які основні правила класичного волейболу ти знаєш?", "Чим тактика пляжного волейболу відрізняється від класичного?", "Які технічні прийоми ти освоїв цієї чверті?", "Як ти оцінюєш свої успіхи з цієї теми і що варто покращити?"]}]}, {"name": "IV період. Доджбол, футзал", "lessons": [{"n": "78", "t": "Доджбол і футзал: знайомство з модулями, безпека, якості гравця, методика освоєння техніки", "g": "Ознайомитися з доджболом і футзалом, правилами безпеки на заняттях та тим, як поступово освоюють техніку гри.", "k": "Модулі: Доджбол · Футзал", "terms": [["Доджбол", "командна гра з м'ячами, у якій гравці намагаються влучити м'ячем у суперників і ухилитися від їхніх кидків."], ["Футзал", "міні-футбол у залі, у якому грають дві команди по п'ять гравців, включно з воротарем."], ["Професійно-важливі якості", "фізичні та психологічні якості, необхідні для успіху в певній діяльності."], ["Ухилення", "швидкий рух тіла вбік, униз чи стрибком, щоб уникнути влучання м'яча."]], "th": [{"h": "Доджбол. Правила безпеки та професійно-важливі якості гравця", "p": ["Доджбол — швидка командна гра: дві команди на своїх половинах майданчика кидають м'ячі, щоб влучити в суперників, ловлять їхні кидки й ухиляються. Гравця, у якого влучили, виводять із гри, а якщо кидок зловили — виходить той, хто кидав.", "Гра розвиває спритність, швидкість реакції, точність кидків, уважність і вміння приймати рішення під тиском — якості, корисні і в спорті, і в житті."], "ul": ["Займайся у спортивному взутті без прикрас, підстрижи нігті.", "Використовуй лише м'які м'ячі, дозволені для гри.", "Кидки в голову заборонені — цілься в тулуб і ноги.", "Не перетинай центральну лінію й не штовхай гравців.", "Перед грою обов'язково роби розминку для рук і плечей.", "Про травму або погане самопочуття одразу повідом учителя."]}, {"h": "Футзал. Методика освоєння техніки гри", "p": ["Футзал — різновид футболу для залу: менший майданчик, менший і «важчий» м'яч, що погано відскакує, і по п'ять гравців у команді. Гра дуже швидка й вимагає точної техніки.", "Техніку освоюють від простого до складного: спочатку ведення й зупинки м'яча, потім передачі й удари, далі фінти, взаємодії й гра за правилами."], "ul": ["Етап 1 — ознайомлення: показ і пояснення прийому.", "Етап 2 — розучування на місці й у повільному русі.", "Етап 3 — закріплення у вправах з партнером і в іграх.", "Етап 4 — вдосконалення в навчальній грі.", "Безпека: не грай у кросівках для бігу з високою підошвою, не роби підкатів, стеж за стінами й лавами."]}], "f": "У футзалі використовують м'яч зі зниженим відскоком, тому гравці частіше грають у пас по підлозі.", "pr": ["Склади пам'ятку «Правила безпеки в доджболі та футзалі» з 6 пунктів.", "Опиши в зошиті, чим футзал відрізняється від звичайного футболу (щонайменше 4 відмінності)."], "q": ["Яка мета гри в доджбол?", "Що відбувається, якщо кидок суперника зловили?", "Чим футзал відрізняється від футболу?", "Чому в доджболі заборонено кидати в голову?"]}, {"n": "79", "t": "Становлення українського доджболу; помилки у футзалі, втома та перевтома", "g": "Дізнатися про розвиток доджболу в Україні й Європі, навчитися знаходити свої помилки та запобігати перевтомі.", "k": "Модулі: Доджбол · Футзал", "terms": [["Федерація виду спорту", "громадська організація, що розвиває вид спорту, проводить змагання та затверджує правила."], ["Мультиспортивні змагання", "великі змагання, у яких одночасно розігрують нагороди з багатьох видів спорту."], ["Зовнішні ознаки втоми", "видимі зміни стану людини після навантаження: колір шкіри, пітливість, дихання, координація."], ["Корекція помилок", "виправлення неправильного руху через пояснення, показ і повторення."]], "th": [{"h": "Доджбол. Становлення українського доджболу", "p": ["Доджбол як організований вид спорту в Україні розвивається порівняно недавно. З'являються клуби та федерація, проводяться змагання серед дітей і дорослих, а українські команди беруть участь у міжнародних турнірах.", "Розвиток доджболу в Європі пов'язаний з прагненням зробити його визнаним видом спорту на рівні великих мультиспортивних змагань, таких як Європейські ігри. Для цього потрібні єдині правила, сильні національні федерації та популярність серед молоді."], "ul": ["Доджбол доступний: потрібні лише м'ячі та майданчик.", "Гра популярна в школах як рухлива гра і як спорт.", "Єдині правила дозволяють проводити міжнародні змагання.", "Розвиток виду спорту залежить від клубів, тренерів і шкіл.", "Уточнюй новини про змагання на офіційних ресурсах федерацій."]}, {"h": "Футзал. Визначення помилок і способи їх усунення; втома і перевтома", "p": ["Щоб покращити техніку, треба знати свої помилки. Їх помічає вчитель, партнер або ти сам — через відеозапис чи самоаналіз. Виправляють помилки повільним виконанням, підвідними вправами й повторенням.", "Футзал — інтенсивна гра з частими ривками, тому важливо помічати ознаки втоми. Незначна втома — нормальна, а сильна вимагає зменшити навантаження."], "ul": ["Типові помилки: ведення м'яча далеко від ноги, погляд лише на м'яч, удар носком.", "Легка втома: невелике почервоніння, помірне пітніння, прискорене дихання.", "Сильна втома: різке почервоніння або блідість, задишка, порушення координації.", "Профілактика: розминка, вода, сон, заміни під час гри.", "Відновлення: заминка, розтягування, відпочинок."]}], "f": "", "pr": ["Склади таблицю «Ознака — легка втома — сильна втома» для 4 ознак (колір шкіри, пітливість, дихання, рухи).", "Напиши 5–6 речень про те, чому доджбол може стати популярним видом спорту серед молоді."], "q": ["Що потрібно для розвитку виду спорту на міжнародному рівні?", "Як можна виявити свої технічні помилки?", "Назви зовнішні ознаки сильної втоми.", "Як запобігти перевтомі під час гри у футзал?"]}, {"n": "80", "t": "Якості гравця доджболу; техніка й тактика футзалу; перша допомога", "g": "Зрозуміти, які особистісні якості розвиває доджбол, ознайомитися з основами техніки й тактики футзалу та правилами першої допомоги.", "k": "Модулі: Доджбол · Футзал", "terms": [["Професійно-прикладні якості", "якості, що допомагають у майбутній професійній діяльності: уважність, реакція, витримка, координація."], ["Техніка гри", "сукупність способів виконання ігрових прийомів."], ["Холод при травмі", "прикладання холодного компресу до місця забою чи розтягнення, щоб зменшити набряк і біль."], ["Забій", "закрите пошкодження м'яких тканин унаслідок удару без порушення шкіри."]], "th": [{"h": "Доджбол. Виховання особистісних та професійно-прикладних якостей гравця", "p": ["Доджбол — це не лише фізичні вправи. Гравець вчиться швидко оцінювати ситуацію, зберігати спокій, підтримувати команду, чесно визнавати влучання.", "Такі якості, як уважність, швидкість реакції й координація, корисні в багатьох професіях — від водія до лікаря чи рятувальника."], "ul": ["Уважність — стежиш за кількома м'ячами одночасно.", "Рішучість — обираєш, ловити чи ухилятися.", "Витримка — не панікуєш під атакою.", "Чесність — сам виходиш після влучання.", "Командність — повертаєш партнерів у гру зловленими м'ячами."]}, {"h": "Футзал. Основні поняття техніки і тактики гри; перша допомога при травмах", "p": ["Техніка у футзалі — це вміння вести, зупиняти, передавати м'яч, бити по воротах і обманювати суперника фінтами. Тактика — це те, як гравці використовують техніку разом, щоб атакувати й захищатися.", "Під час гри можливі забої, розтягнення, садна. Важливо знати прості правила першої допомоги та одразу кликати дорослого."], "ul": ["Перша дія при травмі — припинити гру й повідомити вчителя.", "Забій чи розтягнення: спокій, холод через тканину, піднесене положення кінцівки.", "Садно: промити чистою водою й закрити стерильною пов'язкою.", "Не вправляй вивихи й не рухай травмовану кінцівку.", "При підозрі на перелом — нерухомість і виклик медичної допомоги."]}], "f": "", "pr": ["Склади алгоритм дій «Що робити, якщо однокласник травмувався на уроці» з 5 кроків.", "Назви 5 якостей, які розвиває доджбол, і для кожної наведи приклад, де вона знадобиться в житті."], "q": ["Які особистісні якості виховує доджбол?", "Що таке техніка й тактика гри?", "Як надати допомогу при забої?", "Чого не можна робити при підозрі на вивих?"]}, {"n": "81", "t": "Профілактика травм у доджболі, взаємодія нападу й захисту; засади арбітражу у футзалі", "g": "Навчитися запобігати травмам у доджболі, узгоджувати дії в нападі й захисті та знати основи суддівства у футзалі.", "k": "Модулі: Доджбол · Футзал", "terms": [["Арбітр", "суддя, який стежить за дотриманням правил і приймає рішення під час гри."], ["Накопичені фоли", "порушення, які підраховуються за тайм, після певної кількості яких команда карається суворіше."], ["Удар із бокової лінії", "спосіб введення м'яча в гру у футзалі ногою з бокової лінії замість вкидання руками."], ["Правило чотирьох секунд", "вимога ввести м'яч у гру протягом чотирьох секунд при стандартних положеннях."]], "th": [{"h": "Доджбол. Профілактика травматизму; взаємодія гравців нападу та захисту", "p": ["Травм у доджболі можна уникнути, якщо грати м'якими м'ячами, не кидати в голову й не зіштовхуватися з партнерами. Також важливо розім'яти плечовий суглоб, бо кидки дають на нього велике навантаження.", "Команда повинна узгоджувати дії: одні гравці атакують, інші страхують і ловлять м'ячі, а після кидка всі швидко відходять від центральної лінії."], "ul": ["Розминай плечі й кисті перед кидками.", "Не стрибай на інших гравців під час ухилення.", "Кидок — за сигналом, кілька гравців одночасно в одну ціль.", "Гравці без м'яча відходять назад і готуються ловити.", "Говори з партнерами: «бережись!», «лови!»."]}, {"h": "Футзал. Основні засади арбітражу", "p": ["У футзалі на майданчику працюють двоє суддів — основний і другий, які рухаються вздовж бокових ліній. Їм допомагають хронометрист і третій суддя за столом.", "Судді фіксують порушення, призначають штрафні удари, показують картки й рахують накопичені фоли."], "ul": ["Гра складається з двох таймів по 20 хвилин «чистого» часу.", "М'яч з-за бокової лінії вводять ударом ноги.", "Стандартні положення треба виконати за 4 секунди.", "Заміни — необмежені, через зону заміни.", "Жовта картка — попередження, червона — вилучення.", "Після п'ятого накопиченого фолу в таймі кожне наступне порушення карається суворіше."]}], "f": "У футзалі гравці вводять м'яч із бокової лінії ногою, а не руками, як у футболі.", "pr": ["Склади таблицю «Порушення — рішення судді» для 5 ситуацій у футзалі.", "Виконай розминку для плечових і ліктьових суглобів та кистей (по 10 повторень кожної вправи) і запиши комплекс."], "q": ["Які суглоби найбільше навантажені в доджболі?", "Як узгоджують дії гравці в нападі?", "Скільки суддів працює на майданчику у футзалі?", "Що таке правило чотирьох секунд?"]}, {"n": "82", "t": "Вимоги до гри в доджбол і розміщення гравців; режим дня та самостійні заняття футзалом", "g": "Дізнатися основні вимоги до гри в доджбол і правильно спланувати режим дня та самостійні заняття.", "k": "Модулі: Доджбол · Футзал", "terms": [["Центральна лінія", "лінія, що ділить майданчик доджболу на дві половини, і яку гравцям заборонено перетинати."], ["Лицьова зона", "ділянка біля задньої лінії майданчика, де гравці стоять для безпечнішого захисту."], ["Режим дня", "розпорядок, за яким чергуються навчання, рухова активність, харчування, відпочинок і сон."], ["Самостійні заняття", "тренування, які учень планує й виконує сам, без учителя."]], "th": [{"h": "Доджбол. Основні вимоги до гри та розміщення гравців", "p": ["Майданчик доджболу прямокутний і поділений центральною лінією. Кожна команда займає свою половину. На початку гри м'ячі кладуть на центральну лінію, і за сигналом гравці біжать за ними.", "Розміщення гравців залежить від ситуації: атакуючі з м'ячами ближче до центру, решта — в глибині, щоб мати час ухилитися або зловити м'яч."], "ul": ["Не можна перетинати центральну лінію й виходити за межі майданчика.", "Влучання зараховується лише після прямого кидка без відскоку від підлоги.", "Зловлений м'яч — кидаючий вибуває, а партнер повертається в гру.", "Гравець з м'ячем має швидко кидати, не затримуючи його.", "Розташовуйтеся так, щоб не заважати одне одному."]}, {"h": "Футзал. Режим дня; організація самостійних занять", "p": ["Правильний режим дня допомагає краще вчитися і тренуватися. Важливо щодня рухатися, спати 8–9 годин, регулярно харчуватися й чергувати розумову працю з активним відпочинком.", "Самостійні заняття футзалом можна проводити у дворі чи на шкільному майданчику, але тільки з дотриманням правил безпеки та після розминки."], "ul": ["Сталий час підйому й сну.", "Рухова активність щодня — щонайменше 60 хвилин.", "План заняття: розминка, вправи з м'ячем, гра, заминка.", "Займайся на безпечному майданчику, у відповідному взутті.", "Веди щоденник тренувань і самопочуття."]}], "f": "Підліткам рекомендують щодня принаймні годину рухової активності середньої або високої інтенсивності.", "pr": ["Склади свій режим дня на будній день з урахуванням навчання, руху, харчування й сну.", "Намалюй схему майданчика доджболу, познач центральну лінію й розташуй гравців однієї команди під час атаки."], "q": ["Чи можна перетинати центральну лінію в доджболі?", "Коли влучання зараховується?", "Що входить у правильний режим дня?", "З яких частин складається самостійне заняття?"]}, {"n": "83", "t": "Спритність і швидкість гравця доджболу; біг із закиданням гомілок; діагностувальна робота ГР1", "g": "Зрозуміти, як доджбол розвиває спритність і швидкість, закріпити техніку бігу із закиданням гомілок і підготуватися до діагностувальної роботи ГР1.", "k": "Модулі: Доджбол · Футзал", "terms": [["Спритність", "здатність швидко й точно виконувати складні рухи та перебудовувати їх відповідно до ситуації."], ["Швидкість", "здатність виконувати рухи за мінімальний час."], ["Координація", "узгодженість рухів різних частин тіла."], ["Частота кроків", "кількість кроків за одиницю часу під час бігу."]], "th": [{"h": "Доджбол. Виховання якостей гравця: високий рівень спритності та швидкості", "p": ["Щоб не дати в себе влучити, гравцю доджболу потрібно миттєво реагувати на кидок і швидко ухилятися: присідати, стрибати, відступати вбік. Тому доджбол розвиває спритність і швидкість краще за багато інших ігор.", "Ці якості тренуються не лише у грі, а й у спеціальних вправах: естафетах, ривках, вправах на реакцію."], "ul": ["Ухилення вбік — швидкий приставний крок.", "Ухилення вниз — присідання з прямою спиною.", "Розворот корпусу, щоб м'яч пролетів повз.", "Ривки до м'яча після сигналу.", "Тренуйся свіжим, з достатнім відпочинком між вправами."]}, {"h": "Футзал. Біг із закиданням гомілок; діагностувальна робота ГР1", "p": ["Біг із закиданням гомілок розвиває м'язи задньої поверхні стегна і частоту кроків, що допомагає футзалістам на коротких ривках.", "На уроці проводиться діагностувальна робота з теми «Доджбол, футзал» за групою результатів навчання ГР1. Повтори правила безпеки, основні правила доджболу й футзалу, засади арбітражу, ознаки втоми й першу допомогу."], "ul": ["Тулуб прямий, погляд уперед.", "П'ятки швидко рухаються до сідниць.", "Коліна дивляться вниз, не виносяться вперед.", "Руки працюють, як під час звичайного бігу.", "Для підготовки до діагностики повтори уроки 78–82."]}], "f": я й знову розганятися — саме так рухаються гравці у футзалі.", "Окрім звичайного бігу, футзалісти використовують приставні кроки, біг спиною вперед і схресні кроки."], "ul": ["Перед розворотом гальмуй, знижуючи центр ваги.", "Розвертайся на опорній нозі, не перехрещуй ноги.", "Приставні кроки — для захисту проти гравця з м'ячем.", "Біг спиною вперед — щоб бачити атаку суперника.", "Не повторюй тест на втомлених ногах."]}], "f": "", "pr": ["Опиши у 4–5 реченнях, чим «човниковий» біг схожий на рухи гравця у футзалі.", "Придумай одну вправу на реакцію для доджболу, яку можна безпечно виконати в залі, і опиши її."], "q": ["Як правильно гальмувати перед розворотом?", "Навіщо футзалісту біг спиною вперед?", "Які вправи розвивають увагу в доджболі?", "Яку якість перевіряє «човниковий» біг?"]}, {"n": "87", "t": "Вправи для кистей у доджболі; техніка й тактика футзалу: характеристика технічних прийомів", "g": "Навчитися вправ для кистей рук і зрозуміти класифікацію технічних прийомів футзалу.", "k": "Модулі: Доджбол · Футзал", "terms": [["Кистьовий суглоб", "суглоб, що з'єднує кисть із передпліччям і забезпечує її рухливість."], ["Технічний прийом", "окремий спосіб дії з м'ячем або без нього, наприклад передача чи зупинка."], ["Техніка польового гравця", "прийоми гравців, що грають у полі: ведення, передачі, удари, зупинки, фінти."], ["Техніка воротаря", "прийоми, якими воротар захищає ворота й вводить м'яч у гру."]], "th": [{"h": "Доджбол. Вправи для кистей рук: обертальні рухи кистю", "p": ["Сильні й рухливі кисті допомагають точніше кидати й надійніше ловити м'яч. Обертальні рухи кистю розігрівають суглоб і зменшують ризик травм.", "Вправи виконують спочатку повільно, потім у максимально швидкому темпі."], "ul": ["Обертання кистями всередину й назовні по 10 разів.", "Стискання й розтискання пальців у кулак.", "«Хвилька» — почергові рухи пальців.", "Згинання-розгинання кистей у зап'ястку.", "Швидкий темп — лише після повільного розігріву."]}, {"h": "Футзал. Основні поняття техніки і тактики, характеристика технічних прийомів", "p": ["Технічні прийоми у футзалі поділяють на техніку пересування, техніку володіння м'ячем і техніку воротаря. Кожен прийом має свою мету й спосіб виконання.", "Тактика пов'язує техніку з ігровою ситуацією: коли пасувати, коли вести м'яч, коли бити по воротах."], "ul": ["Пересування: біг, стрибки, зупинки, повороти.", "Володіння м'ячем: ведення, зупинки, передачі, удари, фінти, відбір.", "Техніка воротаря: стійка, ловіння, відбивання, введення м'яча.", "Тактика: індивідуальні, групові й командні дії.", "Правильна техніка — основа для тактики."]}], "f": "", "pr": ["Виконай комплекс з 5 вправ для кистей рук двічі на день і опиши свої відчуття.", "Склади схему «Техніка футзалу» з трьох груп прийомів і приклади до кожної."], "q": ["Навіщо гравцю доджболу вправи для кистей?", "На які групи поділяють технічні прийоми футзалу?", "Які прийоми належать до техніки воротаря?", "Як пов'язані техніка й тактика?"]}, {"n": "88", "t": "Сила кистей та імітація в доджболі; пересування з м'ячем у футзалі", "g": "Навчитися зміцнювати м'язи кистей і поєднувати різні пересування з контролем м'яча.", "k": "Модулі: Доджбол · Футзал", "terms": [["Хват", "спосіб утримання м'яча пальцями й долонею."], ["Еспандер кистьовий", "невеликий пружний тренажер для зміцнення м'язів кисті й пальців."], ["Контроль м'яча", "уміння тримати м'яч біля себе й керувати ним у русі."], ["Темп гри", "швидкість, з якою команда виконує дії на майданчику."]], "th": [{"h": "Доджбол. Вправи для розвитку сили м'язів кистей рук; імітаційні вправи", "p": ["Сильні кисті дозволяють міцно тримати м'яч, кидати його точніше й надійно ловити навіть сильні кидки. Імітаційні вправи допомагають засвоїти правильний рух руки без ризику влучити в когось.", "Імітацію виконують перед дзеркалом або під наглядом учителя, звертаючи увагу на кожну фазу кидка."], "ul": ["Стискання тенісного м'яча або еспандера.", "Віджимання від стіни на пальцях.", "Утримання м'яча однією рукою зверху.", "Імітація замаху й кидка без м'яча.", "Не перенапружуй пальці: роби паузи."]}, {"h": "Футзал. Пересування: поєднання прийомів пересування з технікою володіння м'ячем", "p": ["Добрий гравець футзалу вміє вести м'яч на бігу, раптово зупинятися, змінювати напрямок і рушати знову. Для цього потрібна злагодженість ніг і погляду.", "Тренуються поступово: спочатку повільне ведення з поворотами, потім швидше й з опором партнера."], "ul": ["Ведення з обведенням фішок.", "Зупинка м'яча підошвою з подальшим ривком.", "Розворот із м'ячем на 90° і 180°.", "Ведення зі зміною темпу за сигналом.", "Погляд — на поле, а не лише на м'яч."]}], "f": "", "pr": ["Виконай 3 підходи по 15 стискань м'якого м'яча чи еспандера кожною рукою.", "Перед дзеркалом виконай 10 імітацій кидка однією рукою зверху, звертаючи увагу на замах і роботу кисті; запиши, що вдалося, а що — ні."], "q": ["Навіщо гравцю доджболу сильні кисті?", "Які вправи зміцнюють м'язи кистей?", "Як поєднувати ведення м'яча з розворотом?", "Чому важливо змінювати темп ведення?"]}, {"n": "89", "t": "Імітація кидків і ловіння в доджболі; командні тактичні дії в нападі та захисті у футзалі", "g": "Закріпити техніку кидків і ловіння в імітаційних вправах та зрозуміти основи командної тактики футзалу.", "k": "Модулі: Доджбол · Футзал", "terms": [["Амортизація під час ловіння", "поступове гальмування м'яча рухом рук до себе, що зменшує удар."], ["Заданий темп", "визначена швидкість виконання вправи."], ["Командна тактика", "спільний план дій усієї команди в нападі й захисті."], ["Пресинг", "активний захист, коли гравці тиснуть на суперника з м'ячем, щоб швидко його відібрати."]], "th": [{"h": "Доджбол. Імітаційні вправи: кидки та ловіння в різному та заданому темпі", "p": ["Ловіння м'яча в доджболі — найкращий захист, бо повертає у гру партнера. Щоб ловити надійно, треба зустріти м'яч руками й «погасити» його рух, притискаючи до грудей.", "Імітаційні вправи виконують у повільному, середньому й швидкому темпі, щоб рух став автоматичним."], "ul": ["Ловіння: руки перед собою, пальці розслаблені.", "Амортизуй — підтягни м'яч до тулуба.", "Кидок: замах, крок протилежною ногою, мах рукою.", "Повільний темп — для техніки, швидкий — для реакції.", "Не ловити м'яч прямими напруженими пальцями."]}, {"h": "Футзал. Командні тактичні дії в нападі та захисті", "p": ["У нападі команда прагне контролювати м'яч, створювати переваги й завершувати атаку ударом. У захисті — закривати простір, опікати суперників і швидко відбирати м'яч.", "Найпоширеніші системи розстановки у футзалі — це варіанти з чотирма польовими гравцями, наприклад «ромб» або «квадрат»."], "ul": ["Напад: рух без м'яча, відкривання, швидкі передачі.", "Захист: зональний або персональний.", "Пресинг — на половині суперника.", "Швидкий перехід від захисту до нападу.", "Кожен гравець знає свою роль."]}], "f": "", "pr": ["Намалюй дві схеми розстановки 4 польових гравців у футзалі («ромб» і «квадрат») і поясни, чим вони відрізняються.", "Виконай 3 підходи по 10 імітацій ловіння м'яча з амортизацією перед дзеркалом."], "q": ["Як правильно ловити м'яч у доджболі?", "Що таке амортизація?", "Що таке пресинг?", "Які системи розстановки використовують у футзалі?"]}, {"n": "90", "t": "Кидки м'яча зверху в доджболі; зупинки м'яча підошвою, стопою, стегном і грудьми у футзалі", "g": "Опанувати техніку кидка зверху та основні способи зупинки м'яча у футзалі.", "k": "Модулі: Доджбол · Футзал", "terms": [["Кидок зверху", "кидок однією рукою з замахом над плечем, найсильніший і найдальший спосіб кидка."], ["Зупинка м'яча", "прийом, за допомогою якого гравець гасить швидкість м'яча й бере його під контроль."], ["Зупинка підошвою", "прийом, коли гравець накриває м'яч підошвою й зупиняє його."], ["Уступаюча зупинка", "зупинка з рухом частини тіла назад, що поглинає силу удару м'яча."]], "th": [{"h": "Доджбол. Кидки м'яча зверху", "p": ["Кидок зверху дає найбільшу силу й дальність. Він схожий на метання малого м'яча: замах над плечем, крок уперед, рух руки, кисть «дотискає» м'яч.", "Цілься в тулуб чи ноги суперника — кидки в голову заборонені."], "ul": ["М'яч тримай пальцями, а не долонею.", "Стань боком до цілі, відведи руку назад-угору.", "Крок ногою, протилежною руці кидка.", "Розворот корпусу, потім рух руки та кисті.", "Помилки: кидок лише рукою без корпусу, низький лікоть."]}, {"h": "Футзал. Зупинки м'яча підошвою, внутрішньою стороною стопи, стегном, грудьми", "p": ["Від якісної зупинки залежить, чи встигне гравець виконати наступну дію. У футзалі найчастіше використовують зупинку підошвою, бо м'яч котиться по підлозі.", "Високі м'ячі зупиняють стегном або грудьми, уступаючи рухом назад."], "ul": ["Підошвою: накрий м'яч зверху, не тисни сильно.", "Внутрішньою стороною стопи: стопа розвернута, уступаючий рух назад.", "Стегном: підніми стегно назустріч м'ячу й опусти його в момент дотику.", "Грудьми: прогнися, руки розведи, м'яч скочується вниз до ніг.", "Після зупинки м'яч має бути поруч, готовим до гри."]}], "f": "", "pr": ["Опиши послідовність фаз кидка зверху (4–5 фаз) і намалюй схему руху руки.", "Сидячи на стільці, відпрацюй зупинку повільно підкоченого м'якого м'яча підошвою — 3 підходи по 10 разів кожною ногою."], "q": ["Чому кидок зверху найсильніший?", "Яка нога робить крок під час кидка?", "Який спосіб зупинки найчастіший у футзалі і чому?", "Як зупиняють високий м'яч?"]}, {"n": "91", "t": "Ловіння та кидок знизу в доджболі; застосування командних тактичних дій у футзалі", "g": "Навчитися ловити м'яч і кидати знизу та застосовувати командні тактичні дії у грі.", "k": "Модулі: Доджбол · Футзал", "terms": [["Кидок знизу", "кидок м'яча однією або двома руками з замахом знизу, точний на коротку відстань."], ["Ловіння на рівні пояса", "прийом м'яча, що летить у тулуб, руками, складеними «кошиком»."], ["Відкривання", "рух гравця без м'яча у вільне місце, щоб отримати передачу."], ["Опіка", "захисна дія, коли гравець тримає під контролем конкретного суперника."]], "th": [{"h": "Доджбол. Ловіння та кидок м'яча знизу", "p": ["Кидок знизу точніший, але слабший за кидок зверху. Його використовують для швидкої передачі партнеру або для кидка в ноги суперника з близької відстані.", "Ловіння на рівні пояса й нижче виконують, розвертаючи долоні вгору, а м'яч притискають до тіла."], "ul": ["Замах рукою вниз-назад, мах уперед, випуск м'яча на рівні стегна.", "Ловіння: «кошик» із рук, лікті біля тулуба.", "Згинай ноги, щоб опуститися до низького м'яча.", "Слідкуй очима за м'ячем до самих рук.", "Не кидай м'яч у суперника, що впав чи не готовий."]}, {"h": "Футзал. Командні тактичні дії в нападі та захисті та їх застосування", "p": ["Тактика працює лише тоді, коли всі гравці розуміють свої обов'язки. У нападі гравці без м'яча відкриваються, а гравець із м'ячем шукає найкращий варіант передачі. У захисті кожен опікає свого суперника або зону.", "Після втрати м'яча вся команда швидко повертається в захист."], "ul": ["Відкривайся під передачу, а не стій позаду суперника.", "Передавай тому, хто вільний і ближче до воріт.", "У захисті стань між суперником і своїми воротами.", "Допомагай партнеру, якого обіграли (підстраховка).", "Спілкуйся: «вільний!», «тримай!», «назад!»."]}], "f": "", "pr": ["Намалюй схему атаки у футзалі, де гравець без м'яча відкривається під передачу, і покажи стрілками рух гравців і м'яча.", "Виконай імітацію кидка знизу та ловіння «кошиком» перед дзеркалом — по 2 підходи по 10 повторень."], "q": ["Коли використовують кидок знизу?", "Як ловити м'яч, що летить на рівні пояса?", "Що таке відкривання?", "Де стоїть захисник під час опіки?"]}, {"n": "92", "t": "Взаємодія гравців під час кидків і ловіння в доджболі; вправи для фізичних якостей футзаліста", "g": "Навчитися узгоджувати дії з партнерами під час кидків і ловіння та знати вправи для розвитку фізичних якостей футзаліста.", "k": "Модулі: Доджбол · Футзал", "terms": [["Залповий кидок", "одночасний кидок кількох гравців в одну ціль, щоб суперникові було важко ухилитися."], ["Пас партнеру", "передача м'яча своєму гравцю для кращої позиції кидка."], ["Верхні кінцівки", "руки: плече, передпліччя, кисть."], ["Нижні кінцівки", "ноги: стегно, гомілка, стопа."]], "th": [{"h": "Доджбол. Взаємодія гравців під час кидків та ловіння", "p": ["Один кидок легко зловити або ухилитися, а кілька одночасних — набагато складніше. Тому гравці домовляються, в кого і коли кидати.", "У захисті партнери допомагають одне одному: хтось ловить, а хтось прикриває та підбирає м'ячі."], "ul": ["Залповий кидок за сигналом капітана.", "Передача м'яча гравцю, який ближче до суперника.", "Гравець, що вміє ловити, стоїть попереду.", "Слабші ловці тримаються позаду.", "Після кидка — відразу назад від лінії."]}, {"h": "Футзал. Вправи для розвитку гнучкості, швидкості, спритності, сили рук і ніг", "p": ["Футзалісту потрібні вибухова швидкість, сильні ноги для ударів, спритність для дриблінгу і гнучкість для запобігання травмам. Сила рук також важлива — для боротьби за позицію і для воротаря.", "Вправи підбирають так, щоб вони були схожими на рухи в грі."], "ul": ["Гнучкість: випади, розтягування задньої поверхні стегна, махи.", "Швидкість: старти за сигналом, ривки 5–10 м.", "Спритність: обведення фішок, естафети.", "Сила ніг: присідання, випади, підйоми на носки.", "Сила рук: віджимання, планка."]}], "f": "", "pr": ["Склади комплекс з 6 безпечних домашніх вправ (по одній на гнучкість, силу рук, силу ніг, прес, рівновагу, координацію) і виконай його.", "Опиши, як команда в доджболі може організувати залповий кидок, у 4–5 реченнях."], "q": ["Навіщо в доджболі залпові кидки?", "Хто в команді має стояти попереду?", "Які фізичні якості важливі для футзаліста?", "Наведи вправи для розвитку сили ніг."]}, {"n": "93", "t": "Кидки зверху в парах у доджболі; жонглювання м'ячем ногою, стегном, головою у футзалі", "g": "Закріпити кидок зверху в парах і ознайомитися з технікою жонглювання м'ячем.", "k": "Модулі: Доджбол · Футзал", "terms": [["Робота в парах", "вправа, у якій двоє гравців по черзі кидають і ловлять м'яч."], ["Жонглювання", "багаторазове підбивання м'яча різними частинами тіла без падіння на землю."], ["Відчуття м'яча", "здатність тонко контролювати силу й напрям дотику до м'яча."], ["Підйом стопи", "верхня частина стопи, якою виконують жонглювання й удари."]], "th": [{"h": "Доджбол. Кидки м'яча зверху в парах", "p": ["Кидки в парах дозволяють одночасно тренувати кидок і ловіння. Партнери стоять один навпроти одного й поступово збільшують відстань і силу кидка.", "Цілься партнеру в тулуб, щоб йому було зручно ловити."], "ul": ["Початкова відстань 4–5 м, далі — більше.", "Кидай з правильним замахом і кроком.", "Партнер ловить з амортизацією.", "Міняйте руки, щоб розвивати обидві.", "Кидки в голову навіть у тренуванні заборонені."]}, {"h": "Футзал. Жонглювання м'ячем ногою, стегном, головою", "p": ["Жонглювання розвиває відчуття м'яча, координацію й рівновагу. Хоча в грі м'яч жонглюють рідко, ця вправа робить гравця впевненішим у контролі м'яча.", "Починають з одного-двох дотиків, ловлячи м'яч руками, і поступово збільшують кількість."], "ul": ["Ногою: підйомом стопи, носок трохи витягнутий.", "Стегном: стегно піднімається до горизонталі.", "Головою: удар лобом, очі відкриті, шия напружена.", "М'яч підбивай невисоко, на рівень пояса.", "Головою жонглюй лише легким м'ячем і обережно."]}], "f": "", "pr": ["Із м'якою повітряною кулькою вдома (на вільному від меблів місці) спробуй підбивати її почергово правою й лівою ногою, рахуючи дотики. Запиши свій найкращий результат.", "Опиши у зошиті 3 правила безпечної роботи в парах під час кидків у доджболі."], "q": ["Як збільшують складність вправи в парах?", "Чому кидок слід спрямовувати в тулуб партнера?", "Яку якість розвиває жонглювання?", "Як правильно жонглювати стегном?"]}, {"n": "94", "t": "Ловіння та кидок знизу в доджболі; фінти «зупинкою», «ударом» з пропусканням м'яча, «відходом»", "g": "Закріпити ловіння й кидок знизу та освоїти перші відволікаючі дії (фінти) у футзалі.", "k": "Модулі: Доджбол · Футзал", "terms": [["Фінт", "відволікаючий рух, що вводить суперника в оману щодо справжніх намірів гравця."], ["Фінт «зупинкою»", "обманна раптова зупинка під час ведення з подальшим ривком."], ["Фінт «ударом»", "замах для удару чи передачі, після якого гравець пропускає м'яч або веде його в інший бік."], ["Фінт «відходом»", "рух корпусу в один бік із подальшим веденням м'яча в протилежний."]], "th": [{"h": "Доджбол. Ловіння та кидок м'яча знизу", "p": ["Повторюємо ловіння та кидок знизу. Тепер мета — виконувати їх швидко, одразу після ловіння, щоб суперник не встиг підготуватися.", "Ловити легше, коли ти не боїшся м'яча: спокій і правильна стійка допомагають більше, ніж сила."], "ul": ["Ноги злегка зігнуті, вага на передній частині стоп.", "Ловіння з амортизацією, м'яч до тулуба.", "Після ловіння — швидкий кидок знизу партнеру чи суперникові в ноги.", "Не затримуй м'яч надовго.", "Слідкуй, щоб у тебе не кидали інші, поки ти ловиш."]}, {"h": "Футзал. Відволікаючі дії (фінти): «зупинкою», «ударом» з пропусканням м'яча, «відходом»", "p": ["Фінти допомагають обіграти суперника один на один. Секрет фінту — переконливий обманний рух і швидка зміна дії.", "Спочатку фінти вивчають без суперника, потім із пасивним, а згодом з активним захисником."], "ul": ["«Зупинка»: веди м'яч, різко зупини підошвою, потім ривок.", "«Удар»: замах ногою, ніби б'єш, але пропускаєш м'яч і ведеш далі.", "«Відхід»: нахил корпусу вбік, рух у протилежний.", "Виконуй фінт на відстані 1–2 м від суперника.", "Після фінту — різке прискорення."]}], "f": "", "pr": ["Опиши, як виконується кожен із трьох фінтів («зупинкою», «ударом», «відходом»), і намалюй схему одного з них.", "Без м'яча перед дзеркалом виконай імітацію фінту «відходом» (нахил корпусу в один бік — крок у інший) — 3 підходи по 10 разів, повільно."], "q": ["Що таке фінт?", "Як виконується фінт «зупинкою»?", "На якій відстані від суперника виконують фінт?", "Чому важливо одразу кидати м'яч після ловіння в доджболі?"]}, {"n": "95", "t": "Кидки в задану зону в доджболі; фінти «перенесенням ноги» й «наступанням на м'яч»", "g": "Навчитися обирати спосіб кидка залежно від ситуації та освоїти складніші фінти у футзалі.", "k": "Модулі: Доджбол · Футзал", "terms": [["Вибір кидка", "рішення гравця, який спосіб кидка використати залежно від відстані й положення суперника."], ["Кидок у ноги", "кидок, спрямований у нижню частину тіла суперника, від якого важче ухилитися."], ["Фінт «перенесенням ноги»", "обманний рух, коли гравець переносить ногу над м'ячем, вдаючи ведення в один бік."], ["Фінт «наступанням на м'яч»", "прийом, коли гравець ставить підошву на м'яч і розвертається разом із ним."]], "th": [{"h": "Доджбол. Кидки м'яча: верхній, нижній; кидок знизу в задану зону по супернику", "p": ["У доджболі гравець обирає кидок залежно від ситуації: зверху — для сильного й далекого кидка, знизу — для швидкого й точного в ноги суперника.", "Кидок у задану зону вчить точності: потрібно влучити в певну ділянку майданчика чи в ціль."], "ul": ["Кидок зверху — далеко й сильно.", "Кидок знизу — близько й точно.", "У ноги кидати вигідніше: важче ухилитися.", "Тренуй точність по цілях на стіні чи на підлозі.", "Голова — заборонена зона для кидків."]}, {"h": "Футзал. Фінти «перенесенням ноги через м'яч», «наступанням на м'яч однією ногою з розворотом»", "p": ["Ці фінти складніші, бо потребують доброї координації. «Перенесення ноги» змушує суперника думати, що ти підеш в інший бік. «Наступання на м'яч з розворотом» допомагає змінити напрям і закрити м'яч тілом.", "Вивчай ці прийоми повільно, без суперника, поки рух не стане впевненим."], "ul": ["«Перенесення ноги»: нога описує дугу над м'ячем, потім ведення в протилежний бік.", "«Наступання на м'яч»: підошва на м'ячі, розворот на опорній нозі, м'яч тягнеться за ногою.", "Корпус бере участь в обмані.", "Не дивися на м'яч надто довго — стеж за суперником.", "Тренуй обидві ноги."]}], "f": "", "pr": ["Намалюй майданчик доджболу й познач 3 «задані зони» для кидків знизу, пояснивши, коли вигідно кидати в кожну.", "Опиши в зошиті, чим фінт «перенесенням ноги» відрізняється від фінту «відходом»."], "q": ["Коли вигідніше кидати знизу, а коли зверху?", "Чому кидок у ноги ефективний?", "Як виконується фінт «наступанням на м'яч з розворотом»?", "Чому фінти треба тренувати обома ногами?"]}, {"n": "96", "t": "Умови польоту м'яча й вітер на відкритому майданчику в доджболі; гра воротаря у футзалі", "g": "Зрозуміти, як зовнішні умови впливають на кидки, та вивчити основні елементи гри воротаря у футзалі.", "k": "Модулі: Доджбол · Футзал", "terms": [["Опір повітря", "сила, що гальмує рух м'яча в повітрі."], ["Зустрічний вітер", "вітер, що дме назустріч напрямку кидка й скорочує його дальність."], ["Штрафний майданчик", "зона біля воріт, у межах якої воротар може грати руками."], ["Вибір позиції воротаря", "розташування воротаря так, щоб закрити найбільшу частину воріт."]], "th": [{"h": "Доджбол. Умови польоту м'яча, відстань до суперника та напрям вітру на відкритому майданчику", "p": ["На відкритому майданчику на м'яч діє вітер: попутний збільшує дальність кидка, зустрічний — зменшує, а боковий зносить м'яч убік. Легкі м'ячі для доджболу особливо чутливі до вітру.", "Чим більша відстань до суперника, тим більше часу в нього на реакцію, тому вигідніше кидати з ближчої відстані, але не перетинаючи центральну лінію."], "ul": ["Перед грою визнач напрям вітру.", "Проти вітру кидай сильніше й нижче.", "З боковим вітром цілься трохи «вбік від вітру».", "Сонце також впливає: не стій лицем до нього під час ловіння.", "Гравець, що стоїть далі, має більше часу на ухилення."]}, {"h": "Футзал. Елементи гри воротаря: ловіння, кидки м'яча рукою, вибір місця", "p": ["Воротар — останній рубіж захисту і часто перший гравець атаки. Він ловить і відбиває удари, вводить м'яч у гру рукою й керує захистом голосом.", "У штрафному майданчику воротар може грати руками. Важливо правильно вибирати позицію між м'ячем і центром воріт."], "ul": ["Стійка: ноги на ширині плечей, коліна зігнуті, руки перед собою.", "Ловіння низьких м'ячів — «кошиком», високих — над головою.", "Кидок рукою знизу — точно партнеру, кидок зверху — далеко.", "Позиція — на лінії між м'ячем і центром воріт.", "Безпека: воротарські рукавиці, наколінники, обережні падіння."]}], "f": "У футзалі ворота мають розмір 3 на 2 метри — менші, ніж у великому футболі.", "pr": ["Намалюй схему: м'яч у різних точках поля і правильна позиція воротаря для кожної (3 ситуації).", "Опиши, як вітер різного напрямку впливає на кидок у доджболі, у вигляді таблиці."], "q": ["Як зустрічний вітер впливає на кидок?", "Чому під час ловіння не варто стояти лицем до сонця?", "Де може грати руками воротар у футзалі?", "Як правильно вибрати позицію воротаря?"]}, {"n": "97", "t": "Страхування й навчальна гра в доджбол; групові та індивідуальні тактичні дії у футзалі", "g": "Навчитися страхувати партнерів у доджболі та взаємодіяти з партнерами під час організації атаки у футзалі.", "k": "Модулі: Доджбол · Футзал", "terms": [["Страхування в доджболі", "розташування гравця за партнером, щоб підібрати м'яч чи зловити кидок, якщо партнер не впорався."], ["Повернення гравця", "правило, за яким після зловленого м'яча один вибулий гравець повертається на майданчик."], ["Групові тактичні дії", "узгоджені дії двох-трьох гравців, наприклад «стінка» чи заслін."], ["Стінка", "комбінація, коли гравець передає м'яч партнеру й одразу отримує його назад після ривка."]], "th": [{"h": "Доджбол. Страхування гравців; навчальна гра", "p": ["Страхування в доджболі допомагає не втрачати м'ячі й гравців. Якщо партнер не зловив м'яч, а той відскочив від його рук, страхуючий може підхопити його до падіння на підлогу — за багатьма правилами в такому разі влучання не зараховується, а кидаючий вибуває.", "У навчальній грі закріплюємо всі вивчені прийоми: кидки, ловіння, ухилення, взаємодію й правила."], "ul": ["Стій трохи позаду й збоку від партнера, що ловить.", "Стеж за м'ячем, що відскакує.", "Навчальна гра — за спрощеними правилами вчителя.", "Чесно виходь після влучання.", "Вибулі гравці чекають у визначеній зоні."]}, {"h": "Футзал. Групові та індивідуальні тактичні дії; взаємодія з партнерами під час атаки", "p": ["Індивідуальні тактичні дії — це рішення одного гравця: обіграти, віддати пас чи бити. Групові — це взаємодії кількох гравців, наприклад «стінка», перехресне переміщення чи заслін.", "Добра атака будується на швидких передачах і русі без м'яча, щоб розтягнути захист суперника."], "ul": ["Індивідуальні в нападі: відкривання, ведення, обведення, удар.", "Індивідуальні в захисті: опіка, перехоплення, відбір.", "Групові: «стінка», схрещення, передача в «стоп».", "Атака через фланг і центр.", "Захист: підстраховка партнера, перемикання на іншого гравця."]}], "f": "", "pr": ["Намалюй схему комбінації «стінка» у футзалі та опиши її у 3–4 реченнях.", "Запиши 5 правил доджболу, які ти знаєш, і поясни, як страхування допомагає команді."], "q": ["Що таке страхування в доджболі?", "Чим індивідуальні тактичні дії відрізняються від групових?", "Як виконується «стінка»?", "Навіщо в атаці рух без м'яча?"]}, {"n": "98", "t": "Вправи на розтягування в доджболі; «закривання» та «перехоплення» у футзалі", "g": "Закріпити вправи на розтягування та освоїти індивідуальні захисні дії «закривання» і «перехоплення».", "k": "Модулі: Доджбол · Футзал", "terms": [["Еластичність м'язів", "здатність м'язів розтягуватися й повертатися до початкової довжини."], ["Закривання", "дія захисника, який стає між суперником і м'ячем, не даючи отримати передачу."], ["Перехоплення", "дія захисника, коли він заволодіває м'ячем під час передачі суперника."], ["Стійка захисника", "положення напівбоком, ноги зігнуті, вага на передній частині стоп."]], "th": [{"h": "Доджбол. Вправи на розтягування", "p": ["Під час кидків і ухилень найбільше навантажуються плечі, спина та ноги. Розтягування допомагає зберегти рухливість суглобів і відновитися після гри.", "Статичні вправи виконують після основної частини заняття, утримуючи кожну позицію 15–30 секунд."], "ul": ["Розтягування плеча: рука перед грудьми, притисни її іншою рукою.", "Розтягування трицепса: рука за головою, тисни на лікоть.", "Нахили тулуба вбік.", "Випад для передньої поверхні стегна.", "Розтягування литкового м'яза біля стіни."]}, {"h": "Футзал. Індивідуальні тактичні дії: «закривання», «перехоплення»", "p": ["«Закривання» не дає суперникові отримати м'яч: захисник стоїть між ним і м'ячем, стежачи за обома. «Перехоплення» — це вдалий момент, коли захисник вгадує напрям передачі й забирає м'яч.", "Обидві дії вимагають уважності, швидкої реакції та правильного вибору позиції."], "ul": ["Тримай у полі зору і м'яч, і суперника.", "Стійка напівбоком, ноги зігнуті.", "Для перехоплення стартуй у момент передачі.", "Якщо не встигаєш — краще закрий, ніж ризикуй.", "Не штовхай і не тримай суперника руками."]}], "f": "", "pr": ["Виконай 5 вправ на розтягування з конспекту, утримуючи кожну 20–30 секунд, і запиши свої відчуття.", "Намалюй схему, де захисник «закриває» суперника від передачі, і поясни правильну позицію."], "q": ["Які м'язи найбільше навантажуються в доджболі?", "Скільки часу утримують статичну вправу на розтягування?", "Чим «закривання» відрізняється від «перехоплення»?", "Чому під час перехоплення важливо правильно вибрати момент?"]}, {"n": "99", "t": "Вправи для швидкості й спритності в доджболі; техніка удару по м'ячу ногою у футзалі", "g": "Закріпити вправи для розвитку швидкості та спритності й опанувати техніку удару по м'ячу ногою.", "k": "Модулі: Доджбол · Футзал", "terms": [["Удар внутрішньою стороною стопи", "найточніший удар для передач і ударів з близької відстані."], ["Удар підйомом", "сильний удар верхньою частиною стопи для дальніх ударів."], ["Удар носком", "короткий несподіваний удар кінчиком взуття, часто використовуваний у футзалі."], ["Опорна нога під час удару", "нога, що стоїть поруч із м'ячем і визначає напрям удару."]], "th": [{"h": "Доджбол. Вправи для розвитку швидкості та спритності", "p": ["Швидкість і спритність — го
