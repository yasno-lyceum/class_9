на робота ГР2 перевіряє техніку й точність — тренуйся заздалегідь."]}, {"h": "Футбол. Обведення перешкод; позиція на кутових і штрафних; командний напад", "p": ["Обведення стійок і фішок тренує контроль м'яча, а обведення суперника — ще й фінти та зміну темпу. На стандартних положеннях кожен гравець знає свою зону: ближня штанга, дальня штанга, центр, страхування позаду.", "Командні дії в нападі — це «стінка» (передача в один дотик і повернення), схрещування (два гравці міняються місцями), атака через фланги, розтягування оборони суперника. Мета — створити перевагу в чисельності чи просторі."], "ul": ["«Стінка»: віддай пас партнерові, ривком оббіжи захисника, отримай м'яч назад.", "Схрещування збиває захисників з опіки.", "Атака по флангах розтягує оборону і звільняє центр.", "На кутовому один гравець завжди страхує позаду від контратаки.", "Після втрати м'яча атака одразу переходить у захист усієї команди."]}], "f": "Комбінацію «стінка» у футболі також називають «один-два», бо вона складається з двох швидких передач.", "pr": ["Намалюй схему комбінації «стінка» з трьома учасниками: двоє нападників і захисник.", "Якщо вдома є безпечне місце, кидай м'яку шкарпетку-м'ячик у кошик з 2–3 м (20 кидків) і запиши, скільки влучань — це тренує окомір без ризику."], "q": ["Чим відрізняється метання у вертикальну і горизонтальну ціль?", "Що таке комбінація «стінка»?", "Як команда розподіляє зони під час подачі кутового?", "Навіщо в атаці використовують фланги?"]}, {"n": "23", "t": "Передача естафетної палички, рівномірний біг; відбір м'яча й командний захист", "g": "Учень знатиме техніку передачі естафетної палички в русі та принципи рівномірного бігу, а також способи відбору м'яча і командні дії в захисті.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Естафетна паличка", "гладка трубка, яку учасники естафетного бігу передають один одному."], ["Зона передачі", "ділянка доріжки, у межах якої дозволено передати естафетну паличку."], ["Рівномірний біг", "біг з однаковою швидкістю протягом усієї дистанції."], ["Зонний захист", "спосіб захисту, коли кожен гравець відповідає за свою ділянку поля."], ["Персональна опіка", "спосіб захисту, коли захисник постійно стежить за певним суперником."]], "th": [{"h": "Легка атлетика. Передача естафетної палички; рівномірний біг до 1500 м", "p": ["Передача палички в русі відбувається в зоні передачі: той, хто приймає, стартує, коли партнер добігає до контрольної позначки, і простягає руку назад. Передаючий за командою «Хоп!» вкладає паличку в долоню знизу вгору або зверху вниз. Паличку не можна кидати; якщо впала — її піднімає той, хто впустив.", "Рівномірний біг до 1500 м і біг у чергуванні з ходьбою до 2000 м розвивають витривалість. Головне — постійний темп, ритмічне дихання і самоконтроль самопочуття."], "ul": ["Передача поза зоною — команду дискваліфікують.", "Приймаючий не обертається назад — довіряє голосовій команді.", "Паличку передають з руки в руку, не змінюючи швидкості.", "У рівномірному бігу темп на першому і останньому колі майже однаковий.", "Чергування бігу й ходьби — хороший спосіб для початківців."]}, {"h": "Футбол. Ігри на витривалість; відбір м'яча; командні дії в захисті", "p": ["Футбол — гра на витривалість: матч триває довго, і гравці постійно чергують біг і ривки. Ігри з елементами футболу на великих майданчиках чудово її розвивають. Відбір м'яча в русі виконують, коли суперник веде м'яч — у момент, коли м'яч відірвався від його ноги. Відбір у статиці — коли суперник стоїть з м'ячем: захисник наближається, займає зручну стійку і чекає на помилку.", "Командні дії в захисті: зонна оборона, персональна опіка або їх поєднання. Гравці страхують один одного, «зсуваються» в бік м'яча, скорочують простір між лініями."], "ul": ["Відбір: стопа ставиться на м'яч рішуче, але без удару по ногах суперника.", "Захисники діють компактно, не залишаючи «дірок» між собою.", "Один гравець тисне на суперника з м'ячем, інший страхує.", "Не дозволяй суперникові розвернутися обличчям до твоїх воріт.", "Переходь в атаку одразу після відбору."]}], "f": "В естафеті 4×100 м команда з добре відпрацьованими передачами може обіграти суперника з індивідуально швидшими бігунами.", "pr": ["Намалюй схему зони передачі естафети з позначенням, де стартує приймаючий і де відбувається передача.", "Опиши 3 відмінності зонного захисту від персональної опіки і переваги кожного способу."], "q": ["Як правильно передавати естафетну паличку в русі?", "Що буде, якщо паличку передали поза зоною?", "Чим відбір м'яча в русі відрізняється від відбору в статиці?", "Як захисники страхують один одного в командному захисті?"]}, {"n": "24", "t": "Підсумок І періоду: метання м'яча на дальність, змагання; командна гра й аналіз у футболі", "g": "Учень узагальнить знання з легкої атлетики й футболу за І період, знатиме техніку метання малого м'яча на дальність і вмітиме аналізувати командну гру.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Метання на дальність", "кидок снаряда з розбігу з метою відправити його якомога далі."], ["Схресний крок", "крок у розбігу метальника, коли одна нога переступає перед іншою, щоб «обігнати» снаряд."], ["Колова робота", "виконання вправ на кількох станціях з переходом між ними за сигналом."], ["Аналіз гри", "розбір дій своєї команди й суперника для пошуку сильних і слабких сторін."]], "th": [{"h": "Легка атлетика. Метання малого м'яча на дальність; підсумок модуля", "p": ["Метання на дальність виконують з розбігу: кілька кроків, схресний крок, фінальне зусилля з роботою ніг, тулуба й руки. Кут вильоту м'яча — приблизно 40–45°. Кидок має йти «від ніг» — сила передається від поштовху ногою через тулуб до кисті.", "За І період ми вивчили правила безпеки та першої допомоги, техніку бігу на різні дистанції, біг з перешкодами, по віражу, естафети, стрибок у довжину з місця, метання в ціль і на дальність, а також рухові якості, які розвиває легка атлетика."], "ul": ["Розбіг поступово прискорюється, без зупинки перед кидком.", "Рука з м'ячем у фінальному зусиллі прямо за плечем.", "Не заступай за лінію кидка — спроба не зарахується.", "Повтори: швидкість, витривалість, спритність, гнучкість, швидкісно-силові якості.", "Участь у шкільних змаганнях і естафетах — шанс застосувати вміння на практиці."]}, {"h": "Футбол. Колова робота, командні змагання, аналіз гри; підсумок модуля", "p": ["У футбольному модулі ми повторили суддівство й чесну гру, профілактику травм, удари ногою і головою, зупинки м'яча, ведення й фінти, вкидання, гру воротаря, стандартні положення та командні дії в нападі й захисті, а також історію олімпійського руху і роль міжнародних організацій.", "Аналіз гри — важливе вміння. Після матчу спитай себе: що в нас вийшло, де ми втрачали м'яч, чому пропустили, що варто змінити. Діагностувальна робота ГР3 перевіряє, як ти застосовуєш знання й уміння в ігрових ситуаціях."], "ul": ["Колова робота: техніка на кожній станції, перехід за сигналом.", "У командних змаганнях кожен має роль і відповідальність.", "Аналізуй гру без звинувачень — шукай рішення.", "Відзначай вдалі дії партнерів — це згуртовує.", "Постав собі мету на наступний період: яку навичку покращити."]}], "f": "Тренери професійних команд часто розбирають відеозаписи матчів з гравцями, щоб ті бачили свої помилки збоку.", "pr": ["Склади таблицю підсумків І періоду: 5 найважливіших знань з легкої атлетики й 5 з футболу.", "Напиши короткий аналіз однієї гри (на уроці або переглянутої): 2 сильні сторони команди, 2 помилки, 2 поради."], "q": ["Які фази має метання малого м'яча на дальність?", "Які рухові якості розвиває легка атлетика і якими вправами?", "Назви основні командні тактичні дії в нападі й захисті у футболі.", "Що ти хочеш покращити у своїй підготовці в наступному періоді?"]}]}, {"name": "ІІ період. Баскетбол, баскетбол 3×3", "lessons": [{"n": "25", "t": "Вступ до ІІ періоду: координація в баскетболі; баскетбол 3×3 у світі та Україні", "g": "Учень знатиме правила безпеки на заняттях баскетболом, розумітиме значення спритності й координації та матиме уявлення про баскетбол 3×3 і його місце в олімпійському русі.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Координаційні здібності", "здатність точно узгоджувати рухи різних частин тіла і швидко перебудовувати їх."], ["Баскетбол 3×3", "різновид баскетболу, у якому дві команди по троє гравців грають на одне кільце."], ["ФІБА", "Міжнародна федерація баскетболу, що керує баскетболом 5×5 і 3×3 у світі."], ["Дуга", "лінія на майданчику, за якою влучний кидок у баскетболі 3×3 приносить 2 очки."]], "th": [{"h": "Баскетбол. Безпека на заняттях; розвиток спритності та координації", "p": ["У цьому періоді основні модулі — баскетбол і баскетбол 3×3 (у програмі року також доджбол і гандбол). Перед початком пам'ятай про безпеку: кросівки з нековзною підошвою, коротко обстрижені нігті, без прикрас і годинників, розминка з особливою увагою до гомілковостопних суглобів і пальців рук.", "Спритність і координація в баскетболі — це вміння вести м'яч, не дивлячись на нього, змінювати напрямок, ловити незручні передачі, стрибати й приземлятися контрольовано. Їх розвивають вправами з двома м'ячами, веденням зі зміною рук, естафетами з перешкодами."], "ul": ["Не вистрибуй під кільцем, якщо там стоять інші гравці, і не висни на кільці.", "Ловлячи м'яч, пальці розслаблені й розведені — так менше ризику «вибити» палець.", "М'ячі, що не використовуються, лежать у кошику, а не під ногами.", "Вправи на координацію: ведення двох м'ячів, ведення зі зміною рук за спиною, кидок після оберту.", "Приземлення після стрибка — на обидві ноги, зігнуті в колінах."]}, {"h": "Баскетбол 3×3. Місце на міжнародному рівні та в олімпійському русі", "p": ["Баскетбол 3×3 виріс із вуличних ігор, а ФІБА перетворила його на офіційний вид спорту з власними правилами й міжнародними турнірами. Вперше баскетбол 3×3 увійшов до програми Олімпійських ігор у Токіо (2020, проведені 2021 року). Гра динамічна: 12 секунд на атаку, матч до 21 очка або 10 хвилин.", "Україна розвиває баскетбол 3×3: національні команди беруть участь у міжнародних турнірах ФІБА, а в містах проводять аматорські змагання на відкритих майданчиках. Цей вид доступний — потрібні лише кільце, м'яч і троє друзів."], "ul": ["Команда: 3 гравці на майданчику + 1 запасний.", "Влучний кидок з-за дуги — 2 очки, з-під дуги — 1 очко, штрафний — 1 очко.", "Після підбору м'яча захисник має вивести його за дугу.", "Матч закінчується, коли команда набирає 21 очко або минає 10 хвилин.", "Баскетбол 3×3 популярний як вуличний спорт у багатьох країнах."]}], "f": "Баскетбол 3×3 став олімпійським видом спорту на Іграх у Токіо, а перший турнір ФІБА 3×3 високого рівня провели ще на юнацьких Олімпійських іграх 2010 року.", "pr": ["Запиши 5 правил безпеки на заняттях баскетболом.", "Склади порівняльну таблицю «Баскетбол 5×5 і баскетбол 3×3»: кількість гравців, кільця, очки за кидки, час на атаку."], "q": ["Які правила безпеки потрібно дотримуватися на баскетболі?", "Які вправи розвивають координацію баскетболіста?", "Коли баскетбол 3×3 став олімпійським видом спорту?", "Скільки очок приносить влучний кидок з-за дуги в баскетболі 3×3?"]}, {"n": "26", "t": "Позиційний напад і швидкий прорив у баскетболі; гігієнічні вимоги до інвентарю", "g": "Учень розумітиме, чим позиційний напад відрізняється від швидкого прориву, і знатиме санітарно-гігієнічні вимоги до спортивного інвентарю та обладнання.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Позиційний напад", "організована атака проти розставленої оборони за заздалегідь відомими схемами."], ["Швидкий прорив", "стрімка атака після заволодіння м'ячем, поки суперник не встиг повернутися в захист."], ["Розігруючий захисник", "гравець, який веде м'яч і організовує атаку команди."], ["Санітарно-гігієнічні вимоги", "правила чистоти й безпеки, яких дотримуються щодо приміщень, інвентарю та одягу."]], "th": [{"h": "Баскетбол. Організація позиційного нападу і швидкого прориву", "p": ["Швидкий прорив починається одразу після підбору, перехоплення чи забитого м'яча: швидка перша передача, гравці біжать по «коридорах» (центр і два фланги), атака завершується кидком з близької відстані. Його мета — створити чисельну перевагу (2 проти 1, 3 проти 2).", "Якщо прорив не вдався, команда переходить до позиційного нападу: гравці займають позиції, розігруючий організовує комбінації — заслони, передачі, проходи. Атака має завершитися кидком за 24 секунди."], "ul": ["Перша передача після підбору — швидка і точна, на фланг або вперед.", "У прориві гравці не біжать «купою», а займають три коридори.", "Позиційний напад — терпіння: шукаємо найкращу позицію для кидка.", "Кожен гравець має позицію: розігруючий, атакуючий захисник, легкий і важкий форварди, центровий.", "Після невдалої атаки — швидке повернення в захист."]}, {"h": "Баскетбол 3×3. Санітарно-гігієнічні вимоги до інвентарю та обладнання", "p": ["Чистий і справний інвентар — запорука безпеки й здоров'я. М'ячі мають бути накачані до правильного тиску, без тріщин; майданчик — сухий і без сторонніх предметів; кільця та щити — надійно закріплені. На вуличних майданчиках перед грою варто перевірити покриття на наявність скла чи вибоїн.", "Особиста гігієна теж важлива: чистий спортивний одяг, змінне взуття для залу, власна пляшка води, рушник. Після гри — душ і зміна одягу."], "ul": ["Мокру підлогу протирають одразу, щоб ніхто не послизнувся.", "М'ячі після занять очищають від пилу і зберігають у сухому місці.", "Не користуйся чужою пляшкою для води.", "Приміщення спортзалу регулярно провітрюють.", "Взуття для залу не носять на вулиці."]}], "f": "У баскетболі 5×5 на атаку відводиться 24 секунди, а в баскетболі 3×3 — лише 12, тому там швидкі рішення ще важливіші.", "pr": ["Намалюй схему швидкого прориву «3 коридори»: розташування трьох гравців і передачі м'яча.", "Склади чек-лист «Готовність до гри на вуличному майданчику» з 6 пунктів (інвентар, покриття, одяг, вода)."], "q": ["Чим швидкий прорив відрізняється від позиційного нападу?", "Що таке «коридори» у швидкому прориві?", "Які вимоги висувають до спортивного м'яча і майданчика?", "Чому важлива особиста гігієна під час занять спортом?"]}, {"n": "27", "t": "Довга передача м'яча в баскетболі; вплив фізичних вправ на організм", "g": "Учень знатиме техніку довгої передачі м'яча і розумітиме, як різні види фізичних вправ впливають на організм людини.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Довга передача", "передача м'яча на велику відстань, найчастіше однією рукою від плеча чи з-за голови."], ["Передача від плеча", "передача однією рукою, коли м'яч виштовхується з положення біля плеча."], ["Аеробні вправи", "тривалі вправи помірної інтенсивності, які тренують серце і легені."], ["Силові вправи", "вправи з подоланням опору, що зміцнюють м'язи і кістки."]], "th": [{"h": "Баскетбол. Техніка виконання довгої передачі м'яча", "p": ["Довга передача найчастіше використовується у швидкому прориві, коли партнер уже біжить уперед. Виконують її однією рукою від плеча: м'яч відводять назад до плеча, лікоть позаду, гравець ставить ліву ногу вперед (для правші) і різким рухом руки й тулуба відправляє м'яч. Кисть у кінці «захльостує» м'яч.", "Важливо передавати м'яч на випередження — туди, де партнер буде, а не де він зараз. Передача має бути досить сильною, щоб її не перехопили, але не такою, щоб партнер не зміг її спіймати."], "ul": ["Тримай м'яч обома руками до замаху, щоб не втратити його.", "Передача через увесь майданчик — по дузі, без надто високої траєкторії.", "Перед передачею переконайся, що на шляху м'яча немає суперника.", "Типова помилка — передача «від грудей» на далеку відстань: м'яч летить повільно.", "Тренуй передачу обома руками, правою й лівою."]}, {"h": "Баскетбол 3×3. Особливості впливу різних фізичних вправ на організм", "p": ["Різні вправи впливають по-різному. Аеробні (біг, плавання, тривала гра) тренують серце і легені, підвищують витривалість. Силові — зміцнюють м'язи, зв'язки й кістки. Швидкісні — розвивають нервову систему й реакцію. Вправи на гнучкість зберігають рухливість суглобів, а на рівновагу — тренують вестибулярний апарат.", "Баскетбол 3×3 поєднує все: короткі ривки, стрибки, зміни напрямку, тривалу активність. Тому він розвиває організм різнобічно — але потребує доброї розминки і відновлення."], "ul": ["Аеробні вправи знижують пульс спокою і покращують самопочуття.", "Силові вправи формують поставу й захищають суглоби.", "Стрибкові вправи зміцнюють кістки ніг.", "Гнучкість зменшує ризик розтягнень.", "Найкращий результат дає поєднання різних видів вправ."]}], "f": "Регулярні фізичні вправи покращують кровопостачання мозку, тому вони допомагають краще запам'ятовувати навчальний матеріал.", "pr": ["Склади таблицю «Вид вправ — приклад — на що впливає» щонайменше для 5 видів вправ.", "Виконай удома комплекс вправ для пальців і кистей (стискання тенісного м'ячика, обертання кистей, розведення пальців) — по 20 повторень, щоб підготувати руки до передач."], "q": ["Як виконується довга передача від плеча?", "Що означає передача «на випередження»?", "Як аеробні вправи впливають на організм?", "Чому баскетбол 3×3 розвиває організм різнобічно?"]}, {"n": "28", "t": "Профілактика травм і підбір м'яча від щита; стрибкові вправи й фізичні якості", "g": "Учень знатиме, як уникати травм у баскетболі, як правильно підбирати м'яч після відскоку від щита та якими вправами розвивати стрибучість і гнучкість.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Підбирання (підбір)", "заволодіння м'ячем після невлучного кидка, що відскочив від щита чи кільця."], ["Блокування (бокс-аут)", "дія, коли гравець закриває суперника спиною від кільця, щоб той не дістався до м'яча."], ["Стрибучість", "здатність високо й швидко вистрибувати."], ["Пліометричні вправи", "стрибкові вправи, у яких за приземленням одразу йде новий поштовх."]], "th": [{"h": "Баскетбол. Профілактика травматизму; техніка підбору м'яча від щита", "p": ["Найпоширеніші баскетбольні травми — розтягнення гомілковостопу (приземлення на чужу ногу), вибиті пальці (неправильне ловіння) і забої. Їх профілактика: якісне взуття, розминка, вправи на рівновагу, правильне ловіння м'яча й контрольоване приземлення.", "Підбір: після кидка займай позицію між суперником і кільцем, відставляй таз назад і блокуй суперника спиною. Стежиш за польотом м'яча, стрибаєш у найвищій точці, хапаєш м'яч двома руками й притискаєш до підборіддя, розставивши лікті."], "ul": ["Не стрибай під гравця, що вже в повітрі, — це небезпечно й є порушенням.", "Приземлення на обидві ноги на ширині плечей.", "Після підбору не опускай м'яч низько — його виб'ють.", "Лікті не можна використовувати для ударів — лише для захисту м'яча.", "При травмі пальця — холод, нерухомість і огляд медика."]}, {"h": "Баскетбол 3×3. Стрибкові вправи, гнучкість, розтягування, фізичні якості", "p": ["Стрибкові вправи розвивають стрибучість — важливу якість для підбору, кидків і блок-шотів. Це стрибки зі скакалкою, стрибки на двох ногах на місці, вистрибування вгору з торканням високої позначки. Виконують їх після розминки і в невеликій кількості, бо вони сильно навантажують суглоби.", "Після стрибкових вправ обов'язкові вправи на розтягування м'язів ніг і спини. Гнучкість дає баскетболістові вільніші рухи і допомагає уникати травм."], "ul": ["Стрибкові вправи — на пружному покритті, у кросівках.", "Приземлення м'яке, на передню частину стопи з перекатом.", "Кількість стрибків збільшуй поступово.", "Розтягуй литкові м'язи, задню й передню поверхні стегна.", "Комбінуй стрибки, силові і швидкісні вправи для всебічного розвитку."]}], "f": "У баскетболі статистики окремо рахують підбори в нападі та в захисті, бо обидва дуже впливають на результат матчу.", "pr": ["Виконай удома вправи на рівновагу для профілактики травм гомілковостопу: стійка на одній нозі із заплющеними очима біля опори по 20 секунд, 3 підходи на кожну ногу.", "Опиши письмово техніку підбору м'яча в захисті у 4 кроки."], "q": ["Які травми найчастіше трапляються в баскетболі і як їх уникнути?", "Що таке блокування суперника під час підбору?", "Як правильно утримувати м'яч після підбору?", "Чому стрибкові вправи потребують обережності?"]}, {"n": "29", "t": "Спеціальні якості баскетболіста; амплуа і порушення правил у баскетболі 3×3", "g": "Учень знатиме методи розвитку спеціальних фізичних якостей баскетболіста, амплуа гравців та основні порушення правил і покарання в баскетболі 3×3.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Спеціальні фізичні якості", "якості, які необхідні саме в певному виді спорту: для баскетболу — стрибучість, швидкість реакції, швидкісна витривалість."], ["Амплуа", "ігрова роль гравця в команді."], ["Персональний фол", "порушення правил, пов'язане з неправомірним контактом із суперником."], ["Командний фол", "фол, який зараховується команді загалом і впливає на покарання."]], "th": [{"h": "Баскетбол. Методи і засоби розвитку спеціальних фізичних якостей", "p": ["Баскетболістові потрібні вибуховість (стрибки, ривки), швидкісна витривалість (багато ривків протягом гри), координація і спритність (робота з м'ячем). Засоби — вправи, а методи — способи їх виконання.", "Повторний метод: короткі ривки з відпочинком. Інтервальний: робота й відпочинок чітко визначеної тривалості. Ігровий: розвиток якостей у грі. Коловий: кілька станцій з різними вправами. Найкраще поєднувати методи протягом тижня."], "ul": ["Швидкісна витривалість — серії човникового бігу з короткими паузами.", "Стрибучість — стрибки зі скакалкою, вистрибування.", "Координація — вправи з двома м'ячами, ведення з додатковими завданнями.", "Сила кистей і пальців — вправи з м'ячем, віджимання на пальцях (для підготовлених).", "Діагностувальна робота ГР1 перевіряє знання правил безпеки та базових технічних прийомів."]}, {"h": "Баскетбол 3×3. Амплуа гравців; порушення правил і покарання", "p": ["У баскетболі 3×3 немає жорсткого поділу на позиції, як у 5×5: кожен гравець і веде м'яч, і кидає, і захищається. Проте зазвичай вирізняють гравця, що добре кидає з-за дуги, гравця, який сильний під кільцем, і універсала, що організовує гру.", "Порушення: пробіжка, подвійне ведення, неправомірний контакт (фол), порушення 12 секунд. Командні фоли: з 7-го фолу команди суперник отримує 2 штрафні кидки, а з 10-го — 2 штрафні та володіння м'ячем. Неспортивну поведінку карають окремо."], "ul": ["Фол під час кидка з-під дуги — 1 штрафний, з-за дуги — 2 штрафні.", "Пробіжка — більше двох кроків з м'ячем у руках без ведення.", "Подвійне ведення — повторне ведення після зупинки або ведення двома руками.", "Заміни дозволені під час зупинки гри, за дотиком руки за межами майданчика.", "Поважай рішення суддів і суперника — цього вимагає дух гри."]}], "f": "У баскетболі 3×3 немає персонального вилучення гравця за кількість фолів, як у 5×5, але є покарання для команди.", "pr": ["Склади план тренування для розвитку стрибучості й швидкісної витривалості на 1 тиждень (3 заняття), вказавши вправи й методи.", "Запиши 5 порушень правил у баскетболі 3×3 і покарання за них."], "q": ["Які спеціальні фізичні якості потрібні баскетболістові?", "Чим повторний метод відрізняється від інтервального?", "Які ролі можуть виконувати гравці в баскетболі 3×3?", "Як карають за командні фоли в баскетболі 3×3?"]}, {"n": "30", "t": "Спритність і координація в баскетболі; спеціальні вправи на гнучкість і спритність для 3×3", "g": "Учень знатиме вправи для розвитку спритності, координації й гнучкості та вмітиме добирати їх для самостійних тренувань.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Рухова координація", "узгодженість рухів різних частин тіла під час виконання вправи."], ["Перехресна координація", "одночасна робота протилежних руки й ноги, що розвиває зв'язок півкуль мозку."], ["Човниковий біг", "біг з багаторазовою зміною напрямку на коротких відрізках."], ["Розминка з м'ячем", "розминка, у яку включено вправи з м'ячем для підготовки рук і відчуття м'яча."]], "th": [{"h": "Баскетбол. Розвиток спритності та координаційних здібностей", "p": ["Координацію баскетболіста розвивають вправами, де потрібно робити кілька дій одночасно: вести м'яч і дивитися на сигнал, вести два м'ячі різним ритмом, ловити м'яч після оберту чи хлопка. Чим різноманітніші вправи, тим краще тіло вчиться керувати рухами.", "Спритність — це вміння швидко реагувати на зміну ситуації. У баскетболі вона потрібна постійно: суперник змінив напрям — ти теж; м'яч відскочив несподівано — ти маєш його спіймати."], "ul": ["Ведення м'яча з виконанням завдань за сигналом учителя.", "Передачі в парах з двома м'ячами одночасно.", "Ловіння м'яча після відскоку від стіни під різним кутом.", "Ведення з переведенням між ногами в русі.", "Вправи виконують у середньому темпі, поступово ускладнюючи."]}, {"h": "Баскетбол 3×3. Спеціальні вправи для гнучкості та спритності", "p": ["Гнучкість у баскетболі потрібна для широкої стійки захисника, низького ведення, «дотягування» до м'яча. Особливо важлива рухливість кульшових і гомілковостопних суглобів та плечей.", "Вправи на спритність для 3×3 — човниковий біг, біг з прийомом м'яча після зміни напрямку, захисні пересування приставними кроками зі зміною напрямку за сигналом."], "ul": ["Глибокі випади з поворотом тулуба — для кульшових суглобів.", "Обертання в гомілковостопі та розтягування литок біля стіни.", "Розтягування плечей з м'ячем за головою.", "Захисні пересування «зигзагом» з торканням фішок.", "Розтягування — після основної частини, коли м'язи теплі."]}], "f": "Багато баскетболістів займаються йогою чи стретчингом, щоб зберегти гнучкість і продовжити спортивну кар'єру.", "pr": ["Виконай удома вправу на перехресну координацію: торкання правою рукою лівого коліна і навпаки, 3 серії по 30 секунд; потім ускладни — з поворотом голови.", "Склади комплекс з 5 вправ на гнучкість для баскетболіста і запиши, як виконувати кожну."], "q": ["Які вправи розвивають координацію баскетболіста?", "Чому для баскетболіста важлива гнучкість кульшових суглобів?", "Що таке човниковий біг і яку якість він розвиває?", "Коли краще виконувати вправи на розтягування?"]}, {"n": "31", "t": "Комбінації в нападі та прориві; загальна і спеціальна фізична підготовка", "g": "Учень знатиме базові комбінації взаємодії гравців у нападі та розумітиме відмінність загальної і спеціальної фізичної підготовки баскетболіста.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Заслін", "дія, коли гравець стає на шляху захисника, щоб звільнити партнера."], ["Пік-н-рол", "комбінація, у якій гравець ставить заслін партнерові з м'ячем, а потім відкривається до кільця."], ["Загальна фізична підготовка (ЗФП)", "розвиток усіх фізичних якостей для зміцнення здоров'я і загальної працездатності."], ["Спеціальна фізична підготовка (СФП)", "розвиток якостей, специфічних для певного виду спорту."]], "th": [{"h": "Баскетбол. Комбінації взаємодії гравців у нападі та прориві", "p": ["Найпростіші комбінації: «передай і йди» (віддав пас — біжи до кільця за поверненням), заслін (стаєш на шляху захисника партнера), пік-н-рол (заслін для гравця з м'ячем і відкривання до кільця). У швидкому прориві — гра 2 проти 1: гравець з м'ячем іде до кільця, змушуючи захисника вибрати, і віддає пас вільному партнерові.", "Комбінація працює, коли всі гравці розуміють свою роль і діють вчасно. Тому на тренуваннях її спочатку повторюють без опору, потім — з пасивним захисником, і лише потім — у грі."], "ul": ["Заслін ставлять нерухомо, руки притиснуті до тіла — інакше фол.", "Гравець, якому ставлять заслін, проходить впритул до партнера.", "«Передай і йди» — простий, але дуже ефективний прийом.", "У прориві 2 проти 1 — рішення приймаємо, коли захисник вийшов на ведучого.", "Комунікація: гравці називають комбінацію голосом або жестом."]}, {"h": "Баскетбол 3×3. Загальна та спеціальна фізична підготовка баскетболіста", "p": ["ЗФП — фундамент: біг, силові вправи з власною вагою, вправи на гнучкість, плавання. Вона зміцнює здоров'я і готує тіло до навантажень. СФП — надбудова: вистрибування, човниковий біг, захисні пересування, вправи з м'ячем на швидкість.", "Для юного спортсмена ЗФП особливо важлива: без міцної основи спеціальні навантаження призводять до перевтоми й травм. Баскетбол 3×3 особливо вимогливий до швидкісної витривалості, бо гра йде без пауз."], "ul": ["ЗФП: присідання, віддискання, планка, кросовий біг.", "СФП: стрибки з торканням щита, ривки з веденням, захисна стійка на час.", "Співвідношення ЗФП і СФП залежить від віку та рівня підготовки.", "Відпочинок і сон — частина підготовки, а не втрачений час.", "Самоконтроль: стеж за пульсом і самопочуттям."]}], "f": "Комбінацію пік-н-рол використовують команди від шкільного рівня до найсильніших професійних ліг — бо вона проста й ефективна.", "pr": ["Намалюй схему комбінації «передай і йди» або пік-н-рол з позначеннями гравців, руху і передач.", "Виконай удома мінікомплекс ЗФП: 15 присідань, 10 віджимань (можна від стіни чи з колін), планка 30 секунд — 2 кола."], "q": ["Як правильно ставити заслін?", "У чому суть комбінації «передай і йди»?", "Чим ЗФП відрізняється від СФП?", "Чому юним спортсменам особливо важлива ЗФП?"]}, {"n": "32", "t": "Вправи на спритність і координацію; навчальна гра в баскетбол 3×3 за спрощеними правилами", "g": "Учень удосконалить уявлення про вправи на спритність і координацію та знатиме, як організувати навчальну гру 3×3 за спрощеними правилами.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Спрощені правила", "правила, адаптовані для навчальної гри, щоб усі учасники могли грати безпечно й з користю."], ["Чек-бол", "передача м'яча між захисником і нападником за дугою на початку володіння в баскетболі 3×3."], ["Виведення м'яча за дугу", "обов'язкова дія після підбору чи перехоплення в 3×3, перш ніж атакувати кільце."], ["Ігрова дисципліна", "дотримання правил гри, тактичних домовленостей і поваги до інших."]], "th": [{"h": "Баскетбол. Вправи для розвитку спритності та координаційних здібностей", "p": ["Продовжуємо розвиток координації. Корисні вправи: ведення м'яча з одночасним підкиданням тенісного м'ячика, ведення по лінії з розворотами, передачі об стіну зі зміною рук. Ускладнюючи вправи, ми змушуємо нервову систему адаптуватися — так формується спритність.", "Координаційні вправи вимагають концентрації, тому їх виконують, поки ти не втомився, і невеликими серіями."], "ul": ["Починай із простого, ускладнюй крок за кроком.", "Якість важливіша за швидкість.", "Чергуй вправи для правої й лівої руки.", "Роби короткі паузи, щоб зберегти концентрацію.", "Перевіряй свій прогрес: рахуй вдалі повторення."]}, {"h": "Баскетбол 3×3. Навчальна гра за спрощеними правилами", "p": ["Навчальна гра — можливість застосувати все вивчене. Спрощені правила: гра на одне кільце, до 11 або 21 очка, без суворого контролю 12 секунд, вільні заміни. Кожне нове володіння починається з чек-болу за дугою.", "Після підбору чи перехоплення м'яча захисник має вивести його за дугу (обома ногами), і лише потім атакувати. Після забитого м'яча гру продовжує команда, що захищалася, — передачею або веденням з-під кільця за дугу."], "ul": ["Перед грою домовтеся про правила й рахунок.", "Фоли називають самі гравці, чесно і без суперечок.", "Кожен гравець має торкнутися м'яча в атаці — це правило навчальної гри.", "Змінюйтеся регулярно, щоб усі зіграли.", "Після гри — потиск рук і коротке обговорення."]}], "f": "У баскетболі 3×3 часто грають без тренера на лаві — гравці самі ухвалюють тактичні рішення під час матчу.", "pr": ["Запиши спрощені правила баскетболу 3×3 для гри з друзями на вуличному майданчику (7–8 пунктів).", "Виконай удома вправу на координацію: підкидай і лови м'який м'яч чи згорнуті шкарпетки по черзі правою і лівою рукою, 3 серії по 30 секунд."], "q": ["Що таке чек-бол?", "Що має зробити команда після підбору м'яча в захисті в баскетболі 3×3?", "Чим навчальна гра відрізняється від офіційної?", "Як розвивається спритність під час ускладнення вправ?"]}, {"n": "33", "t": "Прийоми оволодіння м'ячем: перехоплення, вибивання, виривання; швидкісно-силові вправи", "g": "Учень знатиме техніку перехоплення, вибивання й виривання м'яча та вправи для розвитку швидкісно-силових якостей.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Вибивання м'яча", "захисний прийом, коли гравець коротким рухом кисті вибиває м'яч у суперника під час ведення."], ["Виривання м'яча", "захисний прийом, коли гравець обома руками різко забирає м'яч, який суперник тримає в руках."], ["Перехоплення передачі", "заволодіння м'ячем на шляху його польоту від одного суперника до іншого."], ["Вибухова сила", "здатність проявити максимальне зусилля за дуже короткий час."]], "th": [{"h": "Баскетбол. Техніка прийомів оволодіння м'ячем", "p": ["Перехоплення: захисник стежить за гравцем і м'ячем одночасно, передбачає передачу і ривком виходить на лінію польоту м'яча. Вибивання: виконують коротким рухом кисті знизу вгору, коли м'яч відскакує від підлоги, і не торкаючись руки суперника. Виривання: обидві руки захоплюють м'яч, і різким поворотом тулуба гравець забирає його на себе.", "Усі ці прийоми мають бути чистими: удар по руці суперника, а не по м'ячу, — це фол. Невдала спроба часто залишає суперника вільним, тому важливо обирати момент."], "ul": ["Не тягнися за м'ячем, втрачаючи рівновагу й позицію.", "Вибивай м'яч рукою, ближчою до м'яча.", "Виривати можна лише м'яч, а не руки суперника.", "Перехоплення вдається, коли передача повільна або передбачувана.", "Невдала спроба — швидко повертайся в захисну позицію."]}, {"h": "Баскетбол 3×3. Вправи для розвитку швидкісно-силових якостей", "p": ["Швидкісно-силові якості — це поєднання сили й швидкості: вистрибування, швидкий старт, стрімкий прохід до кільця. Їх розвивають стрибками, короткими прискореннями, кидками набивного м'яча, ривками з місця.", "Головне правило: вправи виконують з максимальною швидкістю, але невеликою кількістю повторень і з повним відпочинком. Втома знижує ефект і підвищує ризик травм."], "ul": ["Вистрибування вгору з торканням позначки — серії по 5–6 разів.", "Ривки на 5–10 м з різних вихідних положень.", "Кидки набивного м'яча від грудей у стіну.", "Стрибки через лінію вперед-назад і вбік.", "Відпочинок між серіями — до повного відновлення дихання."]}], "f": "У баскетбольній статистиці перехоплення та блок-шоти вважають одними з найважливіших показників гри в захисті.", "pr": ["Опиши письмово відмінності між перехопленням, вибиванням і вириванням м'яча (коли застосовується, як виконується).", "Виконай удома 3 серії по 8 підйомів на носки на сходинці (тримаючись за поручень) для розвитку сили литкових м'язів."], "q": ["Як виконується вибивання м'яча під час ведення?", "Чим виривання відрізняється від вибивання?", "Чому вправи на швидкісно-силові якості виконують з повним відпочинком?", "Коли перехоплення найчастіше вдається?"]}, {"n": "34", "t": "Вправи проти плоскостопості та для емоційного розвантаження; поєднання способів пересування", "g": "Учень знатиме вправи для профілактики плоскостопості та емоційного розвантаження і розумітиме, як поєднувати способи пересування в баскетболі 3×3.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Плоскостопість", "зниження склепіння стопи, через яке погіршується амортизація під час ходьби й бігу."], ["Склепіння стопи", "природний вигин стопи, що пом'якшує удари під час руху."], ["Емоційне розвантаження", "зняття нервового напруження за допомогою руху, дихальних вправ чи гри."], ["Приставний крок", "пересування вбік, коли одна нога приставляється до іншої без схрещування."]], "th": [{"h": "Баскетбол. Вправи проти плоскостопості та для емоційного розвантаження", "p": ["Баскетболісти багато стрибають і бігають, тому здорова стопа дуже важлива. Плоскостопість призводить до швидкої втоми ніг, болю в колінах і спині. Профілактика: ходьба на носках, п'ятах, зовнішньому краї стопи, захоплення пальцями дрібних предметів, катання м'ячика стопою.", "Емоційне розвантаження допомагає зняти стрес після навчання чи напруженої гри: спокійна гра з м'ячем, дихальні вправи, легка розтяжка під музику. Баскетбол сам по собі — чудовий спосіб «перезавантажитися»."], "ul": ["Ходьба на носках і п'ятах — по 30 секунд.", "Захоплення пальцями ніг рушника чи олівця.", "Катання тенісного м'ячика стопою.", "Глибоке дихання: вдих на 4 рахунки, видих на 6.", "Гра «влучи в кошик» у спокійному темпі для настрою."]}, {"h": "Баскетбол 3×3. Поєднання способів пересування", "p": ["Баскетболіст постійно змінює способи пересування: біг лицем уперед, спиною вперед, приставні кроки в захисті, ривки, зупинки стрибком і двома кроками, повороти на опорній нозі. Майстерність — у плавному переході від одного способу до іншого.", "У 3×3 майданчик менший, тому пересування коротші й різкіші. Захисник пересувається приставними кроками, не схрещуючи ноги, нападник — поєднує прискорення і різкі зупинки, щоб звільнитися."], "ul": ["Захисна стійка: ноги ширше плечей, коліна зігнуті, спина рівна.", "Приставні кроки — без підстрибування, ноги не схрещуються.", "Зупинка стрибком — приземлення на обидві ноги одночасно.", "Поворот — на передній частині опорної стопи, не відриваючи її.", "Зміна способу пересування — без втрати рівноваги."]}], "f": "Склепіння стопи формується протягом дитинства і підліткового віку, тому вправи для стоп у цей час особливо ефективні.", "pr": ["Виконай удома комплекс з 5 вправ проти плоскостопості (ходьба на носках, п'ятах, зовнішньому краї стопи, захоплення рушника пальцями, катання м'ячика) — по 30–40 секунд кожна.", "Запиши 3 способи емоційного розвантаження, які тобі допомагають, і поясни чому."], "q": ["Чим небезпечна плоскостопість для баскетболіста?", "Які вправи допомагають запобігти плоскостопості?", "Як правильно пересуватися в захисній стійці?", "Які способи зупинки існують у баскетболі?"]}, {"n": "35", "t": "Організація позиційного нападу; пересування гравців без м'яча в баскетболі 3×3", "g": "Учень знатиме принципи побудови позиційного нападу та способи пересування без м'яча для отримання передачі.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Розстановка", "розташування гравців на майданчику перед початком атакувальної комбінації."], ["Відкривання", "рух гравця без м'яча, щоб звільнитися від захисника й отримати передачу."], ["Бекдор", "ривок нападника за спину захиснику до кільця, коли той надто активно закриває передачу."], ["Спейсинг", "розподіл гравців на майданчику з достатньою відстанню між ними."]], "th": [{"h": "Баскетбол. Організація позиційного нападу", "p": ["Позиційний напад починається з розстановки: розігруючий з м'ячем у центрі, інші гравці — на флангах і біля кільця. Далі — рух гравців, передачі, заслони, щоб створити вільну позицію для кидка. Атака не повинна бути «стоянням»: якщо всі стоять, захистові легко.", "Хороший позиційний напад має кілька варіантів продовження: якщо перший шанс не вийшов, команда переходить до наступного, не втрачаючи м'яча і часу."], "ul": ["Тримайте дистанцію: двоє гравців поряд — легка робота для одного захисника.", "Рух м'яча швидший за ведення — передавайте частіше.", "Кидок — з найкращої позиції, а не першої можливої.", "Слідкуйте за часом атаки (24 секунди).", "Після кидка — частина гравців на підбір, інші — назад у захист."]}, {"h": "Баскетбол 3×3. Пересування гравців без м'яча", "p": ["Гравці без м'яча визначають успіх атаки. Відкривання: зміни темп і напрям, «відведи» захисника кроком в один бік і рвонися в інший. Бекдор: якщо захисник закриває передачу надто близько, біжи за його спину до кільця.", "У 3×3 гравців лише троє, тому простір великий. Важливо не скупчуватися біля м'яча, а розходитися по майданчику — так легше атакувати один на один і передавати м'яч."], "ul": ["Рухайся постійно, але з метою.", "Показуй рукою, куди хочеш отримати м'яч.", "Після передачі не стій — роби рух.", "Бекдор — найкраща відповідь на агресивний захист.", "Спілкуйся з партнерами голосом."]}], "f": "Тренери часто кажуть, що м'яч не втомлюється, тому швидкі передачі ефективніші за довге ведення.", "pr": ["Намалюй схему розстановки п'яти гравців у позиційному нападі та підпиши їхні позиції.", "Опиши письмово, як виконати бекдор, і в якій ситуації цей прийом найефективніший."], "q": ["З чого починається позиційний напад?", "Чому важливо зберігати відстань між гравцями в атаці?", "Що таке бекдор?", "Як гравець без м'яча може звільнитися від захисника?"]}, {"n": "36", "t": "Підбирання м'яча від щита: закріплення; кидки й передачі в колонах, парах, трійках", "g": "Учень закріпить знання про підбирання м'яча від щита і знатиме, як відпрацьовувати кидки й передачі в групових вправах.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Підбір у нападі", "заволодіння м'ячем, що відскочив, командою, яка атакувала, для повторної атаки."], ["Добивання", "кидок після підбору одразу біля кільця."], ["Передача від грудей", "передача двома руками, коли м'яч виштовхується від грудей прямо партнерові."], ["Передача з відскоком від підлоги", "передача, при якій м'яч ударяється об підлогу приблизно на двох третинах відстані до партнера."]], "th": [{"h": "Баскетбол. Підбирання м'яча, що відскочив від щита", "p": ["Підбір у захисті починається з блокування суперника, а в нападі — з уміння обійти блок: швидкий крок убік, рух рукою, обман. Гравець має передбачити, куди відскочить м'яч: після далекого кидка — далеко від кільця, після близького — поруч.", "Після підбору в нападі можна виконати добивання — кидок одразу біля кільця, або віддати м'яч назад для нової атаки."], "ul": ["Підбір починається в момент кидка, а не тоді, коли м'яч уже летить від кільця.", "Стрибай якомога вище і хапай м'яч двома руками.", "У нападі не штовхай захисника — це фол.", "Не опускай м'яч після підбору нижче рівня грудей.", "Після підбору в захисті — швидка перша передача."]}, {"h": "Баскетбол 3×3. Кидки й передачі в колонах, парах, трійках", "p": ["У колонах гравці по черзі виконують кидок після ведення чи передачі. У парах відпрацьовують передачі від грудей, з відскоком, над головою, а також кидок після передачі. У трійках — передачі в русі, «вісімка» з виходом на кидок.", "Ці вправи вчать точності й узгодженості: передача має бути зручною для ловіння, а кидок — виконаним з правильної позиції."], "ul": ["Передача від грудей: пальці розведені, кисті розвертаються назовні.", "Передача з відскоком: м'яч ударяється ближче до партнера, ніж до тебе.", "Кидок: лікоть під м'ячем, кисть «захльостує» м'яч.", "Ловлячи м'яч, виходь йому назустріч.", "У трійках стеж, щоб усі були задіяні рівномірно."]}], "f": "Вправу «вісімка» у трійках баскетболісти виконують, бігаючи «плетінням» — гравці постійно міняються місцями позаду того, кому передали м'яч.", "pr": ["Намалюй схему вправи «передачі в трійках» з рухом гравців і м'яча.", "Виконай удома імітацію кидка м'яча однією рукою від плеча (без м'яча або з м'якою іграшкою в руці, без кидання) — 3 серії по 15 разів, контролюючи положення ліктя і кисті."], "q": ["Що таке добивання?", "Чим підбір у нападі відрізняється від підбору в захисті?", "Куди має вдаритися м'яч під час передачі з відскоком?", "Як правильно тримати лікоть під час кидка?"]}, {"n": "37", "t": "Розвиток спритності й координації; прискорення з різних положень і човниковий біг 4×10 м", "g": "Учень знатиме вправи на спритність і координацію та техніку виконання човникового бігу 4×10 м і прискорень з різних вихідних положень.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Човниковий біг 4×10 м", "тест на спритність: чотири відрізки по 10 м зі зміною напрямку на кожному кінці."], ["Розворот", "зміна напрямку руху на 180°."], ["Вихідне положення", "положення тіла перед початком вправи: стоячи, сидячи, лежачи тощо."], ["Прискорення", "збільшення швидкості бігу на короткому відрізку."]], "th": [{"h": "Баскетбол. Розвиток спритності та координаційних здібностей", "p": ["Спритність баскетболіста — швидкий розворот, зупинка, ухилення від захисника. Вправи: ведення м'яча з розворотами на сигнал, естафети з перешкодами, обведення фішок, гра «квач» з веденням м'яча.", "Координаційні вправи ефективні, коли вони різноманітні та трохи незвичні: ведення не провідною рукою, ведення з заплющеними очима (коротко й безпечно), ловіння м'яча, що летить несподівано."], "ul": ["Змінюй вправи — тіло адаптується до одноманітності.", "Додавай елемент реакції на сигнал.", "Тримай баланс: низький центр ваги у розворотах.", "Включай роботу «слабкою» рукою.", "Відпочинок — коли якість рухів знижується."]}, {"h": "Баскетбол 3×3. Прискорення з різних вихідних положень; човниковий біг 4×10 м", "p": ["Прискорення з різних положень (сидячи, лежачи, спиною вперед, з колін) розвивають швидкість реакції і стартову силу — так, як це буває в грі, коли потрібно стартувати з незручної позиції.", "Човниковий біг 4×10 м — контрольний тест на спритність. Як виконувати: високий старт; на кожному кінці торкнися лінії (чи візьми/поклади предмет) рукою; розворот — низько, з опорою на зовнішню ногу; після останнього розвороту біжи «крізь фініш». Оцінюй результат порівнянням із власними попередніми спробами."], "ul": ["Розворот: знизь центр ваги, поверни корпус, відштовхнися.", "Не стрибай на лінію — торкайся рукою і одразу розвертайся.", "Перед тестом — розминка з кількома розворотами.", "Не сповільнюйся перед фінішем.", "Тестування проводять на неслизькому покритті."]}], "f": "Човниковий біг використовують у тестуваннях багатьох видів спорту, бо він перевіряє не лише швидкість, а й уміння швидко гальмувати.", "pr": ["Запиши алгоритм виконання човникового бігу 4×10 м у 5 кроків з порадами, як покращити результат.", "Виконай удома вправу на реакцію з членом родини: за плеском у долоні швидко сідай і встань (без стрибків), 3 серії по 10 сигналів."], "q": ["Як правильно виконувати розворот у човниковому бігу?", "Навіщо тренувати прискорення з різних вихідних положень?", "Які вправи розвивають спритність баскетболіста?", "Як оцінити свій результат у тесті з човникового бігу?"]}, {"n": "38", "t": "Жонглювання баскетбольним м'ячем; серійні стрибки з діставанням високих предметів", "g": "Учень знатиме вправи для жонглювання баскетбольним м'ячем і техніку серійних стрибків поштовхом однієї та двох ніг.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Жонглювання баскетбольним м'ячем", "вправи для розвитку «відчуття м'яча»: обертання навколо тулуба, перекидання з руки в руку, підкидання."], ["Хват м'яча", "спосіб утримання м'яча пальцями, без торкання долонею."], ["Серійні стрибки", "стрибки, що виконуються один за одним без пауз."], ["Поштовхова нога", "нога, якою відштовхуються від опори під час стрибка."]], "th": [{"h": "Баскетбол. Жонглювання баскетбольним м'ячем", "p": ["Жонглювання розвиває «відчуття м'яча» і впевненість у ньому. Вправи: обертання м'яча навколо голови, тулуба, ніг; «вісімка» між ногами; перекидання м'яча з руки в руку кінчиками пальців; підкидання й ловіння після хлопка; обертання м'яча на пальці.", "Добрий баскетболіст контролює м'яч пальцями, а не долонею. Жонглювання тренує саме це: точне відчуття м'яча без погляду на нього."], "ul": ["Тримай м'яч подушечками пальців, долоня не торкається м'яча.", "Спочатку повільно — потім прискорюй.", "Дивись уперед, а не на м'яч.", "Чергуй напрямок обертання.", "Кілька хвилин жонглювання щодня — швидкий прогрес."]}, {"h": "Баскетбол 3×3. Серійні стрибки поштовхом однієї та двох ніг", "p": ["Серійні стрибки — стрибки один за одним із діставанням високої позначки (щита, підвішеної стрічки). Поштовх двома ногами застосовують для підбору й кидка в стрибку, однією — для проходу до кільця після подвійного кроку.", "Головне — швидкий і пружний поштовх: що менше часу на опорі, то краще. Але кількість стрибків має бути помірною, щоб не перевантажити коліна й гомілковостопи."], "ul": ["Поштовх двома ногами: мах руками вгору, ноги розпрямляються разом.", "Поштовх однією ногою: махова нога різко піднімається коліном угору.", "Приземлення на передню частину стопи з м'яким згинанням колін.", "Серії — по 5–8 стрибків, відпочинок між ними.", "Стрибки — лише на пружному покритті та у кросівках."]}], "f": "Обертання м'яча на пальці — популярний трюк, який вимагає точного відчуття центру м'яча і рівномірного обертання.", "pr": ["Якщо є м'яч і безпечне місце, виконай вправи на жонглювання (обертання навколо тулуба й ніг, «вісімка» між ногами) по 1 хвилині; якщо м'яча немає — опиши кожну вправу в зошиті.", "Опиши відмінність техніки стрибка поштовхом однієї та двох ніг і наведи ігрові ситуації для кожного."], "q": ["Якими частинами руки потрібно контролювати м'яч?", "Які вправи на жонглювання ти знаєш?", "У яких ігрових ситуаціях використовують поштовх двома ногами, а в яких — однією?", "Як правильно приземлятися після стрибка?"]}, {"n": "39", "t": "Варіанти швидкого прориву; ведення з опором захисника і техніка штрафного кидка", "g": "Учень знатиме варіанти швидкого прориву, техніку ведення м'яча під опором захисника і штрафного кидка.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Чисельна перевага", "ситуація, коли в атаці більше гравців, ніж у захисті на цій ділянці."], ["Штрафний кидок", "безперешкодний кидок з лінії штрафного кидка, що приносить 1 очко."], ["Рутина штрафного кидка", "однакова послідовність дій перед кожним штрафним, що допомагає зосередитися."], ["Захист м'яча тілом", "ведення м'яча з боку, дальнього від захисника, з корпусом між ними."]], "th": [{"h": "Баскетбол. Варіанти швидкого прориву", "p": ["Прорив буває одиночним (гравець після перехоплення сам іде до кільця), групою з двох (2 проти 1) чи трьох гравців (3 проти 2). Найчастіше прорив розвивається після підбору в захисті: швидка перша передача на фланг, ведення по центру, двоє партнерів біжать краями.", "Ключ до успіху — швидкість переходу з захисту в атаку й правильні рішення: якщо чисельної переваги вже немає, краще зупинитися й почати позиційний напад."], "ul": ["Одиночний прорив — швидке ведення і кидок з-під кільця.", "2 проти 1 — змуси захисника вибрати, кого закривати.", "3 проти 2 — ведучий по центру, двоє по флангах.", "Не затримуй м'яч — передача швидша за ведення.", "Завершуй атаку кидком з близької відстані."]}, {"h": "Баскетбол 3×3. Ведення з опором захисника; штрафний кидок", "p": ["Під опором захисника м'яч ведуть низько, рукою, дальньою від захисника, а корпус і плече закривають м'яч. Дивись не на м'яч, а на майданчик. Різка зміна темпу й руки допомагає пройти захисника.", "Штрафний кидок — подарунок, який треба реалізувати. Стань ногами на ширині плечей перед лінією, зроби свою рутину (кілька ударів м'ячем, вдих), зігни ноги, кидай однією рукою з супроводом кисті. Не заступай лінію до моменту, коли м'яч торкнеться кільця."], "ul": ["Під опором — м'яч не вище коліна.", "Вільна рука захищає м'яч, але не відштовхує суперника.", "Штрафний: кидок за плавною дугою, погляд — на кільце.", "Кожного разу виконуй однакову рутину.", "Тренуй штрафні в стані втоми — так, як у грі."]}], "f": "Багато професійних баскетболістів щодня кидають сотні штрафних кидків, бо в напруженому матчі саме вони часто вирішують результат.", "pr": ["Намалюй схему прориву 3 проти 2 з позначенням гравців, ведення і передач.", "Розроби і запиши власну «рутину» штрафного кидка (4–5 дій) та поясни, як вона допомагає зосередитися."], "q": ["Які варіанти швидкого прориву ти знаєш?", "Як захистити м'яч під час ведення під опором?", "Яка техніка виконання штрафного кидка?", "Навіщо баскетболістам рутина перед штрафним кидком?"]}, {"n": "40", "t": "Довга передача: закріплення; контроль фізичного навантаження і самопочуття", "g": "Учень удосконалить уявлення про довгу передачу м'яча та вмітиме контролювати фізичне навантаження за пульсом і самопочуттям.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Передача з-за голови", "передача м'яча двома руками з положення над головою, зручна для великої відстані і над захисником."], ["Пульс", "поштовхоподібні коливання стінок артерій, що відповідають скороченням серця."], ["Самоконтроль", "регулярне спостереження людини за станом свого здоров'я і реакцією на навантаження."], ["Перевтома", "стан організму, коли навантаження перевищують можливості відновлення."]], "th": [{"h": "Баскетбол. Техніка довгої передачі: закріплення", "p": ["Окрім передачі однією рукою від плеча, на великі відстані використовують передачу двома руками з-за голови: руки з м'ячем над головою, лікті злегка зігнуті, різкий рух передпліччями й кистями вперед. Вона зручна після підбору, коли потрібно швидко почати прорив.", "На закріпленні звертаємо увагу на точність: м'яч має прилетіти партнерові на рівні грудей і на крок попереду, щоб він не гальмував."], "ul": ["Довга передача — після оцінки ситуації, а не «наосліп».", "Траєкторія — пряма або злегка дугоподібна.", "Кистьовий рух завершує передачу.", "Партнер біжить, тож передача — на випередження.", "Тренуй передачу з обох рук і різних позицій."]}, {"h": "Баскетбол 3×3. Контроль за навантаженням і самопочуттям", "p": ["Самоконтроль — звичка кожного спортсмена. Пульс вимірюють на зап'ясті або шиї: рахують удари за 10 чи 15 секунд і множать на 6 або 4. До навантаження — пульс спокою, під час — інтенсивність, після — швидкість відновлення: що швидше пульс повертається до норми, то краще тренованість.", "Самопочуття оцінюють за простими ознаками: настрій, сон, апетит, бажання тренуватися, втома. Якщо після занять тривалий час болить голова, порушено сон, немає апетиту — навантаження завелике."], "ul": ["Пульс міряй у спокої зранку для порівняння.", "Під час інтенсивної гри пульс значно вищий, ніж у спокої, — це нормально.", "Через кілька хвилин відпочинку пульс має помітно знизитися.", "Запаморочення, біль у грудях, нудота — сигнал негайно зупинитися.", "Веди щоденник самоконтролю: дата, вправи, пульс, самопочуття."]}], "f": "Ведення щоденника самоконтролю допомагає помітити перевтому раніше, ніж вона призведе до хвороби чи травми.", "pr": ["Почни вести щоденник самоконтролю: протягом тижня записуй пульс спокою зранку, години сну, самопочуття за 5-бальною шкалою.", "Виміряй пульс до і через 1 та 3 хвилини після 20 присідань; запиши результати і зроби висновок про відновлення."], "q": ["Як виконується передача двома руками з-за голови?", "Як правильно виміряти пульс?", "Про що свідчить швидке відновлення пульсу після навантаження?", "Які ознаки вказують на перевтому?"]}, {"n": "41", "t": "Техніка оволодіння й володіння м'ячем; зони інтенсивності та оцінка навантаження", "g": "Учень знатиме прийоми оволодіння м'ячем і утримання його під тиском та вмітиме оцінювати інтенсивність навантаження за пульсом і відчуттями.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Ловіння м'яча", "прийом, яким гравець оволодіває м'ячем після передачі чи відскоку, амортизуючи його руками."], ["Потрійна загроза", "стійка гравця з м'ячем, з якої він може одразу кинути, передати або почати ведення."], ["Інтенсивність навантаження", "ступінь напруження організму під час виконання вправи."], ["Шкала суб'єктивного навантаження", "оцінювання важкості роботи за власними відчуттями, наприклад від 1 до 10."]], "th": [{"h": "Баскетбол. Техніка оволодіння і володіння м'ячем", "p": ["Оволодіння м'ячем — це ловіння передачі, підбір чи підхоплення м'яча, що котиться. Ловлячи, витягни руки назустріч, пальці розведені, і в момент дотику підтягни м'яч до грудей — так гаситься удар. Низькі м'ячі ловлять з нахилом і згинанням ніг.", "Володіння м'ячем — уміння утримати його під тиском захисника. Після ловіння займи стійку «потрійної загрози»: м'яч біля стегна з боку сильної руки, ноги зігнуті. З неї можна кинути, передати чи пройти, і захисникові важко вгадати твій намір."], "ul": ["Виходь назустріч передачі, щоб її не перехопили.", "Після ловіння — одразу погляд на кільце.", "Не тримай м'яч на витягнутих руках — його легко вибити.", "Розворот на опорній нозі допомагає сховати м'яч.", "У «потрійній загрозі» не поспішай із веденням — спочатку оціни ситуацію."]}, {"h": "Баскетбол 3×3. Контроль за фізичним навантаженням: зони інтенсивності", "p": ["Навантаження умовно поділяють на зони: низька (легка розминка, ходьба — можна вільно говорити), помірна (рівномірний біг — говориш короткими фразами), висока (інтенсивна гра — говорити важко), максимальна (ривки — говорити неможливо). Для кожної зони свої завдання: відновлення, витривалість, швидкість.", "Крім пульсу, корисно оцінювати навантаження за шкалою від 1 до 10: 1–3 — легко, 4–6 — помірно, 7–8 — важко, 9–10 — максимально. Порівнюй, як ти оцінюєш те саме тренування через тиждень, — це показник прогресу."], "ul": ["Розминка — низька зона, основна частина — помірна та висока, заминка — знову низька.", "«Тест розмови»: здатність говорити показує інтенсивність.", "Максимальну зону використовують коротко, з паузами.", "Те саме навантаження з часом здається легшим — це ознака тренованості.", "Хвороба, недосипання, стрес — привід знизити навантаження."]}], "f": "«Тест розмови» — простий спосіб оцінити інтенсивність навантаження без жодних приладів.", "pr": ["Після будь-якої фізичної активності протягом тижня (прогулянка, розминка, заняття) оціни її за шкалою від 1 до 10 і запиши в щоденник самоконтролю.", "Опиши письмово стійку «потрійної загрози» і поясни, чому вона ефективна."], "q": ["Як правильно ловити м'яч, щоб погасити його швидкість?", "Що таке стійка «потрійної загрози»?", "Які зони інтенсивності навантаження ти знаєш?", "Як за допомогою «тесту розмови» визначити інтенсивність?"]}, {"n": "42", "t": "Підбирання м'яча: тактика боротьби під щитом; обманні рухи (фінти) в баскетболі 3×3", "g": "Учень знатиме тактичні аспекти боротьби за підбір і техніку основних фінтів у баскетболі.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Боротьба під щитом", "змагання гравців за позицію і м'яч поблизу кільця після кидка."], ["Фінт кидком", "імітація кидка, щоб змусити захисника вистрибнути, а потім пройти повз нього."], ["Фінт передачею", "імітація передачі в один бік з наступною дією в інший."], ["Кросовер", "швидке переведення м'яча з руки в руку перед собою під час ведення для зміни напрямку."]], "th": [{"h": "Баскетбол. Підбір м'яча, що відскочив від щита: тактика", "p": ["Підбір — це передусім позиція й бажання. Після кидка кожен захисник знаходить свого суперника і блокує його. Нападники намагаються обійти блок з боку, де захисник найменше чекає. Команда, що добре бореться під щитом, отримує більше володінь — а отже, більше шансів набрати очки.", "У 3×3 особливо важливий підбір у нападі: кожен підбір — це нова атака з близької відстані, а підбір у захисті потрібно ще й вивести за дугу."], "ul": ["Блокуй суперника, а потім іди за м'ячем.", "Слідкуй за траєкторією кидка, щоб передбачити відскок.", "Борися за підбір до кінця, навіть якщо суперник вищий.", "Не залазь на спину суперникові — це фол.", "Хапай м'яч обома руками в найвищій точці."]}, {"h": "Баскетбол 3×3. Обманні рухи (фінти)", "p": ["Фінти — важливий засіб в атаці один на один, яка у 3×3 трапляється дуже часто. Фінт кидком: ти піднімаєш м'яч, ніби кидаєш, захисник вистрибує — ти проходиш. Фінт передачею: погляд і рух рук в один бік — передача або прохід в інший. Кросовер під час ведення змінює напрям руху.", "Фінт працює, коли він правдоподібний і коли після нього швидко відбувається реальна дія. Не роби фінтів заради фінтів — використовуй їх, щоб створити перевагу."], "ul": ["Фінт кидком — повний рух очима й руками, але м'яч не випускай.", "Після фінту — різкий перший крок.", "Кросовер — низько, біля коліна, щоб захисник не дістав.", "Опорна нога під час фінту без ведення не відривається — інакше пробіжка.", "Поєднуй фінти: кидок — передача — прохід."]}], "f": "Кросовер — одна з найпопулярніших технік вуличного баскетболу, і саме у 3×3 вона дуже часто вирішує долю атаки один на один.", "pr": ["Опиши в зошиті 3 фінти в баскетболі і ситуації, у яких кожен з них найкращий.", "Виконай удома імітацію фінту кидком без м'яча (піднімання рук, погляд на «кільце», крок у бік) — 3 серії по 10 разів, стежачи, щоб опорна нога не відривалася."], "q": ["Чому команда, яка краще підбирає м'ячі, має перевагу?", "Як виконується фінт кидком?", "Що таке кросовер?", "Як уникнути пробіжки під час фінту без ведення?"]}, {"n": "43", "t": "Навчальна гра в баскетбол; асинхронне ведення м'яча без зорового контролю", "g": "Учень знатиме, як діяти в навчальній грі за правилами баскетболу, та вправи для асинхронного ведення двох м'ячів без зорового контролю.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Навчальна гра", "гра за офіційними чи спрощеними правилами, мета якої — закріпити техніку й тактику."], ["Асинхронне ведення", "ведення двох м'ячів, коли вони ударяються об підлогу по черзі, а не одночасно."], ["Ведення без зорового контролю", "ведення м'яча, не дивлячись на нього, з опорою на відчуття рук."], ["Правило трьох секунд", "заборона нападникові перебувати в обмеженій зоні суперника понад 3 секунди поспіль у баскетболі 5×5."]], "th": [{"h": "Баскетбол. Навчальна гра", "p": ["Навчальна гра в баскетбол 5×5 — найкращий спосіб перевірити, як ти застосовуєш вивчене. Основні правила: 24 секунди на атаку, 8 секунд на перехід на половину суперника, 3 секунди в обмеженій зоні, заборона пробіжки й подвійного ведення, 5 персональних фолів — і гравець залишає майданчик.", "У навчальній грі вчитель може зупинити гру й пояснити помилку. Важливо не лише набирати очки, а й виконувати командні завдання: швидкий прорив, захист, підбір."], "ul": ["Перед грою — розминка й розподіл ролей.", "Повертайся в захист одразу після втрати м'яча.", "Передавай м'яч частіше — гра стає швидшою.", "Суддя і правила — для всіх однакові.", "Після гри — аналіз помилок і вдалих моментів."]}, {"h": "Баскетбол 3×3. Асинхронне ведення м'яча без зорового контролю", "p": ["Асинхронне ведення двох м'ячів — складна координаційна вправа: м'ячі ударяються об підлогу по черзі, як кроки під час ходьби. Вона розвиває обидві руки рівномірно і вчить відчувати м'яч без погляду.", "Почни з ведення двох м'ячів на місці, дивлячись на них, потім — дивлячись уперед, потім — у русі. Без зорового контролю ти бачиш майданчик і партнерів, а це головне в грі."], "ul": ["Спочатку синхронне ведення (обидва м'ячі разом), потім — асинхронне.", "Ведення низьке, на рівні коліна.", "Погляд — уперед або на партнера.", "Не поспішай — ритм важливіший за швидкість.", "Тренуй «слабку» руку окремо, щоб вирівняти контроль."]}], "f": "Вправи з двома м'ячами давно використовують тренери, бо вони швидко розвивають «слабку» руку.", "pr": ["Запиши основні правила баскетболу 5×5: 24 секунди, 8 секунд, 3 секунди, 5 фолів — і поясни, навіщо кожне з них.", "Виконай удома координаційну вправу без м'яча: імітація асинхронного ведення руками в ритмі (права, ліва, права…) сидячи, 3 серії по 30 секунд, не дивлячись на руки."], "q": ["Скільки часу відводиться на атаку в баскетболі 5×5?", "Що означає правило трьох секунд?", "Чим асинхронне ведення відрізняється від синхронного?", "Чому важливо вести м'яч, не дивлячись на нього?"]}, {"n": "44", "t": "Позиційні атаки та швидкий прорив з передачами й веденням; «перекладання» м'яча під опором", "g": "Учень знатиме, як поєднувати передачі й ведення в позиційних атаках і прориві, та техніку «перекладання» м'яча при опорі захисника.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Перехід з атаки в захист", "швидка перебудова дій команди після втрати м'яча."], ["«Перекладання» м'яча", "переведення м'яча з однієї руки в іншу під час ведення, щоб змінити напрям і обійти захисника."], ["Переведення за спиною", "перекладання м'яча з руки в руку позаду тулуба під час ведення."], ["Переведення між ногами", "перекладання м'яча з руки в руку через простір між ногами."]], "th": [{"h": "Баскетбол. Позиційні атаки й швидкий прорив із передачами та веденням", "p": ["Ведення і передачі — два головні способи просування м'яча. У прориві передача швидша, тому м'яч передають уперед, а ведення використовують, коли попереду немає вільного партнера. У позиційній атаці ведення допомагає зайти в зону кидка чи «затягнути» захисника, а передача — знайти вільного гравця.", "Хороша команда вміє вибирати: коли вести, а коли передавати. Ведення без мети уповільнює атаку, а передачі без руху партнерів — не дають результату."], "ul": ["Перша передача після підбору — найважливіша для прориву.", "У позиційній атаці — кожна дія має мету.", "Ведення до кільця «притягує» захисників — після цього шукай вільного партнера.", "Не веди м'яч у кут — там легко затиснути.", "Завершення атаки — кидком із найкращої позиції."]}, {"h": "Баскетбол 3×3. «Перекладання» м'яча при опорі захисника", "p": ["«Перекладання» м'яча — це переведення з руки в руку для зміни напрямку. Перед собою (кросовер) — найшвидше, але найризикованіше. За спиною — безпечніше, бо тіло закриває м'яч. Між ногами — дуже надійно, але потребує координації.", "Перекладання виконується різко, низько і в момент, коли захисник переніс вагу в один бік. Після нього — прискорення в новому напрямку."], "ul": ["Перекладай тоді, коли захисник близько і ти хочеш змінити напрям.", "М'яч під час переведення — нижче коліна.", "Після переведення — плече вперед, щоб захистити м'яч.", "Тренуй усі три способи, щоб бути непередбачуваним.", "Не перекладай без потреби — це може призвести до втрати."]}], "f": "Переведення м'яча між ногами і за спиною колись вважали трюками, а сьогодні це базові елементи техніки.", "pr": ["Опиши письмово три способи «перекладання» м'яча (перед собою, між ногами, за спиною), їхні переваги та ризики.", "Намалюй схему атаки, у якій поєднуються ведення і дві передачі, що завершується кидком."], "q": ["Коли в атаці краще передати м'яч, а коли — вести?", "Які способи «перекладання» м'яча ти знаєш?", "Чому переведення за спиною безпечніше, ніж перед собою?", "Що робить гравець одразу після «перекладання»?"]}, {"n": "45", "t": "Проєкт «Простіші варіанти швидкого прориву»; значення фізичних вправ для здоров'я", "g": "Учень вмітиме працювати в проєктній групі над темою швидкого прориву та усвідомлюватиме значення фізичних вправ для здоров'я.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Проєктна діяльність", "самостійна робота групи над темою з визначеною метою, планом і результатом."], ["Гіподинамія", "недостатня рухова активність, що негативно впливає на здоров'я."], ["Рухова активність", "будь-які рухи тіла, що потребують витрат енергії: ходьба, ігри, спорт, домашні справи."], ["Здоровий спосіб життя", "поведінка, яка зберігає і зміцнює здоров'я: рух, харчування, сон, відмова від шкідливих звичок."]], "th": [{"h": "Баскетбол. Проєкт «Організація швидкого прориву — простіші варіанти атак»", "p": ["Клас ділиться на групи. Кожна група досліджує один варіант прориву (одиночний, 2 проти 1, 3 проти 2), готує схему, пояснює правила виконання і демонструє його на майданчику. Наприкінці — презентація й обговорення.", "Проєктна робота вчить розподіляти обов'язки, слухати інших, аргументувати й представляти результати. Це навички, корисні не лише в спорті."], "ul": ["Визначте ролі в групі: лідер, автор схеми, доповідач, демонстратори.", "Схема має бути зрозумілою: гравці, рух, передачі.", "Поясніть типові помилки та як їх уникнути.", "Покажіть варіант на практиці (на уроці).", "Оцініть роботу інших груп доброзичливо й конструктивно."]}, {"h": "Баскетбол 3×3. Усвідомлення значення фізичних вправ для здоров'я", "p": ["Регулярні фізичні вправи зміцнюють серце, легені, м'язи, кістки, покращують сон і настрій, допомагають краще навчатися. Брак руху (гіподинамія) — одна з головних проблем сучасних підлітків, які багато часу сидять за комп'ютером і телефоном.", "Всесвітня організація охорони здоров'я рекомендує дітям і підліткам щонайменше 60 хвилин помірної чи інтенсивної активності щодня. Баскетбол, прогулянки, велосипед, танці — усе це враховується. Діагностувальна робота ГР2 перевіряє, як ти розумієш вплив вправ і застосовуєш вивчену техніку."], "ul": ["Рух щодня — краще, ніж раз на тиждень «до знемоги».", "Обирай активність, яка подобається, — так легше бути регулярним.", "Роби перерви від екрана кожні 30–40 хвилин.", "Поєднуй рух зі здоровим сном і харчуванням.", "Гра з друзями — і рух, і спілкування."]}], "f": "ВООЗ рекомендує підліткам щодня мінімум 60 хвилин фізичної активності помірної або високої інтенсивності.", "pr": ["Підготуй свою частину групового проєкту: схему одного варіанту швидкого прориву з поясненнями.", "Протягом 3 днів записуй, скільки хвилин на день ти рухаєшся, і порівняй із рекомендацією ВООЗ — зроби висновок."], "q": ["Які етапи має проєктна робота в групі?", "Які варіанти швидкого прориву досліджували групи?", "Чим небезпечна гіподинамія?", "Скільки хвилин рухової активності на день рекомендує ВООЗ підліткам?"]}, {"n": "46", "t": "Вправи для довгої передачі, естафети з веденням; кидок після подвійного кроку", "g": "Учень вмітиме самостійно складати вправи для вивчення довгої передачі й естафети з веденням та знатиме техніку кидка після подвійного кроку.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Пошукове завдання", "завдання, у якому учень самостійно шукає і пропонує рішення, наприклад складає вправу."], ["Підвідна вправа", "спрощена вправа, яка готує до виконання складнішого технічного прийому."], ["Подвійний крок", "два кроки з м'ячем у руках після ведення чи ловіння з наступним кидком або передачею."], ["Кидок з-під кільця", "кидок однією рукою з близької відстані, найчастіше з відскоком від щита."]], "th": [{"h": "Баскетбол. Пошукові завдання: вправи для довгої передачі; естафети з веденням", "p": ["Сьогодні ти — тренер. Склади послідовність вправ для вивчення довгої передачі: від простого (передача в парах на 5 м) до складного (передача на випередження партнерові, який біжить). Підвідні вправи: передача у стіну, передачі на збільшення відстані, передача в ціль.", "Естафети з веденням можуть включати ведення по прямій, обведення фішок, ведення «слабкою» рукою, ведення зі зміною рук. Продумай правила: як передаватиметься естафета, які штрафи за помилки."], "ul": ["Кожна вправа має мету — яку частину техніки вона тренує.", "Ускладнюй поступово: відстань, швидкість, опір.", "Подбай про безпеку: відстань між учасниками, вільний простір.", "Естафета має бути цікавою і зрозумілою для всіх.", "Перевір вправу: чи можна її виконати за відведений час?"]}, {"h": "Баскетбол 3×3. Кидок м'яча в кошик після подвійного кроку", "p": ["Подвійний крок (правша): після ведення м'яч береться в руки на кроці правою ногою, далі — крок лівою з відштовхуванням угору, права рука виносить м'яч до кільця. Перший крок — довгий, другий — короткий і стрибковий. Кидок виконують з відскоком від щита, у верхній кут прямокутника на щиті.", "Для лівої сторони — дзеркально: лівою рукою, з поштовхом правою ногою. Вміння виконувати подвійний крок з обох сторін робить тебе непередбачуваним для захисника."], "ul": ["М'яч береться в руки — перший крок, другий крок — поштовх.", "Третій крок з м'ячем — пробіжка.", "Права рука — поштовх лівою, і навпаки.", "Мах коліном угору допомагає вистрибнути вище.", "Покладай м'яч у кошик м'яко, кистю, а не кидай із силою."]}], "f": "Ритм подвійного кроку часто пояснюють як «раз — два — кидок», і саме так його вчать на перших тренуваннях.", "pr": ["Склади і запиши комплекс з 4 вправ для вивчення довгої передачі (від простої до складної) з поясненням мети кожної.", "Виконай удома імітацію подвійного кроку без м'яча й без стрибка: крок правою — крок лівою — підйом правого коліна і руки вгору — 10 разів на кожну сторону."], "q": ["Що таке підвідна вправа?", "Як побудувати послідовність вправ для вивчення довгої передачі?", "Яка нога є поштовховою при кидку правою рукою після подвійного кроку?", "Куди потрібно цілитися на щиті при кидку з-під кільця?"]}, {"n": "47", "t": "Інтегровані завдання; помилки в пересуваннях, передачах і ловінні м'яча", "g": "Учень розумітиме, як поєднувати фізичну й техніко-тактичну підготовку, та знатиме типові помилки в пересуваннях, передачах і ловінні м'яча.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Інтегроване завдання", "вправа, що одночасно розвиває фізичні якості й техніко-тактичні вміння."], ["Техніко-тактична підготовка", "навчання прийомів гри та вміння застосовувати їх у різних ігрових ситуаціях."], ["Втрата м'яча", "ситуація, коли команда-нападник втрачає володіння м'ячем через помилку."], ["Пробіжка", "порушення, коли гравець з м'ячем у руках робить більше дозволеної кількості кроків."]], "th": [{"h": "Баскетбол. Інтегровані завдання: СФП і техніко-тактична підготовка", "p": ["В інтегрованих завданнях фізична підготовка не відокремлена від гри. Наприклад: ривок із веденням і кидок після подвійного кроку (швидкість + техніка), серія передач у русі на час (витривалість + точність), захисні пересування з перехопленням (спритність + тактика).", "Такі вправи наближені до реальної гри, коли тобі доводиться виконувати техніку в стані втоми і під тиском. Саме тому вони найефективніші для підготовки до змагань."], "ul": ["Кожна вправа має і фізичну, і технічну мету.", "Якість техніки не повинна знижуватися через втому.", "Включай елемент ухвалення рішення (куди передати, коли кинути).", "Чергуй інтенсивні вправи з відновленням.", "Аналізуй, де виникають помилки — на початку чи в кінці вправи."]}, {"h": "Баскетбол 3×3. Основні помилки в пересуваннях, передачах і ловінні м'яча", "p": ["Пересування: випрямлені ноги (повільна реакція), схрещування ніг у захисті, підстрибування замість ковзання. Передачі: передача «наосліп», надто сильна чи слабка передача, передача за спину партнерові, передача повз захисника, який стоїть на лінії. Ловіння: чекання м'яча на місці, напружені пальці, ловіння одними долонями.", "Більшість втрат м'яча в баскетболі 3×3 — через неточні передачі й погане ловіння. Тому виправлення цих помилок дає швидкий результат."], "ul": ["Тримай ноги зігнутими — так швидше реагуєш.", "У захисті — приставні кроки без схрещування.", "Перед передачею подивися на партнера і захисника.", "Передавай м'яч у груди або туди, куди партнер біжить.", "Ловлячи, виходь назустріч і розслабляй пальці."]}], "f": "Тренери часто кажуть, що командна гра починається з точної передачі й упевненого ловіння.", "pr": ["Склади таблицю «Помилка — наслідок — як виправити» щонайменше для 5 помилок у пересуваннях, передачах чи ловінні м'яча.", "Придумай одне інтегроване завдання для баскетболу (фізична якість + технічний прийом) і запиши, як його виконувати."], "q": ["Що таке інтегроване завдання?", "Які помилки найчастіше трапляються під час передач?", "Чому в захисті не можна схрещувати ноги?", "Чому інтегровані завдання ефективні для підготовки до змагань?"]}, {"n": "48", "t": "Підсумок І семестру: баскетбол і баскетбол 3×3 — ігри, квести, змагання та узагальнення", "g": "Учень узагальнить знання з баскетболу та баскетболу 3×3, а також підсумує вивчене за І семестр.", "k": "Модулі: Баскетбол · Баскетбол 3×3", "terms": [["Квест", "гра з послідовністю завдань, які команда виконує, щоб досягти фінальної мети."], ["Флешмоб", "заздалегідь спланована масова акція, у якій учасники одночасно виконують однакові дії."], ["Спортивний фестиваль", "захід, що поєднує змагання, ігри й показові виступи для популяризації спорту."], ["Узагальнення знань", "повторення й систематизація вивченого для цілісного розуміння теми."]], "th": [{"h": "Баскетбол. Ігри, розваги та квести з елементами баскетболу; узагальнення модуля", "p": ["Квест з елементами баскетболу — це, наприклад, станції: точність передач, кидки з різних точок, ведення між фішками, питання з правил гри. Команда, що правильно пройде всі станції, перемагає. Такі ігри поєднують техніку, знання й командну роботу.", "У модулі «Баскетбол» ми вивчили: правила безпеки й профілактику травм, позиційний напад і швидкий прорив, довгу передачу, підбір, прийоми оволодіння м'ячем, фінти, комбінації (заслін, «передай і йди»), розвиток спеціальних фізичних якостей. Діагностувальна робота ГР3 перевіряє, як ти застосовуєш усе це в грі."], "ul": ["Повтори правила 5×5: 24 с, 8 с, 3 с, 5 фолів.", "Повтори технічні прийоми: ведення, передачі, кидки, підбір.", "Повтори тактику: позиційний напад, прорив, захист.", "Пам'ятай про самоконтроль і безпеку.", "Оціни свій прогрес: що вдається найкраще, над чим працювати."]}, {"h": "Баскетбол 3×3. Конкурси, змагання, фестивалі; узагальнення знань за І семестр", "p": ["Баскетбол 3×3 — ідеальний формат для шкільних турнірів, фестивалів і флешмобів: потрібно мало гравців і одне кільце. Ти можеш стати учасником, суддею чи організатором — і кожна роль цінна. Проєктна діяльність у групах допомагає спланувати такий захід.", "За І семестр ми опанували легку атлетику (біг, стрибки, метання, естафети, рухові якості), футбол (техніка, тактика, суддівство, фейр-плей), баскетбол і баскетбол 3×3 (правила, техніка, тактика, самоконтроль). Найважливіше — не лише вміння, а й звичка регулярно рухатися."], "ul": ["Правила 3×3: 12 с на атаку, до 21 очка або 10 хв, 1 і 2 очки.", "Після підбору в захисті — вивести м'яч за дугу.", "Командні фоли: з 7-го — штрафні кидки.", "Участь у змаганнях — досвід, нові друзі та мотивація.", "Постав мету на ІІ семестр і запиши її."]}], "f": "Шкільні турніри 3×3 легко організувати навіть на одному майданчику, тому цей формат популярний на спортивних фестивалях.", "pr": ["Придумай квест з елементами баскетболу з 5 станцій (технічні завдання й питання з правил) і запиши його план.", "Напиши короткий підсумок семестру: 3 найважливіші знання з кожного модуля (легка атлетика, футбол, баскетбол, баскетбол 3×3) і одну мету на ІІ семестр."], "q": ["Які основні правила відрізняють баскетбол 3×3 від баскетболу 5×5?", "Які тактичні дії в нападі ти вивчив у модулі «Баскетбол»?", "Що спільного між футболом і баскетболом у командних діях?", "Чого ти навчився за І семестр і що хочеш покращити?"]}]}, {"name": "ІІІ період. Волейбол, пляжний волейбол", "lessons": [{"n": "49", "t": "Волейбол і пляжний волейбол: знайомство з модулями, історія, верхня й нижня подачі", "g": "Дізнатися історію волейболу й пляжного волейболу, правила безпеки на заняттях і будову верхньої та нижньої подач.", "k": "Модулі: Волейбол · Пляжний волейбол", "terms": [["Волейбол", "командна спортивна гра, у якій дві команди перекидають м'яч через сітку, намагаючись приземлити його на половині суперника."], ["Пляжний волейбол", "різновид волейболу, у який грають на піску дві команди по два гравці."], ["Подача", "удар, яким гравець вводить м'яч у гру з-за лицьової лінії."], ["Нижня пряма подача", "подача, під час якої м'яч б'ють знизу, рука рухається від стегна вперед-угору."], ["Верхня пряма подача", "подача, під час якої м'яч підкидають над головою і б'ють вище голови прямою рукою."]], "th": [{"h": "Волейбол. Історія розвитку та безпека на заняттях", "p": ["Волейбол придумав у 1895 році в США викладач Вільям Морган як спокійнішу гру для залу, ніж баскетбол. Згодом гра поширилася світом, з'явилися міжнародна федерація, чемпіонати світу та Олімпійські турніри. Сьогодні це одна з найпопулярніших командних ігор, бо для неї потрібні лише м'яч, сітка й рівний майданчик.", "Цієї чверті ми вивчатимемо класичний і пляжний волейбол. Перш ніж починати будь-які вправи, запам'ятай правила безпеки: вони однакові для залу і для вулиці."], "ul": ["Займайся у спортивному взутті та зручному одязі, зніми прикраси й годинник.", "Перед грою обов'язково роби розминку: суглоби кистей, плечей, колін і гомілковостопів.", "Не виходь на майданчик, доки його не перевірив учитель, і прибирай зайві м'ячі з-під ніг.", "Не повисай на сітці й не пролазь під нею під час гри.", "Про біль, запаморочення чи травму одразу повідом учителя.", "Розвивай основні фізичні якості — швидкість, спритність, силу, витривалість і гнучкість, бо саме вони потрібні волейболісту."]}, {"h": "Пляжний волейбол. Особливості гри та подачі м'яча", "p": ["Пляжний волейбол виник як відпочинкова гра на узбережжі, а з 1996 року він входить до програми Олімпійських ігор. У ньому грають двоє на двоє на піщаному майданчику, тому кожен гравець має вміти все: подавати, приймати, пасувати й атакувати.", "Подача — перший удар у кожному розіграші. Новачкам легше дається нижня пряма подача, а верхня пряма подача сильніша й точніша, коли її добре освоєно."], "ul": ["Нижня подача: стань лицем до сітки, ліва нога попереду (для правші), м'яч тримай на долоні лівої руки на рівні пояса.", "Зроби замах правою рукою назад, потім удар основою долоні або кулаком під м'яч, переносячи вагу тіла на п
