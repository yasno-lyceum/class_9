<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зарубіжна література · 9 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
const BOOK_NAME = "Ніколенко О. М., Мацевко-Бекерська Л. В., Рудніцька Н. П. Зарубіжна література, 8 клас (2025)";
const META = [{"section": "Вступ. Літературні жанри та стилі", "title": "Жанри художньої літератури", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Доба просвітництва: розум, природа, освіта", "title": "Історичні умови, провідні ідеї та напрями Просвітництва", "codes": "", "ktp": "", "hw": "Розкрийте мрії просвітителів і просвітительок.\nЧи здійснилися вони? (письмово, декілька речень)", "pages": ""}, {"section": "Доба просвітництва: розум, природа, освіта", "title": "Йоганн-Вольфганг Ґете", "codes": "", "ktp": "", "hw": "За допомогою інтернету відшукайте 3-4 афоризми Гете та інших мислителів про природу і кохання. Прокоментуйте письмово (по декілька речень).", "pages": ""}, {"section": "Доба просвітництва: розум, природа, освіта", "title": "Джонатан Свіфт", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Доба просвітництва: розум, природа, освіта", "title": "Діагностувальна робота № 1 з теми “Вступ. Літературні жанри та стилі. Доба просвітництва: розум, природа, освіта”", "codes": "", "ktp": "", "hw": "Запитання для розгорнутих відповідей:\n1. Як у поезії «Травнева пісня» взаємопов'язані образи природи та почуття кохання? Обґрунтуйте, чому цей твір вважають яскравим зразком любовної лірики епохи Просвітництва та німецького романтичного пориву.Охарактеризуйте настрій та внутрішній світ ліричного героя вірша.\n2. У чому полягає просвітницький пафос та гуманістичний зміст оди «До радості»? Чому, на вашу думку, саме цей твір Ф. Шиллера (покладений на музику Л. ван Бетховена) став Гімном Європейського Союзу? Які загальнолюдські ідеї роблять його актуальним у XXI столітті?\n3. Які суспільні вади, політичні інтриги та звичаї тогочасної Англії викриває Дж. Свіфт за допомогою сатири в образі Ліліпутії? Наведіть конкретні приклади з тексту.", "pages": ""}, {"section": "Літературний міст у сьогодення", "title": "Крістіне Нестлінґер «Маргаритко, моя квітко»", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Літературний міст у сьогодення {info:`<p><b>Просвітництво</b> — ідейний рух і культурна доба XVIII ст. у Європі. Просвітителі вірили, що <b>розум</b>, <b>освіта</b> й <b>знання</b> зроблять людину й суспільство кращими, а природа є мірилом гармонії.</p>
<p><b>Провідні ідеї:</b> культ розуму; віра в природну рівність людей; критика станових привілеїв, деспотизму, забобонів; ідеал «природної людини»; виховання громадянина; свобода, рівність, братерство (гасла Великої французької революції 1789 р.).</p>
<p><b>Представники:</b> Вольтер, Ж.-Ж. Руссо, Д. Дідро, Д. Дефо, Дж. Свіфт, Г. Е. Лессінг, Ф. Шиллер, Й.-В. Ґете; в Україні — Г. Сковорода.</p>
<p><b>Художні напрями й стилі XVIII ст.:</b></p>
<ul><li><b>просвітницький класицизм</b> — продовжує традиції класицизму XVII ст., утверджує діяльного героя, що служить людству;</li><li><b>просвітницький реалізм</b> — конкретне, достовірне зображення сучасності, демократизм образів;</li><li><b>сентименталізм</b> — утвердження почуттів на противагу абсолютизації розуму;</li><li><b>рококо</b> — стиль насолоди, вишуканого естетизму;</li><li><b>преромантизм</b> — в останній третині XVIII ст. (рух «Буря і натиск» у Німеччині).</li></ul>
<p>У розділі також — <b>Ф. Шиллер</b>, ода <b>«До радості»</b> (1785): гімн людському братерству й радості; на її текст Бетховен написав фінал Дев'ятої симфонії, що став гімном Європейського Союзу.</p>`,

{info:`<p><b>Йоганн-Вольфганг Ґете</b> (1749–1832) — великий німецький поет, драматург, мислитель і вчений. Народився у Франкфурті-на-Майні, вивчав право в Лейпцигу і Страсбурзі. Був міністром при дворі герцога у Веймарі, займався ботанікою, оптикою, мінералогією. Головний твір — трагедія <b>«Фауст»</b>, над якою працював майже 60 років.</p>
<p>У молодості Ґете був учасником руху <b>«Буря і натиск»</b>. У Страсбурзі він закохався в Фрідеріку Бріон, доньку пастора із села Зезенгейм, і присвятив їй цикл <b>«Зезенгеймські пісні»</b>.</p>
<p><b>«Травнева пісня»</b> (1770–1771) — один із найвідоміших віршів циклу. Ліричний герой захоплюється весняною природою: сяє сонце, цвітуть луки й гілки, співають птахи. І все це зливається з радістю кохання: «Як я люблю тебе!»</p>
<p><b>Особливості:</b> <b>паралелізм</b> природи й почуття; щирість, безпосередність; легкий пісенний ритм, вигуки, повтори; єдність людини й природи. Вірш вважають зразком любовної лірики й передвісником романтичного пориву.</p>`,

{info:`<p><b>Джонатан Свіфт</b> (1667–1745) — англо-ірландський письменник-сатирик, священник, настоятель собору Святого Патрика в Дубліні. Захищав права ірландського народу від англійського гніту. Кохав Естер Джонсон (Стеллу).</p>
<p><b>«Мандри Лемюеля Гуллівера»</b> (1726) — сатиричний роман у чотирьох частинах про корабельного лікаря Гуллівера:</p>
<ol><li><b>Ліліпутія</b> — країна крихітних людей (до 15 см);</li><li><b>Бробдінгнег</b> — країна велетнів;</li><li><b>Лапута</b> — летючий острів учених, відірваних від життя;</li><li>країна <b>гуїгнгнмів</b> — розумних шляхетних коней, і <b>єгу</b> — огидних людиноподібних істот.</li></ol>
<p><b>Сатира в Ліліпутії:</b> посади отримують ті, хто краще танцює на канаті; дві партії ворогують через висоту підборів (натяк на торі й вігів); між Ліліпутією і Блефуску триває війна через те, з якого кінця розбивати яйце — тупого чи гострого (натяк на релігійні чвари). Свіфт висміює дріб'язковість політиків, марнославство, придворні інтриги, безглузді війни.</p>
<p><b>Ідея:</b> людство має позбутися пихи, жорстокості й безглуздя і жити за законами розуму.</p>`,

{info:`<p><b>Крістіне Нестлінґер</b> (1936–2018) — австрійська письменниця, одна з найвідоміших дитячих і підліткових авторок світу. Народилася у Відні; її дитинство припало на Другу світову війну. Написала понад 150 книжок. Лауреатка <b>премії Андерсена</b> (1984) і першої <b>премії пам'яті Астрід Ліндгрен</b> (2003).</p>
<p>Її книжки — про сучасних підлітків і родини, з гумором і щирістю; вона не повчає, а розуміє дітей і показує складність дорослого світу.</p>
<p><b>«Маргаритко, моя квітко»</b> — повість про чотирнадцятирічну дівчинку, у родині якої все змінюється: мама вирішує жити по-новому — навчатися, працювати, мати власне життя, а не лише обслуговувати родину. Батько проти, родина розколюється. Маргаритці доводиться робити дорослий вибір, розбиратися в собі, у стосунках батьків і в першому коханні.</p>`,

{info:`<p><b>Сюжет і герої</b> повісті «Маргаритко, моя квітко».</p>
<p>Маргаритка — звичайна дівчинка-підліток: соромиться своєї зовнішності, хоче бути «як усі», не завжди впевнена в собі. Її родина здається звичайною: батько працює й вважає себе головою сім'ї, мама веде господарство, є молодші брат і сестра.</p>
<p>Та одного дня мама оголошує, що хоче вчитися й працювати, мати друзів і власний час. Батько сприймає це як зраду. Мама переїжджає, і діти опиняються між батьками. Кожен прагне перетягнути їх на свій бік.</p>
<p><b>Маргаритка дорослішає:</b> вона вчиться розуміти обох батьків, не судити поспіхом, бути відповідальною за молодших; водночас переживає перше кохання, відкриває власні бажання й цінності.</p>
<p><b>Гумор і психологізм:</b> Нестлінґер з іронією показує слабкості дорослих і з теплом — переживання підлітка.</p>`,

{info:`<p><b>Взаємини дорослих і дітей.</b> Повість показує, що дорослі теж помиляються, мають слабкості, страхи й власні мрії. Діти часто стають свідками й заручниками конфліктів батьків. Але саме підлітки нерідко виявляються мудрішими: Маргаритка намагається зрозуміти, а не засудити.</p>
<p><b>Сімейні цінності:</b> повага до кожного члена родини, право кожного на власне життя й розвиток (зокрема мами), рівність у сім'ї, відповідальність, уміння домовлятися. Родина — не тоді, коли всі «на своїх місцях», а коли всі одне одного чують.</p>
<p><b>Перше кохання</b> — світле, але й непросте почуття: Маргаритка вчиться відрізняти справжнє від уявного, не втрачати себе заради іншого, поважати свої почуття.</p>

{info:`<p><b>Романтизм</b> — напрям у літературі й мистецтві кінця XVIII — першої половини XIX ст.</p>
<p><b>Чинники розвитку:</b> розчарування в ідеалах Просвітництва після Великої французької революції та наполеонівських воєн; національно-визвольні рухи; інтерес до історії, фольклору, національної самобутності; філософія Канта, Шеллінга.</p>
<p><b>Основні ознаки романтизму:</b></p>
<ul><li><b>двосвіття</b> — протиставлення буденної дійсності й ідеального світу мрії;</li><li><b>романтичний герой</b> — винятковий, самотній, бунтівний, у конфлікті із суспільством;</li><li>культ почуттів, уяви, свободи;</li><li>інтерес до історії, фольклору, екзотики, таємничого й фантастичного;</li><li>романтичний пейзаж (бурі, гори, море), контрасти;</li><li>ліричність, символізм.</li></ul>
<p><b>Романтизм у різних країнах:</b> Німеччина (Гофман, Гейне), Англія (Байрон, Шеллі, Кітс, В. Скотт), Франція (В. Гюго), Польща (А. Міцкевич), Україна (Т. Шевченко, «Руська трійця», Є. Гребінка). <b>Україна в житті й творчості романтиків:</b> Байрон «Мазепа», Гюго «Мазепа», Міцкевич.</p>
<p><b>У мистецтві:</b> музика (Шопен, Шуберт, Шуман), живопис (Делакруа, Фрідріх), театр.</p>`,

{info:`<p><b>Генріх Гейне</b> (1797–1856) — німецький поет-романтик, публіцист. Народився в Дюссельдорфі в єврейській родині. Через переслідування за вільнодумство з 1831 р. жив у Парижі. Останні роки, тяжко хворий, був прикутий до ліжка («матрацна могила»), але продовжував писати.</p>
<p><b>«Книга пісень»</b> (1827) — збірка, що принесла Гейне світову славу. <b>Композиція:</b> цикли «Юнацькі страждання», «Ліричне інтермецо», «Повернення на батьківщину», «Північне море». Збірку об'єднує <b>образ ліричного героя</b> — закоханого юнака, якого зраджує кохана; його почуття проходять шлях від надії до розчарування й іронії.</p>
<p><b>«Не знаю, що стало зо мною…»</b> («Лорелея», переклад Лесі Українки) — вірш за мотивами німецької легенди про чарівну діву на скелі над Рейном, яка своїм співом і красою зводить у вир човнярів. <b>Фольклорні елементи:</b> легенда, пісенність, повтори.</p>
<p><b>«Коли розлучаються двоє…»</b> — вірш про біль розлуки: закохані потискають руки, плачуть і зітхають; а ліричний герой не плакав і не зітхав — сльози й зітхання прийшли потім. <b>Поетична мова:</b> простота, пісенність, лаконізм, іронія, контраст.</p>
<p>Гейне перекладали Леся Українка, Іван Франко, Максим Рильський.</p>`,

{info:`<p><b>Джордж-Ноел-Гордон Байрон</b> (1788–1824) — англійський поет-романтик. Лорд за походженням, мав фізичну ваду (кульгавість), гордий і бунтівний. Через конфлікт із суспільством 1816 р. назавжди залишив Англію, жив у Швейцарії, Італії. Підтримував борців за свободу: помер у Греції (Міссолонгі), куди поїхав допомагати грекам у боротьбі проти турків.</p>
<p><b>Вплив на романтизм:</b> творчість Байрона дала назву цілому явищу — <b>байронізм</b>; його <b>байронічний герой</b> — гордий, самотній, розчарований бунтар, що протистоїть суспільству (поема «Паломництво Чайльд-Гарольда»).</p>
<p><b>«Хотів би жити знов у горах…»</b> (1807) — <b>протиставлення мрії і дійсності</b>: ліричний герой утомився від світського життя, лицемірства, і мріє повернутися в дитинство, у вільні гори Шотландії, на лоно дикої природи.</p>
<p><b>«Мій дух як ніч…»</b> (з «Єврейських мелодій», 1815) — <b>біблійний мотив</b>: як цар Саул просив Давида заграти на арфі, щоб розвіяти тугу, так ліричний герой просить заграти, щоб розрадити зранене серце. Глибока туга, жага розради, сила мистецтва.</p>`,

{info:`<p><b>Поема «Мазепа»</b> (1819) — твір Байрона на <b>українську тему</b>. Основою став епізод із «Історії Карла XII» Вольтера.</p>
<p><b>Сюжет:</b> після поразки під Полтавою (1709) шведський король Карл XII і гетьман Іван Мазепа відступають. Під час нічного привалу Мазепа розповідає королю історію своєї молодості.</p>
<p>Юним пажем при дворі польського короля Яна-Казимира він покохав молоду графиню Терезу, дружину старого графа. Граф дізнався про це й жорстоко помстився: наказав прив'язати Мазепу голим до дикого коня й відпустити в степ. Кінь мчав через ліси, ріки, степи — аж в Україну, де впав мертвим. Знесиленого юнака врятували українські козаки. Згодом він став гетьманом.</p>
<p><b>Специфіка образу гетьмана:</b></p>
<ul><li><b>монолог</b> героя — розповідь від першої особи;</li><li><b>романтичний пейзаж</b> (бурхливі ріки, темні ліси, безмежний степ, вовки) як засіб увиразнення його стану;</li><li><b>динаміка образу</b>: від безпорадного юнака до мудрого, мужнього гетьмана;</li><li>Мазепа — романтичний, байронічний герой: сильний, волелюбний, незламний.</li></ul>`,

{info:`<p><b>Відображення духовного життя особистості та суспільства</b> в поемі «Мазепа»:</p>
<ul><li>особистість проти суспільства: кохання юнака протиставлене жорстоким законам аристократичного світу;</li><li>сила людського духу: Мазепа витримує нелюдські страждання й не зламується;</li><li>тема долі: те, що мало стати загибеллю, стало початком нового життя;</li><li>свобода: дикий кінь — символ нестримної стихії, волі.</li></ul>
<p><b>Історія і культура Європи:</b> у поемі постають Польща XVII ст., Україна, Швеція, Полтавська битва — події, що визначили долю Європи.</p>
<p><b>Байронічний герой</b> (поглиблення): Мазепа — винятковий, гордий, самотній, здатний на бунт і подвиг, сповнений внутрішньої сили.</p>

{info:`<p><b>Віктор Гюго</b> (1802–1885) — французький письменник, лідер французького романтизму. Через протест проти диктатури Наполеона III майже 20 років жив у вигнанні. Його похорон став загальнонаціональною подією. Твори: «Собор Паризької Богоматері», «Знедолені», «Людина, яка сміється».</p>
<p><b>«Собор Паризької Богоматері»</b> (1831) — історичний роман. <b>Історична основа:</b> Париж 1482 р.; Гюго переосмислює минуле, щоб захистити середньовічні пам'ятки від руйнування й показати долю людини в жорстокому світі.</p>
<p><b>Сюжет:</b> на свято блазнів обирають «папою блазнів» потворного дзвонаря <b>Квазімодо</b>. Прекрасна циганка-танцівниця <b>Есмеральда</b> з кізкою Джалі закохується в капітана <b>Феба</b> — красеня й пустодзвона. Архідиякон <b>Клод Фролло</b>, охоплений пристрастю до Есмеральди, ранить Феба, а звинувачують дівчину. Квазімодо рятує її, сховавши в соборі («Притулок!»). Та зрештою Есмеральду страчують. Квазімодо скидає Фролло з вежі. Через роки в склепі знаходять два скелети, що обіймаються.</p>
<p><b>Символіка:</b> <b>собор</b> — центр світу роману, символ віри, мистецтва й долі; слово <b>«Ананке»</b> («Неминучість», «Рок») на стіні. <b>Контраст</b>: потворний зовні, але прекрасний душею Квазімодо — і вродливий, але порожній Феб.</p>`,

{info:`<p><b>Реалізм</b> (від лат. <i>realis</i> — речовий, дійсний) — літературний напрям, що сформувався в 30-х рр. XIX ст. і прагнув <b>правдиво, об'єктивно</b> відтворити дійсність.</p>
<p><b>Історія формування:</b> розвиток природничих наук (Дарвін), позитивізм, індустріалізація, зростання міст, соціальні контрасти. Письменники прагнули досліджувати суспільство, як учені досліджують природу.</p>
<p><b>Характерні ознаки реалізму:</b></p>
<ul><li><b>типові характери в типових обставинах</b> — герої, у яких втілено риси цілого соціального прошарку;</li><li>соціальна обумовленість поведінки героя: середовище формує людину;</li><li>історизм — зв'язок подій з епохою;</li><li>психологізм — глибоке розкриття внутрішнього світу;</li><li>детальні описи (портрет, інтер'єр, побут) — <b>реалістичні деталі</b>;</li><li>критичний погляд на суспільство.</li></ul>

{info:`<p><b>Оноре де Бальзак</b> (1799–1850) — французький письменник-реаліст. Працював у нотаріальній конторі, пробував видавничу справу, мав великі борги; писав ночами по 15–16 годин, випиваючи безліч кави.</p>
<p><b>«Людська комедія»</b> — грандіозний цикл (близько 90 творів), у якому Бальзак прагнув створити «історію звичаїв» французького суспільства. <b>Художня структура:</b> «Етюди про звичаї» (сцени приватного, провінційного, паризького, політичного, військового, сільського життя), «Філософські етюди», «Аналітичні етюди». Персонажі переходять із твору в твір. <b>Тематика:</b> влада грошей, кар'єра, родина, мораль.</p>
<p><b>«Гобсек»</b> (1830) входить до «Сцен приватного життя». <b>Сюжетно-композиційні особливості:</b> <b>розповідь у розповіді</b> — адвокат <b>Дервіль</b> у салоні віконтеси де Гранльє розповідає історію лихваря Гобсека, щоб застерегти її доньку Камілу, закохану в молодого графа Ернеста де Ресто.</p>
<p><b>Бальзак і Україна:</b> письменник листувався з польською аристократкою Евеліною Ганською, кілька разів бував у її маєтку у <b>Верхівні</b> (нині Житомирщина), 1850 р. обвінчався з нею в <b>Бердичеві</b>.</p>`,

{info:`<p><b>Гобсек</b> — паризький лихвар, якому під 80 років. Його ім'я означає «живоглот».</p>
<p><b>Портрет:</b> обличчя, «як у місяця», тьмяне; очі маленькі, жовті, як у тхора; тонкі губи; він ходить тихо, говорить спокійно, ніколи не підвищує голосу — «людина-вексель», «людина-автомат».</p>
<p><b>Інтер'єр:</b> холодна вогка кімната, усе старе й охайне, нічого зайвого — житло скнари.</p>
<p><b>Багатогранність образу:</b></p>
<ul><li><b>скнара й лихвар</b> — вірить лише в силу золота: «Золото — ось духовна сутність усього нинішнього суспільства»;</li><li><b>філософ</b> — розумний, проникливий, бачить пороки людей і презирливо судить світ;</li><li><b>«суддя»</b> — він карає марнотратство й порок (графиню де Ресто, Максима де Трая);</li><li>водночас — <b>чесний</b> по-своєму: допомагає Дервілю, бо той порядний;</li><li><b>жертва пристрасті</b>: наприкінці життя його комори заповнені гниючими продуктами й речами, які він не захотів продати дешевше. Він помирає серед мертвих скарбів.</li></ul>
<p><b>Засоби створення образу:</b> портрет, інтер'єр, мова (афоризми), оцінки інших персонажів, вчинки, художня деталь.</p>`,

{info:`<p><b>Романтичні мрії Джейн Ейр і сувора реальність.</b></p>
<p>Джейн — некрасива, бідна, без родини й зв'язків. Але вона має багатий внутрішній світ: любить читати, малювати, мріє про широкий світ, свободу, справжнє життя й кохання. З вікна Торнфілда вона дивиться на обрій і думає, що жінки відчувають так само, як і чоловіки, і потребують простору для своїх здібностей.</p>
<p><b>Реальність:</b> бідність, приниження, обмежені можливості для жінки (лише вчителька чи гувернантка), соціальна нерівність, станові забобони.</p>
<p><b>Риси Джейн:</b> гідність, незалежність, чесність, сила волі, принциповість, здатність любити. Вона ніколи не поступається своїми переконаннями: «Я не птаха, і жодні сіті не втримають мене: я вільна людина з незалежною волею».</p>
<p><b>Поєднання романтизму й реалізму:</b> романтичні мотиви (таємниця Торнфілда, пожежа, голос Рочестера на відстані) — і реалістичне зображення суспільства, побуту, характерів.</p>`,

{info:`<p><b>Тема кохання</b>: Джейн Ейр — Едвард Рочестер.</p>
<p><b>Едвард Рочестер</b> — власник Торнфілда: похмурий, різкий, некрасивий, але розумний, пристрасний, із таємницею в минулому. Джейн і Рочестер — рівні духовно: їх поєднують щирість, розум, незалежність.</p>
<p><b>Розвиток стосунків:</b></p>
<ol><li>Перша зустріч: кінь Рочестера посковзнувся на льоду, Джейн допомагає йому.</li><li>Розмови, у яких зароджується почуття; Джейн рятує Рочестера від пожежі в його спальні.</li><li>Рочестер освідчується; але під час вінчання з'ясовується, що він одружений: його божевільна дружина <b>Берта Мейсон</b> живе замкнена на горищі Торнфілда.</li><li>Джейн, хоч кохає, <b>іде</b> — бо не може поступитися власною гідністю й принципами.</li><li>Вона знаходить родичів (Сент-Джон Ріверс і його сестри), отримує спадок. Сент-Джон кличе її заміж без кохання — вона відмовляє.</li><li>Почувши уночі голос Рочестера, Джейн повертається: Торнфілд згорів, Берта загинула, Рочестер, рятуючи її, осліп і втратив руку. Джейн виходить за нього заміж: «Читачу, я вийшла за нього заміж».</li></ol>
<p><b>Ідея:</b> справжнє кохання — це союз рівних, заснований на повазі, вірності й самопожертві.</p>`,

{info:`<p><b>Гарпер Лі</b> (1926–2016) — американська письменниця з Алабами. Роман <b>«Убити пересмішника»</b> (1960) отримав <b>Пулітцерівську премію</b> (1961) і став класикою американської літератури.</p>
<p><b>Сюжет:</b> 1930-ті роки, містечко Мейкомб в Алабамі. Оповідачка — дівчинка <b>Джин-Луїза (Скаут) Фінч</b>; вона живе з братом <b>Джемом</b> і батьком, адвокатом <b>Аттікусом Фінчем</b>. Діти граються з другом Ділом і цікавляться таємничим сусідом <b>Страшилою (Бу) Редлі</b>, якого ніхто не бачить.</p>
<p>Аттікус захищає в суді темношкірого <b>Тома Робінсона</b>, несправедливо звинуваченого в нападі на білу дівчину Мейєллу Юелл. Аттікус доводить невинність Тома, але присяжні все одно визнають його винним. Том гине під час спроби втечі.</p>
<p><b>Проблема входження молоді в дорослий світ</b>: діти зіштовхуються з жорстокістю, расизмом, лицемірством і несправедливістю дорослих. <b>Тема соціальної нерівності:</b> білі й темношкірі, бідні («біле сміття» Юелли) і заможні, расова сегрегація.</p>`,

{info:`<p><b>Утвердження ідеї толерантності й поваги до людей</b> різних рас, націй і народів.</p>
<p><b>Аттікус Фінч</b> — моральний центр роману: чесний, мужній, мудрий батько. Він захищає Тома, хоча знає, що програє й що містечко засуджує його. Його кредо: «Щоб зрозуміти людину, треба стати на її місце, залізти в її шкіру й походити в ній».</p>
<p><b>Символ пересмішника:</b> Аттікус каже дітям: стріляйте в соєк, скільки хочете, але <b>вбити пересмішника — гріх</b>, бо ці пташки нікому не шкодять, лише співають для людей. Пересмішники — це беззахисні, невинні люди: <b>Том Робінсон</b> і <b>Бу Редлі</b>.</p>
<p><b>Фінал:</b> Боб Юелл нападає на Джема й Скаут; їх рятує Бу Редлі, і Юелл гине. Шериф вирішує не втягувати сором'язливого Бу в суд — це було б так само, як «убити пересмішника». Скаут, проводжаючи Бу додому, нарешті розуміє батькові слова — стоїть на ганку Редлі й бачить світ його очима.</p>
<p><b>Моральні цінності:</b> справедливість, мужність, людяність, повага до кожного, протистояння упередженням.</p>`,

{info:`<p><b>Генрік Ібсен</b> (1828–1906) — норвезький драматург, «батько нової драми». Працював помічником аптекаря, театральним режисером; 27 років жив за кордоном. <b>Новаторство:</b> соціально-психологічна драма, дискусія як основа дії, складні характери, підтекст, символіка, відкритий фінал.</p>
<p><b>«Ляльковий дім»</b> (1879) — <b>соціально-психологічна драма</b>. <b>Сюжет:</b> Нора Гельмер — «щаслива» дружина адвоката Торвальда Гельмера, який називає її «жайворонком», «білочкою», лялькою. Колись, щоб урятувати хворого чоловіка, Нора таємно взяла позику в лихваря <b>Крогстада</b>, підробивши підпис батька. Тепер Крогстад, якого Гельмер звільняє з банку, шантажує її. Нора сподівається на «диво»: що чоловік захистить її й візьме провину на себе.</p>
<p>Але, прочитавши листа Крогстада, Гельмер кричить на Нору, звинувачує, думає лише про свою репутацію. Коли загроза минає, він «прощає» її. Нора прозріває: вісім років вона була лише лялькою — спочатку в батька, потім у чоловіка. Вона залишає дім, щоб знайти себе.</p>
<p><b>Конфлікт:</b> зовнішній (шантаж) і <b>внутрішній</b> (прозріння Нори, конфлікт ілюзії й реальності, особистості й суспільних норм).</p>`,

{info:`<p><b>Композиція п'єси</b> «Ляльковий дім»: три дії, події відбуваються за кілька різдвяних днів у квартирі Гельмерів. Наростання напруги: прихід фру Лінне й Крогстада → лист у поштовій скриньці → тарантела → викриття → розмова-дискусія Нори з Гельмером → відхід Нори.</p>
<p><b>Образна система:</b> <b>Нора</b> — від «ляльки» до особистості; <b>Торвальд Гельмер</b> — самовпевнений, дбає про репутацію, сприймає дружину як власність; <b>Крогстад</b> — не лиходій, а скривджена людина, що зрештою відмовляється від шантажу; <b>фру Крістіна Лінне</b> — подруга Нори, самостійна жінка; <b>доктор Ранк</b> — смертельно хворий друг сім'ї.</p>
<p><b>Підтекст:</b> за легкими розмовами — тривога, страх, прихована правда. <b>Символіка:</b> «ляльковий дім» — фальшивий світ ілюзій; <b>ялинка</b> (прикрашена, а потім обскубана) — стан Нори; <b>тарантела</b> — відчайдушний танець перед катастрофою; <b>поштова скринька</b> — неминучість правди; <b>стукіт дверей</b> у фіналі.</p>
<p><b>Відкритість фіналу:</b> невідомо, куди піде Нора і чи станеться «найбільше диво» — справжній шлюб рівних. <b>Ібсенізм</b> — драматургія ідей, дискусії й підтексту, що вплинула на світовий театр.</p>`,

{info:`<p><b>Рей-Дуглас Бредбері</b> (1920–2012) — американський письменник-фантаст. У дитинстві багато читав у бібліотеках; університетської освіти не здобув, казав, що його університет — бібліотека. Автор «Марсіанських хронік», «Кульбабового вина».</p>
<p><b>«451° за Фаренгейтом»</b> (1953) — роман-<b>антиутопія</b>. 451° за Фаренгейтом (≈233°C) — температура, за якої займається й горить папір.</p>
<p><b>Тривога за майбутнє суспільства:</b> у світі майбутнього книжки заборонені й підлягають спаленню. <b>Пожежники</b> не гасять, а розпалюють вогонь — палять книжки разом із будинками. Люди проводять час перед телевізійними «стінами», слухають «мушлі»-навушники, мчать машинами, не думають і не розмовляють. Держава воює, а люди цього не помічають.</p>
<p>Головний герой — пожежник <b>Гай Монтеґ</b>. Зустріч із юною мрійницею <b>Кларисою Маклеллан</b>, яка ставить питання «Чи ви щасливі?», змушує його замислитися. Він таємно ховає книжки й починає читати.</p>`,

{info:`<p><b>Тема занепаду культури</b> — провідна в романі.</p>
<p>Капітан пожежників <b>Бітті</b> пояснює Монтеґу, як це сталося: спершу люди самі перестали читати — книжки скорочували до коротких переказів, кіно й телебачення заступили літературу, усе стало простішим і швидшим. Меншини ображалися на книжки — і їх «чистили». А згодом держава заборонила книжки, щоб люди не думали й «були щасливими».</p>
<p><b>Провідні мотиви:</b></p>
<ul><li><b>вогонь</b> — руйнування (спалення книжок) і водночас тепло, світло, відродження;</li><li><b>книжка</b> — пам'ять людства, свобода думки;</li><li><b>«телевізійні стіни»</b> й «родичі» з екрана — духовна порожнеча, підміна живого спілкування;</li><li><b>механічний пес</b> — бездушна машина влади, що полює на інакодумців;</li><li><b>дзеркало</b> — пізнання себе;</li><li><b>Фенікс</b> — птах, що відроджується з попелу (символ на шоломі пожежників і образ відродження людства).</li></ul>
<p><b>Міледред</b>, дружина Монтеґа, — жертва цього світу: живе екраном, ковтає снодійне, не пам'ятає, як вони познайомилися.</p>`,

{info:`<p><b>Натовп і влада.</b> Влада в романі тримає людей у покорі не лише страхом, а й «розвагами»: швидкість, реклама, екрани, відсутність часу на роздуми. Натовп байдужий: він радо дивиться трансляцію полювання на «злочинця». Інакодумців (як стару жінку, що згоріла разом зі своїми книжками) знищують.</p>
<p><b>Важке прозріння особистості:</b></p>
<ol><li>Монтеґ відчуває порожнечу після розмов із Кларисою.</li><li>Стара жінка воліє згоріти з книжками, ніж віддати їх, — це вражає Монтеґа.</li><li>Він читає вірші Міледред і її подругам — і бачить їхню реакцію: сльози, страх, злість.</li><li>Колишній професор <b>Фабер</b> стає його наставником.</li><li>Бітті змушує Монтеґа спалити власний дім; Монтеґ убиває Бітті й тікає від механічного пса.</li><li>За містом він знаходить «людей-книжок» на чолі з <b>Ґрейнджером</b>: кожен вивчив напам'ять книжку, щоб зберегти її.</li><li>Місто знищує війна. Люди-книжки йдуть відроджувати цивілізацію.</li></ol>
<p><b>Ідея:</b> без книжок, пам'яті й свободи думки людство приречене; культура — духовний опір насильству.</p>`,

{info:`<p><b>Маркус Френк Зузак</b> (нар. 1975) — австралійський письменник, син німецьких і австрійських емігрантів. Історії про війну, які розповідали йому батьки (зокрема про те, як у Мюнхені людям, яких гнали до Дахау, хтось давав хліб), лягли в основу роману.</p>

plot:["Після корабельної аварії Гуллівер опиняється в Ліліпутії, де живуть крихітні люди; він допомагає їм у війні з Блефуску, але через інтриги мусить тікати.","У Бробдінгнезі, країні велетнів, уже сам Гуллівер — крихітний; король велетнів, вислухавши його розповідь про Англію, жахається людськими вадами.","На летючому острові Лапута Гуллівер бачить учених, які займаються безглуздими проєктами, відірваними від життя.","У країні гуїгнгнмів — розумних шляхетних коней — він бачить огидних єгу, схожих на людей, і соромиться людського роду.","Гуллівер повертається додому, але не може звикнути до людей і більше спілкується з кіньми."],
heroes:[["Лемюель Гуллівер","корабельний лікар, мандрівник, спостерігач"],["Ліліпути","крихітні люди, втілення дріб'язковості"],["Велетні Бробдінгнегу","мудрі й доброзичливі"],["Гуїгнгнми","розумні шляхетні коні"],["Єгу","огидні людиноподібні істоти"]]},

margaret:{name:"«Маргаритко, моя квітко»", author:"Крістіне Нестлінґер", genre:"Повість",
about:"Повість про чотирнадцятирічну дівчинку, у родині якої все змінюється: мама вирішує жити власним життям, батько проти, а героїні доводиться дорослішати, розуміючи обох і власні почуття.",
plot:["Маргаритка — звичайна дівчинка-підліток, невпевнена в собі; її родина здається звичною й стабільною.","Мама оголошує, що хоче вчитися, працювати й мати власне життя.","Батько сприймає це як зраду; мама переїжджає, діти опиняються між батьками.","Маргаритка вчиться розуміти обох, піклуватися про молодших і переживає перше кохання.","Героїня дорослішає, відкриває власні бажання й цінності."],
heroes:[["Маргаритка","чотирнадцятирічна героїня, що дорослішає"],["Мама","жінка, яка прагне самостійності"],["Тато","консервативний, звик бути головою сім'ї"],["Молодші брат і сестра","діти, що потребують підтримки"]]},

heine:{name:"«Книга пісень»: «Не знаю, що стало зо мною…», «Коли розлучаються двоє…»", author:"Генріх Гейне, 1827", genre:"Лірика", poem:true,
about:"Вірші зі збірки «Книга пісень» про чарівну Лорелею з німецької легенди та про біль розлуки закоханих.",
plotTitle:"Зміст віршів",
plot:["«Не знаю, що стало зо мною…»: ліричного героя не полишає давня легенда.","На скелі над Рейном сидить прекрасна діва Лорелея, розчісує золоті коси й співає.","Човняр, зачарований піснею, не бачить скель — і хвилі поглинають його.","«Коли розлучаються двоє…»: закохані плачуть і зітхають, а ліричний герой не плакав — сльози й біль прийшли потім."],
heroes:[["Ліричний герой","закоханий романтик, сповнений туги й іронії"],["Лорелея","чарівна діва з легенди"]]},

byronLyr:{name:"«Хотів би жити знов у горах…», «Мій дух як ніч…»", author:"Джордж Байрон, 1807, 1815", genre:"Лірика", poem:true,
about:"Вірші про протиставлення мрії й дійсності та про глибоку тугу, яку може розвіяти лише мистецтво.",
plotTitle:"Зміст віршів",
plot:["«Хотів би жити знов у горах…»: ліричний герой утомився від світського життя й лицемірства.","Він мріє повернутися в дитинство, у вільні гори Шотландії, до дикої природи.","«Мій дух як ніч…»: душа героя сповнена темряви й туги.","Він просить заграти на арфі (як Давид для Саула), щоб пісня розвіяла біль і дала сльозам вийти."],
heroes:[["Ліричний герой","байронічний герой: самотній, розчарований, волелюбний"]]},

mazeppa:{name:"«Мазепа»", author:"Джордж Байрон, 1819", genre:"Поема",
about:"Поема на українську тему: після Полтавської битви гетьман Мазепа розповідає шведському королю про жорстоку пригоду молодості, що визначила його долю.",
plot:["Після поразки під Полтавою (1709) Карл XII і Мазепа відступають; на нічному привалі король просить гетьмана розповісти про себе.","Юний Мазепа, паж польського короля Яна-Казимира, покохав графиню Терезу, дружину старого графа.","Граф дізнався про це й наказав прив'язати юнака голим до дикого коня й відпустити в степ.","Кінь мчав через ліси й ріки, крізь холод і вовків, аж до України, де впав мертвим.","Напівмертвого Мазепу врятували козаки; згодом він став гетьманом. Закінчивши розповідь, Мазепа бачить, що король заснув."],
heroes:[["Мазепа","волелюбний, незламний, мудрий гетьман"],["Карл XII","шведський король, слухач розповіді"],["Тереза","кохана юного Мазепи"],["Граф","жорстокий чоловік Терези"]]},

notre:{name:"«Собор Паризької Богоматері»", author:"Віктор Гюго, 1831", genre:"Історичний роман",
about:"Роман про Париж 1482 року, у якому навколо прекрасної циганки Есмеральди сплітаються долі потворного дзвонаря, пристрасного архідиякона й пустого красеня-капітана. Твір про кохання, жорстокість і невідворотність долі.",
plot:["На свято блазнів «папою блазнів» обирають горбатого дзвонаря собору Квазімодо.","За наказом архідиякона Клода Фролло Квазімодо намагається викрасти Есмеральду; її рятує капітан Феб, у якого вона закохується.","Фролло з ревнощів ранить Феба; звинувачують Есмеральду, її засуджують до страти.","Квазімодо рятує дівчину, сховавши в соборі з криком «Притулок!», і піклується про неї.","Есмеральду все ж страчують. Квазімодо скидає Фролло з вежі собору; через роки знаходять два скелети, що обіймаються."],
heroes:[["Есмеральда","прекрасна, добра циганка-танцівниця"],["Квазімодо","потворний зовні, прекрасний душею дзвонар"],["Клод Фролло","архідиякон, охоплений згубною пристрастю"],["Феб де Шатопер","капітан, красень із порожньою душею"],["П'єр Гренгуар","поет, чоловік Есмеральди «за звичаєм»"]]},

gobseck:{name:"«Гобсек»", author:"Оноре де Бальзак, 1830", genre:"Повість",
about:"Повість про паризького лихваря, який вірить лише у владу золота. Через долі його клієнтів Бальзак показує, як гроші руйнують людей і родини.",
plot:["У салоні віконтеси де Гранльє адвокат Дервіль розповідає історію лихваря Гобсека, щоб застерегти доньку віконтеси Камілу, закохану в графа Ернеста де Ресто.","Дервіль, бідний студент, жив поруч із Гобсеком і пізнав його філософію: «Золото — духовна сутність суспільства».","Графиня Анастасі де Ресто закладає в Гобсека родинні діаманти, щоб сплатити борги свого коханця Максима де Трая.","Граф де Ресто, щоб урятувати статки для сина, фіктивно передає майно Гобсеку; після смерті Гобсека Ернест отримує спадок і може одружитися з Камілою.","Гобсек помирає серед комор, заповнених гниючими продуктами й речами, які він не захотів продати дешевше."],
heroes:[["Гобсек","лихвар-скнара й філософ, «людина-вексель»"],["Дервіль","чесний адвокат, оповідач"],["Графиня Анастасі де Ресто","марнотратна світська жінка"],["Граф де Ресто","чоловік графині, рятує спадок для сина"],["Максим де Трай","світський авантюрист"]]},

jane:{name:"«Джейн Ейр»", author:"Шарлотта Бронте, 1847", genre:"Роман",
about:"Роман про сироту, яка, долаючи приниження, бідність і несправедливість, зберігає гідність і незалежність і знаходить справжнє кохання — союз рівних.",
plot:["Сирота Джейн росте в будинку тітки місіс Рід, яка її не любить, і потрапляє до суворої благодійної школи Ловуд, де помирає її подруга Гелен Бернс.","Ставши вчителькою, Джейн іде гувернанткою до маєтку Торнфілд і закохується в його власника — Едварда Рочестера.","Під час вінчання виявляється, що Рочестер одружений: його божевільна дружина Берта живе на горищі. Джейн іде з Торнфілда.","Вона знаходить родичів — Сент-Джона Ріверса та його сестер — і отримує спадок; відмовляється від шлюбу без кохання.","Почувши голос Рочестера, Джейн повертається: Торнфілд згорів, Рочестер осліп і втратив руку. Джейн виходить за нього заміж."],
heroes:[["Джейн Ейр","сирота, гувернантка; гідна, незалежна, чесна"],["Едвард Рочестер","власник Торнфілда, пристрасний, із таємницею"],["Місіс Рід","жорстока тітка"],["Гелен Бернс","подруга Джейн у Ловуді"],["Сент-Джон Ріверс","кузен Джейн, суворий священник"],["Берта Мейсон","божевільна дружина Рочестера"]]},

mockingbird:{name:"«Убити пересмішника»", author:"Гарпер Лі, 1960", genre:"Роман",
about:"Роман про дорослішання дівчинки в маленькому містечку американського Півдня, де її батько-адвокат захищає несправедливо звинуваченого темношкірого. Твір про расизм, справедливість, мужність і людяність.",
plot:["Скаут Фінч, її брат Джем і друг Діл граються в Мейкомбі (Алабама) і цікавляться таємничим сусідом Бу Редлі, який ховає для них «подарунки» в дуплі дерева.","Їхній батько Аттікус погоджується захищати темношкірого Тома Робінсона, звинуваченого в нападі на білу дівчину Мейєллу Юелл.","На суді Аттікус доводить невинність Тома, але присяжні визнають його винним; Том гине під час спроби втечі.","Розлючений Боб Юелл нападає на дітей уночі; їх рятує Бу Редлі, а Юелл гине.","Шериф вирішує не втягувати Бу в розслідування. Скаут проводжає Бу додому й розуміє батькові слова про те, як побачити світ очима іншого."],
heroes:[["Скаут Фінч","дівчинка-оповідачка, щира й допитлива"],["Аттікус Фінч","мудрий, чесний, мужній адвокат"],["Джем","старший брат Скаут"],["Том Робінсон","несправедливо звинувачений темношкірий"],["Бу Редлі","таємничий, добрий сусід-відлюдник"],["Боб Юелл","злостивий звинувачувач"]]},

doll:{name:"«Ляльковий дім»", author:"Генрік Ібсен, 1879", genre:"Соціально-психологічна драма",
about:"Драма про жінку, яка після восьми років «щасливого» шлюбу усвідомлює, що жила як лялька, і залишає дім, щоб стати особистістю.",
plot:["Напередодні Різдва Нора Гельмер радіє, що чоловік Торвальд став директором банку.","Колись Нора таємно взяла позику, підробивши підпис батька, щоб урятувати хворого чоловіка. Лихвар Крогстад, якого Гельмер звільняє, шантажує її.","Нора відчайдушно танцює тарантелу, щоб відтягнути мить, коли чоловік прочитає лист Крогстада.","Гельмер читає лист, ображає Нору, думає лише про репутацію; коли загроза минає, «прощає» її.","Нора прозріває, що була лялькою в батька й чоловіка, і йде з дому, щоб знайти себе."],
heroes:[["Нора Гельмер","від «ляльки» до особистості"],["Торвальд Гельмер","самовпевнений чоловік, що дбає про репутацію"],["Крогстад","скривджений чиновник-шантажист"],["Фру Лінне","подруга Нори, самостійна жінка"],["Доктор Ранк","хворий друг сім'ї"]]},

f451:{name:"«451° за Фаренгейтом»", author:"Рей Бредбері, 1953", genre:"Роман-антиутопія",
about:"Антиутопія про суспільство, де книжки заборонені й палять їх пожежники. Пожежник Гай Монтеґ прозріває, стає на бік книжок і приєднується до людей, які зберігають культуру в пам'яті.",
plot:["Пожежник Гай Монтеґ палить книжки й не замислюється. Зустріч із юною Кларисою, яка питає «Чи ви щасливі?», змушує його задуматися.","Стара жінка воліє згоріти разом зі своїми книжками; Монтеґ таємно ховає книжки вдома.","Він знаходить колишнього професора Фабера, який стає його наставником.","Дружина Міледред доносить на нього; капітан Бітті змушує Монтеґа спалити власний дім. Монтеґ убиває Бітті й тікає від механічного пса.","За містом він приєднується до «людей-книжок», які завчили книжки напам'ять. Місто знищує війна, а люди-книжки йдуть відроджувати цивілізацію."],
heroes:[["Гай Монтеґ","пожежник, що прозріває"],["Клариса Маклеллан","юна мрійниця, що пробуджує Монтеґа"],["Міледред","дружина Монтеґа, жертва екранів"],["Капітан Бітті","начальник пожежників, захисник системи"],["Фабер","колишній професор, наставник"],["Ґрейнджер","ватажок «людей-книжок»"]]},

thief:{name:"«Крадійка книжок»", author:"Маркус Зузак, 2005", genre:"Роман",
about:"Історія німецької дівчинки Лізель у роки Другої світової війни, яку розповідає Смерть. Лізель краде книжки, вчиться читати, дружить із євреєм, якого переховує її прийомна родина, і виживає завдяки силі слова.",
plot:["1939 р. дорогою до прийомної родини помирає молодший брат Лізель; на його похороні вона краде першу книжку.","У містечку Молькінг її приймають Ганс і Роза Губерман; Ганс уночі вчить дівчинку читати.","Лізель вихоплює книжку з багаття під час нацистського спалення книжок, «позичає» книжки з бібліотеки дружини бургомістра.","Губермани переховують у підвалі єврея Макса Ванденбурга; він і Лізель стають друзями.","Бомба знищує Небесну вулицю; гинуть Ганс, Роза, Руді. Лізель виживає, бо в підвалі писала свою книжку. Згодом вона зустрічає вцілілого Макса."],
heroes:[["Лізель Мемінґер","«крадійка книжок», смілива й чуйна"],["Ганс Губерман","добрий прийомний батько, акордеоніст"],["Роза Губерман","прийомна мати, груба на словах, добра серцем"],["Руді Штайнер","найкращий друг Лізель"],["Макс Ванденбург","єврей, якого переховують Губермани"],["Смерть","оповідачка"]]}

let done = store.get("zl9_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS[SECTIONS.length-1]; if(s&&s.name!==l.section) s=null; if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function renderHome(){
  const total=LESSONS.length, dn=Object.keys(done).length;
  $("#app").innerHTML = `
  <div class="hero">
    <div>
      <div class="kick">Ліцей «Ясно» · 9 клас</div>
      <h1>Зарубіжна література</h1>
      <p>Уроки за календарно-тематичним плануванням: основна інформація, про що твір, сюжет і герої, тест для самоперевірки.</p>
      <div class="stats"><span><b>${SECTIONS.length}</b> розділів</span><span><b>${total}</b> тем</span><span><b>${dn}</b> пройдено</span></div>
    </div>
    <div class="hero-actions"><a class="btn" href="index.html">← Усі предмети</a><a class="btn fill" style="--c:#ef8a00" href="https://schoolappweb.blob.core.windows.net/314-book/314_0_639241059297332334.pdf" target="_blank" rel="noopener">📘 Підручник</a>${themeBtn()}</div>
  </div>
  ${SECTIONS.map((s,si)=>`
  <section class="sec" style="--c:${s.st.c}">
    <div class="sec-h"><div class="num">${si+1}</div><h2>${esc(s.name)}</h2></div>
    <div class="sec-body">
      <div class="cover"><div class="ci">${s.st.i}</div><div><div class="rz">РОЗДІЛ ${si+1}</div><div class="rn">${esc(s.name)}</div></div><div class="doodles">${[...s.st.d].join("")}</div></div>
      <div class="cards">${s.items.map(i=>{const l=LESSONS[i];return `
        <a class="tcard" href="#${i+1}">${done[i+1]?'<span class="chk">✓</span>':""}
          <div class="tn">Тема ${l.tnum}${l.diag?'<span class="badge">тренувальна</span>':""}</div>
          <div class="tt">${esc(l.title)}</div>
          <div class="tm">${meta(l)}</div>
        </a>`}).join("")}</div>
    </div>
  </section>`).join("")}`;
  document.title="Зарубіжна література · 9 клас";
}

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">Розділ ${si+1}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${si+1}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("zl9_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Зарубіжна література 9`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("zl9_theme",d.dataset.theme); }
const th=store.get("zl9_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
